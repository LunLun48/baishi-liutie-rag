<title>六帖問對</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5efe1;
  --paper:#fbf7ec;
  --ink:#2b241c;
  --ink-soft:#5c5142;
  --line:#ddd0b3;
  --accent:#a63a2f;
  --accent-soft:#c96354;
  --thread:#3d5a6c;
  --thread-soft:#6d8a9a;
  --good:#3f7a52;
  --bad:#b23b3b;
  --chip-bg:#efe6cf;
  --radius:10px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1c1814;
    --paper:#242019;
    --ink:#eee6d6;
    --ink-soft:#b9ac93;
    --line:#453b2d;
    --accent:#e0776a;
    --accent-soft:#c96354;
    --thread:#8fb3c4;
    --thread-soft:#6d8a9a;
    --good:#79c495;
    --bad:#e08787;
    --chip-bg:#332c20;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1c1814;
  --paper:#242019;
  --ink:#eee6d6;
  --ink-soft:#b9ac93;
  --line:#453b2d;
  --accent:#e0776a;
  --accent-soft:#c96354;
  --thread:#8fb3c4;
  --thread-soft:#6d8a9a;
  --good:#79c495;
  --bad:#e08787;
  --chip-bg:#332c20;
  color-scheme:dark;
}
*{box-sizing:border-box;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  padding-inline:0;
}
.serif{font-family:"Noto Serif TC","Songti TC",serif;}
.mono{font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;}

.app{
  max-width:1080px;
  margin:0 auto;
  padding:16px 16px 24px;
  display:flex;
  flex-direction:column;
  gap:14px;
  min-height:100%;
}

header.top{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:12px;
  border-bottom:2px solid var(--accent);
  padding-bottom:10px;
  flex-wrap:wrap;
}
header.top .title-block h1{
  font-size:1.5rem;
  margin:0;
  letter-spacing:.04em;
}
header.top .title-block p{
  margin:2px 0 0;
  font-size:.78rem;
  color:var(--ink-soft);
}
.gear-btn{
  border:1px solid var(--line);
  background:var(--paper);
  color:var(--ink);
  border-radius:8px;
  padding:7px 12px;
  font-size:.82rem;
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:6px;
}
.gear-btn:hover{border-color:var(--accent);}

.layout{
  display:grid;
  grid-template-columns:230px 1fr;
  gap:16px;
  align-items:start;
}
@media (max-width:760px){
  .layout{grid-template-columns:1fr;}
}

.panel{
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:12px 14px;
}

.sidebar{
  display:flex;
  flex-direction:column;
  gap:12px;
  position:sticky;
  top:calc(env(safe-area-inset-top,0px) + 8px);
}
@media (max-width:760px){ .sidebar{position:static;} }

.sidebar h2{
  font-size:.78rem;
  margin:0 0 8px;
  color:var(--ink-soft);
  letter-spacing:.08em;
  text-transform:uppercase;
}
.status-row{display:flex;justify-content:space-between;font-size:.82rem;margin:4px 0;}
.status-row .v{font-weight:600;}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;}
.dot.ok{background:var(--good);}
.dot.no{background:var(--bad);}

button.mini{
  border:1px solid var(--line);
  background:transparent;
  color:var(--ink);
  border-radius:7px;
  padding:6px 10px;
  font-size:.78rem;
  cursor:pointer;
  width:100%;
}
button.mini:hover{border-color:var(--thread);color:var(--thread);}
button.mini:disabled{opacity:.5;cursor:default;}

.toc-list{
  max-height:220px;
  overflow-y:auto;
  font-size:.8rem;
  line-height:1.7;
  border-top:1px dashed var(--line);
  margin-top:8px;
  padding-top:6px;
}
.toc-list button{
  display:block;
  width:100%;
  text-align:left;
  background:none;
  border:none;
  color:var(--ink-soft);
  cursor:pointer;
  padding:1px 0;
  font-size:.8rem;
}
.toc-list button:hover{color:var(--accent);}

.examples{display:flex;flex-wrap:wrap;gap:6px;}
.chip{
  background:var(--chip-bg);
  border:1px solid var(--line);
  border-radius:999px;
  padding:5px 11px;
  font-size:.76rem;
  cursor:pointer;
  color:var(--ink);
}
.chip:hover{border-color:var(--accent);color:var(--accent);}

.chat-col{display:flex;flex-direction:column;gap:12px;min-width:0;}

.chat-log{
  display:flex;
  flex-direction:column;
  gap:14px;
  min-height:280px;
}

.msg{max-width:100%;}
.msg.user .bubble{
  background:var(--thread);
  color:#fbf7ec;
  border-radius:12px 12px 4px 12px;
  padding:10px 14px;
  display:inline-block;
  max-width:88%;
}
.msg.user{display:flex;justify-content:flex-end;}

.msg.assistant .bubble{
  background:var(--paper);
  border:1px solid var(--line);
  border-left:3px solid var(--accent);
  border-radius:4px 12px 12px 12px;
  padding:12px 16px;
  white-space:pre-wrap;
  line-height:1.75;
}
.msg.assistant .bubble.error{border-left-color:var(--bad);color:var(--bad);}
.msg.assistant .bubble.pending{color:var(--ink-soft);font-style:italic;}

.sources{
  margin-top:8px;
  font-size:.78rem;
}
.sources summary{
  cursor:pointer;
  color:var(--thread);
  font-size:.78rem;
}
.source-item{
  border-top:1px dashed var(--line);
  padding:8px 0;
}
.source-tag{
  display:inline-block;
  font-family:ui-monospace,Menlo,Consolas,monospace;
  font-size:.72rem;
  background:var(--chip-bg);
  border-radius:5px;
  padding:2px 6px;
  margin-right:6px;
  color:var(--ink-soft);
}
.source-text{
  white-space:pre-wrap;
  margin-top:4px;
  color:var(--ink-soft);
  line-height:1.6;
}

.empty-state{
  border:1px dashed var(--line);
  border-radius:var(--radius);
  padding:20px;
  text-align:center;
  color:var(--ink-soft);
  font-size:.88rem;
}
.empty-state h3{margin:0 0 6px;color:var(--ink);font-size:1.02rem;}

.input-row{
  display:flex;
  gap:8px;
  align-items:flex-end;
  border:1px solid var(--line);
  background:var(--paper);
  border-radius:var(--radius);
  padding:8px;
}
.input-row textarea{
  flex:1;
  border:none;
  background:transparent;
  resize:none;
  font-size:.92rem;
  font-family:inherit;
  color:var(--ink);
  min-height:44px;
  max-height:140px;
  outline:none;
  padding:6px;
}
.send-btn{
  background:var(--accent);
  color:#fff;
  border:none;
  border-radius:8px;
  padding:10px 18px;
  font-size:.85rem;
  cursor:pointer;
  flex-shrink:0;
}
.send-btn:hover{background:var(--accent-soft);}
.send-btn:disabled{opacity:.5;cursor:default;}

.progress-wrap{
  height:6px;
  background:var(--line);
  border-radius:4px;
  overflow:hidden;
  margin-top:6px;
}
.progress-bar{height:100%;background:var(--accent);width:0%;transition:width .2s;}
.progress-label{font-size:.74rem;color:var(--ink-soft);margin-top:4px;}

.overlay{
  position:fixed;inset:0;
  background:rgba(0,0,0,.4);
  display:flex;align-items:center;justify-content:center;
  z-index:20;
  padding:16px;
}
.overlay[hidden]{display:none;}
.modal{
  background:var(--paper);
  border-radius:14px;
  border:1px solid var(--line);
  max-width:420px;
  width:100%;
  padding:20px;
  max-height:88vh;
  overflow-y:auto;
}
.modal h2{margin-top:0;font-size:1.05rem;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:.8rem;color:var(--ink-soft);margin-bottom:5px;}
.field input[type=password],.field input[type=text],.field select{
  width:100%;
  padding:8px 10px;
  border-radius:7px;
  border:1px solid var(--line);
  background:var(--bg);
  color:var(--ink);
  font-size:.88rem;
}
.token-row{display:flex;gap:6px;}
.token-row input{flex:1;}
.small-note{font-size:.74rem;color:var(--ink-soft);line-height:1.6;margin-top:10px;}
.modal-actions{display:flex;gap:8px;margin-top:16px;}
.modal-actions button{flex:1;padding:9px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;font-size:.85rem;}
.modal-actions button.primary{background:var(--accent);color:#fff;border:none;}
.close-x{position:absolute;top:12px;right:16px;background:none;border:none;font-size:1.1rem;cursor:pointer;color:var(--ink-soft);}
.modal{position:relative;}
.dot.mid{background:var(--thread-soft);}
.mode-banner{
  border:1px dashed var(--line);
  border-radius:8px;
  padding:8px 12px;
  font-size:.78rem;
  color:var(--ink-soft);
  background:var(--chip-bg);
  line-height:1.65;
}
.mode-banner b{color:var(--ink);}
mark{
  background:color-mix(in srgb,var(--accent) 30%,transparent);
  color:inherit;
  border-radius:2px;
  padding:0 1px;
}
.check-row{
  display:flex;
  align-items:flex-start;
  gap:7px;
  font-size:.8rem;
  color:var(--ink-soft);
  margin:0 0 10px;
  line-height:1.5;
  cursor:pointer;
}
.check-row input{margin-top:3px;flex-shrink:0;}
.passages{margin-top:8px;}
.passage{
  border:1px solid var(--line);
  border-radius:8px;
  margin-top:8px;
  background:var(--paper);
}
.passage > summary{
  cursor:pointer;
  padding:8px 10px;
  font-size:.8rem;
  color:var(--thread);
  line-height:1.5;
}
.passage .source-text{padding:0 10px 10px;margin-top:0;}
.settings-msg{font-size:.78rem;color:var(--bad);min-height:1em;margin:-4px 0 8px;}
.clear-key{margin-top:10px;}
.vol-select{
  width:100%;
  margin:0 0 8px;
  padding:6px 8px;
  font:inherit;
  font-size:.85rem;
  color:var(--ink);
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:8px;
}
.token-row select{flex:1;min-width:0;}
.adv{margin:0 0 12px;}
.adv summary{cursor:pointer;font-size:.8rem;color:var(--ink-soft);}
.small-note a{color:var(--accent);}
</style>

<div class="app">
  <header class="top">
    <div class="title-block">
      <h1 class="serif">六帖問對</h1>
      <p>《白氏六帖事類集》檢索問答</p>
    </div>
    <button class="gear-btn" id="openSettings">⚙ 設定</button>
  </header>

  <div class="layout">
    <aside class="sidebar panel">
      <p class="small-note" style="margin:0;">已收錄：前言＋卷一、卷三至卷十五（<span id="docCount"></span> 段）</p>
      <div>
        <h2>各卷總目</h2>
        <select class="vol-select" id="tocVolume" aria-label="選擇卷次"></select>
        <div class="toc-list" id="tocList"></div>
      </div>
    </aside>

    <section class="chat-col">
      <div class="panel" style="flex:1;display:flex;flex-direction:column;gap:12px;min-height:360px;">
        <div class="mode-banner" id="modeBanner"></div>
        <div class="chat-log" id="chatLog">
          <div class="empty-state" id="emptyState">
            <h3 class="serif">與《白氏六帖事類集》對話</h3>
            <p>用原文裡的字詞發問，找得比較準。</p>
            <div class="examples" id="exampleChips"></div>
          </div>
        </div>
        <div class="input-row">
          <textarea id="questionInput" placeholder="輸入問題，例如：「天圓不中規」出自何處？" rows="1"></textarea>
          <button class="send-btn" id="sendBtn">送出</button>
        </div>
      </div>
    </section>
  </div>
</div>

<div class="overlay" id="settingsOverlay" hidden>
  <div class="modal">
    <button class="close-x" id="closeSettings">✕</button>
    <h2 class="serif">設定</h2>
    <p class="small-note" style="margin:-4px 0 14px;">不填金鑰也能用（只列原文）。填入金鑰後，由模型整理成回答。</p>
    <div class="field">
      <label>回答服務</label>
      <select id="providerSelect"></select>
    </div>
    <div class="field">
      <label id="keyLabel">API Key</label>
      <div class="token-row">
        <input type="password" id="keyInput" placeholder="" autocomplete="off">
        <button class="mini" id="toggleKeyVisibility" style="width:auto;padding:8px 10px;">顯示</button>
      </div>
      <p class="small-note" id="providerNote" style="margin-top:6px;"></p>
    </div>
    <details class="adv">
      <summary>進階：選擇模型</summary>
      <div class="field" style="margin-top:10px;">
        <div class="token-row">
          <select id="modelSelect" aria-label="選擇模型"></select>
          <button class="mini" id="loadModels" style="width:auto;padding:8px 10px;white-space:nowrap;">載入清單</button>
        </div>
        <input type="text" id="modelInput" autocomplete="off" placeholder="輸入模型 ID" style="margin-top:6px;" hidden>
        <p class="small-note" id="modelMsg" style="margin-top:6px;"></p>
      </div>
    </details>
    <label class="check-row"><input type="checkbox" id="rememberKey"><span>在這個瀏覽器記住金鑰</span></label>
    <label class="check-row"><input type="checkbox" id="retrievalOnly"><span>只列原文，不呼叫模型</span></label>
    <div class="settings-msg" id="settingsMsg"></div>
    <div class="modal-actions">
      <button id="cancelSettings">取消</button>
      <button class="primary" id="saveSettings">儲存</button>
    </div>
    <button class="mini clear-key" id="clearKeyBtn">清除已儲存的金鑰</button>
    <p class="small-note">金鑰只存在你的瀏覽器。提問與檢索到的段落會直接送到你選的服務。</p>
  </div>
</div>

juan1-000","source":"正文","juan":"卷第一","menu":"天第一","sub_menu":null,"page":"十","leaf":"二ウ","text":"高明柔克　高明天也柔克寒暑不干\n陰陽下人　言天尊定下人之令\n天尊　地卑\n成象　在天成象\n觀天之道　而四時不忒\n天垂象　見吉凶聖人則之\n天行健\n資始　至哉乾元萬物資賴\n上浮為天\n下降　天氣下降\n高遠　窮高極遠\n貞觀　天地之道貞觀者也\n無私不息　者天\n清明　象天\n天何言哉　時\n駈行不可階而升\n天秉陽　垂日星\n無私覆　高也　也火也天之道\n昭昭　天昭昭之多及其無窮日月星辰繫焉覆焉注云昭昭小明也本生小而成大\n覆盆　　之轉轂之狀設位石\n補　女媧氏鍊五色石補天\n惡盈　天道\n易知　立天之道\n恒象　天事恒象以會天位\n憂朋　杞國人憂天崩身無所寄\n輕清　九天\n九重　圓則九重孰營度之\n八柱　八柱何當東南何虧\n西北　日月星就焉\n浩浩　元氣蒼蒼蒼蒼正色\n為大　唯天為大\n得一以清　天得一以清恐裂無\n倬彼　昭回天步\n昭回天步　　　　焉知\n題穹　紛紜六幕\n九天　棡八州中央\n天火　老子曰域中四大\n斷鰲足　斷鰲足立四極\n大圓洪覆　無為而成\n不言　不言而信\n張弓\n窺牖　不窺牖見天道\n訢合　訢合覆燾\n得一以清　以清\n剛德　天為剛德覆物無私臨下有赫垂象千時\n蒼蒼　老子曰天之蒼蒼其正色邪其遠而無所至極也\n上玄　彼蒼者\n大清持滿　言天道盈而不溢天以持滿\n無聲　其綱無聲無臭\n氣如橐籥　物窮其\n必蹲蹲輖章\n尸居而龍見　淵默而雷聲　莊子\n開霧　人望然若開雲霧觀青天　每見輒見出\n圓不中規　文子曰至大者無形故天圓不中規\n無端　無端故不可覩\n父天　王者父天母地\n左旋　天道左旋日月\n西傾　見上\n生三　道生一生二生三三才也\n得一　見上\n既階升而莫致　覩側管而窺蜀吳\n鶴鳴九皋聲聞于天　漢昭帝渾　張重云\n使張溫來聘問秦密　曰天有頭有耳有足\n天秉天氣而立戴水而　　銅渾必察天也\n蓋天宣夜渾天　晉書曰古言天有三家一曰蓋天二曰宣夜三曰渾天\n周髀即蓋天說也唯渾天近而得上書言宣夜之學絕無師法周髀術數多所遺失\n今候臺銅儀即其法也立八尺圓體具天地之形正黃道以行日月以步五緯精微深妙百代不易\n形正黃道以行日月以步　周髀術轉如儀行磨上天\n辟如儀行磨上天之居如倚空也\n宣夜學（宣夜學云眾星自然浮生虛空之中相駁所加其星集皆如合\n即蓋天蓋天說天圓如張蓋地方如其棊局天左轉即如推磨石而左行而日月右行而隨天左轉\n云天了無質日月眾星自然浮生虛空之中）\n王仲任云蓋天之說以駁渾儀桓君山謂仲任之徒曰維非雖輕孫氏　圖\n吾侍奏報最北背西廡下頭之日光出去是應渾天也\n天降非拯　文虹竟天播景文虹晝竟見天\n設位　易曰天地設位而易行其中\n奏難　天大冬也\n天降異　見漢書\n天方授楚　左傳曰公弗許　子於宋宋人告急於晉\n晉侯欲救之伯宗曰不可天方授楚未可與爭雖晉之彊能違天乎\n天方授林楚　左傳曰\n五何上有　車蓋\n天上帝其佐曰五帝　五經通義曰天神　曰天皇大帝\n銅渾儀　郭璞生述征記云\n渾儀　安宮南有\n蓋天之威　詩之怒　多謝悠悠子　瞻天如戴盆\n戴盆　九辨云仰觀　天死如車蓋　始自漢書\n圓天為蓋　大言"},{"id":"juan1-001","source":"正文","juan":"卷第一","menu":"地第二　地理　土附","sub_menu":null,"page":"十一","leaf":"三オ","text":"地卑　天尊為成形成形在地上\n上隮　地氣\n深厚　不測\n厚德載物　變盈流謙　遍\n萬物曰柔與剛　立地之道　沉潛剛克柔\n地秉陰　窮於山川\n地載萬物　取財於地是以親地\n多　今夫地一撮土之多及其廣厚子載華嶽而不重\n河海而不洩　萬物載焉注云地之博厚\n不動者地無疆　德合無疆廣大象博厚\n無私載　地之道博也厚也\n一撮土之　華嶽而不動振土\n持載　無不持載坤元\n五土司　大\n從堂土地之數舜五土之物　圖知九州之地\n得一以寧　將恐發\n貞（漢書地方輿宋玉大言　道中貞　方輿　詩曰圓天\n牝馬　地類\n銅儀　以察天地　張衡作銅儀　敬樹\n生植　之功\n直方　德不知厚\n元命苞　天左\n故地右動\n地以篤事　左氏曰地以篤事生\n不至不可疆\n地久長　天長地久域中四大重濁\n方而無涯　文子曰地方而無涯故莫能闚其門\n土生三　道生一\n大方　無隅　方不中矩　至大者無形故地方不中矩\n地道坤儀節事　言不\n東傾　百川歸焉右動\n地傾東南\n為蓋方大舟　大舟中開牖而坐舟行不覺　河圖曰地恒動不止譬人在\n道藏經云\n樹謂植尊木\n日終日俛地\n不知之厚\n得一　見上\n廣袤　莫大地媼　漢書\n地絡維　振天　政之本　管子曰地　政之本\n養材　年\n八寸合蓋隆起形似酒榼飾以篆文山龜鳥獸之形\n外有八龍首銜銅丸下有蟾蜍張口承之\n地機　則震龍機發吐丸而蟾蜍受之\n其牙機巧制皆隱在尊中覆蓋周密無際如有\n地維絕　列子云共工與顓頊爭帝　演　不周山天柱折地維絕\n地動儀　後漢張衡字平子造候風地動儀以精銅鑄成圓徑八尺\n覆蓋周密　尊中有都柱旁行八道施關發機\n一龍發機而七首不動尋其方面乃知震之所在驗之以事合契若神自書典所記未之有也\n不周載　　其　　無德藪曰甘\n萬物祖　白虎通曰地者萬物之祖元氣所生\n九州八柱　淮南子曰天有九部八紀\n四極\n五土　五土上中下有三壤\n三壤　禹貢曰咸則三壤\n四海　爾雅曰九夷八狄七戎六蠻謂之四海\n辨五土　周官辨五地之物生一曰山林其動物宜毛物其植物宜皁物二曰川澤其動物宜鱗物其植物宜膏物三曰丘陵其動物宜羽物其植物宜覈物四曰墳衍其動物宜介物其植物宜莢物五曰原隰其動物宜臝物其植物宜叢物\n湛濁　神農書曰　　湛濁為地故地者濁陰 見上大地祇\n積陰　黃帝素問曰積陰為地故地者濁陰 上地凡居地有大利 楊泉物理論曰\n惣名　蔡邕月令章句曰地惣名也 五陵原隰阪險曰地\n易也　春秋元命包曰地者易也言養物懷任交易變化含吐應節故其字力於一者為地也\n廣（河圖括地象曰地廣東西二萬八千南北二萬六千曰里 山海經曰帝令堅[豎]亥步自東極至于西極五億\n十萬八千二十四頃　　不下）\n元　萬物始生有長養誰識之主\n右轉　春秋元命包曰地所以右轉者氣濁精少所合陰而起遲故轉右也\n仁　墨子曰禽子問天孰與地仁墨子曰翟以地為仁太山之上則封禪焉墀壞[壤]之限則生松柏下生眾苗莞蒲水生黿鼉魚鼈民衣食焉冢焉埒焉死焉地路不青德焉翟以地為仁\n經緯　家語曰子夏問曰高[商]聞山書曰地東西為緯南北為經山為積德川為積刑高為生下為死丘陵為牡谿谷為牝"},{"id":"juan1-002","source":"正文","juan":"卷第一","menu":"地第二　地理　土附","sub_menu":"地理門　附地","page":"十三","leaf":"四オ","text":"周禮大司徒掌建邦之土地之圖周知九州之地域廣輪之數\n辨山林川澤丘陵墳衍原隰之名物制幾[畿]疆而藩封之以土會\n之法辨五土之物 史 秦孝公作咸陽築冀闕徒[徙]都之秦轉天下\n之櫃[樞]也形相錯如繡便利　漢書曰秦形勝之國地勢便利沛公從杜南入蝕中太史公曰\n自太山屬之琅邪北被之海膏壤二千里其人閬達多匿其天性〇　李熊說公孫述曰蜀氏[地]野千里累實所生無敵而飽[餒]\n張儀給[紿]楚曰秦商於之地六百里沃野千里　土髮千里"},{"id":"juan1-003","source":"正文","juan":"卷第一","menu":"地第二　地理　土附","sub_menu":"土門　附地","page":"十四","leaf":"四ウ","text":"一撮　今夫地一撮土之多\n五色　禹貢徐州厥貢土五色\n稼穡作甘　土爰稼穡 土敝則草木不長\n配五行\n而攸序　　災府而先修\n一稱　樸巢釋之曰堁土塊音蒲侯反\n長陵土厚　木深居土北薄水淺其\n土塊　重耳乞食於野人野人與之塊\n與塊　于犯受而戴之注有土之象\n韓詩見\n師土　房間\n顏之人捧土以塞孟津\n壺龍書曰　稱阿十仞\n土被朱紫"},{"id":"juan1-004","source":"正文","juan":"卷第一","menu":"日第三　食附","sub_menu":null,"page":"十四","leaf":"四ウ","text":"慶瑞\n日麗乎天　易\n日中則昃　易 貞明 日昃之離\n日居月諸胡迭而微　詩 日月麗乎天\n烏　日中有陽烏三足\n陽德之母　出自東方照臨下土 大明 曜靈 東君 並日 別名\n實也　說文云日實也 太陽之精\n大明生東　無私照 在天成象瞻仰 夫日月人之所瞻仰 方中方\n暘泉　日出暘谷登于桑榆 景曇 悽心 麗天 見出地 子文炎炎精德寸\n遲遲　春日未融 明而未融 無二日並明 天子庶日月並 代明 日月之明明照四海 扶桑虞泉\n淮南子曰日出暘谷登于扶桑入于虞泉　桑榆景曇\n暑歊分陰　陶佩曰聖人踏寸陰至於凡俗皆分陰 晨明 揃扶桑入虞淵 曩曩謂晨明 閏日近遠 晉明帝少時\n如日之升　我日斯邁 日云暮 天致日 遇相侵冬夏 致日春秋 致日 正日 正日書\n乃日　淮南子云堯時十日並出羿射九烏死\n測景　不縮不盈 若木出 日所 長繩[縄]繫日 金烏懸象著明 揮戈 魯陽與韓戰酣日暮援戈揮日反三舍 跂烏土圭 莫大乎 日月 日月\n淪濛谷　朝隮 嵎夷 曬夷 魯陽揮戈 后羿射日 昭昭揭行 如揭日月 赤羽 白駒 過隙日過 若 白駒 陳之景 雙麗 文 還夕 冬\n日之陽　夏日之陰 萬物歸之 王者以日為兒火德明 暉陽精 正氣 冠\n三光之首　具瞻皆仰 人皆仰之 王宮在北陸 出東 棄杖 羲父 靃盈 憂暴\n儒士之腹（郝隆曬書 野人之芹 負日之暄 汲汲之　 黃寶黃餓 餓　也 種宗 政齊七 天\n儒士之腹[重]）\n子曰官　諸侯日御\n厎[底]日（風平 居鄉 官大如車蓋中如盤 列子曰一兒曰日初出大如車蓋及其\n見曰初出蒼蒼涼涼及其中如探湯此不謂近者熱而遠者涼乎孔子不能決笑曰孰謂汝多知乎）\n東方未晞　下土 師尹 惟日黃\n道烏久照　日月得天而彙[能]久照 〇慶瑞門\n乃遏死於道棄　莫載而成鄩藪 慶瑞 賦曰 重光 五色 並光 合璧 日月若 政太平 則曰至德\n重輪　祥瑞 雨珥 幾壽中 平候日再中 漢文帝時新垣平候日再中 三舍 魯陽揮戈 日辰三舍 有王字\n之萌如遠壍　與日月 重光 曩曩 古今注曰漢朝帝作太子　　 開日\n日中南 玄德動天　祥曰 重光 　　四章 咸讚文子一日日重光 　炎炎食 　門\n鼓用牲于社　春秋六月日食鼓用牲于社非禮也 天子不舉 不舉者盛饌 伐鼓于社續 凡日食天子不舉者盛饌 伐鼓于社\n唯諸侯用幣于社　請救社尊卑不敢書 月用幣 非禮也 伐鼓於朝責也自　以昭事神訓民事君子 天子\n不舉諸侯用幣所以　神尊卑異制所以訓民 退[責]也自 昭事神訓民事君子平子不許\n太史曰日過分而未至　過春分未夏至謂四月正陽月 三辰有災 日月相侵文犯星禍故三辰皆為災 於是\n昭公十七年六月日食祝史請用幣　李[季]子平子不許\n百官降物　用辭 君不舉避移時 日食伐鼓 樂奏鼓 祝用幣於社 史\n用辭　用辭 自責 故夏書曰辰不集于房 不安其舍則食 鼓奏鼓 靈曰天馳\n人　　此　朔\n庶人走此月朔之謂也　四月 今　之　 正月之朔愚未作 正陽之月也 非日月之眚\n不鼓　顧星賢所童故特鼓 日夜等故至相過也 二至三分日有食之不為災日月之行也分\n同道也　極鼓故相過 日月同道長至相過也 長短卷故 日月相過 何損於明亦孔之醜于\n何不藏不用其行　詩曰日月告能無日辛乎 陽輔不克必甚祭無日辛乎 吳人\n羣乎　日食史墨曰六年及此吳其入郢 雲如赤鳥夾日以飛白虹貫日 漢書云卅師扇子\n之過　淮南子曰麟鬬日月食 麟鬬如月之初 月食之髀如月之初 蜀中日食黃瓊曰 蕈食未結\n館株流金爍石　招搖日十日並出 流金爍石 昌襄 日月薄蝕食讒\n天食　禮曰男教不修陽事不得適見於天日\n剝天　子素服而修六官之職蕩天下之陽事 曰之食甚曰　 傳曰叔輒哭日食注意君所\n哭也　言天災常道不 　憂災也 昭子曰子叔將死非祭所\n外壞內壞　教誨曰有食之也 吐者外壞食者內壞人於內朝寡不見其壞 有食之也 海外所奉者其壞"},{"id":"juan1-005","source":"正文","juan":"卷第一","menu":"月第四　食附","sub_menu":null,"page":"十七","leaf":"六オ","text":"無為月　易 月者太陰之精 子 慶瑞　 月\n生于西　禮 庚光名望舒 明月出皎兮如月之縆 縆上弦 而就盈 照臨下土 三辰\n三光七曜　其一 並月居盈必虧天之道也 三五而盈 三五而缺 成象在天 無私照\n代明　日代明 三日成魄 象月三日而成魄 金精陰靈 以陰靈 其葵 而生藩月\n桂華（明中桂樹 玉鉤金波蛾眉 鑯鑯似玉鉤 蛾眉 娟娟 娟月 破環破鏡 霜上天 磷磷月如圭賦\n桂華[重] 仙桂樹 玉鉤金波蛾眉）\n隨灰之暈　淮南子畫隨灰而月暈闕汪云以 執扇 赤獄 西園游\n蘆亥彌月缺其一面　則月暈 赤獄 西園游 曹植詩云清夜遊西園明月澄清景北堂\n霜露歲　詩古哀窺北堂上明月入 攬之不盈手 齊執扇 裂齊紈素鮮潔如明月 團團似明月\n鵲飛　星稀烏鵲南飛 恒娥奔乃為月中仙 麗天 平天 懸象\n離畢　月離于畢俾滂沱矣 夢月入懷 元后夢季夫 夢月入懷 魚腦減\n著明　日月 於畢 于畢 蓐收 魚腦減 石如月虧減\n月以為量　從星 有風雨 書 卿士 月 得天 日月得天而能久照 為九衙\n玉兔陰兔　金兔 玉兔 蟾蜍 素娥 瑤兔蟾光 蟾蜍 素月蟾蜍 圓魄 金魄 素光明 名王者姉事月\n天文志曰月有九行\n1. 本五頁書影解析度偏低，字口漫漶，以上錄文整體把握度不高；凡不敢定者已加 ，全然莫辨者作 　。\n2. 頁十三　四オ左半起「地理門　附地」以下，大字連寫長段　周禮大司徒、秦孝公作咸陽云云，與前段「事目＋雙行夾注」體例不同，疑本門引文以大字整段刊出，暫依原式逐行錄之，未強分事目與夾注。\n3. 頁十四　四ウ左半、頁十七　六オ右半各見黑地陰文門題「日第三」「月第四」，其下小字皆作「食附」。\n4. 頁十四「土門　附地」與頁十三「地理門　附地」之「附地」二小字，位置與字形均不甚清晰，或當作別解，存疑。\n5. a、b 兩圖接合處　頁十三之「廣」條、頁十五之「儒士之腹」條、頁十七之「桂華」條有重出，已於接合處以空行標示，重複部分於 b 圖首行加 juan":"卷第一","menu":"星第五　妖星附","sub_menu":"〇災異門　附星","page":"二十","leaf":"七ウ","text":"隕石于宋五　星不見／星隕如雨／如雨／孛\n妖星也　傳曰孛于北斗／齊晉之君皆將死亂\n祲掌　薹君無德星公欲禳之晏子曰彗所以除穢也君無穢德又何禳焉若德之穢禳之何益\n太白食昴　漢書儒先生喬秦晝長平之事／太白食昴／昭王疑之\n熒惑襲月　注見上\n處士憂死　月犯少微少微處士星遽名著於淮南\n謫歲時人憂遽然而歎死會稽籍\n三台圻　死\n張華彗　淮南子鯨魚死而彗星出／所以除舊布新／陰陽\n之事　星隕於宋叔興／曰是陰陽之事\n五星　支子曰政失於春歲星盈縮政失於夏熒惑逆行政失於秋太白出入無常政失於冬辰星不動其鄉／星\n搖則人勞　光武元年／如月介時／元帝／飛星如缶／晡／元帝／如盃流／星／晉書曰流星天使也／枉矢妖\n星　漢書音義曰妖星曰彗星曰欃星長星亦曰慌慌經蹕而去曰飛星光師相連曰流星\n天文第六\n觀乎天文以察時\n憂焉知　子產曰裸窀馬知天道是亦多言矣豈不感信\n恒象　天無恒象言恒象示人\n羲和湎淫廢時亂日\n傲擾天紀　昬迷于天象／天極星太一常居也／旁三星三公也／餘三星後宮也／文昌宮\n六星　上將次將貴相司命司錄司史／王梁策馬車開藻擧上天金堊／俟秦／具瞻／察有爛之文／詳不惛之色\n璿璣齊政授時　於虞典銅圖設象敦一儀／判見若卯之肇分／如　之璟／七曜迴\n博考乾象　星辰／妙飄／稽日月之度考其盈縮審其次舍／推星辰之躔／式觀玄象洞曉／天文祕\n奧精微　爰度／通／周或／蓋咸／業習談天識乘窺管／興而視夜／仰而／天無遁形星無遺象／七\n紀五緯躔次如契於心　四海九州分野若指諸掌／道雖玄遠／昭明／象則／藝精窺牖專門俯察\n仰觀　上達／下與學\n漢志　天文志／周官之要／保章氏掌觀日月星辰辨其吉凶以觀妖祥\n史卒始皇宿中外官凡\n百二十八伏見　蚤晚邪正存亡虛實闊狹及五星所行合散犯守歷淩闕／八九歲府蕭見歲土壤中／蓋天文及日月星辰語\n蝕暈適背穴抱珥虹蜺者本在地而上發於天官\n皆不常　父　禁之不令出自\n歷代人　高陽南正天帝伯武三辰／唐虞　慎／晉卜偃／鄭裨竈／宋子韋／齊甘德／唐　咸\n言家雜野鵠猶知況人乎\n疇趙尹咎魏石申皆掌之者　天文座咸石甘之說後代所宗／暴秦　　周有裨竈司馬彪\n要司馬遷欲父子劉向廣鴻範作星極論馬續述天文蔡邕譙周各有撰錄司馬彪采\n之又桓君山奏事坐西廡下以寒故景暴背有頃曰光去不復暴背此乃吉信蓋天日如\n天左轉而日西行光景當照此廊下移而東耳不當迭去迭方應渾天曰若鏡西反\n東便暗渾天信而有徵　也如月在雲之狀不得\n天遠人邇曾不戒於多言　　考　　如多果雖躔次遲／敦化於私習\n行可徵於漢史　而吉凶占候\n國章氣衝斗牛者　皆云吳可圖／張華獨以不然及吳平／晉書吳之末歲牛斗之間常有紫氣術\n有犯於　占候\n觀此氣邊明華間　雷煥妙達緯象乃籔候紬其尋天知將來吉凶／徵\n祅曰唯斗牛之間有異氣寶劍之精上徹於天在豐城獄屋下"},{"id":"juan1-012","source":"正文","juan":"卷第一","menu":"晨夜七","sub_menu":null,"page":"二十一","leaf":"八オ","text":"旭日始旦\n雞既鳴矣朝既盈矣　匪雞則鳴蒼蠅之聲／顛倒衣裳／顛之／不能晨夜\n不風則暮夜如何其夜未艾　未央／向晨／日云暮矣／暮夜有戍／日旰畫旦爾\n巳上卜晝　未卜其夜\n日入虞泉桑榆　暮景／辨色晨夜時／莊子見卯／四來時夜\n曆候第八\n君子以理歷明時　易／羲和欽授咨汝羲既旦和以閏月定四時成歲／洪範五紀五曰\n歷數正歲年　周禮大史正歲年以敘事領于官府都鄙／宿離不忒／經紀無失／底日／日官以底日底致也／諸侯有日御\n不失日次授司歷　羲今大猶西流／司歷過也／火伏而蟄者畢／漢藝文志／寒暑／會日月五星之辰以考\n百官於朝　異／曩暑止殺之實／聖人必\n以曆數定三統服色之制又採知日月五星之會凶陋之惠喜隆之喜此聖人知命之術唯承\n非天下至精孰能與焉小人殫欲知天道壞大以爲小削淺以爲江是以破碎而難知　推歷\n生律制哭品規圜矩方　重黎悼曜命堯／天之曆數在爾躬／秦推五勝／五行相勝／漢\n習秦正甘黃帝合而不死　故曰不死／歷始終無窮／三統歷／漢／考步小學大史之職／大推\n歷生律制器規圜矩方權重衡平準繩量探隨鉤深莫不用焉\n分天部　漢造太初歷／民間治歷者方\n起行於一衍於萬其術在等爲天下小學職在太史羲和掌之\n古唐都下閣與馬都　六盂部者曰舊曰説曰巴郡落下閎／漢武時改顓頊歷爲太初歷／後八百歲此歷差一日當有聖人定之八十一分\n分天部而運籌轉歷　覆歷／又使校律歷昬明官者渾于陵渠復覆歷太初歷曉朝歷\n昭用鄧平所造八十一分　律歷／弦望皆密日月如連珠陵渠奏狀遂用鄧平歷\n律歷罷廢尤疎者古家"},{"id":"juan1-013","source":"正文","juan":"卷第一","menu":"律呂第九","sub_menu":null,"page":"二十二","leaf":"八ウ","text":"萬事根本望敵知吉凶　史記六律萬事根本其於兵械尤重故云望敵知吉凶聞聲效勝負\n嫁娶妻生子　黃鐘初九律之首陽之變也因而六之以九爲法得林鐘／注以六乘\n陰陽之道取妻生子　鐘之九得六十四也初九呂之首陰之變也皆以參天兩地之法也／注\n三而九二三而六參兩之義也上生六而倍之下生六而損之皆以九爲法九六陰陽夫婦子母之義\n也　注異類爲子母謂黃鐘生林鐘也同類爲夫婦謂黃鐘以大呂爲妻也／律娶妻注謂\n生林鐘也而呂生子　注謂黃鐘生林鐘也\n統氣類物　統象類物\n陽六爲律以振陽宣氣　陰六爲呂以振陽宣氣／六律\n德生太蔟也　天地之情也\n太蔟姑洗蕤賓夷則無射\n六呂　大呂夾鐘仲呂林鐘南呂應鐘\n嶰谷之竹　嶰谷黃帝使伶倫自大夏之西崑崙之東取竹之／嶰谷生其竅厚均者斷兩節間而吹之爲\n黃鐘之宮　律之　長者制十二筒以聽鳳皇之鳴其雄鳴六雌鳴六此皆黃鐘之宮\n而皆可以生之是爲律本　此合也可以生之謂上下初生也此音頗麻反\n六律五聲八音在治忽以出納五言汝聽　書和律呂也／辨六氣／音和八玉律竹律／予欲聞\n候氣之法爲室三重戶閉塗釁周密布緹縵室中以木爲案每律各如其方　內庳外高從其方位加\n律其上以葭莩灰抑其內端案歷而候之氣至者灰去其爲氣所動者其灰散\n風所動者其灰聚　　　律十二／靈臺用竹律／吹灰或云以律著通十二辰理之上與地平／以葭莩灰\n大動君弱呂彊不動君嚴臣之應　忽微／漢書六黃鐘爲宮則太蔟姑洗林鐘南呂皆以\n吹律生氣　燕有寒谷不生禾黍鄒衍吹律\n相生　晉書周十二辰在六律爲陽當位自\n注陽於律筭之術無重上生下之法所經\n京房法　晉書京房知六律五音之數六十律\n律呂生　陰陰上生陽經於仲呂而十二律畢矣仲呂上生始執始下生去滅上下\n律咸於南事六十律畢矣　夫六十二律之變至於六十猶八卦之變爲六十四也\n雲從龍　易\n山川出雲　天降時雨\n密雲不雨　黃帝雲紀而　名"},{"id":"juan1-014","source":"正文","juan":"卷第一","menu":"雲第十","sub_menu":null,"page":"二十三","leaf":"九オ","text":"必畫　　物\n不待族　廣成子謂黃帝白露洽／天下雲氣不待族而雨\n雲中君　漢志巫言雲中君／祠雲中君\n白雲起　絡漢　子詞到第　雲\n霈雲雲宇　楚／詩有淋淒淒／曾尉朝隮／詩薈兮蔚兮南山朝隮／蕃曾尉雲興見\n雲師　油然作雲／沛然下雨／英英\n淒淒祁祁　詩有淋淒淒／興雲祁祁\n垂天　大鵬翼異若垂天之雲\n觸石　公羊曰觸石而出不崇朝而編天下者唯太山／　磁\n巷閭綏出蒼梧　歸藏曰有白雲出自蒼梧歸于大梁\n至　雲至于帝鄉／莊子曰乘彼白雲至于帝鄉\n陽臺　朝雲／奇峯／夏雲多\n赤鳥　麥有雲如衆赤鳥夾日以\n飛揚　大風起兮雲飛揚／高祖歌大風\n五雲　周禮保章氏以五雲之物辨吉凶水旱\n木草豐　秦三日太史曰其當王身平\n千雲　文選千雲霧而上\n無心　雲無心而出岫／文選朝涼樓臻\n陰陽暴\n同雲　上天同雲／雨雪紛紛\n達狀直亭以迢迢／鄭司農注云二分二至觀雲六色\n春秋元命苞山川氣　說文云雲山川氣也／從雨\n保章氏　周官見上／鄭司農注云二分二至觀雲色"},{"id":"juan1-015","source":"正文","juan":"卷第一","menu":"雲第十","sub_menu":"瑞雲門　附雲","page":"二十四","leaf":"九ウ","text":"黃帝雲紀　黃帝受命有雲瑞故以雲紀官\n矞雲　青爲蟲白爲喪赤爲兵荒黑爲水黃爲豐／望如雲／望如\n蓁　黃帝與蚩尤戰於涿鹿之野常有五色雲氣／金／慶雲／卿雲／瑞／覆鼎／金枝玉\n不黃雲　玉葉止於帝上有花龍之象故因之作華蓋\n千呂　青雲千呂連月不散\n圜是　慶雲／五色呈祥氤氳浹渤德動天心／若煙非煙郁郁紛紛／史記若煙非煙／雲物開／雲\n色　親書曰文帝生有雲氣青色如車蓋其上終日望氣者以爲貴之驗非人臣之氣"},{"id":"juan1-016","source":"正文","juan":"卷第一","menu":"雨第十一","sub_menu":null,"page":"二十四","leaf":"九ウ","text":"雨以潤之　過雨若濡\n雷雨作解　雨我公田遂及我私\n天降時雨　山川出雲／日月離于畢俾滂／滂沱\n靈澤　　　之　雲氣潤澤蟄履　霏／之次／露小雨也\n三日　凡雨三日以往爲霖／故事\n朝隮于西\n崇朝不節　禮止風雨不節則飢／天作淫雨害於粢盛／膏雨傾數之／時雨降不淫雨／旱雩沛然\n其雨　如霖下如霡／雨綠膏澤年多豐／霖雨若歲大旱用／祁祁雨膏之／陰雨膏之／驟\n雨不疼\n零雨其濛　如晦／陰雨如晦／五政時春雨乃來／管子曰五政苟／一旬／太平時五日一雨風十日\n若　休徵曰肅時雨若\n啓徵　雨若將降秋無雨／霑服諸侯朝天子雨霑服失容則止／藝市宗\n中行　其角巾時人　曰狂柏\n商羊鼓舞　家語童謠曰天將大雨商羊鼓舞一足鳥也\n鸛鳴于垤　言將雨也\n救成都\n少女風　樹上有少女風則\n降不破塊　篠雨不破塊旬而一雨無畫不行／孔子將行假蓋／雨無盡不\n至　　　蜀中火災\n陽臺　巫山神女暮爲行雨\n注必隨車　漢　里萬爲徐州刺史境早車所至甘雨輒降\n恨盡於子夏　搜神記武王伐紂至河上雨甚雷疾\n討邢　傳曰師大旱于討邢師興而雨\n洗兵　武王伐紂大雨浣兵\n高鳳讀書不覺天　易占曰蟻封穴戶大雨將至\n鶴巢　曾巢覺山雲潤／湘川／爲飛\n螻飛虹如生蟄　漸南子曰黑蜧神蛇潛乎神淵而居天將雨則躍\n逃雨　文子曰若鳥獸走藪澤／雨氣之而不驟濡爆血沮\n澤之龍　蜀都賦潛蘊煥然而興雨\n近壬子曰　管輅過清河昆太守曰天早輅曰今夕當雨／日今之當雨至壬子曰晝滿星中巳有水氣丁卯食\n有雩　陰雲汗雨下雨行／而巳雨行／雲不待族而雨／灌枝雨\n[承前頁「雨」門]\n曰　　月\n倒井　晉懷帝　愁霧森貞秋序\n玄冥　風俗通雨師曰　謂雨師曰屏翳　號\n赤松子　神農時雨師\n土龍　淮南子土龍致雨許慎注云湯遭旱作土龍以象雲從龍\n焚身禱　謝承後漢書載封字　　西　令大旱請雨\n漂粟　　子曰未　臣　　　　　　　　　　不覺雨漂粟\n無獲乃積　　其上以自蔽　起石大　至遠近勢伏乃還中山桐"},{"id":"juan1-017","source":"正文","juan":"卷第一","menu":"雪第十二","sub_menu":null,"page":"二六","leaf":"十ウ","text":"其雪湯　雨雪　產　雨雪紛紛　雨雪雜錄霏霏\n濛濛　　　瀌瀌　　　　　　見晛\n平地尺為大雪　傳三月雨雪書所失時也\n雪甚至\n龍沙　千里度龍沙\n入陳雲　賦\n照書　孫康映雪讀書\n雲中　雲興靈主\n霽雪西王\n朝雪　古詩胡風吹朔雪千里度龍沙\n大摯　摯摯傷也\n飛雪千里　楚甲子武王伐紂甲子日光\n委積淋漓\n雲六出　韓詩外傳凡草木花五出雪花獨六出\n玉樹銀花\n五穀之精　氾勝之書曰雪為五穀之精\n素華瑤華　時雪不降令不時雨雪\n神來朝　太公謂曰武王伐紂大雪十餘日甲子朝有五丈車轍南轅止\n屨敝而行　東郭先生久待詔公車貧困其履門開而行雪中而足踐地\n東海西海河伯之神來受命\n子玉門師雨父曰南海北海\n洛陽大雪丈餘　洛陽令出見素安門無所踣躓已死入見安倨卧曰大雪人皆餓之　賢之　不冀人之\n神仙　王恭衣鶴氅雪中行\n卧　　何以不出安曰大雪人皆餓\n積陰\n蘭優曲宋玉賦曰援琴而　　雪宮　　　孟子曰　　雪宮\n盈尺　　山雪　　西域傳曰天山冬夏有雪盈尺\n之為幽蘭白雪之曲\n瑞　於豐年之冬多積雪\n桂屋　　方而成珪　　而成　巖　巖山則千"},{"id":"juan1-018","source":"正文","juan":"卷第一","menu":"雪第十二","sub_menu":"承「雪」門","page":"二七","leaf":"十一オ","text":"肌膚　莊子曰姑射之山有神人肌膚若冰雪綽約若處子\n王之田原則萬頃同縞\n人　之死\n乘舟訪戴　王子猷雪夜乘舟訪戴而返曰乘興而來興盡而返何必見戴也\n雪救火　高士傳焦光為野火燒焦光卧不起\n山之如故\n太傅欣然曰白雪紛紛何所似兄子胡兒曰撒鹽空中差可擬兄女道蘊曰未若柳絮因風起\n玉雨　晉書常山真定縣大雪深數尺融而不積新蔡王騰怪而掘之得玉\n詩　謝氏內集講書俄而雪驟\n太傅欣然曰白雪紛紛何所似\n空中乍可擬兄女道蘊曰未若柳絮因風起\n鳥高尺餘因　詩曰廝衣如雪皆此色\n衣　風以霜衣\n扇　齊膚紈素皎絜如霜雪\n來而虐　之\n左傳地積陰溫\n新裂　班婕妤詠扇詩曰新裂\n禮為雨蓑則為雲　昔我往矣楊柳依依今我來思雨雪霏霏\n丈餘　食　已雪十日深丈餘\n尉\n春秋考異日庚樂乎　孟子曰齊宣王見孟子於雪宮王曰賢者亦有樂乎孟子曰為上者不與人同樂也\n七尺　　曰武王伐紂都七尺\n辰大雪深七尺\n董冬夏\n梁山歌　穆天子傳　　雪　父母作梁山歌\n黃竹之歌　雪乃作歌三章曰黃竹　可歌\n中者為\n有雲　春　白雲曲\n舞　趙飛燕為宛轉歌"},{"id":"juan1-019","source":"正文","juan":"卷第一","menu":"風第十三","sub_menu":null,"page":"二七","leaf":"十一オ","text":"巽為風　風以散之風從虎易\n聖時風若　洪範\n景風　爾雅四氣和為景風\n曰星有好風　好風箕星\n月離于箕風必揚\n沙　春秋\n習習　谷風\n且柔日旦暴其晴\n飂風\n辣心　郭風自南吹彼辣心\n冷然　列子御風冷然\n栗烈必憂　烈風雷雨必變\n扶搖　莊子摶扶搖而上九萬里\n噫氣　莊子夫大塊噫氣其名為風\n乘風　列子　御風而行\n飛廉　呂氏春秋箕星　風師\n轉蕙崇蘭\n太先風\n地籟　莊子汝聞天籟未聞地籟　　萬物\n太平之代　風不鳴條\n春風　曰東風解凍東"},{"id":"juan1-020","source":"正文","juan":"卷第一","menu":"風第十三","sub_menu":"承「風」門","page":"二八","leaf":"十一ウ","text":"風扇　和立春\n夏風　　風小暑日溫風至五月黃雀風至夏至景風至炎風\n秋風　立秋日涼風至秋分\n分明　風　風至和風光風\n冬風　　　立夏　廣莫風北風至\n飂然而至此風　　使哉\n八風　八節之風\n穆若\n閶闔風至　　朝日媚媚兮\n異色　大庭氏之王天下五風並異色\n秋風洞庭波起　兮木葉下\n風奮迅之以風　雨春無違君子之德風上之風必偃\n清\n琴歌　　作五絃之琴以歌南風之薰兮解吾之慍兮\n虎嘯　南子曰虎嘯而谷風生\n鳳鳴　蘭室之宮鳳鳴則風生\n易水歌　丹　送荊軻易水之上制　　風蕭蕭兮易水寒\n秋風起兮白雲飛　漢武作秋風辭曰\n大王　宋玉風賦序曰楚王游\n乃　裸而當之曰此　風寡人與庶人共之耶宋玉奏曰此獨大王之雄風\n少女　易巽上巳有少女風矣而顏　至\n鵃退\n過宋都\n鵬摶　莊子鵬摶扶搖而上九萬里\n扇　袁宏為東郡謝安　以扇宏　鵲巢識風之多風夫\n香末而\n馬嘶北風　古詩胡馬嘶北風\n瓢　詩由以瓢桂樹風吹　有穴莊子　上戶牖風起於青蘋之末　於松柏之\n下庶人　之風堀埠揚塵　然而起動死灰於窮巷之閒\n詩　班婕妤詠扇詩常恐至涼　　炎熱入琴風入松摧木秀\n於林風　　　無靜柯\n雄雌　大王之雄風庶人之雌風\n風其吹汝　　發兮　發兮匪風凄其以\n大風沛而歌　漢高祖過　　礫爾雅祭風曰礫\n潤之以風雨　易\n相風烏　郭緣生述征記云長安宮南有相風銅烏遇風\n乃　　脯　形鼓則風生使食物褻而不臭名曰脯\n解慍阜財　詩曰南風之薰兮可以解吾人之慍兮\n之溫兮南風之時兮可以阜吾人之財兮\n占　神仙傳曰老子將去周而出關　　關令尹喜占風連　　　　老子知喜　　　道乃"},{"id":"juan1-021","source":"正文","juan":"卷第一","menu":"風第十三","sub_menu":"承「風」門","page":"二九","leaf":"十二オ","text":"仰　隰下具汭\n喜　宮室完邊城不虧風至誅有罪斷大刑經通義云\n北風　其涼其喈\n民生之　後喜"},{"id":"juan1-022","source":"正文","juan":"卷第一","menu":"風第十三","sub_menu":"門附風","page":"二九","leaf":"十二オ","text":"飄風不終朝　老\n蒙恬　風若風不越而殺暴風來格大風有\n禾偃木\n隧　貪人敗類\n折木發屋揚沙　屋揚沙楚箏大亂漢王乃領得數千騎遁去項王圍漢王三匝於是風從西北來折木發\n溯滂賦　風\n拔　書開金縢曰天章周公之德\n海鳥避　爰居止於魯東門展禽曰其海有災乎廣川之高鳥獸恒知避其災是歲海果大風故避之\n朔匹烜怒　並風擊物也\n礊石動　礊伐木風災數起\n國多暴風　令月博\n疾風　物博\n快反\n志古太公為灌壇文王夢婦人哭當道問之曰吾是泰山之神女嫁為西海君婦吾行必以疾風暴雨過　夢覺白太公三日果有疾風暴雨過\n以疾風暴雨灌壇當吾道不敢以疾風暴雨過"},{"id":"juan1-023","source":"正文","juan":"卷第一","menu":"霞第十四","sub_menu":null,"page":"二九","leaf":"十二オ","text":"九光霞　十洲記未\n赤水之氣　　上蒸為霞陰而赫\n成綺散成\n綺霞錦散文　於沙汭之　飆\n啓暉　　景　臭曰　殷啓暉　身旅於邁行\n孤映　使我高霞孤映　山隱士云\n難把\n課朝囊之\n難把酒　　也"},{"id":"juan1-024","source":"正文","juan":"卷第一","menu":"霰第十五","sub_menu":null,"page":"二九","leaf":"十二オ","text":"先集　詩芃彼南山　先集維霓\n雨雪雜下　爾雅云雨雲雜下曰霓\n淚如霞　文\n冬蘭幽停\n陰陽相薄　而為之雲霓之不相入則霓霓霓者陽營陰也古行傳\n薜蘿\n霓為雷霓以動之霓雨作解　易\n雷出不霓　歲水以時　鼓之以雷"},{"id":"juan1-025","source":"正文","juan":"卷第一","menu":"雷第十六","sub_menu":null,"page":"二九","leaf":"十二オ","text":"雷霆發聲　春分收聲秋分　其雷之下毛萇在南山之陽　　詩\n闐闐　　　闐闐兮\n畏之如雷霆必變　迅雷風烈必變\n霆曜　為刑罰威獄必賴疾雷謂之霆爾雅\n二月"},{"id":"juan1-026","source":"正文","juan":"卷第一","menu":"雷第十六","sub_menu":"承「雷」門","page":"三〇","leaf":"十二ウ","text":"出地八月入地　雷　萬物入天地之鼓者天地之鼓豐隆師\n雷出地　易辟卦雷出地奮豫\n震百里　論衡曰雷之震百里制以　雷聲為諸侯之政教\n驚蟄達勾萌\n天威畏雷　　漢祭桐母畏雷　　　順在此\n太守鄒為南閣祭酒\n失匕箸　曹操　　先主方食失匕箸時正雷震備謂操曰聖人云迅\n章雷崇為老車馬\n觀出地之象　家天\n君象　　　五行傳曰六雷君象\n鐘鼓　雷之聲可\n以鍾軒轅聲動威彰德事　周之　　怒必變\n納麓　虞舜不迷伏塲\n畫象\n環家　見倚柱昔人倚柱作雷震其　自若侯得也\n感心　傳玄雜言詩雷　　威　非車音\n王充論衡曰畫雷之　　雷者所以開發萌牙　先王所以作樂崇德　風\n狀如連鼓右手推之\n開發萌牙　雷　者所以開發萌牙　　　先王所以作樂崇德考　積風\n陽泉物理論曰積風成雷\n雷公　雷神名\n推雷車　續搜神記云義興人　周永和中出都日暮道邊有一新草小屋一女子出門望見周曰日已暮周求寄\n宿向一更中聞外有一小兒喚阿香官喚　　雷車女乃辭去明朝視宿處乃一新冢耳\n見蛟龍在上巳而　　雷門附\n雷不發而震　時則雷霆霹靂也藏冰不\n雷雨晦冥　是時雷雨晦冥太公往視之則\n載　傳曰陰陽相薄而為雷激而為霆\n霹靂　淮南子廉女叫天\n震漢寢　後漢建和中雷霆震陵寢實　見時　太后見異\n雷激為霆\n事\n隱惡　震夷伯之廟罪之也於是展氏有隱惡　為"},{"id":"juan1-027","source":"正文","juan":"卷第一","menu":"雷第十六","sub_menu":"雷門　　雷","page":"三〇","leaf":"十二ウ","text":"離為雷仲春始雷電　令月燁燁震電\n不忌　來令詩\n列缺　電光繞斗樞\n承「電」\n天名為之\n笑則電　夫雷飛電狂電赤電\n陰陽分爭　莊子陰氣伏重泉陽氣上通於天陰陽分爭故為電鞭策也淮南子曰\n鞭策\n電候陰於牆蕃　賦甘泉"},{"id":"juan1-028","source":"正文","juan":"卷第一","menu":"雹第十七","sub_menu":null,"page":"三一","leaf":"十三オ","text":"聖人在上無雹雖有不為災　左傳\n雹陰陽脅　洪範五行傳\n馬頭　漢武元封三年冬雨雹大如馬首\n雞子　宣帝地節四年夏五月山陽雨雹大如雞子深二尺五寸殺人飛鳥皆死\n五寸　史景帝二年秋雹大者五寸\n折禾　孔叢子曰永初年河西　縣雹如杯棬折禾稼\n傷稼　郡令視漢記轅陵守伯師器下轅止觀事未聞吏人愛慕時\n陵縣皆雹傷稼陵界獨無　漢河平年桃雹兩　如碻年　雹如碻\n陰脅陽微動羽舒云可\n禦雹可禦　乎止也\n為災　雹之為災誰能禦之\n雨冰　說文雹雨冰也\n凡雹　陰聖人在上不為災\n虹蜺第十八\n雄曰虹雌曰蜺　季春月虹始見令小雪之日虹藏不見令攻陰　　純陽\n攻陰成象成象竟天　在天文虹蜺蜺之詩在東莫之敢指婚姻失序不和婚姻失序則\n生此五色比象　昭其華諸文也\n鎮星為虹蜺　　飲淵麗天垂象成文如橋之狀流\n氣冬藏夏見貫月之祥　　　如虹貫月　反大虹蜺頭感貫日之\n渚之慶　大星如虹下流白帝諸\n蜀宮之異　下于宮中飲井水竭吐金　晉\n誠其精誠上感於天白虹貫日之　欲刺秦王　史鄒陽上書荊軻慕燕丹之義\n陵　　有虹飲其金合　化玉　　神記孔子修春秋製圖經　　孔子齋戒向北斗星辰而拜告備于天乃有赤虹見自上而下化為黃玉有刻文孔子\n受而\n鏘彩　典論曰魏太子造劍名鏬彩色似彩虹\n玉氣　如白虹美人俗名為美人爾雅虹蜺蜺也女子金門邑蔡　書讀之"},{"id":"juan1-029","source":"正文","juan":"卷第一","menu":"雹第十七","sub_menu":"承「虹蜺」門","page":"三二","leaf":"十三ウ","text":"劉曰虹蜺是小臭子之祥\n大蜺如虹瑞　文子曰天有二氣則成蜺蜺有夢\n雜宇仲惟閃初雄毋羅隻雄時夢兩虹自地而升天一中則坐病\n陰陽之精　春秋元命苞\n蘇羅曰吾二兒君有先王者後必有貴者後　　王蜀華璨華　國志曰李"},{"id":"juan1-030","source":"正文","juan":"卷第一","menu":"天河十九","sub_menu":null,"page":"三二","leaf":"十三ウ","text":"天河謂之天漢　銀漢銀河河漢天津絳河明河\n倬彼雲漢　倬明也\n昭回于天　昭回光倬也\n倬彼雲漢為章于天　言其為天文章也\n維天有漢　監亦有光\n斜漢左界斜南嶇　曜曜也見文選\n垂象成象　在天成象\n耿耿　秋河曙耿耿\n清淺　河漢清且淺\n渭水以象　三輔圖秦　星辰咸陽列以象天河\n黃河之精　河圖曰河精上為天河\n仙查　博物志舊說天河與海通有居海者年年八月浮查來不失期因上乘去忽忽不知晝夜有一處多織女一丈夫牽牛渚次\n之問之　曰君可於蜀中問嚴君平君平曰某年某月某日有客星犯牽牛星即此人到天河也\n此織女支機之石\n昭昭清漢\n鵲橋　牛女隱見迴旋通海竟天"},{"id":"juan1-031","source":"正文","juan":"卷第一","menu":"霜第二十","sub_menu":null,"page":"三二","leaf":"十三ウ","text":"履霜堅冰　易坤\n女神名　月女\n季秋霜始降　霜降之日五木休禮\n露為霜　白露為霜蒹葭蒼蒼\n水至　水至日青\n淮南子曰霜　拾遺志曰廣延國霜\n刑罰之表　大戴禮陰氣勝陽則凝而為霜氣則凝而為霜雪\n肅殺之威　天行誅成\n紺碧色　紺碧又有甘霜\n九月盡霜既降　　　記曰霜露既降則君子有悽愴之心鐘鳴\n山海經云豐山之　霜降而自鳴\n始凝　易曰履霜陰始凝也\n葛屨　糾糾葛屨可以履霜\n純霜　班婕妤扇詩新裂齊紈素皎潔如霜雪四馬\n見　　雲云高見而殺木\n殺木　元命苞曰霜以殺木\n鷹隼擊　霜降則鷹隼擊為　祭\n霜降之日祭獸禮\n婦功　家語霜降"},{"id":"juan1-032","source":"正文","juan":"卷第一","menu":"霜第二十","sub_menu":"承「霜」門","page":"三三","leaf":"十四オ","text":"而婦功成嫁娶者行焉\n馬蹄　莊子曰馬蹄可以踐霜雪蟄蟲咸俯後為蟄\n賣之　魏遂伯奇伯奇自傷無罪清朝履霜乃作履霜操\n琴　琴有履霜操伯奇所作也尹吉甫信後\n禮曰霜陰陽之　也"},{"id":"juan1-033","source":"正文","juan":"卷第一","menu":"霜第二十","sub_menu":"玄霜　內傳具雪門","page":"三三","leaf":"十四オ","text":"神鑪　抱朴子云　霜雪　神鑪採靈芝茯苓\n塵氣勝則　而為霜\n正月繁霜　詩人興憂季秋既　門陽之心\n〇災異　附霜五月降\n霜　左右諧之王棄術衍仰天而哭感霜降\n夏降不殺草　春山於符曰王者政令苛則夏降霜誅代不行則冬霜不殺草\n淮南子鄒衍事燕惠王盡其忠貞\n附木　京房易傳曰誅不原情則其霜反在草下\n雪霜大摯　大戴禮陽氣勝則散為雨露陰則散為雪霜\n殺菽　周十月　　畫失時"},{"id":"juan1-034","source":"正文","juan":"卷第一","menu":"露第二十一　瑞露附","sub_menu":null,"page":"三三","leaf":"十四オ","text":"立秋後五日白露降　散而為露\n零露為露霜　白露霜露泥泥漙漙湛湛露斯匪陽　冕\n漙兮\n露為霜　　為霜零露漙漙湛湛露斯不晞　冕　珠　綴冕之飾泠濃\n之彩鶴發言　千年鶴警露而鳴\n蟬飲　潔其飢濕　後之必有休物之　珠盤以承露盤\n中見薤上　雜露鄲曰薤上露朝日晞\n潤玉垂珠晨降　禮曰春雨露　露既濡君子　心\n宵零　典引曰甘露宵零草\n芽　英英白露\n多露　謂行多露\n詩人風行　之詩\n露永朝諫　劉向說苑曰吳欲伐荊三令敢有諫者死舍人有\n助海成深　海受霧靈以成其深\n君子春履　有情傷之心\n下地騰文　別賦\n三朝王曰子求何名露霑衣如是對曰園中有樹其端有蟬蟬高居悲鳴飲風飲露不知\n螳螂在其後曲附欲取其蟬而螳螂又不知黃雀居其後延頸欲啄之　黃雀又不知\n懷彈丸在其下臣但擁其黃雀不覺露濕衣此\n桐葉　蘇子曰人生一世若朝露之託於桐葉　〇瑞露門附露\n者為窺其利而不思後患王聞之遂不伐荊\n王者施德則甘露降(瑞應圖一名天酒甘露仁澤也其凝如脂其甘如飴松)\n柏竹葦(晉書中興詩曰王者敬養耆老則甘露降而松柏受之尊賢容衆則竹葦受之)\n天地相合(以降甘露人莫之令而自均老子)\n漢年(甘露之端改爲年紀)\n三危(　危之露五色端露也)\n膏露(天不愛其道天降膏露)\n德動皇天(甘露)表至\n德之馨(且國宵降)\n甘之味(不待)\n若脂之絜(如醴之甘)"},{"id":"juan1-035","source":"正文","juan":"卷第一","menu":"霧第二十二","sub_menu":null,"page":"三四","leaf":"十四ウ","text":"氛霧冥冥(月令冬行夏令)\n積水上溢故爲霧(莊子)\n霧不塞望(西京雜記曰太平之世霧不塞望慶淫被泊而已)\n大霧三日(帝遊洛水之上見大魚乃得圖書)\n五里(張揖字公超能爲五里霧所居學者成市故有公超市)\n三里(裴優慶能爲三里霧後因霧務而作賊)\n霧豹(列女傳陶荅子妻曰南山有玄豹霧雨七日不食)\n隱(不食欲以澤其毛羽成其交章也)\n蛇遊(雲騰蛇遊霧)\n戰涿鹿(韓子　龍乘　　黃帝與蚩尤戰于涿鹿之野)\n圍平城(漢高祖於平城之圍大霧三日)\n迷雲夢(曹公至赤壁遇雲夢澤中大霧遂迷失道)\n素霧四塞(封其日黃霧四塞)\n開而覩天(見樓堞然若隔雲霧而覩青天)\n丹山銀山(也銀山)\n常出(雄鳴每出行雲霧紛紛中藏之能爲雲霧)\n道不迷(時人因謂之能爲雲霧)\n如晦高寨(寨開)\n蒸民皆隱(　　　海成深露見)\n行不迷道\n浪泊西(馬援在浪泊西里閒虜未滅時下潦上霧毒氣薰蒸仰觀鳥鳶跕跕墮水中)\n夕霧煙(朝旦重霧)\n重霧行(一人無恙一人病一人死問其故飲酒病者食死者空腹)\n終隱南山霧(謝朓詩曰雖無玄豹姿終隱南山霧)\n(觀青天)\n冰第二十三(藏冰 開冰 附)\n霜相堅(水積水所成)\n(爲積水所成積水　微增冰之凜)\n渙若(冰釋)\n履薄(戰戰兢兢)\n涉春(心之憂矣如涉春冰)\n固沍(也)\n淋滴(冰)\n以風壯風解(立春日東風解凍月令)\n冬凝春泮(淮南子水冬則凝而爲冰春則泮而爲水)\n曈曈(思玄賦云行積冰之曈曈清泉沍而不流)\n清如玉靈冰始冰(立冬日水始冰月令)\n水有時以凝(周禮之)\n不冶水陽冰(不冶海賦)\n時燠(公羊冬無冰時燠也)\n六尺(晁錯上書曰胡貊之地水厚六尺)\n百丈(神異經曰北有冰萬里厚百丈)\n東海鱉蟲(拾遺記東海貨嶠山有冰蠶以霜雪覆之則爲繭色有五彩)\n增冰峨峨(楚辭)\n未泮(遠冰馴致也)\n馴致(易曰履霜堅冰陰始凝馴致其道至堅冰也)\n渙然釋飲冰(莊子曰朝受命而夕飲冰)\n飲冰哉其\n蟲疑(天台山賦曰夏蟲之疑冰)\n魚上(五日魚上冰月令)\n光武渡河(立春日東風解凍後)\n至呼沱河(遣兵至河水流澌無船可渡王霸曰　冰合帝遂得渡王霸往視莫容躅江躬征郭遠假陛下天地之　)\n威精誠感靈爲冰結(冰凌行海中三百里)\n鳥覆(姜嫄踐大人跡生子棄鳥翼覆之)\n魚躍(王祥爲母思魚朝朝冒寒有雙鯉躍出)\n狐聽(述征記曰河水始合要狐先行方得渡河水先聽無水聲而後渡)\n陷冰丸(後漢青州刺史焦和召治戎烈巫史祭禱又恐賊乘水闊多作陷冰丸投)\n河衆賊(魏志初袁譚一時民亡於　)\n淥清\n匠不能負重(邵　上書曰明君之御物若冰)\n觀甕中之水知天下之寒(以近論遠)\n誕真之寒冰\n心夜以接日\n當白日(見火門猛火生　池　等)\n寒則抱冰\n方鼠(神異經曰北方冰厚百尺有鼠在水下其鼠毛長百尺)\n●藏冰\n鑿冰沖沖(豳風二之日鑿冰沖沖也)\n三之日納于\n凌陰(冰室也今正月)\n四之日其蚤獻羔祭韭(　今十二月藏)\n取之窖谷(深山窮谷固陰沍寒)\n於是\n享司寒(其藏之也黑牡秬黍以享司寒司寒玄冥北方神也)\n山人取之(縣人　之納之隸人藏之)\n藏之也(周密也)\n月之卒章(豳風詩曰藏冰之道也)\n方盛(季冬天子命有司水而藏之禮)\n納於冰室(取以山人當栗)\n七\n烈之辰(入沍寒之室文選)\n雅協幽詩(周禮未乖)\n無或失時令藏川池之冰棄而不用(於山谷)\n斬(言不斬)\n及狐聽之曰藏之\n冰(周禮凌人掌冰歲十二月令斬冰三倍其冰爲消釋)\n三倍其冰爲消釋\n又須用不\n●開冰\n四之日其蚤獻羔祭韭西陸朝覿而出之(月令三出八)\n餘則棄之"},{"id":"juan1-036","source":"正文","juan":"卷第一","menu":"霧第二十二","sub_menu":"開冰(門階外)","page":"三六","leaf":"十五ウ","text":"以時開冰(春分後天子獻羔開冰先薦寢廟)\n朝之祿位賓食喪祭(於是乎用之)\n桃弧棘矢(也其出也桃弧)\n棘矢以除其災\n食肉之祿與焉(冰皆)\n喪浴(大夫命婦喪浴用冰)\n獻羔而啓(之)\n火出而畢(老疾)\n老疾(大夫命婦老疾無不受冰)\n以風壯而以風出其用之也偏(山人冬)\n鑿冰室春開(玉壺夏薦)\n取順沍寒清暑(用賓)\n致夏蟲之疑(闕而爲罪)\n遇時燠之變(難加青則)\n春始治鑑(獻羔啓冰也)\n夷盤(也喪器)\n事供夷盤水所以寒尸置牀也\n頒冰(夏頒冰注夏暑氣盛乃頒賜冰也)\n伐冰(之家不畜牛羊)\n夏頒秋刷(刷除冰室更納新冰)\n凌人職\n(祭祀供鑑冰賓客供冰大喪供夷盤冰)\n火第二十四(火災 救火 爆祭 附)\n大就燥(易炎上書作芑作芑鑽燧改火)\n(燧人氏始用火春取榆柳之火夏取棗杏之火秋取柞楢之火冬取槐檀之火一年之中鑽火各異逐時色)\n燎原(若火之燎于原不可嚮邇)\n火烈人望而畏(之則鮮死)\n爲災輝(詩火無焰曰輝)\n焰焰(無若火始焰焰厥攸灼序不其鑑住火始焰焰不已乎)\n嚮邇(不可)\n撲滅(其猶可)\n其猶可撲滅\n自焚(兵猶火也將自焚)\n盛德在火(月令立夏)\n方陽(詩云燎之方陽)\n烈烈(如火烈烈詩)\n望畏\n其 息於是女媧積蘆灰以止　)\n祭其亦亡道(吳高君之法禁蔡秦於過　死而不)\n散以從風揚珠開而破敵漢後\n爨第二十五(積而止)\n韓安國字長孺坐法獄吏田甲辱之　熱寒國曰晃家獨不然乎甲曰燕則溺之\n揚璞窩寒陵去中時倉語群賊攻劫破乃制車轟\n十乘習炎車中從風賊衆賊不得視因以敗之\n環月暈(淮南子畫　　而暈闌汪云　　　)\n應律乘(而　之其月氣至則飛灰而管通)\n昆明劫灰(武帝穿曰昆明池　　是其　國胡通人云此是天地)\n劫灰之餘心若死灰(莊子)\n煨爐澆腸之用(斗三)"},{"id":"juan1-038","source":"正文","juan":"卷第一","menu":"塵第二十六","sub_menu":null,"page":"三九","leaf":"十七オ","text":"生羅轂生塵化素本\n京洛多風塵素衣化爲緇\n生甑中(范丹爲萊蕪令甑中生塵)\n動梁上(虞公歌發動梁塵)\n浮清路(云劉裒　塵素曰)\n紅塵(雜塵)\n蒙古\n增高山(山不辭塵故成其高大)\n揚滄海(神仙傳王君十四日　　湯　塵)\n紅塵四合(昔黃昏清塵雜塵)\n詩云\n冥冥望之而拜(潘岳伯州舉望塵)\n芳塵凝樹(席滿)\n輿曳笨而駕邇而退(傳晉黃紙飛毛旌之　)\n而駕邁注由此\n塵上而飄(望塵拜)\n望塵知馬步多少(名將上車軾塵長者)\n起塵非爲樑走\n鳴鳶(戴鳴鳶禮)\n同其塵(老子曰和其光而同其塵)\n野馬動塵埃也(莊子曰野馬)\n之曾必如箒帚於箕上以被拘而退其塵不及於長者\n歸東南(淮南子油不淨埽東南埽塵)\n撫塵\n世俗之塵(楚辭曰安以皓皓之白蒙世俗之塵埃)\n歸東南\n別(此察蜚云蜮無底平載無不遂蓬堁與甘黃子)\n高有無塵\n蛇(山海經曰黑木之南有蜮日食塵蚓)\n玄蛇(天大人之國南有蛇頭方食塵蚓)\n棲弱草(李廙遊山云行日蓋人主天地之閒也)\n污人顏公名\n埃(博物志云徐州人謂塵爲埃蓬堁吳人謂塵土爲拔堁)\n塵王以扇拂之(世說重足棲王公時塵在石城王在北城忽風起揚)\n四時第二十七\n四時勑授人時動二氣之和(以四時爲禍)\n廢時亂日行夏之時馮相氏(辨四時之序以)\n氣至天地革時(而四)\n敘四時之天傾(論陰陽)\n日影知(不可失也)\n遷天吏時(淮南子四時天之吏)\n讀時令禮(晉)\n志曰太史每歲上其笙曆先立春大暑立秋立冬　又魏明帝讀四時令\n尚書令巳下讀廩訖酒一包\n服黃之時(五時令服各隨五時色帝飾坐)\n時闕不讀又晉咸和元年六\n月有司奏讀秋令繁侍中荀彧六\n生一時之至闕言所職以知陰陽\n又漢宣帝時　相　遠請明經通知陰陽者四人各\n(立春爲春分之　壇帝從之)\n春第二十八(立春 春分 正月 二月 三月 附)\n其日甲乙帝太皥(以木德王)\n神句芒(正)\n春爲青陽(爲發)\n載陽(日春遲遲)\n迓春(性仁事貌味酸臭羶數八食)\n風入(羊器)\n勿用牲(北)\n禁伐木獻種稑(王后率六宮之人獻穜稑之種於王)\n獻鱉蜃(蓋金合)\n菜(菜合舞)\n醴\n黃寶出(日)\n平秩東登臺(作春臺如登)\n徇路鐸(木)\n傷春(日極千里傷春心)\n人夏兩雨人吾道窮矣\n蟲鱗(音角)\n祀戶祭先脾(〇立春門)\n立春(附春)\n漢魏相曰陰陽之分以日爲紀各月當中職\n春(不得相干東方之神太皥乘震執規司春)\n立春盛德在木(迎春於東郊)\n條風至(春日並立)\n啓開(立秋立春)\n出土牛以示農耕(〇立春門)\n之旱晚(立春早則策牛人近前立春晚則人在後所以示人之旱晚)\n司啓(青鳥氏司啓者立春)\n立春日東風解凍(後五日蟄蟲始振後五日魚上冰)\n蟄蟲始振後五日魚上冰\n筭要(梁帝纂要春爲青陽芳春青春三春九春天曰蒼天風曰陽風柔風惠風景曰媚景和景韶景時曰良時辰曰良辰嘉辰節曰華節)\n草木(草曰弱草芳草芊草木曰陽木文木華樹芳樹陽林茂林)\n鳥(陽鳥時鳥陽禽候鳥時禽游鳥)\n〇春分(附春)\n春分日玄鳥至日中星鳥(春分秋分司分之官少皥氏以玄鳥氏爲司分者以春分來秋分去故爲司分也)\n日夜分(分春分日夜平分〇正月門)\n祠高禖(玄鳥至日)\n同道(傳曰分同道也注云日夜等日月同道)\n日在虛律中太簇\n太簇中氣(危日在)\n每歲孟春遒人以木鐸徇于路(太皥其帝)\n行慶\n施惠下及兆人(迎春)\n命太史司天曆候祭風師(立春後五日)\n釁寶龜策占兆\n審卦吉凶　周禮龜人上春釁龜　　色\n上春　月建寅\n雨水之日獺祭魚　中氣也後五日鴻鴈來後五日草木萌動\n布農事\n合東郊修封疆端徑術善相丘陵　古山\n元日祈穀　禮上辛祈穀郊祀昊天上帝于圜丘\n親耕籍\n正習舞修祭典命祀嶽鎮海瀆　無用牝\n禁止伐木無麛麑無卵無聚大衆\n無置城郭　農為\n掩骼埋胔肉不可稱兵　注稱兵必有天殃無殺端之理\n三之日于耜　正月也始修耒耜\n三之日納于凌陰　凌陰冰室\n孟陽　梁元帝纂要云正月為孟陽亦曰孟春初春開春發春亦曰初歲\n土晚寒畢　晨晚也\n開歲獻歲肇歲芳歲華歲首歲\n〇二月　附春門日在營室律中夾鍾　仲月中氣日在仲春\n鼓吹豳詩以迎春\n去枯槁無肆掠　訟止獄\n祭馬祖　用剛日\n修闔扇　助陽氣\n驚蟄日桃始華倉庚鳴　二月萌也後五日倉庚鳴後五日鷹化為鳩\n養幼少　存諸孤\n樂正習舞　釋奠\n上丁釋奠　於國學\n命人社　春分前後戊日\n春分之日玄鳥至　二月中氣也後五日雷發聲後五日始電\n祀朝日　於東郊獻羔開冰\n先雷\n祠高禖　后妃　　也\n祭馬祖\n無作大事以妨農之事　兵役之屬\n同度量　平權衡鈞斗晝夜平則正之\n頓陽　陽氣也\n四之日舉趾　周之四月今二月人皆舉臿\n無竭川澤無漉陂池無焚山林　養物也\n仲陽　梁元帝纂要曰二月仲陽亦曰仲春\n獻鳩　羅氏仲春獻鳩於國老鷹化為鳩變舊以養老助生氣\n上戊釋奠　於太公廟\n〇三月　附春門日在婁律中姑洗　日躔胃月維\n春者春服既成　論語\n薦鞠衣\n乘舟薦鮪\n勾萌達\n覆舟五反\n騁名士　禮賢者\n修利隄防　導達溝瀆\n修燒薰蟲器窨\n審五庫之量　金革筋角之類無或不良\n合累牛騰馬　遊牝于牧\n駒犢其數\n大合樂　磔禳以畢春氣\n清明之日桐始華　三月萌也後五日田鼠化為鴽後五日虹始見\n不可以内　時可宣出不宜收斂\n布德行惠發倉廩　賜貧窮賑之絕\n穀雨之日萍始生　中氣也後五日鳴鳩拂其羽後五日戴勝降于桑\n無伐桑柘　養蠶\n罝罘畢翳餧獸之藥無出國門　鳥獸孚乳不可傷\n享子先蠶　躬桑以勸蠶事\n暮春　梁元帝纂要曰三月暮春亦曰季春晚春大春餘春"},{"id":"juan1-039","source":"正文","juan":"卷第一","menu":"夏第二十九","sub_menu":null,"page":"四三","leaf":"十九オ","text":"四月五月六月附\n其日景丁　帝炎帝神祝融\n夏日可畏\n朱明為南交　春與夏之際\n其蟲羽律中仲呂數七性禮事視味苦臭焦祀竈祭先心\n南訛　訛化也南方化育之事\n暑雨　怨咨小人\n長嬴　夏為南交之序政失於夏\n夏之日與蟲當暑\n司夏　魏　齋執衡司夏\n夏　梁元帝纂要曰夏曰朱夏亦曰長嬴炎夏三夏九夏也\n維夏　首夏初夏亦曰孟夏\n天曰昊天　旻天\n風曰炎風\n節曰火節　亦曰署節\n草木雜草林曰蔚林茂林樹曰茂樹\n甘瓜朱李　魏文與吳質書曰浮甘瓜於清泉沉朱李於寒水\n象德　范子與計然書曰\n取象於　春夏\n景曰　畏景"},{"id":"juan1-040","source":"正文","juan":"卷第一","menu":"夏第二十九","sub_menu":"〇立夏　附夏門","page":"四三","leaf":"十九オ","text":"立夏日螻蟈鳴威德在火迎夏於南郊\n立夏　夏也\n啓開　啓立夏也\n司開　丹鳥氏以立夏來立冬去"},{"id":"juan1-041","source":"正文","juan":"卷第一","menu":"夏第二十九","sub_menu":"〇夏至　附夏門","page":"四三","leaf":"十九オ","text":"夏至日鹿角解日長至\n陰陽爭日永星火陽極陰生　夏至日　陰生\n分至　至冬至夏　至冬至云伯趙氏以夏至來冬伯趙伯勞也\n漢雜事　冬至陽事起君道長故賀夏至陰事起君道長故不賀\n受餉　門受餉得米二千八百斗代貧人輸租稅\n閏關　至日開關商旅不行后不省方\n景長　只有五之中禮云夏至日在東井\n〇四月　附夏門日在昴律中仲呂\n維夏　四月維夏\n清和　首夏猶清和\n正陽之月　暹未作氣未挺祀雨\n挺重囚　挺寬也\n師祈穀實\n小暑至\n出輕繫\n繼長增高　無有壞隳\n驅獸　無害五穀\n飲酎　以嘗麥\n溺金象　世說四月八日孫皓溺金象云浴佛後陰病懺悔乃差\n立夏日螻蟈鳴　四月節也後五日蚯蚓出後五日王瓜生\n慶賜遂行　無不欣悅\n贊桀俊　遂賢良\n舉長大\n行爵出祿　其位必當\n習盛樂　大雩帝無自\n皆　　作曰盛樂\n禱祝山川　古鄉土有益於人者以祈穀實\n小滿之日苦菜秀　中氣也後五日靡草死後五日小暑至\n起土功　大擿無發大眾無代妨蠶農也\n無大田獵　驅獸而已恐傷生類\n登麥　天子乃以彘嘗麥先薦寢廟\n收繭稅\n秀葽　詩\n〇五月　附夏門日在參律中蕤賓\n實麥秋五月鳴蜩反舌無聲\n開市無索\n遊牝別羣　縶騰駒班馬政\n祭先牧\n芒種日螳螂生　五月節也後五日鵙始鳴後五日反舌\n聚蓄百藥　蕃時草木\n夏至日鹿角解　中氣也後五日蜩始鳴後五日半夏生\n祀黃地祇　於方岳\n夏至日百官靜事無刑以定晏陰之所成　猶安也　晏安也\n陰無用火南方　害微可\n可以居高明　斯螽動股詩\n搔身無躁　君子處必\n〇六月　附夏門日在東井律中林鍾\n徂暑　六月徂暑\n土潤溽暑大雨時行　利以燒薙行水以殺草\n糞田疇　入山行木無有斬伐\n暑退　火中寒暑乃退謂季夏及季秋\n小暑日溫風至　六月節也後五日蟋蟀居壁後五日鷹乃學習\n染采　黼黻文章必以法故以給郊廟之服\n以大暑日腐草為螢　中氣也後五日土潤溽暑後五日大雨時行\n不可以興土功　不可以合諸侯不可以起兵動眾　注云土王用事欲靜\n莎雞振羽食鬱及薁　薁蘡薁也詩鬱棣屬"},{"id":"juan1-042","source":"正文","juan":"卷第一","menu":"秋第三十","sub_menu":null,"page":"四五","leaf":"二十オ","text":"立秋秋分七月八月九月附\n其日庚辛帝少皥神蓐收\n秋為藏　白帝云秋矣悲哉為氣秋日淒淒秋風\n蟬葉落　知天秋\n金方戒序　其蟲毛音商數七性義事言味　食稻臭腥其器廉\n以深餞　納日下秋用事\n其蟲毛音商臭腥祀門祭先脾　父子曰業兼蘭欲食魚其器廉\n毫離妻百步見　秋毫之末\n平秩西成\n獻龜魚　周禮\n草木搖落而變敗　蘭芳秋風歎之\n淒風高風涼風歊風悲風\n司秋　昊乘兌執矩司秋\n商風清風收成　梁元帝纂要曰秋巳收成亦曰白藏三秋九秋高秋商秋\n素秋\n戒以白露　申之霜露悲愁騷曰皇天平分四時兮竊獨悲此廩秋\n孟秋初秋上秋早秋首秋蘭秋\n西成之序政失於秋　子"},{"id":"juan1-043","source":"正文","juan":"卷第一","menu":"秋第三十","sub_menu":"〇立秋　附秋門","page":"四五","leaf":"二十オ","text":"景曰　朗景澄景\n時曰　淒辰\n節曰　素節\n草木　襄草襄林霜相霜條\n肇秋\n金迎秋　於西郊\n立秋日署吏　孫寶見蔡京丹人立秋日署侯文為東都督郵謂曰\n今鷹隼始擊當從天氣取蠡惡以成嚴霜之誅　漢儀斬牲\n立秋日涼風至威德在\n漢書曰漢儀立秋日白郊禮畢始揚威武斬牲於東門薦陵廟　其儀乘輿御戎車白馬朱髦鬃執弩射牲牲薦鹿麛謂之貙劉還宮遣使弔賜武官武練兵習戰之儀新牲六禮名曰貙劉\n迎氣　京都百官皆衣白施皂領緣中衣迎氣西郊　漢書曰立秋之月夜漏未盡五刻官皆隸孫吳之兵法六十四車也"},{"id":"juan1-044","source":"正文","juan":"卷第一","menu":"秋第三十","sub_menu":"〇秋分　附秋門","page":"四六","leaf":"二十ウ","text":"雷乃收聲　日夜分司分氏\n玄鳥同道　傳曰分同道也注云日夜等故曰同道\n〇七月　附秋門日在張律中夷則\n流火　七月流火\n天地始肅\n禾乃登　穡\n囹圄具桎梏　斷薄刑決小罪\n納材葦坏牆垣　修宮室\n立秋日涼風至　七月節也後五日白露降後五日寒蟬鳴\n賞軍帥武人\n乃命將帥選士勵兵簡練桀俊任有功以征不義　詰誅暴慢以明好惡順彼遠方\n熱者日鴈乃祭鳥　中氣也後五日天地始肅\n築場圃　天子嘗新先薦寢廟\n登穀\n鳴鵙　豳土晚寒伯勞七月始鳴\n享葵及菽　詩\n食瓜斷壺養秋　注見上\n〇八月　附秋門日在翼律中南呂宵中星虛\n迎寒　周禮仲秋夜擊土鼓吹豳詩以迎寒\n老授几杖　行麋粥\n循行犧牲　視全具\n乃儺　以達秋氣\n習吹享壽星　於南郊\n祭馬社\n申嚴百刑　無或枉橈斬穀必當\n勸人種麥\n白露日鴻鴈來　八月節後五日玄鳥歸後五日群鳥養羞　案佩觿羞色必肥痛察物者備當\n上丁釋奠　於國學\n上戊釋奠　於太公廟\n擇元日命人社　近秋分前後戊日\n秋分日雷乃收聲　中氣也後五日蟄蟲坏戶後五日水始涸\n祀夕月　於西郊秋分日\n同律度量　平權衡因晝豐夜平則正之\n天子嘗麻　先薦寢廟\n八月載績載玄載黃　子當家為公\n八月其穫剝棗剝棗斷壺　壺瓠也壺瓜下並豳詩自載績\n仲商　梁元帝纂要云亦\n八月獻良裘　周禮司裘氏掌大裘長以供王求家禮天之服仲秋獻良裘\n天子居總章太廟　是月也\n養老授几杖\n〇九月　附秋門日在角律中無射\n授衣　九月授衣\n九秋霜降\n九月肅霜\n務納會　百官貴賤無不務納以天地之並藏無有宣出\n伐蛟取鼉登龜取黿咸俯　蟄蟲有司\n神倉舉五穀之要藏帝藉於神倉祗敬必飭\n伐薪為炭\n玄月　九月\n寒露日鴻鴈來賓　九月節也後五日雀入大水為蛤後五日菊有黃華\n入室　命有司寒氣總至人力不堪其八皆入室　注云霜降淒風戒寒所以令人入室\n申嚴號令\n霜降日豺乃祭獸　中氣也後五日草木黃落後五日蟄蟲咸俯\n百工休　膠漆之作停也\n先講舉五穀之要　農事\n具飭衣裳　支繒有恒衣服有量制常必循其故\n嘗稻先薦寢廟\n舉五穀之要　廩實嚴事\n合秩芻養犧牲　以召皇天上帝名山大川四方之神以祠宗廟社稷之靈為人祈福\n有司當　皆授臣曲群神\n趣人收斂　務蓄菜也始\n習吹大享帝　於明堂注謂祀昊天於明堂五方帝五官從祀\n命九月築場圃　豳詩也謂十月早晚也\n獻功裘衣　見八月處\n叔苴采荼薪樗　食我農夫豳詩\n末秋暮商季商杪秋　亦曰授衣亦曰玄月"},{"id":"juan1-045","source":"正文","juan":"卷第一","menu":"冬第三十一","sub_menu":null,"page":"四七","leaf":"二十一オ","text":"立冬冬至十月十一月十二月附\n其日壬癸帝顓頊神玄冥蟲介　音翔數六性智事聽味鹹臭朽祀行祭先腎食鴈黍稷\n器擴以冬為玄英沍寒歲\n將暮　時既\n玄律窮　嚴氣烈烈\n閉塞而成　可愛冬日\n日短星昴謹\n蓋藏\n日窮于次星迴于天　月窮于紀\n冬民既入　婦人同巷相從績安工二月得四十五日所以省費燎火同巧拙令習俗三餘\n畫過讀書　當以三餘冬\n冬之夜司冬　顓頊乘坎執權司冬\n之餘夜日之餘雨晴之餘\n穹室熏鼠塞向墐戶　此皆豳詩穹窒塞鼠墐塗也\n入此室處　詩\n農人華戶為此者備寒\n玄英　梁元帝纂要云冬曰玄英亦曰玄冬亦曰三冬上\n日寒風嚴風　寒景冬景\n時日　凜辰\n鳥曰　寒鳥寒禽亦曰哀禽\n草木　草曰寒卉寒葩木曰寒木寒柯寒條祁\n天曰天風\n寒歲云昔矣　政失於冬\n平秩朔易"},{"id":"juan1-046","source":"正文","juan":"卷第一","menu":"冬第三十一","sub_menu":"〇立冬　附冬門","page":"四八","leaf":"二十一ウ","text":"立冬日水始冰威德在水\n迎冬於北郊　立冬日\n啟開　立冬\n司閉　丹鳥氏以立秋來立冬去\n書雲物　夏"},{"id":"juan1-047","source":"正文","juan":"卷第一","menu":"冬第三十一","sub_menu":"〇冬至　附冬門","page":"四八","leaf":"二十一ウ","text":"至之日蚯蚓結　水泉動\n日短至　陰阻陽爭日短星昴宵月長晝短陰極陽生\n冬至生　僖五年正月辛亥朔日南至公視朔遂登觀臺以望而書禮也為備書雲物\n復長　王燭寶典曰十一月建子周之正月冬至日極南影長陰陽日月萬物之始當黃鍾律其管最長故有頌長之賀朝賀\n冬至日百寮稱賀因大會其儀亞於歲朝"},{"id":"juan1-048","source":"正文","juan":"卷第一","menu":"冬第三十一","sub_menu":"漢雜事　門注","page":"四八","leaf":"二十一ウ","text":"宋書朝賀享祀皆如元日之儀又曰魏至之月助養元之事\n開關　易曰以至日開關商旅不行后不省方\n祀昊天上帝　見十一月注\n禮歲時記曰共工氏不才子以冬至日死為人厲畏赤豆故作赤豆粥以禳之\n進履襪　後魏北涼司徒崔浩女儀云近古常以冬至進履襪於舅姑始也又見上注\n影長　尺有五寸　影長一丈三尺夏至日在東井影短\n〇十月　附冬門日在房律中應鍾\n地始凍\n賞死事恤孤寡\n祭司寒　命有司祭司中司命司人\n坏城郭戒門閭修鍵閉備邊境完要塞謹關梁\n[承前十月門]\n飭喪紀　辨衣裳審棺椁之薄厚\n陳祭器　物勒工名以考其誠工有不當必行其罪\n火齊必得　兼用六物\n酒官監之　無有差貸\n曰良月　十月也就盈數也\n十月之交　詩\n亥日水始冰　十月節也後五日地始凍後五日野雞入\n大水化為蜃　雉入大水為蜃\n察阿黨　則罪無有掩蔽\n築城郭　造宮室穿竇窖修囷倉禮\n謹蓋藏　循行積聚無有不斂\n天子始裘祀神州地祇　注云立\n冬日虹藏不見　中氣也後五日天氣上騰地氣下降後五日閉塞而成冬\n小雪日　十月農功畢當正齒位\n大飲\n易關市　來商旅納貨賄期便人事四方來集遠鄉皆至則財不匱上無乏用百事乃遂\n蒸勞農以休息之　屬蜀人飲酒以為天下取怨于\n牧水澤之賦　無令侵削北人以為天下取怨于　下注云賦魚鹽菇澤賦\n殞蘀　詩十月殞蘀　蟋蟀入我\n詩　滌場　籓垣也場功畢入也\n穫稻納禾稼　黍稷重穋禾麻菽麥　上入執于公曰晝爾于茅宵爾索綯亟其\n儲畜　崔寔注月令曰十月遂人事　　五穀既發家儲畜乃順時令\n新年　周禮天府掌季冬陳\n孟冬　月也　注此純陽用事嫌於無陰故曰陽月\n冱寒其始播百穀　注下正日占貞問\n歲之美惡問　謂問龜也\n〇十一月　附冬日在　　律中黃鍾　十一月也\n箕律中黃鍾之日盛發　十一月也\n內宰申宮令審門閭　貴賤近習無有不禁\n祈祀　大川\n農有不收藏積聚者馬牛畜獸有放逸者取之不詰\n有能取蔬\n食田獵者有司教道之祭馬\n井泉　無有不椟\n名源\n日短　見周官新書之時　水之月　大雪日鶡\n鳥不鳴　十一月節也後五日虎始交後五日荔挺出\n土事無作　謂發天地之房諸蟄則死人必疾疫又隨以喪　無發室屋及起大衆以固而閉地氣且洩是\n[承前十一月門]\n食　承上葉「有能取蔬食」\n伐木取竹箭　此時堅成可用\n君子處必掩身無躁　事欲靜以待陰陽之所定　注順時氣也\n一之日于貉　取彼狐狸為公子裘　于貉往博貉也\n罷官之無事者　去器之無用者　注先時猶有變作　天地閉藏萬物休可以去之"},{"id":"juan1-049","source":"正文","juan":"卷第一","menu":"冬第三十一","sub_menu":"塗闕廷門閭","page":"五〇","leaf":"二十二ウ","text":"〇十二月　日在南斗　律中大呂　二之日栗烈　十二月\n僕夫七騶咸駕　載旌旐授\n車以級整設于屏外有司搢朴北面而誓之　誓罰以軍法也\n修寢廟畋獵之禮\n窮于次　月窮于紀星迴于天數將幾終歲且更始\n專其農民無有所使　注役則志散失業\n大儺旁磔　以送寒氣\n小寒日鴈北\n鄉　十二月節也後五日鵲始巢後五日野雞始雊\n將帥講武　注習射御角力　注備田獵也\n乃教田獵以習五戎班馬\n政乃　百神　於南郊為來年祈福於天宗日月星辰之屬\n大寒日雞始乳　中氣也後五日鷙鳥厲疾後五日水澤腹堅\n始出土牛\n漁　天子親往嘗魚先薦寢廟\n冰方盛　命取而藏之\n冰已入　令告人出五種命農計耦耕事修耒耜具田器　注云農亭將興修田器也\n制百縣　合諸侯制百縣為來歲受朔日與諸侯所貌於人\n歲獻　凡在天下九州之人無不咸獻其力以供皇天上帝社稷寢廟山林川澤之祀　注人非神福不生\n大習\n晚見立春　注宜近土　論時令以待來歲之宜\n飭國典　懸法象魏故於此奧公獨先斂之\n以示農耕之早\n輕重之法　賦職之數以遠近土\n為度以給郊廟之事無有所私\n吹而罷收秩薪柴　以供郊廟及百祀之薪燎\n獻耒　武功各私其\n耕　詩二之日于其同載纘\n季冬　梁元帝纂要云十二月暮冬　涂月　亦曰暮節　歲窮　總窮\n第三十三　黑地陰文門類標題\n大歲　爾雅云在甲曰閼逢\n鑿冰沖沖　詩\n太歲　在乙曰旃蒙　在丙曰柔兆　在丁曰彊圉　在戊曰著雍　在己曰屠維　在庚曰上章　在辛曰重光　在壬曰玄黓　在癸曰昭陽\n[承前歲名門]\n歲陰在午曰敦牂　在未曰協洽　在申曰涒灘　在酉曰作噩　在戌曰閹茂　在亥曰大淵獻　在子曰困敦　在丑曰赤奮若"},{"id":"juan1-050","source":"正文","juan":"卷第一","menu":"月陽第三十四","sub_menu":null,"page":"五一","leaf":"二十三オ","text":"月在　甲曰畢　在乙曰橘　在丙曰脩　在丁曰圉　在戊曰厲　在己曰則　在庚曰窒　在辛曰塞　在壬曰終　在癸曰極"},{"id":"juan1-051","source":"正文","juan":"卷第一","menu":"寒第三十五","sub_menu":null,"page":"五一","leaf":"二十三オ","text":"謀時寒若\n洪範\n急恒寒若　咎徵\n保徵　咎徵\n孟冬祈寒　小人怨咨\n冱寒　嚴氣外　北戶塞扉寒往則暑來\n地始坼　外沍嚴凝　天地嚴凝之氣始於西北此天地之義氣也　歲寒氣惣至人力\n祭司寒　藏冰\n不堪其苦皆入室　水澤腹堅室處　曉我婦子曰為改歲入此室處言窒也　火烈而清風而戒寒\n國冬日之陽　諱物歸之\n冬日之陽　可愛也\n在陰時則慘　於天上章北浦寒之中人　師人多寒　撫兔\n大寒之日　鷙鳥厲疾　歲寒然後知松柏之後彫　隔水凍浮六尺\n土如挾纊　若寒甚之野爐\n儧指　漢北若寒甚之野爐\n歲寒然後　知松柏之後彫\n冰厚六尺\n凌競\n縕袍　顏賈\n年　異苑曰晉太康二年南州人見\n其以風也　種于六宗　月也星也辰也水旱也\n發風寒栗烈也　寒氣凍著　飲水於春　重令衣\n為火無光　文朱火青無光蘭　高月堂白發煙也\n巢　暴風激泠　夕雪早以掃路\n凝冱　冰冰崩\n行積冰　之瞌文\n鳥失儔　失蕩文　鳥登木而群　衣文子偷狐　衣貉　龍裘狐\n一裘行一寒一暑　易曰日月運雨雪　詩其滂　感\n無衣無褐何以卒歲淒\n[承前寒門]\n貉之厚者不夏至\n苦寒行　魏武苦寒行曰人馬同時飢擔行取蘇斧木持作糜粥也\n寒士卒僵凍死　漢至齊人馬凍死\n大寒人馬凍死\n毒害　漢雲臺興武上表曰今日六葉遇為死\n恒十有二三\n黃竹詩　穆天子傳雨雪有凍死人　天子作黃竹詩以憐之\n涉水　戰國田單\n消明日烱不\n華閃威有集\n寒民不敢不補復孰不甚君不寒民寒公善之　公寒無襲池表白君亦裘襲重態帝四隊一月火故不\n入地水厚一丈凍入地一丈　廣雅北方地苦寒　稜稜霜氣風威\n吹律　辮子吹律召溫風至人名黍名"},{"id":"juan1-052","source":"正文","juan":"卷第一","menu":"熱第三十六","sub_menu":null,"page":"五二","leaf":"二十三ウ","text":"夏暑雨夏日之陰物　暑往則寒　夏日之日可畏當暑\n蘊隆蟲蟲熱早　詩曰我　瘅暑\n炎風　畏火雲云\n景　流金爍日　祖暑　月炎炎赫赫熾滌熱氣云我無所底身\n如懷如焚　陝療曰熱如火燒　憂心如熏爛　熇州雲云漢旱魃\n暑之渴暑者　六月土閏溽暑喝者　反凍於冷風不熱　撅玄冰九飛雪嚴六王六甲之符\n交扇　汗漿著故衣食白熱粥卻曰暑蒸羲不燥此　風雲欎蒸其如火　天地赫赫上蒸時燠\n恒燠種于六宗　見寒門注　秦絕河榭獸專至夏大歊云以邇一壽蕎麻\n縶　管子曰善為國者　淮南子曰南方之極自北方之界　祝融主夏風之野　赤帝祝融之所司　神異經北方增冰之下土中有䰠\n太陽寒耕而熱耘\n龍不草木肉重萬斤　暑有暍　暘燥候曰有塵如太罕　身熱阪　漢書西域\n[承前熱門]\n曰劇貫遣廱大小頭痛支山赤土　黑熱阪令人身熱無色頭痛嘔吐\n忍暑者"},{"id":"juan1-053","source":"正文","juan":"卷第一","menu":"陰陽第三十七　　附望氣","sub_menu":null,"page":"五三","leaf":"二十四オ","text":"立天地之道曰陰與陽\n一陰一陽之謂道\n五月陰陽交死生　令月冬夏禾爭陰陽之和三合\n萬物負陰而抱陽沖氣以為和　老子　陰陽家流\n德刑　大冬蓮什斯冠陽為德陰為刑　禱於虛室不用之地以見天怔德不住刑\n陰不堪陽從陽　暖夏伏陰冬夏為炎　遷陰陽鍋相得　禮云陰〇望氣附陰陽門\n保章氏　以十二歲之相觀天下妖祥以五雲物辨吉凶水旱豐荒之祲祥以十二辰皆有風吹其律以知和否　眠祲掌\n十煇之法以觀妖祥　一祲二象三鑴四監五闇　日月六瞢\n經七彌　白曲\n彌天八敘　雲有水敘如\n九隮　隮升氣也\n十想\n氣相侵　二象雲如赤鳥　三鑴㨂氣　五闇\n新垣平以望氣見　黃文"},{"id":"juan1-054","source":"正文","juan":"卷第一","menu":"元日第三十八","sub_menu":null,"page":"五三","leaf":"二十四オ","text":"正月朔旦月正元日　書　春王三朝　頁正三朝\n覆端於始歲惟\n更始　四序自始\n正朝元日朝三元　歲之元日之元時之元　正旦自祚開元蚋祐歲歲發\n春開申子於新曆　賀風羔　於上春　七十二候之初　旬之卷　三百六　進酒\n索菊酒　荊楚歲時記曰正月一日懸葦索於戶陽之　爆竹枇人則痛惡爆竹之聲\n椒栢酒　祝椒酒以獻之　讀鰤菩曰開歲首\n桃梗磔雞懸羊　縣桃覆磔雞於門以禳惡氣　放鵄　孔叢子曰邯鄲人以正朝獻鵄於趙子闕子天慨屋信\n[承前元日門]\n正旦鶏生　恩此得留\n五辛盤　上記正月元日食五辛練形注云五辛皆是所以發五藏也　莊子曰春月飲酒茹葱以通五藏　仙木造桃\n服之仙木象拔起\n戶謂之仙木　山采曰見所長\n稱觴　崔寔月令云元日進酒降神真室以尊卑列於先祖之前各上椒酒於家長稱觴舉壽欣欣如也\n重席　漢記東觀\n不通郡舉其席墨乃邊至三十席\n獻椒花之頌　劉臻妻元日獻椒花頌\n椒栢華之觴　進柏酒　歲曰\n宿歲　劉臻是起歲暮家宗之膳\n敬鳩　幽鳩沛公避難有\n歲除興呂雕胡米　葛期臘朝末一端月　元日端月　玉燭寶典云\n爆竹　以辟山臊惡鬼　異里去山臊者莊西方深山中長尺餘犯之則病畏爆竹聲　進穰酒　崔寔月令正日進椒栢酒是矣　人尚老柏亦是仙藥又去進酒　六葉樅少者至老\n首祚\n王羲之月儀書曰佳月泰元正道萃太　於戶上懸幡於其旁而\n帖畫雞　百鬼畏　荊楚歲時記為　北采菫菜\n藁吉厭徵陽鹽帝屠蘇無不至和神篆養素"},{"id":"juan1-055","source":"正文","juan":"卷第一","menu":"人日第三十九","sub_menu":null,"page":"五四","leaf":"二十四ウ","text":"七日為人　董勛問禮俗曰正月一日為雞二日為狗三日為豬四日為羊五日為牛六日為馬七日為人　則正旦畫雞於門七日以彗人於上艮為此也\n金勝　歲時記人日以七種菜為羹翦綵為人勝以彩勝相遺或鏤金箔為人勝以貼屏風亦戴之頭鬢　又造華勝以相遺圖之形　梅花粧　武帝壽陽公主日梅花落額上成五色後人効為　稽董勳\n檮花　正月七日厭日惟人此出鄴中醫生述　鉦亂　煎餅　又此日食煎餅於庭中俗去薰天\n人勝銘　魏東平王會是日賞壽張縣吳民山寡曰\n問俗時則因慈　注是上　考譯氏之見儀事乃不以風　劉臻妻陳氏進見儀人日　曰正月七日上人日\n荊楚歲時記云正月七日為人日\n鏤人　碑屏風上亦覺之頭賞舊勸　問禮俗云人不滿年寓以綵新\n正月十五日第四十　黑地陰文門類標題　作膏桐\n門　王燭寶典曰正月十五日祭門祀蠶州戶\n祭門　見紫姑卜　荊楚歲時記　記今州里風俗篁月祭門先以楊枝插門插腸粉以飲食為且咒之\n[承前葉「正月十五日第四十」門]\n之膏　續齊諧記曰月半昔吳縣張成夜　　　　立宅東南角舉手招成曰此地是君蠶室我即此地之神明\n年正月半宜作白粥泛膏於上以祭我當令君蠶桑百倍神言訖失所在如其言年年大得蠶或云神降陳氏之家云蠶神也\n劉敬叔異苑曰其夕迎紫姑神以卜本人家妾為大婦所嫉　　　正月十五日感激而死故代人至日作其形迎之咒云子胥不在曹夫已行小姑可出　子胥婿也　曹姑大婦也\n祀太一　史記樂書曰漢家祀太一昏時祀到明\n乃望上元　正月十五日為上元\n隨國之會　西域記摩　　國正月十五日僧徒俗眾雲集觀佛舍利放光雨花\n三五之夕\n三五良辰\n秉燭之遊\n行藥　月維中氣　上元\n日則試鼓\n此欄小注漫漶不辨"},{"id":"juan1-056","source":"正文","juan":"卷第一","menu":"晦日第四十一","sub_menu":null,"page":"五五","leaf":"二十五オ","text":"孟春晦日\n月晦酺聚飲　玉燭寶典曰元日至晦日人並酺食士元醮又臨河祓度尼陋賞麗\n荊楚歲時記云元日至晦日並酺食也\n灞澗酹酒\n階　月桂盡　謂月既也\n陣不遠晦　犯天忌\n月晦　提月　公羊傳撰月\n────────────────────────────────────────\n美\n月桂盡　晦謂\n陣不遠晦　犯天忌\n月晦　荊楚歲時記曰正月晦日有　望以正月為初年時俗重之以為節\n提月　　何休注撰月晦也曰是月之義盡也魯當實盡\n一辰為實\n社第四十二\n漢高祖天下定詔御史令治枌榆社春羊彘祠之　荊楚記　　　社\n會句龍　共工氏有子曰句龍能平水土故祀以為社\n擇元日　月令擇元日命民社為社稷吉事與故祭之以祈穀\n白社"},{"id":"juan1-057","source":"正文","juan":"卷第一","menu":"中和節第四十三","sub_menu":null,"page":"五五（續）","leaf":"二十五オ・左半","text":"時惟太平　日方初吉\n作為令節　仲春以居\n發揮陽和　幽棲賾頌\n授人時\n仲序中和\n助發生之德　　覃作解\n助陰陽之交泰　表天地之和\n當太平之\n昭代之良辰　晨蜀初吉\n國家授時建節　佛物國儀\n詩二月初吉　朝日"},{"id":"juan1-058","source":"正文","juan":"卷第一","menu":"寒食第四十四","sub_menu":null,"page":"五五（續）","leaf":"二十五オ・左半","text":"清明荊……〔接次葉〕\n────────────────────────────────────────"},{"id":"juan1-059","source":"正文","juan":"卷第一","menu":"寒食第四十四","sub_menu":"「寒食第四十四」門續","page":"五六","leaf":"二十五ウ","text":"……楚歲時記　去冬至節一百五日即有疾風甚雨　謂之寒食\n魏武之令　魏武帝時明罰令曰聞太原至鴈門冬至後一百有五日皆絕火食云介子推且北方沍寒之地老小羸弱將有不堪之患令到人不得寒\n食若犯者家長半歲刑主吏百日刑令長奪一月俸\n周舉之書　後漢周舉遷并州刺史太原舊俗以介子推　　龍忌之禁\n移書於子推廟\n一月寒食　注見上\n三日斷火　云寒食一月老小不堪今則三日而已\n離　賜粥　玉燭寶典曰今人研杏仁煮作粥\n鬥雞　玉燭寶典曰此篇城市尤多鏤雞相飼豈遺跳蹋別錄\n蹋鞠　古今藝術曰蹋鞠本兵勢也所以練武士知有材也\n韓鞬\n遺麥粥　齊魏收中記景朱麥粥　祭文\n禁火之辰　內火　傳以出內藏也\n介子推之遺風　魏武帝令\n火禁同煙　周禮司……〔接左半〕\n清明為同\n────────────────────────────────────────\n烜　司烜氏仲春以木鐸修火禁於國中注謂季春將出其火也"},{"id":"juan1-060","source":"正文","juan":"卷第一","menu":"寒食第四十四","sub_menu":"〇　注洞明　食門","page":"五六（續）","leaf":"二十五ウ・左半","text":"三月之節　日在婁\n清明為\n桐\n三月三日第四十五\n上巳　漢\n始華　清明之日\n鑽燧改火　以順陽時氣　春取榆柳之火\n改火之辰\n禮儀志曰三月上巳日官人並禊飲於東流水\n元巳辰　文選暮春之序元巳之辰\n修禊事　王羲之序曰永和九年歲在癸丑暮春之初會于會稽山陰之蘭亭脩禊事也羣賢畢至少長咸集\n永日宋書曰自魏巳後但用三日不用上巳\n祓禊　祓除疾病　禊契曰永上　國羲\n溱洧詩　韓……\n曰三月桃花水　鄭國之俗上巳於溱洧之上執蘭招魂祓除不祥\n解神\n祓於洛　張裴之言　或問昨宵遊有何語識者曰張\n竹林七賢論王濟常解禊洛水\n導善說史漢裴逸人言往行歷歷可聽\n禊南澗　豫……始……\n會東堂　晉起居注泰和六年三月三日臨流林池像\n義序汐暮春之\n禊於南澗水濱之\n煉堂　南浮橋　夏仲御傳曰仲……南浮橋簡禊仲……\n洛三月三日王公莫不……連鑣並於曲杯流水\n────────────────────────────────────────\n「三月三日第四十五」門續\n四民三日為漬杯水之飲\n氏秦蒿菜汁和蜜為米以厭時氣\n饋車　上有……車……\n曰會曰賓客於洛水酌　　以\n露露周輿黎之商後果覓\n八公山　宋武帝三月三日登八公山　劉安\n周公卜邑於洛羽\n雜露歌　商上巳\n觴隨波　續齊諧記云晉武帝問尚書郎摯虞三日曲水其義何　　漢章帝時平原徐肇以三月初生三女至三日俱死一村以為怪乃相與攜之水濱盥洗因流以濫觴故逸詩曰羽觴\n秦王置酒於河金人捧劍\n小起此帝曰若如所論便非嘉事尚書郎束晳曰摯虞小生不足以知臣請說其始\n隨波　又秦昭王三日置酒河曲有金人自泉而出捧水心劍曰令君制有西夏因立為曲水\n賦集　執蘭　見上曲水注\n祓除　黃春\n禊　宋書漢有鄭上侯著三月三日上辰……\n之永和之春癸丑之歲\n蘭亭\n曲洛　周禊……\n華林　晉朝上巳集華林園也\n三日　流為床書巳\n後但用三日不用上巳……\n────────────────────────────────────────\n後但用三日不用上巳日\n東流水　宋書漢有鄭上侯著三月上巳產二女並不育俗以為大忌故此月此諱在家皆被禊於東流水上\n五月五日第四十六\n端午　周處風土記仲夏端五也\n角黍　今之\n浴蘭　大戴禮云五月五日以蓄蘭湯沐浴\n懸艾　荊楚歲時記曰五月五日荊楚人皆蹋百草採艾為人懸於門戶以禳毒氣　本索　五色為門戶飾以逐惡氣　赤竹村\n抱朴子或問避五兵之道以五月五日若赤靈符於心前\n祭屈　續齊諧記曰楚大夫屈原以五月五日投汨羅而死楚人哀之　　以五月五日夜以竹筒貯米祭之\n間大夫曰常苦蛟龍所竊廟　　以五色絲纏之則蛟龍所畏\n祠陳　後漢陳臨為蒼梧太守推誠而理臨徵去後本郡\n渡　後人以舟楫裝之遂因而為俗\n城外今小童絜服而無辭\n競　渡\n胡廣　世說云胡廣本姓黃以五月五日生惡之　　子\n荊楚歲時記屈原以是日投汨羅死　巡江中胡公見收養為己子\n曹娥\n異苑曹娥父盱以五月五日溺水死娥巡江號哭七日遂投江三日後負父屍俱出\n五日良時\n長命縷\n辟兵繒　見抱朴子\n菰葉\n────────────────────────────────────────\n「五月五日第四十六」門續\n以象陽相蓋裹　風土記云\n續屬月綵　雙脩索　詩曰縈臂\n採艾　荊楚歲時記曰宗則文常以五月五日雞未鳴時採艾見似人處攬而取之\n鬥百草　荊楚記曰四人蹋百草　今人又有鬥百草之戲\n競渡　傳云越地\n有蓋甲藥　又曰是日競採雜藥　夏小正云此日蓄藥以除毒氣也\n起於城已\n蓋屋　曝席薦　風俗通云此月蓋屋令人頭禿　又云五月五日曝席薦異兆而\n失所在因相　　新野庾家嘗於五月五日曝席薦忽見一小兒於席上俄而\n傳次為忌　多疾病則\n艾草先生　艾草先生\n初便為秋夏交會之辰　金火伏藏之日　故至庚日必伏庚者金也故曰伏日"},{"id":"juan1-061","source":"正文","juan":"卷第一","menu":"伏日第四十七","sub_menu":null,"page":"五八","leaf":"二十六ウ","text":"三伏　陰陽書曰夏至後第三庚為初伏第四庚為中伏立秋後\n後伏　曆忌釋曰立秋以金代火也金畏火故曰伏日\n一時之暑　典略曰劉松袁紹於河朔三伏之際晝夜飲酒　　至於無知避一時之暑故河朔關有避暑之飲\n秦修祠　史記秦穆公始為伏祠　漢晦日俗風\n所祠黃石　史記留侯既得黃石留……〔接左半〕\n────────────────────────────────────────\n通曰漢中巴蜀高祖用張良之策還定三秦蓋君子所\n祠黃石　史記　侯　　得黃石而葬每上\n因者本論功加金帛重復寵異令擇伏日不同凡俗\n家伏臘　漢書曰伏日賜肉太官方朔割制\n賜肉　肉曰伏當早歸即懷肉而去\n金藏之日　秋夏之交　初伏　史記秦德公三年初伏注云\n六月上伏　日秦始置\n元陽徂暑　伏臘之費　敦牂酪\n七月七日第四十八\n牛女　天均齊記云桂陽城武丁有仙道忽謂其弟曰七月七日織女當渡河暫詣牽牛吾同巳被召代人至今云織女嫁牽牛\n穿針　乞巧　荊楚歲時記七夕婦人以綵縷穿七孔針陳几筵酒脯瓜果於庭中以乞巧\n乞巧\n或云見大漢中舜白氣有光五色以為徵應見者便拜得福\n緱山鶴　仙傳王子喬見桓長曰告我家七月七日待我緱山頭至時果乘白鶴於山頭望之不得到卑\n曝腹　郝隆七月七日曝腹於庭中人問之曰曬書\n憤鼻　竹林七賢傳七月七日諸阮\n謝時人數日而去\n七月七　歲事七月七日上於承華殿齋　東方朔……\n四王母　漢……\n────────────────────────────────────────\n「七月七日第四十八」門續\n日西王母欲來有青鳥王母至有二青鳥侍王母傍\n靈匹\n靈匹　河鼓　爾雅曰河鼓謂之牽牛　代傳竇后少小頭禿不\n墉光　家人所因遇七夕人皆看\n織女獨不許后出乃看　神光照室為后之瑞\n作麴合藥　　　　　四人月令云其日作麴合　　蜀漆丸\n曝經書　乃永虔素\n七日　良辰\n七月十五日第四十九\n日在張　七月中氣　日在張　建申　伍之中\n孟秋之望　十五\n三五良辰\n中氣　見上\n中元　道經云七月十五日中元地官勾搜選眾人分別善惡以其日作玄都大獻於玉京以世間奇異幡幢寶蓋供養之具精膳飲食獻諸眾聖道士於其日講誦若經十方大聖高詠靈篇\n孟蘭盆　孟蘭盆經云目連以母生餓鬼中佛令作孟蘭盆至七月十五日子孝順若以應奉孟蘭盆供養以百味五果以蓋盆中供養十方大德而後母得食目連白佛凡弟佛言大善後世因之廣為華飾\n九月九日第五十\n登高　續齊諧記汝南桓景隨費長房遊學　長房謂曰九月九日汝家當有災異急令家人縫絳囊盛茱萸繫臂登高飲菊花酒此禍乃消景從其……\n重陽　魏文帝書曰歲往月來忽復九月九日為陽數兩月……\n────────────────────────────────────────\n而重陽……言還家登山夕還見雞犬一時暴死　今人九月九日登高是其事\n龍山落帽　孟嘉傳曰嘉為桓溫參軍九月九日溫遊龍山參寮畢集風吹嘉帽落如廁不覺溫令孫盛嘲之嘉素亦落之\n白衣菊酒　晉陽秋曰陶潛九月九日無酒宅邊菊叢中摘見白衣人至乃王弘送酒便飲醉\n戲馬臺　南　……宋書宋武帝為宋公時在彭城九月九日遊項羽戲馬臺今相承以為舊事\n佩茱萸　西京雜記武帝宮人賈佩蘭佩茱萸食蓬餌飲菊花酒\n賜菊　魏帝與鍾繇書曰九月九日草木遍枯而黃菊紛然獨秀\n授衣之月\n落帽之辰\n馬射　晉書九月九日馬射或說云秋金之節武習射象立秋"},{"id":"juan1-062","source":"正文","juan":"卷第一","menu":"歲除五十一","sub_menu":null,"page":"五九（續）","leaf":"二十七オ・左半","text":"日窮于次　月窮于紀　星回于天數將幾終歲且更始\n大儺旁磔以送寒氣驅疫　呂氏春秋注云前歲一日擊鼓驅疫癘之鬼謂之逐除亦曰儺\n宿歲　荊楚記曰歲暮家家具肴蔌為宿歲之儲\n日月其除　卒歲　送寒迎……\n────────────────────────────────────────\n春三百六旬之盡　七十二候"},{"id":"juan1-063","source":"正文","juan":"卷第一","menu":"閏月五十二","sub_menu":null,"page":"六十","leaf":"二十七ウ","text":"以閏月定四時成歲　堯典\n周禮閏月詔王居門終月　門露寢之窮……門也\n天子居明堂無室位則闔門左扉立於其中　閏以正時\n歸餘於終　閏月也\n數扐　歸奇於扐以象閏\n閏月不告朔非禮也　不告閏朔非時政也何以為畏\n閏月附月之餘日　積分而成於月也\n餘分　說文曰餘分之月　五歲再閏\n閏三月　文元年閏三月非禮　歸餘於終　經事則不告合在僖公未年\n積閏　匪來期於積閏　氣逐移閏"},{"id":"juan1-064","source":"正文","juan":"卷第一","menu":"臘五十三","sub_menu":null,"page":"六十","leaf":"二十七ウ","text":"虞不臘矣　左傳　夏曰嘉平　殷曰清祀　周曰大蜡\n風俗通漢改為臘　禮傳伊耆氏始為蜡　蜡者索也　歲十二月合聚萬物而索……\n────────────────────────────────────────\n「臘五十三」門續　卷第一末葉\n饗之三者各以其行盛日為祖衰日為臘　漢以火德火衰於戌故戌日為臘\n魏以土德土衰於辰故辰日為臘\n晉以金德金衰於丑故丑日為臘\n臘與蜡同　漢舊儀曰臘者報有功　報鬼神聖……"},{"id":"juan1-065","source":"正文","juan":"卷第一","menu":"臘五十三","sub_menu":"諸具蜡門蜡","page":"六十（續）","leaf":"二十七ウ・左半","text":"祠黃石　史張良於下邳圯上見異人得書云穀城下黃石我也果取而寶祠之留侯死并黃石葬焉　門在祭邵\n賢有功　〇祭邑獨斷曰臘者歲之終大祭從於民\n王氏臘　謝承後漢書曰浦國陳威為吳尉監至主簿其位還家杜門薺改易漢法令及臘日威言我之先相何……\n送　吏民宴飲非迎氣故但送不迎也\n知王氏\n盜樹　陳留志曰浣喬邑人臘之終夕逾斫其樹人有告喬同僚不聞　邑人愧而歸之喬曰卿臘日眾家欲與父母相歡姆耳\n竊食　萊山松後漢書曰韓卓字子助陳留人臘月\n椒食　祭其先人卓行　養生要十二月臘夜令人持椒井旁無與人言內椒井中除溫\n兔臑　風俗通曰兔臑俗說正祖良得者善其心即日免之\n議臘之　晉博士張亮議曰臘接一祭宜在新故交接也俗謂人吉利\n議臘　晉博……明日為初歲奉正……漢已來有賀此皆古之遺語\n白氏六帖卷第一終"},{"id":"jiaokan-001","source":"校勘表","juan":"卷第一","menu":"目錄 第二卷","sub_menu":null,"page":"印刷頁七","leaf":null,"text":"【校勘】位置：目錄 第二卷（印刷頁七）\n本稿（改定後）：寶貨布帛\n初錄（書影釋讀）：寶貨[?]貝帛\n參校本：寶貨、布帛\n處理：從參校本\n依據與說明：末二字漫漶，參校本作「布帛」，文義可通，據改。"},{"id":"jiaokan-002","source":"校勘表","juan":"卷第一","menu":"目錄 第八卷","sub_menu":null,"page":"印刷頁七","leaf":null,"text":"【校勘】位置：目錄 第八卷（印刷頁七）\n本稿（改定後）：貞儉恭慎傲慢勇壯\n初錄（書影釋讀）：貞儉恭懼傲慢勇壯\n參校本：貞儉恭慎，徽慢勇壯\n處理：從參校本\n依據與說明：「懼」當作「慎」，參校本可證；參校本「徽慢」則為「傲慢」之誤，不從。"},{"id":"jiaokan-003","source":"校勘表","juan":"卷第一","menu":"目錄 第十卷","sub_menu":null,"page":"印刷頁七","leaf":null,"text":"【校勘】位置：目錄 第十卷（印刷頁七）\n本稿（改定後）：離別贈貺\n初錄（書影釋讀）：離別贈餞\n參校本：離别贈貺\n處理：從參校本\n依據與說明：本稿初錄作「贈餞」，參校本作「贈貺」，二者形近義通。依全稿體例，兩本互異而各有可通者一律從參校本，故從「贈貺」，「贈餞」以〔一作〕並存。"},{"id":"jiaokan-004","source":"校勘表","juan":"卷第一","menu":"目錄 第十二卷","sub_menu":null,"page":"印刷頁七","leaf":null,"text":"【校勘】位置：目錄 第十二卷（印刷頁七）\n本稿（改定後）：俸祿舉選\n初錄（書影釋讀）：儉祿舉選\n參校本：俸祿舉選\n處理：從參校本\n依據與說明：「儉」為「俸」之誤識，據改。"},{"id":"jiaokan-005","source":"校勘表","juan":"卷第一","menu":"目錄 第十三卷","sub_menu":null,"page":"印刷頁七","leaf":null,"text":"【校勘】位置：目錄 第十三卷（印刷頁七）\n本稿（改定後）：斷獄拷□評議□改制贓賄冤獄\n初錄（書影釋讀）：斷獄刑罰評議□政制臧□寬贖\n參校本：斷獄拷評、議疊改制、贜賄冤獄\n處理：參校補定\n依據與說明：此行正當書口摺縫，漫漶最甚。據參校本改「刑罰」為「拷□」、「臧□寬贖」為「贓賄冤獄」，仍餘二字不可辨。此條可信度最低，務請覆核。"},{"id":"jiaokan-006","source":"校勘表","juan":"卷第一","menu":"目錄 第十四","sub_menu":null,"page":"印刷頁八","leaf":null,"text":"【校勘】位置：目錄 第十四（印刷頁八）\n本稿（改定後）：封建嗣蔭\n初錄（書影釋讀）：封建嗣襲\n參校本：封建嗣蔭\n處理：從參校本\n依據與說明：「襲」當作「蔭」。"},{"id":"jiaokan-007","source":"校勘表","juan":"卷第一","menu":"目錄 第十五","sub_menu":null,"page":"印刷頁八","leaf":null,"text":"【校勘】位置：目錄 第十五（印刷頁八）\n本稿（改定後）：救援獻捷伏兵險阻\n初錄（書影釋讀）：伐兵\n參校本：伏兵\n處理：從參校本\n依據與說明：本稿初錄作「伐兵」。此門列於「救援、獻捷」與「險阻、戎狄」之間，所敘皆實際戰法，作「伏兵」為長；「伐兵」出《孫子》「其次伐兵」，係戰略層次之語，於此不類。從參校本。"},{"id":"jiaokan-008","source":"校勘表","juan":"卷第一","menu":"目錄 第十六","sub_menu":null,"page":"印刷頁八","leaf":null,"text":"【校勘】位置：目錄 第十六（印刷頁八）\n本稿（改定後）：資糧屯田\n初錄（書影釋讀）：貧[?]糧屯田\n參校本：資糧屯田\n處理：從參校本\n依據與說明：「貧」為「資」之誤識，據改。"},{"id":"jiaokan-009","source":"校勘表","juan":"卷第一","menu":"目錄 第十七","sub_menu":null,"page":"印刷頁八","leaf":null,"text":"【校勘】位置：目錄 第十七（印刷頁八）\n本稿（改定後）：禮儀享宴冠禮鄉飲酒\n初錄（書影釋讀）：禮儀冠子夏冕禮鄉飲酒\n參校本：禮儀享宴、寇禮、鄉飮酒\n處理：從參校本\n依據與說明：初錄「冠子夏冕禮」不成文，參校本作「享宴、冠禮」（「寇」為「冠」之誤），據改。"},{"id":"jiaokan-010","source":"校勘表","juan":"卷第一","menu":"目錄 第十九","sub_menu":null,"page":"印刷頁八","leaf":null,"text":"【校勘】位置：目錄 第十九（印刷頁八）\n本稿（改定後）：喪服殯斂祭奠哭踊弔葬墳墓忌日\n初錄（書影釋讀）：喪服殯斂奠哭踢弔[?]乾廿[?]墳墓忌日\n參校本：喪服、殯斂、祭奠、哭踊、弔葬、墳墓忌曰\n處理：從參校本\n依據與說明：「踢」當作「踊」，「弔乾廿」當作「弔葬」，據改。"},{"id":"jiaokan-011","source":"校勘表","juan":"卷第一","menu":"目錄 第二十","sub_menu":null,"page":"印刷頁八","leaf":null,"text":"【校勘】位置：目錄 第二十（印刷頁八）\n本稿（改定後）：祭祀蒸薦宗廟\n初錄（書影釋讀）：蒸嘗\n參校本：蒸薦\n處理：從參校本\n依據與說明：依全稿體例從參校本作「蒸薦」，本稿初錄之「蒸嘗」以〔一作〕並存。惟「烝（蒸）嘗」為既有成詞，《詩·小雅·楚茨》「絜爾牛羊，以往烝嘗」，《禮記·祭統》「秋祭曰嘗，冬祭曰烝」，秋冬二祭合稱即「烝嘗」，後泛指宗廟之祭；本門所列皆祭祀之目，作「蒸嘗」於義為長，而「蒸薦」非成詞。此條之取捨純依體例，非謂「蒸薦」必是，仍請覆核原件。"},{"id":"jiaokan-012","source":"校勘表","juan":"卷第一","menu":"目錄 第廿二","sub_menu":null,"page":"印刷頁八","leaf":null,"text":"【校勘】位置：目錄 第廿二（印刷頁八）\n本稿（改定後）：儲蓄均輸\n初錄（書影釋讀）：儲蓄囷輪\n參校本：儲蓄均輸\n處理：從參校本\n依據與說明：「囷輪」為「均輸」之誤識，據改。"},{"id":"jiaokan-013","source":"校勘表","juan":"卷第一","menu":"目錄 第廿三","sub_menu":null,"page":"印刷頁八","leaf":null,"text":"【校勘】位置：目錄 第廿三（印刷頁八）\n本稿（改定後）：耕耘收穫農器百穀豐稔\n初錄（書影釋讀）：耕耘薪收穫農器□穀豐稔\n參校本：耕耘，收獲農器，百穀豐稔\n處理：從參校本\n依據與說明：衍「薪」字，缺字補作「百」。"},{"id":"jiaokan-014","source":"校勘表","juan":"卷第一","menu":"目錄 第廿八","sub_menu":null,"page":"印刷頁八","leaf":null,"text":"【校勘】位置：目錄 第廿八（印刷頁八）\n本稿（改定後）：諂佞讒怨黜辱\n初錄（書影釋讀）：謠佞讒怨黷辱\n參校本：諂佞讎怨、黜辱\n處理：從參校本\n依據與說明：「謠」當作「諂」，「黷」當作「黜」。參校本「讎怨」則為「讒怨」之誤，不從。"},{"id":"jiaokan-015","source":"校勘表","juan":"卷第一","menu":"卷一門目 第十五","sub_menu":null,"page":"印刷頁九","leaf":null,"text":"【校勘】位置：卷一門目 第十五（印刷頁九）\n本稿（改定後）：霰第十五\n初錄（書影釋讀）：霓第十五\n參校本：霰第十五\n處理：從參校本\n依據與說明：初錄作「霓」，參校本作「霰」，且正文該門引「先集維霰」「淚如霰」，作「霰」是。"},{"id":"jiaokan-016","source":"校勘表","juan":"卷第一","menu":"卷一門目 第十七","sub_menu":null,"page":"印刷頁九","leaf":null,"text":"【校勘】位置：卷一門目 第十七（印刷頁九）\n本稿（改定後）：雹十七\n初錄（書影釋讀）：電十七\n參校本：雹十七\n處理：從參校本\n依據與說明：初錄目錄作「電」，參校本目錄及正文陰文標題俱作「雹」，據改。"},{"id":"jiaokan-017","source":"校勘表","juan":"卷第一","menu":"卷一門目 第十八","sub_menu":null,"page":"印刷頁九","leaf":null,"text":"【校勘】位置：卷一門目 第十八（印刷頁九）\n本稿（改定後）：虹十八（正文作虹蜺第十八）\n初錄（書影釋讀）：虹十八
