n必文　改能\n陳元改過　漢仇覽為亭長有陳元者其母告元不孝覽曰昨過廬舍籬落修整此不是惡人當由化未至矣親至元家為陳孝道元後改過卒為孝子\n周處尋師　周處為鄉里所患後知之乃改行尋師見　除三害也\n宋杲　後漢宋杲性悍喜與人報讎郭林宗諭以義杲叩頭後至　州刺史\n林宗受賈淑之弔　後漢賈淑性險害邑里患之林宗遭母憂淑來修弔既而孫威直亦至見林宗賢而受惡人弔不進而去林宗遣追之謝曰賈子厚誠實凶德然洗心向善仲尼不逆互鄉故吾許其進也\n毀鴨　陸雲嘗詣吳昌侯據於堂前作鬬鴨頗施小巧雲正色曰君侯宜勤覽經典以自新何用為鬬鴨即時毀之\n知非　改過\n應詩人補袞之歌　周易\n喜復改轍　文選之義"},{"id":"juan13-057","source":"正文","juan":"卷第十三","menu":"待罪六十一","sub_menu":null,"page":"二二二","leaf":"二十三ウ","text":"陳首附\n席藁　應侯范睢失　席藁請罪\n免冠伏斧鑕　梁孝王既刺殺袁盎請朝茅蘭說王乘布車伏闕下待罪蘭大夫也\n季孫練冠麻衣跣行　傳晉責季孫意如意如待罪\n藉藁　王音坐藁以就刑也\n有罪不\n刑道　孔禮字德達當受馬台思台坐法當死禮私導　　　…\n因走陳首\n令　嗣而自首　太祖減罪一等\n逃亡自首　晉王坦之為　　時度卒士韓帳逃亡歸首云失牛故叛有司　考服罪坦之以帳吏身自歸遂原罪\n敢逃形命傳范滂　後漢誅黨人范滂詣獄縣令欲與之逃滂曰何故累君又令老母流離乎\n又巴肅　范滂事同\n待罪長沙\n負荆"},{"id":"juan13-058","source":"正文","juan":"卷第十三","menu":"有罪復用六十二","sub_menu":null,"page":"二二二","leaf":"二十三ウ","text":"魏尚　有罪　　…繫獄馮唐舉之…雲中太守匈奴畏之\n韓安國　下獄免官後起於獄中拜梁內史\n張敞起亡命　張敞有罪詣闕上印…後冀州有賊盜即從闕下亡命拜冀州刺史\n棄瑕錄用\n責功補過\n自效重以才難　許其功贖\n拔拭　朱　…元為左馮翊詔長陵大姓尚方禁而上　是何等禁其首服盜人妻見斫傳曰馮翊欲灑卿恥拔用御禁曰願效死也\n死灰重然\n秦赦孟　孟之罪\n漢　竇憲之功"},{"id":"juan13-059","source":"正文","juan":"卷第十三","menu":"恕第六十三　事具有過門又寬恕門雜用","sub_menu":null,"page":"二二二","leaf":"二十三ウ","text":"君子之道忠恕而已矣\n己所不欲勿施於人　子貢問曰有一言而可以終身行之者乎子曰其恕乎云云\n作不順而施不恕　仲尼謂臧武仲\n順　恕施\n尊賢而容眾嘉善而矜不能\n君子先人後己　禮\n內恕　孝之\n以身觀身\n克寬克仁　不知\n恕而已矣　仁遠乎哉\n易曰包荒　言包含荒穢也\n傳云含垢　國君含垢天之道也\n爾無忿疾于頑民必有忍乃有濟有容德乃大　書\n躬自厚而薄責於人\n掩匿細過　漢曹參見人有細過掩匿覆蓋之也\n嘔丞相車茵　見寬恕門\n羹爛汝手　見寬恕門\n奴誤射殺子不誅　宋則子年十歲與蒼頭共弩射弦斷矢激中則子死則恕不誅荀爽美之"},{"id":"juan13-060","source":"正文","juan":"卷第十三","menu":"誤認六十四","sub_menu":null,"page":"二二三","leaf":"二十四オ","text":"盜金　漢直不疑同舍郎亡金疑不疑不疑乃買金償之後乃明\n認馬　卓茂字子康為丞相使出行有人認其馬茂心知其誤默解與之挽車而去謂之曰若自得馬當以此馬於丞相府將來主得馬乃詣府叩頭謝還之\n盜絝　陳重在郎署有郎誤持鄰舍郎絝去主疑重重不自申說市絝還之後郎還絝事乃白\n認牛　劉寬字文饒為司徒有人失牛者就寬車中認之寬下車步歸有得牛者謝曰慙負長者寬曰物有相類事容錯誤幸勞見歸何謝之有\n認豕　魏曹節字元偉鄰人有亡豕者與節豕相類詣門認之節不爭後主得亡豕乃慙送謝節乃笑而受之\n失襦　晉桑虞字子深嘗宿逆旅同舍失襦疑虞盜之虞默然便解衣償之主人曰多恐獲狸翁主乃將襦主至虞家謝得襦還虞衣虞投而不受\n鑿冰下得犢　矢沖字巨容少有至行鄰人失犢認沖犢以歸後得犢於冰下大慙以犢還沖沖竟不受\n似是而非認稻　會稽　牧字子幹墾田二十畝臨熟縣人認之遂以稻與之縣長召民繫獄牧為之請長曰君子不受民置於道甚承宮長自行法牧遂出裝還山陰長釋民自止之民慙春稻得六十斛不受\n開荒被認　郭翻長　後作乃將　家貧無業欲墾荒田先表題經年無主然後　竟有認之者悉推與之令闕以施還勞無取者也\n不認禾　宮字子少避地於象陰山耕種禾稼將熟人有認之者宮不爭以與之\n盜璧　張儀事\n妙酒"},{"id":"juan13-061","source":"正文","juan":"卷第十三","menu":"錯誤六十五","sub_menu":null,"page":"二二四","leaf":"二十四ウ","text":"罪分故誤　取有過門事明\n法有誤論　罰有等差\n情匪誣欺　過宜何恕\n必先問罪　法當閱釋\n原情事雖乖於審慎　情且異於矯誣\n失傅　罪得\n失辭　口失\n闕爾面欺誠非巧詐之辜　請寬過誤之戾\n失傳雖昧於三思　過宜寬於無簡\n慎非石氏　雖慙數馬之敬\n設比鍾離　見賜縑之澤\n恕而已矣　仁遠乎哉\n誤宣　後漢郭躬字仲孫有兄弟殺人詔命報兄重論弟章謬宣兩報重帝令議罪躬議應誤\n奏對　夏侯勝質朴見時謂上為君誤相字於上上以是親信之也\n以十為百　後漢詔賜降胡縑以十為百帝怒將笞郎僕射鍾離意字子阿曰過誤之失常人所容若以懈怠為愆則臣位大罪重當先坐乃解衣就格帝意解乃赦"},{"id":"juan13-062","source":"正文","juan":"卷第十三","menu":"文字誤六十六","sub_menu":null,"page":"二二四","leaf":"二十四ウ","text":"書馬闕文責寧加於石建　石建為郎奏事事下建讀之曰誤書馬字與尾當五今四不足一獲譴死矣其懼慎如此也\n賜縑過數罪亦捨於鍾離　見上註\n五而闕一　十四為百\n一馬之闕　三豕之疑\n亥豕之疑　魯魚之誤\n移文有誤不以文害意\n掌以簿書　文字誤於\n寧免毫釐之差　不容筆削之改\n睹駮紕繆　誤也\n闕疑改正\n闕文　吾猶及史之闕文也\n失傳　有司失其傳也\n文不加點\n辨魯非魚"},{"id":"juan13-063","source":"正文","juan":"卷第十三","menu":"犯夜六十七","sub_menu":null,"page":"二二四","leaf":"二十四ウ","text":"警巡　西京賦云警夜巡晝\n夜事　周禮謂夜警守之事\n三巡　周禮掌固晝三巡夜亦如之注巡行以警言慎也\n夜三鼜以號戒　鼓也謂夜三擊鼓以巡戒之也鼜音戚\n霸亭夜獵　李廣將軍夜獵還霸陵亭長呵止之\n周禮禁行作不時者　謂晨行者\n國禁宵\n禁天街\n知禁犯禁　周禮司寤氏掌夜時謂早晚時也周禮\n以星分夜以詔夜士夜禁　禁行也夜士巡夜之士\n御晨行者禁宵行者夜游者　禁御亦禁也\n厭浥行露豈不夙夜謂行多露　詩\n禁御\n抵冒街禁\n國章扞摭\n行諸宵夜\n夜禁是干　犯禁罰罪\n宵行有故　以可徵辭\n將軍尚不得夜行　李廣霸陵亭尉呵止廣廣騎曰故李將軍廣曰尚不得夜行何為故也云云宿亭下\n受書犯夜　晉王承字安期為東海太守政尚清靜有犯夜者曰從師受書不覺日暮承曰鞭撻寧越以立威名恐非致化之本使吏送歸家\n誰何殺之　魏略傳曰太祖為洛陽北部尉造五色棒懸門左右各十餘枚犯禁者不避豪彊棒殺之蹇碩叔父夜行太祖殺之也\n白氏六帖事類集卷第十三"},{"id":"toc-juan14","source":"卷十四總目","juan":"卷第十四","menu":"卷第十四總目","sub_menu":null,"page":"二二六","leaf":"二十五ウ","text":"白氏六帖事類集卷第十四　本卷總目（共 45 門）\n賞賜一\n僭賞二\n賞戰功三\n賞和戎四\n賞諫臣五\n賞政績六\n賞舉賢七\n賞死事八\n賞邑九\n賞田十\n賞宅十一\n賞樂十二\n賞車服十三\n雜賞器物十四　附雜賜\n賞馬十五\n賞寶十六\n弓矢鈇鉞十七\n圭瓚十八\n虎賁十九\n戶陛二十\n秬鬯二十一\n彝器二十二\n賜錢二十三\n賜帛二十四\n賜婦人二十五\n辭賞賜二十六\n功二十七\n讓功二十八\n伐功二十九　附矜功\n銘其功三十\n詐功三十一\n褒功臣後三十二\n封建三十三\n讓封三十四\n婦人封三十五\n繼絕三十六\n嗣立三十七　為人後附\n立長三十八\n立賢三十九\n捨嫡立庶四十\n辭讓四十一\n卜嗣四十二\n異姓為後四十三\n庶孽四十四\n用蔭四十五"},{"id":"juan14-000","source":"正文","juan":"卷第十四","menu":"賞賜第一","sub_menu":null,"page":"二二六","leaf":"二十五ウ","text":"懋賞　懋勉也\n寵錫\n受賜　民到于今受其賜\n天賜\n何以勸善\n夫賞國之典也藏在盟府不可廢也　傳\n善則賞之以勸能者\n不僭　聲子曰善為國者賞不僭賞僭則懼及淫人若不幸而過寧僭無濫也\n勸賞\n加膳　古之治人勸賞以春夏將賞為之加膳加膳則飫賜\n賞不踰時\n何以沮勸　賞罰無章\n君之勸能明而不費　管子曰明君之賞而不費\n臣之量力受而勿辭　管子曰忠臣之事君也計功而受賞不為苟得量力而受官不貪爵祿其所能者受而勿辭\n無以勸能\n賞延于世　世謂後世也\n大賚　賚賜也\n帝錫玄圭\n功多者厚賞　書\n費少勸多　文子曰善賞者費少而勸多故聖人賞一人而天下趨之是以至賞不費也\n開必得之門\n信慶賞也　管子云\n授彤弓於晉莊\n嘉乃丕績　錫玄圭於夏禹告厥成功\n夫德不稱則勸善之道廢矣　當功不賞則報功之典廢矣\n周禮太宰以八柄馭群臣三曰予以馭其幸　幸謂言行偶合於善則有以賜予之以勸所領也\n以九式均節財用八曰匪頒之式　式謂財用之節度也匪分也頒賜也謂分賜群臣\n賜予\n好賜　周禮\n時頒　以時頒賜之\n慶賜遂行　無有不當月令\n凡賜君子與小人不同日　禮\n慎尊卑\n報功慶賞\n禮見爵賞之施焉　禮\n不賞而人勸\n禮大利小利　禮曰事君大言入則望大利小言入則望小利言謂立事者也利祿賞也\n禮無不荅　禮曰臣下竭力盡能以立功於國君必報之以爵祿故曰禮無不荅言上之不虛取於下也\n拜貺　貺賜也\n不酬奉上之勤　何勸將來之善\n勤節貴忠　國章懋賞\n賜表主恩　拜明臣禮\n周禮太府以斂餘之賦以待賜予\n反賜　魯昭公賜子家子雙琥一環一璧輕服公薨子家子反賜於府人曰吾不敢逆於君命也\n三賞不及　史記晉文公賞從亡臣壺叔曰君三行賞賞不及臣公曰導我以仁義防我以德惠此上賞輔我以行者次賞矢石之難汗馬之勞次之若以力事我三賞之後而及子晉人聞之大悅也\n不吝千金　魏志太祖其有功當賞者不吝千金無功望施分毫不與\n賞不失勞　傳\n賞恭罰否\n不賞私勞\n競勸于賞\n賞之日蓍奉室示賞也　出賞物也\n示信　商鞅變法恐人未信乃立木於市南門募人徙置北門者與五十金有一人徙之遂與五十金以示其不欺也史記\n功不賞為善失其望　　　　　為善者失其望\n賞慶　刑威曰君"},{"id":"juan14-001","source":"正文","juan":"卷第十四","menu":"僭賞第二","sub_menu":null,"page":"二二八","leaf":"二十六ウ","text":"古之善為國者賞不僭僭則懼及淫人\n公冶冕服　公賜公冶冕服辭死曰我賜必無以冕服斂非德賞也言公畏季氏而賞我民有　故\n君子不以小言受大祿　不以大言受小祿祿賞也\n利淫\n慶賜遂行無有不當　月令\n苟所賞之不當則何勸　於將來\n無功受祿　詩伐檀刺貪也在位貪鄙無功受祿也\n業不勳必甚於有勞　頒賞亦期於無僭\n賜銅山　漢鄧通無他能文帝愛之賞賜至多復賜蜀郡銅山得私鑄錢鄧氏錢因滿天下\n傳曰上賞其姦　介之推\n竊功而進\n明君不賞　竊業而祀明神不享\n賞不酬功　刑不應罪不祥莫大焉"},{"id":"juan14-002","source":"正文","juan":"卷第十四","menu":"賞戰功三","sub_menu":null,"page":"二二八","leaf":"二十六ウ","text":"耏班敗狄　宋以門賞之使食其征\n賞不失勞\n桓子滅潞　晉侯賞桓子狄臣千室亦賞士伯以瓜衍之縣曰吾獲狄土子之功也微子吾喪伯氏矣\n彤弓　天子賜有功諸侯也\n賞死事　死王事者\n功疑惟重　重賞也\n功懋懋賞　尚書\n多有厚賞\n晉侯獻楚俘于王王命為侯伯賜之大輅之服戎輅之服彤弓一彤矢百玈弓十玈矢千秬鬯一卣虎賁三百人　傳\n子展入陳　鄭伯賞入陳之功賜子展先輅三命之服先八邑賜子產次輅再命之服先六邑\n有勳而不廢　加重賞也\n有績而載　書功於冊也\n奉之以土田　奉賜也\n撫之以彝器　弓旌斧鉞\n旌之以車服　戎輅之服\n明之以文章　旌旗也\n子孫不忘　昭舊福也\n以庸制祿則人興功　周禮言賞也\n凡賞無常輕重視功\n報功　禮\n不酬盡敵之功　何以勸能軍之善\n捷無虛月　賞不踰時\n臣節在勞　國章懋賞\n矢石之難汗馬之勞次賞　史晉文公也云云\n畢萬匹夫也七戰皆獲有馬百乘死於牖下　子孫\n于奚請曲縣　衛孫桓子與齊戰敗新築人仲叔于奚救孫桓子桓子是以免衛人賞之以邑辭請曲縣繁纓以朝許之\n皮初為太守　劉弘為荊州奏皮初有戰功請補襄陽太守朝廷以初雖有功襄陽是名郡宜慎選不可授初\n以前賞折後功　晉馬隆李興奏人討羌涼州平將加將士勳賞有司奏隆將士皆先加爵位不應更受賞號耿曰前少加爵命為誘引也今軍完不得以前賞塞後功從之\n軍賞不踰月"},{"id":"juan14-003","source":"正文","juan":"卷第十四","menu":"賞和戎第四","sub_menu":null,"page":"二二九","leaf":"二十七オ","text":"晉侯以樂賜魏絳曰子教寡人和諸戎狄　以正諸華八年之中九合諸侯如樂之和無所不諧請與子樂之辭曰夫和戎狄國之福也臣何力之有焉夫賞國之典也子其受之魏絳始有金石之樂\n平國君　漢高使侯公說項羽乃約與漢中分天下歸太公呂后乃封侯公為平國君言能平和於邦國也\n和戎五利\n晉侯悅之"},{"id":"juan14-004","source":"正文","juan":"卷第十四","menu":"賞諫臣第五","sub_menu":null,"page":"二二九","leaf":"二十七オ","text":"齊威王下令　曰有能面折寡人者受上賞獻書諫者受中賞謗譏於市朝而聞者受下賞\n不匡其失則服墨刑　伊訓曰臣下不匡其刑墨注云臣不正君服墨刑\n能箴其違\n宜膺賞典\n三等賞　晉張寔字安遜下令國中曰有面刺孤過者賜以束帛翰墨陳孤過者答以筐篚能謗言於市者賜以羊米\n駁議　晉王浚遣褚碧為豫州下教曰能陳長吏可否說百姓所患者有賞言刺史得失給賞主簿諸葛詣曰上好下應今示以賞恐拘介之士畏\n實不言今賞賜之人為恐箴而莫舉況賤之"},{"id":"juan14-005","source":"正文","juan":"卷第十四","menu":"賞政績第六","sub_menu":null,"page":"二三〇","leaf":"二十七ウ","text":"汝南之帛　漢書顯宗巡狩詔賜汝南太守帛百匹\n遼東之錢　東觀漢記祭彤為遼東太守二千年嘉其功賜錢百萬\n三公之服\n使去襜帷　郭賀字喬卿為荊州刺史有殊政顯宗巡狩特見嗟歎賜以三公之服黼黻冕旒行部去襜帷使百姓見之以章有德民見榮之\n嘉乃丕績"},{"id":"juan14-006","source":"正文","juan":"卷第十四","menu":"賞舉賢第七","sub_menu":null,"page":"二三〇","leaf":"二十七ウ","text":"事類舉賢門\n胥臣之舉郤缺　晉襄公賞胥臣先茅之縣曰舉郤缺之功也\n有功加賜　大戴禮古者諸侯貢士一適謂之好德再適謂之賢賢三適謂之有功乃加九錫也\n漢高之賞鄂君　群臣爭功鄂君曰蕭何功第一曹參次之帝曰善蕭何雖有功待鄂秋而後明封鄂秋為安平侯\n賞無知　漢封陳平為戶牖侯辭曰非魏無知臣安得進乃賞無知"},{"id":"juan14-007","source":"正文","juan":"卷第十四","menu":"賞死事第八","sub_menu":null,"page":"二三〇","leaf":"二十七ウ","text":"死知不曠　曠棄也\n賞死事　死王事者\n賞延于世　世及也\n凡諸侯死王事加二等於是有以衮斂　衮上公服\n孤子　死王事者之子周禮\n養死政之老　謂死王事者之父母周禮\n春饗孤子　禮\n君子聽磬聲則思死封疆之臣　禮\n子云利祿先死者而後生者則民不偝先亡者則民可以託　言不偷於死者則生者信之\n偝死　棄死者也\n蹈白刃而死\n衽金革死而不厭　禮記云\n不酬繼死之功　何勸將來之善\n死冤死明臣節　賞未主恩\n齊侯令曰得欒無存尸者以五家免乃得其尸公三襚之　先以士服次大夫服次卿服\n與之犀軒直蓋　犀軒卿車直蓋高蓋也\n親推之三\n陳成子屬孤子三日朝　會死事者之子三日朝以禮之\n設乘車兩馬繫五色召顏涿聚之子晉賜之\n曰車服而朝無廢前勞　遂之役其父死焉云云\n能執干戈以衛社稷　童汪踦\n羽林孤兒　死王事者之子養於羽林教以五兵也\n立後　魏祖令將士絕無後者求親戚為後授上田給耕牛置師教為立廟也\n智者不背時而棄利　勇士不怯死而滅名"},{"id":"juan14-008","source":"正文","juan":"卷第十四","menu":"賞邑第九","sub_menu":null,"page":"二三一","leaf":"二十八オ","text":"賞胥臣以先茅之縣　舉郤缺之功晉侯賞也\n賞士伯以瓜衍之縣　賞桓子狄臣千室亦賞士伯以瓜衍之縣往獲狄土數伯氏之功伯氏謂荀林父也\n韓侯奄受北國　賜以北方之國詩\n鄭伯賞入陳之功賜子展先輅三命之服先八邑　賜子產次輅再命之服先六邑\n齊侯與晏子邶殿其鄙六十　邑也\n不受曰慶氏之邑足欲故亡吾邑不足欲也不受邶殿非惡富也恐失富也\n班邑　班賞也禮\n記曰柳莊死公非寡人之臣社稷之臣也與邑裘氏與縣潘氏書而納諸棺\n于奚辭邑　新築人仲叔于奚救孫桓子桓子是以免衛人賞之以邑辭請曲縣繁纓之云云"},{"id":"juan14-009","source":"正文","juan":"卷第十四","menu":"賞田第十","sub_menu":null,"page":"二三一","leaf":"二十八オ","text":"賜田各萬畝　史記趙烈侯好音鄭歌者二人賜之田云云\n秦始皇以甘羅說秦攻燕復以甘茂田宅賜之\n賜公田二頃宅一區　漢蘇武自匈奴來云云\n晉侯朝王王賜之溫原攢茅之田　晉於是始啟南陽\n夫有勳者奉之以土田　奉賜也\n周禮司勳掌賞地之法以等其功　等差也\n凡頒賞地三之一食　凡賞田王食其一而臣食其二\n唯加田無國征　征稅也謂既賞之又重賜之者此田則無王稅也\n與利田宅　漢書使人給除利田宅以勸將也"},{"id":"juan14-010","source":"正文","juan":"卷第十四","menu":"賞宅第十一","sub_menu":null,"page":"二三二","leaf":"二十八ウ","text":"賜蘇武宅一區　注見上\n以甘茂宅賜甘羅　注見上\n與利田宅　注見上"},{"id":"juan14-011","source":"正文","juan":"卷第十四","menu":"賞樂第十二","sub_menu":null,"page":"二三二","leaf":"二十八ウ","text":"禮曰　天子之為樂也以賞諸侯有德者也德盛而教尊五穀時熟然後賞之以樂故其治民勞者其舞行綴遠注民勞者德薄舞人少\n又云治民逸者其舞行綴短　民逸則德盛德盛則賜舞舞人多多則舞行相去近也\n傳晉侯以歌鐘女樂賜魏絳\n魏公九錫文曰　以君敦尚謙讓俾人興行少長有禮上下咸和是用錫君軒縣之樂六佾之舞\n禮大夫有功賜樂　金石之樂禮也故傳云魏絳始有\n又天子賜諸侯樂則以柷將之\n賜伯子男樂則以鼗將之　將謂執以致命也柷鼗皆以所節樂也\n夔始制樂以賞諸侯　舜命夔作樂以賞諸侯\n比之魏絳　魏志太祖賜夏侯惇伎樂博比之魏絳也\n曲縣　仲叔于奚有功衛人賞之以邑辭賞請曲縣曲縣諸侯之樂也"},{"id":"juan14-012","source":"正文","juan":"卷第十四","menu":"賞車服第十三","sub_menu":null,"page":"二三二","leaf":"二十八ウ","text":"車服以庸　庸功也賞勞也\n冊魏公文曰　以君經緯禮律為人軌儀使人安職業無或遷志是用錫君大輅戎輅各一玄牡二駟君勸分務本嗇人稼穡作業帛布穀稻大衆惟興是用錫君袞冕之服赤舄副焉\n傳鄭伯賞入陳之功賜子展先輅三命之服子產次輅再命之服　先輅次輅皆鄭車之名也蓋請於王而賜之\n晉侯獻楚俘于王王賜之大輅之服戎輅之服　大輅金輅也戎輅戎車也二輅各有服\n公賜公冶冕服辭固彊之而後受及將死曰我死必無以冕服斂非德賞也　言公畏季氏而賞我\n夫有功烈者旌之以車服　傳\n君賜車馬乘以拜賜衣服服以拜　禮\n魯昭公賜子家子輕\n服　輕細之服也傳公薨反賜於府人曰吾不敢逆君命也\n古人之服　魏太祖平柳城班所獲器物以素屏風憑几賜毛玠曰以君有古人之風故賜以古人之服也\n再命受服　大宗伯以九儀之命\n爲人子者三賜不及車馬　三命受車馬車馬所以尊者備矣\n君子得輿　易\n賞其善謀　齊侯賞斂諸大夫之軒推邴意茲乘軒\n誇榮所賜　桓榮爲太子太傅賜以輜車乘馬榮大會諸生陳其車馬印綬曰今日所榮稽古之力可不勉乎"},{"id":"juan14-013","source":"正文","juan":"卷第十四","menu":"賜雜器物第十四　附雜賜","sub_menu":null,"page":"二三三","leaf":"二十九オ","text":"素屏　見上注\n賜穀　袁渙曜卿爲郎中令卒太祖爲之流涕賜穀二千斛一詔云以太倉穀千斛賜郎中令一詔云以垣下穀千斛與曜卿家外不解意敎曰以太倉穀者官法也以垣下穀者親舊者也\n寵褒毛義賜穀千斛　後漢章帝下詔云云\n五熟釜　鍾繇　　遷相國文帝在東宮賜繇五熟釜爲之銘曰於赫有魏作漢藩輔厥相惟鍾寔幹心膂\n賜劍　史衛綰上賜之劍綰曰先帝賜臣劍凡六不敢奉詔上曰劍至今乎綰曰具在上使取劍常盛未嘗服也\n賜劍著名　韓稜伯師與郅壽陳寵皆以才能稱肅宗嘗賜諸尚書劍唯此三人特以寶劍手署其名曰韓稜楚龍泉郅壽蜀漢文陳寵濟南椎成也\n賜　　　蘭苦病渴時帝信巫女用水方使人持水賜蘭蘭不飲　曰治病自以方藥何信於此乎帝爲變容蘭渴甚以至於卒\n賜肉　伏日詔賜從官肉太官丞日晏不來東方朔拔劍割肉去丞奏之詔令自責\n嫁所賜生口　魏華歆子魚公卿嘗並賜沒入生口歆得而嫁之帝歎息孫盛曰　　　　之家國刑所書　　義著者"},{"id":"juan14-014","source":"正文","juan":"卷第十四","menu":"賜馬第十五","sub_menu":null,"page":"二三三","leaf":"二十九オ","text":"虢公晉侯朝王王皆賜馬三匹　非禮也名位不同禮亦異數\n車馬　見賞\n錫晉文侯馬　書曰平王錫晉文侯馬四匹注作文侯之命\n晉康侯用錫馬蕃庶　易\n爲人子者三賜不及車馬　禮\n康侯之錫　見上\n大驪　後漢世祖以所乘大驪賜李忠"},{"id":"juan14-015","source":"正文","juan":"卷第十四","menu":"賜玉第十六","sub_menu":null,"page":"二三三","leaf":"二十九オ","text":"虢公\n晉侯朝王王皆賜玉五瑴　非禮也名位不同禮亦異數\n虞卿說趙王一見賜白璧一雙黃金百鎰　史記\n周書分寶玉于叔伯之國時庸展親　以寶玉分賜同姓之國用展親也\n魯昭公疾賜子家雙琥一環一璧公薨反賜於府人曰吾不敢逆君命也　傳\n金穴　郭況爲大鴻臚賞賜金錢縑帛豐盛莫比京師號況家爲金穴\n珠璣委地　後漢鍾離意子阿爲尚書時交阯太守坐贓詔以其資物班賜群臣意得珠璣悉委地不拜曰孔子忍渴於盜泉云云此贓穢之物故不敢拜帝歎之\n有讓却進所賜　漢王謂陳平曰先生事魏不中事楚而去今又從吾游信者固多心乎平曰魏王不用臣說故去云云臣計畫可採願用之若不可大王所賜金見在請封輸官得請骸骨漢王深謝之"},{"id":"juan14-016","source":"正文","juan":"卷第十四","menu":"賜弓矢鈇鉞第十七","sub_menu":null,"page":"二三四","leaf":"二十九ウ","text":"賜弓矢然後征賜鈇鉞然後殺　禮\n冊魏公文曰　君龍驤虎視旁眺八維掩討逆節折衝四海是用錫君彤弓一彤矢百玈弓十玈矢千\n又曰　以君糾虔天刑章厥有罪犯關干紀莫不誅殛是用錫君鈇鉞各一注鈇鉞皆斧也\n平王錫晉文侯彤弓一彤矢百玈弓十玈矢千　得專征伐也彤弓以講武習射傳示子孫也\n晉文公獻楚俘于王王賜之　彤弓彤矢玈弓玈矢\n彤弓錫有功諸侯也　詩\n飾怒　禮軍旅鈇鉞者先王之所以飾怒也\n賜劍　衛綰醇謹景帝賜之劍辭曰先帝賜臣劍凡六不敢奉詔"},{"id":"juan14-017","source":"正文","juan":"卷第十四","menu":"賜圭瓚第十八","sub_menu":null,"page":"二三四","leaf":"二十九ウ","text":"禮曰賜圭瓚然後鬯　未賜圭瓚則資鬯於天子\n錫玄圭　書曰禹錫玄圭告厥成功注禹治水畢堯賜之圭璋以其成功也\n冊魏公文曰　以君溫恭爲基孝友爲德明允篤誠感于朕思是用錫君秬鬯一卣圭瓚副焉注以圭爲柄一頭之圭瓚也\n平王錫晉文侯秬鬯圭瓚作文侯之命"},{"id":"juan14-018","source":"正文","juan":"卷第十四","menu":"賜虎賁第十九","sub_menu":null,"page":"二三五","leaf":"三十オ","text":"冊魏公文曰　君秉國之鈞正色處中纖毫之惡靡不抑退是用錫君虎賁之士三百人\n晉文公獻楚俘于王王命爲侯伯賜虎賁三百人　傳"},{"id":"juan14-019","source":"正文","juan":"卷第十四","menu":"賜戶陛第二十","sub_menu":null,"page":"二三五","leaf":"三十オ","text":"冊魏公文曰　君翼宣風化爰發四方遠人回面華夏充實是用錫君朱戶以居注云朱戶赤戶也天子之禮也\n又曰　君研其明哲思帝所難官才任賢羣善必舉是用錫君納陛以登注納陛基爲陛以登取安也"},{"id":"juan14-020","source":"正文","juan":"卷第十四","menu":"賜秬鬯第二十一","sub_menu":null,"page":"二三五","leaf":"三十オ","text":"晉文公獻楚俘于王王賜秬鬯一卣　卣器名也秬黑黍也鬯香酒所以降神也傳\n平王錫晉文侯　書見上云云\n諸侯賜圭瓚然後鬯　云云見圭瓚門注\n冊魏公　見圭瓚門注\n不再拜　禮曰酒肉之賜不再拜受而已不重拜於室經也"},{"id":"juan14-021","source":"正文","juan":"卷第十四","menu":"賜彝器第二十二","sub_menu":null,"page":"二三五","leaf":"三十オ","text":"周書曰武王既勝殷邦諸侯班宗彝作分器　以宗廟彝器班賜諸侯分器篇名也諸侯尊卑各有分也\n大夫有勳者撫之以彝器　傳云撫綏也"},{"id":"juan14-022","source":"正文","juan":"卷第十四","menu":"賜錢第二十三","sub_menu":null,"page":"二三五","leaf":"三十オ","text":"漢蘇武　自匈奴來賜錢二百萬\n賜一百萬　東觀記　　爲東郡太守三十年嘉其功賜錢百萬\n後漢明帝時館陶公主爲子求郎不許而賜錢百萬\n受賂反賜　漢張武爲郎中令受金錢覺文帝更發御府金錢賜之以愧其心不下吏也\n金穴　注見上"},{"id":"juan14-023","source":"正文","juan":"卷第十四","menu":"賜帛第二十四","sub_menu":null,"page":"二三五","leaf":"三十オ","text":"賜絹萬匹　文士傳張華以平吳之計賜絹萬匹\n鳳皇集新蔡賜汝南太守帛百匹　漢宣詔\n秦二世賜叔孫通帛二十匹衣一襲衣　漢書\n賜之束帛　禮\n賜降胡縑　後漢　　　　　　　孫章云以十萬千\n不賜　蜀志趙雲傳街亭敗有軍資餘絹使分賜將士雲曰軍無利何爲賜悉入赤岸須十月爲冬賜亮善之\n賜臣帛　　　人鄭"},{"id":"juan14-024","source":"正文","juan":"卷第十四","menu":"賜婦人第二十五","sub_menu":null,"page":"二三六","leaf":"三十ウ","text":"齊侯以女子有禮與之石窌　女子曰苟君與吾父免矣可若何趨而問之辟司徒之妻也　司徒之妻也\n賞延于室凡婦人從其夫之爵位\n恩自寢　樂及闈門"},{"id":"juan14-025","source":"正文","juan":"卷第十四","menu":"辭賞賜第二十六　附逃賞讓功","sub_menu":null,"page":"二三六","leaf":"三十ウ","text":"公賜公冶冕服辭還之而後受\n辭有先登　齊侯賞犁彌辭曰有先登者臣從之晳幘而衣貍製\n齊公孫青聘衛衛侯以爲有禮齊侯飲諸大夫酒曰三子之教也苑何忌辭曰與於青之賞必及於其罰　言青有善既受賞後青有罪亦當同受其罰也\n逃賞　楚昭反國賞功臣申包胥包胥曰吾爲君也君既定矣又何求遂逃賞\n魯連不受功而去\n子産辭賞　曰臣不敢及賞禮\n周仁讓賜　周仁景帝幸其家所賜甚多然讓不受\n辭賜劍　衛綰事上見注\n屠羊說　莊子楚昭王失國屠羊說走而從王反國賞從者賞及屠羊屠羊曰大王失國說失屠羊大王反國說亦反屠羊又何賞之有\n臨歿還賞　子家子反賜於府人傳\n文　　　　　　　　孫　　謂子曰吾荷國恩而微績不立不以功受賞吾死後汝悉皆還上所得賜物身効死前行\n陳平還賜　見賞賓門\n後漢鄭弘　　曰君爲太尉帝譴讓　　上所賜臨歿悉還賜物"},{"id":"juan14-026","source":"正文","juan":"卷第十四","menu":"功第二十七","sub_menu":null,"page":"二三六","leaf":"三十ウ","text":"書曰功加于時　時當時也\n予加乃勳　竭力盡能\n載於盟府　功也\n戡難書之竹帛　藏勳銘于鍾鼎\n功懋懋賞　懋勉也\n效錐刀之用　立毛髮之功\n展犬馬之效　立方寸之功文選\n名挂史筆\n銘于太常　周禮有功者司勳銘于王之太常\n周書曰厥有成績紀于太常　太常旌也\n鏤於金石　文子\n獻功於王\n輸力盡\n嘉乃丕績\n告厥成功\n嘉績策勲\n昔周宣之代國人歌方叔之功列於周雅　漢武之朝麟臣美克國之績與於漢\n圖功臣於麟閣　漢制\n保庸　周禮大宰以八統詔王馭萬民五曰保庸謂安有功者也\n興功　周禮以庸制祿則人興功任以祿賞功則人勸也\n稽功　周禮\n王功曰勲　輔成王業若周公也\n國功曰功　保全國家若伊尹也\n民功曰庸　法施於民若后稷也\n事功曰勞　以勞定國若禹也\n治功曰力　制法成治若咎繇也\n戰功曰多　克敵出奇若韓信陳平也\n五曰議功之辟　周禮八辟云\n七曰議勤之辟　皆謂有功議其罪也\n成王以周公爲有勲勞於天下封於曲阜\n報功　禮\n名與功偕　俱盛也禮\n功疑惟重\n功多有厚賞\n明試以功車服以庸\n帝念功\n以奏功庸　大功也奏爲也\n報功策勲\n且旌君代　代功\n穀梁云畢不戶大功也　主\n書勞　傳公至自晉孟獻子書勞于廟\n山河之誓　漢高與功臣剖符作誓曰黃河如帶太山如礪功不絕　　　丹書鐵契金匱石室藏之宗廟也\n無橫草之功得列宿衛　終軍言\n有汗馬之勞　蕭何賈復過\n藺生收功於章臺驃騎發跡於祁連　揚雄\n光武以吏事責三公　功臣不任\n方面之勲　賈復字君文常從帝征伐救少立方面之勲\n兵部敘録格　跳盪先鋒　　　一等陣萬人殺十人士吉功　　跳盪　常鄉兩分三品五品不限官考賞去兵部式敘功計獲及輸失得功優異獎善勲多除跳盪及驍將外自餘五節級酬勲不在與官限放選限也\n其功錄在侍衛\n功程\n功績\n事\n獲狐趙之勲\n計功最\n文神曰無厥一鼎\n及祿勲　合"},{"id":"juan14-027","source":"正文","juan":"卷第十四","menu":"讓功第二十八","sub_menu":null,"page":"二三八","leaf":"三十一ウ","text":"范文子後入　傳曰晉師伐齊范文子後入武子曰無爲吾望爾也乎對曰師有功國人喜以逆之先入者必屬耳目焉是代帥受名也故不敢武子\n功成不居\n不自伐故有功　老子\n汝惟不伐天下莫與汝爭功　書\n孟之反不伐　奔而殿將入門策其馬曰非敢後也馬不進也\n辭有先登二　事見上注\n魯連推功而去　曰所貴天下士者爲人排患　　　　　　　　東之是商賈　　連不忍爲也\n大樹將軍　後漢馮異字公孫　　　　　　諸上會諸將坐論功異獨屛居樹下軍中號大樹將軍\n辭爵讓　魏田疇字子泰從太祖北征　　　去柳城二百里虜驚覺大斬獲功爲首封亭侯　　　　　　　四有司劾疇　　　　以文子辭祿　　　　賞　傳載其美　　　　　不合大義有益推讓之風宜優其節乃拜議郎\n又　呂氏春秋子路拯溺者其人拜之以牛子路受之夫子歎之云\n歸功諸將　魏任城王彰破烏丸太子謂曰卿有功見上勿自伐歸功諸將太祖果悅\n無功而受名臣不敢\n以爲有勲不廢宜膺列地之榮　無功受名賞貪天之罪\n介推不言\n陳平讓無知　平封戶牖侯辭曰非魏無知安得進乃賞無知也\n勸令推功不肯　趙充國辭讓還所善浩星賜迎說曰衆人皆以破羌強弩出擊多斬首降　將軍　即見宜推功於二將軍　充國曰吾年老位極豈嫌伐一時事以欺明主哉兵勢國之大事當爲後法老臣不以餘命一爲陛下言之者卒以　　自知賞\n避敵讓功　　　　　君夫曾言功帝解曰　　若文之叩吾自知之唐張與王館共戰　　　　知賊勢已窮　　將降　　　　宋至吳三百里　　逼留以示不競識知高之"},{"id":"juan14-028","source":"正文","juan":"卷第十四","menu":"伐功第二十九","sub_menu":null,"page":"二三八","leaf":"三十一ウ","text":"附爭功\n郤至驟稱其伐　單子曰郤至其亡乎位於七人之下而求掩其上怨之所聚亂之本也\n無伐善　顏回曰願無伐善無施勞\n孟之反不伐　云云\n爲異坐樹下號大樹將軍　注見上\n商書曰有其善喪厥善　矜其能喪厥功\n果而勿矜果而勿伐　老子\n克伐不行焉可以爲仁矣夫子曰可以爲難矣仁則吾不知也　克謂好勝人也伐謂自伐其功也\n自伐者無功\n君子不自大其事不自尚其功　禮\n焉足以驕人　漢伐南越楊僕爲樓船將軍有功後東越反欲復使爲其伐前功上以書責之曰將軍之功焉足以驕人\n衛侯燬滅邢同姓也故名禮至爲銘曰予挾殺國子莫予敢止　惡其不知恥滅同姓而銘以伐功也\n君子稱其功以加小人　小人伐其技以憑君子\n貪天之功以爲己力\n伏弢嘔血鼓音不衰　晉鄭戰于鐵既戰趙簡子曰吾伏弢歐血鼓音不衰今日我上也\n無汗馬勞　漢高錄功欲先蕭何諸將曰臣攻城野戰蕭何無汗馬之勞鄂君曰云云\n拔劒擊柱　漢高初未有法度諸將會坐論功相向背而坐爭功或拔劒擊柱而嗟吁也\n駐敵之功　吳全琮與魏王陵戰于芍陂軍不利魏將乘勝陷五營顧承與張休奮擊遂駐魏師琮子緒端因敵駐擊退之論功行賞以爲駐敵之功大退敵之功小承休爲雜號將緒端爲偏裨而已\n平吳之功　晉書初詔王濬至建平受杜預節度至秣陵受王渾節度及濬先至受孫皓降渾　　　功　　　　　　　之曰角巾私第口不言平吳之功有問者曰聖王之德智士之力藺生下廉頗王渾能無內愧乎濬曰惟懼鄧艾之事不得不言吾之偏也\n鄧艾字士載　平蜀多功深自矜伐有識者笑之\n矜政能　王尊爲京兆尹行縣上奏曰彊不陵弱各得其所和平之氣通云云御史大夫奏尊大言倨慢坐免\n其言之不讓\n無能受祿"},{"id":"juan14-029","source":"正文","juan":"卷第十四","menu":"銘其功第三十","sub_menu":null,"page":"二三九","leaf":"三十二オ","text":"穆王命君牙曰惟乃祖乃父服勞王家厥有成績紀于太常　太常王之旌旗有功者書焉以表顯也周書\n銘之金石　取其不朽\n勒于鐘鼎\n衛侯燬滅邢禮至爲銘曰予挾殺國子莫予敢止\n季武子以所得齊之兵作林鍾而銘魯功焉臧武仲曰夫銘天子令德　銘其德也諸侯言時計功大夫稱伐　今稱伐則下等也計功則借人力也言時則妨人多矣何以爲銘且夫大伐小取其所得以作彝器銘其功烈以示子孫所以昭明德而懲無禮也\n紀不朽之績　垂無窮之文\n考父之德銘于鼎　美其恭儉\n武子之功勒于鐘　季武以所得於齊之兵作林鍾事見上注\n勒燕然之石\n雖袁有功　車騎將軍竇憲擊匈奴有功登燕山刻石紀功班固作文\n鑄林鍾之銘終爲非禮\n彝器景鍾\n漢圖功臣於麒麟閣\n禮曰夫鼎有銘銘者自名也自銘以稱揚其先祖之美而著之後世者也爲先祖者莫不有美焉莫不有惡焉銘之義稱美而不稱惡此孝子孝孫之心也唯賢者能之　自名謂稱揚先祖之德而著己名於其下銘者論譔其先祖之有德善功烈勲勞慶賞聲名列於天下而酌之祭器自成其名焉以祀其先祖者也顯揚先祖所以崇孝也身比焉順也明示後世教也　酌之於祭器謂斟酌其美著之於鍾鼎也身比焉謂自著名於下也明示後世所以勸於後世爲法也是以君子之觀於銘也既美其所稱又美其所爲　美所爲謂美此人爲此名也子孫之守宗廟社稷者其先祖無美而稱之是誣也有而不知不明也知而不稱不仁也此三者君子所恥也\n宋稱恭儉著考父之銘　傳宋考父三命益恭故其鼎銘云一命而僂再命而傴三命而俯循牆而走亦莫予敢侮\n衛美勲勞勸孔悝之鼎　孔氏四代有功於衛至孔悝又有功莊公美之勒於鼎以旌之也\n篆刻"},{"id":"juan14-030","source":"正文","juan":"卷第十四","menu":"詐功第三十一","sub_menu":null,"page":"二四一","leaf":"三十三オ","text":"漢書魏尚爲雲中守斬首虜上功差六級　下獄馮唐之言乃持節赦尚\n後漢楊徐賊起中郎趙堅畏懦不進詐增首級徵還弃市\n魏志文欽有　戰功增虜獲以徼寵賞與諸葛誕爭功又非增首級檻車徵弃市\n降羌一種兩豪　竇林者當於林領護羌校尉治狄道爲諸羌所信而滇岸詣林降爲下吏敢評奏上滇岸爲大豪承制封義侯明年滇吾復降奏第一豪與俱詣闕獻帝怪一種兩豪疑非實以詰林林辭窮乃詐對滇岸即滇吾隴西語不正帝　　乃　林下獄免官\n虛張首級　晉石鑒爲豫州虛張首級詔曰　頸以詐增虜自致鑒歸田里"},{"id":"juan14-031","source":"正文","juan":"卷第十四","menu":"褒功臣後第三十二","sub_menu":null,"page":"二四一","leaf":"三十三オ","text":"子文無後何以勸善　楚滅若敖氏子文之孫箴尹克黃使於齊還復命而自拘於司敗王思子文之治楚國曰子文無後何以勸善也使復其所改命曰生\n成季之勲宣孟之忠而無後爲善者其懼焉　韓厥言趙武\n魏求鍾繇後　詔曰楚思子文之　　鍾繇之　不宜絕云云\n無廢二勲　祖父勲也臧武仲曰苟守先祀無廢二勲敢不辟邑乃立臧爲\n出於東門　後漢明詔曰朕出東門見　　　　　　　　　賓頃曰　　後也\n賢者之後宜有十代之宥\n以勸能者\n襃立之封　史孫叔敖子負薪優孟乃爲孫叔敖衣冠談語楚莊王大驚以爲叔敖復生欲以爲相孟曰臣婦言慎勿爲昔孫叔敖相楚以霸今死其子無立錐之地莊王乃召孫叔敖子封之寢丘\n賞及父　李同與敢士三千人赴秦秦軍却李同死封其父爲李侯"},{"id":"juan14-032","source":"正文","juan":"卷第十四","menu":"封建第三十三","sub_menu":null,"page":"二四二","leaf":"三十三ウ","text":"天子建國\n諸侯正封　封疆有定分\n天子建德　德有德諸侯\n策勲\n建善則治\n分茅土　白茅直土賜以立社\n剪桐爲圭　成王戲以剪桐葉爲圭以封唐叔史佚曰天子無戲言遂封之\n建賢立德\n錫壤開封\n選建明德以藩屛周\n裂地開國\n大啓土宇\n錫以山川　詩\n錫以土田\n陪敦　陪多也敦厚也\n命之車服\n列爵惟五　五等諸侯也書\n分土惟三　諸侯之國大小有三等\n建邦啓土\n庸建　于爾上公書\n脩其禮物\n慎乃服命　書\n以蕃王室\n封略\n建侯　易\n齊胙太師永表東海　太師封于齊以表東海也\n晉啓侯伯大啓南陽　文公也\n五等論曰五等之制始於黃唐　黃帝唐堯郡縣之始創於秦漢　秦創置郡縣漢因之\n使萬國相維以成磐石之國\n宗庶雜居而定維成之業　五等論\n世及之祚　立子孫也\n國除之典　漢制有罪國除之\n往即乃封　書\n周建懿親\n受列爵\n漢封異姓八國皆王　高祖定天下功臣封八國諸侯王也\n賜我先君履　所處履之界也\n夾輔周室\n藩屛　封建親戚以藩屛周\n宜遵分陜之文　周公召公\n用叶屛周之典　以藩屛周\n龍頟\n定遠封侯\n鵲印之封　封侯也\n親疎並建　宗庶雜居\n分茅錫土\n地列犬牙　疏爵建侯位崇龍頟策命\n建侯之利\n同姓之封　異姓以　封周禮\n有功德於民者加地　禮\n曲阜之封　禮成王以周公有功德於天下是以封周公於曲阜地方七百里革車千乘\n益地削地　諸侯有功則益地取閒田以益之有罪則削地削地歸之閒田\n周禮典瑞土圭以致四時日月封國以土地　度地封諸侯以土圭度日景觀分寸長短制其域也\n告后土　周禮大宗伯王大封則先告后土\n蒯聵歸國使告于王曰天誘其衷獲嗣守封焉\n非天子不得專封　穀梁城楚丘封衛非天子不得專封諸侯雖通其仁義而不與故曰仁不勝道\n古者天子封諸侯其地足以容其人　穀梁\n古者有分土無分人　地理志云分人謂計若干戶\n嚌其爵邑　嚌者等邑不復減也\n帶礪之誓　　　侯祖\n茅土之封　注見上\n專地盜土以自益　漢匡衡字稚圭爲丞相封僮之樂安鄉鄉本田隄圖誤分界多四百頃衡後封臨淮郡之閩道人之僮牧田租穀九千石司隸　奏衡專地盜土以自益免爲庶人\n俾侯于魯　詩\n五命賜則　周禮大宗伯之職九儀之命正邦國之位一命受職再命受服三命受位四命受器五命賜則注云五命賜則往則法也出爲子男則地未成國之名王之大夫四命出封加一等五命賜之以方二百里之地方三百里爲國王莽時以二十五爲則\n子男五十里不能五十里者不合於天子附於諸侯曰附庸　以國附于大國不能自以行其通也\n建置豐氏　傳子產云\n疏爵貴之　漢\n高爵　高爵公乘已上皆高爵也\n連成廣土　後漢竇融辭封曰臣子頑鈍不可以傳連土\n我圖爾居莫如南土　詩封申伯\n私奉養　漢高帝大鐵自天子至封君湯沐邑各爲私奉養不領於天下之經費\n推恩　主父偃說武帝使諸侯推恩封子弟以人人喜不削而弱\n就國行遲　史呂尚封齊就國道宿行遲逆旅人曰客寢甚安殆非就國者也　　　易　　太公夜衣而行比至果萊人來伐爭營丘\n當刑而王　黥布少時人相曰當刑而王後果坐法黥布欣然笑之\n以儒學勳勞封都鄉侯　關傳字\n降虜　景帝欲封降虜王徐盧等五人丞相亞夫爭不可帝卒封之\n妄封　豈　　　　子　　　侯\n擅封　後漢梁冀　　　擅封　　　子兄曾叔爲死侯故以印綬里擅封罪也\n令天下爲三十六郡　秦丞相綰請燕齊荊地遠請立王而鎮之李斯曰諸子功臣重賞賜之易制天下安寧之術置諸侯不便秦皇曰是樹兵也分天下爲三十六郡\n陳平凡出六奇計輒益六邑"},{"id":"juan14-033","source":"正文","juan":"卷第十四","menu":"讓爵第三十四","sub_menu":null,"page":"二四四","leaf":"三十四ウ","text":"辭貴\n就賤\n讓而就賤民猶犯貴大夫讓爵於朝　農夫讓畔於野\n不貪其土　晏平玄\n成佯狂讓封於兄　竟不受\n竇融數辭爵土以爲有勳不發　宜應土之封\n無功父封　竇嬰不受　天之罪\n讓封與弟　後漢丁鴻孝父綝封陵陽侯鴻與弟成居將其幼少及綝卒當代封上書讓於成不報既葬乃挂縗絰於冢廬\n留書託疾而逃　初鴻與鮑駿友乃佯狂不識駿駿乃止而諫曰今子以兄弟私恩而絕父不滅之基可謂知乎鴻乃感悟就國\n又　劉愷以當襲父封讓與弟憲逃遁有司請絕其國帝不許之\n憚罪　張奮字稚通父純臨終敕勿傳國奮兄根被病光武令奮襲封奮以父命不受帝以奮違詔敕收下獄惶怖乃襲封\n耿國字叔慮　嘗嗣上疏以父況愛少子讓請讓國封之\n讓兄子　桓榮卒子郁當嗣爵讓兄子汎帝不許不得已受以租入與之\n佯瘖　晉馮侯父愛少子淑欲以爵傳之侯父終遂辭讓爵號佯瘖不言故得讓侯乃仕爲祭酒翟嬰憲侯爲雀侍良伯以侯不敬爵之讓宥小善不足稱也\n衛瓘六男無爵悉讓二弟遠近稱之\n辭大受小　世祖封功臣令言所欲丁綝幼春願封本鄉或謂綝曰人皆欲縣子獨求鄉何也綝曰昔孫叔敖敕其子曰受封必求磽埆之地已今綝功德薄而得鄉亭厚矣\n請貶侯　後漢　傳昌國封　　侯上疏以國　乃不願之封乞五等　　　　　宗怒貶關內侯亦不與錢"},{"id":"juan14-034","source":"正文","juan":"卷第十四","menu":"婦人封第三十五","sub_menu":null,"page":"二四四","leaf":"三十四ウ","text":"石窌　齊師敗晉齊侯問曰君免乎曰免矣銳司徒免乎曰免矣曰苟君與吾父免矣可若何乃奔齊侯以爲有禮既而問之辟司徒之妻也與之石窌\n封丘　冀州風俗傳曰封丘本延鄉高祖爲項氏所厄於延鄉有翟母免其難故以延鄉爲封丘\n命婦　禮曰婦人無爵從夫之爵坐以夫之齒謂夫爲大夫則婦爲命婦\n凡婦人從其夫之爵位　生禮死事皆從夫之尊卑\n恩自宸極　慶流閨門"},{"id":"juan14-035","source":"正文","juan":"卷第十四","menu":"繼絕第三十六","sub_menu":null,"page":"二四五","leaf":"三十五オ","text":"孔子曰興滅國繼絕世　天下之民歸心焉\n成湯革夏而封杞武王入殷而封宋所以興滅繼絕也　文選\n武王克殷未及下車封黃帝之後於薊封帝堯之後於祝封帝舜之後於陳下車而封夏后氏之後於杞封殷之後於宋　禮\n成王既黜殷命命微子啓代殷後作賓於王家　爲周之客\n蔡叔既沒王命蔡仲踐諸侯位命曰肆予命爾侯于東土\n傳曰虞閼父爲陶正周以其神明之後也　舜後以元女大姬配胡公　閼父子而封諸陳以備三恪　周得天下封夏殷二王後又封舜後謂之三恪恪敬也其禮轉降示敬而已故曰三恪\n宜遵封之文　用協舜禹之典\n楚立文子之後　王思子文之治楚國曰子文無後何以勸善乃立其孫克黃爲箴尹\n鬼有所歸乃不爲厲　伯有爲厲子產立公孫洩及良止以撫之曰鬼有所歸乃不爲厲吾爲之歸也洩子孔之子良止伯有之子\n孤子　死王事者之子\n纂乃前修　食其舊德\n公侯之子孫必復其始"},{"id":"juan14-036","source":"正文","juan":"卷第十四","menu":"嗣立第三十七","sub_menu":null,"page":"二四五","leaf":"三十五オ","text":"爲人後附\n似續\n慶龍袞賞延祚承世及\n嗣子繼世　立世禮置後無子則爲之置後禮\n纂乃祖服　服事\n恭承國命　克紹家聲\n必復其始　公侯子孫云云\n世濟其美\n不隕其名楚王曰子文無後何以勸善　乃立其孫箴尹克黃\n繼體而立先職前脩後嗣榮分茅土　慶襲弓裘\n嗣德纂我祖考\n堂構　書曰若考作室其子乃不肯堂矧肯構言不嗣父\n纘承踐脩祗適乃文考　敬脩爾父道\n嗣守前烈克紹先烈\n負荷析薪　古人有言其父析薪其子不克負荷言不嗣也\n良冶克傳不墜良弓續莫大焉上所以爲後者　禮\n禮曰諸侯世子世國　象賢大夫不世爵使以德爵以功　謂天子大夫也不世爵而世祿進賢\n諸侯之大夫不世爵祿食其舊德　負纂乃前修\n祿以勸賢　爵以及嗣\n臣能匡國必酬世祿之榮　子合承家宜荷賞延之寵\n家嫡承祧\n繼體\n立嗣以嫡不以賢　公羊曰隱長又賢諸大夫扳而立之何以不宜立立嗣以嫡不以賢立子以貴不以長桓何以貴母貴也\n趙簡子藏符　史趙簡子曰吾藏寶符於常山先得者賞諸子馳至無所得無卹曰已得矣常山臨代代可取也簡子乃廢伯魯而立無卹是爲襄子\n很在心　國語智宣子將以瑤爲後智果曰不如宵也宣子曰宵也很曰宵之很在面瑤之很在心心很敗國面很不害弗聽立瑤智宗必滅竟立瑤果滅智氏\n使嗣宗職　傳\n●爲人後　附嗣立門\n移根繼絕\n不與射　孔子射於矍相之圃蓋觀者如堵牆使子路執弓矢出延賓曰賁軍之將亡國之大夫與爲人後者不在此位也注主後已有一人復往爲之是貪利也\n不別籍　晉殷仲堪臨荊州有子孫繼親族無後者唯令主蔡肯不聽別籍以避役\n經侍養　不封　封爵令王公已下無子孫以兄弟爲後生經侍養者　承襲養若死王事雖不經侍養亦聽襲\n姪　蜀諸葛喬字伯松瑾第二子本字仲慎亮未有子求喬爲後瑾啓吳主而遣之以爲嫡故改其字喬子攀亮後自有子瞻攀還復爲瑾後\n中官　後漢順帝聽中官以養子爲後代襲封爵"},{"id":"juan14-037","source":"正文","juan":"卷第十四","menu":"立長第三十八","sub_menu":null,"page":"二四七","leaf":"三十六オ","text":"立少附\n立長則順　傳\n無嫡則立長　穆叔曰太子死有母弟則立之無則立長年鈞擇賢義鈞則卜古之道也\n年鈞以德　昔先王之命曰王后無嫡則擇立長年鈞以德德鈞以卜王不立愛公卿無私古之制也\n贊私立少　子朝言單劉贊私立少云云\n尚年尚齒\n無忌之弟好仁則可　立少\n周子之兄無慧　辯長何爲\n然則政惟圖大　教在防人\n黜惡進賢　雖能權道\n廢長立少　必啓幸門\n反經是起爭端　亂嗣殊非理本\n楚國之舉恒在少者　傳\n立少子　魏劉表字景升二子琦琮表愛琮而琦不自寧引諸葛亮上樓去梯曰可以言未亮曰君不見申生在內而危重耳在外而安乎琦悟遂謀出守"},{"id":"juan14-038","source":"正文","juan":"卷第十四","menu":"立賢第三十九","sub_menu":null,"page":"二四七","leaf":"三十六オ","text":"建賢則治\n以先王觀之則尚德也　選\n建明德豈尚年哉　傳\n智瀨藏符雖棄嫡\n郵哀忘佩玉宜立石祁　上史趙簡子事下禮記衛石駘仲卒無嫡子有庶子六人卜所以爲後者曰沐浴佩玉則兆五人者皆沐浴佩玉石祁子曰孰有執親之喪而沐浴佩玉者乎不沐浴佩玉石祁子兆衛人以龜爲有知\n雖嫡嗣之或非信象賢而可立　禮曰繼世以立諸侯象賢也\n置善則固\n正天子之封實惟建德　天子建德\n諸侯之代必有象賢\n且學裘之可傳　立庶無害\n苟析薪之不可　雖嫡奚爲\n舍子立弟　公羊宋宣公舍子與夷而立弟穆公穆公卒舍馮立與夷與夷見殺宋之禍宣公爲之也"},{"id":"juan14-039","source":"正文","juan":"卷第十四","menu":"捨嫡立庶第四十","sub_menu":null,"page":"二四七","leaf":"三十六オ","text":"公儀仲子之喪檀弓免焉　禮以爲非非仲子也\n仲子舍其孫而立其子　此其所非也周禮嫡子死立嫡孫\n檀弓曰我未之前聞也\n問子服伯子伯子曰昔者文王舍伯邑考而立武王微子舍其孫腯而立衍也仲子亦猶行古之道也　伯子爲仲子諱惡文王立武王權也微子捨其孫立衍殷禮\n問於仲尼仲尼曰否立孫　據周禮也\n司寇惠子之喪子游爲之麻衰牡麻絰　惠子廢嫡立庶子游爲重服以譏之\n文子退扶嫡子南面而立曰虎也敢不復其位　文子惠子兄也虎惠子嫡子\n子游趨而就客位　所譏行復本位\n因殷之禮　則可捨孫\n從周之文　豈宜立庶"},{"id":"juan14-040","source":"正文","juan":"卷第十四","menu":"辭讓第四十一","sub_menu":null,"page":"二四八","leaf":"三十六ウ","text":"廢祀非孝也\n季子守節吳國高其賢\n玄成壞容漢朝詶其詐　佯病狂不欲受寵爵\n則教宜圖大　禮在防人\n絜己中清雖稱高節　承家失序恐紊大倫\n亂嗣必啓爭端　違禮恐非理本\n泰伯讓周猶稱至德　子曰太伯可謂至德也三以天下讓民無德而稱焉\n無忌舉起且曰好仁宜承國命　無隕家聲\n孟子曰無辭讓之心非人也"},{"id":"juan14-041","source":"正文","juan":"卷第十四","menu":"卜嗣第四十二","sub_menu":null,"page":"二四八","leaf":"三十六ウ","text":"年鈞擇賢義鈞以卜\n年均以德德鈞以卜\n衛人以龜爲有知　見上注\n當璧而拜　楚共王有寵子六人無嫡子立焉乃埋璧於神廷曰當璧而拜者神所立也康王跨之靈王肘加焉子干子皙遠之平王再拜皆壓紐\n衛孔成子筮立公子元　衛公\n遇屯史朝曰元亨又何疑焉屯象曰利建侯故成子立靈公\n壓紐之祥雖歸弃疾　弃疾平王名見上注\n佩玉之兆終在石祁"},{"id":"juan14-042","source":"正文","juan":"卷第十四","menu":"異姓爲後第四十三","sub_menu":null,"page":"二四八","leaf":"三十六ウ","text":"穀梁\n莒人滅鄫　莒鄫之外生以立爲後非其族類故云滅\n家立異姓爲後則曰亡國立異姓爲後則曰滅　非其姓以亂祭祀滅亡之道也\n朱治以甥然爲後　吳朱然本姓施氏朱治姊子初治未有子然年十三啓孫策乞以爲嗣然爲治行服訖乞復本姓不許然子績復爲施氏也\n蜀劉封　本羅侯寇氏之子先主至荊州未有繼嗣養封爲後因爲子\n衛繼　兄弟五人爲縣功曹縣長張君無子乞繼父許之　　禁異姓爲後復姓衛氏\n陳矯　晉陳騫父矯本劉氏爲外祖陳氏所養因改姓焉\n賈充以外孫韓謐奉充後　外孫詔曰賈因王功特聽　　　　　　不合以異人也\n庇身他族忘情本根\n螟蛉有子蜾蠃負之"},{"id":"juan14-043","source":"正文","juan":"卷第十四","menu":"庶孽第四十四","sub_menu":null,"page":"二四九","leaf":"三十七オ","text":"外家　後漢　　王莽有　孫安宗　　　外家　　鄉人之　賤也\n鄭庶孽\n母賤　史記姑布子卿見毋卹曰眞將軍也趙簡子曰其母賤翟婢也奚道貴哉\n叔曰天子\n孽　子　晉書\n直　諸子嫡子\n諸國之奪宗\n配嫡　言如嫡也\n匹嫡　非衣\n秀　母并賤也"},{"id":"juan14-044","source":"正文","juan":"卷第十四","menu":"用蔭第四十五","sub_menu":null,"page":"二四九","leaf":"三十七オ","text":"亢身　子文叔曰吾不忘身安能亢宗\n弃官則族無所庇\n葛藟　猶能庇其本根\n春樹桃李夏得其蔭\n爾祖我躬不恤我後　遑恤\n庇身　自庇\n答則辱先　蔭宜　　之後\n多緐斯之慶　子孫衆多也\n椒聊之實　蕃衍之象\n如或不能庇族　則將焉用族名\n十代之宥　漢有任子令宗多以父任爲郎\n庇身有地\n白氏六帖事類集卷第十四"},{"id":"toc-juan15","source":"卷十五總目","juan":"卷第十五","menu":"卷第十五總目","sub_menu":null,"page":"二五〇","leaf":"三十七ウ","text":"白氏六帖事類集卷第十五　本卷總目（共 81 門）\n大將第一\n偏將第二\n威名將三　老將附\n儒學將四\n宗族從軍五\n軍旅六\n出征七\n發軍八\n祭師九\n接戰十\n軍政令十一\n訓練十二　理兵附\n禁暴十三\n用刑十四\n示必死十五\n戰死十六\n行惠十七\n不撫十八\n示信十九\n有禮二十　附\n軍整二十一\n謀略二十二\n料敵二十三\n警備二十四　警急附\n無備二十五\n攻守二十六　附\n火攻二十七\n追奔二十八\n軍師二十九\n神助征伐三十　附\n軍勝吉應三十一\n占候三十二　忌附\n軍行險道三十三　軍道\n緩伐三十四\n軍期三十五\n禁兵暴三十六\n水戰三十七\n致師三十八\n持重三十九\n陣四十\n戰傷四十一\n軍門幕府四十二\n召募四十三\n願從征伐四十四\n背軍四十五\n乞師四十六\n救援四十七　不相救附\n將交惡四十八\n軍詐四十九\n軍矯命五十\n專命五十一\n專殺五十二\n武勇五十三　力士驍士附\n單車入賊五十四　不相疑附\n交戰敘舊五十五\n犒士五十六　虜\n師五十七　不　附\n殿五十八\n兵法五十九\n間諜六十　探刺附\n烽候六十一\n斥候六十二\n行人六十三\n獻捷六十四　俘馘附\n旋軍六十五\n軍勝六十六　附\n務德勝六十七\n以少擊衆六十八\n降六十九\n退散七十\n善敗七十一　再戰附\n敗將七十二\n屯營七十三\n爭戰地七十四\n伏兵七十五\n擒獲七十六\n弱兵七十七\n疲兵七十八\n縱敵七十九\n耀武八十\n寇戎八十一"},{"id":"juan15-000","source":"正文","juan":"卷第十五","menu":"大將第一","sub_menu":null,"page":"二五一","leaf":"三十八オ","text":"上將軍　　右\n晉謀元帥用郤縠　傳晉侯作三軍謀元帥趙衰曰郤縠說禮樂而敦詩書乃使郤縠將中軍\n予王之爪牙\n握兵之要\n帥師者受命於廟受脤於社　傳\n建牙設壇而拜　漢高祖擇日齋戒設壇場具禮拜韓信為大將軍\n鑿凶門\n授鉞\n孫吳之法　韓彭之功\n位列四七　　　十\n萬衛霍寄重\n旌旄\n分閫外之憂\n杖節\n天下危注意於將　陸賈曰\n將軍忘家\n推轂　漢書王者遣將跪而推轂曰自閫以外將軍制之\n握兵權\n方召之材　方叔召虎\n啓什伍之行列\n四七之任　應\n幕府　衛青以　　為府\n轅門　以車轅為門\n三公之上　後漢和帝以竇憲為大將軍位在三公之上\n不趨不名　大將軍入朝不趨劍履上殿　　　　　不名義見百\n辭第　霍去病為驃騎將軍上為治第辭曰匈奴未滅臣無以家為\n絕席　漢　　　　為大將軍　　　絕席\n尚左　禮記軍尚左注左陽也陽主生將軍有　　　　　左將軍為上貴不敗績也\n赳赳武夫\n公侯干城　詩\n時惟鷹揚　詩尚父也\n元戎\n君子聽鼓鼙則思將帥之臣　禮記\n命為軍帥\n師之耳目在吾鼓旗　言三軍視大將旗鼓以進退也\n師賊人慢之\n權不用命焉　　　　　　　　　　　　　　　　　子高言之\n使仁者佐賢者\n請美田宅　秦使王翦將兵\n斬君使之右　史田穰苴\n斬諫者　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　一人言　　立斬之\n云云者\n殺妻　吳起　　　　　　　　　　兵名乃殺妻明不與齊也\n將將\n將兵　韓信曰陛下　將兵不過十萬臣多多益辦上曰何以為我禽信曰陛下不能將兵而善將將也\n細柳營　亞夫軍細柳文帝勞軍\n將門\n用軍市之租饗士　　　　李牧居邊軍市之租皆自用饗士賞賜決於外不從中覆\n軍行禁\n部曲行部　李廣　　　　李廣行無部曲行陳　　　　　　　　　　　　　　　　　　　刁斗自衛幕府省文書\n治軍簿至明　不　程\n全師保勝　趙充國行必為戰備止必堅營壁全師保勝\n自舉　　與李廣俱以擊胡　　　羌犯塞上使丙吉問誰可將者充國曰無踰老臣\n山西出將　漢書贊曰秦漢已來山東出相山西出將\n探閫　後漢鄧禹表張宗為偏將軍赤眉大至禹欲還　　　　　　諸將名　　竹簡亂\n軍陣立成　後\n漢　傳以擊匈奴封美陽侯簡易不事休止不營舍寧然遠斥候有警急軍陣立成\n拜井水出　耿恭伯宗匈奴攻疏勒城絕澗水城中穿井不得恭向井拜泉涌出\n善待卒而驕士大夫　蜀志關羽善待卒而驕士大夫張飛愛敬君子而不恤小人\n手不能書　蜀志王平字子均長戎旅間手不能書所識不過十字口授作書論說史漢不失其指遵守法度而無戲謔也\n舉兄子為將　晉謝玄字幼度為叔父安所器苻堅南伐朝廷求文武良將安乃舉玄竟敗堅\n晉國謀帥　推郤縠之敦詩\n漢朝論將　美祭遵之用儒\n王師有征　利用禦寇\n軍帥不武　何以　衆\n敦詩閱禮\n識趙衰之知言　使仁佐賢乃輿父之善對\n求用　馬援為伏波將軍求用上哀其老未許援曰臣雖老尚能被甲上馬帝試之援據鞍顧眄以示可用上笑曰矍鑠哉是翁也\n彊禦　史行穆子曰吾軍師彊禦卒乘競勸\n易將　史記秦趙相拒廉頗堅壁不戰趙王信間謀令趙括為將代頗藺相如曰王以名使括若膠柱鼓瑟括徒讀父書不知合變後果敗也\n又　趙良將李牧常居鴈門備匈奴匈奴每入輒入保不捕戰數歲亦不亡失匈奴趙兵皆以牧為怯趙王怒使他人代將數出戰不利復請牧牧如前後大破匈奴也\n聽童謠命將　吳有童謠曰阿童阿童銜刀浮渡江不畏岸上虎但畏水中龍羊祜求其名應者奇王濬小字阿童才又可用祜因表為龍驤將軍備舟楫\n將失一言而軍敗死　主過一言而國亡名\n危命\n將以獻冕　晉以獻冕命士會將中軍為太傅\n握兵之要　專命之威\n弓彎似月\n禦侮之寄\n充深　劍利如霜干城之任斷重\n早陪蘭錡\n應知軍政之嚴　夙懷戎旅識兵權之要"},{"id":"juan15-001","source":"正文","juan":"卷第十五","menu":"偏裨第二","sub_menu":null,"page":"二五三","leaf":"三十九オ","text":"偏將\n軍輿左職\n佐中軍\n裨佐\n裨將　記曰軍尚左見大將門注\n卒尚右　右陰也陰主殺卒之行伍以右為上示有死志\n別屯專殺　後漢竇固出擊匈奴騎都尉秦彭為副彭在別屯輒以法斬人固奏曰秦彭專擅請誅之朝議皆然郭躬獨曰\n於法彭得斬帝曰軍征一統於督彭無斧鉞何以得斬躬曰在部曲則不得彭今專軍別將且陳制於戰則為斧鉞帝乃從之\n不受節度　晉命王濬伐吳受王渾節度濬乘流遂不詣渾渾表濬違詔不受節度請罪之有司遂案濬檻車徵帝不許\n請不置偏將　馮奉世子野王討羌願益兵上為發六萬人太常任千秋將以助奉世奉世以得其衆不須復煩上讓之曰大將軍出必有偏將軍何煩焉"},{"id":"juan15-002","source":"正文","juan":"卷第十五","menu":"威名將第三　老將附","sub_menu":null,"page":"二五四","leaf":"三十九ウ","text":"得臣猶在憂未艾也　晉敗楚于城濮晉侯猶有憂色曰得臣猶在憂未艾也左傳\n子玉將則文公側席而坐　漢書\n管夷吾卧居國重　子云\n史記趙藺相如曰彊秦不敢加兵以吾兩人也　兩人廉頗藺相如也\n若一敵國　漢書曰周亞夫為大將得劇孟喜曰若一敵國\n鮮卑不敢南近塞　後漢鄧訓遷烏桓校尉\n萬人敵　蜀志張飛雄壯威猛亞關羽魏謀臣程昱等咸稱羽飛萬人敵\n周訪有平河洛志善撫納士皆為死王敦有不臣之心終訪之世不敢為非　晉\n何武上書　忠臣社稷之衛魯以季友治亂楚以子玉輕重魏以無忌折衝項以范曾存亡故楚有帝士百萬不圖不以為難子玉將則晉文公側席而坐及死君臣相賀百萬不如一賢也\n頗牧之名　廉頗李牧\n射偶人　郅都為鴈門守匈奴不近鴈門匈奴為偶人象郅都令騎馳射莫能中之見憚如此也\n充國擊羌　趙充國遠斥候以　能持重日日饗士羌數挑戰充國堅守捕生口言羌豪相曰數及今天子遣趙將軍年八九十善於兵法而已\n畫將而威　以畫人走"},{"id":"juan15-003","source":"正文","juan":"卷第十五","menu":"儒學將第四","sub_menu":null,"page":"二五四","leaf":"三十九ウ","text":"晉謀元帥趙衰曰郤縠可也閱禮樂而敦詩書　傳\n帷中講論　後漢張奐為匈奴中郎將烏桓叛門奐坐帷中與弟子講論若無事衆　別安\n雅歌投壺　祭遵為將軍　　　　　　　　中興　　　　將用儒士也\n愛樂儒士　魏志張郃武將而愛樂儒士嘗\n薦同郡卑湛經明行修也\n手不釋卷　吳志魯肅為將手不釋卷\n勸將學問　孫權謂呂蒙蔣欽曰宜學問以自開益蒙曰軍中日苦多務不及讀書權曰孤豈欲卿治經為博士耶但令涉獵見往事爾蒙始就學　　　　舊儒不及\n漢書儒林傳序曰明帝正坐自講諸儒執經問難於前又別立校舍自期門羽林之士悉令通孝經章句\n論說史漢　見大將門\n不騎馬　杜預字元凱身不騎馬射不穿札居將帥之列\n有功　後漢盧植字幹初在東觀校書續漢記後拜北平中郎將持節討黃巾連戰破賊有功\n隱几　孔融為北海相袁譚攻之自春至夏兵裁數百流矢雨集融隱几讀書談笑自若城陷奔東山妻子為譚所虜\n合之以文　齊之以武\n內脩文德\n良資羽翼之才　外拓退方必籍爪牙之器"},{"id":"juan15-004","source":"正文","juan":"卷第十五","menu":"宗族從軍第五","sub_menu":null,"page":"二五五","leaf":"四十オ","text":"子弟從軍　蕭何遣宗族子弟從軍侍漢王\n後漢耿純字伯山率宗族賓客三千人從世祖　恐其賓客等有異心乃燒其廬舍以絕其反顧之望\n舉宗陳力　魏志許　宗族三千人家居東氏請從魏太祖曰　欲苦宮耿純邪謝曰臣幼微宗舉宗陳力今征伐未息　恐貧賤　非敢望純云云\n臧霸率子弟請收家屬詣鄴"},{"id":"juan15-005","source":"正文","juan":"卷第十五","menu":"軍旅第六","sub_menu":null,"page":"二五五","leaf":"四十オ","text":"軍旅鈇鉞者先王所以飾怒也　禮\n師出以律否臧凶　易\n師貞丈人吉无咎　易\n軍旅之事未之學也　孔子對衛靈公\n建侯行師　易\n同邦國　周禮宗伯以軍禮同邦國\n制軍詰禁以糾邦國　周禮大司馬\n挈壺氏掌挈壺以令軍井　壺以盛飲故以表井\n軍事縣壺以序聚欜　縣壺為漏以次更序聚欜備守以兩木相擊行夜\n聽師田以簡稽　周禮稽計也簡閱也\n挈轡\n以令舍　轡亦以駕故以表舍\n凡軍旅夜鼓鼜　鼜夜戒守司馬法昏鼓四通為鼜\n牙璋以起軍旅\n又以治兵守　牙璋以琢為牙齒兵象若今銅虎符\n挈畚以令糧　畚盛糧器\n記曰軍旅思險隱情以虞　思慮己之所能以虞度彼能否也\n介胄有不可犯之色\n孝悌脩軍旅衆以義死之而不可犯也　傳\n師在制命　命由己制\n勤王之師\n成師以出\n五材廢一不可\n誰能去兵\n兵所以威不軌而昭文德\n聖人以興　湯武\n亂人以廢　桀紂\n皆兵之由也\n彊禦　中行穆子曰吾軍師彊禦卒乘競勸\n允當　軍志曰允當則歸也\n拜賜之役　秦孟明也\n中權後勁　以精兵為殿而中軍制謀\n兵事以嚴終\n不土其地不分其民\n南北軍材官七校　漢刑法志高祖踵秦而置材官於郡國京師有南北軍之屯武帝內脩七校注七校不常置也\n勞逸相待　蜀志陸瑁曰兵家之術以功相救勞逸相待愛方惜費以待　敵之闕\n六十不以戎服　禮\n鋪敦淮濆仍執醜虜　注敦當作屯屯其兵於淮水大防之上詩\n常武　召穆公美宣王有常德以立武事\n匪紹匪遊　三十里非懈緩也非遨遊也\n徐方繹騷　　士軍行"},{"id":"juan15-006","source":"正文","juan":"卷第十五","menu":"出征第七","sub_menu":null,"page":"二五六","leaf":"四十ウ","text":"夫子有三軍之事\n兩軍之士皆未憖　憖缺也\n以征不義\n詰誅暴慢\n深入長驅\n埽欃槍\n鯨鯢\n奉辭伐罪\n受命忘家　司馬穰苴曰受命之日則忘其家臨敵則忘其身\n乘王怒　天誅行\n啓滅有扈而夏功昭　成克商而周德著\n成王西征不\n虔震揚黃鉞之威　以遏亂略\n王于興師\n觀兵示威\n專征伐　諸侯賜弓矢然後專征伐\n君命大事　大事謂軍事\n陳師鞠旅\n以王命討不庭　正之體也\n成師以出　謂三軍盡行\n國之大事在祀與戎\n奄征于兵者　以威不軌\n殷湯始伐猶有慙德\n有征無戰　王者之師\n歌采薇以遣之　周文王遣將師之戍\n周公三年東征　宣王六月北伐\n薄伐于征\n凡軍行祓社釁鼓\n遠征　觀討\n燿武\n多壘\n七伐　一戎\n示衆\n肅將天威\n恭行天罰\n徂征\n攻昧\n我武惟揚　我伐用張\n取彼凶殘\n方叔南征荊蠻　詩人歌之列於雅\n充國西伐先零　頌臣美之著於贊\n即戎　周禮\n大司馬以九伐之法征邦國　周禮\n鍾鼓之伐　有鍾鼓曰伐\n揚軍旅　周禮\n季氏將伐顓臾　何以伐爲\n自天子出　天下有道則禮樂征伐自天子出\n師必有名　聲善惡爲名也\n翦伐即戎而行　遣以采薇之詠\n擇利而動　收其破竹之功\n武人東征不遑朝矣\n戎車嘽嘽　如霆如雷\n奮伐荊楚\n赫赫南仲　薄伐西戎\n賊賢害民則伐之\n負固不服則侵之　侵謂兵至境而已\n遣將授節　晉禮志曰漢魏故事遣將出征符節郎授節鉞於朝堂　等宜新禮遣將御臨軒尚書授節鉞依古兵法服而推轂義也\n受律以出\n羅征仇方　羅文建侯行師以伐\n伐國不問仁人　董仲舒曰昔魯君問柳下惠吾欲伐齊對曰不可歸而有憂色曰吾聞伐國不問仁人此言何爲及我也\n討其不庭　　以\n叛而不討何以示威　服而不柔何以示懷\n武先禁暴\n師克　在和\n因山川以設險\n作亂\n九黎之亂德　黃帝興師\n三苗之不舉　虞舜稱兵\n疆場無主　則啓戎心"},{"id":"juan15-007","source":"正文","juan":"卷第十五","menu":"發軍第八","sub_menu":null,"page":"二五八","leaf":"四十一ウ","text":"周禮八成二曰聽師田以簡稽　計合士卒簡兵器以爲要簿也\n牙璋以起軍旅　牙璋琢爲牙齒兵象發兵若今銅虎符也\n有發則命大司徒教士以車甲　發卒兵也王制\n傳曰司馬請瑞爲節以發兵\n高祖曰吾以羽檄徵天下兵未有至者　檄木長二尺有急則插以鳥羽示急也\n以節發兵　漢武曰吾新即位不欲出虎符發兵郡國迺遣嚴助以節發會稽兵會稽守欲距法不發往言欲以法距之爲無符驗助乃斬一司馬諭意遂乃發兵而去矣\n頭鬢白　後漢光武每發一兵頭鬢皆白\n吴漢行師　朝受詔夕引道\n老弱　漢王在滎陽蕭何發關中老弱未傅者悉詣軍往去古者也而傅會吉附\n發女工　史尉佗攻百越上書求女無夫家者三萬人爲士卒衣補秦皇帝可其萬五千人於百姓離心欲亂者十七八也\n請監軍　後漢馬援鴻臚卿討武陵蠻性烈直不行賄賂權豪所中乃上疏云云請中常侍一人監軍財費朱穆奏迎以財自緣失大臣節有詔勿劾\n擅飾城門官\n會稽之軍興\n檻車徵以侯贖　晉石鑒奏以免其官爲校尉云云\n漢黃霸　爲京兆尹發騎士詣北軍以馬不適士劾之軍興連貶秩注馬少士多不相補滿也適音釋\n具其卒乘　繕以甲兵"},{"id":"juan15-008","source":"正文","juan":"卷第十五","menu":"祭師第九","sub_menu":null,"page":"二五八","leaf":"四十一ウ","text":"周禮太師設軍社類乎禡　師祭也\n記曰天子將出類乎上帝　帝五德之帝類宜造皆祭名\n受命於祖\n禡於所征之地也\n告祖受成於學　定兵謀也\n出征執有罪反釋奠于學以訊馘告\n祖講武\n是類是禡　類禡皆師祭也\n祭蚩尤　　　　　沛公祠黃帝祭蚩尤於沛庭而釁鼓"},{"id":"juan15-009","source":"正文","juan":"卷第十五","menu":"接戰第十","sub_menu":null,"page":"二五九","leaf":"四十二オ","text":"張吾三軍\n皆陣曰戰\n連百萬之衆戰必勝功必取　韓信\n忘身　司馬穰苴曰援枹鼓之急則忘其身\n援枹鼓譟而進\n一戰而霸\n左旋右抽\n唯敵是求\n左輪朱殷　血也\n深鬭志　鬭心也\n先人有奪人之心　軍之善謀\n夫戰勇氣也一鼓作氣再而衰三而竭\n彼竭我盈　神怒人怨\n見可而進\n擐甲執兵　固即死也\n躬擐甲胄　親授矢石\n修陣固列\n日尋干戈\n敦陣整旅\n爲魚麗之陣\n被堅執鋭\n八陣　鋭阿\n勍敵\n率是熊羆\n整斯鸛鵝　鸛鵝陣名也傳曰鄭翩願爲鸛其御願爲鵝\n我伐用張\n稱爾戈　比爾干立爾矛\n五伐六伐七伐　伐擊刺也\n六步七步　書曰今日之事不愆于六步七步乃止齊焉\n其旅若林　紂\n合圍\n旝動而鼓　旝大將之旗\n鼓儳　儳可鼓也言敵人在險儳巖未成列可鼓而擊之也\n元戎十乘以先啓行\n嘗寇　嘗試也\n我戰則克　孔子\n堂堂之陣　赳赳之夫\n率鳥合之師　列魚麗之陣\n彼見吾貌必有懼心\n玉石俱焚\n摩壘\n執燧象以奔吳師　楚昭王敗伯舉也\n驅畫牛以觸燕衆　田單\n轍亂旗靡　曹劌曰吾視其轍亂望其旗靡故逐之也\n曳柴偽遁\n武不違敵\n左實右偽　右以衣物爲人形\n乘勝逐北\n斬將搴旗\n方蒙矢石　漢王\n矯箭控弦　　　　　以\n君未知戰　宋襄公不鼓不成列\n獲則取之\n明恥教戰求殺敵也\n交綏而退\n陷陣卻敵\n前蒙矢石\n刻日戰　示信　手　　見\n夜戰其聲相聞足以相救　晝戰其目相視足以相救\n翦滅\n兩軍之士皆未憖　憖缺也傳\n決勝\n運籌　中權後勁"},{"id":"juan15-010","source":"正文","juan":"卷第十五","menu":"軍政令第十一","sub_menu":null,"page":"二六〇","leaf":"四十二ウ","text":"軍旅之事\n軍政不戒而備　孫叔敖\n介胄則必有不可犯之色\n介者不拜\n兵車不式\n戎容暨暨　音忌果毅貌\n言容詻詻　音額教令嚴色\n山立不動\n玉色不變\n誓旅　三令五申孫武\n下令於軍中\n整必勝之衆　實在中權\n勵賈勇之夫　必由下令\n明恥教戰求殺敵也　明殺其果者\n師直爲壯曲爲老\n豈在多乎\n傳軍下之善政　古之善教\n師克在和不在衆　曰\n閱廉\n禮樂慈愛戰所畜也\n士爲武之善經\n整軍而經武\n師出以律否臧凶　易\n師之耳目在吾旗鼓　言衆觀大將旗鼓以進退\n戰所由克\n有死無犯　魏絳曰軍事有死無犯爲敬\n有嚴　有翼\n政令不一莫肯用命　先\n威命\n御一心之衆　建百勝之功\n百辟軍容　戎政\n威克厥愛允濟\n愛克厥威允罔功　書\n聞將軍之令不聞天子之令　亞夫軍細柳\n兒戲　漢　　吏云霸上劉禮棘門徐厲兒戲\n然則師非訓習令貴申嚴\n率素勵以行　必無勇也\n驅白徒而戰　是謂棄之\n天子按轡徐行　文帝勞亞夫軍於細柳入門將軍吏曰將軍令軍中不得驅馳天子爲按轡徐行\n經武　守文\n禁令\n軍禁　禁\n銜枚　周禮軍旅令銜枚禁讙譁\n行閒將整其什伍　以三令下不可\n既崇四七之名　安可二三之令\n申嚴號令　月令\n凡執禁以齊衆\n罪不赦過　禮\n振鐸\n拱稽　號令也\n戎昭武列\n既申誥誥之言　六軍整堂堂之陣\n整烏合之衆　誠在夫\n勵鷹之師　必資三令\n管子謂齊桓公曰　君若正卒伍修甲兵則大國亦將正之小國設備則難以得志可以作內政以寓軍令故正卒伍整於國而軍旅整於郊內教既成勿使遷徙什伍之人祭祀同福死喪同恤禍世同居長同遊故夜戰其聲相聞足以相救晝戰目相見足以相識居同樂行同和死同哀有士三萬人方行天下誅無道莫能禦之也\n穰苴斬莊賈　田穰苴將兵請莊賈爲監軍與賈曰旦日日中會賈期而不至苴問法於軍正曰期後至者當斬遂斬賈\n毀麥割髮　魏志太祖出軍令曰　麥犯者死騎皆下馬持麥相付太祖馬騰入麥中勅主簿議罪主簿對以春秋之義罰不加於尊太祖曰制法自犯何以率下然孤爲軍帥不可殺請自刑援劍割髮置地\n士取民笠斬之　吳志呂蒙入南郡令軍中不得干歷人家有所求取蒙麾下士取民之笠以覆官鎧蒙曰不可以鄉里故廢法垂涕斬之士衆震服道不拾遺\n髡其職吏　吳志　　校尉孫松於公子中最親戲下兵不整陸遜對之髡其職吏\n殺妻　吾承　　　　　　　　　　　　　　　　　　　　　自爲黥自毀以明無私也\n兒陸喜取官箬十　斬之\n叱斬子　魏志鄧艾遣子忠與諸葛瞻戰不利還曰賊未可擊艾怒曰存亡之分在此一舉何不可之有乃叱忠將斬之忠更戰大破之\n教婦人　闔廬謂孫武曰子兵法十三篇吾盡觀之矣可試以婦人乎曰可於是出宮美人百八十人孫子分爲二隊以寵姬二人爲隊長令鼓之皆左婦人大笑孫子又三令五申之又鼓之皆不復笑孫子斬二隊長吳王使救之不可用其次爲隊長於是左右前後皆中規矩王曰赴水火可矣\n具其卒乘　繕以甲兵\n秣馬蓐食　誠卒利兵"},{"id":"juan15-011","source":"正文","juan":"卷第十五","menu":"訓練第十二","sub_menu":null,"page":"二六二","leaf":"四十三ウ","text":"理兵\n銳斂　精專\n簡練　孟秋天子命將帥選士厲兵簡練桀俊專任有功\n以征不義誅暴侵\n銳師訓必勝之衆　賈勇之夫\n士有陷堅之銳\n講旅\n觀兵\n振鐸　號令也\n戒爾車乘\n厲兵　秣馬\n繕甲　治兵\n訓卒　利兵\n鬭志　鬭心\n卒乘輯睦\n蒐乘　補卒\n脩我甲兵\n簡兵　蒐乘\n陳師鞠旅\n振旅闐闐\n不教民戰是謂棄之\n御一心之衆　集百勝之師\n勠力　一心\n三年而治兵\n以數軍實\n訓熊羆之旅\n脩我戈矛\n我武惟揚\n鞭七人貫三人耳　子玉治兵於蔿\n不戮一人　子文治兵\n秋大閱簡車馬講武\n講事　皆於農隙\n然則令本申嚴　師非訓練\n既無訓卒　何以成功\n率素勵以行　必無勇也\n驅白徒而戰是謂棄之　言以勸空拳非勇也白徒不習戰之師也\n行孫武之法　諸子文之兵\n簡其兵器　周禮\n周禮大司馬仲春教振旅辨鼓鐸之用以教坐作進退疾徐疏數之節　皆戰法遂以蒐田仲夏教茇舍如振旅辨號名之用遂以苗田仲秋教治兵辨旗物之用遂以獮田仲冬大閱備戰法遂以狩田\n王孫賈治軍旅\n申嚴\n季冬命將帥講武習射御角力\n乃教田獵以習五戎班馬政命僕夫七騶咸駕載旌旐授車以級整設于屏\n外有司搢朴北面以誓之　誓衆以軍法\n天子乃厲飾執弓挾矢以獵　厲飾謂戎服也月令\n有發則命大司徒教士以車甲　發軍也禮\n明恥　教戰\n將整堂堂之陣　必訓赳赳之夫\n訓戎　教戰\n載纘武功　纘繼也\n晉作被廬之蒐\n楚自克庸以來無日不討軍實而申儆之　傳\n出曰治兵入曰振旅　公羊\n三時務農一時講武　冬也\n故征則有威守則有財　國語號文公曰\n管仲寄軍政　具軍政明\n連率比年簡車　十國爲連連有率\n卒正三年簡徒　三十國爲卒卒有正\n牧五載大簡車徒　三百國爲州州有牧\n斬牲　漢儀立秋日自郊禮畢以揚威武斬牲以薦陵廟太常令謁者一人載以獲車馳送陵廟還宮以造貢束帛賜文武講兵習戰之儀斬牲之禮名曰貙劉\n建而不旆　傳曰晉治兵甲車四千乘建而不旆壬申旆之諸侯畏之注將戰則旆不戰則不旆\n闘場　後漢成和中詔內外軍戲兵於南郊之場名曰闘場"},{"id":"juan15-012","source":"正文","juan":"卷第十五","menu":"禁暴第十三","sub_menu":null,"page":"二六三","leaf":"四十四オ","text":"兵猶火也不戢將自焚\n整旅將何以戢\n黷武\n吳侵陳斬祀殺厲　謂之殺厲之師厲病也祀神屋\n武有七德　禁暴戢兵\n暴而不戢安得定功\n立武\n糾暴　周禮糾暴察暴亂也\n軍禁　周禮\n師禁\n申嚴號令　月令\n凡執禁以齊衆\n知防掠人\n黷武\n苟不戢兵　何以爲將\n吳師斬祀　見上\n羊豁反禾\n曹公敗麥\n師必有名　莫先率義\n暴而不戢　何以定功\n如或不能戢兵　則將　　　將\n責帥卑富陳之隱并堙木刊將來衆整　也在令行整烏合之衆　左在有威訓鷹揚之師　言宜不戚整軍而經武"},{"id":"juan15-013","source":"正文","juan":"卷第十五","menu":"用刑第十四","sub_menu":null,"page":"二六四","leaf":"四十四ウ","text":"軍旅之事殺而不討　亦何以戚以爲剋必勝之師　罪非無赦勵陷堅之卒　合在推行猛以濟寬威克厥愛　長昭果毅易之動也整軍而經武師出以律否臧凶　易曰刑者戰之器也　申叔時云師衆以順爲武軍士有死無犯爲敬　魏絳曰揚干亂行魏絳用鉞戮其僕也臣干旗鼓也　三令三罪而人服　晉文公士唯聞將軍之令　亞夫軍細柳師以嚴　終忠功用屬在威克\n衣行　師律績其轍七貫三華褻理兵之體　罰一勸百宜用鉞之威有令必行　無敢可犯立武知禁守文經武藝其犯命者　周禮又察軍慝　慝陰姦也軍刑　周禮不用命戮于社書軍禁　周禮師執禁以齊衆不赦過　禮大爲防而猶踰　小不忍而惡亂若施用刑之威　恐貽帥之咎責明恥　教戰擒孫吳之法仁而武　無能違也必克厥威齊之以法以爲訓鷹揚之師　令宜不定整烏合之衆　刑在必行寧職用威　齊人以法能軍責帥受除既等於秦彭　用鉞何殊於魏絳用法　伏軍辜魏絳戮其揚干之僕隆覽孫松之吏　注見上"},{"id":"juan15-014","source":"正文","juan":"卷第十五","menu":"示必死第十五","sub_menu":null,"page":"二六四","leaf":"四十四ウ","text":"背水　韓信爲背水陣不　　焚舟　孟明伐晉濟河焚舟\n示必死不復渡也塞井夷竈　皆示必死歌虞殯含玉　吳伐齊齊公孫夏命其徒歌虞殯陳子行命其徒具含玉皆示必死率先士卒　示必死整無敵之旅　勵必死之夫其可敵乎　誰能禦之躬擐甲胄　親受矢石有死志使三軍之士視死如歸　李陵書自言湛舟破釜甑燒廬舍　項羽伐秦渡河乃湛舟破釜甑燒廬舍持三日糧示必死無還心於是大破秦軍臨難無苟免　禮死志統率先之卒　誓以　志身捍尚右之兵　示其必死白刃可蹈袵金革死而不厭　袵席也"},{"id":"juan15-015","source":"正文","juan":"卷第十五","menu":"戰死第十六","sub_menu":null,"page":"二六五","leaf":"四十五オ","text":"以死繼之死寇視死如歸袵金革死而不厭死衛國家吾未獲死所　狼瞫曰喪歸　灌孟戰死軍法父子俱從軍有死事得與喪歸灌夫不肯歸願取吳將頭以報父讎也爲轊歸　高詔從軍死者爲轊歸其縣縣給衣衾棺葬具祠以少牢長吏視葬刻木葬　曹公領兗州牧擊黃巾鮑信戰死購求信喪不獲乃刻木爲信祭而葬之襄老死於邲不獲屍　傳義貫幽魂　德光往葉"},{"id":"juan15-016","source":"正文","juan":"卷第十五","menu":"行惠第十七","sub_menu":null,"page":"二六五","leaf":"四十五オ","text":"勤恤其人與之勞逸熟食者分而後食　吳闔閭在軍傳云君子不重傷慈愛多戰所畜也　士蔿曰挾纊　師人多寒楚王循三軍拊而勉之三軍之士皆如挾纊德以施惠戰所由克　申叔時曰愛克厥威允罔功　書恩加挾纊　念師人之多寒惠表投醪　感戰士之俱醉置金廡下　史記吳楚反上拜竇嬰爲大將軍賜金千斤嬰陳於廡下將士過者令裁取爲用裁勁也封魏其侯外國懷恩　後漢耿秉字伯初爲征西將軍單于懷恩及聞卒舉國發哀剺面流血小人懷惠小惠未徧　曹劌曰\n則足以使人施惠　禮立己推誠示人以惠大事在我　是重異之小人懷惠　必責挾纊之恩御衆在寬　使人由惠觴酒豆肉未嘗不分　國語越王勾踐將伐吳謂申包胥曰在孤側者觴酒豆肉未嘗不分國中疾者吾問之死者吾葬之長其孤問其老也記曰宋陽門之介夫死司城子罕哭之哀晉人之覘宋者反報於晉侯曰宋不可伐子曰善覘國乎其所嘗者卒乘與馬閒衛士請留報德　漢盖寬饒次公爲衛司馬躬撫士卒視其飲食居處撫循疾病致醫藥及歲終交代衛士數千人叩頭願自留一年報寬饒學德宣帝嘉之也士卒不盡飲不近水不盡餐不嘗食　李廣得賞賜分戲下見水云云士樂爲用吮卒疽　史吳起爲將士卒最下者同衣食臥不設席行不騎乘親裹贏糧與士卒分勞苦卒有病疽者起爲吮之母哭曰往年吳公吮其父父戰不旋踵而死於敵今又吮此子妾不知死所也分賜縑　後漢董卓字仲穎得賜縑悉分吏兵曰無者則己有者則士裹創　後漢段熲愛士卒手與裹創行軍未嘗自寢與士同勞苦分賜絹與亡者家　魏志孫禮爲揚州刺史與吳全琮戰賊退詔賜絹七百匹禮爲死者設祭哭臨以絹付亡者家無自入己者也壞帳爲士襦袴　晉謝尚字仁祖爲歷陽守始到官郡以布三十匹爲尚造烏布帳尚壞之以爲軍士袴襦載稻與脂　國語句踐命當室者死三年釋政支子死三月釋政親載稻與脂於舟以行國之孺子游者無不餔也無不歠也必問其名非身種之則不食非夫人織則不衣食民也魯昭公伐季氏子家子曰政自之出久矣隱民多取食焉爲之徒者衆矣　傳脫衣斂　後漢王霸字元伯善撫循士卒死者脫衣斂之問持更督苦　魏劉弘爲荊州嘗夜起聞城上持更者歎苦呼問之年過六十羸病無襦弘謫主\n袍給卑複帽也"},{"id":"juan15-017","source":"正文","juan":"卷第十五","menu":"不撫士第十八","sub_menu":null,"page":"二六七","leaf":"四十六オ","text":"母閉門不納　楚子反攻秦士卒分菽粮而食將軍朝夕芻豢黍粱發戰敗母閉門不納佩玉蘂兮余無所繫之　吳申叔儀乞糧於公孫有山云梁佩玉白旨酒一盛兮余與褐之人睨之　睨邪視也言己與被褐之人同得視之不得飲傳言吳王夫差不恤士也衛懿公好鶴鶴有乘軒者將戰國人授甲皆曰使鶴鶴實有祿位予焉能戰　傳蹋鞠　漢驃騎將軍霍去病少貴不省士其從軍上遣太官齎數十乘而士有饑色其在塞外卒乏粮不能自振去病尚穿城蹋鞠往穿城作鞠室爲之實以毛蹋而戲謂將爲卒　晉謝万受任北征惟以嘯詠自高未嘗撫衆兄安謂曰汝接對諸將以悅心乃集諸將以如意指四座云諸將皆勁卒也將益恨也將不省兵　見霍去病云關羽善待卒而驕士大夫張飛愛敬君子不恤小人　蜀志乞襦不與　晉宣帝仲達兵士寒凍乞襦帝不與或曰幸無故襦可以賜之帝曰襦者官物人臣無私施"},{"id":"juan15-018","source":"正文","juan":"卷第十五","menu":"示信第十九","sub_menu":null,"page":"二六七","leaf":"四十六オ","text":"事具信門古之爲軍不以險阻申叔時曰禮信戰之器也信以守物戰所由克晉侯欲用人子犯曰人未知信未宣其用於是乎伐原以示之信　晉侯伐原命三日之糧原不降命去之諜出曰原將降矣軍吏請待之公曰得原失信何以庇人退一舍而原降也能以德政　君子謂晉於是役也不待期而薄人於險無勇也　晉胥甲趙穿當軍門呼曰云云與敵人剋日戰　晉羊祜叔子爲鎮南每與吳人剋日而戰不爲掩襲之計授律即戎　任既崇於四七推誠示信　言不向推以二三己貫誠　訓戎在信推誠示人以信能軍　訓戎饋藥不疑　晉羊祜爲鎮南以德懷吳將陸抗\n陸抗遺之藥抗服之或疑止之抗曰羊叔子豈酖人者哉互市　吳之未平周俊守王林在弋陽南北爲互市而諸將多相襲奪以爲功吳將蔡敏守于沔中其兄珪與敵書曰慎無爲小利忘大備俊者得書呈俊俊曰君子也"},{"id":"juan15-019","source":"正文","juan":"卷第十五","menu":"有禮第二十　軍禮軍容附","sub_menu":null,"page":"二六八","leaf":"四十六ウ","text":"晉侯觀其師曰少長有禮其可用也　傳輕則寡謀無禮則脫　脫輕也秦師輕而無禮必敗　過周北門王孫滿觀之曰云云師克在和禮樂慈愛戰所畜也申叔時曰禮信戰之器也禮以順時戰所由克有嚴有翼軍旅有禮故武功成戎容　軍戎政容軍晉侯教人三年欲用之子犯曰人未知禮未生其恭於是大蒐以示人之禮能以德攻兵交使在其閒可也人於是大服軍旅之容　暨暨詻詻周禮殺人之中　又有禮焉齊衆班朝治軍涖官行法非禮威嚴不行禮戎容　禮軍旅什伍同爵則尚齒而弟達乎軍旅矣戎昭　師律堂堂之陣　棣棣之容暨暨之容戎行戎政貴萌　軍容尚肅能軍　訓戎聞喪而還　傳曰陳成公卒楚人將伐陳聞喪而還禮也禮不伐喪狂狡失禮違命宜其爲禽也　狂狡宋大夫爲鄭所獲戎昭果毅以聽之之謂禮易之戮也介冑之士不拜爲其拜而蓌拜也　禮率軍禮以長揖　西征賦說周亞夫軍容詻詻　詻詻教令也色容厲肅　禮戎容暨暨\n果毅見介冑有不可犯之色　禮"},{"id":"juan15-020","source":"正文","juan":"卷第十五","menu":"軍整第二十一","sub_menu":null,"page":"二六九","leaf":"四十七オ","text":"不整則喪列　傳齊救鄭陳成子帥師違穀七里穀人不知　違去也不知言軍整也漢王入關秋毫無犯不掠　後漢世祖問諸將所得物唯李忠無所掠世祖賜所乘大驪馬及繡被又　吳志孫皓督夏口兵兼得美女進皓皓更衣服還之下令曰今所誅者曹氏百姓何罪不得驚擾老弱吾以是多附也百姓安堵　蜀志諸葛亮率大衆由斜谷出五丈原分兵屯田耕者雜於渭濱百姓安堵軍無私也又　晉陶侃戎政齊肅凡有虜獲皆分士卒無私不樵樹不採蓺舍不爲暴好以衆整　晉欒鍼對楚子重云傳送絹酬禾　晉羊祜入吳境刈穀爲糧送絹酬之"},{"id":"juan15-021","source":"正文","juan":"卷第十五","menu":"謀略第二十二","sub_menu":null,"page":"二六九","leaf":"四十七オ","text":"萬人之敵運神筭　善計出奇謀先知獨見獨斷吳用子胥之謀入楚以三師肄之君請子畫　畫計策用於戰勝則無敵　禮七擒七縱　諸葛亮百戰百勝　武安君六出奇謀　陳平決勝運籌　高祖曰運籌帷幄之中決勝千里之外吾不如子房龍韜豹略拔幟之計　韓信攻井陘劍術無前碩畫　大略制勝於廟筭遠略知戰使輿曳柴之僞遁　欒枝減竈之奇　孫臏軍之善謀先人有奪人之心相時而動專謀知戰觀釁而動中權後勁其何不濟以奇用兵　老子臨難制變王兵先勝而後戰　孫子有征無戰出奇於術內　制勝於數中借箸一當萬　晉杜元凱有滅吳計人語曰杜武庫一當萬成百克之計　安一舉之\n計軍要機　兵善計潛行　破敵於籌畫之下奇謀獨運　解重圍於談笑之間運謀　戎略伐謀　伐之以謀變成　成兵謀也苟未知兵何以爲將智合於權　義和於利料敵曳柴之謀　破竹之勢將執律以嚴　在運籌而謀始能軍之略視其轍亂望其旗靡故逐之　曹劌曰大國難測有伏焉故云云左傳無扞採樵者　楚伐絞莫敖曰絞小而輕請無扞採樵者以誘之帝王之兵貴謀賤戰戰不必勝不苟接刃　趙充國云置之死地而後生　韓信攻趙背水爲陣曰令驅市人而戰不置之死地使人人自爲戰也先聲而後實　廣武君李左車曰軍固有先聲而後實左實右僞以旆先　右以衣物爲之晉侯伐齊平陰減竈　孫臏伐魏龐涓增竈　後漢虞詡爲武都守羌遮陳倉詡曰夜行令士各作兩竈日增倍虜見吾竈倍必謂有救兵來昔孫臏見弱今吾示彊羌果畏而不敢逼策慮愊憶　後漢陳湯字公子不學古兵法　帝使霍去病學孫子兵法曰顧方略何如耳不至學古兵法百聞不如一見　上問趙充國伐羌何如用幾人充國曰百聞不如一見兵難踰度踰遙也臣願馳至金城圖上方略焚營　度尚討　州以士卒驕不肯戰密焚其營珍寶蕩盡賊清嘯胡笳　劉琨越石嘗爲胡騎所圍窘迫無計乃乘月登樓清嘯賊聞之悽然中夜奏胡笳賊又流涕向曉復吹之賊棄圍而走攻其怠以擊疑　因其虛而止散利而誘之　亂而取之"},{"id":"juan15-022","source":"正文","juan":"卷第十五","menu":"料敵第二十三","sub_menu":null,"page":"二七〇","leaf":"四十七ウ","text":"懼而增德不可當也　趙襄子謂王明彼見吾貌必有懼心郭嘉料孫策　魏志孫策轉鬭千里盡有江東聞太祖在官渡將襲許衆聞皆懼郭嘉料之曰策新并江東所誅皆英豪雄傑輕而無備雖有百萬衆無異獨行中原若刺客伏起一人之敵耳以吾觀之必死於匹夫之手策臨江爲許貢客所\n殺\n漢高問魏將是誰　曰柏直是乳臭不能當韓信騎將馮敬雖賢不能當灌嬰步將項他不能當曹參吾無憂矣\n屈指　魏志諸葛亮攻陳倉帝問張郃曰將軍到亮無得陳倉乎郃曰比臣未到亮已走屈指計亮根盡不至十日郃晨夜至鄭亮果退\n聚米　後漢馬援於帝前聚米為山谷示畫形勢開示衆所從道昭然可曉帝曰虜在吾目中\n成擒　袁尚救鄴諸將以尚歸鄉人人自戰不如避之太祖曰尚從大道來則當避之若循西山來成擒矣果循山臨釜水為營公擊破之\n先勝後戰　魏文曰欲伐不從命吳蜀何先賈詡曰吳蜀依阻山水劉備有雄才諸葛亮善治國孫權識虛實陸遜見兵勢皆難卒謀用兵之道先勝後戰量敵論將臣以今宜先文後武不從江陵役士多死矣\n見可而進知難而退\n軍之善謀\n先開賞募　山賊陳業衆數萬人太祖問可伐否劉曄曰業因亂赴險相依為逼非有爵命威信相伏畏死貪賞愚智所同先開賞勸大兵臨之令下之日軍門啓而虜自潰\n潘濬請以五千人擒樊伷　吳志樊伷誘導諸夷圖以武陵孫權問潘濬濬曰以五千兵足以擒伷權曰卿何輕之濬曰伷嘗為州人設饌比至日中食不可得而十餘自起亦侏儒一觀之驗權大笑以五千人授濬果斬伷\n口對手畫　張千秋與霍禹隨度遼將軍烏桓還謁大將軍霍光光問方略形勢千秋口對兵事手畫地成圖無所失問禹禹不能記由是賢千秋"},{"id":"juan15-023","source":"正文","juan":"卷第十五","menu":"警備第二十四","sub_menu":null,"page":"二七一","leaf":"四十八オ","text":"附警急\n預備不虞古之善政\n防其侵軼\n圉有敵於我師\n聊以自固\n軍行右轅左追蓐前茅慮無\n軍政不戒而備\n師無成命多備何為　先穀云云\n儆而師徒\n有嚴\n險其走集　走集壘壁\n明其伍候　部伍相候望也\n軍旅思險　險阻出其覆設之以當思念以虞人\n隱情以虞　言私度己情　　以\n斥候用戒不虞\n且無外懼　是貢中權\n完其守備\n荒谷甲儆\n虔蜂蠆之主毋發\n君之戎分為二廣　廣千乘　也\n右廣初駕數及日中左則受之以至于昏\n吳國雖贏　完修可息\n莒都恃陋　失守用亡\n夜事　謂夜戒守之事周禮\n糾守　周禮以軍刑糾守守明部伍也\n申嚴設伏\n料敵\n軍尚嚴終　事貴謀始\n握兵之要　東甲之虞\n能軍貴急\n刃劍不離身　孫權曰昔為不疑當安平之世刃劍不離身君子武備不可無之\n勇夫重閉況國乎　莒子恃陋申公巫臣謂之云云\n雖有文事必有武備　公羊非吳子過之自輕行于皇卒\n兵事以嚴終　穀梁曰\n古者大國過小邑必飾城而請罪禮也　飾城修守備也\n庇武守　宋災子罕使西鉏吾庇武守\n鄭災子產受兵登陴　登陴守備也\n守關者備他盜　漢王不設備小秦師\n左公徒釋甲執冰而踞　踞游也言無戰志\n赤白囊　邴吉馭吏習邊事識赤白囊書刺取探候也\n魯擊柝聞於郲\n邊遽乃止　吳言上聞\n遽告于鄭　商人弦高遇秦師\n乘駟正營部　程不正營部行伍營陣擊刁斗至明軍不得休息未嘗遇害李廣不然軍士樂從廣而苦不識"},{"id":"juan15-024","source":"正文","juan":"卷第十五","menu":"無備第二十五","sub_menu":null,"page":"二七二","leaf":"四十八ウ","text":"不備不虞不可以師\n請先者去備薄威\n無備雖衆不可恃也　臧文仲曰\n諸侯相見軍衛不徹敬也\n莫敖伐羅　不設備而敗縊于荒谷\n恃陋　莒子恃陋不修城郭浹辰之間楚克其三都\n疆埸無主以啓戎心\n卑邾　魯及邾戰公卑邾不設備臧文仲曰國無小不可易也蜂蠆有毒況於國乎\n易晉　卜偃曰虢必亡矣下陽不懼而人有功必易晉而不撫其民不\n可以五稔\n納斥候　示不相備\n以藩為軍　示不相疑\n押敵　穀梁果遂之因氏欲戎者酒而殺之齊人殲焉此之謂押敵\n罷屯　韓安國屯漁陽得生口言匈奴遠去上言　田作時請罷屯罷屯月餘匈奴大至上谷漁陽　安國歐血而死也\n國雖大好戰必亡\n天下雖安忘戰必危　主父偃曰\n雖曰薄威　且無\n重閉\n不整營伍　李廣行無部伍行陣就善水草屯舍人人自便不擊刁斗自衛幕府省文書然遠斥候未嘗遇害\n軍陣立成　耿秉行止不結營部遠斥候有警急而軍陣立成\n讀孝經　宋梟涼州刺史邊患多寇令多寫孝經令家家習之庶使知義蓋勳時為漢陽長史諫曰崔杼弒君慶父篡位齊魯非無文學令不急靜難之備云云梟不從奏行之果敗詔責之\n輕裘緩帶　羊祜在軍常輕裘緩帶身不被甲鈴閤之下侍衛不過數十人也"},{"id":"juan15-025","source":"正文","juan":"卷第十五","menu":"攻守第二十六","sub_menu":null,"page":"二七三","leaf":"四十九オ","text":"附圍\n攻必取　漢高祖曰連百萬之衆攻必取戰必勝吾不如韓信\n破堅　摧剛\n攻無堅城\n以此攻城何城不克\n深溝高壘\n裹糧坐甲\n躬擐甲冑　親受矢石\n必取之術\n堅守之心\n城若振槁\n晉釋宋圍\n能以德攻\n金湯之守　金城湯池\n楚國方城以為城漢水以為池雖君之衆無所用之　楚屈完謂齊桓公云云\n合圍十則戰　漢書引兵法\n楚圍宋國易子而食析骸而爨\n雖然城下之盟有以國斃不能從　華元劫子反謂之曰\n魯仲連作書　係矢射城中燕將得書自殺\n完守　入保\n拜井泉湧　耿恭守疏勒云云\n寇戎來攻武守　戎昭\n重圍同得原於重耳　信由是明\n比剋敵於荀吳　議然後取\n易曰乘其墉弗克攻吉　同人\n麥城\n有食穀盡生麥城\n男女乘城而戰\n以爾鉤援與爾臨衝以伐崇墉　臨衝車鉤援引上城者木\n攻國之兵短守國之兵長　周禮\n因壘而降　文王脩德伐崇因壘而降\n晏弱圍萊甲寅堙之環城傅於堞　堙土山堞女牆\n先登\n倍則攻敵則戰　穀梁曰\n袁紹以土山地道擊魏太祖太祖以長壍拒之\n雲梯衝車　諸葛亮攻郝昭於陳倉以雲梯衝車臨城中昭以火箭射之乃燒之\n麗　莊子曰梁麗可以衝城不可以窒穴\n孫子曰善攻者敵不知所守\n陷堅摧剛\n楚子圍蔡里而栽　城一里設版築木也\n宋皇瑗圍鄭師每日遷舍　作壘塹成乃使合其圍也壘合鄭師哭遂取鄭也\n開一面　吳志孫權征合肥久不拔張紘進計曰古之圍開一面以疑衆心今圍之密誠懼所命死戰也\n九攻九拒　史墨翟宋大夫善守禦公輸般為雲梯之械將攻宋墨子見之乃解帶為城以牒為械九設攻城之機墨子九拒之公輸般攻械盡墨子守有餘公輸屈曰吾知所以拒我者吾不言楚王問之墨子曰公輸意過欲殺臣然臣弟子禽滑等三百人在宋楚乃不攻宋也\n龍韜潛運　定拔城之計謀\n鳥陣臨高　起沉砂之劍竿\n縱敵生患　違天不祥\n功振七略　勇冠三軍"},{"id":"juan15-026","source":"正文","juan":"卷第十五","menu":"火攻第二十七","sub_menu":null,"page":"二七四","leaf":"四十九ウ","text":"公羊焚咸丘火攻也\n疾始火攻　征伐之道不過用兵水火之威疾其暴而不仁也\n縱火救火　漢李陵循龍城行四五日抵大澤葭葦中虜上風縱火陵軍中亦縱火自救往自燒營旁草令虜火不及也\n析松為炬　孫權攻合肥新城滿寵募壯士數十人析松為炬灌麻油從上風放火燒賊攻具射殺權弟子權遂退兵\n燒舟　艦公吳志周瑜劉備與曹公遇赤壁瑜部將黃蓋曰寇衆我寡方連船艦首尾相接可燒而走乃取蒙衝鬥艦十數艘實以薪草灌油其中裹以帷幕上建旌旗豫備走舸各繫大船後\n蓋放火諸船同時火發風猛悉延燒岸上營人馬燒溺軍遂退走也\n執燧象以奔吳師　楚昭王也繫火燧於象尾使赴吳師\n燒浮橋　岑彭伐公孫述事見水戰門\n攻即墨　田單燒牛事"},{"id":"juan15-027","source":"正文","juan":"卷第十五","menu":"追奔第二十八","sub_menu":null,"page":"二七五","leaf":"五十オ","text":"宣子曰逐寇如追奔軍之善政\n彼竭我盈\n晉敗齊師于鞌逐之三周華不注　華不注山名也\n援再衰之鼓　一鼓作氣再而衰\n拔數奔之旆　晉人奔以廣隊不能進楚人惎之脫扃拔旆投衡顧曰吾不知大國之數奔也惎教也\n前徒倒戈攻于後以北\n斬將搴旗　追奔逐北\n逐倒戈之徒　乘破竹之勢\n勿佚佚獲逐利　追窮\n困獸猶鬭\n窮寇勿逐\n緩追逸賊\n窮寇緩之則走急則致死　趙充國引兵至先零先零望見大軍棄車重渡湟水道阨充國徐行驅之或曰逐利行太遲充國曰窮寇緩之則走急則致死\n戰不逐奔　穀梁曰"},{"id":"juan15-028","source":"正文","juan":"卷第十五","menu":"軍師第二十九","sub_menu":null,"page":"二七五","leaf":"五十オ","text":"荀攸　魏太祖聞荀攸名與語大悅曰公達非常人吾得之計事以為軍師也\n諸葛亮　為中郎將成都軍師\n辛毗　　與諸葛亮　　軍利在急戰每令持重　　　　　　為軍師以制之也\n當塗得志有軍師祭酒　魏志\n晉書　由己　　　　軍師　　　車中"},{"id":"juan15-029","source":"正文","juan":"卷第十五","menu":"神助征伐第三十","sub_menu":null,"page":"二七五","leaf":"五十オ","text":"附祈禱\n假言神助　史記燕圍即墨田單令城中必祭先祖於庭飛鳥下食燕軍怪之單宣言神來助令曰當有神人為我師有卒入曰臣可為師乎單東向師事之卒曰臣欺君誠無能單曰勿言出入必稱神\n祠子產　鄭　討　　却許將襲之　兵有懼色　令祠子產揚言神兵助撓賊　大獲鎧馬\n祈鍾山神　晉苻堅載記曰堅入寇望見王師部陣齊整又八公山上草木皆類人形懼然有懼色初會稽王道子以威儀鼓吹求助於鍾山之神奉以相國之號及望所見若有力焉\n秦伯以璧祈戰于河　傳\n奉太一旗\n太一\n求神不設備　王氏世事張氏五斗米道凝之尤甚為會稽內史孫恩攻郡察之不設備入靜室請禱語諸將佐曰大道許鬼兵相助賊自破　遂為恩所害\n渡河冰合　後漢王霸元伯從世祖南馳聞王郎兵在後從者皆恐至呼沱河候吏還白河水流澌無船不可濟衆大懼使霸視之霸欲且安衆令至霸白曰冰堅可渡官屬比至河冰亦合乃度後光武謂霸曰神靈之祐也"},{"id":"juan15-030","source":"正文","juan":"卷第十五","menu":"軍勝吉應第三十一","sub_menu":null,"page":"二七六","leaf":"五十ウ","text":"牙中梟鳴　晉謝艾討麻秋梟鳴　　艾曰梟邀也六博得梟者勝果破麻秋也\n梁上鷹集　王敦及虞譚於本縣得衆人大姓數萬起國難有野鷹集屋梁衆大懼譚曰起大義而鷹鳥來集破賊必矣\n晉伐齊師曠曰鳥烏之聲樂齊師其遁矣此鳥得空城故樂　傳"},{"id":"juan15-031","source":"正文","juan":"卷第十五","menu":"占候第三十二","sub_menu":null,"page":"二七六","leaf":"五十ウ","text":"附避忌\n周禮太師執同律以聽軍聲而詔吉凶　王出軍太師以律合音\n師曠曰吾驟歌北風又歌南風南風不競多死聲楚必無功　歌者吹律以詠八風南風音微故曰不競\n占夢搏　晉楚戰城濮晉文夢與楚子搏楚子伏己而監其腦子犯曰吉我得天楚伏其罪吾其柔之矣注晉侯面向上故得天腦所以柔物也\n陳天時　蜀先主東征秦宓陳天時必無利坐下獄後貫出之\n知有走氣　吳志吳範治曆知風氣孫權攻關羽羽請降範曰有走氣言降詐也使者白羽去範曰雖去不免期明日之中權立表下漏待之有風動帷權手曰羽至矣皆如其言也\n傳曰楚師陣不違晦　陰盡之日兵家所忌\n六甲窮日　鄧禹將華為王匡所敗明日癸亥匡以六甲窮日不出禹因得更治兵大破之\n孤虛　後漢趙彥少有術學會宗資討太山賊公孫舉彥為資陳孤虛之法以賊屯在莒莒有五陽之地宜發五陽郡兵從孤擊虛賊破之\n又　段熲為羌所圍樊志張在圍中夜請熲曰東南角無復羌宜乘虛引出住百里還攻之可破熲從之果破之也"},{"id":"juan15-032","source":"正文","juan":"卷第十五","menu":"軍行險道第三十三","sub_menu":null,"page":"二七六","leaf":"五十ウ","text":"附軍適\n穀梁齊桓越\n千里之險北伐山戎\n束馬懸車越太行　齊相公\n推石布土　後漢王霸治飛狐道推石布土築亭障自代至平城三百里\n鑿山開道　魏鄧艾自陰平行無人之地七百里鑿山通道造作橋閣山高谷深至為艱危艾以氈自裹推轉而下將士皆攀木緣崖魚貫而進先登至江由\n古之為軍不以阻隘\n不薄人於險\n斥山澤之險\n失道　李廣以兵與大將軍出東道亡失道後大將軍　良持糒醪問失道將廣自以\n又五將失道　遇賊李陵\n導軍　張騫以嘗使大夏留匈奴中久從大將軍征導軍知善水草處軍得無飢渴\n枕上過師\n壺頭之近　馬援討五溪蠻有兩道可入從壺頭則路近而水險從充則夷而遠援以為棄日費糧不如從壺頭賊果乘高援不得進\n道惡　武帝責楊僕曰失期內顧以道惡為辭"},{"id":"juan15-033","source":"正文","juan":"卷第十五","menu":"緩伐第三十四","sub_menu":null,"page":"二七七","leaf":"五十一オ","text":"書曰天惟五年須暇之子孫　寬改悔也\n詩曰於鑠王師遵養時晦　晦昧也言養之時昧而伐之\n觀釁而動\n見可而進\n持重縱之　使盈其罪\n逗遛不進\n逗撓　逗遛而致撓敗也"},{"id":"juan15-034","source":"正文","juan":"卷第十五","menu":"軍期第三十五","sub_menu":null,"page":"二七七","leaf":"五十一オ","text":"莊賈後期穰苴斬之　史記見政令門\n失期\n內顧　內顧謂思妻子也見上注\n王恢逗遛當斬\n之失道後期　見上注李廣事\n不至質　田廣明子都數不至質　　逗遛下太僕杜延年請責廣明自殺注質所期處\n誤今失期　後漢祭彤與南單于左賢王信擊北匈奴期至涿邪山信初有嫌於彤行出高門塞九百里得小山乃妄以為涿邪山彤到不見虜而還坐逗遛畏懦而下獄免"},{"id":"juan15-035","source":"正文","juan":"卷第十五","menu":"禁兵暴第三十六","sub_menu":null,"page":"二七七","leaf":"五十一オ","text":"秦人毒涇上流師人多死　傳\n毒藥傅矢　後漢耿恭伯宗以毒藥傅矢曰漢軍箭神矢中者瘡沸乃解去\n禁兵刃　吳志賀齊字公苗擊歙諸賊中有善禁者戰時官軍刀劍不得拔弓弩射皆還自向\n有思曰吾聞含有牙齒有毒者皆可禁無毒者不可禁彼必能禁吾兵者也乃多作勁木白棓以精卒五千先登賊持有禁故必不能以棓擊之禁果不得大敗賊也\n羊祜遺藥陸抗不疑　見示信門\n投藥水中　公羊齊人盛子齊往盛濟也齊彊成之遂人共投藥水中人多流古者有分土無分民成之非也"},{"id":"juan15-036","source":"正文","juan":"卷第十五","menu":"水戰第三十七","sub_menu":null,"page":"二七八","leaf":"五十一ウ","text":"爭舟楫之利我得上流何故不克　楚司馬子魚曰\n燒浮橋　後漢公孫述遣任滿田戎據荆州橫江作浮橋關樓上橋柱絕水道岑彭募人攻浮橋與奇騎乘風艫船逆流而上直衝浮橋而攢柱鉤不得進奇等因乘風縱火焚之橋樓崩燒順風並進蜀兵大亂\n周瑜赤壁戰燒曹公舟船　見火攻門注\n大司馬不習水戰荆門之事取決於征南　後漢光武詔征南將軍岑彭司馬吳漢\n樓船艨衝　孫權討黃祖祖橫兩艨衝夾守沔口以栟閭大紲繫石爲碇上有千人以弩交射軍不得前董與凌統各將敢死百人人被兩鎧乘大舸突入蒙衝董身以刀斷兩紲蒙衝乃橫流大兵遂進進而斬之孫權舉觴屬襲曰今日之會斷紲之功也\n穿昆明池習水戰　漢武將攻昆明夷\n以運船爲戰　晉陶侃自爲江夏太守杜弢陳恢寇揚州引兵西上侃乃以運船爲戰艦或言不可侃曰用官船討官賊但須聞上耳\n吳以舟師伐楚　傳\n晉王濬　伐吳於益州造作大船連舫方一百二十步受二千人木爲城起樓櫓開四門其上皆得馳馬往來又畫鷁首怪獸於船首以懼江神舟楫之盛自古未有造船舟於蜀木柿蔽江而下吳以鐵鎖橫截之又作鐵錐丈餘暗置江中逆拒船濬知情乃作筏數十縛草爲人令先行錐輒著筏去又作炬長十餘丈大數十圍灌以麻油在船前遇鎖燃炬燒之須臾融液斷絕船行無礙\n水戰則章邯已亡其城　高祖圍章邯以水灌之\n舟戰於江　國語云越伐吳\n樓船將軍　漢楊僕"},{"id":"juan15-037","source":"正文","juan":"卷第十五","menu":"致師第三十八","sub_menu":null,"page":"二七八","leaf":"五十一ウ","text":"周禮環人掌致師　致師致以必戰之意古者將選勇士以先犯敵\n環四方之故　鄭以其事來役前　　衛\n訟敵國　兵來與訟曲直若國佐如師者已上周禮\n【葉五十一ウ以下　原缺（持重第三十九至寇戎第八十一凡四十三門及尾題）】"},{"id":"jiaokan8-001","source":"校勘表","juan":"卷第八","menu":"卷八門目 第二","sub_menu":null,"page":"印刷頁三一一","leaf":null,"text":"【校勘】位置：卷八門目 第二（印刷頁三一一）\n本稿（改定後）：養禮二\n初錄（書影釋讀）：養禮[?]二\n參校本：養禮二\n處理：參校定\n依據與說明：第二字或作「體」，參校本作「禮」，正文門題亦作「養禮第二」，據定。"},{"id":"jiaokan8-002","source":"校勘表","juan":"卷第八","menu":"卷八門目 第六","sub_menu":null,"page":"印刷頁三一一","leaf":null,"text":"【校勘】位置：卷八門目 第六（印刷頁三一一）\n本稿（改定後）：違離六附（覲省）\n初錄（書影釋讀）：是[?]辭[?]六附（□□）\n參校本：違離六\n處理：從參校本\n依據與說明：初錄誤擬「是辭」。參校本作「違離」，正文門題作「違離第六」，門內「覲省」條注「附違離門」，據改並補附目。"},{"id":"jiaokan8-003","source":"校勘表","juan":"卷第八","menu":"卷八門目 第廿八","sub_menu":null,"page":"印刷頁三一一","leaf":null,"text":"【校勘】位置：卷八門目 第廿八（印刷頁三一一）\n本稿（改定後）：規誨二十八\n初錄（書影釋讀）：□讓二十八\n參校本：規誨二八\n處理：從參校本\n依據與說明：首字漫漶，初錄疑「謙」而與第四十五門重出。參校本作「規誨」，據改。"},{"id":"jiaokan8-004","source":"校勘表","juan":"卷第八","menu":"卷八門目 第卅九","sub_menu":null,"page":"印刷頁三一二","leaf":null,"text":"【校勘】位置：卷八門目 第卅九（印刷頁三一二）\n本稿（改定後）：彊三十九\n初錄（書影釋讀）：安[?]□三十九\n參校本：彊\n處理：從參校本\n依據與說明：參校本作「彊」，正文門題亦作「彊第三十九」，據改。"},{"id":"jiaokan8-005","source":"校勘表","juan":"卷第八","menu":"卷八門目 第四十四","sub_menu":null,"page":"印刷頁三一二","leaf":null,"text":"【校勘】位置：卷八門目 第四十四（印刷頁三一二）\n本稿（改定後）：怠墮四十四\n初錄（書影釋讀）：急[?]遽[?]四十四\n參校本：怠墮\n處理：從參校本\n依據與說明：初錄誤擬「急遽」，參校本作「怠墮」，與前門「勤四十三」相對，據改。"},{"id":"jiaokan8-006","source":"校勘表","juan":"卷第八","menu":"卷八門目 第四十六","sub_menu":null,"page":"印刷頁三一二","leaf":null,"text":"【校勘】位置：卷八門目 第四十六（印刷頁三一二）\n本稿（改定後）：恥尚四十六\n初錄（書影釋讀）：恥[?]尚[?]四十六\n參校本：耻尚\n處理：參校定\n依據與說明：兩本相合，去存疑。"},{"id":"jiaokan8-007","source":"校勘表","juan":"卷第八","menu":"門類標題","sub_menu":null,"page":"印刷頁三一八","leaf":null,"text":"【校勘】位置：門類標題（印刷頁三一八）\n本稿（改定後）：違離第六\n初錄（書影釋讀）：違[?]離第六\n參校本：違離\n處理：參校定\n依據與說明：首字或作「遠」，據門目表及參校本定。"},{"id":"jiaokan8-008","source":"校勘表","juan":"卷第八","menu":"門類標題","sub_menu":null,"page":"印刷頁三一八","leaf":null,"tex corpus-scope","source":"收錄說明","juan":null,"menu":"收錄範圍與缺漏","sub_menu":null,"page":null,"leaf":null,"text":"【收錄範圍與缺漏】\n目前收錄：前言、凡例、卷一、卷三至卷十五。卷二尚未提供；卷十六至卷三十尚未數位化，不在語料庫內。\n卷三至卷五的錄文稿沒有印刷頁標記，引用時只能標門類；卷一、卷六至卷十五皆標有印刷頁與葉次。\n卷八：底本缺葉三十四（印刷頁三三九～三四〇）與葉四十二（印刷頁三五五～三五六），德第二十七的門首，以及勤第四十三、怠墮第四十四兩門與謙讓第四十五的門首，當在這兩葉，因而不存於正文。\n卷十：底本於葉二十九ウ與葉三十オ之間有缺，贈貺第十九至採風謠第三十一共十三門不存於正文，但總目仍列出。\n卷十二：正文門題次序與門目表相反——正文作「勤官第二十四、省官第二十五」，門目表作「省官二十四、勤官二十五」，尚待覆核。\n卷十三：正文中找不到「察獄第七」「讞獄十四」「用法不平二十四」「緣坐五十六」的門題（內容可能併入前後門），總目仍列出。\n卷十五：底本止於致師第三十八，持重第三十九至寇戎第八十一共四十三門及尾題皆闕，但總目列出全部八十一門。\n各卷錄文為淨文版（異文、按語、存疑記號不入正文），異文與改定理由見各卷校勘表。"},{"id":"jiaokan-note","source":"校勘表","juan":null,"menu":"校勘體例","sub_menu":null,"page":null,"leaf":null,"text":"【校勘體例】（卷一、卷六至卷十五校勘表一致）\n一、兩本相合者逕定。\n二、兩本互異而各有可通者，一律從參校本。\n三、參校本顯係誤識而不成詞者不從。\n四、原刻俗字、異體字照錄，不因參校本作通行字而改。\n五、二本俱不可通者，淨文版留空一格。\n底本：靜嘉堂文庫藏北宋刊本（汲古書院影印）。參校本：另一系統之《白氏六帖事類集》通行文字本。\n處理欄：「從參校本」＝初錄有誤，參校本可通，據以改定；「參校定」＝初錄存疑（[?]）或不可辨，參酌門目表及參校本定讀；「說明」＝體例或範圍上的說明，非字句改定。\n卷六特別說明：參校本卷六僅五千六百餘字，本稿三萬餘字；參校本於雙行小注脫漏尤甚，逐字自動比對所得結果多不可信，已一概不採；故卷六之改定集中於卷首門目，正文夾注部分仍待人工覆核。\n卷七特別說明：參校本約五千六百字，本稿約二萬五千字；自動逐字比對得二十處候選，逐條覆核後採六處。\n卷十本卷說明：本卷底本於葉二十九ウ與葉三十オ之間有缺，贈貺第十九至採風謠第三十一凡十三門不存。\n卷十五本卷說明：本卷底本止於致師第三十八，持重第三十九至寇戎第八十一凡四十三門及尾題皆闕。"}]</script>

<script>
(function(){
  "use strict";
  const DOCS = JSON.parse(document.getElementById('corpus-data').textContent);
  const TOP_K = 6;
  const SETTINGS_KEY = 'liutie_settings_v2';

  /*RETRIEVAL_START*/
  // ---------- 本機檢索：二字詞 BM25 + 門類名稱加權 ----------
  const PUNCT_RE = /[\s　「」『』（）()《》〈〉【】\[\]{}、，。；：？！,.;:?!"'“”‘’·…—－\-／\/\\|〔〕]+/g;
  const QUERY_STOP = ['請引用原文','引用原文','出自何處','出自哪裡','出自哪裏','請問','告訴我','有哪些','有沒有','為什麼',
    '哪些','哪個','什麼','為何','如何','是否','收錄','門下','提到','共有','一下','事目','典故','內容','條目','的','門類','說明','幫我','請','嗎','呢','吧']
    .sort((a,b)=> b.length - a.length);

  // 異體字／俗字對照（只用於比對與標示，不改動原文顯示）
  const VARIANT_PAIRS = '劎劍劔劍爥燭隷隸妬妒牀床桉案厨廚内內户戶戸戶羣群鷄雞鴈雁盃杯髙高髪髮隣鄰絶絕煑煮峯峰躰體';
  const VARIANTS = (() => { const m = {}; const a = Array.from(VARIANT_PAIRS); for (let i = 0; i + 1 < a.length; i += 2) m[a[i]] = a[i+1]; return m; })();
  function normStr(s){ let o = ''; for (const ch of String(s)) o += (VARIANTS[ch] || ch); return o; }

  function runsOf(str){
    return normStr(String(str == null ? '' : str)).split(PUNCT_RE).filter(Boolean);
  }
  function bigramsOf(str){
    const out = [];
    for (const run of runsOf(str)) {
      const chars = Array.from(run);
      for (let i = 0; i < chars.length - 1; i++) out.push(chars[i] + chars[i+1]);
    }
    return out;
  }
  function cleanQuery(q){
    let s = String(q || '');
    s = s.replace(/卷(?:第)?[一二三四五六七八九十]{1,3}|第[一二三四五六七八九十]{1,3}卷/g, ' ');
    for (const w of QUERY_STOP) s = s.split(w).join(' ');
    return s;
  }
  // 問題中提到的卷次，例如「卷六」「卷第七」「第三卷」 -> ['卷第六', ...]
  function volumesIn(q){
    const out = [];
    const re = /卷(?:第)?([一二三四五六七八九十]{1,3})|第([一二三四五六七八九十]{1,3})卷/g;
    let m;
    while ((m = re.exec(String(q || '')))) {
      const v = '卷第' + (m[1] || m[2]);
      if (!out.includes(v)) out.push(v);
    }
    return out;
  }
  const CN_DIGIT = { '一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9 };
  function cnToInt(s){
    s = String(s);
    const k = s.indexOf('十');
    if (k < 0) return CN_DIGIT[s] || 0;
    return (k === 0 ? 1 : (CN_DIGIT[s.slice(0, k)] || 0)) * 10 + (CN_DIGIT[s.slice(k + 1)] || 0);
  }
  function intToCn(n){
    const d = '〇一二三四五六七八九';
    if (n < 10) return d[n];
    if (n < 20) return '十' + (n % 10 ? d[n % 10] : '');
    return d[Math.floor(n / 10)] + '十' + (n % 10 ? d[n % 10] : '');
  }
  function tocIdOf(vol){
    // '卷第十一' -> 'toc-juan11'
    const n = cnToInt(String(vol).replace('卷第',''));
    return n ? 'toc-juan' + n : null;
  }

  function buildSearchIndex(docs){
    const df = new Map();
    const items = docs.map(d => {
      const tf = new Map();
      let len = 0;
      const add = (tokens, w) => { for (const t of tokens) { tf.set(t, (tf.get(t) || 0) + w); len += w; } };
      add(bigramsOf(d.text), 1);
      add(bigramsOf(d.menu), 3);
      add(bigramsOf(d.sub_menu), 3);
      add(bigramsOf(d.source), 1);
      return { tf, len };
    });
    for (const it of items) for (const t of it.tf.keys()) df.set(t, (df.get(t) || 0) + 1);
    const avgLen = items.reduce((s, i) => s + i.len, 0) / Math.max(1, items.length);

    // 門類名稱（例如「風第十三」）：問題中完整出現時加權
    const keyCount = new Map();
    const docKeys = docs.map(d => {
      const ks = new Set(runsOf(d.menu).concat(runsOf(d.sub_menu)).filter(r => r.length >= 3 && !/^(卷|目錄)/.test(r)));
      ks.forEach(k => keyCount.set(k, (keyCount.get(k) || 0) + 1));
      return ks;
    });
    // 單字門名（劍、刀、鼎、酒…）：只在問題裡單獨出現該字時加權
    const headName = docs.map(d => {
      const m = normStr(d.menu || '').replace(/第?[一二三四五六七八九十廿卅卌百]+.*$/, '').trim();
      return Array.from(m).length === 1 ? m : '';
    });
    return { items, df, avgLen, N: docs.length, docKeys, keyCount, headName };
  }

  function makeRetriever(docs){
    const idx = buildSearchIndex(docs);
    const k1 = 1.2, b = 0.75;
    const idOf = (id) => docs.findIndex(d => d.id === id);

    return function retrieve(question, k){
      let qTokens = Array.from(new Set(bigramsOf(cleanQuery(question))));
      const soloRuns = runsOf(cleanQuery(question)).filter(r => Array.from(r).length === 1);
      if (!qTokens.length && !soloRuns.length && !/總目|目錄|門類|門目|有哪些門|全書/.test(question)) qTokens = Array.from(new Set(bigramsOf(question)));
      const qSet = new Set(qTokens);
      const qNorm = normStr(String(question || '')).replace(PUNCT_RE, '');

      const scores = new Array(docs.length).fill(0);
      for (const t of qTokens) {
        const df = idx.df.get(t) || 0;
        if (!df) continue;
        const idf = Math.log(1 + (idx.N - df + 0.5) / (df + 0.5));
        for (let i = 0; i < idx.items.length; i++) {
          const tf = idx.items[i].tf.get(t);
          if (!tf) continue;
          const norm = tf + k1 * (1 - b + b * idx.items[i].len / idx.avgLen);
          scores[i] += idf * (tf * (k1 + 1)) / norm;
        }
      }
      const maxRaw = Math.max(0, ...scores);
      for (let i = 0; i < docs.length; i++) {
        for (const key of idx.docKeys[i]) {
          if ((idx.keyCount.get(key) || 0) <= 8 && qNorm.includes(key)) {
            scores[i] += Math.max(3, 0.5 * maxRaw);
            break;
          }
        }
      }

      // 非校勘問題時，校勘表條目略降權，讓正文優先
      if (/校勘|校記|參校|改定|底本|初錄|釋讀|異文|校本|誤識|勘誤|漫漶|存疑|要改|改為|為何改|為什麼改|據改|修訂/.test(question)) {
        for (let i = 0; i < docs.length; i++) if (docs[i].source === '校勘表') scores[i] *= 1.5;
      } else {
        for (let i = 0; i < docs.length; i++) if (docs[i].source === '校勘表') scores[i] *= 0.75;
      }

      // 「收錄範圍與缺漏」說明段：只有問到收錄、缺葉、缺漏時才讓它排前
      if (!/收錄|缺葉|缺漏|缺門|缺卷|缺頁|範圍|不全|殘缺|原缺|尚未|哪些卷|完整/.test(question)) {
        for (let i = 0; i < docs.length; i++) if (docs[i].source === '收錄說明') scores[i] *= 0.15;
      }

      if (soloRuns.length) {
        for (let i = 0; i < docs.length; i++) {
          if (idx.headName[i] && soloRuns.includes(idx.headName[i])) scores[i] += Math.max(2, 0.4 * maxRaw);
        }
      }

      // 問題指定卷次時，其他卷的段落降權（前言、凡例、全書目錄不受影響）
      const vols = volumesIn(question);
      const haveVols = new Set(docs.map(d => d.juan).filter(Boolean));
      const missingVols = vols.filter(v => !haveVols.has(v));
      const wantVols = vols.filter(v => haveVols.has(v));
      if (wantVols.length) {
        for (let i = 0; i < docs.length; i++) {
          if (docs[i].juan && !wantVols.includes(docs[i].juan)) scores[i] *= 0.4;
        }
      }

      let ranked = scores.map((s, i) => ({ i, s })).filter(x => x.s > 0).sort((a, c) => c.s - a.s);

      // 問「總目／門類」之類的問題，固定帶入目錄（問全書時，全書目錄排最前）
      const forced = [];
      const wantsToc = /總目|目錄|門類|門目|有哪些門|全書/.test(question);
      if (/全書|三十卷|各卷/.test(question) || (wantsToc && !wantVols.length)) forced.push('toc-30juan');
      if (wantsToc) for (const v of wantVols) { const t = tocIdOf(v); if (t) forced.push(t); }
      const top = ranked.length ? ranked[0].s : 1;
      let chosen = ranked.slice(0, k);
      for (const fid of forced.slice().reverse()) {
        const di = idOf(fid);
        if (di < 0) continue;
        const existing = chosen.find(x => x.i === di);
        chosen = chosen.filter(x => x.i !== di);
        chosen.unshift(existing || { i: di, s: top });
      }
      chosen = chosen.slice(0, k);

      const best = chosen.length ? Math.max(...chosen.map(x => x.s)) : 1;
      const hits = chosen.map(x => ({ doc: docs[x.i], score: x.s, rel: Math.max(1, Math.round(100 * x.s / best)) }));
      return { hits, qSet, missingVols };
    };
  }
  /*RETRIEVAL_END*/

    const P = PROVIDERS[provider];
    let url, headers = {};

      url = 'https://api.anthropic.com/v1/models?limit=100';
      headers = { 'x-api-key': key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' };
    } else if (P.api === 'gemini') {
      url = 'https://generativelanguage.googleapis.com/v1beta/models?pageSize=200';
      headers = { 'x-goog-api-key': key };
    } else {
      url = P.modelsUrl;
      if (key && !P.keyOptionalForModels) headers = { 'authorization': 'Bearer ' + key };
    }
    let res;
    try { res = await fetch(url, { method: 'GET', headers }); }
    catch (e) { throw new Error('無法連線到 ' + P.host + '。'); }
    const raw = await res.text();
    let data = null;
    try { data = JSON.parse(raw); } catch (e) {}
    if (!res.ok) {
      let msg = (data && data.error && (data.error.message || data.error)) || (data && data.detail) || raw.slice(0, 160);
      if (typeof msg !== 'string') msg = JSON.stringify(msg).slice(0, 160);
      throw new Error('HTTP ' + res.status + '：' + msg);

    let ids = [];

  el('openSettings').addEventListener('click', openSettings);
  el('closeSettings').addEventListener('click', closeSettings);
  el('cancelSettings').addEventListener('click', closeSettings);
  settingsOverlay.addEventListener('click', (e)=>{ if (e.target === settingsOverlay) closeSettings(); });
  el('toggleKeyVisibility').addEventListener('click', ()=>{
    const showing = keyInput.type === 'text';
    keyInput.type = showing ? 'password' : 'text';
    el('toggleKeyVisibility').textContent = showing ? '顯示' : '隱藏';
  });
  function guessProviderOfKey(key){
    for (const k of Object.keys(PROVIDERS)) if (PROVIDERS[k].prefix && PROVIDERS[k].prefix.test(key)) return k;
    return null;
  }
  el('saveSettings').addEventListener('click', ()=>{
    stashDraft();
    for (const k of Object.keys(PROVIDERS)) {
      const key = draft.keys[k] || '';
      if (!key) continue;
      if (/^hf_/i.test(key)) {
        settingsMsg.textContent = '這是 Hugging Face 的 token，不是 ' + PROVIDERS[k].short + ' 的金鑰。';
        return;
      }
      const g = guessProviderOfKey(key);
      if (g && g !== k) {
        if (k === providerSelect.value) {
          settingsMsg.textContent = '「' + PROVIDERS[k].short + '」欄位裡的金鑰看起來是 ' + PROVIDERS[g].short + ' 的（開頭 ' + key.slice(0, 4) + '…），請放到對應的服務下。';
          return;
        }
        draft.keys[k] = '';      // 其他服務欄位裡放錯的金鑰：直接丟棄，避免擋住儲存
      }
    }
    settings.provider = providerSelect.value;
    settings.keys = {};
    settings.models = {};
    for (const k of Object.keys(PROVIDERS)) {
      if (draft.keys[k]) settings.keys[k] = draft.keys[k];
      if (draft.models[k] && draft.models[k] !== PROVIDERS[k].defModel) settings.models[k] = draft.models[k];
    }
    settings.remember = rememberKey.checked;
    settings.retrievalOnly = retrievalOnly.checked;
    persistSettings();
    renderMode();
    closeSettings();
  });
  el('clearKeyBtn').addEventListener('click', ()=>{
    settings.keys = {};
    if (draft) draft.keys = {};
    keyInput.value = '';
    persistSettings();
    renderMode();
    settingsMsg.textContent = '已清除此瀏覽器上所有服務的金鑰。';
  });
  renderMode();

  // ---------- helpers ----------
  function formatLoc(d){
    let s = '';
    if (d.juan && !(d.menu || '').startsWith('卷')) s += d.juan.replace('卷第', '卷') + '・';
    if (d.menu) s += d.menu;
    if (d.sub_menu) s += '／' + d.sub_menu;
    if (d.page) s += '（印刷頁' + String(d.page).replace(/^印刷頁/, '') + (d.leaf ? '／葉' + d.leaf : '') + '）';
    return s || d.source;
  }

  function highlightInto(container, text, qSet){
    const chars = Array.from(text);
    const normChars = Array.from(normStr(text));
    const marked = new Array(chars.length).fill(false);
    for (let i = 0; i < chars.length - 1; i++) {
      if (qSet.has(normChars[i] + normChars[i+1])) { marked[i] = true; marked[i+1] = true; }
    }
    let i = 0;
    while (i < chars.length) {
      let j = i;
      while (j < chars.length && marked[j] === marked[i]) j++;
      const seg = chars.slice(i, j).join('');
      if (marked[i]) {
        const m = document.createElement('mark');
        m.textContent = seg;
        container.appendChild(m);
      } else {
        container.appendChild(document.createTextNode(seg));
      }
      i = j;
    }
  }

  function buildPassages(hits, qSet, openCount){
    const box = document.createElement('div');
    box.className = 'passages';
    hits.forEach((h, idx) => {
      const det = document.createElement('details');
      det.className = 'passage';
      if (idx < openCount) det.open = true;
      const sum = document.createElement('summary');
      sum.textContent = '【' + (idx + 1) + '】' + formatLoc(h.doc) + (h.doc.source === '校勘表' ? '　〔校勘表〕' : '');
      det.appendChild(sum);
      const txt = document.createElement('div');
      txt.className = 'source-text';
      highlightInto(txt, h.doc.text, qSet);
      det.appendChild(txt);
      box.appendChild(det);
    });
    return box;
  }

  // ---------- Claude ----------
  function buildSystemPrompt(){
    return '你是協助整理與校讀《白氏六帖事類集》的研究助理，服務對象是研究中國法制史／古典文獻的博士生。'
      + '你只能根據使用者訊息中「檢索到的原文段落」作答；這些段落由本機字詞比對檢索而來，來自使用者團隊正在數位化的前言與卷一、卷三至卷十五（含各卷總目、正文，以及卷一、卷六至卷十五的校勘表），'
      + '尚未涵蓋卷二與卷十六至卷三十；卷八、卷十、卷十五另有缺葉或缺門（見「收錄範圍與缺漏」段落）；且可能漏掉用字不同但語意相關的段落。回答規則：\n'
      + '1. 一律使用繁體中文與臺灣慣用語（避免「信息」「默認」「軟件」等大陸用語），語氣精確、避免臆測。\n'
      + '2. 引用具體字句或事目時，於句末以括號標明出處，格式如：（卷一，天第一，印刷頁十／葉二ウ）；卷三至卷五的段落沒有印刷頁，只標「卷X，門類名」；若引自校勘表，標明「校勘表：<位置>」。\n'
      + '3. 若提供的段落不足以回答問題，請誠實說明「目前檢索到的段落（前言＋卷一、卷三至卷十五）未涵蓋此內容」，並可建議改用原文用字再問；切勿杜撰原文或校勘結論。\n'
      + '4. 原文為未加標點之文言錄文，部分字句因刻版漫漶而空缺（以空格表示），回答時可指出此點，不必勉強補足。';
  }

  function buildUserMessage(question, hits){
    let s = '【使用者提問】\n' + question + '\n\n【檢索到的原文段落（本機字詞檢索，依相關度排序）】\n';
    hits.forEach((h, idx) => {
      s += '\n◆ 段落' + (idx + 1) + '｜' + formatLoc(h.doc) + '｜來源：' + h.doc.source + '\n' + h.doc.text + '\n';
    });
    return s;
  }

  async function callLLM(system, userMsg){
    const P = PROVIDERS[settings.provider];
    const model = curModel();
    const key = curKey();
    let url, headers, body;
    if (P.api === 'claude') {
      url = 'https://api.anthropic.com/v1/messages';
      headers = {
        'x-api-key': key, 'anthropic-version': '2023-06-01', 'content-type': 'application/json',
        'anthropic-dangerous-direct-browser-access': 'true'
      };
      body = { model, max_tokens: 1500, system, messages: [{ role: 'user', content: userMsg }] };
    } else if (P.api === 'gemini') {
      url = 'https://generativelanguage.googleapis.com/v1beta/models/' + encodeURIComponent(model.replace(/^models\//, '')) + ':generateContent';
      headers = { 'x-goog-api-key': key, 'content-type': 'application/json' };
      body = {
        systemInstruction: { parts: [{ text: system }] },
        contents: [{ role: 'user', parts: [{ text: userMsg }] }],
        generationConfig: { maxOutputTokens: 4096 }
      };
    } else {
      url = P.url;
      headers = { 'authorization': 'Bearer ' + key, 'content-type': 'application/json' };
      body = {
        model,
        messages: [{ role: 'system', content: system }, { role: 'user', content: userMsg }]
      };
      if (P.useMaxCompletion && /^(gpt-5|o\d)/i.test(model)) body.max_completion_tokens = 4000;   // 推理型模型不收 max_tokens
      else body.max_tokens = P.maxTokens || 1500;
    }
    const send = async () => {
      try {
        return await fetch(url, { method: 'POST', headers, body: JSON.stringify(body) });
      } catch (e) {
        throw new Error('無法連線到 ' + P.host + '，請檢查網路連線或瀏覽器的擴充功能是否擋下請求。');
      }
    };
    let res = await send();
    let raw = await res.text();
    let data = null;
    try { data = JSON.parse(raw); } catch(e){}
    // 少數相容服務（如 Cohere）要求系統指示用 developer 角色；被拒時改用一次
    if (!res.ok && res.status === 400 && P.altSystemRole && body.messages && body.messages[0] && body.messages[0].role === 'system' && /role|system|developer/i.test(raw)) {
      body.messages[0].role = P.altSystemRole;
      res = await send();
      raw = await res.text();
      data = null;
      try { data = JSON.parse(raw); } catch(e){}
    }
    if (!res.ok) {
      let msg = raw.slice(0, 200);
      if (data && data.error && data.error.message) msg = data.error.message;
      else if (data && data.detail) msg = typeof data.detail === 'string' ? data.detail : JSON.stringify(data.detail).slice(0, 200);
      else if (data && data.message) msg = String(data.message);
      let hint = '';
      if (res.status === 401 || res.status === 403 || /api key not valid|invalid api key|API_KEY_INVALID|unauthorized/i.test(msg)) hint = '（金鑰無效、已被撤銷或沒有權限，請到「設定」重新輸入）';
      else if (res.status === 404) hint = '（找不到這個模型 ID，請到「設定」按「載入可用模型」重新選擇）';
      else if (res.status === 402) hint = '（帳戶餘額不足；若想用免費額度，請改選結尾為「:free」的模型）';
      else if (res.status === 429) hint = '（請求太頻繁或已用完額度；免費額度有每分鐘／每日上限，請稍後再試，或換一個模型）';
      else if (res.status === 400 && /credit balance/i.test(msg)) hint = '（Anthropic 帳戶餘額不足，請至 console.anthropic.com 儲值）';
      throw new Error(P.short + ' HTTP ' + res.status + '：' + msg + hint);
    }
    let text = '';
    if (P.api === 'claude') {
      text = (data && data.content ? data.content : []).filter(b => b.type === 'text').map(b => b.text).join('');
    } else if (P.api === 'gemini') {
      const cand = data && data.candidates && data.candidates[0];
      text = cand && cand.content && cand.content.parts ? cand.content.parts.map(p => p.text || '').join('') : '';
      if (!text && data && data.promptFeedback && data.promptFeedback.blockReason) {
        throw new Error('Gemini 拒絕回答（' + data.promptFeedback.blockReason + '）。');
      }
      if (cand && cand.finishReason === 'MAX_TOKENS') text += '\n（回答因長度上限被截斷）';
    } else {
      const ch = data && data.choices && data.choices[0];
      let c = ch && ch.message ? ch.message.content : '';
      if (Array.isArray(c)) c = c.map(x => (typeof x === 'string' ? x : (x && x.text) || '')).join('');
      text = String(c || '').replace(/<think>[\s\S]*?<\/think>/g, '').trim();
      if (ch && ch.finish_reason === 'length') text += '\n（回答因長度上限被截斷）';
    }
    return text || '(無回應內容)';
  }

  // ---------- chat UI ----------
  function addMessage(role, build){
    emptyState.hidden = true;
    const wrap = document.createElement('div');
    wrap.className = 'msg ' + role;
    chatLog.appendChild(wrap);
    build(wrap);
    wrap.scrollIntoView({ behavior: 'smooth', block: 'end' });
    return wrap;
  }
  function addUserMessage(text){
    addMessage('user', (wrap) => {
      const b = document.createElement('div');
      b.className = 'bubble';
      b.textContent = text;
      wrap.appendChild(b);
    });
  }
  function addAssistantPending(text){
    let bubbleRef;
    const wrap = addMessage('assistant', (w) => {
      const b = document.createElement('div');
      b.className = 'bubble pending';
      b.textContent = text;
      w.appendChild(b);
      bubbleRef = b;
    });
    return { wrap, bubble: bubbleRef };
  }

  function renderRetrievalOnly(bubble, wrap, hits, qSet, note){
    bubble.className = 'bubble';
    bubble.textContent = (note || '') + '最相關的原文段落：';
    wrap.appendChild(buildPassages(hits, qSet, 3));
  }

  async function askQuestion(question){
    addUserMessage(question);
    const generating = useGeneration();
    const { wrap, bubble } = addAssistantPending(generating ? '正在檢索並請模型整理回答…' : '正在檢索…');
    const { hits, qSet, missingVols } = retrieve(question, TOP_K);
    const missNote = missingVols && missingVols.length ? '※ 語料庫尚未收錄 ' + missingVols.join('、') + '，以下為其他卷中用字相近的段落。\n' : '';
    if (!hits.length) {
      bubble.className = 'bubble';
      bubble.textContent = '語料庫（前言＋卷一、卷三至卷十五）中找不到與提問用字相符的段落。可以換個說法，或改用原文裡的字詞（例如典故原句、門類名稱）再問一次。';
      return;
    }
    if (!generating) { renderRetrievalOnly(bubble, wrap, hits, qSet, missNote); return; }
    try {
      const answer = await callLLM(buildSystemPrompt(), buildUserMessage(question, hits));
      bubble.className = 'bubble';
      bubble.textContent = missNote + answer;
      const details = document.createElement('details');
      details.className = 'sources';
      const summary = document.createElement('summary');
      summary.textContent = '本次引用原文段落（' + hits.length + '）';
      details.appendChild(summary);
      details.appendChild(buildPassages(hits, qSet, 0));
      wrap.appendChild(details);
    } catch (err) {
      bubble.className = 'bubble error';
      bubble.textContent = '呼叫 ' + PROVIDERS[settings.provider].short + ' 失敗：' + err.message + '\n（下方仍列出本機檢索到的原文段落。）';
      wrap.appendChild(buildPassages(hits, qSet, 3));
    }
  }

  sendBtn.addEventListener('click', () => {
    const q = questionInput.value.trim();
    if (!q) return;
    questionInput.value = '';
    autoResize();
    askQuestion(q);
  });
  questionInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      sendBtn.click();
    }
  });
  function autoResize(){
    questionInput.style.height = 'auto';
    questionInput.style.height = Math.min(140, questionInput.scrollHeight) + 'px';
  }
  questionInput.addEventListener('input', autoResize);

  // ---------- TOC quick list (per volume) ----------
  const tocDocs = DOCS.filter(d => /^toc-juan\d+$/.test(d.id)).sort((a, b) => Number(a.id.slice(8)) - Number(b.id.slice(8)));
  const tocVolume = el('tocVolume');
  function renderToc(docId){
    tocList.textContent = '';
    const doc = DOCS.find(d => d.id === docId);
    if (!doc) return;
    const vol = '卷' + intToCn(Number(doc.id.slice(8)));
    doc.text.split('\n').filter(l => l && !l.startsWith('白氏六帖') && !l.startsWith('　以下')).forEach(line => {
      const name = line.split(/[\s　]+/)[0];
      const btn = document.createElement('button');
      btn.textContent = line.replace(/[\s　]+/g, ' ');
      btn.title = line;
      btn.addEventListener('click', () => {
        questionInput.value = vol + '「' + name.trim() + '」門下收錄哪些事目？請引用原文。';
        questionInput.focus();
        autoResize();
      });
      tocList.appendChild(btn);
    });
  }
  tocDocs.forEach(d => {
    const o = document.createElement('option');
    o.value = d.id;
    o.textContent = d.menu.replace('卷第', '卷');
    tocVolume.appendChild(o);
  });
  tocVolume.addEventListener('change', () => renderToc(tocVolume.value));
  if (tocDocs.length) renderToc(tocDocs[0].id);

  // ---------- example chips ----------
  const examples = [
    '卷一總目共有哪些門類？',
    '「天圓不中規」出自何處？',
    '卷七「姓氏第十六」為什麼要改？'
  ];
  examples.forEach(q => {
    const chip = document.createElement('button');
    chip.className = 'chip';
    chip.textContent = q;
    chip.addEventListener('click', () => { questionInput.value = q; questionInput.focus(); autoResize(); });
    exampleChips.appendChild(chip);
  });

})();
</script>
