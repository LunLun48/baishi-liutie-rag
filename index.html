n炭輕重（小字：淮南子曰水勝故夏至濕火勝則多至燥燥則輕濕則重故先冬至夏至懸土炭於衡各一端令適等冬至陽氣至則炭仰而鐵低夏至則炭低而鐵仰也）\n禁（小字：王莽欲防人盜鑄禁人不挾銅炭）\n獸炭（小字：晉羊琇屑炭和作獸形）\n掘得（小字：交州記曰霍頭山越王掘聚之處掘得神炭）\n難合（小字：淮南子曰譬如水炭絃繘何時而合注曰冰寒炭熱無時得合）\n天帝裝炭（小字：越王勾踐有寶劍五薛燭曰當造之時雨師洒掃雷公擊橐蛟龍捧爐天帝裝炭）\n洛（小字：庾肩吾云識熟昆明之灰見昆明之灰猶愧伯趙鳥不復因人之熱劉孝威謝東宮賚炭啓曰洛城雪深不見蓐神之跡呼沱冰合無待王朝之規聚而為岳大如黑山稱之以斛將重牙獸鑪生煇焰室滿紅光雖求夜入而識晷漏布炭而無污）"},{"id":"juan5-038","source":"正文","juan":"卷第五","menu":"厨第三十五","sub_menu":null,"page":null,"leaf":null,"text":"〔爨附〕\n大庖不盈（小字：詩）\n君子遠庖厨 車載良庖 庖丁解牛\n厨食（小字：漢詔吏或飾厨傳稱過客言盛庖厨稱過客之意）\n刀匕（小字：是供膳夫）\n充君之庖（小字：田獵一為乾豆二為賓客三為充君之庖）\n爨門（小字：附厨）\n當爨無煙之人（小字：言厨饌寒窶薄也莊子）\n蠟燭炊（小字：石季倫以蠟燭炊出世說）\n爨鼎（小字：莊子云有人冬爨鼎夏造冰）\n同爨緦（小字：禮曰同爨緦）\n白氏六帖事類集卷第五"},{"id":"toc-juan3","source":"卷三總目","juan":"卷第三","menu":"卷第三總目","sub_menu":null,"page":null,"leaf":null,"text":"白氏六帖事類集卷第三　本卷總目（共 31 門）\n西京第一\n東京第二\n城三(計料順時勞役具土功門)\n關四(征稅具賦稅門)\n道路五(泥塗附)\n封疆第六\n郊第七\n野第八\n閭里第九(敬桑梓附)\n館驛十(驛馬附)\n橋十一(修附)\n井十二(汲水附)\n宅十三(修造 毀壞 辭宅 擇鄰 貧陋 奢盛 崩倒 假宅附)\n廨署十四(凶附)\n廁十五\n樓十六\n閣十七\n臺十八\n堂十九\n屋室二十\n門戶二十一(牖天子門諸侯門修造附)\n倉廩二十二(擅開常平附)\n庫藏二十三(主守附)\n管籥二十四\n園圃二十五(灌園附)\n藩籬二十六\n牆壁二十七(奢侈 築葺 壞牆 穿窬附)\n竇二十八\n竈二十九(祭附)\n車三十(造車 美車 覆破 同載 戎車 使車 躬車 無車 借車 走馬車附)\n舟三十一(造舩 戰舩 覆舩 御舩 開水路附)"},{"id":"juan3-000","source":"正文","juan":"卷第三","menu":"西京第一","sub_menu":null,"page":null,"leaf":null,"text":"作我上都(漢之西遷作我上都)\n上腴(九州之上腴)\n奧區(天地之奧區)\n三成帝畿(周秦漢)\n周以龍興(秦以虎視)\n四塞(秦地被山帶河四塞之固)\n沃野千里天府名都邦畿千里(城闕九重)\n秦據而彊(漢都而威)\n寔惟地之神臯天邑覽秦制(跨周法)\n京邑翼翼(四方取則)\n神州之略(赤縣之畿)\n京師(王室)\n皇州(皇都帝里)\n百二之都(言險固要害)\n水陸(所湊)\n秦之興也(天錫鶉首之分)\n漢之王也(星符東井之精)\n險(左據函谷崤陵之阻右界褒斜隴首之險)\n在鎬(王在在鎬)\n帝王之宅(崤函作帝王之宅)\n金城(漢張良曰關中左崤函右隴蜀南有巴蜀之饒北有胡苑之利東制諸侯所謂金城千里天府之國)\n建瓴(漢書曰秦中形勝之國加兵於諸侯猶高屋上建瓴水)\n建邦設都(書)\n封畿甸服千里法日(白虎通京師者千里之邑法日月之徑千里)\n帝畿(王畿)\n申畫(書曰申畫郊圻申畫規畫)\n經野(周禮體國經野注云經謂為之里數也)\n制其畿疆(周禮)\n制其畿方千里而封樹之(注樹木溝上所以表助險固也)\n正封(周禮正畿疆之封)\n制畿(周禮制其畿封以正邦國)\n王城帝宅表裏山河周原(詩周原膴膴堇荼如飴)\n域民(是以聖主域民漢書)\n郊野之富(號為近蜀)\n鄭白之沃坤靈正位"},{"id":"juan3-001","source":"正文","juan":"卷第三","menu":"東京第二","sub_menu":null,"page":null,"leaf":null,"text":"建都河洛即土之中東京翼翼(四方之極)\n增周法(修漢制)\n萬方輻湊處於中土帶河(泝洛)\n宅中(以圖大)\n左伊右瀍封畿(千里)\n定鼎之都建圭之地(大司徒以土圭之法測土深正日景以求地中)\n經營(書成王在豐欲宅洛邑使召公先相宅旣卜宅則經營召公旣相宅周公往營成周使來告卜曰澗水東瀍水西惟洛食食吉兆也)\n無外稱尊(宅中圖大)\n先王之經邑也(度天地之所合四時之所交風雨之所會陰陽之所和然則百物阜安乃建王國焉所謂建土圭以測影得天地之中)\n郟鄏(成王定鼎于郟鄏)\n王者之里(河洛邑為王者之里)\n後漢中興(光武都洛京)\n十而作邑(聞宗周之經營)\n居以為都(見炎漢之遺制)\n卜洛(遷周)\n險(史記初大臣勸高祖都洛陽曰東有成臯西有崤澠背河洛其固足恃也以為鎮三川九阪三塗九谷也)\n建國(周禮惟王建國注營作洛邑於中土)\n新邑(于東國洛書)\n召公所相(周公所營)\n域民(見西京門注)\n東周延祚(平王東遷而延祚)\n衡臯(梓澤)\n金谷(銅街)\n河洛大都(成周故地)"},{"id":"juan3-002","source":"正文","juan":"卷第三","menu":"城第三","sub_menu":null,"page":null,"leaf":null,"text":"〔計料順時勞役具土功門〕\n高城(深池)\n崇墉(浚洫)\n城郭(溝池以為固)\n金湯(金城湯池)\n美城(傳美城之大名)\n無戎而城(讎必保焉)\n廣袤(高卑)\n繕其城隍秦築(長城延袤千里以拒胡也)\n城郢(楚囊瓦城郢沈尹戍曰苟不能衛城無益也)\n亟城(梁伯好上功亟城而不處民罷而不堪則曰某寇將至乃溝公宮)\n漆(秦二世欲漆其城)\n崩(杞梁死其妻哭之城為之崩)\n四墉是資善守(何患來攻)\n啓塞從時(門戶道橋謂之啓城郭牆壍謂之塞開閉之急不可一日而闕隨壞時而理之不可限以土功之時)\n坏城郭(月令孟冬)\n城以巨防(門以重閉)\n懷德惟寧(雖聞士蔿)\n不供是懼(終執仲幾)\n宗子(維城)\n山爲(楚國方城以爲城漢水以爲池又秦踐華山為城因河為池據萬丈之城臨不測之川)\n要害(當要害之衢控形勝之國)\n用逸制勞(以寡勝眾)\n城門禁(後漢郅惲君章為上東門侯帝常獵遇夜方駕還惲拒關不開帝乃迴從中東門入賜惲布貶中東門侯)\n所過治城(馬援所過輒為郡縣治城郭)\n保民(穀梁曰城以保民為之也民眾城小則益城益城無極凡城之志皆譏也注夫保民以德不以城如民衆輒益城是無限極也)\n扼地咽喉(為國藩屏)\n扃鐍土宇(緘滕地維)\n沙城(魏祖征馬超每渡渭為超騎所突營不得立又多沙不可築城婁子伯說公曰今天寒可起沙為城以水灌之從之一夜而成)\n城民(見上)\n眾心(國語衆心成城言以眾心為城)\n走集(傳險其走集)\n踐華為城(賈誼過秦論)\n解帶(為城墨子)\n干城(詩赳赳武夫公侯干城)\n却月(荆州圖說有却月城)\n長雲(鮑昭蕪城屹若斷岸矗似長雲)\n城麏(楚王使由于城麏復命子西問高厚大小不知子西責之對不能王遇盜雲中余受式嫌在袒示之此余能也脾洩之事余不能麏抂在脾洩)\n城惡(渠丘城惡衆潰奔莒曰城已惡矣其孰與我爲虞)\n雖宗子是固(則可徴辭)\n而大夫不供(亦宜加罪)\n百雉俟我乎城隅"},{"id":"juan3-003","source":"正文","juan":"卷第三","menu":"關第四","sub_menu":null,"page":null,"leaf":null,"text":"〔關市之征具賦稅門〕\n察出禦入(月令章句關在境所以察出禦入)\n以察僞游(漢書置關都尉以察僞游)\n禁異服(禮記關以禁異服)\n反拒(文選曰關門反拒漢得久長)\n負阻(秦負阻於二關卒開項而受沛) 無外(識函谷之可關不知王者之無外)\n善閉(無關鍵)\n司關(周禮司關掌國貨之節以聯門市凡貨不出於關者舉其貨罰其人國凶禮無關門之征)\n關吏控其襟帶(東爲咽喉)\n緘縢甸服(扃鐍王畿)\n何莫由斯(不可踰也)\n雖聖朝無外(何假於關防)\n而帝里宅中(宜察其出入)\n巨防(重閉)\n限其內外(不可踰也)\n察其出入(何莫由斯)\n謹關梁(孟冬)\n執禁(禮曰關執禁以譏議呵察也)\n抱關之吏(用傳之人)\n崇其巨防(察以僞游)\n謁關用傳(傳今之過所也漢興置關都尉以察僞游用傳出入漢文除關無用傳漢景復用傳)\n棄繻(漢書終軍初從南當詣博士步入關關吏與軍繻問以此何吏曰爲復還當以合符軍曰大丈夫西游終不復傳却弃繻而去軍爲謁者行郡國建節東出關關吏識之曰此使者乃前弃繻生)\n買符(東觀漢記郭丹初之長安過宛從陳兆買入關符以入函谷關旣入封符乞人曰不乘使車不出關丹自入關後十二年不歸後出關竟如本志)\n徒(漢武時楊僕征南越有功恥爲關外人帝爲徙函谷關於新安)\n廢(臧文仲廢六關孔子曰不仁也)\n封(東觀漢記隗囂將王元謂囂曰請一丸泥爲大王東封函谷此萬世一時也) 白馬(桓譚新論曰公孫龍常爭論曰白馬非馬人不能屈後乘白馬無符傳欲出關關吏不聽此虛言難以奪實也)\n青牛(列仙傳關令尹喜周大夫也善內學老子西游先見其氣當遇聖人老子果乘青牛薄板車過授喜五千言俱之流沙)\n雞鳴(史記秦昭王囚孟嘗君乃改姓易名夜半至函谷關關法雞鳴出客恐追至客居下坐者能為雞鳴衆雞皆鳴遂得出關又燕太子丹質於秦秦王不禮丹怒而亡歸夜至關關門未開丹為雞鳴衆雞皆鳴遂得逃去)\n生入(漢書班超在絕域年老思歸乃上書曰不敢望到酒泉但願生入玉門關)\n斬關(傳曰臧紇犯門斬關以出)\n徑踰(越度)\n閉關(先王以至日閉關)\n養孤(門關以養孤)\n符節(門關用符節)\n易關市來商旅(易關市輕稅商旅也月令孟冬)\n無索(月令孟夏關市無索順陽敷教不難物也)\n不租(禮年不順成關梁不租)\n譏而不征無驗(商君亡至關不得舍曰商君令舍人無驗者坐之曰為法自敝)\n詐刻傳(甯成爲中尉抵罪髠鉗乃解脫因詐刻傳出關亡歸)\n復關(君子所近)\n叩關(四方賓客叩關即告至)\n偪介之關(暴征其稅)\n食門征(宋公以門賞耏班使食其征)\n開(關延敵)\n閉(閉備他盜)\n苛留(成帝詔勿苛留)\n馬弩關(漢詔罷馬弩關舊征馬高五尺六寸齒未平弩十石已上皆不得出關今不禁故曰罷)\n籍內(漢詔流人欲入關者籍內之注為籍內之也)\n粟無用傳(宣詔人以車載粟入關得無用傳)\n謁關(以從者數對周禮)\n重門(擊柝以待暴客蓋取諸豫)\n門關(關防)\n仰關"},{"id":"juan3-004","source":"正文","juan":"卷第三","menu":"道路第五","sub_menu":null,"page":null,"leaf":null,"text":"〔泥塗附〕\n開通(月令三月開通道路無有障塞)\n平易(傳曰司空以時平易道路)\n三條(西京賦披開三條之廣路)\n九軌(昔黃帝之爲天子國中九經九緯經途九軌野途九軌)\n九途(文選詩九途平若水)\n如砥(周道如砥)\n劇驂(爾雅七達謂之劇驂言車馬多也八達謂之崇期九達謂之逵言交會多也)\n方軌(蜀都賦畫方軌之途)\n康莊(五達六達也並見爾雅)\n大道(青樓臨大道文選)\n多岐(楊朱曰大道以多岐亡羊)\n甚夷(大道甚夷而人好徑老)\n列樹(國語周制有之列樹以表道)\n鑿山(東觀漢記衞颯為桂陽太守鑿山通道列亭置驛)\n羊腸(羊腸路詰曲車輪為之摧)\n由左(禮道路男子由左女子由右車從中央)\n由徑(行不由徑)\n哭(阮籍常率意獨駕不由徑車轍所窮輒慟哭而反)\n泣(楊朱泣岐路謂其可以南可以北)\n讓路(家語曰西伯化行而耕者讓畔行者讓路)\n不拾遺(子產相鄭路不拾遺)\n銅駝(洛陽大道有銅駝因名之)\n石牛(秦惠王欲伐蜀乃刻石牛置黃金於後曰此天牛能糞金蜀王以為然即遣五丁力士拕成道入蜀使張儀隨其路以伐蜀)\n中衢(上路)\n銅街輦轂轍跡通衢道路無壅(傳)\n修道(周禮)\n修除(治道周禮)\n達其道路(周禮司險以周知其山林川澤之阻而達其道路注達者謂山林之阻則開鑿之山澤之阻則橋梁之通道路也)\n五塗(又曰設國之五塗而樹之林以為阻固注五塗道路也)\n藩塞(又曰國有故藩塞阻路而止行者謂閉要路以備姦寇)\n道禁(道路所禁者周禮)\n端徑術(月令孟春端正也徑步道也術車道也)\n遵彼微行(微行牆下行徑也)\n野廬(周禮野廬氏掌達國道路至于四畿時祭祀則率其屬修除)\n徑踰(禁野之橫行徑踰者)\n合方氏(掌達天下之道路不得津梁陷絕)\n銜枚氏(禁呼歎鳴於國中者行歌哭於國中之道者)\n雨畢(而除道國語)\n回中道(武帝通回中道)\n子午道(王莽通子午道)\n罷子午道(後漢詔罷子午道通斜谷)\n隨山刊道(馬援拜伏波將軍緑海隨山刊道千里)\n天衢(易)\n道周(周曲也)\n有蕩(魯道有蕩)\n阻長(道路阻且長)\n宿息井樹 舟車轚互者敘而行之(謂迫隘處使有次序)\n有爵者為之辟(辟行人)\n楬懸任器(蜡氏掌若有死於道路者則令埋而置楬焉書其日月焉縣其衣服任器于有地之官以待其人蜡音七預反)\n除骴(謂死人骨及禽獸骨)\n骴禁(禁謂孟春掩骼理背之屬)\n修閭氏(禁以兵革趨行者與馳騁於國中者)\n塞蹊徑(十月)\n保路(安道路人楚子西)\n閉塗(不通內外使左傳)\n道無列樹列樹表(周禮)\n視塗(司空)\n道笰(定王使單襄公聘宋假道於陳道笰不可行謂草穢塞路)\n羊腸若砥(馬跡如流)\n開通平易 不踐邪徑(焦光孝然行不踐邪徑必循阡陌)\n所過糞除(第五倫事具灑埽門)\n隘巷(詩誕寘之隘巷)\n道而不徑(禮言孝子慎身)\n行不由徑(澹臺滅明字子羽)\n阡陌(風俗通南北為阡東西為陌)\n相鄭(呂氏春秋子產相鄭桃李垂於街衢)\n束馬(懸車任豫益州記江鹵左檐道鄧艾束馬之處)\n道塗不爭險易之利(禮)\n坦途𭰖塗(附道路門)\n送葬不避塗潦(庶人)\n還濘(傳曰晉戎馬還濘而止謂遇𭰖濘盤旋不進)\n辱在𭰖塗胡為乎𭰖中導從避𭰖(魏先賢行狀曰鍾皓季明為司徒掾公出道路𭰖濘導從惡其相灑去公車旋迹公推軾言司徒今日乃獨行爾還府向閣鈴下疾令捐掾屬公奮手不顧時舉府掾屬皆投劾出皓曉之乃止)\n出淖(晉侯與楚戰公陷於淖欒書欲載晉侯鍼乃救公出淖)\n入𭰖(呂錡夢射月中之退入於𭰖)\n中逵(吳都賦流汗霡霂而中逵𭰖濘)\n雨雪載塗(塗凍釋)\n與馬(廉范叔度奔國喪時廬江邵掾嚴麟亦奉章弔國俱會于路麟乘小車塗深馬小不得進范愍之命從吏下馬牽與之不告姓名去麟後訪主將歸之以言恐是范果然)\n致遠恐𭰖 (𭰖難不通)\n蹶𭰖 (則沒足蹶跗莊)\n需于𭰖 (易)\n如塗之附(詩)\n淈其𭰖 (楚辭)\n妾若濁水𭰖 (古詩)\n禹𭰖行乘橇(板置𭰖上通行音茅蕝漢)\n涇水一石其𭰖數斗(白公渠)"},{"id":"juan3-005","source":"正文","juan":"卷第三","menu":"封疆第六","sub_menu":null,"page":null,"leaf":null,"text":"申畫郊圻(書)\n八則(周禮八則治都鄙注都之所居曰鄙公卿大夫采地三子弟所居邑)\n封人中士四人(掌設王之社壝為畿封而樹之凡封國設其社稷之壝封其四疆注封國建諸侯立其國之封)\n遂人主六遂(若司六卿自遠郊達于畿中)\n遂士掌四郊(主四郊之獄)\n方士掌都 家(注四百里至五百里公所食也都王子弟及公卿采地家大夫采地也)\n潁谷封人(潁考叔也封人典封疆者)\n畿疆(大司徒制其畿疆而溝封之)\n刑方氏(制邦國地域而正其封疆)\n經略撫封(傳曰天子經略諸侯撫封)\n封畛(彭仲爽為楚令尹封畛於汝開封畛此至于汝水)\n疆場之事(慎守其一備其不虞)\n隙地(宋鄭之閒有隙地宋鄭為盟曰勿有是注各勿有之)\n甌脫(史東胡與匈奴閒中有弃地千餘里各居其邊為甌脫東胡請於冒頓吾欲有之冒頓怒曰地國之本也遂襲滅東胡注甌脫界上屯守處)\n女爭桑(楚邊邑卑梁氏之處女與吳邊邑妾爭桑二家怒相滅邊邑怒而攻吳楚之釁始於邊女)\n割地相與(燕莊王送齊桓公入齊境公曰非天子命諸侯相送不出境吾不可以無禮於燕於是分溝割燕君所至地與之)\n拓土畫疆 疆場有氏疆場之邑(一彼一此何常無之)\n引其封疆(引正也)\n封疆之削(何國蔑有主齊盟者誰能辯焉注辯治也)\n疆事(封疆之事自疆場之邑至此晉趙孟請楚不戮叔孫豹之辭見左傳昭元年)\n子產云(四有溝洫注云封疆溝洫)\n疆場綺分(選)\n諸侯正封(封疆有定分也)\n疆場無主(則啟戎心)\n侯不在疆(送迎賓客單襄聘楚假道於陳知國必亡)"},{"id":"juan3-006","source":"正文","juan":"卷第三","menu":"郊第七","sub_menu":null,"page":null,"leaf":null,"text":"申畫郊圻遂士掌四郊(注主四郊之獄周禮)\n郊勞(聘客至郊使人郊勞)\n太學在郊邑外謂之郊(爾雅)\n郊迓(郊迎)\n近郊(遠郊)\n多壘(禮曰四郊多壘卿大夫之辱)\n不雨(易曰密雲不雨自我西郊)\n適彼樂郊(詩)"},{"id":"juan3-007","source":"正文","juan":"卷第三","menu":"野第八","sub_menu":null,"page":null,"leaf":null,"text":"牧外謂之野(爾雅)\n大野既豬(東原砥平)\n我行其野(蔽茅其樗婚姻之故言爾孰居詩)\n適野(太叔適野)\n祭於野(傳辛有過伊川見被髮而祭於野者曰不及一年此其戎乎其禮先亡矣)\n乞食於野人(又晉文公過衛出於五鹿乞食於野野人與之塊公子欲鞭之子犯曰天賜也此必得土稽首受而戴之)\n謀於野(又裨諶能謀於野則獲謀於國則否鄭國有難子產載以如野謀四國之事)\n哭(孔子惡野哭者哭所識者則於野)\n又(韓詩外傳曰孔子出游少原之野)\n郊野之富有死鹿(死麏)\n所知吾哭諸野在野(曰廬)\n野無青草莽蒼食野之苹(之芩蒿)\n失禮(求之野)\n割鮮野食經野(體國經野)\n獲麟(西狩大野獲)\n君子在野野無遺賢"},{"id":"juan3-008","source":"正文","juan":"卷第三","menu":"閭里第九","sub_menu":null,"page":null,"leaf":null,"text":"〔敬桑梓附〕\n五家為比使之相保(保任也)\n五比為閭使之相受(四閭為族使之相葬五族為黨使之相賙五州為鄉使之相賓鄉師稽其鄉器比供吉凶二服閭供祭器族供喪器黨供射器州供賓器鄉供吉凶吉禮樂之器若國有大故則鄉大夫各守其商以待政令)\n族師(各掌其族之戒令政事以邦比之法五家為比十家為聯五人為伍十人為聯四閭為族八閭為聯使之相保相受刑罰慶賞及相告以受邦賦以役國事以相葬埋)\n比長(各掌其比之治五家相受相和)\n遂人(掌邦之野以土地之圖經田野造縣鄙形體之法五家為鄰五鄰為里四里為鄼五鄼為鄙五鄙為縣五縣為遂皆有地域溝樹之使各掌其政令刑禁)\n同里(漢盧綰與高祖同里)\n入里門(內史石慶醉歸入里門不下車萬石君聞之對按不食)\n高陽(後漢荀氏舊里名西豪潁陰令康以高陽氏有才子八人荀氏亦八子故改其里為高陽里)\n里仁為美賊不入閭(袁閎事見義感門)\n無閉(月令孟夏門閭無閉)\n龐公(閭里龐公鑿井得銅)\n必步(門閭溝渠必步)\n閭左(秦發)\n式(武王式商容之閭)\n迴車(曾參迴車勝母之閭)\n式干木間(魏文侯式段干木閭)\n聽閭里以版圖(太宰以官府之八成經邦治三曰聽閭里以版圖)\n敬桑梓(附閭里門)\n必式(禮入里必式)\n父母之國(後漢張湛子孝罷馮翊告歸平陵望寺門而下步主簿曰明府位尊不宜自輕湛曰禮下公門式路馬孔子於鄉黨恂恂如也父母之國所宜盡禮何謂輕之哉)\n惟桑與梓(必恭敬止詩)\n與鄉人處(由由然不忍去柳下惠)\n孔子於鄉黨(恂恂如也語)\n里旅(齊景公欲更晏子宅辭云敢煩里旅注旅眾也)"},{"id":"juan3-009","source":"正文","juan":"卷第三","menu":"館驛第十","sub_menu":null,"page":null,"leaf":null,"text":"〔驛馬附〕\n國野(周禮凡國野之道十里有廬廬有飲食三十里有宿宿有路室路室有委五十里有市市有候館候館有積)\n置驛(漢鄭莊置驛以延賓客)\n公館私館侯館館穀行李往來(供其乏困)\n公食(使車)\n傳舍(行人)\n適子之館館給詐傳(魏相字弱翁為茂陵令御史大夫桑弘羊客詐乘御傳傳縣相疑有奸案致其罪)\n壞館垣(子產相鄭伯如晉以魯喪未見子産使壞其館垣以納車馬士文伯讓之子産曰諸侯舍於隸人門不容車而不可踰越賓見無時命不可知請執事將何所命若獲薦幣修垣而行君之惠也趙簡子曰信我實不德而以隸人之垣嬴諸侯是吾罪也使士文伯謝不敏晉侯見鄭伯而有加禮厚其宴好而歸之乃築諸侯之館)\n子姑就館改館晉侯(具七牢)\n縣次續食(鄭當時置驛馬四郊迎賓客縣次與續食注云路次也)\n傳置(驛名)\n賦傳(傳郵賦給)\n飾廚傳聚柝(野廬氏掌達國道路至于四畿比國郊及野之道路宿息井樹若有賓客則令守涂地之人聚槖之有相翔者則誅之)\n蘧廬(莊子曰仁義先王之蘧廬蘧廬舍一宿而去)\n司空不授館(不受客單襄公聘楚假道於陳言陳必亡國語)\n不修(薛宣子惠為彭城令宣過之橋梁郵驛不修知其不能)\n高其閈閎(厚其牆垣以無憂客使左傳)\n長亭短亭(十里五里長亭短亭言十里一長亭五里一短亭)\n息亭傳(劉寵免太尉歸清儉出京師欲息亭舍亭吏止之曰整頓以待劉公寵不言而去時人稱其長)\n欲止郵亭(趙孝長平王莽時父為田禾將軍以父任為郎嘗告歸步擔欲止郵亭亭長不納問曰聞田禾將軍子當過何時至孝曰尋將到)\n請亭地作塚(漢張禹年老自起塚塋好平陽肥牛亭部處地又近延陵奏請求之上以賜禹詔平陵徒亭他所曲陽侯王根聞而爭之此地當平陵寢廟衣冠出游道禹爲師傳不遵謙讓至求衣冠所游之道又徙壞舊亭非所宜孔子稱賜汝愛其羊我愛其禮宜賜他地上卒以肥牛亭地賜之)\n投傳不受(申屠播事見義感門)\n授館閱人多矣(蓋寬饒許伯弟曰如此舍閲人多矣)\n驛馬(附館驛門)\n使車避傳(伯宗避重曰避傳)\n傳置(漢文帝詔太僕見馬遺財餘皆給傳置注遺留也財與纔同傳置驛也)\n具私馬(漢王温舒爲河內守具私馬五十匹自河內至長安以奏事)\n迎賓客(鄭莊見上注)\n駿奔載馳(載軀)\n遽令(驛馬軍書)\n乘傳遄征遄往馹騎乘馹 (馹遽傳也左氏曰楚子乘馹)\n星軺(軺車使車也)"},{"id":"juan3-010","source":"正文","juan":"卷第三","menu":"橋第十一","sub_menu":null,"page":null,"leaf":null,"text":"虹橋星橋(華陽記李冰造七星橋上應星)\n牽牛(秦始皇并天下都咸陽端門四達以制紫宮渭水貫都以象天河橫橋南渡以法牽牛)\n濟川黿鼉(紀年曰周穆王三十七年伐荆東至九江北黿鼉為梁而渡文選方架黿鼉以為梁也)\n烏鵲(淮南子烏鵲填河成橋而渡織女)\n驪龍(思玄賦驪龍之飛梁)\n梁溠(左除道梁溠謂作橋於溠水上)\n造舟為梁(詩)\n水涸(成梁)\n徒杠輿梁(孟子曰子産脱輈濟人是惠而不知其政十一月徒杠成十二月輿梁成人不病涉也徒杠小橋輿梁大橋)\n溴梁(梁莫大於湨梁爾雅)\n石杠不修(見館驛門注)\n游(張良涉游下邳圯上注楚人謂橋爲圮)\n浮(魏志鄧艾伐蜀先作浮橋)\n陷(鍾會伐蜀先令牙門將許儀治道橋陷馬足斬儀)\n黿鼉(見上)\n魚鼈(論衡曰高麗國王有侍婢自云氣如雞子來下我故有身後生子名曰東明東明善射王恐害其國欲殺東明東明走至淹水以弓擊水魚鼈浮為橋而渡)\n枕席(趙充國奏治湟陜以西道橋七十所全可至鮮水左右以制西域信威千里如從枕席上過師)\n川不架(單襄公過陳見川不梁)\n飛梁(橋也見螭龍注)\n題柱(司馬相如往京師過蜀郡升遷橋題其柱曰不乘駟馬不復過此)\n以濟不通(以濟要津)\n達川澤之阻(司險知川澤之阻而達其道路注謂以橋梁通)\n啓塞從時(門戶道橋謂之啓城郭牆𰝛謂之塞開閉急不可一日而闕故墮壞而治之不可限以上功)\n造舟(見上)\n鞭石(秦始皇作石橋欲過海有神人能驅山石下海石去不速神輒鞭之流血)\n墯履(黃石公)\n舉杯(晉書杜預字元凱請建河橋於富平津梁衆論以為殷周所都經聖賢而作必不可作也預曰昔造舟為梁則河橋之謂遂作成上臨會舉杯曰非卿也此橋不立預曰非陛下聖明不成)\n必葺(之功)\n功濟行路川惟設險(橋用濟人)\n苟或騫崩(則勞揭厲)\n人無褰裳(車不濡軌)\n道路無擁用濟車徒(以利來往)\n苟騫崩之不葺(雖揭厲而莫通)\n當啓塞之急(誠合從時)\n有懷襄之虞(如何力)\n石鼈 (晉成都王潁字章度屯汲南阻清水為壘造浮橋通河北以木函盛石沈之以繫橋名曰石鼈)\n崔公橋(後魏崔亮謂水爲橋利百姓名崔公橋)\n三柱折(魏略洛水浮橋三柱折三公象也)\n豫讓橋下尾生(抱梁柱以待女子)\n鴈齒(橋有鴈齒)\n半月(橋似半月)"},{"id":"juan3-011","source":"正文","juan":"卷第三","menu":"井第十二","sub_menu":null,"page":null,"leaf":null,"text":"〔汲附〕\n改井(易改邑不改井)\n往來井井(清絜貌)\n射鮒(井谷射鮒言井上汲而下注如谷水射小魚)\n羸其瓶(瓶未出井而鉤羸其瓶而覆之)\n勿幕(井收勿幕謂不覆之不私其利)\n井德之地 井以辨義(施而無私義之方也)\n挈壺 (周禮挈壺氏挈壺以令軍井者也)\n塞井夷竈 堙(井堙不刊)\n眢井(廢井也)\n及泉(孟子譬如掘井九仭不及泉猶爲弃井)\n浚井(王莽傳謝囂奏武伯長孟通浚井得白石)\n得銅(龐儉父先逃走隨母流宕後居鄉里鑿井得銅遂致富奴蒼曰堂上我婦也問其故奴曰我婦姓艾字阿宏足下有黑子腋下有瘤母曰我翁也遂為夫妻時人曰鑿井得銅買奴得翁)\n鑿井而飲(擊壤歌者)\n𭰖而無禽流而可食 (易曰井㴕不食下也舊井無禽時舍也)\n甘井(先竭)\n石甃(玉甃)\n露井(銀牀)\n玄泉冽井(井冽寒泉)\n伯益之功(伯益作井)\n善利(水善利萬物老子)\n習坎有仁(井有仁焉君子可逝不可陷也)\n抱甕(莊子云子貢過漢陰遇一丈夫方爲圃畦鑿隧而入抱甕而出子貢曰有機於此日浸百畦笑曰有機者必有機心吾恥不為挈水若抽名曰桔槔也)\n負缶(說苑曰衛有五丈夫負缶入井灌薤人教以重後輕前名曰桔槔五丈夫曰機智之巧必有機智心吾恥不為也)\n再拜(耿恭居踈勒匈奴攻城絕其水源穿井十五丈無水恭曰聞貳師將軍拔刀刺山飛泉湧出今漢德神明豈有窮哉乃整衣服向井再拜請祈有頃飛泉湧出矣)\n投轄(漢書陳遵每大會賓客輒閉門取客車轄投於井中)\n土羊(韓詩魯哀公穿井得土羊孔子曰土精也又家語曰李桓子穿井得一物如羊不識以問孔子曰此羵羊也土之怪)\n飛火(異苑曰蜀都臨邛縣有火井漢室之隆則炎赫彌熾暨桓靈之際火勢漸微諸葛亮一闞而更盛故曰高焰飛煽於天)\n出雲(孫堅討董卓至杞園井出五色雲)\n掘新井(管子曰桓公將與管仲飲十日齋戒掘新井而柴焉注新井以柴覆之取其絜敬也)\n銀井掘地(及泉)\n水泉必香聚東井(漢高祖入秦五星聚東井)\n玉井(蔡誕曰仙人有玉井)\n錢飛出(葛仙公投錢於井呪則飛出)\n神農九井(神農造井井有九所汲一井動餘井悉動在鄧州)\n居所而遷(井居無所而遷)\n浚井(舜父使浚井出從揜揜塞以為已死)\n桃李生井旁(古詩)\n東井(秦分)\n陷井之蛙(伏缺甃之崖)\n井㳿(㳿治也去污穢之名)\n脩井(象曰井甃無咎脩井也)\n浪井(典略曰浪井不鑿自成)\n○汲(附井門)\n短綆(不可以汲深)\n汲引爭(高士傳管寧所居屯落會汲者或男女雜錯或爭井衆乃多買器分置井旁汲以待之又使不知來者得之乃不鬬辨)\n金瓶素綆(古詩後園鑿井銀作牀金瓶素綆汲寒漿)\n無喪無得(終日汲引未為損終日泉注未為得)\n笑(平原君美人見躄者盤散行汲笑之後斬以謝)"},{"id":"juan3-012","source":"正文","juan":"卷第三","menu":"宅第十三","sub_menu":null,"page":null,"leaf":null,"text":"〔修造 毀壞 辭宅 擇鄰 貧陋 奢盛 崩倒 假宅附〕\n安宅(其究安宅)\n寧宇爰居(爰處)\n風雨攸除(鳥獸攸去)\n上棟下宇(易上古穴居而野處後世聖人易之以宮室上棟下宇以禦風雨蓋取諸大壯也)\n豐約折中徙居殖殖其庭(殖殖平正貌也)\n以避燥濕(子罕曰吾儕小人皆有闔廬以避燥濕寒暑)\n大厦初成(燕雀相賀)\n閑居(潘岳)\n無征(周禮曰國宅無征注云城中之宅無稅也)\n度地(以居人禮)\n獻宅(禮曰獻田宅者操書致)\n度土而居晏子之宅近市(齊景公欲更之)\n田宅不鬻(禮)\n喪不慮居(為其無廟禮)\n一區(揚雄之先揚季有田一厘有宅一區)\n版屋寢不踰廟白屋(白茅覆屋)\n立田宅制(晉有司奏王公國家京城不宜有田宅未暇作諸國邸當使有往來之處今限京師得有宅一所)\n君子攸寧自請(史王翦伐荊始皇送至灞上翦請美田宅謂人曰自固爾)\n賣宅葬(崔寔父亡賣田宅起冢塋立碑碣資產以酤釀為業)\n長者轍(陳平附郭而居門多長者車轍)\n修造(附宅門)\n卜築經營繕完葺牆築室百堵必葺(叔孫所館雖一日必葺其牆屋去之如始至也)\n于垣(詩曰之子于垣百堵皆作)\n底法(書曰若考作室既底法厥子乃不肯堂矧肯構)\n堂構(見上注)\n垣墉塗暨茨(書若作室家既勤垣墉惟其塗暨茨塗𭰖也茨蓋也)\n卜居葺牆冪室(文選)\n仍舊貫改作修(月令孟秋修宫室坏垣牆)\n成寢(禮季武子成寢)\n晉獻文子成室(晉大夫發焉張老曰美哉輪焉美哉奐焉)\n君子將營宮室(宗廟為先廄庫為次居室為後)\n宮室既修(牆屋既設)\n斯飛之制(改造)\n糞除先人敝廬而為里室皆如其舊考室目巧之室(則有興作)\n土木勝人(國語智襄子室美士茁名曰臣懼土木勝人人不安室)\n相宅有死者(後漢董宣少平為北海相大姓公孫丹為五官掾造新宅而卜工占之云當有死者丹乃命子殺道行人置屍舍內以塞咎宣乃收丹父子殺之)\n鮫人(構館於懸流)\n益宅(田蚡為相嘗請考功地益宅上怒曰遂取武庫是後工少府之屬主作器械時蚡恃權也)\n作之者勞(居之者逸選)\n斯干宣王考室也(干澗喻宣王德如澗水流無已)\n儉而(不陋)\n我圖(爾居)\n修垣(左氏)\n毀壞(附宅門)\n尤其室(宋向𭚠見孟獻子尤其室日子有令聞而美其室非所望也對曰我在晉吾兄為之毀之重勞且不敢問)\n更宅(景公謂晏子曰子之宅近市湫隘囂塵不可以居請更諸爽塏對曰君之先臣容焉臣不足嗣之於臣侈矣及晏子如晉公更其宅反則成矣既拜乃毀曰非宅是卜唯鄰是卜卒復其舊宅)\n壞(魯共王好治宮室壞孔子舊宅以廣其居)\n無有壞墮壞其室(禮)\n剥廬(易)\n徹我牆屋(詩)\n重勞開一徑(後漢張仲蔚蓬蒿滿宅唯開一行徑)\n無毀我室(無發屋居)\n辭宅(附宅門)\n霍去病(為將軍帝欲治第去病辭曰國讎未滅臣無以家為)\n晏子(具毀宅門注)\n北第(惠帝賜夏侯嬰北第三日延我以尊異之)\n推讓(後漢范遷為司徒裁有一宅復推與兄子及薨子建自田種置宅三畝時人美之矣)\n又(沈輔字伯禽少履恭儉喪父服闋推讓田宅與親貧不足者)\n又(吳志周瑜推道南大宅以舍孫策與策為友升堂拜母有無通共)\n擇鄰(附宅門)\n定鄰(物理論曰宅者先定鄰為)\n親仁善鄰(國之寶也)\n協比(其鄰)\n諸侯(守在四鄰)\n孟母三徙(以擇鄰)\n里仁為美(擇不處仁焉得智)\n仁里(思玄賦匪仁里其焉宅)\n恤鄰晏子曰唯鄰是卜卜鄰(二三子先卜鄰矣)\n五家(為鄰五鄰為里)\n度土而居(惟鄰是卜)\n張霸(受嚴氏春秋博覽五經諸生慕之各市宅其旁以就學後漢時) 必有鄰(論語德不孤必有鄰) 睦乃四鄰(蔡仲之命)\n貧陋(附宅門)\n一畝環堵(儒有一畝之宮環堵之室)\n蓽門圭竇蓬戶甕牖三畝之宅(孟子)\n窮僻(蕭何為相買田宅必居窮僻不修垣屋曰後代賢師吾儉不賢無為勢家所奪)\n陋巷(顏回在陋巷人不堪其憂不改其樂)\n蓬蒿(張仲蔚所居蓬蒿沒人)\n清曠(仲長統常願卜居清曠以樂其心)\n儉而不陋 湫隘囂塵(晏子宅見上)\n蝸舍(焦光)\n容身(文子曰古之為道者量腹而食容身而居)\n偪下偞卑(偞迫也墮莢反禮)\n未免燥濕(之患)"},{"id":"juan3-013","source":"正文","juan":"卷第三","menu":"宅第十三","sub_menu":"（續）","page":null,"leaf":null,"text":"繩樞宮室卑庳上漏下濕蓆門(陳平)\n其居容易 糞土之牆陋如之何(君子居之何陋之有)\n奢盛 (附宅門)\n居處不淫高其閈閎厚其牆垣豐屋峻宇(雕牆)\n美其室(向戍見孟獻子尤其室曰子有令問而美其非所望也)\n輪奐(見上注)\n山節藻梲(臧文仲山節藻梲君子以為濫矣)\n丹楹刻桷(魯莊公丹桓宮楹刻桓宮桷非禮也)\n取諸大壯良田廣宅甲第宜驕所閱多矣(平恩侯許伯入第蓋寬饒仰視屋而歎曰富貴無常忽則易人如此傳舍所閱多矣)\n利田宅(魏氏武卒中試則復其戶利田宅也)\n寢不踰廟(禮)\n請地益宅 (田蚡事見上注)\n容長戟幡旗(晉王濬字士治恢廓有大志常起宅開門前路廣數十步或問之濬曰吾欲容長戟幡旗衆咸笑之)\n土木勝人 (見蓬門注)\n侵併(晉廷尉張闓住小市欲奪左右宅以廣其居乃私作都門早閉晏開人訟於賀循循白闓闓遂毀之)\n屋不呈材(文選)\n宮室無量(傳)\n汰侈膏腴(漢武安侯蚡營甲第地極膏腴堂羅鐘鼓)\n石董(呈巧致功期不陀弛非石非董疇能居此)\n衣以綈錦(哀帝與董賢宅拄檻皆如此文選注)\n豐其宅(易言無得大其屋)\n許伯延賓(尚懼蓋老之誡)\n晉文考室(猶欽張老之言)\n崩倒(附宅門)\n棟折榱崩(僑將壓焉)\n梁木其壞(禮)\n舊宅支壞(天之所壞不可支也傳)\n傾侈騫崩持危扶顛(危而不持顛而不扶)\n軫騫崩之慮(貽燥濕之憂)\n改作壞墮剝廬(易小人剝廬)\n改造一日必葺其牆屋(叔孫昭子)\n假宅(附宅門)\n田生如長安(假大宅令其子求事呂后謁者張釋卿見史記)\n假館(孟獻子曰曹郊得見於鄒君可以假館願留而受業孟子曰辭有歸師矣)\n王子猷(世說王子猷每假人宅必種竹人詰之曰何不可一日無此君)\n推與(周瑜事見辭宅門注)"},{"id":"juan3-014","source":"正文","juan":"卷第三","menu":"廨署十四","sub_menu":null,"page":null,"leaf":null,"text":"〔凶附〕\n伐樹織葦(晉羅含字君章為相州別駕以才學知名以廨舍讁擾自於城西小湖安茅屋伐樹為牀織葦為席而居也)\n妻子不入(漢何並)\n壞屏障(晉阮籍為東平相到郡壞府舍屏障使內外相望)\n治舍(犍為太守李嚴欲徙郡治舍功曹楊洪諫不聽遂請退字季休)\n修葺(吳陸抗與諸葛恪換宅抗臨去繕完城圃葺其牆屋廬舍恪不然深以為恥)\n去之如始至(傳曰叔孫所舍雖一日必葺其牆屋也)\n擅修飾(晉杜元凱為東羌校尉石監奏預擅飾城門官舍稽乏軍興車徵詣廷尉以尚主在八議以侯贖論者也)\n閱人多矣(蓋寬饒至許伯第曰如此傳舍閱人多矣)\n凶(附廨署門)\n毀(晉羊祜叔子督荆州長史喪多害人皆毁舊府祜以死生有命富貴在天勑征鎮禁斷之)\n多怪(晉樂廣爲河南尹官舍多怪前尹不敢居之廣居後於壁中穿得狸殺之怪遂絕)"},{"id":"juan3-015","source":"正文","juan":"卷第三","menu":"廁十五","sub_menu":null,"page":null,"leaf":null,"text":"周禮(邦有大祭賓客則役煩辱之事煩劇也)\n溫廁(儀禮隸人溫廁溫塞也為人復往褻也)\n陷(左傳晉侯將食麥脹如廁陷而卒)\n如廁(高祖洪門會因如廁召樊噲等四人閒道走軍)\n石崇廁(常令婢數十人曳羅縠直之漆箱中盛乾棗奉以塞鼻)\n賈姬(郅都侍上賈姬如廁有野彘入廁中上目都擊之都不往上欲自往都伏諫曰一姬死復一姬生上雖欲自輕命奈太后宗廟何太后聞之賜都金焉)\n趙廁(襄子)\n廁中鼠(李斯云畏人食不絜)\n陶侃(晉書侃嘗如廁見一人朱衣介幘劒復曰以君長者故來相報君後當為公侯侃八州都督矣)\n窮子除糞(法華經云喻樂小法)\n迫(左氏曰迫孔悝於廁彊盟之)\n被髮銜刀(郭璞在廁見梪彞掩之見璞方被髮銜刀舍毀曰常囑卿莫來今反如此非但禍吾卿亦不免)\n食棗(大將軍王敦至石家廁取箱相棗食之羣婢大笑)\n折脇(范睢爲魏齊所譛王令人抛廁中折其脇後逃歸秦爲張禄先生)\n曹植杜蘭香戒云(張碩曰不宜露頭入廁夜行比以燭)\n見(庾翼鎮荆州如廁見一物頭如方相兩眼大有光翼擊之入地因病而薨)\n香煙上過(襄陽記劉季和上廁從香煙上過)\n誤入(劉寔謂石崇曰誤入君內)\n趙襄子(如廁心動見預讓)\n漢高(如廁心勤過柏人)\n金日磾(如廁心動擒莽何羅)"},{"id":"juan3-016","source":"正文","juan":"卷第三","menu":"樓第十六","sub_menu":null,"page":null,"leaf":null,"text":"茲樓(王粲登樓賦曰登茲樓以閑望聊暇日以銷憂)\n麗譙(魏武有麗譙樓)\n美哉輪焉(輪高大也)\n臨大道(青樓臨大道曹子建詩)\n齊浮雲(古詩曰西北有高樓上與浮雲齊)\n秦氏(古詩日出東南隅照我秦樓)\n蜃雲(結雲)\n百尺(洛陽記曰有百尺樓)\n仙人(好樓居)\n層構(雲構)\n崇制彭氏(黃昌爲郡守陜縣彭氏造樓臨道昌行縣彭氏婦人輒升樓而觀昌乃殺之)\n超(漢甘延壽以試弁爲吏超踰羽林亭樓)\n陟降(投墜)\n墜(孫秀求緑珠不得及石崇將刑緑珠乃墜樓死)\n望氣(張華善天文解望氣與雷煥夜登樓望見紫氣起斗牛閒華曰何氣也雷孔章曰其寶劒氣乎)\n又(蜀志周羣作小樓多令奴更直於上視天纔有一氣即白羣)\n壯麗規模雖欲干雲(制作亦宜揆日)\n十二重之制(鮑昭詩鳳樓十二重)\n井幹(音寒漢武帝造井幹樓高五十丈在建章宮中井幹垣也)\n吹簫(秦穆公女弄玉登樓吹簫感鳳來)\n登南樓(庾亮字元規在武昌諸佐吏殷浩之徒乘秋夜佳序共登南樓不覺亮至諸人將起避亮曰諸君少住老子於此處復不淺便據胡牀與浩等譂詠)\n干雲(霧而上達井幹疊而百層文選)\n虞氏高樓(列子虞氏者梁之富人登高樓臨大路擊搏樓上而笑有俠客在下飛鳶適墜腐鼠中俠客客曰虞氏富樂日久吾不侵犯乃以此辱我此而不報非也遂率其屬以滅其家)"},{"id":"juan3-017","source":"正文","juan":"卷第三","menu":"閣第十七","sub_menu":null,"page":null,"leaf":null,"text":"圖畫(漢於麒麟閣上圖畫功臣)\n飛閣(文選飛閣逶迤)\n鳳巢(帝王紀黃帝時白鳳巢於阿閣)\n天祿(楊雄校書於天禄閣)\n投閣(王莽以符命自立時揚雄校書於天祿閣上治獄使者欲收雄雄從閣上自投幾死京師語曰惟寂惟寞自投于閣)\n阿閣(古詩云交䟽結綺窗䆫阿閣三重階)\n綠苔生閣(文選)\n劒閣(蜀道)\n菌閣(謝玄暉詩尋雲歸累榭隨山望菌閣)\n層閣(層閣肅天居詩)\n芸閣華閣(七啓華閣緣雲飛陛凌雲)\n連閣(連閣水宮)\n延閣(結陽成之延閣飛觀榭平雲中)\n三閣(陳後主)"},{"id":"juan3-018","source":"正文","juan":"卷第三","menu":"臺第十八","sub_menu":null,"page":null,"leaf":null,"text":"三休(楚王夸客以章華之臺登之三休乃至其上)\n五仞(說苑楚莊王築五仞之臺)\n九層(老子云九層之臺起於累土)\n一匱(為山九仞功虧一匱)\n章華(傳曰楚子成章華之臺願與諸侯樂之)\n姑蘇(吳都賦作姑蘇之高臺臨四遠而特建)\n露臺(漢文帝欲起露臺計費百金曰百金中人十家之產何以為臺)\n春臺(衆人熙熙如登春臺)\n經始(詩曰經始勿亟庶人子來謂文王之作靈臺)\n靈臺置金(燕昭王置千金於臺上以延天下士謂之黃金臺)\n崇制峻趾集鳳(簫史與弄玉吹簫於臺上有鳳集)\n戲馬臺(項羽有戲馬臺)\n騫崩(版築)\n作于河上(詩新臺刺衞宣公納汲之妻作新臺於河上而要之國人惡之)\n榭(月令仲夏可以居高明可以處臺榭)\n時制(春臺)\n高明(見上注)\n妨農(傳宋皇國父為平公築臺妨於農收子罕請俟農功畢築者謳曰澤門之皙實興我役邑中之黔實慰我心子罕聞之執扑扶其不勉者曰吾儕小人皆有闔廬以避燥濕寒暑今君為一臺而不速成何以為役君子謂子罕能分謗澤門宋國門也國父所居皙白黔黑並狀貌也)\n中天(魏襄王欲築中天之臺許綰諫乃止中天半天也)\n崇九層之制(雖欲凌雲)\n起一匱之功(亦宜揆日)\n崔嵬(垤堄)\n崇崇之制(登登之功)\n高以望仙(漢武立望仙臺)\n遠而思子(漢武帝作思子臺以念戾太子)\n八風通靈臺(漢武為鉤弋夫人死後作通靈臺)\n集烏(御史府亦曰烏集烏臺)\n瑤臺(仙人所居)\n鹿臺(武王散鹿臺之財)\n歸來望思之臺(見上思子注)\n彈人(晉靈公不君從臺上彈人觀其避丸者)\n漸臺(漸臺立於中央)\n狀西白虎(曲陽侯王根作漸臺狀西白虎)\n潘扼腕(潘岳西征賦曰望漸臺而扼腕王莽死於漸臺)\n陽臺蘭臺(良史下筆不能自休)\n思(古詩去思婦臨高臺)\n銅雀臺(魏武帝臺名)\n九層(說苑晉靈公造九層臺三年不成人力困敝出令敢諫者斬荀息進曰臣能累十二棊子加九卵於上公曰危哉息曰不危公造臺三年不成男不耕女不織亦甚危矣公遂止)\n觀臺(傳登觀臺以望而書禮也注觀可以遠觀也)\n通天(漢武臺名)"},{"id":"juan3-019","source":"正文","juan":"卷第三","menu":"堂第十九","sub_menu":null,"page":null,"leaf":null,"text":"堂除(考功記堂除三分謂階前)\n不趨(堂上不趨)\n接武 (堂上接武)\n布武(堂下布武)\n不下堂(天子不下堂而見諸侯)\n滿(金玉滿堂莫之能守)\n玉堂(漢武玉堂在太液池南)\n垂堂(千金之子坐不垂堂)\n皇堂(後漢胡建為軍正斬監察御史於皇堂上堂無壁曰皇)\n萬金(後漢靈帝造萬金堂於西園)\n將上(堂聲必揚警內人禮)\n倨堂而應(老子見孔子)\n寢處我兮滿堂(文選衆滿堂而飲酒獨坐而掩淚)\n升堂(希升堂者又曰升我堂矣)"},{"id":"juan3-020","source":"正文","juan":"卷第三","menu":"屋室第二十","sub_menu":null,"page":null,"leaf":null,"text":"〔梁注牎瓦附〕\n上棟下宇版屋(詩曰其在版屋亂我心曲注西戎版屋心曲心之委曲也)\n定之方中(作為楚宮)\n揆之以日(作為楚室)\n考室(斯干宣王考室)\n築室百堵築室于茲美其室(孟獻子見宅門注)\n必葺(叔孫婼所館雖一日必葺其牆屋)\n葺屋瓦屋(考工記葺屋三分瓦屋四分注各分其循以其一為峻)\n土木勝人(見上)\n瞻彼闋者虛室生白(莊子言夫室有若天虛室也室虛而純白獨生)\n目巧之室(則有奧阼)\n君其反室(武詔丞相石慶言使還家也)\n仰視室屋(蓋寬饒事見上注也)\n成屋(趙太子成屋張老曰矣哉輪焉具上注)\n泉客(江賦泉客築室於巖底)\n宇下(况衛之在宇下)\n○梁(附屋室門)\n欂櫨(說文梁欂櫨也)\n撫梁易柱(論衡曰紂能撫梁易柱)\n遺絹(後漢書曰陳寔字仲弓為太丘長史嘗夜陰有人伏梁上寔曰梁上者君子也遺絹兩匹)\n梅梁(吳越春秋曰夏禹廟以梅木為梁)\n畫羊懸穀(廣州記曰州㕔梁上畫五羊又作五穀囊隨羊懸之云昔高固為楚相五羊銜穀萃於楚庭故圖其象為瑞六國時廣州屬楚)\n繞梁(論衡曰韓娥古之善歌者每一歌餘聲三日繞梁上塵)\n懸頭(蘇秦傳曰秦少學苦於睡以頭髮係梁上手引錐刺股以醒睡)\n○柱(附屋室門)\n吳越春秋(曰越王念吳欲復之中夜抱柱而哭羣臣曰君何愁之甚復讎臣下之急也)\n銅柱(後漢馬援征南蠻樹銅柱紀功而歸)\n梓柱生枝葉(漢成帝時梓柱生枝葉扶踈上出屋王氏執權之徵)\n倚柱書(夏侯玄倚柱書雷霹靂不驚)\n崐崘(山有銅柱)\n公孫樓柱(盛弘之荊州記曰巴東有一折柱孤直高三丈大可十圍傳云是公孫述樓柱破之血出枯而不朽)\n石柱(嵩山記曰上有石室前有石柱柱上有石脂滴下人服一合得仙)\n碎壁(藺相如曰頭璧俱碎於柱矣)\n天柱折(列子曰共工氏與顓頊爭帝位頭觸不周山崩天柱折)\n地有四柱(何圖括地象曰地下有四柱三百六十軸)\n陸玩柱石(晉書陸玩字士瑤初遷侍中轉司空有人詣之飲酒瀉柱下呪曰當今乏材以汝為柱石莫傾人棟梁玩笑曰得卿良箴敬而佩之嘗歎曰以我為三公無人譚者以為知言)\n然銅柱(列女傳紂作銅柱以炭火然之令有罪者抱其柱輒墮妲己觀而笑)\n金塗(漢武故事曰上起神屋以銅為柱黃金塗之大五圍)\n晏子鑿楹(晏子將死鑿楹納書謂妻子曰子壯而視之及子壯發書書曰布帛不可窮窮不可服事不可窮窮不可壯出晏子春秋)\n一柱(博物志江陵有一臺唯一柱衆梁並皆共之)\n水精柱(魏略曰大秦國以水精為屋柱)\n楹謂柱也(廣雅曰)\n釋名曰柱住也楹亭也(言亭亭然孤立)\n○䆫(附屋室門)\n䆫牖也(廣雅曰)\n朱鳥牖(漢武故事曰西王母降東方朔於朱鳥牖中闚母入謂帝曰此兒無賴久被斥逐原心無惡尋應得還)\n雲母䆫珊瑚䆫(又曰帝起神屋有雲母䆫有珊瑚䆫)\n四面夾䆫(周官曰夏后作堂四面夾䆫)\n馬后不臨(張璠漢記曰明帝馬皇后不喜出游未嘗臨御䆫牖)\n八䆫(孝經注曰明堂之制八䆫四闥上圓下方)\n雲集記曰(范雲字彥龍少與梁武帝甚篤相隨宿一家雲望見䆫外二人闚一人曰可進一人曰有王有相不可也乃俱拜從䆫進主人便厭死雲白武帝曰王當仰推相願賜及及帝登位拜雲僕射)\n鹿精(晉書謝鯤嘗宿一空亭聞人於外呼鯤字鯤從牖視之乃一著黃人遂引其膊斷之乃鹿精也尋血得之)\n雞語(兖州刺史宋處宗買得一長鳴籠著䆫閒雞作人語與宗終日譚論)\n瑠璃䆫(世說滿奪畏風武帝坐瑠璃䆫內甚密奮尋疑其踈恐之帝問其故荅曰臣如吳牛見月而喘)\n祈嘉(晉書祈嘉字孔賓清貧好學夜忽䆫中有人呼云祈嘉隱去來修飾人閒甚苦不可諧所得未毛銖所喪如山崖嘉旦乃悟矣)\n綺䟽碧䟽䆫中列(遠岫)\n不闚牖而見天道(老子)\n青瑣\n瓦(附屋完門)\n銅瓦(漢武故事云起神屋以銅為瓦漆其外)\n撤瓦(漢書霍光巷行人見有人居光屋上撤瓦投地就視不見霍誅之應)\n水精瓦(吳外國傳曰大秦國王宮殿水精為瓦)\n飛(神仙傳班孟圖吹人屋瓦飛入人家)\n吹(漢平帝元始四年冬風吹長安城東門屋瓦並盡)\n投孟陽(晉張載字陽貌醜遊洛陽市羣女以瓦石投之)\n縹碧(劉駼騊詩曰縹碧以為瓦)"},{"id":"juan3-021","source":"正文","juan":"卷第三","menu":"屋室第二十","sub_menu":"（續）","page":null,"leaf":null,"text":"鴛鴦之瓦桀作瓦(博物志)\n瓦中(秦時東郡守為瓦所中遂坐死此亦畏忌所驗)\n毀方瓦合(禮)\n瓦不成沫(禮)\n乃生女子載弄之瓦瓴甓"},{"id":"juan3-022","source":"正文","juan":"卷第三","menu":"門戶第二十一","sub_menu":null,"page":null,"leaf":null,"text":"〔天子門諸侯門〕\n重門(易曰重門擊柝以待暴客)\n外戶(禮曰大道之行外戶不閉)\n由戶(語曰誰能出不由戶)\n高門有閈(閈高貌)\n埽門(魏勃埽齊相曹參門)\n關揵(善閉無關揵而不可開老子)\n重閉(傳曰勇夫重閉)\n高其閈閎(閎門)\n踰越(傳曰門不容車而不可踰越)\n高卑合禮(啓閉隨時)\n閫閾(扃鐍)\n立不中門(行不履閾)\n踰閾(婦人送迎不出門見兄弟不踰閾)\n長者之轍(陳平門多長者之轍)\n以通往來(作限內外)\n不可踰也(何莫由斯)\n以時啓閉祀戶祭先脾(月令孟春陽氣出祀之於戶)\n其祀門祭先肝(孟秋陰氣出祀之於門外順陰也凡祀門爲祖先祭肝)\n戒門閭修鍵閉(孟冬)\n禮有以高為貴者(位尊高則門高)\n拂闑(禮君入門介拂闑大夫中棖與闑之閒介拂棖凡入門近中為尊)\n不出戶庭蓽門圭竇衡門(之下可以棲遲)\n西南其戶蓬戶甕牖繩樞(陳涉)\n席門(陳平懸席為門)\n通德門(後漢名鄭玄里門名通德門)\n銘(摯虞門銘云祿無常家福無定門人謀鬼謀道在則尊)\n題門(翟公)\n受命於戶耶(孟嘗君)\n大吾門(呂不韋)\n雀羅(翟公罷廷尉賓客皆去門可張羅)\n高其門(于公)\n銅戶 (烈士傳曰吳王闔閭畏王僚之子慶忌作石室銅戶以備之)\n閉戶先生(孫敬常閉戶號閉户先生)\n不完(莊子曰原憲家貧蓬戶不完)\n諱(晉書羊祜為荊州卒後人為諱戶以戶為門)\n何不高其戶(春秋後語薛郭靜君曰嬰嬖妾五月五日生子文俗云此月生子及戶損其父妾匿養之文長曰受命於天受命於戶必受於戶何不高其戶)\n臥戶(風俗通曰臥戶砌者畏縮其頭令人病癲)\n昌戶(帝王錄曰有赤雀銜丹書止於昌戶)\n闚其戶(闐其無人)\n三戶盡閉(王充論衡曰燕王在明光宮欲入所臥處三戶盡閉使二十人開不得)\n不出戶(而知天下)\n〇天子門(附門戶門)\n禮天子五門(謂臯門庫門雉門應門路門)\n九重(楚辭曰君之門兮九重)\n金馬(漢武帝立金馬於魯班門外因改曰金馬門)\n千門(蕭相定修未央宮千門萬戶曰天子居非壯麗無以威重)\n秦師過周北門左右免冑而下(超乘者三百餘人王孫滿尚幼觀之言於王曰秦師輕而無禮必敗過天子門不卷甲束兵超乘示勇後果為晉所敗)\n黃金門(楚辭云黃金為君門)\n〇諸侯門(附門戶門)\n樹塞(語曰邦君樹塞門注謂屏於門外)\n朱戶(漢冊魏公九錫文曰以君翼宣風化華夏充實是用錫君朱户赤户以居)\n臺門(天子之禮臺門旅樹大夫僭禮也言此諸侯之禮大夫僭之)\n請高其門(于公門壞父老共治之于公曰少高其門令容駟馬我理獄多陰德子孫當有興者至于定國爲丞相)\n請容車馬(晉陳頵字延思父訴立宅門頵請容車馬後為主簿從事乘車馬歸家)\n踦閭而語(公羊傳曰晉二大夫相與踦閭而語注閭當道門也閉一扇一人在內一人在外曰踦)\n禹三過門不入用牲(左氏大水用牲于門非禮)\n戶開亦開(戶闔亦闔)\n大君子之門(董仲舒曰當作為力而已不足稱大君子之門注云仲尼之門故稱大)\n修造(附門戶門)\n啓塞從時(門戶橋道謂之啓城郭牆壍為之塞皆開閉之急不可一日而闕)\n修其闔扇(月令仲春)\n修鍵閉(孟冬有司戒門閭修鍵閉必重閉也)\n容駟(見上注)\n門材(與之門材)\n鑿戶(牖以為室)\n䡾䡾(飛檐䡾音五羯反)\n丁丁雖一日(必葺其牆屋)\n廣門衡以旌儒(鄭玄字康成北海相孔融敬玄曰于公僅有一節猶戒高其門閭矧鄭公之德而無四牡之路可廣開門衡令容車馬號通德門)"},{"id":"juan3-023","source":"正文","juan":"卷第三","menu":"倉廩第二十二","sub_menu":null,"page":null,"leaf":null,"text":"〔擅開倉常平附〕\n倉虛(老子田甚蕪倉甚虛)\n廩實(管子倉廩實知禮節)\n千倉(乃求千斯倉乃求萬斯箱)\n倉箱(見上注)\n太倉紅腐(太倉之粟紅腐而不可食)\n海陵流衍(觀海陵之倉則紅粟流衍)\n鄧攸免官又(第五訪仲謀為張掖守歲饑開倉賑給曰若須報是弃人也樂以身救百姓詔嘉之)\n修囷(月令孟冬命有司穿竇窖修囷倉謹蓋藏務積)\n出納之吝(謂之有司)\n藏於天下(韓詩外傳曰王者藏於天下諸侯藏於百姓農夫藏於囷庾商賈藏於篋笥)\n賑廩(傳曰楚莊王賑廩同食注賑廩開倉同食上下無異饌也)\n我倉(詩曰我倉旣盈我庾惟億)\n儲蓄收藏委積收斂庾(庾露積也詩曰曾孫之庾如坻如京)\n巨橋(武王克殷發巨橋之粟大賚于萬姓巨橋紂倉)\n不盈(管子曰不務地利則倉不盈)\n發倉廩(月令季春發倉廩賑貧窮)\n粟入(周禮廩人掌粟之入藏辨九穀之物以待邦用)\n量入(禮曰五穀皆入必量於歲之杪)\n九年之蓄陳陳相因匪頒(周禮廩人掌九穀之數以待國之匪頒稍倉賜食以歲之上下數邦用以知足注稍倉食廩之祿也)\n露積(太倉粟陳陳相因充溢露積)\n敖倉(下有積粟)\n滯積(公無滯積)\n神倉(藏帝籍於神倉祗敬必節)\n囷鹿(國語)\n廥積貴庾(穀藏以防貴庾謂積穀待價)\n蘇章(後漢為武原令歲饑開倉廩活三千餘人)\n喬玄(公祖為梁州刺史歲饑開倉給之主者以為舊典宜先表聞玄曰方待奏民且死矣開倉訖乃上聞天子嘉之)\n吳中有均輸之號(吳倉春申君所造名均輸)\n洛陽有常滿之名(見洛陽記)\n御廩災(桓十四年八月壬申乙亥嘗以未易災之餘而嘗曰近也穀云)\n白帝倉(漢記公孫述有白帝倉)\n細柳倉(三輔故事曰漢文大將軍周亞夫軍於細柳今呼古徼是也徼西有細柳倉城東有嘉倉)\n○擅開倉(附倉廩門)\n汲黯(因使矯制發倉救河內上釋罪)\n韓韶(後漢韓韶字仲黃為嬴長賊不入界餘縣多被寇廢耕入縣界求索衣粮甚衆韶愍其饑困開倉賑之萬餘戶主者爭為不可韶曰此活溝壑之民而伏罪含笑入地太守素知名德竟無所坐)\n鄭默(晉鄭默為東郡守歲凶開倉賜給待罪詔書襃歎比之汲黯班告天下)\n王蘊(字仁叔為吳興守郡人饑開倉賑恤主簿諫請先上請待報蘊曰行仁義敗無所恨朝廷以違科免之士庶詣闕左降晉陵太守)\n○常平(附倉廩門)\n壽昌之計(食貨志漢宣帝時年豐人少利時大司農中丞耿壽昌上計令郡國皆築倉以穀賤時增其價而籴以利農穀貴時減價而粜以利人名曰常平倉百姓利之)\n平糴(管氏之輕重李悝之平籴弘羊之均輸壽昌之常平皆人賴其利)\n狗彘之食(孟子曰狗彘食而不知斂野有餓殍而不知發)\n不涸之倉(管子曰積於不涸之倉者務五穀也)\n不盡(文子曰積於不盡之倉)\n存救之(要術)\n儲蓄(以虞災)\n以待凶荒(周禮)\n豐凶不常(斂散有典)\n既有無之相均(亦豐儉而交利)\n智合於權(利和其義)\n均節豐儉適宜(公私交利)\n苟棲畝之餘粮(豐年不儉)\n則在野之餓殍(凶歲疇依)\n羨耗出納監臨當其豐歲(雖多京坻之謠)\n守在職司(宜謹豆區之量)\n均輸倉(吳倉春申君所造名均輸)\n常滿倉(洛陽有常滿倉)\n出如珠玉(取如糞土史)\n秋斂春頒"},{"id":"juan3-024","source":"正文","juan":"卷第三","menu":"庫藏二十三","sub_menu":null,"page":null,"leaf":null,"text":"〔主守附〕\n庫(月令季春命有司開府庫出幣帛聘名士)\n帑藏(說文庫兵器所藏帑金布所藏)\n五庫(禮曰季春審五庫之量天子之庫有五)\n藏於天下(王者藏於天下諸侯藏於百姓農夫藏於囷庾商賈藏於篋笥)\n武庫(漢立武庫以藏禁兵)\n王府(御府大內)\n竊藏(晉文之豎頭須守藏者及其出竊藏以逃)\n焚臺(韓詩外傳曰晉文公藏寶之臺燒三日公子晏賀曰臣聞王者藏於天下諸侯藏於百姓今賦斂無已皇天降災於藏是君之福故賀之)\n東山(闚東山之府則瓌寶溢目)\n充府庫(周禮凡萬人之貢以充府庫)\n貨賄之藏長府(魯人為長府府藏名)\n白藏(魏之藏名)\n充仞(積滯)\n鹿臺(武王克殷散鹿臺之財紂所積之府庫曰鹿臺)\n不竭之府(管子曰藏於不竭之府謂養桑麻育六畜)\n受藏(周禮頒其貨於受藏之府)\n在庫(言庫)\n內府(周禮內府掌受九貢九賦九功之貨賄良兵器以待邦之大用注謂朝覲頒賜)\n外府(掌邦之出入以供百物而待邦之小用注布帛也藏曰泉行曰布小用謂賜也)\n管庫(禮記晉趙文子舉管庫之士七十有餘家)\n府實(子產曰其輸之則君府實)\n餘財(武帝初府庫餘財京師錢累百巨萬餘貫朽而不可校)\n六府(周禮天子六府曰司土司木司水司草司器司貨典司六職注府謂主藏物之稅)\n禁庫無聚水衡錢(天子私藏)\n乘輿供養所出(母將隆君房言大司農錢自供乘輿不供給供養養勞賜一出少府蓋不以本藏給末用)\n本藏給末用(見上注)\n五庫(車庫兵庫祭器庫樂庫宴器庫)\n大庭之庫(魯)\n武庫(蕭何立)\n自壞(後漢靈帝光和武庫屋自壞司隸永上書曰武庫禁兵所在國之禁為災深者)\n魚(魏嘉平中魚土築武庫上)\n主守(附庫藏門)\n出納之吝(謂之有司)\n出匣(虎兕出於匣龜玉毀於櫝中是誰之過與)\n守藏委質監臨所守(攸司)\n晉侯之堅頭須守藏者也(竊藏以逃)"},{"id":"juan3-025","source":"正文","juan":"卷第三","menu":"管籥第二十四","sub_menu":null,"page":null,"leaf":null,"text":"管庫之士(趙文子為政舉管庫之士七十有餘家)\n北門之管(杞子云鄭人使我掌其北門之管)\n琅當(鐵鎖琅當長鎖)\n橐籥(老子曰天地之閒其猶橐籥乎)\n謹守管籥(漢書)\n啟籥(書啓籥見書乃并是吉)\n司門(周禮司門掌援鍵以啓閉國門)\n戒門閭(修鍵閉)\n善閉(老子曰善閉無關鍵而不可開)\n扃鐍(莊則必攝緘縢固扃鐍)"},{"id":"juan3-026","source":"正文","juan":"卷第三","menu":"園圃第二十五","sub_menu":null,"page":null,"leaf":null,"text":"〔灌園附〕\n老圃(樊遲請學為圃子曰吾不如老圃)\n折柳(詩曰折柳樊圃注云樊藩也)\n不闚(董仲舒勤學十五年不闚園圃)\n毓草木(周禮九職二曰園圃毓草木)\n樹之果瓜(場人掌圃而樹之果瓜珍異之物以時斂而藏之)\n拔園葵(公儀休相魯拔園葵不與人爭利)\n不闚(後漢法真隱大澤講論藝術歷年不闚園圃)\n踐葵(魯漆室之女曰昔有客繫馬園中馬逸踐葵使予終歲不飽葵)\n百畦(莊子云子貢過漢陰見一丈夫鑿隧抱甕而灌園子貢曰有機於此曰浸百畦挈水若抽多日桔槔丈夫曰吾知之恥不為)\n外圃(左傳孔氏之外圃)\n九畹(楚辭曰子既滋蘭之九畹又樹之百畝)\n西園(曹子建詩清夜游西園飛蓋相追隨)\n北園(游于北園)\n樹果樹菜(說文園樹果圃樹菜)\n樹藝(周禮)\n廿而一(周禮園廛廿而一注云以利少故廿而税也廛城市中空地)\n不樹者(無槨罰之)\n樹事(周禮任圃以樹事貢草木謂果瓜葵韮)\n灌(於陵子辭卿相而桔槔灌園又戴宏為河閒相自免歸而灌蔬以經教授)\n抱甕(見上注)\n山陽餘利(向秀傳曰秀與呂安灌園山陽收其餘利以供酒食之費)\n自賃(范丹學通三經常自賃灌園)\n鬻蔬(潘岳賦序灌園鬻蔬) 使吏鉏治(魏顏斐文林為京兆\n26.\n守於府下起菜園使吏投簡鉏治之)\n假貧(史王翦為秦伐楚請美田宅園圃使其衆)\n悉與貧人(後孝和)\n鉏園(得黃金印後漢戴異)\n園公(陳留志園庚居園中世謂之園公)\n孔子嘗為魯乘田吏(苑囿之吏孟子)\n九月築場圃(注春夏為圃秋冬為場)\n園(有桃有棘)"},{"id":"juan3-027","source":"正文","juan":"卷第三","menu":"藩籬第二十六","sub_menu":null,"page":null,"leaf":null,"text":"羝羊觸藩(易)\n折柳樊圃(樊藩詩)\n游藩(莊子曰願游其藩)\n藩籬之鷃授條(晉書庾袞與弟子樹籬跪而授條曰幽顯易操非君子意)\n鷦鷯長(於藩籬之下鷦鷯賦云)\n芳枳樹籬(閒居賦)\n為軍(傳晉楚弭兵以藩為軍注示不相疑)"},{"id":"juan3-028","source":"正文","juan":"卷第三","menu":"牆壁第二十七","sub_menu":null,"page":null,"leaf":null,"text":"〔奢修 築牆 葺壞 穿窬附〕\n厚其牆垣(傳)\n數仞及肩(子貢曰譬諸宮牆賜之牆也及肩闚見室家之好夫子之牆數仞不得其門而入不見宗廟之美)\n耳屬(于垣)\n藏書(魯恭王壞孔子舊宅於壁中得古文之書皆科斗文字)\n環堵(之室)\n循牆(而走正考父)\n有茨(牆有茨不可埽茨蒺藜也)\n蔽惡(叔孫曰人之有牆蔽惡也牆之旣壞誰之咎注咎在牆)\n以禦風雨(以避燥濕)\n大為之防(猶有踰者)\n高墉(射隼高墉)\n無踰我牆既勤垣墉惟其塗蔇茨牆面(不學牆面)\n勿仞(漢書牆藩勿仞)\n三尺(周禮牆厚三尺崇之注云高卑為率足以相稱)\n短垣(國語曰君有牆而自踰)\n負牆(子貢負牆而起)\n卻壞(見蔽惡注)\n百堵皆作制(淮南子舜作室築牆茨屋令人皆知去巖穴各有家室此其始也)\n相如成都唯四壁負牆而立\n奢修(附牆壁門)\n雕牆(尚書峻宇雕牆傳曰晉靈公不君後斂以雕牆)\n牆不露形土被朱紫(並文選)\n椒塗(取其溫香)\n粉壁紫素(漢官儀郎省中皆胡粉塗壁紫素界也)\n黼繡(漢書黼繡古天子服也今商人大賈及嘉會召客者皆用以被牆)\n金銀(後漢琅邪王好治宮室殿壁皆飾以金銀)\n牆藩(甘泉賦電倏忽於牆藩)\n厚其牆垣以琉璃為牆(南州異物志大秦國)\n〇築牆(附牆壁門)\n登登(築之登登用力也)\n百堵(之子于垣百堵皆作)\n版築高卑(薄厚)\n廣袤數仞之制(一簣之功)\n啓塞從時(城郭垣壍謂之塞皆隨其壞則治不限土功之時)\n平版幹(稱畚築程土物略基址)\n土物旣程(高卑是揣)\n計徒庸順時(屬役)\n其繩則直縮版以載(以索縮其版上下相承)\n垝垣(垝垣毀墻)\n〇葺壞(附牆壁門)\n葺牆(傳曰繕完葺牆)\n一日必葺(叔孫所居館雖一日必葺其牆屋)\n百堵皆興(見上注)\n騫崩(陁陊)\n卻壞(見上注)\n糞(土之牆不可杇也塗也)\n杇人(傳杇人以時填館宮室圬人塗者填亦塗也)\n塗蔇(蔇𭰖也見上)\n毁垣穨墉坏牆垣(月令孟秋)\n〇穿窬(附牆壁門)\n穿窬之盜猶可踰也(無得而踰焉)\n鑿壁引光(匡衡勤學無燭乃穿壁引鄰家燭光以照書讀之)\n穿墉(誰謂鼠無牙何以穿我墉)\n踰垣而走鄰女(宋玉東鄰女登牆而闚三年矣)\n連牆(列子師壺丘子林友伯昏務人交居東郭與南郭子連牆二十年不相謁請相遇於道)\n及肩屬耳被誅(齊莊公私崔杼於室牆下被誅)\n無踰我牆(詩)\n短垣(君有短垣而自踰之)\n循牆而走(正考父恭)\n踰(書曰踰垣牆竊牛馬則有常刑)\n乘彼垝垣(危毀)\n登龍斷(龍斷短垣孟子)"},{"id":"juan3-029","source":"正文","juan":"卷第三","menu":"竇第二十八","sub_menu":null,"page":null,"leaf":null,"text":"宮中之竇其崇三尺(周禮考工記)\n圭竇(傳蓽門圭竇之人皆陵其上)\n逃出自竇(有過氏滅夏后相后緡方娠逃出自竇)\n大竇(先王之大竇)"},{"id":"juan3-030","source":"正文","juan":"卷第三","menu":"竈第二十九","sub_menu":null,"page":null,"leaf":null,"text":"〔祭附〕\n夷竈(傳塞井夷竈)\n踞竈觚(莊子仲𡰱讀春秋老聃踞竈觚聽之竈觚額也)\n媚竈(王孫賈曰與其媚於奧寧媚於竈)\n騷除(史記李斯曰竈上騷除萬世一時也騷音埽)\n減(孫臏減竈)\n增(虞詡增竈)\n曲突(漢書曲突徙薪無恩澤也)\n向栩(後漢向栩性不恒又似狂坐於竈北版屋上)\n避竈(莊子云煬者避竈)\n風吹(李南少明風角女見疾風卒起吹竈突及井泣辭曰姑此主爨者當之果卒也)\n生䵷(戰國策曰智伯攻晉陽而水之城不沒者三版曰竈生䵷人馬相食)\n無黔突(墨子)\n竈銘(李尤曰燧人造火竈)\n五突(魯連子竈五突分煙者衆矣)\n祭竈(附竈門)\n禮有五祀(竈居一焉)\n孟夏其祀竈祭先肺(陽氣盛熱外祀之於竈從熱類也)\n老婦之祭(禮曰竈者老婦之祭也盛於盆尊於瓶注老婦先炊器也祭竈以祭先炊也)\n燔柴於爨非禮也(時多失禮燔於竈祀火神失祀竈之義)\n孫寶(後漢張忠署孫寶為主簿遂祭竈請比鄰)\n臘日(後漢陰子方臘日晨炊而竈神見黃羊因祀之三世至識繁昌遂常以臘日祭也)\n風吹(風吹竈神主婦當死)\n庶人(祭竈)\n天子親祠(李少君言祀竈皆可致神而丹沙可化為黃金黃金成以為器飲食則益壽壽益則海中蓬萊山者乃可見之封禪則不死黃帝是也於是天子親祀竈焉)\n又(抱朴子曰孟夏可以祠竈竈神每月晦日上天言人罪狀大者奪紀小者奪筭紀三百日筭一百日)"},{"id":"juan3-031","source":"正文","juan":"卷第三","menu":"車第三十","sub_menu":null,"page":null,"leaf":null,"text":"〔造車 美車 覆破 同載 戎車 使車 騁車 無車 借車 走馬車附〕\n肇牽(牛車)\n同軌(天下車同軌)\n以爾車來(詩)\n大車(轞轞)\n載馳(載驅)\n載驅(薄薄)\n不馳(不驅)\n有車(轔轔)\n脂轄巾車(脂轄巾車主車官也)\n流水(漢書車如流水馬如龍)\n立而至秦(慎子曰行陸者立而至秦有車)\n任重致遠百兩(之子于歸百兩御之)\n十乘(元戎十乘以先啓行)\n棘軸(史記稀膏棘軸所以為滑也不能運方穿)\n任載(持載)\n致千里(莊子曰軸不運而致千里)\n載物服箱公車(周禮巾車掌公車之政令公官也)\n退與人謀(周禮輈之和也進則與馬謀退則與人謀注云言車進退之易與人馬之意相應此為輈之善所致)\n勸登馬力(言輈和勸用馬力)\n壹取(周禮馬力既竭輈猶能取一焉注云馬雖止輈尚能一取道喻易進也亦言輈之善也)\n象天地日月(又曰軫之方象地蓋之圓象天輪輻三十象日月)\n牽傍(車轅之外輓牛曰牽傍)\n乘殷(之輅)\n命車(九命三命而賜車馬也禮)\n獻車(獻車馬者執策綏禮)\n暢轂(詩文茵暢轂謂長轂也)\n有棧之車(行彼周道)\n役車其休(庶人車也言農功畢)\n匪車(朅兮疾車)\n五楘梁輈(梁輈上鉤衡)\n長者轍(陳平門多長者車)\n魚軒蓽路(柴車)\n車甚澤(澤美也)\n鍥軸(陽虎盡借色人之車鍥其軸鍥刻也)\n借車(見上)\n爭車(公孫閼與潁考叔爭車考叔挾輈以走子都逐之不及)\n挾輈(見上)\n輦車駕輦(輦人挽也以載任器上為藩營)\n五輅(巾車掌五輅一金輅二玉輅三象輅四革輅五木輅王后之五輅其名物與其用)\n夏縵(卿乘也)\n黑車(大夫乘)\n棧車(士乘)\n役車(庶人乘)\n行陸(作車以行陸)\n察車自輪始一器而一人聚者車為多推轂(漢書)\n還轅(輿不及還轅)\n轂擊(車馳轂相擊)\n六飛(袁盎曰陛下馳六飛)\n熊軾(後漢列侯伏熊軾皂蓋)\n虛左(魏公子乘車虛左自迎侯生)\n戲車(衛綰以戲車為郎)\n驢車(張楷公超家貧無業常乘驢車至市賣藥足給而還又蒯子訓嘗乘驢車)\n上殿(魏鍾繇元帝為太傅有膝疾拜起不便時華歆亦以高年疾朝見皆使載輿虎賁輿上殿就坐見三公有疾遂為故事)\n壹馬(鮑宣子都為豫州牧郭欽奏宣行部乘傳法駕駕一馬舍宿鄉亭坐免罪)\n賜車蓋(黃霸字次翁任揚州刺史宣帝下詔賜車蓋特高二尺別駕主簿車緹油屏𡰱於軾前以章有德)\n褰帷(見刺史門)\n葦車(袁閎夏甫爲沛相乘葦車)\n柴車(謝夷吾堯卿遷鉅鹿守行春乘柴車刺史上其儀序失中損國典左轉為下邳令)\n羊車(晉輿服志護軍羊琇輒乘羊車司隸劉毅劾其罪)\n官給(太康四年詔依漢故事給九卿朝車駕駟馬及安車各一乘詔諸尚書軍校加侍中常侍者皆給傳車給劒得入殿省與侍臣相隨)\n雨隨車(漢百里嵩事見雨門注)\n牛車(漢初將相或乘牛車)\n乘入宮殿(車千秋年老上優之朝見得乘小車入宮殿因號車丞相)\n德車結旌(結旌乘車也結謂收斂不飾)\n車中不內顧(夫子云翔而後集迴翔審觀而後下止)\n舍車而徒(義不乘也易)\n〇造車(附車門)\n轉蓬(淮南子聖人觀轉蓬而為車)\n椎輪(文選失椎輪為大輪之始大輅寧有椎輪之質)\n伐輪(坎坎伐輪伐輻)\n有車之用(三十輻共一轂當其無有車之用)\n象日(文子曰轉輪而無窮象日月之運行)\n輪轅之材(文選直木不為輪)\n遵途(合轍)\n季材(穉材也以柔刃故爲車也)\n作車(以陸行)\n聚工(一器而工聚者車為多上與)\n樸屬(凡察車之道欲其樸屬而微至不樸屬以為完久也注樸屬附著堅久皃)\n微至(不微至無以為蹙速也注謂輪圓甚則著地微少也蹙速行疾皃蹙將六反)\n三材(輪人為輪斬三材必以其時三材既具巧者和之注三材轂輻牙)\n利轉(轂者以為轉也輻者以為直指也牙者以為固抱也牙音訝謂車網)\n慎(莫歷反)\n爾(輪貌)\n揱爾(輻貌音消皆謂其美)\n容轂必直(轂之為容取之於直)\n揉輻必齊(揉以大矯之取之於直)\n杼以行澤侔以行山(凡為輪行澤者欲杼之行山者欲侔杼以行澤則是以刀割塗故塗不附侔以行山則是搏摶徒端反以行石也輪雖弊不隣於鑿注杼謂網薄也侔厚也搏亦厚也弊盡也鄰動之也)"},{"id":"juan3-032","source":"正文","juan":"卷第三","menu":"車第三十","sub_menu":"（續）","page":null,"leaf":null,"text":"平沉必均(謂以輪沉於水考其輕重四平)\n輈有三度(注去輈大小有三等度謂淺深之數也國馬之輈深四尺有七寸田馬之輈深四尺駑馬之輈深三尺有三寸)\n軸有三理(一者為美無節目也二者以為久堅仞也三者以為利滑密也)\n揉輈(凡揉輈欲其遜而無孤深注遜順理也孤木弓引之中三中三深之極揉輈之倨句可如二也三則傷其力也)\n輈欲傾典(傾音苦很反典音敕彌反堅仞貌)\n輈欲弧而無折經而無絕(太深則折經亦謂順理也進則與馬謀退則與人謀注云進退之易人馬之意相應也馬行主於進人行則有退時也終日馳驅左不揵注揵音蹇今倦字言輈和則不疲倦也行數千里馬不契需注謂傷蹄也不需道理也終歲御衣袵不弊此唯輈之和也袵謂裳也安則和是以然也)\n勸登馬力(注登正也謂輈和勸用馬力也既竭輈於猶一取焉注正馬取道喻易進)\n人謀馬謀契需𥘛獘(見上注)\n軫方(軫之方以象地蓋之圓以象天史)\n奚仲(薛祖奚仲居薛以為夏車正掌車之官)\n契需(反覆)\n庳車使高(史記孫叔敖為楚相俗好庳車一以為不便馬欲下令使高其相曰令數下人不知所從王必欲高車臣請教閭里使高其梱乘車皆君子君子不能數下車從之半歲民悉自高其車此不教而人從化也)\n司南車記里車(晉輿服志司南記里諸車過江亡失制度而謝安率意造焉及獲京師舊輦形制無差)\n千里振策(終不契需)\n五馭和鸞(罕能反覆)\n旣勸登於馬力(亦退與人謀)\n美車(附車門)\n服美不稱(傳曰慶季之車不亦美乎叔孫曰服美不稱必有以惡終美車何爲)\n美澤可鑑(慶封獻車於季武子美澤可以鑑鑑形也展莊叔見之曰車甚澤人必瘁宜其亡也)\n甚澤(見上注)\n不飾(闔廬舟車不飾儉也)\n七香五雲(並美車名)\n如輊如軒(詩戎車既安如輊如軒注云輊摯也從後視之如摯從前視之如軒然後通調也)\n疾驅於通道大都(詩序)\n載驟駸駸(詩)\n過國如歷塊焚之(晉阮裕有好車借無不借有人葬母意欲借不敢言裕聞歎曰有車使人不敢借何以用車遂命焚之)\n紺轅(翠轂)\n車不雕幾(謂國家靡弊也周禮)\n鮮車(後漢向栩甫興狀若狂生好被髮裸足或騎驢入市乞匄後徵拜趙相及之官時人謂其必脫素從儉而栩更乘鮮車御良世疑其始偽也)\n宜稱朱轓(漢詔吏者人之師也車服宜稱六百石已上皆長吏也而與民無異今一千石朱兩轓千石至六百石朱左轓)\n流水(馬皇后云見親戚車如流水馬如龍甚不悅)\n茱萸輞(石崇作及白槐之輻)\n黜車(子駟黜尉止車曰爾非禮也注過制)\n覆破(附車門)\n僨濟(鄭伯之車僨于濟僨風飄入濟水也)\n載輸爾載(詩曰載輸尓載輸墮也)\n棄爾輔(詩曰其車既載乃棄爾輔)\n無輗(大車無輗小車無軏其何以行之哉)\n脱輻(傳曰車脱其輻不利行師)\n摧輪(魏武帝詩北登太行山羊腸坂詰曲車輪為之摧)\n前覆後戒(漢書前車覆後車戒)\n或載或墮(老子)\n折軸(史記羣輕折軸)\n毁折(周禮謂車損也)\n獘車(故獘之車)\n勞薪(荀勖食知破車腳為柴)\n恥敝車(見同載門)\n將泛駕(泛覆也)\n中道而廢輔車旣不相依(脫輻如何前進)\n同載(附車門)\n同載而歸(文王得吕望爲師乃同載而歸)\n虛左以迓(信陵君聞侯嬴乃虛左以迓執轡親御)\n共載均茵憑(汲黯與周陽由同列共車未嘗敢均茵憑)\n惠而好我(攜手同車)\n恥獘車(董允少與費禕齊名許靖喪子允曰父和與禕同會其葬父和遣開後鹿車給之允有難色禕便前上和謂允曰始吾嘗疑汝於褘而今而後吾意了矣)\n兄弟也(張骼謂宛射犬曰公孫乘兄弟也注云同乘之恩若兄弟也)\n監令(晉和嶠為中書令荀勗為監舊監令同車嶠嫉勖諂乃先登專坐不容勖勖乃自備車自此始異車)\n王徽之(嘗從桓沖行遇雨因下馬排入沖車謂曰公豈獨擅一車)\n獻帝與趙溫同車(後漢獻帝西都為侍中與趙溫同輿輦至長安封江南侯爲司空字子柔)\n子曰不與同車(與異姓同車不同服禮以朝服異也)\n夏侯惇(魏太祖與惇同輿載諸將無得比也)\n戎車(附車門)\n十乘(元戎十乘以先啓行)\n左輪(朱殷)\n小戎(戎車)\n輕車即戎(車輕疾者以即戎同禮也)"},{"id":"juan3-033","source":"正文","juan":"卷第三","menu":"車第三十","sub_menu":"（續）","page":null,"leaf":null,"text":"不鬻(禮兵車不中度不鬻於市)\n不式(兵車不式尚威武也)\n武車綏旌(綏謂張也武車兵車)\n戰車(晉馬隆孝興討羌依八陣圖作偏箱車地廣為鹿角車營路狹則為木屋施於車上且戰且前弓矢所及應絃而倒矣)\n使車(附車門)\n埋輪(張綱為御史在八使之中埋輪於洛陽都亭云豺狼當道安問狐狸遂劾梁冀也)\n使者車軺車輶軒(並使車)\n攬轡(慨然有澄清天下之志)\n軺傳(晉輿服志軺車古之將軍車也一馬曰軺車二馬曰軺傳車漢貴輜軿而賤軺車晉重軺車而賤輜軿)\n〇騁車(附車門)\n翹翹(車乘招我以弓豈不欲往畏我友朋)\n軟輪(蒲輪安車)\n公車爲駕(漢龔勝曰竊見國家徵醫巫皆備駕徵賢者亦宜為駕上曰大夫乘私車來耶勝曰唯唯)\n無車(附車門)\n彈鋏(馮諼彈鋏歌曰長鋏歸來乎出無車)\n徒行(顏回死顏路請子之車以為之槨子曰以吾從大夫之後不可以徒行)\n蔡誼(以明經給事大將軍幕府無車嘗步行衆門下好事者相合爲買犢車)\n借車(附車門)\n借車(東方朔為尚書從公孫弘借車)\n借邑人車(陽虎囚於西鄙盡備邑人之車鍥其軸麻約而歸之注鍥刻也)\n走馬車入國不馳(馳若藺人)\n卹勿驅(禮記國中以策篲卹勿驅塵不出軌注謂不馳也)\n子有車馬(不馳不驅)\n塵不出軌(見上注)\n長楸(詩走馬長楸間)\n馳騁知禁碾市人之足(莊子碾市人之足則辭以放傲兄則傴大親則巳矣)\n章臺街(張敞為京兆尹走馬章臺街)\n馳六飛(袁盎曰陛下馳六飛)\n賭逐射(田忌數與齊諸公子逐重射孫子曰臣能令君勝與君及公子賭千金孫子曰以君之下駟與彼上駟君上駟與彼以中駟君以中駟彼以下駟卆得王千金)\n過華臣之門必騁怒馬(注林楚及衢而騁)"},{"id":"juan3-034","source":"正文","juan":"卷第三","menu":"舟第三十一","sub_menu":null,"page":null,"leaf":null,"text":"〔造舟 戰舩 覆舟 御舩 開水路附〕\n濟巨川(若濟巨川用汝作舟楫書)\n藏夜壑(莊子夫藏舟於壑謂之固矣然而夜半有力者負之而走昧者不知)\n汎彼(柏舟在彼中河)\n一葦(誰謂河廣一葦杭之)\n汎汎(楊舟載沉載浮)\n神仙(後漢郭林宗自京師歸諸儒送至河上林宗唯與李膺同舟而濟衆賓望之以為神仙)\n坐而至越(慎子曰行海者坐而至越有舟故也)\n鷁首(淮南子龍舟鷁首)\n青雀(舟名)\n鳥舟(七命曰乘鳥舟兮為水嬉)\n餘艎(吳王敗楚獲吳之乘舟名餘艎)\n不繫(汎兮若不繫之舟)\n任重致遠槁工(楫師榜人)\n水行(莊子)\n利涉(大川)\n涉川(行海)\n川惟設險(舟以濟人)\n持載一葉(桂葉舟)\n千艘(萬舸)\n臭厥載(書曰若乘舟汝不濟臭厥載)\n行舟(罔水行舟言丹朱無道習於無水行舟書)\n荃橈(桂櫂之名為舡械伺傷退人舩從底沉行五十步乃逸)\n以運舩為戰艦(陶偘以運舩為戰艦或言不可偘曰以官物討官賊)\n試舩沒(見溺水)\n覆舩(附舟門)\n覆舟(家語夫水所以載舟亦所以覆舟)\n懼(齊侯與蔡姬乘舟于囿蕩公公懼變色禁之不可)\n載沉(載浮)\n魚吞(鯨魚吞舟)\n風波(漢書渡江河無楫中流而風波舩必覆之)\n積羽沉舟(史)\n漂蕩(沉溺)\n顛覆膠舟\n御船(附舟門)\n五覆始乘(月令季春天子命有司覆舟五覆五反刀告舟備具于天子焉天子焉天子始乘舟有司周官也覆反者慎之至也)\n魚跳(武王伐殷有白魚跳入王舟)\n龍負(夏禹南渡江黃龍負舟)\n濟汾(泛樓舩汾河漢武帝)\n諫御舩(漢成帝酎祭出便門欲御樓舩薜德諫宜從橋免冠曰陛下不聽臣言臣自刎以血污汙車輪上乃止)\n試御舟(遇風波見溺門)\n開水路(附舟門)\n鑿離堆(溝洫志蜀守李冰鑿離堆穿三江城都中皆可舩行百姓享其利往往引水溉田)\n引渭水(鄭莊當時引渭水渠旁南山下漕粟爲便上爲然乃穿三歲方通)\n通褒斜(溝洫志有人上書欲通褒斜道及漕言褒水通沔謂斜可以舩行漕漢中上發數萬人作褒斜而水多湍石不可漕也)\n鑿砥柱(大禹鑿砥柱爲三門)\n濬川之功泛舟之利揣高卑(議遠近)\n舟師造戰船(見上注)\n白氏六帖事類集卷第三"},{"id":"toc-juan4","source":"卷四總目","juan":"卷第四","menu":"卷第四總目","sub_menu":null,"page":null,"leaf":null,"text":"白氏六帖事類集卷第四　本卷總目（共 42 門）\n衣服一　（小字：奢美 儉敝 異服 製造 贈遺 無衣 法度 洗濯 補綴附）\n裘二　（小字：奢麗 儉敝 裼襲附）\n冠弁冕三　（小字：巾奇侈 儉敝附）\n芾韠四\n帶紳五\n衾第六\n袴第七\n韤第八\n履舄九\n笏第十\n珮十一\n玦十二\n權衡十四\n量十五\n度十六\n劔十七（小字：利用靈異鑒識鑄礪）\n匕首十八\n刀十九\ 怒第二十九（印刷頁三〇八）\n本稿（改定後）：宜無悔怒\n初錄（書影釋讀）：宜無懈[?]怒\n參校本：宜無悔怒\n處理：從參校本\n依據與說明：《詩·大雅·抑》作「宜無悔怒」，據改。"},{"id":"jiaokan7-020","source":"校勘表","juan":"卷第七","menu":"怒第二十九","sub_menu":null,"page":"印刷頁三〇九","leaf":null,"text":"【校勘】位置：怒第二十九（印刷頁三〇九）\n本稿（改定後）：不遷\n初錄（書影釋讀）：奇[?]遷\n參校本：不遷怒\n處理：從參校本\n依據與說明：顏回「不遷怒」，據改。"},{"id":"jiaokan7-021","source":"校勘表","juan":"卷第七","menu":"卷末","sub_menu":null,"page":"印刷頁三一一","leaf":null,"text":"【校勘】位置：卷末（印刷頁三一一）\n本稿（改定後）：白氏六帖事類集卷第七（尾題）\n初錄（書影釋讀）：—\n參校本：白氏六帖事類集卷第七\n處理：說明\n依據與說明：尾題在本葉右半第四行，其後第六行起為卷第八卷端，不入本卷錄文。"},{"id":"jiaokan7-022","source":"校勘表","juan":"卷第七","menu":"字級校勘","sub_menu":null,"page":"全卷","leaf":null,"text":"【校勘】位置：字級校勘（全卷）\n本稿（改定後）：—\n初錄（書影釋讀）：—\n參校本：—\n處理：說明\n依據與說明：本卷參校本約五千六百字，本稿約二萬五千字。自動逐字比對得二十處候選，逐條覆核後採六處，其餘十四處或係參校本誤識（如「單食」為「簞食」之誤），或係其不分事目夾注而誤合（如「斯亂充詘」），概不採。"},{"id":"toc-juan8","source":"卷八總目","juan":"卷第八","menu":"卷第八總目","sub_menu":null,"page":"三一一","leaf":"二十オ","text":"白氏六帖事類集卷第八　本卷總目（共 51 門）\n孝第一\n養禮二\n孝行三　祿養四附　榮親\n父母疾五　違離六附　覲省\n孝感七\n毀傷八\n不孝九\n天子孝十\n諸侯孝十一\n卿大夫士孝十二\n庶人孝十三\n事親禮十四\n忠十五\n忠義十六\n忠孝十七\n不忠十八\n義十九\n義感二十\n智二十一\n智謀二十二　機權　先見　敏　聰悟　博物附\n信二十三　誠感附\n仁二十四\n寬恕二十五\n直二十六\n德二十七　德量　盛德附　陰德　德感人\n規誨二十八\n賢德二十九　賢\n行三十\n性情三十一\n命三十二\n節操三十三\n高潔三十四\n脩整三十五\n縱逸三十六\n風流三十七\n剛三十八\n彊三十九\n柔四十　怯懦附\n褊急四十一\n儉四十二　未食　儉附\n勤四十三\n怠墮四十四\n謙讓四十五　謙損　以貴下士\n恥尚四十六\n貞四十七\n恭敬四十八\n謹四十九\n慎五十　慎密　慎終　鑒誡\n傲慢五十一　驕附\n勇五十二　猛勇附\n壯五十三　壯士　不　附"},{"id":"juan8-000","source":"正文","juan":"卷第八","menu":"孝第一","sub_menu":null,"page":"三一二","leaf":"二十ウ","text":"詩凱風美孝子也能盡其孝道以慰母心　七子之母\n白華美孝子之絜白也\n南陔孝子相戒以養也\n書奉先思孝\n克諧以孝烝烝乂不格姦\n人之行莫大於孝\n聖人之德無以加於孝乎\n君子務本本立而道生孝悌也者其爲人之本與\n事父母能竭其力\n父兮生我母兮鞠我　長我育我出入腹我欲報之德昊天罔極\n宗族稱孝焉\n邇之事父\n弟子入則孝　出則悌\n子生三年然後免於父母之懷\n予也有三年之愛　於其父母乎\n州閭鄉黨稱其孝也\n父父子子天之經地之義\n人之行\n子道\n君子頃　音跬步之間不敢忘孝\n潁考叔純孝也　愛其母施及莊公\n傳孝子不匱　永錫爾類\n曾閔之行\n綵衣弄鳥　老萊子年八十衣綵衣爲嬰兒戲於父母之前\n扇枕溫席\n孝聞當時\n生則敬養\n無違　孟孫問孝子曰無違\n用孝　養父母\n五刑之首　百行之先\n君子篤於親　篤厚也\n當孝理之時　　　之德\n淳厚\n天地之經\n膝下　故親生之膝下\n日嚴　嚴致敬於父母也\n天性　父子之道天性也\n行成於內　孝由中出\n孝哉　閔子騫\n烏反哺\n六行之先　周禮六行孝友爲先\n父在觀其志　父没觀其行\n請敎不匱　無有辭\n仁親之道\n執以爲恭\n爾雖有說　謂之曰孝吾則不知\n家統乎尊　行先乎孝\n行以內成\n陶乎孝理　根以天性\n因心之孝\n名以孝聞　禮由恩制\n棘心　夭夭母氏劬勞\n蘭陔庭闈\n陟岵　孝子行役思念父母\n師氏三德敎國子　三曰孝德以知逆惡\n三行　一曰孝行以親父母\n不遺惡名　禮父母既没慎行其身不遺父母惡名可謂能終矣\n噬指　蔡順字君仲養母求薪客至母望順不還母乃噬指順心動弃薪走歸母　　云云\n巨孝　江革事具下注\n事親孝　與士信臨財廉取與義分別有讓恭儉下人"},{"id":"juan8-001","source":"正文","juan":"卷第八","menu":"養禮第二","sub_menu":null,"page":"三一三","leaf":"二十一オ","text":"南陔孝子相戒以養也\n採蘭\n有事弟子服其勞\n有酒食先生饌\n曾是以爲孝乎　言未足爲孝也\n服勤至死\n凡爲人子者冬溫而夏凊昏定而晨省　定安牀衽省問安否\n曾子曰君子所謂孝者先意承志諭父母於道\n參直養者也安能爲孝乎\n小人皆能養其親君子不敬何以辨\n陸績懷橘　　歲字公紀\n子路負米\n下氣怡聲\n和氣愉色\n傷哉貧也　子路曰傷哉貧也生無以爲養孔子曰啜菽飲水以盡其歡斯之謂孝\n禮曰君子之孝養也樂其心不違其志\n生則親安之　祭則鬼享之\n居則致其敬　養則致其樂\n子曰今之孝者是謂能養　至於犬馬皆能有養不敬何以別乎\n文王之爲世子也朝於王季日三雞鳴而衣服至寢門外問內豎曰今日安否\n食上必在　在察視寒煖之節\n食下問所膳　問所食\n命膳宰曰末有原　末勿也原再也令其食物無再進也\n問所欲而敬進之　內則\n父母在朝夕恒食子婦佐餕　子與婦食其餘食\n父没母在冢子御食　侍母食也\n羣子婦佐餕如初\n禮　言熟羶薌嘗而薦之非孝也養也\n養可能也敬爲難\n敬可能也安爲難\n孟子云曾子養曾晳既食問其餘乎曰有　恐曾晳更欲分賜與人\n曾申養曾子既食問有餘乎曰無矣將以復進也\n若曾子者所謂養志也\n曾申者養口也\n事親如曾子可也\n父母何嘗　何食詩刺勤勞不得養父母\n慈以旨甘\n禮就養無方\n大養　後漢書曰夫鍾鼓非樂之本而不可去三牲非孝之主而養不可廢言能大養則周公致四海之祭以義則仲由之菽甘於東鄰之牲也\n行傭供母　江革字次翁客下邳行傭供母母老恐擾動自在轅中挽母車\n父母老不辭官　晉賈充責庾純父母老不歸養中丞孔恂劾詔下議何曾等曰禮之禮律八十者一子不從政九十者家不從政新令亦如之秉純父年八十兄弟六人三人在家不廢侍養於禮律未有違\n解職就養　傅咸字長虞出爲冀州刺史繼母杜氏不肯隨咸之官咸自表解職也\n祖母老辭官　李密字令伯徵爲太子洗馬密以祖母劉氏年高無人奉養上表陳情不應命"},{"id":"juan8-002","source":"正文","juan":"卷第八","menu":"孝行第三","sub_menu":null,"page":"三一四","leaf":"二十一ウ","text":"子曰父母唯其疾之憂\n色難　承順顏色爲難\n父母之年\n父母之年不可不知一則以喜一則以懼　見其壽考則喜見其衰老則懼\n孝哉閔子騫人不閒於其父母昆弟之言\n爲人子者出必告反必面所遊必有常所習必有業\n恒言不稱老　廣敬也\n不登高不臨深不苟訾不苟笑\n孝子不服闇　服事也闇中爲事好生嫌疑\n不登危懼辱親也\n父母在不許友以死　不有私財\n父母命呼唯而不諾\n手執業則投之食在口則吐之走而不趨\n曾子曰身也者父母之遺體　敢不敬乎\n居處不莊事君不忠涖官不敬朋友不信戰陣無勇非孝也　五者不遂災及於親敢不敬焉而遂成也\n一舉足不敢忘父母是以道而不徑　徑邪道也\n舟而不游不敢以先父母之遺體行危殆\n一出言不敢忘父母是故惡言不出於口忿言不反於身不辱其身不羞其親　可謂孝矣\n父母在不稱老\n閨門之內戲而不歎　君子以此防人人猶有薄於孝而厚於慈\n蒸蒸　舜\n孜孜　漢明帝\n鮑永去妻　永字君長妻於母前叱狗永遂去之\n違命則不孝　傳\n敬親者不敢慢於人　孝經\n事親者居上不驕爲下不亂在醜不爭　三者不除雖日用三牲之養猶爲不孝也\n孝莫大於嚴父　尊嚴其父\n敬其父則子悅\n修身慎行恐辱先也\n居父舊官　漢杜延年拜御史大夫居父舊官不敢當其舊位坐卧皆易其處所\n子曰\n子曰孟莊子之孝也　其他可能也其不改父之臣與父之政是難能也\n爲人子者三賜不及車馬　恐尊踰於父\n孝有三　小孝用力中孝用勞大孝不匱慈愛忘勞可謂用力矣尊仁安義可謂用勞博施備物可謂不匱也矣\n父母在不敢有其身不敢私其財　示民有上下也\n傷足不出　樂正子春下堂而傷足數月不出猶有憂色\n全歸　父母全而生之子全而歸之可謂孝矣\n三年無改於父之道　可謂孝矣\n不擇祿　子路曰家貧親老不擇祿而仕\n倚門　王孫賈年十五母曰汝朝出晚來倚門望暮出不歸倚閭望\n不許友以死　聶政不受嚴仲子金以母在未敢許人之死\n最孝　萬石君子孫咸孝建爲最\n號哭救父　樂恢年十一父爲縣吏得罪將殺恢伏寺中晝夜號哭令哀之而赦其父\n遇賊　江革字次翁臨淄賊起負母逃走遇賊不忍害\n傍無几杖　胡廣年八十繼母在堂口不稱老旁無几杖\n忌日三日不食　申屠蟠字子龍\n驢鳴　戴良字叔鸞母好驢鳴良常學之以悅母\n手不驅蚊　晉吳猛常手不驅蚊畏其噬母去也\n眇目　殷仲堪父病積年拭淚眇一目\n取江水　姜詩母好江水詩兒爲母常取之後被江水溺死恐傷母情詐言遊學餘而舍傍涌泉如江水并雙鯉同出\n慰母心　有子七人莫慰母心\n揚名後世　注見下\n身輓車　江革事見上注\n聞父耕泣　晉趙至年十三詣師受業聞父耕叱牛聲投書而泣師怪問之曰我未能養使老父勞苦師甚異之\n扇枕　王延字元甫事親夏則扇枕冬則以身溫之\n洗浣　石建爲郎中令每五日洗沐歸舍竊問侍者取親中帬廁牏身自浣　注親父也中帬言中衣也廁牏汁杅也牏音投\n持遺劒　張武父與吳戰失屍骸武每節持遺劒至亡處祭酹而還\n拜畫圖　金日磾見母畫象則拜\n又　晉許孜生有孝行圖父母象於廟朝夕拜之\n郭巨瘞子　略見"},{"id":"juan8-003","source":"正文","juan":"卷第八","menu":"祿養第四　附榮親","sub_menu":null,"page":"三一六","leaf":"二十二ウ","text":"孝乃先行　祿宜逮及\n祿非爲己　養貴逮親\n鴻既漸而于干　烏豈忘於反哺\n欲養而親不待（韓詩曾子曰往而不還者\n續上注親也故孝子欲養而親不待是故椎牛而祭不如雞豚之逮親存也初吾爲吏祿不過鍾釜尚所欣然而喜者樂其逮親也既没之後　　堂高九尺轉轂百乘猶北向而泣者悲其不逮吾親也）\n家貧親老不擇祿而仕　家語子路曰家貧親老不擇祿而仕昔者由也爲親百里負米親没南遊於楚從車百乘累茵而坐列鼎而食願負米百里豈可得乎樹欲靜而風不止子欲養而親不待枯魚銜索幾何不蠹二親之壽忽如過隙子曰由也可謂思之也\n毛義捧檄　毛義家貧養母張奉慕其名詣義會府檄至以義爲守令義捧檄入喜動顏色奉心賤之及義母死除服舉賢良方正不就奉歎曰往日之喜爲親也\n千及親之祿\n立身揚名　以顯父母\n日用三牲之養\n曒曒林烏　受哺於子\n耿弇省疾　後漢耿弇父況疾兄弟三人皆垂青紫侍省疾當世榮之\n虞譚母孫氏加金章　虞譚母孫氏夫亡不改節訓譚忠義後蘇峻反譚有功拜武昌侯太夫人加金章紫綬譚立養堂於家王導已下皆拜\n感汝墳之就舉　周磐字堅伯居貧母儉薄不充誦詩至汝墳之卒章慨然而歎乃解韋帶就孝廉之舉卒章曰雖則如燬父母孔邇\n公卿奉壽　後漢張酺字孟侯爲太尉雖在公位父常歸田里酺每遷職輒一詣京師適會歲公卿罷朝詣府奉酒上壽酺歎辛曰衆人皆榮慶之\n將吏拜迎　張遼文遠也合肥時遣母至也遣從出迎所督諸軍將吏皆羅拜道側觀者榮之\n顧雍母　吳志顧雍爲尚書令迎母於吳既至權臨賀之親拜其母於庭太臣畢會後太子往賀之"},{"id":"juan8-004","source":"正文","juan":"卷第八","menu":"父母疾第五","sub_menu":null,"page":"三一七","leaf":"二十三オ","text":"喜懼之年　父母之年不可不知一則以喜一則以懼\n左右就養無方　方常也左右扶持也\n昏定而晨省　定謂安衽省問安否\n父母有疾　冠者不櫛行不翔言不惰琴瑟不御食肉不至變味飲酒不至變貌笑不至哂怒不至詈哂見齒也\n行不能正履\n不脫冠帶而養\n親有疾飲藥子先嘗之　禮\n病則致其憂\n色不滿容\n色憂　王季不安節則內豎以告文王文王色憂王季復膳然後亦復初\n文王有疾　武王不脫冠帶而養文王\n一飯亦一飯文王再飯亦再飯旬有二日乃間\n禮曰下氣怡聲問衣燠寒　疾痛苛癢而敬抑搔之出入則或先或後而敬扶持之\n禮曰親老出不易方復不過時\n黃雀　王祥至孝後母病思黃雀炙之不得　數乃有雀數十飛入幕母感之\n母失明　盛彥母王氏因疾失明彥不應辟召躬奉病久婢使數見捶撻婢伺彥行取蠐螬炙飴之母食以為美然疑是異物藏以示彥彥見而抱母慟哭絕而後蘇母目豁然即開也\n奏孝行　劉弘為荊州奏偵敘母老疾困賊至守衞不移以致拷掠　　至殞命可以調獎臣子長益風教白請敘為歸鄉令\n文爾而私官真夫婁庾黔婁"},{"id":"juan8-005","source":"正文","juan":"卷第八","menu":"違離第六　附覲省","sub_menu":null,"page":"三一八","leaf":"二十三ウ","text":"陟彼岵兮瞻望父兮陟彼屺兮瞻望母兮\n父曰嗟予子行役母曰嗟予季行役\n父在不遠遊遊必有方　論\n懼之年靡瞻匪父　靡依匪母\n凡為人子所遊必有常\n親老出不易方復不過時　不使長憂也\n扇枕之戀倚門之恩　並見上註\n晨昏之禮　朝夕之戀\n眷戀庭闈　心不違安\n父母何嘗　何嘗食\n夫為人子者出必告反必面\n●覲省　附違離門\n胡威問絹　後漢胡威父質為荊州威自京來省父辭歸父賜絹一匹跪曰大人清苦安得此絹父曰吾俸祿之餘\n又　來寇守夏甫父賀為彭城相寇往省謁變姓名從行既至吏不為通會阿母出驚入乃自呼入\n敬父書　評吳顧悌字子通每得父書必掃几拜跪讀之每句應諾畢復再拜若父有疾即臨書垂泣即聲哽咽"},{"id":"juan8-006","source":"正文","juan":"卷第八","menu":"孝感七","sub_menu":null,"page":"三一八","leaf":"二十三ウ","text":"曾子至孝三足烏棲其冠　家語\n姜詩江泉　見孝門\n孟宗泣而冬筍出　孟宗後母好筍令宗冬月求之宗入竹林慟哭筍為出之\n劉殷哭而堇萠開　劉殷祖母冬月思生堇殷哭而感堇生滿地\n王祥感而黃雀　見父母疾門\n又剖冰而雙鯉躍出　王祥母思魚時冬求魚冰合祥剖開感雙鯉出\n動天之德　感神之誠天祚其大孝誠物感\n孝非外至　思自中來\n蛇膽　顏含字弘都養嫂失明含嘗藥退膳不冠不入嫂目疾須蚺蛇膽含討盡求不得有一童子以合授含含開視之乃蛇膽也童子出門化為青鳥而去嫂目遂差\n滅火　後漢郭弼為長沙太守有孝子古初遭父喪未葬鄰舍失火火起初俯匐柩上號哭以身捍火火為之滅　異之\n鶴吶　晉吳隱之執喪過禮家貧無人助哭每至哭臨之時常有雙鶴鳴叫也\n七年粟　劉殷至孝曾夢西籬下有粟掘之得十五鍾銘曰七年粟賜孝子劉殷又二白鳩巢於庭\n赤烏巢門　華陽國志吳順養母赤烏巢門\n白兔遊墓　後漢方儲字明幼喪父事母母終負土成墳白兔遊其下\n烏助成墳　蕭廣濟孝子傳文讓養母至孝母亡兄弟二人役力營葬不周傭賃之力葬日羣烏數千銜土壤助而成墳也\n又　李陶母死陶墓側自治墓羣烏銜土助成墳\n墳自成生松竹　孝子傳宗承父喪舊墳負土作墳一夕而成墳土自高五尺松竹自生\n火越燒　蔡順君仲母終未葬里有火發偪頓舍順抱柩叫哭火遂越燒他舍\n馴兔連理　蔡邕廬墓有白兔馴擾左右生連理\n感鳥獸　晉許孜季義親沒柴毀負土成墳不受鄉人之助有哀其苦助者晝不逆夜除之每一悲號鳥獸翔集列植松柏五六里一日鹿犯松栢孜歎曰鹿獨不念我乎明日見鹿被猛獸殺置所犯栢側孜悵惋不已作冢埋鹿猛獸即於孜前自撲而死孜歎而埋之後樹木滋茂立宅墓側孜亡　　　鹿猶　　　鹿獸　庭中\n失明後開　見父母疾門\n又冰魚　王延後母盛冬求魚不得杖之流血延叩頭於冰而哭有一魚躍長五尺\n孝女沉江　後漢叔先雄父墮湍水雄感念常有自沉之意家人防之百餘日漸解因乘船於父墮處哭自投水其家夕夢雄曰却後六日當共父同出至期併之果與父相扶持出\n投牋河伯　異苑云司徒宗君儒乘冰省墓溺河而死兄論於水側哭歲與河伯岸側將開儒骸浮出\n曹娥　曹娥父為巫祝於縣江泝濤迎婆娑神溺死不得屍娥年十四緣江號哭晝夜不絕旬有七日遂投江而死抱父屍而出"},{"id":"juan8-007","source":"正文","juan":"卷第八","menu":"毀傷第八","sub_menu":null,"page":"三一九","leaf":"二十四オ","text":"身為親後　考乃行先\n將使全歸　必思\n曾子有疾　召門弟子曰啟予手啟予足而今而後吾知免夫小子言全而歸也\n曾子曰身者父母之遺體　敢不敬乎\n全而歸之　見上\n不虧其體　樂正子春下堂傷足足瘳數月不出猶有憂色門弟子問之對曰吾聞之夫子曰父母全而生之子全而歸之可謂孝矣不虧其體不辱其身可謂全矣\n君子頃　言跬步之間不敢忘父母\n乘險迴車　漢王陽為益州長史行至九折坂歎曰奉先人之遺體奈何數乘此險遂以疾去後王遵除為益州刺史至坂問曰此非王陽所畏之坂乎吏曰然遵叱其御曰王陽為孝子王遵為忠臣\n淑慎其身不敢毀傷　曾子曰身體髮膚受之父母不敢毀傷孝之始也\n不辱　曾子曰孝有三大孝尊親其次不辱其下能養\n慎行其身親之枝也　孔子曰身也者親之枝也敢不敬與\n千金之子不坐垂堂　百金之子不立倚衡漢書\n持遺劒　張武父業戰死不獲屍武每哀絕即持劒於亡處祭醊而還第五倫舉孝廉後遭母喪過毀傷父魂靈不反因哀慟殞命"},{"id":"juan8-008","source":"正文","juan":"卷第八","menu":"不孝第九","sub_menu":null,"page":"三二〇","leaf":"二十四ウ","text":"不愛其親而愛他人者　謂之悖德不敬其親而敬他人者謂之悖禮以順則逆民無則焉\n凶德　不在於善而皆在於凶德凶德謂悖德也\n薄於孝　以此防民民猶有薄於孝而厚於慈大孫之防民猶有偷之\n匪人不子　遺親\n敗因嚴之教　皆莫敬親\n正德惡之刑　豈容悖禮\n德非歸厚　罪豈從輕\n既不念於悖亂　實可逃罪無所\n棄色難之訓　曾是違親\n當孝治之朝　敢息悖德\n猶為不孝　子曰居上而驕則亡為下而亂則刑在醜而爭則兵三者不除雖日用三牲之養猶為不孝也\n莫大於不孝　五刑之屬三千而罪莫大於不孝三　悖也\n非孝者無親　　人之孝者是有無親之心\n執以從宜　尚儻有說\n謂之敬孝　吾則不知\n其父攘羊而子證之　語\n殺父（令尹子　　　欲　南之子棄疾為王御士王每見之必泣棄疾曰君三泣臣矣敢問誰之罪也王曰令尹之不能爾所知也國將討焉爾其居乎對曰父戮子居君焉用之洩命重刑臣亦不為王遂殺子南棄疾其徒\n承前曰行乎棄疾曰吾預殺吾父行將焉入曰臣王乎曰棄父事讎吾不忍也遂縊而死）\n不孝之刑　周禮以八刑糾萬民一曰不孝之刑\n糾孝　糾察也周禮以鄉刑糾　孝\n傷孝　書子不祗服厥父事大傷厥考心\n父母亡不歸　史吳起與母別嚙臂為盟曰不為卿相不歸及事曾子頃之母死起終不歸曾子薄之而與起絕交\n傷父之心　禮\n有無父之國　則可逃死\n當篤親之朝　如何擅背\n此父子之疏節也　言非至孝也\n子曰斷一樹殺一獸　不以其時非孝\n寡人嘗學斷斯獄矣　子弒父凡在官者殺無赦殺其人壞其室洿其宮而豬焉蓋君父之刑也\n子弒其父　易\n莫慰母心　詩曰有子七人莫慰母心"},{"id":"juan8-009","source":"正文","juan":"卷第八","menu":"天子孝第十","sub_menu":null,"page":"三二一","leaf":"二十五オ","text":"至德要道　子曰先王有至德要道以順天下民用和睦上下無怨\n德之本　夫孝德之本也教之所由生也\n加於百姓刑于四海　以德教加天子之孝\n君子篤於親則民興於仁　君子謂在上也\n民德歸厚聖人則之夫孝天之經也地之義也　是以其教不肅而成其政不嚴而治其所因者本也本謂孝也\n因親以教愛　先王見教之可以化民也故因嚴以教敬因親以教愛\n先之以博愛　而民莫遺其親\n孝理天下　先王之以孝治天下也故得萬國之歡心是以天下和平災害不生\n禮曰至孝近乎王　至悌近乎霸\n塞乎天地　曾子曰夫孝置之而塞乎天地溥之而橫乎四海施諸後世而無朝夕之期\n孟子曰舜其大孝矣\n五十而慕吾於大舜見之矣\n不以天下儉其親\n子曰舜其大孝也與　德為聖人尊為天子富有四海之內"},{"id":"juan8-010","source":"正文","juan":"卷第八","menu":"諸侯孝第十一","sub_menu":null,"page":"三二一","leaf":"二十五オ","text":"在上不驕高而不危所以長守貴也制節謹度滿而不溢所以長守富也　制節儉費用謹度守禮法\n富貴不離其身　然後能保其社稷而和其民人蓋諸侯之孝也\n不敢侮於鰥寡　治國者不敢侮於鰥寡而況於士民乎故得百姓之歡心以事其先君云云"},{"id":"juan8-011","source":"正文","juan":"卷第八","menu":"卿大夫孝第十二","sub_menu":null,"page":"三二二","leaf":"二十五ウ","text":"非先王之法服不敢服非先王之法言不敢道非先王之德行不敢行　是故非法不言非道不行口無擇言身無擇行言滿天下無口過行滿天下無怨惡三者備矣然後能守其宗廟蓋卿大夫之孝\n治家者　不敢失於臣妾而況於妻子乎故得人之歡心以事其親\n士孝資於事父以事母　而愛同資於事父以事君而敬同故母取其愛而君取其敬兼之者父也\n故以孝事君則忠　以敬事長則順忠順不失然後能守其祭祀而保其祿位蓋士之孝也\n揚名於後世以顯父母　孝之終也\n夫孝始於事親　中於事君終於立身\n事君不忠　朋友不信戰陣無勇非孝也"},{"id":"juan8-012","source":"正文","juan":"卷第八","menu":"庶人孝第十三","sub_menu":null,"page":"三二二","leaf":"二十五ウ","text":"用天之道分地之利謹身節用以養父母　此庶人之孝也\n禮曰士庶人有善本諸父母\n書曰肇牽車牛遠服賈用孝養厥父母厥父母慶自洗腆致用酒"},{"id":"juan8-013","source":"正文","juan":"卷第八","menu":"事親禮第十四","sub_menu":null,"page":"三二二","leaf":"二十五ウ","text":"內則曰子事父母雞初鳴咸盥漱櫛縰笄總拂髦　　　音毛\n冠緌纓左右佩用　用謂必用之物也左佩紛帨刀礪小觿金燧右佩玦捍管遰大觿木燧也\n以適父母舅姑之所下氣怡聲問衣燠寒疾痛苛癢而敬抑搔之　抑按也搔摩也\n出入則或先或後而敬扶持之\n柔色以溫之\n父母衣衾簟席枕几不傳　傳移也\n杖屨　祗敬之勿敢近\n父有所命應唯敬對\n進退周旋慎齊　齊莊也\n升降出入　不敢噦噫嚏咳欠伸跛倚睇視不敢唾洟\n寒不敢襲　襲重衣也\n癢不敢搔\n不有敬事　不敢袒裼\n父母唾洟　不見輒刷去之\n冠帶垢　和灰請漱\n衣裳垢　和灰請澣\n五日燂湯請浴　燂溫也燂　　反\n三日具沐其間面垢燂湯請靧　靧洗面也\n足垢燂湯請洗\n勿逆勿怠　子婦孝者敬者父母之命勿逆勿怠\n若飲食之雖不嗜必嘗而待　已不嗜者嘗而待命\n加之衣服雖不欲　必服而待也\n父母怒　撻之流血不敢疾怨\n起敬起孝　起更也\n親在行禮於人稱父母或賜之則稱父拜受之　事統於尊\n父命呼唯而不諾　手執業則投之食在口則吐之\n走而不趨　至敬也\n父黨無容敢辭危匪非飯莫敢用　年敬\n量能"},{"id":"juan8-014","source":"正文","juan":"卷第八","menu":"忠第十五","sub_menu":null,"page":"三二三","leaf":"二十六オ","text":"在三之義　父生之師教之君食之也\n無而利國猶或為之\n危則致身　死而\n圖國無私　不二\n竭力　推誠\n臣事君以忠\n臨患不忘國　忠也\n圖國忘死　貞也\n臨大節而不可奪也　君子\n社稷之臣　柳莊死公曰非寡人之臣是社稷之臣也\n苟利國家何以事君　齊士　失忠　敢何以事君\n為人臣者殺其身　有益於君則為之\n匪躬之節\n時危見臣節　世亂識忠臣詩\n難至而節見　史忠臣累至而行明貞臣難至而節見\n為下克忠　書\n悃款之誠　忠一之意見楚辭\n憂國忘家是以　誠公私\n進思　君子之事上也進思盡忠退思補過\n名以忠聞　節固危見\n儒有忠信以為甲胄　又以為寶\n以道事君　不可則止\n事君不忠　非孝也\n為臣不全　禮\n事君之小心　禮\n圖國之大節　忠廣\n荀息竭股肱　荀息曰臣竭其股肱之力加之以忠貞不濟則以死繼之\n子文毀家　以紓楚國之難\n林父進思　荀林父之事君進思盡忠\n子囊城郢　子囊將死遺言謂子庚曰必城郢君子謂子囊忠將死不忘衞社稷可不謂忠乎\n公家之利　知無不為\n託六尺之孤　寄百里之命謂如君\n文子死國難　衞國有難公叔文子以其死衞寡人不亦貞乎\n鬻拳納刑愛君　鬻拳強諫楚子而自刑君子曰可謂愛君矣諫而自納於刑刑猶不忘納君之善\n鮑永哭墓　後漢鮑永長使過更始墓下車哭盡哀帝問公卿曰何如張湛曰忠者禮義之宗也不忘君行之高者上也\n王常心如金石　後漢光武謂王常曰輔漢室心如金石真忠臣也是日拜為漢忠將軍\n孔達刺衞請以死　左傳孔達　　晉討之達曰苟利社稷請以我說遂自縊而死\n安于寧趙將焉用生　傳智伯請趙氏殺董安于安于曰我死而晉國寧趙氏定將焉用生乃縊而死\n嵇紹衞晃　晉嵇紹從惠帝戰百官奔散唯紹以身衞帝兵交御輦血濺御衣而死\n申蒯斷臂　申蒯　　斷臂與門者入死事卹以呼天而死之\n弘演內肝　呂氏春秋曰狄人殺衞懿公盡食其肉唯留其肝弘演使還哭畢自取出肝內懿公之肝\n仇牧碎首　公羊宋萬弒閔公仇牧聞之趨而至遇萬于門手劍叱之萬批仇牧碎其首齒著乎門闔仇牧可謂不畏彊禦矣\n胡綱懸衣冠　後漢胡綱有志節王莽篡綱解衣冠懸府門而去\n龔勝推印綬　後漢王莽篡遣使奉璽書印綬迎龔勝推而不受曰吾受漢家大恩豈忍事二姓也下後見故主哉不食而死\n山甫補過　袞職有闕惟仲山甫補之能補過者也\n季文子無私積　傳季文子卒宰庀家器為葬備無衣帛之妾無食粟之馬無藏金玉無重器備君子知文子之忠於公室相三君矣無私積\n史魚屍諫　史記史魚將死不令殯於寢曰吾生不能進蘧伯玉退彌子瑕死以自屍諫衞君來弔問之其子以告立進蘧伯玉退彌子瑕\n上思利人忠也　傳\n為下克忠　書\n丑父與君易位（晉韓厥逐齊侯既及逢丑父與公易位使公下如華泉取飲丑父代公居位故公得下\n車而免韓厥獻丑父欲子將戮之曰代其君任患者戮之不祥舍之以勸事君者乃免之）\n紀信乘車以誑楚　項羽圍漢王於城皐紀信曰事急矣臣請誑楚乃乘王車詐降漢王遂開南門而出羽聞之詐也大怒遂燒殺紀信也\n王蠋縊樹　史燕入齊聞王蠋賢令軍中環畫三十里無入燕蠋曰齊人多高子之義吾將以子萬家蠋曰忠臣不事二君貞女不更二夫齊王不聽吾諫故退耕今國亡無義自固遂繫頭於樹奮絕而死齊亡大夫曰王蠋布衣義不北面於燕況食祿者乎相率以從王於莒也\n卜式佐軍　呂嘉反卜式上書曰主愧臣死皆當盡節其駑下者宜出財以佐軍\n黃權歸蜀無路　蜀黃權率　降魏魏文帝謂曰卿去無路歸義欲効由迹乎權對曰臣降吳不可歸蜀無路故降魏後先主以問至　　咸賀本　權獨否\n耿弇不以賊遺君父　傳\n誠志士之成仁　豈足夫之竊論\n巳死巳亡豈同親暱之義　晏子曰國君爲社稷死則死之爲社稷亡則亡之若爲巳死則爲巳亡非其親暱誰敢任之言親暱則當死私難\n主在與在\n誠爲社稷之臣\n臣克艱厥臣　書虞\n不避汚出不逃難　傳\n殺身以成仁　伐君任患\n若臨患無苟　豈愛死爲難\n不得中行　識古人之重死\n將期激節　豈志士之求生"},{"id":"juan8-015","source":"正文","juan":"卷第八","menu":"忠第十五","sub_menu":"（續）","page":"三二五","leaf":"二十七オ","text":"君臣士臣　國語中行穆子圍鼓以鼓子苑支來令鼓人各復其所非寮勿從酒沙釐以其孥行從鼓子曰我君是事非事土也名曰君臣豈曰土臣穆子曰鼓有君矣曰臣委質於翟之鼓未委質於晉之鼓也\n能執干戈以衛社稷　書\n社稷臣　漢文帝目送絳侯曰社稷臣袁盎曰功臣非社稷臣也社稷臣者主存與存主亡與亡諸呂用事絳侯爲太尉本兵柄不正其　諸呂　絳侯功成故曰功臣\n又　上問　　何如嚴助曰居職無　人使輔少主守城　事賁育不能奪也上曰古有社稷臣者黯近之\n柱石　昌邑王淫亂霍光憂懣田延年曰伊尹相　太甲安社稷宗廟後世稱忠將軍　　石善能行之亦漢之伊尹\n臨難致命（傳楚圍宋宋華元使解揚如宋曰晉師悉起將至矣使告宋楚子囚之使反其言許之登車而呼宋人遂致其君之命楚子\n將殺之乃捨之）\n又　吳楚反圍齊齊使路中大夫告急於天子天子復令　齊王堅守三國合圍無從而入三國與盟矣若反言漢已破齊促降許之既至城下望見齊王曰漢已發百萬軍使太尉救齊大夫乃害\n忠不忘君"},{"id":"juan8-016","source":"正文","juan":"卷第八","menu":"忠義第十六","sub_menu":null,"page":"三二六","leaf":"二十七ウ","text":"不以財貨汙人　後漢朱暉爲郡吏太守阮況欲市暉婢　不與曰恐以財貨汙君況卒　贈　非有　也\n請代長吏死　劉平爲彭城吏龐萌反攻　　孫萌　以身伏萌　刃上被　　　　　　之\n袁渙感劉備　劉備死羣臣皆賀袁渙不賀袁渙以嘗爲備　舉吏\n冒法解故王　　　太子殺有司不許官　法　　冒禁至伊\n鼓宿沙釐隨　見上門\n欒布哭彭越　布爲梁大夫使齊未還漢誅越首布還奏事越頭下祠而哭之\n代太守罪　後漢周嘉高祖燕　爲　曹太守欲枉殺人燕諫不聽死家守闕冤考燕曰願著燕名但言時病將掠燕　撓當下蠶室至不食而死\n七賢　汝南郡門下　生趙太守謙討擊黃巾軍敗功曹封觀等七人以身捍刃皆死謙得免詔復其門號七賢\n負太守逃　劉茂爲門下掾赤眉攻郡殺長吏負太守孫福　　　穴中得免　　隱夜求食百餘日賊去乃歸府\n吐辱官長者　晉王育字伯春太守杜宣命爲主簿時宣左遷萬年令杜令王攸詣宣宣不迎攸曰卿爲二千石吾所敬也今吾儕爾何不見迎欲以小雀遇我使畏死鷂乎育執刃叱攸曰主辱臣死小縣令敢輕辱吾君將刺之宣跣下抱育乃止由是知名\n歸故主　曹公禽關羽禮之甚重而顧其無久留意張遼以請問之羽曰吾知曹公待我厚然受劉公恩誓以共死不可背要當立效報曹公而後歸及羽殺顏良曹公知其必去重加賞羽封所賜拜書告辭而去奔先主曹公不令追之\n官長引爲證　後漢吳詠嘗爲馬賢府吏　爲太尉龐參掾賢參相誣罪應死各引詠爲證詠計理無兩直自刎而死二人感　解涼州刺史張　躬祭其墓撫其子孫\n舉幡募救罪　鮑宣子都坐　　使者大不敬下獄當死弟子王咸舉幡募救宣者會此諸生會者千餘人遮丞相車又守闕後得減死一等\n行賂免長吏罪　太守尹端以朱俊公偉爲主簿端坐死罪俊行賂得減端不知俊亦不言\n行賂贖罪（史弼字公謙\n孝廉魏郡貴　　　行　得減死）\n變姓名　鄧融請廉范爲功曹融下獄范變姓名求爲獄吏營護之及出獄又　養融"},{"id":"juan8-017","source":"正文","juan":"卷第八","menu":"忠孝第十七","sub_menu":null,"page":"三二七","leaf":"二十八オ","text":"以孝事君則忠\n移孝爲忠\n王尊忠臣　郭見孝\n君親在難　魏夏侯肯年十三漢中之敗左右提之以走肯曰吾親在難焉所走死會　以殺\n王經辭母　魏王經爲尚書　貴鄉公欲討司馬文王王沈王經預謀　沈走告文王經獨不行被收經辭母母顏色不變曰爲子則孝爲臣則忠人誰不死死得所何恨之也\n方寸亂矣　蜀徐庶從先主曹公獲其母庶辭先主而指其心曰本欲與將軍共圖霸業以方寸之地今失老母方寸亂矣無益於事遂詣曹公\n忠孝萃於一門　晉卞壼與蘇峻苦戰死二子眕盱見父沒同赴賊見害母撫二子屍曰父爲忠臣汝爲孝子何恨王隱曰　死於君子死於父忠孝萃於一門\n違孝徇忠　晉溫嶠字太眞欲將命母崔氏固止之嶠絕裾而去後母亡阻亂不獲歸葬\n不以母辭　周處爲中丞　忠其　直及　隸夏侯駿西征孫秀知其將死謂之曰卿有老母可以辭　曰忠孝不兩全既辭親事君父母安得而子乎今日我死日也\n代父死罪　史石奢　　楚行縣有殺人者追之乃其父也縱父而自拘曰以父立政不孝也廢法縱罪非忠也遂自刎以死\n隨母亡　畢諶爲兗州別駕張邈劫其母弟妻子太祖謝遣之老母在彼宜去諶頓首無二心既出遂亡呂布破諶生得衆皆懼太祖曰孝於親豈不忠於君乎不罪之用爲魯相"},{"id":"juan8-018","source":"正文","juan":"卷第八","menu":"不忠第十八","sub_menu":null,"page":"三二七","leaf":"二十八オ","text":"臣二主二斯以事君\n弃君　於私\n私政贊私　劉\n毀信　忠\n移事智伯　豫讓\n交私諸侯　漢\n孟子曰長君之惡其罪小逢君之惡其罪大　逢迎也謂先意道之爲惡\n居下訕上\n要君者無上\n利祿　三　不出竟則利祿也人曰不要君吾不信也\n言不忠信　語\n賊人之主\n事君不忠非孝也　禮\n貳心懷貳"},{"id":"juan8-019","source":"正文","juan":"卷第八","menu":"義第十九","sub_menu":null,"page":"三二七","leaf":"二十八オ","text":"詩書義之府也\n義者　利之本也\n君能制命爲義\n義以生利\n利\n者義之和也\n義以　建利\n義以　成命\n見義　不爲無勇也\n義之與比\n禮以行義　尊卑有禮得其宜也\n見義不爲　是爲人子\n闇而能徙　何以爲憂\n將息乎端　俾知義所\n名以義聞\n不爲義疚　疚病也見義則不爲病\n稱以好權　　權有詐\n謂之曰義　吾則不知\n義以爲質\n以義　事　荀子曰義者天下之斷也\n義以爲上　君子有勇而無義爲亂小人有勇而無義爲盜\n大道廢有仁義　老子\n名以義聞\n失義而後禮　老子\n上義爲之而有以爲　老\n土地　儒有立義以爲土地\n行而服人\n張乃國維　管子曰國有四維其二曰義\n節不可奪　道不可屈\n文侯軾廬於千木　段干木富於義故文侯爲之軾廬諸侯爲之止戈\n馮諼折券於薛人　爲孟嘗君市義\n晉文公出定襄王　子犯曰人未知義未安其居文公於是出定襄王以示事君之禮也\n石碏滅親　大義滅親謂殺子厚\n共叔多行　共叔段驕祭仲請討之莊公曰多行不義必自斃子姑待之\n諭於義　君子\n聞義不能徙　是吾憂也\n不義　而富且貴於義如浮雲\n恩義　君子行則恩義\n門內恩掩　門內之理恩掩義門外之理義斷恩\n不可劫以兵　文子曰夫爲義者不可劫以兵不可懸以利\n以義衛身　文子曰仕治則以義衛身世亂則以身衛義\n匡邪矯枉　文子曰義者匡邪以爲正撥險以爲平矯枉以爲直\n方外　易曰義以方外\n存義　易知終終之可以存義也\n達義　先王禮以達義\n斷恩　見上\n恩義　居則恩義\n義然後取\n夫行義者　以立言踐行\n豈徒徇名安己而已　懸以定吉試之勝夫身爲義則傷生身爲生則傷義義重於生全義可也後漢書\n不謀舊國（史樂毅去燕之趙趙王欲圖燕毅泣曰臣事昭\n王　事大王若獲戾放於他國終身不謀趙之徒隸況燕昭王後嗣乎）\n不忘舊主　見上注\n慕義　李膺門生皆禁錮侍御史景毅子寔爲膺門徒未有錄牒故不及譴毅慨然曰本謂膺賢遣子師之豈可以漏脫名籍苟安于己自免歸人義之\n爭罪　魏王思與梁習俱爲西曹令史思直日事失太祖旨將加重辟時思適出習代往被收思乃馳還自陳己罪太祖歎習之不言思之識分曰　中有義士二人\n不邀功　郭憲西平人仁篤爲郡功曹　歸韓約失信衆依先人多欲取約邀功憲責怒曰人窮歸我約病死遠勒約送欲邀憲名曰不生圖之取死人功太祖親問名不在中以情對賜爵關內侯\n默受罪　後漢段熲討羌涼州刺史郭閎貪其功稽留熲軍其從者役久戀鄉悉反叛閎歸罪熲熲坐徵輸左校羌復　營吏人守闕訟熲　問狀熲但謝罪不敢言枉京師稱爲長者\n自表取罪　雷義字仲公郡爲尚書　有同時郎坐事當居刑義默自表取其罪而論冠同臺覺之委位白上乞贖義罪　帝皆赦其罪\n免罪不謝　范滂字孟博繫獄尚書霍諝理之得免滂到京師往見諝而不爲謝或讓之滂曰昔叔向　罪祁奚救之未聞羊舌有謝恩之辭祁奚有自伐之色　卒無所言\n養老窮　　義字君卿有故人呂公無子老窮歸身於　養其妻及公終身\n恤孤窮　楊峻字秀才同郡王象少孤爲人僕年十八　牧羊而私讀書被　主　楚峻　其才質贖象　家中聘妻立屋然後與別\n又　晉許子章聞王育　牧學讀書失羊　爲己償之享　遂代育償羊給衣食　以子妻之　身長八尺鬚長三尺容貌絕異　復以兄子　妻之　焉宅分之　産　月　之　　色\n太守治病　蜀張嶷字伯岐　篤爲郡　資　太守何　　爲　　嶷與　乃自　　以臨病甚傾財治　數年乃愈\n以馬易棺　後漢劉翊子相道遇亡者以馬易棺脫衣斂之又遂故知困餓　路　　所乘馬殺之　　得　更\n排患救患救解於窮\n權濟\n富義\n抱義\n見得思義\n仁義爲干櫓\n正路　孟子曰義者人之正路也"},{"id":"juan8-020","source":"正文","juan":"卷第八","menu":"義感第二十","sub_menu":null,"page":"三二九","leaf":"二十九オ","text":"送人喪（後漢中　　　與諸侯王子　同在太學子　臨　　以身託　乃　　　喪　司　　　　　　　義之\n傳不受也）\n盜還馬　孔嵩仲山正身　行　公府之京師　下亭　盜其馬　是嵩馬乃責　曰　仲山　士　宜　　盜　馬還之\n刺客不忍殺　崔琦諷刺梁冀冀令刺客　殺之客見琦耕陌上懷詩誦詠乃以實告曰君賢不忍相殺君可亟逃吾亦從此亡矣遂去之琦音奇\n賊不入鄉　鄭玄會　直遇黃巾見玄皆拜相約不敢入縣\n又　袁閎見世亂乃　迹　命不　　受位世莫能名黃巾賊入縣相約不入其廬\n託孤　吳陸瑁同郡徐原　會稽　書不相識臨死遺瑁書託以幼　瑁爲起墓收導其子\n後漢傳論曰李膺振拔汙險之中蘊義生風以鼓動流俗激素行以恥威權立廉尚以抑貴勢使天下之士奮迅感槩波蕩而從之幽深牢破家族而不悔至于子伏其死母歡其義壯哉　范滂之　將訣辭母母曰汝今得與李杜齊名吾何恨哉\n張儉　被捕亡抵孔褒　融匿之\n赤眉強兵　赤眉過　詩里　兵而過曰　　孝大　　鬼神\n胡昭　爲鄉里愛浪　冦約不犯胡君\n不忍刺　陽球使刺客刺　見　客不忍刺\n又　劉子使刺先主　然\n又　靈公使刺趙盾亦然"},{"id":"juan8-021","source":"正文","juan":"卷第八","menu":"智二十一","sub_menu":null,"page":"三三〇","leaf":"二十九ウ","text":"智者樂　水\n智者樂\n智者動\n不惑　智者\n智者　　愚\n用人之智　去其詐\n智者　見於未萌\n智者千慮必有一失　愚者千慮必有一得漢書\n智者　人\n知人　者知\n以恬養智　以智養恬恬智交相養\n智者　天下之達　也\n何如其智　言不智也\n挈缾之智　守不假器\n智者　不失人\n其蔽也蕩　好智不好學\n大智　子曰　其大智也與\n不以智役物　聖人\n智者心之府　文子神者智之役神清則智明智者心之府智公則心平\n絕聖棄智　人利百倍\n智不足稱　陽處父不及其身其智不足稱\n智免\n臧文仲之智　人良可謂\n臧文仲不智（仲尼曰\n者三作虛器縱逆祀祀爰居是三不智）\n智不如葵　仲尼曰鮑莊子之智不如葵葵能衛其足\n智之難也　有臧文仲之智而不容於魯抑有由也\n其智可及　甯武子邦有道則智邦無道則愚其智可及也其愚不可及\n既明且哲　以保其身\n樊遲問智　子曰務民之義敬鬼神而遠之可謂智矣\n子曰人皆曰予智　驅而納諸罟擭陷阱之中而莫之知辟也言其愚\n樗里之囊　史樗里子　多智秦人號智囊\n管仲隨馬　桓公北征孤竹山失道管仲曰老馬之智可用乃放老馬行果得道矣\n隰朋尋蟻　桓公北征孤竹無水隰朋曰蟻壤寸　有水乃掘　果然得水\n倉舒稱象　魏武欲稱象而不可稱倉舒曰載於舟中刻其至以他物驗之可知矣太祖大悅\n智有餘　陳　乎智\n周萬物而不遺　易\n智而不詐　張老\n智士無思慮之變則不樂　莊子\n智計歸之　魏賈詡曰以非太祖舊臣而謀策深長懼見猜嫌閉門而自守無私交嫁娶不結高門天下論智計者歸賈氏也\n宮之奇在虞　晉不加兵\n季梁在隨　楚不爲謀\n三仁未去　武王還師不伐殷\n智者所慮之於未形　達者所規之於未兆\n子胥　如姑　之有　鹿\n智果　諫智伯之　爲\n穆生　謝病以免楚難\n鄒陽　北游不同吳禍\n以賢勇智\n智囊　晁錯\n智如炙輠　史淳于髡智如炙輠輠者車之盛膏器也炙之雖盡猶流不竭言如髡之智也\n桓範　司馬宣王將誅曹爽桓範赴爽爽曰智囊去也\n杜預多智　人號\n大智　若愚\n不可以無涯之智役有涯之身　莊子"},{"id":"juan8-022","source":"正文","juan":"卷第八","menu":"智謀第二十二","sub_menu":null,"page":"三三一","leaf":"三十オ","text":"易人謀鬼謀　百姓與能\n謀及卿士　書\n謀之孔臧　詩\n謀謨乎其上　文選\n咨事爲謀\n好謀而成\n謀不　失利\n疑謀勿成　書\n中智以上　荀息請以璧假道於虞　曰玩好在耳目之前患在一國之後中智以上乃能之臣料虞君中智以下也\n運籌帷幄　漢祖\n曰運籌於帷幄吾不知子房\n隨會其智　傳曰隨會其智是捷也\n識理過人　晉謝安嘗曰朗之碎務無問是非至於興廢大事衆　能斷者而舒徐爲籌之多出衆表\n知機者其神乎　易\n祭仲知權　公羊宋人執鄭祭仲不名賢也曷爲知權宋人曰爲我出忽而立突仲不從則君必死國必亡從其言則可以存易亡古人有權祭仲是反於經然後有善也行權有道自貶損以行權不害人以行權殺人以自生亡人以自存君子不爲也\n未可與權　可以適道未可與立可以立未可與權\n行中權\n廢中權\n見機而作　不俟終日易\n子孟子曰嫂溺不援豺狼也\n王霸視河　後漢世祖爲王郎逐南奔至呼沱河使吏具舟楫還曰河流澌無舟可濟衆皆恐復使王霸往視霸欲安衆心且使至河乃止遂還云冰堅可度世祖兵至河冰已合遂令霸護渡未畢二車冰乃解也\n吾謀適不用\n嘉謀　嘉猷\n謀於野\n規矩成設　小大\n彼有人焉　謀於長者\n無謀\n謀及婦人\n謀及庶人\n謀人之軍　師敗則死之\n謀人之邦邑　危則亡之\n張儀在　蘇秦廢闔\n變通之間不容髮　機也"},{"id":"juan8-023","source":"正文","juan":"卷第八","menu":"智謀第二十二","sub_menu":"〇先見　附智謀門","page":"三三二","leaf":"三十ウ","text":"至誠之道可以前知見乎蓍龜動乎四體　國家將興必有禎祥國之將亡必有妖孽見乎蓍龜動乎四體禍福將至善必先知之\n先覺　抑亦先覺者是賢乎\n知微知章\n叔向母聞男聲　晉叔向母聞向之男伯石生　之及堂聞其聲而還曰豺狼之聲也非此莫喪羊舌氏遂不視之\n子文欲殺越椒　楚子良生子越椒子文曰必殺之是子也熊虎之狀豺狼之聲不殺之必滅若敖氏之族\n贈策　士會將歸晉繞朝知其情贈之以策曰子無謂秦無人吾謀適不用也\n見事遲　史范睢謂王稽入秦穰侯問稽車中有客乎稽曰無睢曰穰侯智士而見事遲向疑車中而忘索之乃下步行十里乃反索車中\n有先知　而無後悔\n思鱸魚　晉張翰爲齊王所辟因秋風起思鱸魚曰大丈夫所貴適意爾遂棄官歸江東俄而齊王敗人謂翰有先知之明\n軍勝人　下接次頁\n亡　鍾會鄧艾伐蜀劉寔字子眞曰破蜀必矣而皆不還客問之笑而不答果如其言先見皆如此類也\n虞不臘矣　晉假道於虞宮之奇曰虢虞之表也虢亡虞必從之晉不可啓寇不可翫虞公不聽宮之奇曰虞不臘矣虢其亡乎\n屈瑕伐羅　楚屈瑕伐羅鬭伯比謂其御曰莫敖必敗舉趾高心不顧矣果敗\n穆叔見趙孝伯曰　趙孟將死其言偷且年未五十諄諄如八九十不能久矣偷苟且也\n先識後艱\n智者　見於未萌\n求知太早　同見彈以思鴞\n辨事方遲　異在途而搜索\n許負之識條侯\n牛生白犢　孔父知其言祥\n位賤朱輪　趙母知其必敗\n●敏　附智謀門\n敏則有功\n黎民敏德\n不忘敏　叔向曰遠氏有後於楚宜哉子蕩乘君命不忘敏\n加之以敏　齊國莊子來聘禮成而加之以敏左傳\n告諸往而知來者\n敏於事　而愼於言\n訥於言　而敏於行\n回也非助我者於吾言無所不說　聞言即解無所起發增益\n吾與回言終日不違如愚　默而識之無所請益\n聞一知十　回也\n聞一知二　賜也\n開敏　張敞以公主子開敏\n敏給　語\n雞肋　楊脩字德祖爲曹公主簿操平漢中欲因討劉備而不得進欲守之難爲功於是出教唯曰雞肋衆莫曉脩曰夫雞肋食之無所弃可惜也公歸計決矣\n承意觀色　淳于髡以承意觀色爲務昇見梁惠王默無言惠王問之曰前見王王志在驅逐後見王王志在音王曰誠聖人也\n●聰悟　附智謀門\n識亡書　漢武帝幸河東亡書三篋張安世識之寫得後購得本相校一無遺脫\n市肆閱書　後漢王充字仲任博學不爲章句家貧無書常遊雒陽市肆閱所賣書一見誦得遂博通百家之書\n記貧人姓名　後漢　　既孤仕郡戶曹歲荒人饑太守尹興使於都亭設貧人粥計名字畢太守問口數六百人姓名無遺誤\n●博物　附智謀門\n張華　博物記默識四海之內若指掌也\n讀諸刺（夏侯湛從祖榮謝第五子七歲日誦千言經目輙識之文帝召之時有客百餘人人奏刺　下接次頁\n鄉里姓名示之一編復使誦之不錯一人\n應奉讀書五行俱下　爲郡決曹史行部錄四縣十人太守問之奉口說姓名罪狀輕重無遺脫一人\n博物君子　晉侯謂子產爲博物君子\n博物多識　王粲爲侍中\n識竹簡　晉束皙博物時嵩山下得竹簡一枚上兩行科斗字張華問束皙曰此漢明帝顯節陵中策文也驗之果然\n讀碑覆棋　王仲宣與人共行讀道邊碑背而誦之不失一字又觀人圍棋局壞粲爲覆之棋者不信以帕蓋更以他局爲之相較不失一路\n識部曲妻子　吳朱桓字休穆爲前將軍嘗與人一面數十年不忘部曲萬口妻子盡識之"},{"id":"juan8-024","source":"正文","juan":"卷第八","menu":"信第二十三","sub_menu":null,"page":"三三四","leaf":"三十一ウ","text":"大信不約\n小信未孚\n人未知信　未宜其用\n信以守禮\n失信不立\n信以接事\n小所以事大　信也\n仗德莫如信\n言以出信　書\n敦信\n匹夫一爲不信　終不可也\n可復之言　信近於義言可復也\n車無輗軏　孔子曰人而無信不知其可也大車無輗小車無軏其何以行之哉\n用情　上好信則民莫敢不用情\n著誠　去僞禮之經也\n作大事　不以信未嘗可也\n寡信　輕諾必寡信\n國寶　信國之寶也\n信人之所庇\n言要爭與\n好信不好學　其蔽也賊\n伐原示信　晉文公\n二三其德　不信\n信及豚魚\n闕而不立　兵食\n失則何行　辭無輗軏\n守約　盟華\n忠信以爲寶　以義甲冑\n是曰行先　人下\n不爲君之所司也\n名以出信　名位不愆則爲民所信\n信以行義　義以成命小國所望而懷也信不可知義無所立四方諸侯其誰不解體\n信以守器　動則不失信則車服可保\n節以誠著　名以信聞\n子路之言　傳千乘之國不信其盟而信子路之言言誠信\n季布之諾　諺曰黃金百斤不如季布一諾\n澶泉之會　卿不書不信也夫諸侯之上卿會而不信寵名皆棄\n文子不爲人下（趙文　下接次頁\n子能敦信不爲人下也\n孔丘去食　不得已而去於斯二者何先曰去食去信自古皆有死人無信不立\n子路無宿諾　情於信也\n退三舍　晉文公與楚戰退三舍以報其德守信也\n冒雨赴期　魏文侯與虞人期獵雨甚文侯曰與人期不可失信乃冒雨而赴也\n吳起終日不食　吳起與故人期食不至起終日不食來乃食\n郭細侯竹馬之期　郭伋字細侯行縣有童兒騎竹馬迎曰聞使君來喜故迎問伋何日迴伋與之期及迴先期不入留一日以示信也\n范巨卿雞黍之會　范巨卿張元伯千里爲雞黍之會及期果至登堂拜母\n尾生抱橋而死　與女子期也\n匹夫匹婦自經於溝瀆　子曰豈匹夫匹婦之爲諒也自經於溝瀆而莫之知也\n信士分財　文子曰使信士分財不如定分而探籌何則有心者之平不如無心者之平\n晉侯存信去原　晉侯圍原命三日之糧原不降命去之曰信人之所庇得原失信云云\n子木弃信　不及三年\n巨卿赴期　千里無差\n進德　易曰忠信所以進德也\n人之所助者信也\n信以結人\n周仁之謂信\n復言非信也　言無善惡而必復之非義信也\n不欺之臣　公羊曰臣區宋圍猶有不欺之臣\n修辭立誠　易曰閑邪存其誠修辭立誠所以居業也\n不勉而忠　誠者不勉而忠不思而得\n相在爾室尚不愧于屋漏　著誠之義\n小人閒居爲不善無所不至見君子而後厭然揜其不善而著其善人之視己如見其肺肝然誠於中形於外故君子必愼其獨\n苟無信以\n信以發志\n苟信不繼　盟無益也\n言忠信　行篤敬\n忠信　禮之本也\n忠信之人　可以學禮\n臣能承命　信爲\n信於民　未施信於民而民信之矣\n情欲信\n信而後勞其　下接次頁\n民\n信而後諫　未信人以爲謗己也\n信之所勸者　信也\n積善之應　傳子曰管寧在遼東三十七年歸海中遇暴風船皆沒唯寧乘船自若時夜晦冥望見火光趣之得島島無居人又無火燼行者咸異焉寧曰積善之應也\n耿恭拜井　後漢耿恭字伯宗守疏勒城城中無水穿井十丈無水恭整衣冠拜井泉湧出\n神告亭崩　晉徐苗有志行常宿亭舍有神告曰亭欲崩遽走出得免\n恥貴輕寶　貴名辭寶也禮\n踐言\n諾責　與其有諾責也寧有己怨\n苟欲全吾言安得全吾身\n要盟無質　晉子曰負盟人之盟云云\n大道既隱　小信未孚\n稱以行權　有辯有說\n謂之守信　吾聞不知\n節以名聞　名以信聞\n蘇秦以百詐成一信　淮南子云"},{"id":"juan8-025","source":"正文","juan":"卷第八","menu":"仁第二十四","sub_menu":null,"page":"三三六","leaf":"三十二ウ","text":"仁者天下之表\n親爲國寶　親仁善鄰國之寶也\n神福仁而禍淫\n體仁　足以長人\n仁之本歟\n仁者安仁　智者利仁\n君子去仁　惡乎成名\n仁者樂山\n仁者靜\n仁者壽　智者樂水\n可謂仁之方\n仁遠　乎哉\n爲仁　由己\n仁者不憂\n甚於水火　仁之於民也甚於水火水火吾見蹈而死者未見蹈仁而死者也\n蹈仁　注見上\n當仁不讓於師\n有仁義　大道廢\n仁者　漢書仁者百行之宗\n稱曰用權　有辯有說\n謂之仁德　吾則不知\n上仁爲之　而有以爲老子\n三月不違仁　回也三月不違仁其餘則日月至焉而已矣\n克寬克仁　民罔常懷懷于有仁\n達德　仁者天下之達德\n仁者必有勇　勇者不必有仁\n宣尼訓人\n一日能用其力　子曰有能一日用其力於仁矣我未見力不足者\n顏子好學三月不違其心　見上注\n仲尼曰臧文仲不仁者三　下展禽廢六關妾織蒲\n違仁　君子無終食之間違仁\n求仁得仁（伯夷　下接次頁\n叔齊不食周粟\n無求生以害仁　有殺身以成仁\n好仁不好學　其蔽也愚\n仁親以爲寶　舅犯曰亡人無以爲寶仁親以爲寶注云仁親行仁也\n仁之爲器　子曰仁之爲器重其爲道遠舉者莫能勝也行者莫能致也\n與仁　子罕言利與命與仁\n若聖與仁　則吾豈敢\n仁則吾不知也\n仁以自衛　家語古之君子以仁自衛\n惻隱之心　孟子曰有惻隱之心仁也無惻隱之心非仁也\n仁而不武　無能達也\n里仁爲美\n處仁　擇不處仁焉得智\n依於仁　游於藝\n天下歸仁　一日克己復禮天下歸仁焉\n仁有三與仁同功而異情　有安仁有利仁有勉強爲仁\n仁之難成久矣\n君子而不仁者有矣夫　未見小人而仁者\n人而不仁　如禮何\n其仁不足稱也　舅犯見利不顧其君其仁不足稱也\n放麑　董仲舒春秋決獄曰君獵使大夫持以歸大夫道見其母隨而鳴感而縱之君慍議罪未定君病恐死欲託孤幼乃覺之大夫其仁厚也以麑況人乎乃釋之以爲子傅於義何又淮南子孟孫獵得麑使秦西巴持歸烹之其母隨而啼巴不忍去之孟孫怒逐秦西巴居一年取爲子傅曰夫一麑猶不忍況人乎　　曰君子不　　不罪大不譏使持歸非也然而中感母恩是　舍君命從之可也\n力行近乎仁　禮\n不背本　范子曰不背本仁也不忘舊信也無私忠也尊君敬也仁以接事信以守之忠以敬之敬以行之事雖大必濟\n取數多者　仁也\n田子方養老馬"},{"id":"juan8-026","source":"正文","juan":"卷第八","menu":"寬恕第二十五","sub_menu":null,"page":"三三七","leaf":"三十三オ","text":"苞荒　易\n爾無忿疾于頑　書\n無求備於一人　語\n必有忍　乃有濟\n有容德乃大\n不念惡　文仲作不觀而後不惡\n勿施於人　己所不欲\n其恕乎　子曰有一言而可以終身行之其恕乎\n躬自厚而薄責於人　則遠怨矣\n人之過也各於其黨觀過斯知仁矣　小人不能爲君子之行非小人之過也當恕而勿責\n寬　下接次頁\n則得衆\n國君含垢　傳天之道也\n曹參　見人有細過掩匿覆蓋之\n丙吉不罪馭吏　馭吏嗜酒　　　　　吉以醉飽之過斥人欲令安歸乎不過汙丞相車茵也忍之\n蒲鞭示恥\n羹爛汝手　後漢劉寬字文饒吏人有過但用蒲鞭示辱而已又夫人欲試之伺朝裝畢使婢奉肉羹翻汙朝衣寬神色不異徐謂婢曰羹爛汝手乎\n宋則蒼頭殺子　宋則子年十歲與蒼頭共弩射誤殺之則以蒼頭過誤　　不罪　　之\n不加詈於僮僕　晉\n忠恕　違道不遠\n兼容　博愛\n不以己能責人不能　王\n寬忠恕　而己\n認物與　具刑法門備認門注\n避父　　具凶禮門　　注\n不見吏過　曹參爲國相舍後園近吏舍日夜飲呼從吏惡之引參遊園中聞相召按之乃反取酒張坐飲亦歌呼相應見人細過專掩匿蓋覆\n敗面　蔡系與謝萬爭言推萬落牀冠帽傾脫萬徐起曰卿幾敗我面而神氣自若\n理遣　衛叔寶嘗云人有不及可以情恕非理相干可以理遣故終身無喜慍之色"},{"id":"juan8-027","source":"正文","juan":"卷第八","menu":"直第二十六","sub_menu":null,"page":"三三八","leaf":"三十三ウ","text":"正曲爲直\n直哉惟淸\n司直　彼己之子邦之司直\n直如朱絲繩\n如矢之直\n如弦之心　直如絃死道邊\n舉直錯諸枉　能使枉者直\n民之生也直罔之生也幸而免　言人生所以自然以正直\n直而無禮則絞\n好直不好學　其蔽也絞\n子貢曰惡訐以爲直者　訐謂攻人之陰私\n曰思無邪　詩三百一言以蔽之\n古之愚也直　今之愚也詐\n庸爲直乎　言非直也\n惡直醜正　言害正直也\n可謂直矣\n大直若曲　老子\n身由正　名以立\n直聞\n友直　子曰益者三友友直友諒友多聞\n辯厲　　　反\n觸邪\n介無好惡　屈軼指佞直禪悔亢\n稱以爲權　有辯有說\n謂之曰直　吾則不知\n盡忠心事上　正色事下\n立身勵物敦俗端表華移\n【葉三十四オ・ウ　原缺】\n施恵\n德輶如毛\n既飽以德\n以德綏我\n反德爲亂\n崇德報功\n在乎德行\n惟德動天\n明德\n務崇明德\n惟馨\n四德具矣\n德成而上\n爲政以德\n弃德不祥\n以德和人\n度德以處\n柔道以德\n欲報之德\n德惟善政\n汪汪萬頃陂　黄叔度\n大略　趙充\n堤腹　王義之\n敗面　見寬恕門\n超将中軍　原軫将中軍先以下軍超將中軍故曰上德也\n德之不脩是吾憂也　語\n有鄰　子曰德不孤必有鄰\n德延　延久也書曰惟寧王德延君奭\n秉德不康　康安也非我周秉德不康寧多方\n作德心逸日休　周書周成王云云\n恃德者昌　史\n黎民敏德　虞書言民敢疾脩德言后克艱厥臣知不易則政治\n德儉有度\n德廣所及\n望而畏之\n參於前也\n貌足畏也\n色足憚也\n德禮不易\n英華外發\n尊在瞻視\n威而不猛\n威莊而安\n容止可觀\n動則思禮\n行則思義\n監其德也\n德之恭也\n德之聚也\n德之輿也\n德施普也\n德明惟明\n上德不德\n秩秩德音\n恭儉惟德\n率德改行\n果行育德\n樹德務滋\n其德不回\n德音是茂\n禮以防德\n懿其文德\n既限我德\n皆有嘉德\n●陰德　附德門\n韓厥存趙孤　太史公曰韓厥感晉靈公紹趙孤以成程嬰杵臼之義韓氏陰德於趙其大者與魏氏爲諸侯十世宜乎\n邴吉病　漢邴吉病上使加紼而封夏侯勝曰未死臣聞有陰德必享其樂以及子孫今吉未獲報非死病果愈\n于公門（于公閭門\n續于公門注父老治之公曰必高大其門令容駟馬高蓋我治獄多陰德子孫當有興者至定國果爲丞相）\n升卿　虞詡祖曰吾治獄多活人後世雖不及于公何知不至九卿也故字詡曰升卿\n葬書生　後漢王忳字少林詣京師於空舍中見一書生疾困愍而視之生曰吾腰下有金十斤相贈乞藏骸骨未及問姓而絕忳鬻一斤營殯葬餘悉置棺下無知者後忳爲大度亭長至亭有馬入亭中風飄繡被墮忳前忳後乘馬卒年忳入他舍主人認馬忳具云云主人曰所埋者我兒也姓金名彥故以陰德報君也\n埋牛肉　晉周放鄉人有盜牛者於冢間訪得密埋其肉不使知之\n叔敖斬蛇　史孫叔敖見兩頭蛇恐人更見乃斬埋之叔敖母曰夫有陰德必有陽報汝必當貴後爲楚令尹\n活千人有封　後漢和熹鄧太后訓女叔父後曰吾活千人有封兒訓爲謁者治石臼河歲活數千人天道可信家必蒙福初太傅禹歎曰吾將百萬衆未嘗妄殺一人後亦有興者也\n全濟　順烈皇后父商曰我先人全濟河西活者不可勝數積德必報當在此女也\n靜陰合德\n不告而退遂亡　見孝養門\n齊衰三年　史程嬰立孤見詒還自殺趙武服齊衰三年春秋祀之世世不絕\n行成於内\n天惟報施　神亦福謙\n積善之家必有餘慶\n爲而不恃　聖人施德不望報老子\n德服人　附德門\n德則不競　傳曰德則不競尋盟何爲\n引車　史藺相如位在廉頗上欲辱之相如知每引車避之後頗肉袒負荊謝罪\n德攻　晉文公能以德攻人\n飲德　吳程普以年長侮周瑜瑜折節下之不爲校普自敬伏乃告人曰與周瑜交若飲醇醪不覺自醉也\n飽德　德詩既飽以\n君子之德風\n人皆改操飾行　許劭子將爲功曹太尉徐璆敬之府中莫不改操飾行同郡袁紹去濮陽令歸車徒甚盛入界謝賓客曰吾輿服豈可使子將見之遂以單車歸也\n孫期至孝　黄巾不犯孫先生舍以其至孝\n陳寔所短　陳寔仲弓鄉里化其德人有過曰寧爲刑罰所加不爲陳君所短\n王烈誘人（先賢行狀曰王烈識道達義其誘人皆因性氣誨之然有盜牛者發覺曰罰責甘心乞不使王烈知也烈聞之\n續王烈誘人注遺布一端以激其心後老父遺劍於路有一人守之乃是盜牛者）"},{"id":"juan8-028","source":"正文","juan":"卷第八","menu":"直第二十六","sub_menu":"（續）","page":"三四三","leaf":"三十六オ","text":"心服　　　長尹高見黄叔度未嘗不正容乃歸悵然有失母曰汝復從牛醫兒來耶對曰良不見叔度不自謂不及既覩其人固難得而測矣陳蕃周舉相謂曰時月不見黄叔度則鄙吝心生蕃爲三公歎曰叔度在吾不敢先佩印綬\n避盜　賞盜與盜開牛路並見盜門\n犯禾　皇甫謐高士傳曰管寧幼安鄰有牛犯寧禾寧牽牛著涼處自飲食過於牛主牛主大慙若犯嚴刑是以左右無鬭訟\n河海之潤　河海潤千里威澤及四海左傳\n行成于身\n唯有德者　能以寬服人\n德化　逢萌修道人者化之以德後漢\n無毒草　譬如靈　在林林無毒草威鳳在野集仁爲是以子將爲吏人皆改操後漢許子將\n●世德　附德門\n前訓　國語叔向曰若用前訓文侯之功武公之業可謂前訓\n世濟其美　不隕其名高陽才子\n家聲\n克紹前烈　書\n父作之　子述之\n無違命　傳曰自幕至瞽瞍無違命舜之先也\n世名清廉　漢王吉至孫崇世名清廉\n陳氏公卿　陳寔爲太丘長子紀爲司農孫羣爲司馬世有重名語曰公慙卿卿慙長\n伏不競　後漢伏湛九世祖伏生經學清靜無競故東州號伏不競\n楊氏名德　楊震伯起八世祖信封赤泉侯高祖敞丞相父寶隱居自震至七世名德震及玄孫彪四世爲太尉世有名德\n羊祜九世　並清德聞祖續父述\n汜毓　汜毓字稚春奕世儒素敦睦九世人號其家兒無常父衣無常主"},{"id":"juan8-029","source":"正文","juan":"卷第八","menu":"規誨第二十八","sub_menu":null,"page":"三四三","leaf":"三十六オ","text":"贈人以言　史孔子去周老子送之曰仁者贈人以言聰明深察近於死者議人也博辯宏達危身也\n規我　子產以他規我\n卒事不規　傳曰王使椒舉立向戌子產之後以規過卒事不規曰禮吾所未見者有六焉又何以規之\n良規　良規戰衛\n大夫規誨　書補察其\n匡其不及\n苦言良藥\n諍友"},{"id":"juan8-030","source":"正文","juan":"卷第八","menu":"賢第二十九","sub_menu":null,"page":"三四三","leaf":"三十六オ","text":"直方大\n義以方外\n通天下之志\n以賢　御衆周禮\n出其言善　則千里應之\n髦士攸宜\n昭明有融\n高朗令終\n南山\n有臺　樂得賢也\n南有嘉魚　樂與賢者共之\n棫樸　文王能官人也\n慎其獨　君子\n絜矩之道\n有方之士\n不尚賢使人不爭　老子\n恥名之浮於行\n難進易退　三揖而進一辭而退\n賤貨貴德　賢者不隕穫於貧賤不充詘於富貴去讒遠色賤貨貴德所以勸賢\n清明在躬\n氣志如神\n從善如流\n賢哉回也\n求善不厭\n賢者　子路宜居後也\n行賢而能去賢　実往而不受\n賢人集　荀陳之會見德門\n吉人爲善　惟日不足\n擇善而從\n爲善不改其度\n孳孳　雞鳴而起孳孳爲善堯舜之徒也\n朝有進善之旌\n爲善最樂　後漢明帝問東平王蒼處家何等最樂對曰爲善最樂\n許善　張纘居室盛華蓋妻子如嚴君人謂纘許善猶曰人皆許惡我獨許善何傷乎\n動不累高　晉謝鯤通簡有識人服其遠暢而恬於榮辱自顯若檝而動不累高\n守節　傳曰前志有之賢守節\n選賢與能\n任賢勿貳\n取賢斂才\n舉賢援能\n進賢授上賞\n親賢下士　族也\n賢賢易色\n國之紀人之望　賢者\n信賢而任之\n若之明也　議賢而下之臣之忠也呂氏春秋\n一沐三握髪一飯三吐哺　周公下士於白屋之士後世稱聖賢\n傷賢者殃及三代\n蔽賢者身當其害\n達賢者福流子孫\n嫉賢者名跡不全　三略\n人之清者爲賢\n賢不肖之杖　淮南子\n惟后非賢不乂　書\n得地千里不如得一賢　士呂氏春秋\n黄金累千不如一賢\n建官惟賢　書\n賤貨貴　貴得必德\n魏文得譽於諸侯（魏文侯師卜子夏敬段干木田子方得譽於\n續魏文得譽注諸侯）\n叔堅圖形於屈廟　後漢馬叔堅鄉里圖其形於屈原廟\n陳蕃解榻　陳蕃敬徐穉特設一榻來則解之去則懸之\n●慕賢　附賢門\n執鞭所欣慕　太史公曰晏子在余雖執鞭所欣慕\n傾慕　漢臨邛令不敢嘗食身自請司馬相如往一座盡傾慕之\n慕藺　司馬相如本名犬子慕藺相如爲人遂名相如\n李杜齊名　見義感門注\n喜御　荀爽常就李膺因爲其御既還喜曰今乃得御李君矣其見仰慕也如此\n折角巾　郭林宗行遇雨巾一角墊士人做之折其巾角以效之\n蒲葵扇　謝安風流時多愛慕故人罷中宿縣還有蒲葵扇五萬安取中者執之京師慕效競市價數倍\n掩鼻詠　謝安能詠爲洛下書生有鼻疾故音濁名流學詠者掩鼻效之\n衣練　王導爲太保時帑藏諸庫中唯練千端鬻之不售國用不給導乃製練布單衣士人翕然効之練遂踴貴\n擇善而從\n何敢望回　賜也\n希顏　慕顏子\n孟母三徙　以擇善\n見善如不及\n見善若驚　聞義能徙\n里仁爲美　擇不處仁焉得智\n衣潤而行務\n宣帝而嘉其文\n景慕\n景行\n龍門　李膺元禮以聲名自高士有得接遇者名爲登龍門\n見賢思齊\n執轡　魏公子執轡迎侯生夷門\n軾廬　魏文侯軾段干木之廬止戈於秦\n以己方人\n●知賢　附賢門與選部知人藻鑒門雜五之\n師表　黃憲字叔度世貧賤荀淑遇憲於逆旅時年十四竦然異之謂子吾之師表也既前見袁閬所未及勞問淑曰子國有顏子識之乎閬曰見吾黃叔度耶\n倒屣　王粲字仲宣蔡邕倒屣迎粲粲年少容貌小短座盡驚邕曰王公孫有異才吾不如也吾家書籍文章當盡與之\n張孝廉　劉表爲荊州尹張忠字孝廉詣表延之上坐言論曰當　宿至旦遣之忽遂還船須臾傳教見張孝廉船便召同載\n託子　薛宣爲不其丞琅邪太守趙貢見宣悅其能遣至府舍令妻相見戒曰貢兩子至丞相亦中丞相\n又託子　魏三輔決錄曰張既從容世　　見宣\n先噉牛心　王羲之字逸少年十三謁周顗顗異之時重牛心炙坐客未噉顗先割啖羲之由是知名\n功曹游殷察之邀既過家設賓饌其妻笑之殷曰方伯器也與論王霸之略遂以子楚託之後既薦楚爲漢興太守\n求縣　石苞字仲容西知名識吏部郎許允求爲小縣允曰卿我輩人當相引在朝何小縣乎苞曰不意允知己也知此\n武庫五兵　周弼見裴頠歎曰若武庫五兵縱橫一時之傑\n晏子贖越石父在縲紲中　見知人門\n謝尚就袁宏　見風流門"},{"id":"juan8-031","source":"正文","juan":"卷第八","menu":"行第三十","sub_menu":null,"page":"三四六","leaf":"三十七ウ","text":"行發乎邇見乎遠　易\n言行君子之樞機　易\n行過乎恭\n師氏教國子三行　一曰孝行以親父母二曰友行以尊賢良三曰順行以事師長孝友睦婣\n行前定則不疚\n危行危言\n行成於內\n行篤敬\n行成而先\n言過其行　君子恥之\n內行　翟方進內行脩\n善行　脩身踐言謂之善行\n積行累仁\n行有枝葉\n素行\n景行　景行行止\n達行　孟子曰柳下惠不辭小官不羞汙君進不隱賢必以其道遺佚而不怨阨窮而憫與鄉人處悠悠然不忍去也曰爾爲爾我爲我雖袒裼裸裎於我側安能浼我\n徐景山通介有恒　語具節操門\n魏盧欽　著書稱徐邈曰志高行潔\n言顧行　行顧言\n士有百行\n士二其行\n儒行\n脩大行者不拘小節"},{"id":"juan8-032","source":"正文","juan":"卷第八","menu":"情性第三十一","sub_menu":null,"page":"三四六","leaf":"三十七ウ","text":"利貞者性情也　易\n懲忿　忿窒慾\n致命遂志\n吉凶以情遷　易\n愛惡相攻　而吉凶生\n情僞相感　而利害生\n習以性成　惟民生厚\n因物有遷　不忌不克\n天命之謂性　率性之謂道\n人心不同其如面焉　傳\n卞急好絜　邾莊公\n成性\n人各有性　張華答晞嗣曰人各有性長短自裁子欲爲我亦不能吾欲效子亦敗矣\n厚貌深情　莊\n人各有心\n翼奉　字少君曰知臣之術在六情十二律\n五性不相害　五行所　之性\n六情更廢興　東方性仁西方性義南方性禮北方性智\n觀情以律視性以歷　明主所宜獨自舉與人共　　露之則不神獨行則自然\n弦　西門豹情急佩韋自戒後漢范丹以性褊急亦佩韋自戒董安于性緩佩弦而自戒\n窮理盡性　以至於命\n達於情　聖人達於情遂於命\n性不可易　老子曰性不可易命不可變時不可止\n性與天道　不可得而聞也\n受性於父母　後漢高獲與世祖有舊祖曰欲善當改剛性獲曰臣受性於父母不可改遂辭之\n吟詠情性以風其上　詩序\n反情以和其志　禮\n情深而反明　禮\n性猶湍水　孟子\n性相近習相遠　語"},{"id":"juan8-033","source":"正文","juan":"卷第八","menu":"命第三十二","sub_menu":null,"page":"三四七","leaf":"三十八オ","text":"樂天知命　故不憂易\n窮理盡性　以至於命\n以聽天命　得之自是不得自是以聽天命\n不知命　無以爲君子\n五十而知天命\n與命與仁　子罕言利\n遂於命　莊子曰聖人達於性遂於命\n命不可變　見上注\n不知所以然而然得之在命　文子曰所受天之命所遭於時有其才不遇於世命也求之有道得之在命故君子能以爲善不能必受其福不忍爲非未能必免其禍故逢時進得之以義何幸之有不逢時必讓何不幸之有\n道之將行命也　道之將廢命也\n公伯寮其如命何\n列子　有力命論\n各正性命\n命可長也短長之命不知命也\n天命之謂性"},{"id":"juan8-034","source":"正文","juan":"卷第八","menu":"節操第三十三","sub_menu":null,"page":"三四七","leaf":"三十八オ","text":"風雨淒淒雞鳴喈喈　雞猶守時喻君子不改其度\n達節　子臧曰聖達節謂不守小節\n守節　次守節謂善人守其節若子臧季札之屬\n失節　子臧曰不失節雖不能聖敢失守乎季札曰雖不才願附於子臧以無失節\n不以利累形　莊子曰能尊生者不以養傷身雖貧賤不以利累形也\n屠羊說辭賞　屠羊說楚昭王出奔王反賞之說曰大王反國說亦反屠羊何賞之有\n申包胥逃賞　楚昭王反國賞申包胥包胥曰吾爲君也君既定矣又何求遂逃賞\n苦節　易曰介于石苦節不可貞也\n天地節而四時成　節以制度不傷財不害民\n虞吉有他不燕　虞安事也有事則告來他我則不安言介節也\n我心匪石　不可轉也\n我心匪席　不可卷也\n砥礪廉隅\n雖分國如錙銖　一不臣不仕視爲如此\n通介有恒　魏盧欽著書稱徐邈曰志高行潔高而不悄潔而不介聖人以清爲難而徐公所易或問曰武帝時人以爲通自涼州還京師以爲介何也答曰往者崔毛用事貴清素士人皆變易車服而徐公不改故人以爲通此來奢靡轉相放效徐公雅尚自若故前日之通乃今日之介是世人無常而徐公有常也徐邈字景山\n不可屈之色　晉庾衮有異行潁川太守以功曹命之不俟駕而往請受天下之役飾過之逵迴形益恭而有不可屈之色乃厚禮而遣之\n懍然節槩　楊惲書曰西河魏文侯之居有段干木田子方之遺風其人懍然有節槩知去就之分也\n布衣之戀　後漢孔僖曾祖子建與崔篆友善篆事王莽勸子建仕對曰吾有布衣之戀子有袞冕之志其道異矣\n非耕不食　後漢周燮有先人草廬結于岡畔下有陂田常肆勤以自給非身所耕不食也\n於陵子仲齊之巨擘　公孫丑曰陳仲豈不誠廉士哉孟子曰於齊仲子爲巨擘焉雖然仲子惡能廉以兄之祿爲不義之祿而不食以兄之室爲不義之室而不居避兄離母居於陵身織屨妻辟纑以易衣食以母則不食以妻則食豈能充其義也\n魏王褒　字偉元計口而食嘗刈菜人助之褒棄之\n不累主人　晉劉寔清身行無瑕玷常賃每憩止薪水自給不累主人\n口不言貨財手不執珠玉　崔洪口不言貨財手不執珠玉汝南王以琉璃鍾行酒與洪洪不執\n過姊飭留錢　後漢范丹字史雲候姊病姊飯之以姊夫不德乃留錢二百\n動不累高　晉嵇紹通簡有恒有識者服其遠暢而恬於榮辱自處若誠而動不累高\n不失漢節　民\n不肯乘車　東觀　有父貧爲吏識相國往省謁變姓名徒行既至數日吏不敢過爲白母出見驚曰夫人乃密呼入去賀道車送之閭拒辭不肯乘車\n步擔告歸　趙孝長平王莽時父爲田禾將軍以父任爲郎告歸常白衣步擔欲止郵亭亭長以孝爲郵卒侍之孝不告其名長不肯納因問曰聞田禾將軍子當過何時到乎曰尋卿到矣\n不食饋食　　　叔世稱高士嘗　　其子數取木實遺之受而不食也\n不受報恩金　雷義字仲公濟人死罪以金二斤謝之義不受人伺義不在默投承塵上義　月　得之其人已死無所歸乃以金送縣\n口腹不累　閔仲叔客居安邑老病家貧不能得肉日買豬肝一片屠或不肯安邑令聞勑吏常給仲叔怪而問知而歎曰閔仲叔豈以口腹累安邑耶遂去客沛壽終\n不取於人　常林字伯槐單貧自非手力不取於人\n不取死麋　晉郭文採　　　　獸殺大麋於菴側文以語人人取賣分錢與文文曰我若須此自當賣之所以相告正以不取聞者皆歎之\n不取魚貴價　任燠家貧賣魚會官受魚問價數倍輒取直而去\n贖生口　任燠嘗與人共買生口每價八千賣生口家來贖直六千口共買者欲與爾價取撥燠自乏全價\n不過從兄飯　晉閻纂至侍伯兄曰閻卿爲吏不過從兄飯有之子論曰臣少遭饑亂資不妄過人飯\n不留姊家　休直德常過姊姊爲設饌以菜參而遺不肯留\n郭翻墜刀　於水人爲　得使與其人\n不受遺　羊陽字道嗣爲安守千郡與陽家遺陽一　物陽曰羊公清　　受遺　表而還陽既無反致乃貨之以物奇還寶貝奇以爲惠而反損之豈數致\n如不清\n如玉\n如冰霜明　如雪\n計口而食　見上注"},{"id":"juan8-035","source":"正文","juan":"卷第八","menu":"高潔第三十四","sub_menu":null,"page":"三四九","leaf":"三十九オ","text":"鑑明則塵垢不汙\n神清者則嗜慾不誤\n閔損　字子騫不仕大夫不食汙君\n羞與鄉人處　孟子曰伯夷非其君不事非其民不使思與鄉人處如以朝衣朝冠而坐於塗炭也\n崔洪　口不言貨財\n王夷甫　口不言錢\n太子\n履高尚　嵇康交人接雅以荀　康薦爲師友\n嵇康　叔夜性率然高遠\n范史雲之清　後漢范冉字史雲清節閭閻里中得錢寄冀便與晏曰汝清高豈范史雲之輩而云不敢表叔子身自取之\n不曰白乎涅而不緇　語\n獨清　屈原曰舉世皆濁我"},{"id":"juan8-036","source":"正文","juan":"卷第八","menu":"脩整第三十五","sub_menu":null,"page":"三四九","leaf":"三十九オ","text":"脩身踐言　言不過辭動不過則\n意誠而後脩身　身脩而後家齊\n君子潔身而浴德\n三省吾身\n不冠不入　馬援事嫂\n遇妻子如嚴君　張湛居家嚴整\n晉王勐有風操　　　　　　　　　　之客\n居室言善　千里應之\n名教自有樂地　晉王澄等以任放爲達樂廣曰名教中自有樂地何必乃爾\n整風教　　數有　　　　之爲人厚而　　重有　　　　　　　　壓俗\n攝以威儀\n危坐　季容季信典　　　　樹下　　　　相對\n靜以脩身　　身之是忌\n默而思道　知道無爲\n盡飭　　　之教化入其　而"},{"id":"juan8-037","source":"正文","juan":"卷第八","menu":"縱逸第三十六","sub_menu":null,"page":"三五〇","leaf":"三十九ウ","text":"史丹　儻蕩無　而心謹密\n阮籍不拘禮教　字嗣宗外坦蕩而內淳至率意獨駕不由徑路車跡所窮輒慟哭而反\n王子猷訪戴　子猷居山陰夜雪霽　　　左太沖招隱詩忽憶戴安道安道時在剡即便夜乘小船就之經宿方至門不前而反人問曰乘興而來興盡而反何必見戴\n鑒　　　傳曰昔周穆王欲肆其心周行天下\n縱欲　禮欲不可縱\n入長吏　被中　謝夷邈字幼輿　　　　　　送客來　還而來　還令不在所　入令被中自　令謝之遂曰君不謝　必將陳死\n入車中　王徽之字子猷嘗從　　便汗行值雨因下馬排入車中曰公豈得獨擅一車乎\n馬曹　注見上\n不知馬　　爲桓沖騎兵參軍沖問所主何曹曰似馬曹又問馬死多少曰未知生焉知死\n不知是三公　王戎爲司徒閑乘小馬從便門出見者不知是三公故吏多至大官道路相遇輒避之\n街中走馬　張敞爲京兆尹無威儀罷朝會過走馬章臺街使御吏驅自以便面拊馬也\n逼官長飲　桓溫與謝奕舊奕爲司馬　　　　西司馬奕　　　　逼溫飲溫走入南康主門避之主曰　　　　　引溫一兵帥共飲曰失一老兵亦得何所共在\n沉酒就縱事　　　　　不責之\n探鵲鷇　王澄字平子爲荊州刺史送者傾朝見樹上鵲巢便脫衣上樹探鷇鷇反神氣蕭然旁若無人\n又\n醉卧　畢卓爲吏部郎比舍郎釀酒熟卓醉夜入其甕間盜飲酒　日得而縛之明旦看乃畢吏部也\n鄰家少婦有美色當壚沽酒籍嘗詣飲醉便臥其側既不自嫌其夫察之亦不疑\n哭丘家女　丘家女有才色未嫁而死阮籍不識其父兄徑往哭\n字其父　胡毋輔之音彥國子謙之字子光學不及父而傲縱過之酣醉常呼其父字輔之亦不介意輔之酣飲謙之　之曰彥國年老不得爲爾將令我尻背東壁輔之歡笑入子而共飲也\n八達　光逸孟祖不傳辟至蜀　輔之與謝鯤阮放畢卓羊曼桓彝阮孚散髮裸袒閉戶數日酣　逸將排戶守者不聽逸便脫衣露頭於狗竇中呼輔之驚之曰我孟祖也遽呼入飲人謂之八達"},{"id":"juan8-038","source":"正文","juan":"卷第八","menu":"風流第三十七","sub_menu":null,"page":"三五一","leaf":"四十オ","text":"庾亮登樓　晉庾亮都督江荊鎮武昌佐吏殷浩之徒乘秋月登南樓不覺亮至將起避之亮曰諸君少住老子於此興復不淺便據胡床與諸人詠謔\n謝尚泛江與袁宏譚　袁宏臨海令勗之子少孤以運自業謝尚鎮牛渚秉月與左右微服泛江會宏在舫中諷詠聲既清會又辭藻拔令問之袁臨海郎尚遂請之共與譚論\n衛王樂　晉樂廣與王衍俱宅心事外見重於時天下言風流者王樂爲首\n庾亮敬羨　亮至隔隱居樂難留白云可但曰非唯風流兼有爲政之實\n終日清譚　王衍字夷甫出補元城令終日清譚縣務亦理"},{"id":"juan8-039","source":"正文","juan":"卷第八","menu":"剛第三十八","sub_menu":null,"page":"三五一","leaf":"四十オ","text":"立地之道曰柔與剛　易\n沉潛剛克　高明柔克書\n剛亦不吐　詩人有言剛則吐之仲山甫柔亦不茹剛亦不吐不侮矜寡\n處父以剛　傳曰輿父過寡華督見之及　而　其妻問之亂曰以剛天有剛德猶子　　　　不可以剛不可以文天子不\n曰吾未見剛者　或對曰申棖子曰棖也慾焉得剛\n欲剛必以柔　淮南子曰欲剛者必以柔守之積於柔必剛積於弱必彊\n漢王嘉剛毅　天子敬之\n高獲不改性　後漢高獲與世祖有舊曰欲改性獲曰臣受性父母不可改也遂辭去之\n傳咸\n剛勁訐直　不能容人之過\n好剛不好學　其蔽也狂\n子路行行如也　剛貌\n血氣方剛\n剛彊不得死\n季布　爲柔\n虞翻　不虞剛而疏\n腸太剛　則折\n推剛\n百鍊剛\n道仁　子曰剛毅木訥近仁"},{"id":"juan8-040","source":"正文","juan":"卷第八","menu":"彊第三十九","sub_menu":null,"page":"三五一","leaf":"四十オ","text":"血氣方剛　戒之在鬭\n小人用壯　君子用罔\n不在於善　而皆在於\n剛彊者死之徒　老\n灌夫陂池田園宗族賓客　爲權利橫潁川　　　　商不避也\n官　　勢　　直謝魯　　　　主田園\n梁冀跋扈　漢書梁冀字伯卓　　　　質帝目之跋扈將軍\n南方之彊\n北方之彊\n負毦帶鈴　吳甘寧好遊俠招合輕薄少年爲之渠帥群聚相隨挾持弓弩負毦帶鈴民聞鈴聲即知是寧\n彊梁者不得其死　老子\n彊者伏弱怒聲　王\n北宮黝之養勇也　孟子\n威重於太守　寧成官居\n豪家奪吾民　說\n不能彊外\n彊恭顯任勢"},{"id":"juan8-041","source":"正文","juan":"卷第八","menu":"柔第四十","sub_menu":null,"page":"三五二","leaf":"四十ウ","text":"立地之道曰柔與剛　易\n柔克　見剛門\n柔亦不茹　人亦有言柔則茹之仲山甫柔亦不茹詩\n頤會柔而不犯　傳\n柔弱勝剛彊　老\n柔弱者生之徒　老\n能下人　易不記\n欲剛必以柔　見上\n光武柔直　光武幸南陽宴父老父老相謂曰文叔少時謹信與人不款曲唯柔直耳帝笑曰吾理天下亦柔道治天下也\n莫過於水　老子曰天下柔弱莫過於水而能攻堅彊莫之能先\n轡之柔矣　詩\n可以爲名\n繞指之柔\n舌柔\n口柔之人\n雅柔而立\n怯懦　見　門\n管仲三戰三北　鮑子不以我爲怯知我有老母也\n魏勃股慄　　　　　齊王反勃　司失火之家豈暇先言因退立股慄　　　　曰人謂魏勃勇妄庸人耳\n韓信胯下　淮陰市少年辱信曰不能死出我胯下信良久乃俛出胯下一市皆笑以爲怯\n懦力　懦力注云柔弱也\n宮之奇懦而不能彊諫　淮南王書曰越人\n立懦夫　孟子曰聞伯夷之風者懦夫有立志也\n無勇棄駒失戈　晉裴　　　　戈勒之四\n劉賢　字子\n授車下子良授太子綏而乘之曰婦人也言其懦也\n脆弱　趙廣漢云羌脆弱易敗國語\n不占失軾　事具下無勇門"},{"id":"juan8-042","source":"正文","juan":"卷第八","menu":"褊急第四十一","sub_menu":null,"page":"三五三","leaf":"四十一オ","text":"邾莊公卞急　左傳邾莊公在臺臨庭閽以瓶水沃庭公怒閽曰夷射姑旋焉執之不得滋怒自投于牀廢于爐炭爛遂卒莊公卞急故及此\n佩韋　范丹事見上注\n蠅集筆端　魏王思為司農性急常書蠅集筆端驅去復來再三思自起拔劍逐蠅不得取筆擲地踏壞之\n食雞子　王述懷祖性急常食雞子以筯刺之雞子轉於盤中不可得怒擲于地以屐齒踏之又不得怒甚於地取以齒碎之又棄於地\n公孫之亟也　晉使張骼輔躒致楚師求御於鄭鄭人使宛射犬御二子幄坐射犬於外既食而後食之乃戰射犬近不告而馳之收擒挾囚不待而出既戰二子問曰胡弗不謀曰曩者之言公孫之亟也言性急不肯受屈\n量謝芭荒　德非含垢\n忿不思難\n褊心　魏君儉嗇褊急無得而刺之\n後漢明帝褊急　嘗以事怒樂嶷以杖撞之嶷走入牀下帝急呼嶷曰天子穆穆諸侯皇皇未聞人君起撞郎帝赦而止"},{"id":"juan8-043","source":"正文","juan":"卷第八","menu":"儉第四十二","sub_menu":null,"page":"三五三","leaf":"四十一オ","text":"禮與其奢也寧儉\n以約失之者鮮矣\n去奢去泰　老子\n克儉克勤　書曰克勤于邦克儉于家\n儉則固　奢則不遜儉則固與其不遜也寧固\n物或損之而益\n德儉　而有度\n儉德　之恭\n昭其儉也\n儉固能廣\n務嗇勤分也　嗇儉\n示之以儉　曾子曰國奢則示之以儉國儉則示之以禮\n慎乃儉德\n躬儉節用　服御雅之不毛飾\n貶食省用器用\n節儉　省嗇昭節儉尚井身未反本也\n廉恥之心\n躬自菲薄　儉而不厭\n以知足為富\n居其實　大丈夫居其實不居華\n戒生之厚\n素業　清風\n貴而能貧\n節乃用足　儉為德恭\n聖人不積　君子戒盈\n人道惡盈　鬼神害盈易\n能節禮樂　不忘恭儉\n務利而避\n害　慎始而思終\n以道制欲　見得思義\n革奢俗以從儉　約澆風以反淳\n無欺暗室　神不\n黜華　去奢從儉\n從儉降身　非賢猶病\n砥礪清節　欽承素風\n宜崇清德　　奢素風\n德因儉立　名以清聞\n妾不衣帛馬不食粟　季文子卒宰庀家器為葬備無衣帛之妾無食粟之馬無藏金玉無重器備君子曰相三君矣而無私積可不謂忠也\n賓以特牲　晉亂晉侯命祈以幣更賓以特牲器用不作車服從給注云皆務儉也行之期年國乃有節\n卑宮室　晉文公為盟主宮室卑庳以崇大諸侯之館子曰禹卑宮室而盡力乎溝洫\n室不崇牆　闔閭\n妻子不入官舍　後漢王良仲子在位恭儉妻子不入官舍\n當示禮之代　自合執中\n守臨人之司　豈宜褊下\n難為繼也\n恥盈示禮　曾子曰國無道君子恥盈禮焉國奢則示之以儉國儉則示之以禮\n損之又損\n忌蟋蟀之謂何　蟋蟀詩刺晉昭公儉也\n雖則從儉去奢　有以小為貴者\n而乃失中華下　鄙乃矯是過與\n僕卑　僕卑隨類反迫下之義也禮\n矯俗　律人\n奢雖諷於蟋蟀　儉亦刺於蟋蟀\n既異建中　為下則難\n況去奢作戒\n示儉垂文　語以執中未為得也況其僭上不為奢乎\n是從以約之文　未衛儉之成\n雖激俗是稱　而相斷昧\n既非示儉之日　自招失禮之尤\n況當示禮之日　自貽過下之譏\n奢侈敗風　唯務所恐\n清儉激俗　雖矯何傷\n罷露臺　漢文帝欲作露臺計費百金帝曰百金十家之產焉用臺遂罷之\n蟋蟀　刺晉昭公之儉也不中禮故作詩以閔之\n葛屨　刺魏君儉嗇褊急而無德以將之\n堯舜儉　漢書云堯舜堂高三尺土階三等茅茨不翦採椽不斵飯土簋歠土鉶糲粢之食藜藿之羹冬日麑裘夏日葛衣其送死桐棺三寸此儉而無禮也\n用過乎儉\n【葉四十二オ・ウ　原缺】\n用九天德　不可為首\n誰敢不讓　書\n推賢讓能　書\n陽禮教讓則民不爭　周禮\n德於天　天子有善讓德於天諸侯有善歸諸天子士庶人有善本諸父母\n讓善　善則稱人過則稱己則民讓善\n大讓如慢　小讓如偽\n不爭　道塗不爭險易之利冬夏不爭陰陽之和\n讓而受惡　觴酒豆肉讓而受惡人猶犯齒\n讓而坐下　衽席之上讓而坐下人猶犯貴\n讓而就賤　朝廷之位讓而就賤人猶犯君\n能以國讓仁孰大焉　宋公疾太子茲父請目夷目夷曰云云\n范宣子讓　其下皆讓\n策其馬　孟之側後入為殿抽矢策其馬曰非敢後也馬不進也\n三以天下讓　太伯\n能以禮讓　為國乎何有\n謙受益\n棄德不讓\n韋玄成　讓遜下士遇知識步行必下從者實載送之\n王伷　有平吳功無矜滿之色\n不以名位格物　陸玩通雅不以名位格物誘納後進謙若布衣由是搢紳莫不蔭其德宇也\n劉寔　字子真以世多進趣致崇讓論也\n不以能驕人　尹翁歸\n讓德之主\n上能下競\n能以禮讓　不為禍先\n雖質而已矣　之何\n問高難對　調下易悲\n向鶴銜而自愧　　路以驚鴻\n太伯三讓　晉侯三辭\n夷齊讓國　夷齊讓所\n不讓　當仁不讓於師\n崇讓論　劉寔子真以世多進趣著崇讓論\n●謙損　附讓門\n損益盈虛與時偕行　易\n酌損\n損上益下　人說無疆\n滿招損　謙受益\n自卑而尊人\n難進易退\n曲則全窪則盈敝則新　老子\n尹翁歸　謙退不以能驕人\n慮以下人\n不自滿假　書\n裒多益寡\n●以貴下士　附讓門\n結襪　王生處士也於庭中三公九卿盡會立王生顧謂張釋之曰吾襪解廷尉為我結襪釋之跪而結之或謂王生傲也\n執轡（魏公子無忌自執轡虛左迎侯嬴嬴曰臣有友人在\n屠者朱亥也賓從怪公子久立朱亥之家公子顏色愈和\n以貴下賤大得民也　易\n降貴就卑\n貴而能降\n降心相從\n周公下白屋　吐哺不及餐食"},{"id":"juan8-044","source":"正文","juan":"卷第八","menu":"恥尚第四十六","sub_menu":null,"page":"三五八","leaf":"四十三ウ","text":"其心愧恥若撻于市　伊尹恥其君不及堯舜\n有恥且格　格正也\n恭近於禮遠恥辱也\n衣敝縕袍　與衣狐貉者立而不恥者其由也與\n不恥　惡衣惡食\n不恥縲紲　管子曰不恥縲紲恥天下之不治\n非人　孟子曰無羞惡之心非人也\n知恥　彭薛知恥\n恥之　左丘明恥之丘亦恥之\n恥躬之不逮\n坐於塗炭　孟子曰伯夷與鄉人處如朝衣朝冠坐於塗炭之上行之望望然若將浼焉浼汙也\n知恥　近乎勇\n地有餘而民不足君子恥之"},{"id":"juan8-045","source":"正文","juan":"卷第八","menu":"貞第四十七","sub_menu":null,"page":"三五八","leaf":"四十三ウ","text":"貞勝　吉凶者貞勝者也\n貞者事之幹也\n利貞　者性情也\n天地之道　貞觀者也\n日月之道　貞明者也\n公叔文子卒　公曰衛國有難夫子以其死衛寡人不亦貞乎\n送往事居偶俱無猜貞也　傳\n貞而不諒\n貞夫　天下之動貞夫一者也\n一有元良萬國以貞　一人元良萬邦以貞\n共貞　我二人共貞\n德貞　恒其德貞\n師貞丈人吉　易\n貞正也　卜貞周禮\n卜來歲之貞"},{"id":"juan8-046","source":"正文","juan":"卷第八","menu":"恭敬第四十八","sub_menu":null,"page":"三五八","leaf":"四十三ウ","text":"天道敬親　人道好謙\n敬遠　恥過\n恭寡\n能自中出　肅乎容貌\n禮由外作　儼爾威儀\n相下以卑\n起敬思恭\n德由慎立　名以恭聞\n毋不敬　禮\n事思敬　貌思恭\n居處恭　執事敬\n如祭之敬　若思之容\n出門如見大賓　使民如承大祭\n恭近於禮　遠恥辱也\n卑讓　禮之宗也\n敬可棄乎\n恭敬　德之恭也\n能敬　德必有\n恭則不侮\n慮以下人　謙也\n克恭　克讓\n為人上者　奈何不敬\n恭人　詩云戰戰兢兢溫溫恭人\n兢兢業業\n業業戒慎　慄慄危懼\n敬之敬之　命不易哉\n君子正其衣冠　尊其瞻視儼然人望而畏之\n乾乾夕惕\n貌思恭　語\n接下思恭\n貌曰恭　洪範\n自卑　君子自卑而尊人\n致敬　禮君子致敬所以免禍\n致恭　易君子致恭以存其位\n各敬爾儀\n敬爾威儀\n敬禮之輿也　傳\n勤禮　莫如致敬\n夙夜惟寅　寅敬也\n謙受益\n傴僂　恭敬\n怵惕　敬貌\n克己復禮\n撿身　恭己\n其行己也恭　子產\n讓為禮宗　敬乃德聚\n恭而無禮　子曰恭而無禮則勞慎而無禮則葸葸畏懼也\n鞠躬　入公門鞠躬如也\n踧踖　恭敬貌\n禮主於敬　行先乎恭\n理躬　禮曰致禮以理躬則莊敬莊敬則嚴儀\n子曰敬而不中禮謂之野　恭而不中禮謂之給\n文以君子之容　敬慎者仁之地也\n色莊者乎\n三命傴僂　傳正考父三命益恭故鼎銘云一命而僂再命而傴三命而俯循牆而走亦莫予敢侮\n假寐　晉趙盾將朝尚早坐而假寐鉏麑曰不忘恭敬民之主也\n循牆而走　見上注\n執轡　迎侯嬴見上注\n軾廬　魏文侯軾廬於段干木止戈於秦矣\n握髮　周公下白屋之士一飯三吐哺一沐三握髮\n昔三代明王之政　必敬其妻子也\n遇妻子若嚴君　張湛事\n萬石君恭敬　過宮闕門必下車趨見路馬必式上賜食於家必稽首俯伏而食如於上前\n終日危坐　陶侃為荊州恭而近禮終日斂膝危坐\n役人　恭儉以求役人\n卑以自牧\n敬以直內\n敬慎不敗\n天道虧盈而益謙　鬼神害盈而福謙"},{"id":"juan8-047","source":"正文","juan":"卷第八","menu":"謹第四十九","sub_menu":null,"page":"三五九","leaf":"四十四オ","text":"庸行之謹　庸常也易\n謹於事\n先王克謹天戒　書\n謹厚（丞相田千秋謹\n厚）\n全身　張安世以謹厚全身\n老謹　石慶為丞相上以老謹無能不責\n鄧通　以謹媚上\n履霜堅冰　蓋言謹也易\n謹而信　汎愛衆而親人\n子曰謹而信　有貴先哲無累後人"},{"id":"juan8-048","source":"正文","juan":"卷第八","menu":"慎第五十","sub_menu":null,"page":"三六〇","leaf":"四十四ウ","text":"敬慎不敗　易\n不自滿假　書\n涉于春冰\n兢兢　業業\n夕惕若厲\n怵惕惟厲\n怨豈在明　不見是圖\n不矜細行　終累大德\n克自抑畏\n慎而無禮則葸　葸畏懼貌\n君子無易由言　耳屬于垣\n執虛如執盈　入虛如有人\n戒慎乎　其所不覩恐懼乎其所不聞\n慎獨　莫見乎隱莫顯乎微故君子慎獨\n清不必慎　晉李緒至秦州刺史司馬景王曰為官長清慎勤上曰不得已何去曰慎為大清者不必慎慎者不必清\n石慶數馬　石慶為太僕御出上問車中幾馬慶以策數馬畢舉手曰六馬慎如此也慶於兄弟中最為簡\n君子思患而預防之\n可不慎乎　言行君子之樞機也\n繫于苞桑　其亡其亡云云易\n奔車之上無仲尼　覆車之下無伯夷淮南子\n慎微　董仲舒云盡小者大慎微者著\n宿衛忠慎　魏許褚字仲康為武衛中郎曹仁自荊州來朝謁太祖未出於殿外召褚便坐語褚辭天子將出還入殿人問之褚曰彼雖貴外藩也入室語何私乎祖聞善之\n謝絕知友　吏趙禹為人廉倨為吏已來舍無食客公卿相造請禹終不報務在絕知友賓客之請孤行一意而已\n惟精惟微　不可不察\n死生在天　善敗由己\n行不三思　還同捨魯之役\n智乘百慮　類虜謂秦之譏\n位不可不慎乎　一失其位不得列於諸侯況其下乎\n慎言語　節飲食\n執輕如不克　克勝也禮\n慎於行"},{"id":"juan8-049","source":"正文","juan":"卷第八","menu":"慎第五十","sub_menu":"〇慎密　附慎門","page":"三六〇","leaf":"四十四ウ","text":"君子慎密不出也\n君不密則失臣　臣不密則失身幾事不密則害成\n慎以避禍\n不言溫樹（孔光守法度循故事\n上有所問據經對時有所上言輒削草藁典樞密歸家燕語不及朝省事或問溫室樹何木光對以他事）\n不畏慎　後漢陳寵為尚書性周密常稱人臣若不畏慎在樞密拒絕親友\n壞本　任放為黃門侍郎每納忠言輒手壞其本\n有智防　魏荀攸謀密自從太祖征伐有智防謀帷幄時人子弟莫知所言\n焚草　羊祜叔子與樞要嘉謀讜議皆焚其草\n決已輒病　張安世職樞機以謹慎周密自著每定大政已輒病莫敢出聞有詔令乃驚使吏之丞相府問焉朝廷大臣莫知其預議\n毀草　樊宏所上便宜及言得失輒手自書寫毀削草本公朝訪逮不敢對衆\n小吏為密　楊阜義山為將作大匠欲上疏省宮人不見幸者召御府吏問後宮人數吏守舊令曰禁密不得宣露阜怒杖吏一百數之曰國家不與九卿密乃與小吏為密乎帝聞敬憚之"},{"id":"juan8-050","source":"正文","juan":"卷第八","menu":"慎第五十","sub_menu":"〇慎終　附慎門","page":"三六一","leaf":"四十五オ","text":"知終　易曰知終終之可與存義也\n乃終有慶\n伊訓曰其後嗣王罔克有終\n相亦罔終\n無初有終\n慎始　敬終\n靡不有初　鮮克有終\n終之實難\n半塗而廢　君子遵道而行半塗而廢吾不能已矣\n君子之道　思其始也思其終也\n慎終如始\n慎終追遠　民德歸厚矣"},{"id":"juan8-051","source":"正文","juan":"卷第八","menu":"慎第五十","sub_menu":"〇鑒戒　附慎門","page":"三六一","leaf":"四十五オ","text":"終日乾乾夕惕若厲　易\n視履考祥\n君子安不忘危　存不忘亡治不忘亂\n人無水鑒　當於民鑒\n鑒于后羿　殷鑒不遠在夏后之世鑒于后羿而用德度\n宜鑒于殷　鑒明則塵垢不止\n亡國之社　喪國立亡國之社以為鑒戒\n雖休勿休　日慎一日\n諸臣不佞　晉入楚軍三日館穀范文子立於戎馬之前曰君幼弱諸臣不佞何以及此君其戒之\n中之惆戒\n小懲　大戒"},{"id":"juan8-052","source":"正文","juan":"卷第八","menu":"傲慢第五十一","sub_menu":null,"page":"三六一","leaf":"四十五オ","text":"天命祐敬　人道惡盈\n禮不長傲　神亦害盈\n傲很威儀　而驕近亂\n傲不可長　禮記\n無怠無荒\n自暇自逸\n或敢侮予\n何以卑我　傳\n彼皆偃蹇　驕放之貌\n使驕\n且吝　其餘不足觀也已"},{"id":"juan8-053","source":"正文","juan":"卷第八","menu":"傲慢第五十一","sub_menu":"〇驕 附傲慢門","page":"三六二","leaf":"四十五ウ","text":"君子泰而不驕\n不仁者　不可以長處樂\n自廣　自滿\n直而不倨　倨傲也\n敬親者　不敢慢於人\n立無跛　跛不敬也跛音祕\n坐無箕　箕踞不敬也\n荒怠傲　慢\n安肆曰偷　偷苟且也肆恣也\n忘僂傴之恭　肆倨蹇之傲\n滿招損　謙受益\n志自滿\n無傲從康　荒怠不敬\n乃逸乃岸　敖岸也\n位不期驕\n不敬　則何以承守其官位\n燕褻威儀　何禮之拘\n倨見長者\n夷俟　夷倨也俟待也\n敬乃行先　傲為禍胎\n斯須不敬　致禮以理躬則莊敬莊敬則威嚴故外貌斯須不莊不敬則慢易之心入矣\n失恭與義　信義苟而行之\n既吝且驕\n執幣　越椒來聘執幣傲叔仲惠伯曰必滅若敖其先君神不福也\n獻俘　原叔獻俘于王不敬劉康公曰不及十年矣必有大咎天奪之魄矣\n取禍　莒成叔傲甯子甯子曰取禍之道\n怠位　滕成公來會葬甚哀多涕子服惠伯曰怠於其位而哀已甚兆於死所矣\n受玉惰　天王賜晉惠公命受玉惰召公曰晉侯且無後乎元自弃也\n弃命　郤錡來乞師將來不敬孟獻子曰弃君命也不亡何待\n受脤　成肅公將伐秦受脤於社不敬劉子曰能者養威儀以取福不能者敗以取禍今成子惰其不反乎\n富而不驕者鮮矣　驕而不亡者未之有也\n戍也驕其亡乎　公叔戍\n汲黯性倨少禮　長揖衛青\n申腳局下　晉王武子與晉帝棊伸腳局下問孫皓曰何以剝人面皮皓曰見無禮於君者則剝也\n唐突諸侯　魏宣子景懋常步入宮見植使問何官宣曰丞相軍謀掾也植曰應得唐突列侯否宣曰王人雖微列在諸侯之上植復曰為人父夷見其子應禮否宣曰臣子之例一也\n箕踞　郭解出入人皆避有一人獨箕其倨視之解問其名客欲殺之解曰居邑之不見敬是吾德不修\n陵長吏　甯成為小吏必陵長吏郅都為濟南守成為都尉直陵都出其上也\n倨見長者（酈食其謁沛公曰方欲圖天下不宜\n倨見長者）\n●狂 附傲慢門\n楚狂接輿歌而過孔子\n清狂不惠　晉宣時山陽太守曰昌邑王賀清狂不惠\n狂簡斐然成章　孔子在陳曰歸與歸與吾黨之小子狂簡斐然成章不知所以裁之\n狂生　酈食其家貧落　無衣食業為監門吏皆謂狂生\n佯狂為巫　蒯通說韓信貳於沛公三分天下信不用其言乃佯狂為巫\n古之狂也肆　肆極意敢言也\n今之狂也蕩　無所據也\n一國之人皆若狂\n狂狷　狂者進取\n後漢仲長統　倜儻不務小節語默無常人謂之狂生\n太公云大智似狂\n不顛不狂其名不章　陳平\n飲人狂藥\n騁馳畋獵令人心發狂　老子\n文子　姓辛氏狀　如不足而　學多聞\n狂夫"},{"id":"juan8-054","source":"正文","juan":"卷第八","menu":"勇第五十二","sub_menu":null,"page":"三六三","leaf":"四十六オ","text":"節因危見　名以勇聞\n達德　智仁勇三者天下之達德\n勇者不懼\n用人之勇　去其怒\n仁者不必有勇　勇者不必有仁\n率義之謂勇\n見義不為無勇也\n威而不猛\n雖猛何為\n勇而無禮則亂\n致身事上　見危致命\n好勇而不好學　其蔽也亂\n禮所貴於勇敢者　貴其能行禮義也故勇敢強有力者天下無事則用之於禮義天下有事則用之於戰勝用於戰勝則無敵用於禮義則順理外無敵內順理此之謂盛德故聖王之貴勇敢強有力如此也　不用於禮義戰勝而用於爭鬭則謂亂人刑罰行於國所誅者亂人也\n勇而不中禮謂之逆\n君子尚勇乎　君子有勇而無義為亂小人有勇而無義為盜\n君子惡勇而無禮者\n子貢惡不遜以為勇者　遜順也\n勇爵　設爵位以命勇士也傳曰齊莊公為勇爵殖綽郭最欲與焉州綽曰臣平陰之役先二子鳴　　　於　子\n期死　期必也不顧義理趨於死也\n佚用之謂勇　佚上之用\n勇則害上　不登明堂死而不義非勇也\n勇\n不作亂\n拳勇　管子曰鄉人有拳勇股肱之力筋骨秀出於衆者有司告有而不告謂之蔽才\n勇夫　仡仡勇夫射御不違我尚不欲\n陵\n銳敢　精勇\n是無勇也\n忘家　忘身\n一夫之防　萬人之敵\n勇者　若怯\n謂勇力之士時使　晉侯使荀賓為右\n如虎如貔\n桓桓\n赳赳\n容氣　非真勇也\n素厲　無勇　　陵厲\n毛遂之氣　　然出三千\n冥僚之才　可當五百\n內亂不與　外患不救\n我武惟揚\n仡仡勇\n勇於敢　則殺一何壯也\n臨事而屢斷　勇也\n白刃可蹈\n佽飛之官以斬蛟　楚有佽非　　　　　　　　乃斬之楚王\n刺兩虎　子曰卞莊子之勇可謂成人矣謂刺兩虎\n賈餘勇　齊高固入晉師桀石以投人以俘衆曰欲勇者賈子餘勇\n帶布　主人懸布堇父登之及堞而絕之蘇而復上者三主人辭焉帶其斷布以徇於軍三日\n嗇禍　子產曰小人之性釁於勇嗇於禍以足其性而求名焉者非國家之利也\n子曰由也好勇過我\n賈餘　注見上\n奪志　匹夫不可奪志\n動心　孟子曰我四十不動心弟子曰若是則夫子過孟賁遠矣\n眥張血迸　朱亥\n髮植衝冠　藺相如\n擐甲執兵　鉏\n斬龍　澹臺滅明字子羽齎璧渡江刃投　斬\n咀彘飲卮　樊噲之\n持璧睨柱　藺相如之\n子路曰　子之纓　執　由也能之　　　曰勇\n由之勇賢於丘\n無拳無勇　詩\n州綽乃欒氏之勇　郭最為齊　氏之雄\n相如進缶以擊秦　澠池之會\n毛遂捧盤而盟楚　遂按劍歷階捧銅盤而跪令楚王歃血而盟\n好勇　大叔多材而好勇\n袒裼暴虎　詩\n行行　子路行行如也子曰由也不得其死然行行剛強也\n義勇冠三軍　李陵李廣\n斬蛟（晉郄邈渡水有\n蛟為人害邈拔劍入水　　截蛟數段而出也）\n拔虎尾前　桓石虔從父在荊州於圍中見猛獸被數箭諸將戲令拔之石虔往拔箭虎跳石虔亦跳高於獸獸伏又拔一箭而歸\n刺虎　上召李廣孫禹使刺虎懸下圈中未至地有詔出之禹從落中以劍斫絕累欲刺虎上壯之遂止焉\n好勇疾貧亂也\n好勇過我\n是子之勇也\n有勇　且知方也\n以賢　智勇\n●無勇 附勇門\n是無勇也　何以知其　之\n素厲容氣　並見上注\n非夫　　夫也\n不武\n臨事而懼\n戰陣無勇　非孝也\n無拳無勇　拳力也\n末之卜也　末微也言其無勇而已\n不占失軾　若有作亂陳不占將往食則失匕赴車則失軾比至門聞戰鬭之聲於門外懼而死\n蒯聵投車　衛太子蒯聵與趙鞅戰　見鄭師懼而自投車下子良授之而乘之曰婦人也\n趙羅之痁作　　　之役趙羅無勇麇之吏詰之御曰痁作而伏　東之丘\n淺為丈夫　傳\n畏威若怯　怯勇者若怯也\n違彊陵弱　非勇也\n威揚\n奪氣\n有命出征　不畏　勤\n無剛嘗寇　先犯寇許\n懦夫　懦弱也\n宮之奇　為人懦\n勇於不敢則活　老子\n勇可習　魏九州春秋曰魏末攻西州州長杜子　守城時柏谷　長在城中聞兵勢恐入室之舍被覆其頭不出明日出面　二日出問消息四五日　　　　　子　曰勇可習者也"},{"id":"juan8-055","source":"正文","juan":"卷第八","menu":"壯第五十三","sub_menu":null,"page":"三六五","leaf":"四十七オ","text":"孔武有力\n有力如虎\n筋骨秀出　注見上\n蔽才　管子曰　有拳勇股肱之力筋骨秀出於衆者則以告有司有而不告謂之蔽才蔽才有罪也\n勇力時使　晉悼公使荀賓為右司士屬焉使訓勇力之士時使\n壯有所用　禮\n仡仡勇夫　仡仡壯勇貌\n方剛　及其壯也血氣方剛戒之在鬭\n百夫之防　之特\n壯\n勝人有力　自勝\n用於戰勝　注見上\n萬夫之敵\n一人不務仁　　　皆\n學長戟於殺門（行\n健也）\n●壯士 附壯門\n角力　壯士角力量其力也\n論力　　　力也\n言屬股肱　以示其\n言出其膂　力也\n小人用壯\n投蓋　注見上\n桀石　齊高固入晉軍桀石以投人\n建大車　狄虒彌建大車之輪而蒙之以甲以為櫓左執之右拔戟以成一隊孟獻子曰有力如虎\n抉懸門　　　紇抉之以出門\n手擒熊羆　三\n挾輈　公孫閼與潁考叔爭車考叔挾輈以走\n六鈞　顏高之弓六鈞鈞三百斤\n七札　養由基蹲甲而射之徹七札\n負舟　莊子曰藏舟於壑自以為固夜半有力者負之以趨昧者不知也\n拔山　項羽歌曰力拔山兮氣蓋世\n扛鼎　烏獲扛鼎舉千鈞\n拔距　甘延壽投石拔距絕於等倫\n拔木　　　多力曰拔木九牛楚辭曰一夫九首拔木九千\n盪舟　奡能陸地行舟\n項　羽力能扛鼎才氣過人\n曳牛　　　　　　　　之以牛與　　力以手　　牛　行百餘步　不敢　牛而走\n力巨舒鉤\n索鐵　舒　能也\n●不尚力 附壯門\n子不語怪力亂神　四者無益於教化\n驥不稱其力　而稱其德\n恃力者亡\n無所用之雖壯奚為\n羿善射奡盪舟　俱不得其死\n自勝者彊\n柔弱勝剛彊\n彊梁者不得其死　老子\n拔山而怒見自亡　盪舟而不得其死\n白氏六帖事類集卷第八"},{"id":"toc-juan9","source":"卷九總目","juan":"卷第九","menu":"卷第九總目","sub_menu":null,"page":"五","leaf":"一オ","text":"白氏六帖事類集卷第九　本卷總目（共 41 門）\n言語第一　慎言　利口　失言　辯　游說　誹謗\n博物二\n隱語三\n訥四　吃附\n口齒五\n心第六\n視七　目附\n聽八　耳附\n面第九\n胷第十\n手十一\n臂十二\n脣十三\n足十四\n眉十五\n鼻十六\n鬚十七\n律呂十八\n刻漏十九\n方術二十\n卜筮二十一　卜龜　婚姻　筮仕　賣卜　卜筮官　卜怪　卜失　不卜附\n相二十二　吉相　凶相\n占候二十三\n祈禳二十四\n忌諱二十五\n書二十六　五者書附\n圖畫二十七\n執馭二十八\n醫二十九\n藥三十\n疾三十一　疾疫附\n瞽三十二\n獸醫三十三\n巫三十四\n投壺三十五\n博碁三十六　雜博\n彈碁三十七\n賭三十八\n筭三十九\n射覆四十\n雜技四十一"},{"id":"juan9-000","source":"正文","juan":"卷第九","menu":"言語第一","sub_menu":null,"page":"五","leaf":"一オ","text":"言語有章\n發言爲詩\n言之無文　行之不遠\n言以足志　不言誰知其志足成\n好言自口\n言必有中\n非禮勿言\n哿矣能言　巧言如流俾躬處休\n不厭　公叔文子時然後言人不厭其言\n言中倫　慮柳下惠\n思忠　君子有九思言思忠\n無瑕　善言無瑕謫\n千里應之　君子居其室出其言善則千里之外應之\n宰我子貢　科言語\n作乂　洪範二曰言言曰從從作乂\n立言　太上立德其次立言立言謂身沒立言於世\n身文　介子推曰言身之文\n有徵　叔向曰君子之言信而有徵故遠怨於其身\n子產有辭　叔向曰辭之不可已也如是夫子產有辭諸侯賴之若之何釋辭\n晏子一言　君子仁人之言其利博哉晏子一言而齊侯省刑也\n輯矣　輯睦也詩曰辭之輯矣\n一言而善　傳曰叔向適鄭鬷蔑惡立於堂下一言而善叔向聞之曰必鬷明也執其手以上曰子若不言吾幾失子矣\n恥之　居其位無其言君子恥之\n大辯若訥　巧言如流\n雖文子之賢　吶吶則聞\n而仲尼之聖　且貴便便\n文以君子之辭　禮\n加人　言出乎身加乎人也\n口實　以台爲口實\n惟口　起羞\n出好興戎\n有章　出言有章\n大言小言　事君大言入則望大利小言入則望小利\n穆穆皇皇　言語之美\n君子約言　小人先言\n不以言舉人　不以人廢言君子也\n法語之言　能無從乎\n請事斯語\n辭達　而已矣\n在耳之言\n吐嘉言如木屑　王澄與人書胡母輔之字彥國曰吐嘉言如木屑霏霏不絕誠爲後進領袖\n清言理服\n言譚林藪　樂廣嘗與裴頠清言欲以理服之而頠爲言談之林藪\n鄙小子之狂簡　竊先生之餘論\n我求懿德　爾有嘉謀\n當喻以正義　豈移於浮辭\n雖嘉言可聽　而國章難廢\n懷璧興詠　鑠金垂範\n庶遵季布之諾　宜符周任之言\n其容不改　斯言有章\n一言興邦　片言折獄\n戒在三緘　應其千里\n戢言\n納言\n訥於言　而敏於行\n同心之言　其臭如蘭\n貌言　華也\n至言　實也\n苦言　藥也\n甘言　疾也\n言忠信\n孟子之知言　詖辭知其所蔽淫辭知其所陷邪辭知其所離遁辭知其所窮\n○慎言　附言門\n古者言之不出　恥躬之不逮\n君子欲訥\n於言\n三復　南容三復白珪\n得無訒乎　子曰仁者其言也訒曰爲之難言得無訒乎\n駟不及舌　子貢曰\n耳屬于垣　君子無易由言耳屬于垣\n過行　君子恥其言而過其行也\n天何言哉　子曰予欲無言\n一言　君子一言以爲智一言以爲不知言不可不慎也\n吶吶　如悅反小貌也趙文子其言吶吶然不出諸口\n安定辭　審言語也\n桃李雖默　下自成蹊\n鸚鵡能言不離飛鳥　猩猩能語不離禽獸\n口容止　不妄動\n易出難悔　言易以溺人不可不慎也\n鉗口　結舌\n大辯若訥\n言行君子之樞機　樞機之發榮辱之主\n含鋒　吉人之辭寡若含鋒刃不妄動也\n慎辭　叔向曰晉爲伯鄭入陳非文辭不爲功慎辭也\n懲如簧之言　之辯緘若訥\n苟不戒於三緘　則必違於千里\n在朝廷之內　雖貴便便\n於鄉黨之中　則宜吶吶\n出口　文子如不出口\n似不能言\n言顧行　行顧言\n既三思而後行　亦一言而爲智\n亂階　亂之所由生也則言語以爲階\n慎乃出話\n賜不幸而言中　孔子云是使賜多言也\n周廟三緘　金人\n管子曰吾畏事不敢事畏言不爲言故如老吃　行年六十如老吃也\n利口　附言語門\n以言取人　失之宰我\n口給　子曰禦人以口給屢憎於人焉用佞也\n巧言如簧　顏之厚矣\n避辯士之舌端\n惡夫佞者　子曰是故惡夫佞者\n有言者　不必有德\n惡利口之覆邦家者\n不辭費　有言無實費也禮\n恥之　有其言無其行君子恥之\n溺口　子曰君子溺於口注云言如溺水不能自治\n口費而煩　言數煩也\n舌在　張儀舌在足矣\n多言數窮　不如守中\n喋喋　利口\n婦有長舌　維厲之階詩\n美言不信　信言不美老子\n躁人之辭\n多\n脣舌　樓君卿之脣舌\n亂政　書曰吾罔以辯言亂舊政\n亂官　書無以利口亂厥官\n利口惟賢　書\n截截　書曰截截善諞言俾君子易辭諞音辯\n屢中　子貢曰億則屢中\n不思若訥　徒務如流\n巧言亂德\n言訒辭煩\n給奪慈仁　子曰給奪慈仁奪亂也言給辯亂慈仁之德\n辭有枝葉　天下無道則辭有枝葉枝葉浮華之言\n口惠　禮口惠而實不至怨菑及其身\n奪人尚口　易曰尚口乃窮也\n騰口　說也\n裨竈多言　豈不或中\n搖脣鼓舌　莊子\n緩頰　漢王謂酈食其曰緩頰說魏王豹謂徐言引喻\n嗇夫利口捷給　張釋之言虎圈嗇夫"},{"id":"juan9-001","source":"正文","juan":"卷第九","menu":"言語第一","sub_menu":"（續）","page":"八","leaf":"二ウ","text":"口諧　東方朔\n響應無窮　虎圈嗇夫代尉對文帝\n○失言　附言語門\n智者不失言\n起羞　惟口起羞書\n口不道忠信之言爲嚚　左傳曰\n口過　言滿天下無口過\n莠言自口\n哀哉不能言　匪舌是出唯躬是瘁\n效夷言　衛侯效夷言子之曰君其死於夷乎說其言從之固矣\n失口　君子不失口於人\n千里違之　易曰君子居其室出其言不善則千里之外違之\n榮辱之主　易曰樞機之發言\n無徵　叔向言曰小人之言僭而無徵故怨咎及之\n僭言\n徐言　單子會韓子于戚視下而言徐叔向曰單子其死乎\n唯口起羞　俾躬自瘁\n屢中之能　雖聞子貢\n數窮之戒　然見老聃\n多言數窮　失辭獲戾\n失言　不可與言而與之言失言\n其言糞土也　謂衛生之虛\n上漏其言　下失其臣\n智伯失灌水之言　魏有斷舌之戒\n○辯　附言語門\n舌端　君子避辯士之舌端\n口給　給捷也\n却秦軍　魯仲連譚笑而解圍\n下齊國　酈食其掉三寸之舌下齊國七十餘城\n說楚　　子\n絕秦　呂相\n雖子貢之言　億則屢中\n而老聃之戒　多以數窮\n折天口\n舌在　張儀\n宰貢之\n言　蘇張之說\n碧雞之辯　莊子\n白馬之論　公孫龍\n辯囿　文選\n辯堅合異　辯也\n劇譚\n勝言　辯而不依禮義曰勝言\n折角　五鹿岳岳朱雲折其角\n杜口　齊有辯士田巴於狙丘稷下毀五帝罪三王一日伏千人有魯連子謂巴曰先生之言似梟鳴者惡之也巴乃終身杜口不復敢言\n服人之口　莊子曰服人之口不能服人之心乎\n害義　家語曰小辯害義小言破道\n蘇秦陳六雄之利害以排秦　六國合從也\n子貢一變五國之興衰以存魯　存魯亂齊破吳彊晉霸越十年之中五國之變子貢之辯\n彈射不窮　尚排\n辯哉　家語子貢曰賜願齊楚之合戰賜著縞衣白冠陳說其間利害使二國釋患唯賜能之子曰辯哉\n矯尾厲角　鬼谷先生曰蘇秦張儀一體也然其矯尾厲角合也縱橫張儀不如蘇秦是能分人主之地也\n送金　蘇秦抵掌而譚李兌送黃金百溢\n賜璧　虞卿躡蹻而說趙王賜白璧一雙\n解連環之璧　子文\n喋喋利口　截截諞言\n惟可\n矣\n利亦博哉　未可釋辭所宜從志\n辭有枝葉　禮\n美言可以市\n堅白　趙人公孫龍爲堅白之譚玄黃所以爲白堅所以爲利\n一拜一起未足爲勞　蜀伊籍使吳入拜孫權權曰勞事無道之君乎籍應聲曰一拜一起未足爲勞\n宏辯陸賈　辯有口\n抵掌\n河注　泉涌\n懸河之辯\n宰予子貢蘇秦張儀范雎蔡澤莊周公孫龍惠施桓袁十人皆辯士也\n騁黃馬之劇譚　騁碧雞之雄辭\n○游說　附言語門\n縱橫之術\n合縱連衡　蘇秦張儀縱橫從使馳說之士無所開其口\n虞卿說趙　虞卿游說之士也躡蹻檐簦說趙孝成王一見賜金百溢白璧一雙再見命爲上卿簦長柄笠\n緩頰　注見上\n掉舌　蒯通曰酈食其伏軾掉三寸舌下齊七十餘城矣\n立譚\n長短術\n主父偃學長短縱橫之術\n以口舌得官　婁敬\n開說\n語塞　行\n語不辯\n說得其當　志行不苟合其在平原\n客\n黥布受戮　無收朱建之謀\n韓信伏誅　不用蒯通之說\n否臧於仁　利言於己\n樞機之理　榮辱在茲\n迷其邦國　建以功名\n長短術　主父偃學長短縱橫之術\n說煒燁而譎誑　文選\n甘言誘我\n甘辭　予以甘辭說子爲盜跖責仲尼\n○誹謗　附言語門\n謗議\n庶人謗\n弭謗　國語曰厲王虐國人謗王王使衛巫監謗以告而殺之國人莫敢言於道路以目王曰吾能弭謗\n口語致罪　書\n虞謗讟　傳曰君無謗讟\n宮室崇謗讟並作　傳\n腹心非謗\n理君父謗　鍾毓爲廷尉聽君父已沒臣子得爲理謗\n下獄　毛玠孝友人有云見黥面妻沒入官者玠曰天不雨蓋此也太祖聞怒收玠下獄廷尉鍾繇詰曰自古有黥面墨　下獄遂黜免\n受誅　孔融以對孫權使有誹謗之言坐棄於市\n彼有人焉　謀於長者\n人胥效矣　我無是乎\n去自安之術　之計\n蜮蠍族\n聲聞于外\n信不由中\n利口覆邦\n巧言亂德\n九歌專屈原之情　五噫寫梁鴻之恨\n彼譖人者　能無投乎\n惟君子乃能　非聖人之教\n殺其管叔　鴟鴞\n見賊於閔於周公　公孫誹謗\n用貫於玉石失真　卞和泣矣\n驚驥驁駕馬　伯樂之妬\n居下訕上　君子惡之\n誹謗之木"},{"id":"juan9-002","source":"正文","juan":"卷第九","menu":"博物第二","sub_menu":null,"page":"一〇","leaf":"三ウ","text":"博物君子　晉侯謂子產云\n彊識　記曰博聞彊識而讓善讓者明之君子\n多識　侍晉中王濮博物多識\n指掌　張華　武曰張華博物指掌之內帝問\n顯節陵中策　嵩高山之下有人得簡一枚上有兩行科斗書愛事開束晳晳曰此漢明帝顯節陵中策文驗之果然也\n識亡三篋　　　　　　書上幸河東亡書三篋問　　　　　張安世字少孺識　　　　　　　　　　　　　奇之擢拜尚書郎\n龍肉鮓　陸機詣張華華發器曰此龍肉也賓客未信華曰以苦酒漬之必有異漬酒五色光起機反問鮓主主曰茅積下得白魚質狀殊常作鮓美故相獻也\n蛇化爲雉　武庫封閉甚密忽有雉華張華曰此蛇化爲之開視雉側果有蛇蛻也\n桐材擊石鼓　吳郡臨平山岸崩出一石鼓槌之無聲帝問張華華曰取蜀中桐材刻爲魚形扣之則鳴矣如其言果聲聞數里\n孔子識土怪　羵羊\n辨防風骨"},{"id":"juan9-003","source":"正文","juan":"卷第九","menu":"隱語第三","sub_menu":null,"page":"一一","leaf":"四オ","text":"廋辭　國語范文子曰有秦客廋辭於朝大夫不知也吾得其三焉武子怒曰童子三掩人於朝以杖擊之折其委笄廋辭謂作隱語也\n庚癸　吳申叔儀乞糧於魯公孫有山有山曰若登首山以呼曰庚癸乎則諾注云西方主穀癸主水軍中不敢出糧故爲隱語\n麥麴芎窮　楚申叔展問還無社曰有麥麴乎有山芎窮乎注二物可以禦濕欲使無社逃難於泥中\n郭舍人　諧隱\n東方朔隱語　漢書\n黃絹幼婦外孫齏臼"},{"id":"juan9-004","source":"正文","juan":"卷第九","menu":"訥第四　吃附","sub_menu":null,"page":"一一","leaf":"四オ","text":"吉人寡辭　易\n吶吶　見慎言注\n剛毅木訥近仁\n君子欲訥於言\n周勃張相　二人言事未嘗出口\n訥口　李廣訥口少言\n口吃　揚雄口吃不能劇談\n質厚　吳隱字子顏質厚少文造次不能以辭自達\n口訥心辯　劉　云\n有珪璋之質　樂　稱宗\n鄧艾口吃　常稱艾艾晉帝戲艾曰艾艾爲是幾艾答曰鳳兮鳳兮是一鳳\n期期不奉詔　周昌剛直而口吃高祖欲廢太子立趙王昌曰臣期期不奉詔\n魯恭王餘　季年好音樂口吃言吳志\n司馬相如　口吃而善著書"},{"id":"juan9-005","source":"正文","juan":"卷第九","menu":"口齒第五","sub_menu":null,"page":"一一","leaf":"四オ","text":"脣亡齒寒　諺曰輔車相依云\n舌在　張儀開口示妻曰舌在足矣\n口爽　老子曰五味令人口爽\n折齒　齊景公爲孺子牛而折其齒\n編貝　東方朔曰臣齒如編貝\n瓠犀　詩曰齒如瓠犀\n嚌嘖　傳曰東郭書嘖嘖　也嘖讀爲上下相嚌也\n口容止　不妄言也\n見齒　高子皐執親之喪泣血三年未嘗見齒\n齒使人　禮\n拉齒　魏齊笞范雎折脅摺齒拉音臘合反\n皓齒　文選\n沒齒　管仲奪伯氏駢邑三百飯疏食沒齒無怨言\n杜口　畏敬以口舌侍市\n張儀掉三寸舌\n匪舌是出\n徒以口舌　藺相如\n忠言不避截舌\n截翕其舌也　翕合\n駟不及舌\n莫捫朕舌\n婦有長舌\n口呿而不合舌舉而不下　莊子云公孫龍\n乳臭　漢書食其　豎子　問曰魏大將誰也曰柏直曰是口尚乳臭\n含香　應劭漢官儀侍中年老口臭帝賜雞舌香含之\n口方　禮記是子口方\n杜恕體論曰　　　之　其上在於不言其文莫如寡辭　　曰使口如鼻至老不失\n周生烈曰　口者言之門舌者言之機齒有辱之台也故子貢曰駟不及舌\n三緘其口　家語孔子入太廟階有金人焉三緘其口\n防人之口若防大川　大川潰所犯傷人必多子產云\n孝經鉤命決曰　　　　　口言\n淮南子曰　趙襄子攻智伯　　　　　　人　　其齒以易其\n齒化爲石　神仙傳　　　月三　歲\n異物志曰　西屠夫在海中以草漆齒及黑勝白\n張蒼無齒　漢書　　唯飲乳百餘歲卒\n夜生　晉書成帝杜皇后少有姿色長猶無齒有來聘者輒中止及帝納采一夜齒盡生\n溫嶠　先有齒疾拔之中風而卒"},{"id":"juan9-006","source":"正文","juan":"卷第九","menu":"心第六","sub_menu":null,"page":"一二","leaf":"四ウ","tex
