儒有委之以貨財見利不虧其義\n稱其貞白　古人\n常聞於告以矯誣　今見或者\n砥礪清白　素風\n冠冕榮身　絜己冰霜\n清德　素識\n不受金馬　使馬如羊不入廄使金如粟不入懷張奐爲屬國都尉\n布烏帳　謝尚仁祖爲江夏令祖府以布四十匹爲尚造烏布帳尚壞之以爲軍士襦袴\n楊秉三不惑　酒色財也爲兗豫州刺史曰受\n四知　楊震遷荊州過昌\n而受　王密為昌邑令懷金遺震震曰暮夜無知者震曰天知神知子知我知何謂無知密慚而退\n怒亥千遺其子果　後漢張　　見監門注\n戒子勿受官屬送遺　漢歐陽地餘為少府戒子曰我死官屬即送遺汝慎勿受之"},{"id":"juan12-005","source":"正文","juan":"卷第十二","menu":"貪濁第六","sub_menu":null,"page":"一二二","leaf":"二十六ウ","text":"事具刑部贓賄門注\n以賄成賄賂公行作法於貪貪以敗官為墨坐贓行險受賂　張武為郎中令受賂文帝賜錢以愧其心\n行賂　陶朱公仲男殺人於楚朱公使長子以千金賂莊生公以免\n苟得貪泉　注見上\n令自為計　薛宣字贛君為馮翊高陵令楊湛為櫟陽令謝游皆貪猾不遜宣得其罪臧察湛有改節敬宣之意乃手自牒書條其贓與湛令自圖進退湛即時解印綬為記謝宣而去謝游恃名儒輕宣宣獨移書顯責之游亦解印而去\n請賜錢　皇甫嵩義真為冀州牧吏有罪受賂者嵩更賜錢　愧或至自殺\n不罪　吳祐字季英為膠東相嗇夫孫性受賦布衣與父父曰君如此何忍欺促歸罪祐曰觀過知仁使歸其父還以衣賜之\n貪利而無厭予求不汝疵瑕　楚文王謂申侯也\n汙吏"},{"id":"juan12-006","source":"正文","juan":"卷第十二","menu":"公政第七","sub_menu":null,"page":"一二二","leaf":"二十六ウ","text":"守政至公未嘗至於偃之室　子游曰有澹臺滅明者非公事未嘗至於偃之室\n不賞私勞　不伐私怨\n中立不倚我心匪石　不可轉也\n我心匪席　不可卷也\n不曰堅乎磨而不磷不曰白乎涅而不緇　語\n抱公滅私　尹翁歸\n不受謝　漢張安世嘗有薦士來謝安世大恨之而不為通\n又　晉羊祜字叔子不受私謝拜官公庭謝恩私室也\n不可干以私　尹翁歸拜東海太守辭廷尉于定國定國家在東海欲屬託邑子兩人令坐後堂與翁歸語終日不敢見邑子既去曰此賢不可干以私也\n朱邑亦不可交以私\n祁奚　舉解狐其讎也左傳\n又　後漢橋玄與陳琳有隙及在公位薦球為廷尉\n不謝恩　祁奚請免叔向叔向既免不謝祁奚亦不見叔向明為公也\n又　後漢范滂字孟博嘗繫獄尚書霍諝理之出而不謝人問之滂引叔向祁奚\n之義也\n免讎　後漢蓋勳初為漢陽長史時武威太守貪橫從事蘇正和按致之涼州刺史梁鵠畏貴威欲殺正和乃訪勳勳曰素與正和有隙諫鵠曰貪鷹為欲鷙而烹之何義鵠從之不殺正和正和詣勳不　曰吾為梁使君謀不為蘇正和\n不伐功　魏陳羣言劉廙於太祖太祖歎之深德羣羣曰議刑為國非為私且明主之意吾何與其孔博不伐功如此也\n立身有本末　魏孫資劉放用事大臣莫不交好唯辛毗不與通毗之子敞諫毗云云毗正色曰主上雖未聰明亦不為闇劣吾立身有本末貴故不過不令我作三公何危害之有\n心似秤　蜀諸葛亮曰吾心似秤不能為人作輕重\n不怨　蜀李嚴與諸葛亮皆大臣後嚴違報不繼矯命令亮迴軍亮歸免嚴為民及亮卒嚴嘔血而死以亮在尚有補過復位之望也論者以管仲奪伯氏駢邑三百沒齒不怨言亮之公正過之也\n投書　任棠為太守有人寄書投之於水\n面折長官　汝南太守歐陽歙臨饗衆出教曰西部督郵繇延資性忠貞云云欲顯延于朝功曹郅惲字君章於下坐愀然曰司正舉觥案延資性貪邪云云敢拜奉觥歙大慙\n不恨劾己　蜀郡太守因計吏賂遺曹騰益州刺史种暠於斜谷得其書奏太守并劾騰帝寢之無恨忽稱暠為能吏\n不發私書　郅郡為南守\n荊人遺弓不索曰荊人得之何求焉　孔子曰去荊可也老聃聞曰去人可也故老聃則至公矣\n陳泰字玄伯為并州　貴人寄貨因泰市奴婢泰不發書日及徵悉還之也\n陳蕃字仲舉為安樂守　梁冀遣人齎書有請託不通使者以詐為蕃告殺之左騎督武令\n王獨坐　漢王閎遷公少為小吏慷慨有大節遷冀部掾得又夕直家傑閎欲屬威乘傳到州彈治貪濁性廉克不發私書一不交　客賓主號王獨坐\n後漢蘇章字孺文　遷冀州刺史故人為清河太守章行部按其贓賄太守設酒陳平生意甚喜曰人皆有一天我有二天章曰今夕蘇孺文與故人飲私恩也明日冀州刺史按事公法也"},{"id":"juan12-007","source":"正文","juan":"卷第十二","menu":"吏久從政第八","sub_menu":null,"page":"一二三","leaf":"二十七オ","text":"漢為吏長子孫或子孫因以為氏　倉氏庾氏是也\n三載考績　唐虞三載考績欲使吏安其任民服習其化而無苟且之政\n安全長吏　黃霸為潁川太守務在成就安全長\n吏不欲易代曰數易吏迎新送故之費及姦吏因緣絕簿書盜財物公私費損甚多皆當出於民所易新吏又未必賢或不如故益為亂也注云吏因緣交代之際姦簿書盜財物也\n增秩賜金　漢宣吏有政績者不即移易就增秩賜金欲使人安其化故人皆勸精為理百姓安富也\n職滿乃得辟　後漢左雄奏辭郡國人之吏人清白從者寬其資等增其祿秩吏職滿歲宰府州郡乃得辟舉如此則送迎之役損官豎用權不省"},{"id":"juan12-008","source":"正文","juan":"卷第十二","menu":"安得人第九","sub_menu":null,"page":"一二四","leaf":"二十七ウ","text":"以貴下賤大得民也　易\n能安人則惠黎民懷之人心惟危　危則難安\n還定安輯　鴻鴈美宣王也萬人離散不安其居而能勞來還定安輯之曰惟此哲人謂我劬勞\n保民　周禮保民以道安人保安也\n教安　司徒以十二教以俗教安則民不偷注俗土地所生習\n保息　以保息六養萬民一曰慈幼\n以紓吾民傷民如傷　傳\n按堵　漢高入關吏人按堵如故\n嚴教吏謹待遇無令失職之業　宣詔二千石\n老者安之願為僵仆　漢趙廣漢以和顏接士待遇慇勤備於至誠吏皆無隱願為僵仆無所避也\n老小扶車轂　韓延壽棄市吏人數千送至渭城老小扶車轂奉酒炙延壽不忍逆人人為飲使掾吏分謝莫不流涕而矣\n守闕號泣　趙廣漢為京兆下獄吏人或言臣生無益縣官願代京兆死使得牧養小民\n衛卒請留　蓋寬饒左遷衛司馬行士卒廬室疾病者身自拊循歲盡交代衛卒數千皆叩頭自請復留共卒一年以報寬饒厚德以是顯名也\n借寇　寇恂子翼為河內太守後從世祖還河內人遮道上言欲更借寇君一年\n安作　廉范叔度為蜀郡先時蜀部多火災禁夜作人更相隱蔽燒者相屬范至不令禁火但嚴水備百姓安富歌之曰廉叔度來何暮不禁火人安作平生無襦今五袴\n徵租不當免　倪寬為內史收租稅時裁闊狹與民相假貸以故租多不入以負租當免人聞當免恐失之大家牛車小家擔負輸為最也\n遮使者車　侯霸君房為臨淮太守詔徵百姓遮使者車乞留相求更霸不舉子曰侯君去必死"},{"id":"juan12-009","source":"正文","juan":"卷第十二","menu":"遺愛第十","sub_menu":null,"page":"一二五","leaf":"二十八オ","text":"欒武子之德在人如周人之思召公愛其甘棠況其子乎　傳\n前有召父後有杜母　後漢杜詩為南陽人懷之前漢召信臣為南陽亦有遺愛人歌之曰云云\n悒然不樂思我劉君何時復來安此下人　劉陶為順陽長病免人歌之曰悒然不樂思我云云\n諸葛侯　蜀諸葛侯瞻亮之子也蜀人思亮而愛瞻每朝廷有善政雖非瞻建百姓相告曰諸葛侯所為以是美名過其實\n葬桐鄉　朱邑為桐鄉嗇夫未嘗笞辱人後遷大司農及病屬其子曰我死必葬桐鄉桐鄉人愛我子孫奉嘗不如桐鄉　後亦葬桐鄉果立祠\n去官不受遺　後漢劉寵為會稽守徵入山中有五六老叟人齎百錢送寵曰他時吏發求人間至夜不絕狗吠竟夕自明府下車狗不夜吠垂老遇明聖聞當去故自扶奉送寵為一大錢受之也\n斂馬牛追送　後漢孔奮君魚為姑臧長被徵吏人羌胡曰孔君清廉宜報德相率賦斂牛馬器物千萬追送數百里奮謝之無所受矣\n●生祠　附遺愛門\n于定國字曼倩　于公為縣獄吏決獄平郡中為立生祠也\n白馬從事　後漢鄭衆為廬江從事以單馬擊降灊山人為立祠號曰白馬從事\n張奐為武威任延為九真　並立生祠\n晉杜軫　為池陽令為雍州十一縣最百姓為立生祠\n陸機為浚儀令　義為廣都長　並立生祠\n荀勗　為安陽令有遺愛立生祠\n石相祠　石慶為齊相齊國慕其家行不言而齊國大治齊為立齊相祠\n○配社　附遺愛門\n欒公社　漢欒布為燕相燕齊間為立社號曰欒公社\n配食縣社　後漢甄子然至孝早卒北海相孔融恨不及見之令配食縣社\n神父　宋登字叔陽為汝陰令政教明能號稱神父遷潁川守市無二價道不拾遺汝陰人配社祠之\n圖畫　晉陸雲為浚儀令去官百姓追思之圖畫形像配食縣社"},{"id":"juan12-010","source":"正文","juan":"卷第十二","menu":"敎化第十一","sub_menu":null,"page":"一二五","leaf":"二十八オ","text":"觀民設教　周易\n德博而化爾惟風下民惟草　書\n草\n上之風必偃　語\n違上所命從厥攸好　言人不從上命從上所好也\n政由俗革　道有升降\n格其非心\n風以動之教以化之　詩序\n汝墳道化行也　文王之化行于南國也\n翩彼飛鴞集于泮林食我桑葚懷我好音　注鴞改音喻惡人從化\n敬敷五教　五教在寬\n司徒掌十二教　教民以度教節則人知足以俗教安則民不偷\n脩其教不易其俗\n教官之屬　大司徒有\n化民成俗其必由學　禮\n入其國其教可知　禮\n成人有兄死不為縗子皐為宰乃為縗\n上好禮則民莫敢不敬　上好信則民莫敢不用情\n敬教勸學　衛文公\n楚俗好庳車　史孫叔敖為相王以庳車不便馬欲下令使高相曰令數下民不知所從臣請閭里使高相乘車皆君子君子不能數下車王許之居數歲民悉高其車此不教而化\n風俗移人　漢刑法志\n性相近習相遠　言人同稟五常之性趣舍相近但所習異漸積而相去遠也\n文翁化蜀　教人讀書學者比於齊魯\n揉曲木者不累月　公孫弘曰虎豹馬牛禽獸不可制也及教訓服習之至可牽持駕服唯人之從臣聞揉曲木者不累月鑠金石者不累日人之所利害好惡豈比禽獸木石之類哉朞年而理臣弘尚竊遲之也\n陳和睦之義　潁川多豪家難治趙廣漢患其俗朋黨乃構會吏人令相告訐由是為俗人多讎怨及韓延壽為潁川欲改更之化以禮讓乃召郡中長老鄉里所信者數十人設酒對問以謠俗為陳和睦親愛銷除怨咎之路長老以為便可施行及黃霸代為潁川因其迹而大理也\n閉閤思過　延壽　　為馮翊人有昆弟訟田延壽曰是教化不行遂閉門思過訟田者昆弟謝罪以田相移\n陳元不孝　仇覽一名香字季智為蒲亭長民陳元母告元不孝覽驚曰吾近過舍廬整頓此非惡人當是教化未至母守寡養孤何肯棄一朝之忿欲致此子於不義母\n覽乃親到元家與其母子飲因為陳人倫孝行譬以禍福之言元卒成孝子\n乞詣廷尉　許荊為桂陽守行春到耒陽民有蔣均兄弟爭財訟荊對之歎曰教化不行罪在太守乃上書陳狀乞詣廷尉兄弟感悔求受罪\n省俸助婚　任延為九真守駱越無婚禮各因淫好無適對匹延移書令男年二十至五十女年十五至三十皆以年齒相配其貧者長吏已下省俸祿助之是歲穀稼豐衍生子始知種姓矣\n縣官不可入　劉矩為雍丘令以禮讓化人有爭訟者輒提耳告之以忿恚可忍縣官不可入矩字叔方\n民用丕變　書\n爾之教矣　民胥效矣\n教之以德齊之以禮則民有格心教之以政齊之以　刑則民有遁心\n恥格\n化馳如神\n四誡　秦彭為山陽守以禮教人為設四誡以定六親長幼之禮有遵奉教化者擢為鄉三老也\n鬻羔豚者不飾賈路不拾遺　史孔子與聞政之三日\n皆訟主　田叔為魯相初到民訟王取財物叔召之曰王非爾主耶王聞之而大慚而還財也\n先訓　魏　　為　縣令吏有過先訓之不改乃罷之或　　吏又長以戒之皆懷慙息訟\n借牛　魯恭仲康為中牟令亭長借人牛不還人訟之恭令還再三不從恭欲解印吏人泣亭長於是請罪也\n吏受米肉　卓茂子康為密令人言亭吏受米肉　　之茂曰遺人之情也不當遷罰人伏其化\n和解　吳祐為膠東相有訟者身到閭里和解之民化其德\n諦思　杜畿伯侯為河東守有訟者為陳大義令歸諦思之自後少有訟者\n姦吏復職　高柔文惠為菅長姦吏聞名引去召令復職\n止訟上　劉　　為　陽時百姓有訟官長者　歎曰居下訕上　遺也上率不君下不可失禮讓而不問\n自劾責　韓延壽接待下吏約誓明著有負之者延壽痛自劾責吏皆慙悔\n又　延壽為潁　　　喪祭禮使諸生皮弁致俎豆為吏人行禮\n又　潁川人感延壽化賣偶車馬下里偽物者皆弃之市道\n劉寬以蒲鞭示恥　見辯并門\n平化侯　王　太傅居魯出見男女不異路下車以禮誘其　　莽封為平化侯"},{"id":"juan12-011","source":"正文","juan":"卷第十二","menu":"禁令第十二","sub_menu":null,"page":"一二七","leaf":"二十九オ","text":"諸禁令附\n殺子　　　奐為武\n威太守俗二月五月生子及與父母同日者皆殺之奐　賞罰重殺子之令風俗遂改\n賈子賈女　後漢賈彪字偉節為新息長小民貧多不養子彪嚴其制與殺人同罪數年間人民養子者千數曰賈父所生男名曰賈子女名曰賈女\n恥病　後漢鄧訓字平叔為護羌校尉羌胡病死者臨困輒以刀自刺訓聞有困疾者輒拘持束不與兵刃使醫藥療之愈者非一小大感悅\n禁漁採　見商部　并門\n禁採珠　見珠門注\n禁弓弩　公孫弘奏民不得挾弓弩吾丘壽王曰聖　惡人挾之吏不能止良人備而犯法是禁民救也弘詘伏之\n不舉子　王吉為沛相人生子不舉者斬其父母以土墼合埋之\n又　鄭渾字文公為下蔡長民生子　　率不舉渾重殺法百姓初畏罪後稍豐給男女悉以鄭為字\n禁淫祀　西門豹禁河伯娶婦見縣令　　門\n又　第五倫伯魚為會稽俗多淫祀人常以牛祭神有食牛不薦者病先為牛鳴　後　　禁斷\n又　欒巴叔元為豫章守郡多山川鬼怪人或貲祈禱巴素有道術能役鬼神悉毀房祀翦理姦巫遂經百姓安之\n神娶　宋均以庠為九江守浚遒縣有唐后二山人共祀之衆巫取百姓男女為公嫗歲歲改易既而不敢嫁娶均到令曰為神娶者娶巫家女　遂絕\n禁　見寒食門\n安作　見安人門"},{"id":"juan12-012","source":"正文","juan":"卷第十二","menu":"路不拾遺第十三","sub_menu":null,"page":"一二八","leaf":"二十九ウ","text":"何並為長陵令路不拾遺\n劉矩為雍丘令　有得遺者皆推尋其主而還之後漢\n繫樹　孔原行遇錢拾以繫樹人以為神人繫錢我道多錢之神樹祀之原知淫祀乃辨之\n守劍　後漢王烈在鄉里德化行人有盜牛者主得之盜曰我將被刑勿使王烈知也烈聞遺布一端後父老遺劍於路至夜有一人守劍於路問之乃前盜牛者\n遺裘　立部閭里處為縣什令杜威喪衣得　　頗吏曰縣有明府不能為惡也\n牛屬稚子　王渙字稚子為　令　人盜牛留於道放牛者解去以屬稚子\n付樊父　樊曄仲華為天水太守　道不拾遺行旅至聚衣於道者以付樊父"},{"id":"juan12-013","source":"正文","juan":"卷第十二","menu":"不求備第十四","sub_menu":null,"page":"一二八","leaf":"二十九ウ","text":"尚能拜起　黃霸為潁川許丞老病聾督郵白欲逐之霸曰許丞廉吏雖老尚能拜起重聽何傷且善助之無失賢者意也\n與人不求備　書\n無求備於一\n人　　子曰君子易事而難悅及其使人也器之小人難事而易悅其使人也求備焉　語\n有行之士未必能進趣進趣之士未必有行　魏祖令曰\n愛其才　漢張敞為京兆尹為人輕媚為婦畫眉帝愛其才而不備責\n戴其角者無上齒有其翼者兩其足　董仲舒云"},{"id":"juan12-014","source":"正文","juan":"卷第十二","menu":"推美下吏第十五","sub_menu":null,"page":"一二九","leaf":"三十オ","text":"張湯為廷尉　奏事即譴湯推謝上有所譴即推鄉而數之也鄉上意所便必引正監掾吏賢者固為臣議如此上責臣臣不用愚抵此罪常釋即奏事上善之即曰臣非知此奏乃監掾吏某所為其故為吏揚人之善解人之過如此\n龔其遂推美於王生　遂見上問何以為理遂辭讓推美於上上曰君安得長者之言而道之曰臣議曹王生教\n臣不奪縣治　　　　　　　　得罪人告其縣長吏使　自行罰曰不敢代縣治奪賢令長名也\n推美　陳寵為太守　　大行入為司農和帝問何以治對曰臣任功曹王渙以簡賢選能主簿鐔顯拾遺補過臣奉宣詔書而已\n承掾任　馬援為隴西守任下吏諸曹時白外事援曰此丞掾任何足相煩若大姓侵小民　　非此乃太守事耳\n下教委任　王堂為汝南守下教曰古人勞於求賢逸於任使其憲章朝右簡核才職委任功曹陳蕃匡政理務拾遺補闕任主簿應嗣\n坐嘯　南陽太守成瑨任功曹岑晊人歌曰南陽太守岑公孝弘農成瑨但坐嘯\n汝南太守范孟博南陽宗資主畫諾　宗資任功曹范滂人歌云\n呂虔　字子恪為徐州刺史委別駕王祥\n唯主盜賊　孫堅文臺為長沙守教吏曰善遇良吏貴文書以盜賊付太守也\n其不掾屬所為　趙廣漢二千石雅功美於下曰某掾所為非二千石所及發於至誠吏皆論寫心腹\n責大指不苛細　汲黯長孺為東海守學黃老好清靜擇丞史任之責大指不苛細卧閨閤而理也\n吳公黃霸　字　　為石\n白吉　　　不加　　皆畏怖後以　不擾又言　人事　安得其所　　之　中震怖"},{"id":"juan12-015","source":"正文","juan":"卷第十二","menu":"敝政第十六","sub_menu":null,"page":"一三〇","leaf":"三十ウ","text":"復恒以　　　常\n不遑寧處不躬不親杼軸其空徹我牆屋田卒汙萊不勝其敝政\n敗人亡事充政重政不率法而制於心苟簡之理　苟於權利簡於仁義\n政以賄成而政教於寵巧法析律飾文增辭化貨行於言罪成於手　書\n後漢刑繁而俗敝布常無藝　藝法制也\n道殣相望而女富溢尤　殣餓死也\n神怒人怨上下　　　君\n為政勿圖莽　　子\n無惻隱之實\n商君遺禮義　賈誼曰商君遺禮義棄仁恩故秦人家富子壯則出分家貧子壯則出贅借父耰鉏慮有德色母取箕帚立而誶語誶詬罵也\n滅天理而窮人欲愚弄其民官邪\n讒匿孔多　長令\n專政　張湯每奏事日晏天子忘食丞相充位而已天下皆決於湯縣官所興未獲利姦吏並侵漁於是痛繩以罪自公卿以下至於庶人莫不病湯\n又　王溫舒為中尉滅宣左內史事無大小皆關其守官吏令丞不得擅搖以重法繩之數年一切為小治辦宣以小至大能自行之難為經常之也\n請寄為姦　請託之事\n謝錢　以錢求士陳湯\n用小人　公孫賀伯主嘗言丞相自以職分富貴不謝人惠故所舉多為敗\n兒所在侵削百姓怨之也\n不信吏　劉頌為京兆尹遣大吏出使隨而覆察之白日於暨聞窺問使使　　　察　　又以辭不足信云云\n不聞問　嚴助請為會稽守數年不聞問詔曰聞者聞恩父不聞問助謝罪\n多寫孝經　梁州刺史　　遠患多寇盜理之　　學術乃欲多寫孝經令家家習之　　主勤勸不　之罪責之"},{"id":"juan12-016","source":"正文","juan":"卷第十二","menu":"譎政第十七","sub_menu":null,"page":"一三〇","leaf":"三十ウ","text":"飾吏用　漢趙廣漢字子都為潁川　潁川俗豪傑相　　之乃為　　　　　　　京兆尹\n鉤距以得人情嘗召　事長界上亭長戲曰為我多謝趙君廣漢知之\n烏攫肉　黃霸為潁川遣吏按行吏不敢舍郵亭食於路傍烏攫其肉吏還霸迎勞曰甚苦食於路乃為烏所攫肉吏以為霸盡知其行止事不敢隱也\n拔扶用能　朱博字子元為馮翊長陵尚方禁少時嘗盜人妻見斫創著頰博見其瘢問之尚不敢隱博笑曰丈夫固時有是馮翊欲洒卿恥拔扶用能自効不禁且懼對曰必死博勑禁無得泄語有便宜輒記之言以為耳目擢禁連守縣令久之召功曹責以禁等事使自疏取受敬錢當叩頭功曹不敢隱博削記使之不敢差跌\n耳目　蓋寬饒為官志在奉公俸錢月數千半給吏人為耳目\n借死　魏太祖軍中糧少主簿請用小斗給軍糧祖曰善後軍中怨祖謂主簿曰借汝死以謝眾乃斬之以徇軍士也\n晉文公譎而不正　論語\n把其陰重罪　王溫舒擇敢往吏把其陰重罪縱使督吏之姦也\n易服察俗　羊續興祖為南陽守當入郡乃易服間行侍童子一人而已觀邑里採風俗然後進吏人知之而貪絜良皆盡知之也\n譎數　王渙為洛陽令能以譎數發擿姦伏\n問吏所聞　范甯為豫章守遣十五議曹下屬縣採風俗吏假歸還詳問所聞官長得失徐覽與書云\n示人以詐民免而無恥\n出奇譎　朱博為琅邪令自稱出奇譎以示下不可欺也\n任詭譎"},{"id":"juan12-017","source":"正文","juan":"卷第十二","menu":"政不一第十八","sub_menu":null,"page":"一三一","leaf":"三十一オ","text":"狐裘蒙茸一國三公吾誰適從　士蔿謂晉獻公\n七年之中一與一奪二三孰甚焉　季文子謂晉言\n晉政多門朝夕改國不堪貳政眾而惡　國語\n政令之無常"},{"id":"juan12-018","source":"正文","juan":"卷第十二","menu":"暴政第十九","sub_menu":null,"page":"一三一","leaf":"三十一オ","text":"酷政附\n暴殄天物以蕩陵德慢令致期慢神虐人不戒視成謂之暴\n暴君汙吏慢其經戒　孟子\n朝令暮具苛政猛於虎上慢下暴數虐於百姓天吏逸德烈於猛火惟威惟虐依\n勢作威報虐以威滅德作威以民為土芥殺人以逞不教而殺\n束濕　寧成操下如束濕薪\n一怒　寧值乳虎不值寧成一怒\n重足一迹　人畏寧成\n蒼鷹　人號郅都為蒼鷹\n法令　密矣然姦愈甚上下相遁　遁避也\n武健嚴酷鷹擊毛摯為理義縱\n足吾事矣　王溫舒為河內具私馬五十疋驛奏事不過二日得報郡中驚其神速時於旁郡追求賊會春至溫舒歎曰使冬月益展一月足吾事矣\n猜禍　溫舒為中尉召猜禍吏任之其爪牙吏皆虎而冠\n屠伯　嚴延年為河南守冬月論囚流血數里河南人號屠伯張敞書戒之答曰莠盛苗穢不可不除母掃墓待喪\n戒子　尹賞將戒子曰為吏正坐殘賊免思功効則復進用一坐軟弱不勝任免無有起時\n地臼木杵　門注見酷吏\n刺骨吹毛文深趙禹　乃詆張湯\n枹鼓不鳴董少平　後漢董宣為洛陽令人號卧虎語曰言\n婦人升樓　黃昌為陳相縣民彭氏造高樓臨道昌行縣彭氏婦人輒升樓而觀昌乃殺之\n亂杖撾之　魏劉頗為弘農守過無大小亂杖撾之吏人掘地求錢每遣大吏報使小吏覆察之\n佩韋　西門豹性嚴急常佩韋以自戒\n去儒吏　朱博所在輒罷去儒吏議曹曰文儒吏時有案奏稱說云云博曰太守漢吏當奉三尺法無奈生兩言聖人道何且歸侍堯舜君也"},{"id":"juan12-019","source":"正文","juan":"卷第十二","menu":"威名第二十","sub_menu":null,"page":"一三二","leaf":"三十一ウ","text":"明察附\n威克厥愛允濟　尚書言威勝愛則信成功\n畏威寡命\n傳翟方進　子義字仲文年二十為南陽都尉宛令劉立與曲陽侯根為婚又著名州郡輕義年少義陽以他事召見立以主守盜十金賊殺不辜收縛立送獄威振南陽\n王尊　為安定太守告屬縣曰令長丞奉法守職甚勞苦太守以今日至府願諸君勉正身以率下無以身試法勸掾功曹不中用者趣自避退無妨賢路孔子七日誅少正卯今一月矣五官掾張輔貪汙一郡錢盡入輔家收捕之獄數日輔死\n霽威嚴　魏相為揚州刺史按治郡國守相多所貶退丙吉與書曰朝廷深知弱翁治行直方大用願少慎事自重藏器於身不顯其能相善其言為霽威嚴霽止也\n威信報者　銚期次况為魏郡守督賊李熊弟陸在外謀反期令吏送熊及母使就陸熊求得陸詣鄴陸愧感自殺矣\n以一警百　尹翁歸治東海明察吏人賢不肖盡知之每民大會及出行縣時有罪以一警百吏人皆伏恐懼\n識柳樹　陶侃士衡為諸營種柳都尉夏施盜柳植之於己門侃見駐車問曰此是武昌西門柳何因盜之施惶怖\n解印　朱穆公叔為冀州刺史冀部令長聞穆濟河解印綬四十餘人矣\n●不避豪彊　附威名門\n剛亦不吐柔亦不茹\n不畏彊禦\n豺狼當路　張綱劾奏梁冀\n斂手以避　鮑永為司隸鮑恢為都官從事世祖曰貴戚且斂手以避二鮑\n違彊陵弱　非勇也\n彊項　董宣少平為洛陽令湖陽公主奴殺人與主參乘宣行逢駐車收格殺之主訴於帝帝欲箠殺之宣曰云云帝使謝主宣不從彊捺伏宣手據地不俯因曰彊項令\n御前呵囚　虞延為洛陽令陰就客馬成為姦盜延收之陰氏書一請一箠輒加二百箠言於帝帝親錄囚徒延陳獄狀可論者在東無理者在西成欲趨東延執之曰爾久盜賊杜為臣　　云云帝亦謂曰汝犯王法云云竟殺之也\n州數　橋玄公祖為　　陳相羊昌罪惡貪私數救之刺史周景承旨召玄為從事至遲撤不受發案益急昌下獄也\n蒼鷹　郅都為中尉行法不避貴戚貴戚側目而視號曰蒼鷹\n●令　附威名門\n慎乃出令令出惟行　不惟反\n其身正不令而行其身不正雖令不從\n君子之德風小人之德草草上之風必偃也\n發號施令罔有不臧　書云\n君子命以防欲　命教命也\n大為之防民猶踰之　言嚴令不能禁\n尚法令滋章　盜賊多有\n示人和禁　周禮\n國禁　官禁\n苟臨人之有失　則雖令不從\n論時令　月令\n凡執禁以齊眾\n不赦過　禮\n知防　禮\n發號出令而民悅謂之和　禮\n先甲　易先甲三日後甲三日謂出令也\n先庚　上義同\n后以施令誥四方　易\n事不再令\n發命之不衷\n遽令　傳書驛馬\n懸理象之法于象魏\n屬民而讀邦法\n布國和令　禮\n從其彊令\n吾令實過\n憲令　君之憲令\n無遷令　莊子"},{"id":"juan12-020","source":"正文","juan":"卷第十二","menu":"典法第二十一","sub_menu":null,"page":"一三四","leaf":"三十二ウ","text":"慎徽五典　書\n儀式刑文王之典　日靖四方雖無老成人尚有典刑\n施典於邦國　周禮太宰乃施典於邦國施則于都鄙施法于官府\n法則以馭其害\n大夫以法相序\n士以信相考\n周禮盡在魯矣\n周公之典\n在紂屏棄典刑\n典法非訖於威惟訖於富\n制事典　趙宣子言為政也\n蒍敖為宰擇楚國之令典\n能用典矣\n典法無更　莊子\n率由舊章\n三辟之興皆叔世也　三代之法不起於盛時叔向貽子產書\n藏在盟府可以覆視也\n汝司典之後　籍譚\n謹爾侯度\n公共理具　張釋之曰法者天下公共法為理具\n畫一法\n有起姦\n夫魯有初　禮\n採周之舊　傳"},{"id":"juan12-021","source":"正文","juan":"卷第十二","menu":"沿革第二十二","sub_menu":null,"page":"一三四","leaf":"三十二ウ","text":"夏倍虞官　禮有虞氏官五十夏官百殷二百周三百\n修官\n倍亦克用乂　書\n革已日乃孚　易\n人可與襲常難與適變\n政由俗革\n利百法變\n仍舊貫　仍因也貫事也\n何必改作\n新意相沿　不改也禮\n適道在權　救時貴變\n法宜改度　義有隨時\n所貴便宜　寧辭改作\n商倍夏官　人克用乂\n漢循秦政　政　亦不\n苟廢置之合宜　信於革而齊致\n革敝　鼎新\n惟新是圖　何常之有\n是宜捨魯　未可因爵\n夫魯有初　採周之舊"},{"id":"juan12-022","source":"正文","juan":"卷第十二","menu":"易官吏第二十三","sub_menu":null,"page":"一三五","leaf":"三十三オ","text":"漢文時居官長子孫以為氏　倉氏庾氏是也\n後公卿以下轉相促急吏易政事或居官數月而退\n迎送交錯\n中材苟容求全\n下材懷危內顧　已上王嘉上疏云\n尚能拜起　黃霸不欲數易官吏潁川時許丞老病聾督郵白遣之霸曰尚能拜起重聽何傷所易新吏未必賢送故迎新所費甚姦吏因緣簿書盜財物\n換縣　薛宣為馮翊頻陽令薛恭本縣考者以功次遷職不辦而粟邑令尹賞久在郡用事粟邑易理宣奏與恭換縣數月而兩縣皆理\n滕薛大夫　孟公綽為趙魏老則優不可以為滕薛大夫"},{"id":"juan12-023","source":"正文","juan":"卷第十二","menu":"勤官第二十四","sub_menu":null,"page":"一三五","leaf":"三十三オ","text":"守官\n廢命不敬\n積行累功以致爵位　詩序\n夙夜在公\n夙夜匪懈\n不可以怠\n不敢遑違\n不懈於位\n不躬不親\n靖恭爾位\n無曰不揚　豈敢怠職\n恪居官次\n政如農功　日夜思之朝夕行之如農之有畔　也\n能勤有繼　繼功績也\n涖事惟勤\n居之不倦\n不敢自逸\n陳力就列\n夙夜惟寅\n欽乃攸司\n智以效官　勤而涖事\n不遑啟處\n苟有位於朝無有不恭恪\n非德莫如勤\n僶俛從事\n不敢告勞\n無棄物　陶侃木屑事具善政門注"},{"id":"juan12-024","source":"正文","juan":"卷第十二","menu":"省官第二十五","sub_menu":null,"page":"一三五","leaf":"三十三オ","text":"審官　詩\n官不必備惟其人\n明王立政不惟其官惟其人也\n冗負官事不攝　管仲\n損不急之官　史記楚悼王用吳起爲相損不急之官以養戰士\n省西曹　魏志毛玠爲司空丞相東曹掾諸曹不行時人憚之將議欲併省官員咸欲省東曹太祖知之令曰日出於東月盛於東凡人言先東東不可省遂省西曹\n官省則選清而得人職并則吏簡而俗靜　晉王彪之議也\n省吏不如省官　晉時議省州郡半吏以赴農功荀勗議曰省吏不如省官省官不如省事省事不如清心昔蕭曹相漢載其清靜畫一之歌此清之本漢文垂拱幾致刑措此省事也光武并合吏員縣官國邑裁置十一此省官也魏太和中遣王人四出減天下吏員正始中亦併合郡縣此省吏也今欲求之於本則省事爲先若欲省官同九寺可并於尚書蘭臺宜省於三府云云"},{"id":"juan12-025","source":"正文","juan":"卷第十二","menu":"守官第二十六","sub_menu":null,"page":"一三六","leaf":"三十三ウ","text":"臺駘能業其官　傳\n一日失職則死及之\n守道不如守官　齊侯田招虞人以旌不進仲尼曰守道不如守官注君招當往道之常也非物不進官之制也\n介于石　易\n其靜也專\n立不易方\n思不在位\n各守爾典\n靖恭爾位\n職思其憂\n各司其局\n見死不更其守\n雖有挈瓶之智守不假器\n不爲利諂\n官脩其方　官宿其業\n食焉不避其難　子路\n當官而行\n守官廢命不敬　傳士蔿城蒲與屈\n出納之吝謂之有司\n庖人雖不治庖祝史不越樽俎而代之　莊子\n頭可得　漢書殿中夜有怪群臣皆驚霍光恐有變召尚書符璽郎欲收取璽郎不肯受光光欲奪之郎按劍曰臣頭可得璽不可得明日光賞之\n問喘牛　丙吉不問殺人而問牛喘曰殺人京兆尹長安令之所職方今少陽用事牛未宜喘宰相職調陰陽所當憂\n陳平不對農獄　上問絳侯周勃一歲入粟決獄錢穀幾何勃不能對汗流問陳平平對曰入粟當問搜粟都尉決獄問廷尉臣職上佐天子調陰陽使四方得其所也\n刺史不察黃綬　朱博爲冀州刺史人遮道言事博曰若言丞尉當言郡守刺史不察黃綬"},{"id":"juan12-026","source":"正文","juan":"卷第十二","menu":"曠官第二十七","sub_menu":null,"page":"一三七","leaf":"三十四オ","text":"守官廢命不敬\n一日失職則死及之\n棄命廢職\n尸祿　素餐\n羲和湎淫廢時亂日　　廢厥職尸厥官罔聞知\n叛官離次　以干先王之誅\n以速官謗\n怠慢　周禮\n不治能官　敢煩寢乎\n失政不立\n王事無曠\n怠於其位\n失官不食\n且昧恪居　且斜位\n忘事慢官　速戾\n既不治庖　且科出俎\n苟忘恤緯　是謂拂經\n出匣毀櫝　虎兕出於匣龜玉毀於櫝中是誰之過與\n廢事　慢易\n葬以士禮　禮曰大夫廢其事終身不仕死以士禮葬之\n不司其局\n百官廢職服大刑　禮\n官失其守\n日食不書朔與日官之失也　左傳\n惰慢　禮\n蒞事不敬非孝也　禮\n曠職有怠官邪　百事廢　官邪也\n苟一日失職則死及之\n闕而無罪\n苟不恭乎乃職　必速厥戾\n苟弃命於廢官　有則常而無赦\n不能承式　何以守官\n臨事有虧則思移過　先期不請誅合當古早\n慢官之後徒告闕供　臨事之前朝不申請\n左不攻于左汝不恭命　書\n都家之理有不及者　周禮朝大夫掌都家之理注都家王子弟也天子之事當施於都家者使知而行之凡都家之理有不及者誅其朝大夫在卑賤則誅有司不及謂有猶廢之者也\n滿百　漢陳遵爲掾不治曹事曹事數廢被義主者數曰陳掾今日以某事滿遵曰滿百乃相聞故事滿百者斥\n曹參爲相不事　不事丞相之事\n沉職　沉湎不學\n備位　言無職事\n具臣充位　張湯爲御史大夫每朝奏事日旰天子忘食事皆決於湯丞相充位而已\n州縣之職徒勞人爾\n曰飲醇酒　曹參\n終日清譚　王夷甫爲元城令終日清譚縣務亦理\n養名逋事　具怠惰門注"},{"id":"juan12-027","source":"正文","juan":"卷第十二","menu":"弃官二十八","sub_menu":null,"page":"一三八","leaf":"三十四ウ","text":"弃官則族無所庇　傳宋公孫蕩\n不仕無義　君子之仕行其義也\n歸去來　陶潛爲彭澤令曰今日不能爲五斗米折要向鄉里小兒乃弃官作歸去來\n雌伏　東觀漢記趙溫字子柔爲京兆郡丞歎曰大丈夫當爲雄飛安能雌伏遂弃官而去\n命駕適意　說張翰字季鷹爲齊王東曹掾在洛陽見秋風起因思江南菰菜蓴羹鱸魚膾曰人生所貴適意何能羈宦數千里以邀名爵乃命駕而歸\n解印詠風　潘　事\n難進易退　君子\n三揖而進一辭而退　君子\n奉身以退　量力而行\n陳力就列不能者止\n不仕王侯高尚其事\n逃祿　文子\n西恥郡守　後漢禮般爲皮令以郡守非其人乃弃官\n投傳　周景辟爲別駕以諫不合投傳去\n不樂爲吏　枚乘爲弘農郡尉不樂爲吏去官\n三綱絕　後漢逢萌字子康見王莽殺子宇曰三綱絕矣不去禍及乃解冠挂東都門而歸也\n池中龍種　襄陽記龐德公子　字世文晉太康中爲牂牁太守去官歸居白沙里鄉人宗敬之相語曰我家池中龍種來里中仰其德讓少壯皆代老者擔\n行意　君行制臣行意\n拯人　書後漢黨錮事下詔捕范滂督郵吳導至縣抱詔書閉傳舍伏牀而泣滂聞之曰必爲我也即自詣獄縣令郭揖大驚出解印綬引出俱去曰天下大矣子何爲在此曰滂死則禍塞何敢以罪累君\n又　巴肅坐黨自載詣縣縣令見肅入閤解印綬欲與俱去肅曰人臣有謀不隱有罪不避遂被害\n長吏有嫌　晉陶　　太守呂岳　　　　令與情嫌弃官而歸史賈琮刻石記之\n不之官　後漢楊倫以諫不合出補常山王傅病不之官司隸催促倫上疏曰有留死一尺無北行一寸詔廷尉赦原之\n世說王經字承宗爲江夏守曹爽附絹三十斤令交市於吳經不發書弃官歸母以經與兵馬而擅去官對　送使杖五十爽聞不復加罪\n免冠　貢禹爲河南令以職事爲府官所責免冠謝罪禹曰冠一免豈可復冠耶遂去官也\n不過六百石　漢邴漢兄子曼容爲官不過六百石輒自免去\n奉遺戒　王吉嘗坐昌邑王被刑戒子孫無爲王國吏又子駿遷趙內史遂免官歸\n不及政事　閔仲叔應司徒侯霸之辟既至不及政事仲叔曰辟而不問是失人也投劾去\n投版　范滂孟博爲光祿主事執公儀見光祿勳陳蕃蕃不止之滂恨投版弃官郭林宗聞而讓蕃\n誥誓　王羲之逸少會稽稱疾去官於父母墓前自誓曰今之後敢渝此心貪冒苟進是無尊而不子也"},{"id":"juan12-028","source":"正文","juan":"卷第十二","menu":"拜官第二十九","sub_menu":null,"page":"一三九","leaf":"三十五オ","text":"愛君之祿\n寵光\n寵命\n君命吾又寵秩之　傳\n得祿\n祿在其中\n拜於家\n即拜　漢張敞亡命冀州賊起上使即家召敞拜冀州刺史\n又　哀帝即位拜龔舍爲太山太守使者請舍至縣拜受印綬舍曰云云遂於家受詔便道之官也\n又　阮孚轉吏部尚書領東海王師稱疾不拜詔就家用之郗鑒以爲非典帝曰就家用之誠快亦不便廢才也\n冒雨拜　王雅遷將拜太子少傅遇雨請以繖入王恂不許因冒雨而拜"},{"id":"juan12-029","source":"正文","juan":"卷第十二","menu":"辭官第三十","sub_menu":null,"page":"一三九","leaf":"三十五オ","text":"奉身而退\n善爲我辭　季氏使閔子騫爲費宰閔子騫曰善爲我辭焉\n陳力就列不能者止\n知止不殆\n灌園　於陵子辭三公爲人灌園\n乞骸骨　漢平當爲丞相病篤上書乞骸骨上使尚書杜延賜安車養牛一上尊酒十石曰君其勉就醫藥\n又杜延年　賜安車駟馬罷就第\n又韋賢　爲丞相老病乞骸骨賜金百斤罷加賜第一區丞相致仕自賢始\n遺失　後漢世祖彊起張湛爲司徒湛至朝堂失溲因自謝病而止\n劉矯有高節以叔父未得仕進絕州郡之命　魏志\n讓封　魏　嘻子秦襲祖封侯讓不受有司劾奏損復苟立小絜宜加刑鍾繇議宜勿奪志\n又韋玄成　讓封以避兄\n冶廬辭卿　傳周遄冶廑納衛侯衛侯以爲卿周冶既服將命周遄先入及門遇疾而卒冶廑辭卿注見遄死故也\n繭鮮食　薳子馮辭令尹重繭衣裘鮮食而寢楚子使醫視曰瘠則甚矣而血氣未動言無疾也乃免\n敢辱高位以速官謗\n傳齊使敬仲爲卿曰羈旅之臣幸免獲戾敢辱高位云\n投檄　漢崔篆以明經徵詣公車太保甄豐舉爲步兵校尉篆辭曰吾聞伐國不問仁人戰陣不訪儒士此舉奚爲至哉投檄而歸\n臣行意　范蠡辭官曰君行令臣行意乃扁舟泛五湖\n辭外官　蕭望之長信拜平原守上疏曰陛下諫官補郡吏所謂憂其末而忘其本\n又黃香爲尚書令　遷東郡守上疏云典郡非其所堪願留備冗員督責小職復爲尚書令\n不許辭　晉卞壼辭舉之爲尚書令時召樂謨爲郡中正庾怡爲廷尉評二人皆稱父命不就壼奏一切天下不得以私讓爲永制二子不得已就之\n辭大　周顗侯子除內史未行徵拜散騎常侍與曰辭大不辭小強之焚\n辭官得罪　蔡謨上疏以疾病乞骸骨上司徒印綬章表十餘上穆帝臨軒遣使徵謨陳病篤曰有公族子之疾寢伏待罪自旦及中公卿奏謨免爲庶人\n視子疾　陸納祖言爲吏部尚書以愛子長生有疾求解官營視詔許之\n避舉主　後漢劉陶子奇遷尚書以所舉主爲尚書不可齊列乞拜散騎拜侍中\n避功臣　杜詩公君爲南陽欲降避功臣上疏曰宜虛數郡待振殊之臣臣非宜所願乞小職\n諱同　王舒與明父名會舒拜會稽內史舒上疏乞換他郡朝廷議以字同音異舒又陳辭於是改會爲鄶不得已而行之\n同名　江統爲中郎選司以統叔春爲宜春令統因上疏曰　且以亂位之東士人所繫使至受官而令佐史不得稱子孫不得言朝廷從之\n官不屑就\n辭合善爲\n匪念恪居\n徒思智免"},{"id":"juan12-030","source":"正文","juan":"卷第十二","menu":"換官第三十一","sub_menu":null,"page":"一四〇","leaf":"三十五ウ","text":"擇官不擇官附\n薛宣　爲馮翊頻陽多盜賊令薛恭本以孝治民職不辦粟邑縣小人謹恭易理令尹賞有幹宜奏賞與恭換縣旬月間兩縣皆理曰孟公綽優於趙魏\n毋丘儉　魏志儉爲鎮南將軍豫州刺史諸葛誕東關不利乃令誕儉對換誕爲豫州儉爲楊州\n不擇官　吳志孫策從容與呂範曰將軍士衆日盛綱紀猶有不理願暫領都督爲將軍部分之策曰子衡已有大衆立功於外豈宜復屈小職知軍中細事範曰今託將軍欲以官猶同舟涉海此亦載之計非但將軍策笑範出釋褠著袴執鞭詣閤下啓事自稱領都督策乃委以衆事軍中肅睦大行\n又晉褚裒　謂李充曰能屈作一小縣否充曰窮猿奔林豈暇擇木遂作剡縣\n子路曰家貧親老不擇祿而仕\n捧檄　毛義事親孝張奉造之往候之會州檄至以義爲令義捧檄入喜見顏色奉以賤之後乃悟日爲親故也\n辭大就小　葛洪辭小遷散騎常侍領大著作不就以欲練丹術聞交阯出丹求爲句漏令帝以洪資高不許洪曰非欲榮以有丹故耳帝從之\n阮籍求爲步兵校尉　聞步兵廚有貯酒三百斛乃求之也"},{"id":"juan12-031","source":"正文","juan":"卷第十二","menu":"屬吏第三十二","sub_menu":null,"page":"一四一","leaf":"三十六オ","text":"馬曹　見人部縱逸門\n統攝　統屬攝察\n寮吏　長吏下列下位資事名參下吏賤隸外臺\n入被　光逸爲博昌小吏令使逸送客過　歲寒還遇令不在逸解衣入令被中令還怒將加刑逸曰若不覓温以凍死豈惜一被而殺一人故不疑令奇而釋之\n登車　王徽之子猷爲桓沖參軍沖問曰署何曹似馬曹從行遇雨下馬排入沖車曰豈獨擅一車耶\n怒不謁　房仲文選東陽太守何無忌甚重之東陽無忌所統許便道修謁無忌欽遲之仲文失志恍　不過府無忌以爲薄己大怒遂中傷之\n驕見　後漢沈景拜河間孝王相謁王王不正服箕踞殿上侍郎贊拜景不爲禮問王所在虎賁曰是非王耶景曰王不正服與民何別\n恐傷　鄭當時未嘗名吏與官屬言若恐傷之\n役使　孟寶竟光兮左遷衛司馬先時拜謁衛官常爲縣使市買寶饒按舊令遂衛官屬行衛者縣使輸詣尚書辭也\n迎送　孔奮君魚爲姑臧令太守梁統未嘗待以官屬之禮常迎於大門引入見其母也\n師友　嚴詡爲潁川與掾史爲師友\n如賓　孫寶子嚴爲京兆尹故吏侯文不肯仕寶以恩禮請文署爲掾進見如賓禮\n拜起　朱博爲琅耶守門下掾贛遂耆舊儒拜起舒遲博出教主簿云云贛不習吏禮主簿且教拜起\n面折長官　郅惲君章太守歐陽歙請爲功曹汝南舊俗十月饗會百里內縣以牛酒到府臨饗禮畢歙教曰西部督郵繇延天資忠貞云云惲于下坐歎前曰司正舉觥以君罪誅延資性貪邪外方內圓云云明府以惡爲善惲敢再拜奉觥歙慙曰敬受觥惲疾去也\n善事官長　任延長孫爲武威守帝戒曰善事官長無失名譽延曰忠臣不和和臣不忠上下雷同非陛下之福帝曰善\n買牛不與　後漢宋暉文季爲郡吏太守阮況欲市牛暉不從及況卒暉厚贈送曰前有所求不與不敢以貨汙君德也"},{"id":"juan12-032","source":"正文","juan":"卷第十二","menu":"同官第三十三","sub_menu":null,"page":"一四二","leaf":"三十六ウ","text":"同官爲寮\n吾嘗同寮敢不心盡\n黜事　周禮\n分職\n分司\n僚友　同官\n官分職\n屬聯職\n同班\n相鄉　國語臧文仲曰\n不交言　後漢楊仁辟司徒桓虞府府掾有宋章貪奢者不佐仁終不與交言同席也\n同臺郎表取罪　後漢雷義同臺郎坐事當居罪刑義默然自表取其事\n代還錢　陳重有同舍郎負息錢重密以錢還\n疑盜絳　陳重同舍郎亡絳疑重所取重不自分明乃市絳償之後歸者歸絳其事乃顯\n盜金　直不疑爲郎告歸同舍郎亡金意不疑盜之不疑不自明買金償之後誤持去者來乃明\n近不偪同　魏代\n及爾同僚　詩\n併肩事主　漢"},{"id":"juan12-033","source":"正文","juan":"卷第十二","menu":"故吏第三十四","sub_menu":null,"page":"一四二","leaf":"三十六ウ","text":"任安　漢衛青日衰霍去病益貴門下故人多事去病唯任安不去\n避席　漢田蚡起爲壽坐皆避席魏其侯爲壽故人避席餘皆半席\n戎首　世說向雄爲河南郡主簿公事不罪太守劉准笞之後俱在朝不相往來晉武令復君臣之好雄曰臣於河內不爲戎首何以之有帝從之\n見泣　桓玄年七歲服終州府文武吏辭其叔父沖撫玄曰此汝家故吏玄號泣被面\n同升　胡廣伯始七爲三公故吏陳蕃李咸並爲三司每朝會蕃等常稱疾避廣時人榮之\n馬駛　蜀楊洪爲蜀郡時書佐何祇數年後爲廣漢太守每朝會祇次洪嘲之曰君馬何駛祇曰故吏不敢駛但明府未著鞭也"},{"id":"juan12-034","source":"正文","juan":"卷第十二","menu":"攝官第三十五","sub_menu":null,"page":"一四二","leaf":"三十六ウ","text":"名器不可假人\n官事不攝　管仲\n士會攝右　晉文公城濮之役舟之僑先歸士會攝右\n叔魚攝理　晉邢侯與雍子爭鄐田士景伯如楚叔魚攝理理獄官\n攝官承乏　衛侯將會使祝佗從辭曰臣展四體以率舊職猶懼不給而煩刑書若又共二俎大罪也共二謂兼二職也\n拜眞池　眞夒\n兼人之職\n不貳事　禮\n將效一官　敢有二事\n攝政　孔子爲司寇攝政七日誅少正卯\n兼二事　傳以諸梁兼二事謂令尹司馬\n假器"},{"id":"juan12-035","source":"正文","juan":"卷第十二","menu":"侵官三十六","sub_menu":null,"page":"一四三","leaf":"三十七オ","text":"侵官冒也一失其位不謀其政君子思不出其位各有司存思難\n不越官信也君子行無越思守不假器　挈瓶難假\n不能恤緯　傳嫠不恤其緯而憂宗周之殞\n焉用代庖　莊子庖人雖不理庖祝史不越樽俎而代之\n兼人之智　出位之思\n侵冒　越分思\n恭乃位\n出則有尤　如冒厥官過猶不及\n不貳事不移官　禮\n各司其局雖則奉公　且為出位\n行苟越思　動而生悔\n代斲易而生亂　過則有刑\n將效一官　敢有二事\n苟越思於乃職　亦速戾于厥躬\n律　諸越司侵職者杖七十議曰設官分職各有司存越其本司侵人職掌當杖之也"},{"id":"juan12-036","source":"正文","juan":"卷第十二","menu":"離局第三十七","sub_menu":null,"page":"一四三","leaf":"三十七オ","text":"失官慢也離局姧也一失其位寵名皆弃臣之失職常刑無赦一日失職則死及之叛官離次遐弃厥司慢官\n慢易既忘恤緯　是不理也\n各司其局　禮\n各揚其職　揚擧也\n廢職服刑　云云由官邪也\n尔尔　則死及之\n關擅去官　吉氏同産兄黃為長陵令時禁長吏擅去官黃聞司徒趙温薨以故吏違科奔喪司隸鍾繇收伏法\n徵書未至擅去　石崇為荊州徵為大司農以徵書未至擅去官免之\n旬日還　阮籍為東平相到郡法令清簡旬日郤乘驢而還\n出界　晉郭弈為野王令羊祜過之境送祜出界數百里坐此而免官\n辭軍營求免　後漢皇甫規威明為度遼將軍欲退身數上病不許友人王旻喪還規界迎因令客密告并州刺史胡芳令奏芳曰威明欲避第故激吾當為朝廷愛才何能申此子計遂不問也"},{"id":"juan12-037","source":"正文","juan":"卷第十二","menu":"濫官第三十八","sub_menu":null,"page":"一四三","leaf":"三十七オ","text":"爛羊　後漢更始官爵皆賈豎群小語曰竈下養中郎將爛羊胃騎都尉爛羊頭關內侯\n鴻都　後漢靈帝好學祭酒樂松賈護多引無行趍埶之徒並待詔鴻都門士君子皆深恥為之也\n貂不足狗尾續　晉趙王倫篡位同謀者越階次奴卒廝役亦加爵位每會貂蟬盈坐時人語曰貂不足狗尾續\n樂公樂卿　漢武時國用耗竭有司請置賞官名曰武功爵得至樂卿樂卿者朝位從九品加樂者別正卿人十九爵二十爵為樂公食公卿祿而無二也"},{"id":"juan12-038","source":"正文","juan":"卷第十二","menu":"賣官爵第三十九","sub_menu":null,"page":"一四四","leaf":"三十七ウ","text":"入粟拜爵　漢食貨志晁錯策重粟之道在於以粟為賞罰今募天下入粟縣官得爵得以除罪如此富人有爵農人有錢粟有所渫渫散也息列反帝從之也\n入奴為郎　後漢府庫虛乃募人入奴婢得以終身為郎先為郎者增秩\n入羊　又入羊為郎受爵賞欲移賣者無所流馳無所差次馳音移\n入粟　黃霸入穀沈黎郡補左馮翊二百石卒吏注云三輔郡得仕他郡為卒吏二百石九異也\n以貲為郎　張釋之以貲為郎注漢法貲五百萬得為常侍郎\n郎官　桑弘羊為均輸令吏人入粟補郎官至六百石食貨志云\n漢桓帝占賣關內侯又以貲為郎　司馬相如貲為郎非其好也\n賣公卿　靈帝開鴻都門賣官又私令左右賣公卿公千萬卿五百萬崔烈入錢得三公問子鈞曰我為三公人以為何鈞曰論者嫌其銅臭烈怒\n禮錢　後漢三公皆輸禮錢或以錢不足免\n西園　曹嵩輸西園錢位至太尉\n賂遺求達　魏張既德容為門下小吏家富自惟寒素念無自達乃常畜好刀筆版奏伺大吏有乏者給之以此見識達也\n賂遺求官　張讓專權孟他以蒲萄酒一斗遺讓讓拜他梁州刺史\n以貨買鴈門太守　見千謁門"},{"id":"juan12-039","source":"正文","juan":"卷第十二","menu":"詐稱官第四十","sub_menu":null,"page":"一四四","leaf":"三十七ウ","text":"御史　漢魏相為茂陵令御史大夫桑弘羊客詐稱御史止傳驛之傳舍也丞不以時謁客怒縛丞相疑其有姦收捕案致其罪\n漢使者　後漢公孫述使人詐稱漢使者假述輔漢將軍印綬"},{"id":"juan12-040","source":"正文","juan":"卷第十二","menu":"冒官第四十一","sub_menu":null,"page":"一四四","leaf":"三十七ウ","text":"司馬安　漢汲黯姊子司馬安文深巧宦官四至九卿以河南太守卒昆弟以安故同時至二千石者十人\n持祿固寵以周旋汲黯謂公孫弘曰　齊人多詐始與臣約與公卿建議皆背之\n遊五侯門\n漢五侯不相得賓客不同樓護君卿遊五侯門也盡能得其歡心"},{"id":"juan12-041","source":"正文","juan":"卷第十二","menu":"胥吏第四十二","sub_menu":null,"page":"一四五","leaf":"三十八オ","text":"恥於廝役　後漢趙曄為縣吏奉檄迎督郵曄恥於廝役弃車馬去從杜撫授韓詩\n陶侃　鄱陽人吳平徙廬江之尋陽早孤為縣吏\n胥徒小胥操牘\n吏部式　諸流外官滿未滿得勳五品已上敘勳執至省者陳牒請解於兵部續勞上經三年折當考者滿日從流外資敘不得輒敘勳階若六品以上勳及國勳不在此限\n小吏入令被中　光逸事具胥吏門注"},{"id":"juan12-042","source":"正文","juan":"卷第十二","menu":"申牒文書四十三","sub_menu":null,"page":"一四五","leaf":"三十八オ","text":"簿書文案牒\n月終　周禮小宰月終則以官府之敘受群吏之要注云每月之小計也以質冢宰受歲終令群吏致事注使齊歲之書者來今上計也\n具文　漢宣詔曰上計簿具文而已\n計簿書　黃霸為馮翊二百石卒吏領郡錢穀計簿書以廉正見稱也\n辭案　後漢周紆為齊相任刑法善為辭案條州內所則也\n自校簿　諸葛亮常自校簿顒直入諫曰為理有體上下不可相侵云云亮謝之\n呂範周谷　吳志初孫策吏呂範典主財物孫權私求必關白不敢私許當時見望權守陽羨長有私用策或料覆功曹周谷為傅著文簿使無問權臨時悅之及統事以範忠誠厚見信任以谷能欺更簿書不用也\n案牘簿領送解式　公式令諸州使人送解至京二十條已上二日付了四十條已上三日了一百條已上四日了二百條已上五日了\n不視文書　後漢向栩字甫興為趙相不視文書舍中生蒿萊\n治藏　周禮一曰府掌官契以治藏治藏文主財用簿書也\n贊治　史掌官書以贊治贊治令起草文書也失則名辟名者以官刑注辟名詐作書與實不相應也\n司書　主財用簿書\n文致　嚴延年治獄皆文致不可得反反音幡致至也密也言文案至密也\n多張文簿　計簿也\n計文不改　謂上計文書不改也\n對簿　謂獄訟文簿也\n擧書"},{"id":"juan12-043","source":"正文","juan":"卷第十二","menu":"才稱職第四十四","sub_menu":null,"page":"一四五","leaf":"三十八オ","text":"爵不踰德授方任能類能而使之任良物官君子使人也器之行爵出祿必當其位　月令\n量能授爵其人存則其政擧\n輪轅適用記曰司馬辨論官材　論辨然後官之任定然後爵之位定然後祿之也\n官有小大所貴授方　才有短長各宜適用\n任非其人則官邪而政廢　才稱所職必事擧而後成\n智以效官　才宜稱職\n薛宣換縣　宣為馮翊令潁川令薛恭與粟邑令尹賞換縣二縣皆理也"},{"id":"juan12-044","source":"正文","juan":"卷第十二","menu":"才過職第四十五","sub_menu":null,"page":"一四六","leaf":"三十八ウ","text":"趙魏則優　子曰孟公綽為趙魏老則優不可以為滕薛大夫\n恭賞皆理　換縣事見上門\n鳳棲　王渙辟仇香為主簿謂曰主簿不討陳文之罪得無少鷹鸇之志乎香曰以為鷹鸇不如鸞鳳渙乃謝曰枳棘非是鸞鳳所棲也\n驥展　龐統字士元劉備在荊州以士元為耒陽令在縣不理免官魯肅曰士元之才百里不足以展驥足備召士元與語大奇之乃以為治也\n割雞焉用牛刀　子謂子游\n屈而未伸宜展驥足　過猶不及馬用牛刀\n智以效官　才宜稱職\n位不充量　漢書\n人浮於食　禮\n不理　蔣琬公琰為廣都長蜀先主因遊觀奄至廣都眾事不理而又兀醉先主大怒將殺諸葛亮曰琬社稷之器非百里之才宜重察之乃不罪免官而已"},{"id":"juan12-045","source":"正文","juan":"卷第十二","menu":"才不稱職第四十六","sub_menu":null,"page":"一四六","leaf":"三十八ウ","text":"無德而祿殃也　舟之僑\n陳力就列不能者止　周任有言\n雖有其位苟無其德則素餐也\n辱高位尸祿　曹子建表君無虛授臣無虛受虛受是尸祿也\n以速官謗　而煩刑書\n求賢審官以資共理　陳力就列不能者止\n尸官之責圓鑿方柄\n折足覆餗　易曰鼎折足覆公餗言不勝任\n德薄而位尊力小而任重小人而乘君子之器　易負且乘致寇至負也者小人之事也乘也者君子之器也小人而乘君子之器禍斯及之矣\n才稱其職乃享擧績成　任非其能則官邪政廢\n薛恭之才但能理於小邑　公綽之用不可以為大夫\n智以效官　力宜稱職\n所宜擧德　安得尸食浮\n能小不能大　晉庾峻上疏吏歷試無績依古終身不仕則官無秕政矣能小而不能大可降還就小則人以器之"},{"id":"juan12-046","source":"正文","juan":"卷第十二","menu":"慎擇第四十七","sub_menu":null,"page":"一四七","leaf":"三十九オ","text":"難其人務在擇人明試登庸掄材官不必備惟其人\n防請託　漢何武君公問文吏必於儒者必於文吏以相參驗欲除吏先為科例以防請託也\n召故吏擇　尹翁歸字子兄吏家居田延年為河東守行縣至平陽悉召故吏五六十人親臨見有文者東武者西翁歸獨伏不起曰翁歸文武兼備唯所施設功曹以為不遜延年曰何傷召上辭問甚奇之是日擢卒吏\n進孤介　第五倫伯魚為蜀郡民吏富者以鮮車駕馬以財貨自達倫盡之調其貲贍者遣之選孤介志行者以與曹任於是爭財抑絕也"},{"id":"juan12-047","source":"正文","juan":"卷第十二","menu":"不能為政第四十八","sub_menu":null,"page":"一四七","leaf":"三十九オ","text":"君為政勿鹵莽　莊子\n未能操刀而使割　子皮欲使尹何為邑宰子產曰少猶未能操刀而使割也其傷實多\n美錦學製　子產謂子皮曰子有美錦不使學製焉大官大邑所以庇身而使學者製焉其為美錦不亦多乎\n僑聞學而後入政未聞以政入學也\n斯未能信　子使漆雕開仕對曰吾斯之未能信子悅注云未究習也\n賊夫人之子　子路使子羔為費宰子曰賊夫人之子言子羔未學而仕是賊害之人也子路曰有民人焉有社稷焉何必讀書然後為學子曰是故惡夫佞者也\n學優則仕　子夏\n上通而不困　上通位道\n不學牆面　作事惟煩\n學古入官政乃不迷　先學古訓而後入官\n授之以政不達　子曰誦詩三百授之以政不達雖多亦奚以為\n學善而教不能　則勸\n及門　仕進之門\n為學未能入室　篇名安可及門\n不能者止\n智效一官　莊子"},{"id":"juan12-048","source":"正文","juan":"卷第十二","menu":"俸祿第四十九","sub_menu":null,"page":"一四七","leaf":"三十九オ","text":"祿在其中豈無口實\n底祿以德寸祿營其寵祿事君敬其事而後食　食祿也\n祿不期侈\n與祿為期而自然侈\n退食自公不家食　易\n貴人而賤祿則民興讓　言尚賢而推賢不吝祿位\n非后不食　食祿也\n雖祿不期侈懼膏梁之易驕　而食不充虛豈匏瓜而可繫\n計日受俸　羊陟為河南尹云云又楊秉字叔節豫州刺史清儉計日受祿餘俸不入私門\n馭貴馭富　周禮太宰以八柄馭群臣一曰爵以馭其貴二曰祿以馭其富爵公侯伯子男至于大夫士也\n稍食　周禮均其稍食稍食祿廩也\n以制其食　制其等級\n上農之祿　周禮上農夫食九人凡下士視上農夫祿足以代其耕也中士倍下士上士倍中士下大夫倍上士卿四大夫祿君十卿祿也\n人浮於食　禮君子與其使食浮於人寧使人浮於食食祿也浮過也言才當使己才過於祿不使祿過其才亦不貪也\n公食　家食\n大祿小祿　君子不以小言受大祿不以大言受小祿\n伐檀　詩刺貪也在位貪鄙無功而受祿也\n始聞刈楚之榮　俄見伐檀之刺\n貪天之祿\n厚賢倍祿以功詔祿以久為奠食　食稍也既爵乃祿之者事成乃食之\n仕而未有祿　禮曰仕而未有祿者君有饋焉曰獻使焉曰寡君見在臣位與祿同也君有饋臣之道也\n位定然後祿之\n難得而易祿易祿而難畜　禮曰非時不見不亦難得乎非義不合不亦難畜乎先勞而後祿不亦易祿乎\n庶士倍祿　禮武王克殷庶民弛政庶士倍祿復紂時祿薄也\n季秋收秩祿之不富　不當私所增加也\n伐冰之家有菜地不畜牛羊\n秩膳　天子諸侯有秩膳\n百祿是荷\n勸從　傳制為祿位以勸其從也\n益俸　宣詔曰今小吏皆勤事而俸祿薄欲其無侵漁百姓難矣其益吏百石以上俸什五注云舊一石者則加五斗也\n仕不祿　處班\n益游徼祿　趙廣漢為京兆奏請令長安游徼獄吏秩百石　增秩以勵其行也其後百石吏皆差自重不　　　　　人　　任三公故稱以終身也\n給吏　蓋寬饒\n貨志在奉公俸錢半以給吏人為耳目之事也\n斗食屬　薛宣字贛君為大司農斗食屬注祿少計日以斗為數\n千祿什九在外什一在內　史記魏成子食祿千鍾什九在外什一在內是以東得卜子夏田子方段干木君皆師之\n增減　後漢光武增百官俸千石以上減西京舊制六百石已上增之\n助婚　任延時為九真守駱越舊無婚姻延以年齒相配貧者省俸助成之\n留一月　第五倫為會稽守俸纔留一月糧餘皆賑與民之貧羸者\n桓帝減公卿以下俸　貸王侯租占賣關內侯\n侏儒飽欲死臣朔饑欲死　東方朔曰侏儒長三尺奉一囊粟錢二百四十臣朔長九尺亦奉一囊粟錢二百四十云云\n辭俸　張安世少孺以父子封侯在位大盛乃辭不受祿詔都內別藏張氏無名錢以至於得數百萬計也\n贍貧　黃香為魏郡守分俸祿當賜班贍貧者豐富之家各出義穀云云\n不及妻子　周磐仕郡縣俸祿不及妻子皆以供賓客\n制祿　周禮\n代耕禮\n辭粟　原氏為宰與粟九百辭子曰毋以與爾鄰里鄉黨乎注祿所當受不宜辭\n行爵出祿必當其位　月令"},{"id":"juan12-049","source":"正文","juan":"卷第十二","menu":"世祿第五十","sub_menu":null,"page":"一四九","leaf":"四十オ","text":"世祿之家鮮克由禮　書\n匄也先君守官之嗣　范宣子言嗣先君之守官\n又曰匄之祖自虞為陶唐氏夏為御龍氏商為豕韋氏周為唐杜氏晉主夏盟為范氏其不朽之謂乎穆叔子曰此之謂世祿非不朽也　傳\n子產曰孔張君之昆孫執政之嗣也為嗣大夫\n漢任子令　漢公卿子多以父任為郎王吉曰舜湯不用三公之世而擧皋陶伊尹請除任子令\n子為郎　漢徵馮唐唐年九十不能為官乃以唐子遂為郎遂字王孫也\n為子求官　桑弘羊自以為國家興筦權之利伐其功欲為子弟得官怨霍光謀反遂誅滅\n伐檀之刺"},{"id":"juan12-050","source":"正文","juan":"卷第十二","menu":"祿不兼利五十一","sub_menu":null,"page":"一四九","leaf":"四十オ","text":"畜馬乘不察雞豚伐\n冰之家不畜牛羊百乘之家不畜聚斂之臣　禮\n仕則不稼　田則不漁\n織蒲　臧文仲妾織蒲仲尼曰三不仁\n天分　董仲舒曰天之分與之上齒者去其角傅其翼者兩其足是受大者不得取小故受祿之家不與人爭利\n拔葵　史記公儀休相魯拔園葵而棄之見家織布出妻焚機云欲令農夫女工安所售其貨者乎\n免官削爵　貢禹欲令近臣自諸曹郎侍中以上家無聞私販賣與人爭利犯者輒免官削爵不得仕官\n王永陳五事　魏王永欲令官實祿厚以廉恥為尚不使與百官"},{"id":"juan12-051","source":"正文","juan":"卷第十二","menu":"寬猛相濟第五十二","sub_menu":null,"page":"一五〇","leaf":"四十ウ","text":"政寬則民慢猛則民殘　仲尼曰政寬則民慢則糾之以猛則民殘則施之以寬寬以濟猛猛以濟寬故政是以和也\n火烈水懦　子産謂太叔曰唯有德者能以寬服人其次莫如猛夫火之烈民望而畏之故鮮死焉水懦弱人狎而玩之則多死故寬難太叔為政不忍猛而寬鄭多盜太叔悔之\n韋弦兼佩　昔人有性急佩韋自戒性寬佩弦自戒\n吐茹合宜　詩云柔亦不茹剛不吐\n不剛不柔"},{"id":"juan12-052","source":"正文","juan":"卷第十二","menu":"替代第五十三","sub_menu":null,"page":"一五〇","leaf":"四十ウ","text":"及瓜　齊使連稱管至父戍葵丘瓜時而往及瓜而代\n嗣掌某月　周禮注云代主一月\n五巳無愠　楚子文三仕為令尹無喜色三巳之無愠色舊令尹之政必以告新令尹\n迭代功成者去\n君子三揖而進一辭而退\n策名隨牒合符　後漢傅燮字南容州將范律明知人舉燮孝廉後燮為漢陽太守律文代合符而去鄉邦榮之\n矯代　史魏信陵君無忌請救趙魏王畏秦不許趙告急於公子公子之客入王宮盜節矯代晉鄙不設備公子遂入鄙軍錐殺鄙而代將其軍遂救趙也\n吏書　漢段會宗為西城都護騎都尉三歲吏書還為沛太守邊吏三歲一更也\n終更亟還　谷永與會宗書云云\n親友　魏陳矯為廣陵功曹使過太山太守薛悌異之結為親友戲謂曰吏而二千石鄉國屈從陪臣儕不亦可乎及為郡及尚書令皆代矯\n舉　吳周瑜病舉魯肅有智略足以代瑜\n父子相代　見父子門注\n智效一官　莊子\n考績之期　三歲一考\n三考黜陟\n授受不替孟盟\n蕭何舉曹參\n邴吉知人　吉為丞相病篤上自臨問曰與有不諱誰能代卿對曰西河太守杜延年明於法度今在郡治有能名廷尉于定國執憲詳平天下可以無冤太僕陳萬年事後母孝三人皆在臣右惟上審之及相君之由進皆稱職上謂吉知人"},{"id":"juan12-053","source":"正文","juan":"卷第十二","menu":"官闕急第五十四","sub_menu":null,"page":"一五一","leaf":"四十一オ","text":"毀舊府　晉羊祜督荊州時長吏喪官人多毀舊府祜以死生有命下符禁之\n請替惡闕　范寧求補豫章帝曰不宜令守無以身試死寧臨行上疏云云公見於幽闕可以經夷險而不變\n不敢居官　晉樂廣為河南尹官舍多恠前尹不敢居廣居之"},{"id":"juan12-054","source":"正文","juan":"卷第十二","menu":"休假第五十五","sub_menu":null,"page":"一五一","leaf":"四十一オ","text":"休歸休請從吉休沐歸休請急長假　並假名也\n予告賜告　漢律令二千石有予告有賜告予告者在官有功最法所當得者也賜告者病滿三月當免天子優賜其告使帶印綬將官屬歸家治疾至成帝時賜告不得歸家自馮野王始杜欽言於王鳳曰竊見令云吏二千石告過長安謁不分別賜予令有司以為予告得歸賜告不得是一律兩科失省刑之意夫三最予告也注在官連有三最則得予告也病滿賜告詔恩也今告則不得失輕重之差鳳不聽竟免野王後遂為常也\n過長安謁　漢令曰吏二千石過長安謁注云謁者自白得告也律吏二千石已上告歸歸寧道不過行所在者便道之官無辭\n漢律五日一沐　漢律吏得五日一下言休息以洗沐也\n晉令一月五給　晉令給假者一月五給一年之月六十日為限里内者病疾中走二百千日及道路解散九十五日也\n解職　晉起居注武帝詔大臣疾假滿三月不差解職\n弔死問疾　後漢祝諮字子春篤於仁義為吏休歸先周旋鄉里弔死問疾畢乃還家\n恤喪拜老　後漢吳馮字子惠為郡吏每休假竟存恤行喪孝子次瞻疾病拜謁耆老然後還家\n定省　宋書王敬弘子恢之為秘書郎恢之常請假東還定省\n遊集　世說東武子為侍中與東亭諸人期共遊集乃早請給\n荷擔　後漢許荊字子張家貧為吏休假常單步荷擔請業於鄉黨\n策杖　後漢范丹字史雲為郡功曹每休假常單步策杖\n山郎　漢書故事郎出錢市財用給文\n書乃得出名曰山郎注云山財所出故曰山財ム稱疾一日輒償一休注云出財者非貧常在外貧者實病皆以休假償之ム豪富郎日出遊戲得善部化貨賂流行傳相放效楊惲為中郎將罷山郎移長度大司農以給財用一歲之度ム私病休謁洗沐以從事郎化之莫不自厲之\n長久謂不肯休　薛宣為馮翊時日至休吏賊曹掾張扶至日猶不肯休坐曹治事宣出教曰蓋禮貴和人道尚通日至吏以令休所繇來久曹雖有公事家亦望私恩意掾宜從衆歸對妻子設酒肴請鄰里一笑相樂斯亦可矣扶大慚\n不與休　魏志劉馥為郡宰吏不與休假專使為不急也\n退食自公\n休沐未嘗出門　張安世精力於職\n多病賜告　汲黯多病病且滿三月上常賜告者數焉終不愈\n不欲出　文帝寵鄧通通亦願謹不外交雖賜洗沐不欲出也\n又　董賢聖卿便僻善媚每賜休沐不肯出歸常留中視醫藥哀帝乃詔賢妻得通籍殿中\n違假　史李園求事春申君為舍人謁歸故失期還謁春申君問之對曰齊王使使求臣女弟與使者飲故失期也\n又　賈逵梁道為豫州刺史兵曹從事受前刺史假達到數月乃還逵考竟之也\n不限日\n拜墓假　晉陸曄士衡尚書求歸鄉里拜墳墓有司奏舊制假六十日顏含馮懷以為曄居台司受託付大臣之義奉在忘己既葬詣省墳墓宜容上用輒聽謂宜還自還不須制曰詔從之\n葬妻　魏舒元陽為尚書三喪妻皆亡是年自表乞假葬妻詔賜地及錢"},{"id":"juan12-055","source":"正文","juan":"卷第十二","menu":"舉薦第五十六　不薦士附","sub_menu":null,"page":"一五二","leaf":"四十一ウ","text":"禹稱善人不善而遠矣　也稱舉\n舉不失德\n出淹滯　趙宣子為政\n振廢滯\n祁奚舉善　舉讎舉子君子曰能舉善矣\n刈其翹楚\n務在擇人\n選於衆　舜有天下選於衆舉皋陶不仁者遠矣湯有天下選於衆舉伊尹不仁者遠矣\n柔彼髦士　承進也\n夫舉無他唯善所在　選以\n所試　如有可譽者其有所試矣\n無求備於一人\n或以事舉或以德進或以言揚\n待舉待取　儒有席上之珍以待\n問懷忠信以待舉力行以待取\n推賢而進達　儒有推賢而進達之不望其報\n善不可失\n取節於葑菲\n考其德藝　周禮\n舉以賢良　漢令諸侯舉賢良方正直言極諫之士茂才輒以名聞也\n引薦白屋士\n對揚紫殿　劉琨\n非常之才　不次之用\n急賢推士　鄭當時好進賢推士\n推擇　揚\n濟濟之多士\n舉類　傳稱推其善政薦舉其類\n顯忠遂良\n旁求\n上薦\n登庸群材　允釐庶政\n人代天工\n雍熙可致　賢為國寶太階必揚\n當仄席之求　之選\n膺及門\n道既自彰　賢亦歲貢\n稽諸虞典\n審九德而擇賢\n考彼諸侯章懸四科而取士　漢三公辟召以四科取士一曰德行高妙二曰通經學三曰議法令四曰剛毅多略也後漢書\n進賢達吏　周禮太宰以八統御萬人三曰進賢四曰　能七曰達吏謂二學勤勞之小吏也\n賢能之書　周禮鄉大夫獻賢能之書于王王再拜受之登于天府注書謂賢者名也王拜受之重得賢也\n及門　進仕之門\n同升諸公\n君子干時實雅難進　主司取士亦不易知\n俊造　俊士造士也\n士之秀者始以名稱　察因事舉\n舉賢使能\n賓既升歌於鹿鳴　將長武王於鹿鳴獻之\n明效\n為稱善人　庶使衛多君子\n推轂\n坐舉人　漢華陰守丞嘉上封事言朱雲可試守御史大夫坐之\n拔茅　易拔茅茹以其彙言賢人能進拔同類也\n無行　韓信家貧無行不得推擇為吏\n薦武士　叔孫通專言群盜壯士進之弟子百餘人怨通通曰漢王方蒙矢石諸生寧能鬪之\n狐裘反衣　漢揚興言於史高曰將軍　學不過門下賓客富貴在身蔑士不學是有勢白衆而反衣之乎原匡衡材將軍有餘遠方高乃辟衡為議曹吏\n提衡　張湯杜周相為提衡\n引重　竇嬰灌夫二人相為引重\n事也\n處士薦人　符融公府連辟皆不應太守馮代有名稱到官請融相見融一往薦達鄉閭士范冉韓卓孔伷三人因辭自絕\n抗孤士　　　曰韓賢之操不能抗一孤士以其下乎\n為將用儒士　後漢蔡遵為將軍取士皆用儒術\n有私　或問第五倫公有私乎對曰人有與吾千里馬者不受每三公有所選舉心不能忘而亦終不用豈可謂無私乎\n薦士不薦士　後漢杜密為北海相去官居家每謁郡守多所陳託同郡劉勝字季陵亦自蜀郡告歸閉門掃軌無所干及太守王昱謂密曰劉季陵清高士密知昱以激己對曰勝位為大夫見禮上賓而知善不薦聞惡無言隱情惜己同於寒蟬此罪人也令有違力行之士不亦薦分之一乎昱慙而服其言也\n恥舉士　張儉元節舉茂才以其刺史非其人謝疾不起\n兄弟頻舉　吳劉繇字正禮兄岱字公山平原陶丘洪薦劉繇欲舉正禮刺史曰前年已舉公山洪曰若用公山於前擢正禮於後所謂御二龍於長途騁騏驥於千里也\n卧龍　蜀先主　　徐庶曰諸葛孔明卧龍也不可屈致將軍宜枉駕\n管庫　趙文子為政舉管庫之士七十有餘家死不屬其子\n薦盜　管仲於萑盜中拔二人用之曰可人也其所與遊辟也\n察舉揚歷　魏王基揚歷注謂其所能而歷試\n出自幽谷遷于喬木\n伐木丁丁鳥鳴嚶嚶　喻朋友相引薦甚綱延\n舉自代　丙吉病上問誰可代君對曰杜延年明法度于定國執憲詳平陳萬年篤學於行後皆稱職士以為有知人之鑒\n不\n又舉　　　　　　　自代\n又　鍾皓為功曹太守問誰可代曰西門亭長陳寔寔曰鍾君似不察人何獨識我\n薦士　語舉茂才賢良無所薦景監見人知其不豹令士上問之曰平生未常交士衛般因得臣舉亦非榮故不敢薦之\n不舉雜學　山簡季倫領吏部上疏請公卿各舉所知長吏邑宰無異者皆以名奏得才之路廣聽政曰令公卿先議選舉各言所知彼先數是當人於朝與衆共之義朝廷從之\n邑宰\n舉　魯恭為中牟令　　方帝卿微方與公卿\n有密進不舉　　　王龔為西郡守郡吏王青祖父與　　起兵攻王莽　　之以"},{"id":"juan12-056","source":"正文","juan":"卷第十二","menu":"舉薦第五十六　不薦士附","sub_menu":"（續）","page":"一五五","leaf":"四十三オ","text":"陸為都尉功曹青為小吏與父俱從都尉為賊陸以身蔽全都尉死於難青亦被創舉天爵太守以青有金瘡不能舉顧歎其一門忠義遂薦青三世死節宜蒙顯異辟舉尋假百道祖父所有賜官勅假受之後太守勸假官欲舉為孝廉假曰先人所賜不可改之也"},{"id":"juan12-057","source":"正文","juan":"卷第十二","menu":"舉選第五十七","sub_menu":null,"page":"一五五","leaf":"四十三オ","text":"觀國之光利用賓于王　易\n我有好爵\n鴻漸于陸　于干于盤漸進之義\n遷喬\n烝我髦士　承進也\n翹翹錯薪言刈其楚　詩\n獻賢能之書　周禮鄉老及鄉大夫羣吏獻賢能之書于王王再拜受之登于天府\n禮凡語郊者必取賢斂才焉　或以德進或以事舉或以言揚\n樂正論造士之秀者升於司馬曰進士進士論辨然後使之司馬辨論官材論進士之賢者以告於王而定其論　各署其所長也\n舉不失選　傳\n署行議年　高詔中丞執法郡守舉有明德者遣詣相府署德議年年幾也行狀也\n計偕　武詔吏人有明當世之務習先聖之術者縣次續食令與計偕縣次給之食\n仲舒發之　武帝隆儒術及仲舒對策推明孔氏抑百家立學校州郡舉孝廉茂才皆仲舒發之\n三適　武帝時公卿議曰古者諸侯貢士一適謂之好德再適謂之賢三適謂之有功乃加九錫賜以弓矢車馬也不貢士一則黜爵再則黜地三而削地畢矣不舉孝不奉詔以不敬論不察廉不勝任當免奏可也\n本仁祖義襃德祿賢五帝三王所由昌也　武詔\n得眞　宣詔舉廉吏誠欲得眞也吏六百石位左右有罪自今以來毋得以云云不復舉為審令\n內忠未發　平詔諸有職及內惡未發而薦舉者勿案驗\n四科　漢制見上薦舉門\n三互　後漢以州郡相當黨又情比周乃制婚姻家及兩州人士不得對相監臨後有三互法禁忌轉密選用艱難蔡邕上疏宜去三互法帝不省士不死\n限口舉人　後漢丁鴻與司空劉方上言自今郡國率二十萬歲貢孝廉四十萬二人六十萬三\n人八十萬四人以此為制歲不滿二十萬二歲一人不滿十萬口三歲一人蠻夷錯雜不為數總令十萬戶察孝廉一人所秀不拘戶口\n限年　又尚書令左雄議改察舉之制限年四十儒者試經學文吏試章奏朝廷駁之曰選用材無拘定制六奇之策不出經學鄭阿之政非章奏所能入用年乘禀仕終賈揚聲亦在弱冠帝不從遂班下郡國唯茂才異行者不拘年\n清儉　太祖為丞相司空毛玠為東曹掾與崔琰並典選舉所用皆清正之士雖於時有盛名而行不由本者終莫能進務以儉率人由是天下莫不以廉節自勵雖貴寵之家輿服不敢過度和洽字士陽議儉非中道云云\n守文　衛臻典選舉蔣濟與書曰漢以亡虜為將周拔奇卒為太師何必守文答曰古人遺智惠心而任度量須考績而加黜陟今子開拔奇之律使天下馳騁也\n畫地作餅　魏盧毓為吏部尚書諸葛誕鄧颺等馳名譽有四聰八達之謂帝疾之時舉中書侍郎詔曰莫取有名名如畫餅言不可啖也毓曰名不足以致異人可以得常士常士畏教慕善然後故者毓奏以言明試以功考績法廢故眞偽相蒙帝詔作考績法\n不抑寒素　王蘊為吏部郎不抑寒素每一官缺求者十輩無所是非連狀白之某人有地某人有才各隨其方不得者不怨之也\n山濤啓事　山濤為僕射典選吏部前得其才再居十餘年一官缺輒啓數人甄拔人物各為題目時稱曰山公啓事也\n甲午制　王戎為吏部為甲午制凡選舉先治百姓然後授任也\n門調戶選　司隸傅咸奏戎曰書稱三載考績今內外羣官職未朞而奏遷未之優劣且送故迎新官免戎戎與賈郭通親得不坐戎自典選舉未嘗進寒素退虛名與時沉浮門調戶選而已\n後漢四科　黃瓊以左雄孝廉之選專用儒學文吏少猶有所遺及增孝悌及能從政為四科\n宴鹿鳴　選舉令諸貢人上州三人中州二人下州一人必有才堪者不限其人數貢申送之日行鄉飲酒禮牲用少牢歌鹿鳴之詩\n賓薦鄉賦\n光國\n進士秀才　考課令進士試時務策五條帖大經通四其策文辭順序義理極當并帖經文過者為通帖策全通為甲第諸秀才試方策五條文理俱高者為上上文高理平理高文平為上中云云\n未成分數　考功式諸州及國子監貢舉人試官須對長官制官共加考試至省及第不成分數者其罪以\n長官爲從辟未成分落第人內有格試假不遜一者亦依不成分例\n冒貢薦延病例　僕射武問文吏於儒者問儒者於文吏以相參驗除吏先爲科條以防請延\n以貌以言宣父尚云有失　孔子曰吾以言取人失之宰予以貌取人失之子羽\n則惠則哲帝堯亦曰其難\n充賦　晁錯策曰乃以臣錯充賦\n十室之邑必有忠信三人同行厥有我師今闔郡不薦一人是化不下究而積行之君子壅於上聞也　武詔"},{"id":"juan12-058","source":"正文","juan":"卷第十二","menu":"舉選第五十七","sub_menu":"（續）","page":"一五七","leaf":"四十四オ","text":"州叛廢舉　孔坦君平帝手册問曰吳興徐馥爲賊殺郡將今應舉孝廉合否坦曰罪不相及今徐馥爲逆何妨一郡之賢也"},{"id":"juan12-059","source":"正文","juan":"卷第十二","menu":"知人第五十八","sub_menu":null,"page":"一五七","leaf":"四十四オ","text":"知人則哲唯其難之　書\n知人者智　老子\n子桑其知人也能舉善也\n知孟明而舉\n舉爾所知　仲弓曰焉知賢才而舉之子曰舉爾所知爾所不知人其舍諸\n子桑之舉孟明\n鮑叔之知管仲　史　齊桓霸焉管仲之謀天下不多管仲之賢而多鮑叔能知人也\n人不易知\n患己不知人也\n始以智知　終因德進\n叔向之知鬷蔑\n申於知己　史越石父賢在縲紲晏子出遭之解左驂贖之載與歸不謝入久之石父請絕晏子懼攝衣冠以謝之石父曰君子屈於不知己而申於知己也\n趙貢知薛宣　瑯邪太守趙貢行縣見而奇薛宣還府令妻子與相見戒曰君至丞相我兩子亦中丞相史\n第五倫所舉吏多至二千石\n法眞稱胡廣　後漢胡廣爲南郡散吏太守法雄子眞知人歲終雄勑眞助於守雄命請吏眞自牖間占之乃指廣自舉孝廉京師試章奏爲天下第一雄以爲知人字伯黃\n王諶舉种暠　种暠爲縣門下吏河南尹田歆外生王諶知人歆曰今當舉六孝廉多得貴戚書以王應之欲自用一人善者以報國爾助我求之諶送客至洛陽郭遙見暠曰得孝廉矣歆曰當山澤隱滯此近洛陽門下吏耶諶曰山澤不必有異士異士不必出山澤歆召暠\n辭詣闕事辭劉有據遂舉孝廉官至司徒\n外靜內銛　魏曹爽秉政用何晏爲吏部尚書傅嘏謂爽弟羲曰何平叔外靜內銛巧好利不念務本吾恐必先惑子兄弟\n賓饌託子　魏賈逵知名見童時爲郡功曹勝設賓饌請之妻笑曰童昏小兒勝曰方伯之器以子託之後逵爲漢陽太守\n勸令兄弟別族　吳錫世少獲有名陸遜請之數勸以禮別族\n南州冠冕　龐統少朴鈍司馬德操有知人鑒統往見操採桑樹上統坐樹下自晝達夜操稱之爲南州冠冕也\n小吏結交　後漢吳祐字季英舉孝廉將行郡中爲祖道祐越壇共小吏雍丘黃眞歡語移時與結交而別功曹以爲倨請黜之太守曰吳季英有知人之明卿且勿言眞後亦舉孝廉\n取陳遼徐晃於亡虜　魏太祖拔于禁樂進於行陣取張遼徐晃於亡虜\n許郭之鑒　後漢郭太字林宗許劭字子將咸有知人之鑒故天下言拔士者咸稱許郭之鑒\n知無實行　漢中晉文經梁國黃子艾並恃才智炫耀上京三公府見辟召禁問訪之隨其臧否以爲與奪符融謂李膺曰二子行業無聞恐小道破大義公宜察焉膺然之後果輕薄並以罪廢棄也\n衆中識　晉孟嘉方年少知名庾亮大會州府人士嘉坐甚遠褚裒問亮聞江州孟嘉其人何在亮曰在坐卿但自覓裒歷觀指嘉曰此君小異得無是乎亮大笑得嘉\n知子　石苞臨終分財與諸子不及崇崇母爲言苞曰此兒雖小後自能得\n賞御人　石苞仲容爲縣令會謁者郭玄信奉使求人爲御以苞及鄧艾給之行十餘里玄信謂二人曰子後並當至卿相苞曰御隸也何卿相乎\n拔擢　杜密周府爲太山守行春見鄭玄爲鄉佐知其異器　召署郡職遣就學也\n顯拔　第五倫伯魚爲宕渠令顯拔鄉佐玄賀賀後爲二郡守以清絜稱也\n嗇夫　鄭弘巨君爲鄉嗇夫太守第五倫行春見而深奇之署督郵\n一日千里　秦後漢書曰王允字子師世仕州郡爲冠蓋郭林宗見而奇之曰王生一日千里王佐才也遂與之友道王允至司徒"},{"id":"juan12-060","source":"正文","juan":"卷第十二","menu":"藻鑒第五十九　品藻附","sub_menu":null,"page":"一五八","leaf":"四十四ウ","text":"月旦評　後漢許劭與兄靖俱有高名共覈論鄉黨人物每月更品題由是汝南俗有月旦評也\n道廣　許劭到潁川不詣陳蕃或問其故劭曰太丘道廣廣則難周仲舉性峻峻則少通也\n角立傑出　桓帝徵徐穉等不至因問陳蕃徐穉袁閎韋著\n誰宜先後蕃曰閎王公之族聞道訓者生三輔仁義之俗不扶自直穉爰自江南卑薄之域角立傑出宜爲先也\n萬頃之陂　郭林宗至汝南見袁閬不宿而去從黃憲累三日乃辭勤問曰奉高之流清而易挹叔度汪汪若萬頃之陂澄之不清撓之不濁也\n蒹葭倚玉樹　魏明帝使后弟毛曾與夏侯泰初共坐時人謂之蒹葭倚玉樹泰初如朗月入懷\n玉人　晉王敦以衛玠爲玉人稱王夷甫處衆中如珠玉在瓦礫閒也\n璞玉渾金　王戎曰山濤如璞玉渾金人知其寶莫知其器\n趙魏老　子曰孟公綽爲趙魏老則優不可以爲滕薛大夫\n無皁白　鍾皓兄子覲李膺姊之子也覲與膺年齊並有令名覲有退讓之風膺謂覲曰孟軻以人無是非之心非人也公何太無皁白覲以白皓皓曰元禮祖在位諸父並盛韓公之胤故得然國武子好招人過以致怨本今豈其時以道是也\n王肅三反　魏劉寔以王肅忠於事上好下接己一反也性嗜榮貴不求苟合二反也吝惜財物而理身不穢三反也\n吳主聰明仁智　吳使趙咨於魏魏帝問吳王何等主對曰聰明仁智雄略之主納魯肅於凡品是其聰拔呂蒙於行陳是其明獲于禁而不害是其仁取荊州不血刃是其智據三州虎視天下是其雄屈身於陛下是其略\n擬人必於其倫　禮\n銓度　語國\n稱述多過　蜀龐統字士元爲郡功曹性好人倫每稱述多過其才人問之統曰亂世善人少惡人多今不美其言則聲名不足慕而爲善者少矣拔十得五猶得其半使有志者自勵不亦可乎\n商榷人物　龐統至吳吳多聞其名及西還並會昌門陸績顧邵全琮皆往統曰陸子可謂駑馬有逸足之力顧子可謂駑牛能負重致遠謂全琮曰卿好施慕名有似汝南樊子昭雖智有不多亦一時之佳者也\n題目　龐德公自謂諸葛孔明爲卧龍龐統士元爲鳳雛司馬德操爲水鏡\n又　裴楷目夏侯玄云肅肅如入宗廟但見禮樂器鍾會如觀武庫森森但見矛戟在前傅嘏汪廧靡所不見山濤若登山臨下幽然深遠\n問用人　吏部郎闕文帝問其人於鍾會會曰裴楷清通王戎簡要皆其選也於是以楷爲之\n問人物　蜀關羽雲長聞馬超來降舊非故人與諸葛亮書問超人才誰比亮知羽護前乃答曰孟起兼資文武雄烈過人一世之傑黥彭之徒當與益德並驅爭先猶未\n及髯之絕倫逸羣也羽美鬚故亮謂之髯羽大悅\n有白風起　世說嵇中散語趙景眞卿瞳子白黑分明有白風起恨量小狹景曰尺表能審璣衡之度寸管能測往復之量何必在大但問識見如何也\n又　世說諸葛瑾弟亮及從弟誕有盛名各在一國于時以爲蜀得龍吳得虎魏得狗\n又　世稱庾文康爲豐年玉稚恭爲荒年穀也"},{"id":"juan12-061","source":"正文","juan":"卷第十二","menu":"失所舉第六十","sub_menu":null,"page":"一六〇","leaf":"四十五ウ","text":"蔿賈曰子玉之敗子文之舉也舉以敗國將何賀焉　傳\n叔孫穆子好善而不能擇人　謂用不賢\n不慎所舉\n君子不以言舉人\n以言取人失之宰予以貌取人失之子羽　宰予言語之科而不仁澹臺滅明字子羽貌寢而賢\n徒多推士之名　舒多知人之智\n面欺之罪　孔融薦禰衡表云人不易知受面欺之罪\n舉能之官惟爾之能所舉得人亦爾之能　周書\n稱匪其人惟爾不任　言是爾不稱其任也\n公議得失　　諸葛誕爲吏部郎人有所屬輒顯其言用之後有得失則公議舉者百僚由是慎其所舉也\n擇善得人必聞有賞　非才而舉安可無辜\n驗言觀行　子曰始吾於人也聽其言而信其行今吾於人也聽其言而觀其行也\n苟於人而聽言　則舉事而失德\n始聽言而信行　汝得人焉\n及論事而稽功　子所否者\n既貌取而失人　何面欺而逃責\n雖入貢於鹿鳴　宜奉身而歸退\n謝失舉　宋弘薦桓譚君山爲議郎給事中令君山鼓琴好其繁聲弘聞召譚責之譚後於帝前鼓琴見弘失其常度帝怪問之弘免冠謝曰臣所以舉譚望以忠正導主而令朝廷耽悅鄭聲臣之罪也帝乃改容謝弘\n席藁　史記范睢任鄭安平爲將擊趙爲趙所圍以二萬人降趙睢席藁請罪王稽爲河東守三年不上計坐誅睢曰不擇\n受失舉之謗　陳寔字仲弓爲郡功曹時中常侍侯覽託太守高倫用吏倫教署爲文學掾寔知非其人曰\n太守此人不宜用侯常侍不可違寔從外署見座明德從之人怪寔失舉寔終不言\n漢張勃舉陳湯　湯父死不奔喪坐勃奪爵削戶二百卒因諡曰繆"},{"id":"juan12-062","source":"正文","juan":"卷第十二","menu":"坐舉主第六十一","sub_menu":null,"page":"一六一","leaf":"四十六オ","text":"盤辟雅拜　漢司隸何武舉方正見盤辟雅拜有司以爲詭衆　僞坐左遷楚內史\n妄舉　華陰丞嘉言朱雲兼資文武可試守御史大夫匡衡以爲大臣國家股肱明主慎擇嘉小生狂言妄稱舉薦嘉竟坐\n貶秩　嚴延年於獄吏書通會其吏有贓不入身坐舉不實貶秩笑曰後敢復有舉人者\n慙自絕　後漢王丹字仲回客有薦士於丹者因選舉之後舉者犯罪丹坐免客慙自絕丹召曰何量丹之薄也不設食以罰之相待如舊也\n慙自殺　濮陽令舉吏王昱於韓宣宣奉召昱妻受因囊錢昱寶不知後人言之昱慙自殺宣乃雄其烟也\n請罪失舉　丞相舉宋挺爲官有六百匹正刑棄市遇赦免　武陵舉阮抗請爲長史司直劉隗字大連劾抗請治罪\n劾舉主　晉崔洪良伯薦郤詵爲左丞詵後紀洪洪謂人曰我舉詵詵還奏我是挽弓自射也詵聞曰趙宣子舉韓厥爲司馬以聯法戮宣子之僕宣子喜曰可賀我矣崔侯爲國舉才我唯是視云云洪聞重之也\n劾舉主失舉　左雄薦周舉舉稱職後雄又舉馮直爲將而直嘗以臧受罪舉劾雄雄喜曰宣光奏吾不失舉也\n○至公舉　附坐舉主門\n夫舉無他唯善所在親疎一也\n不受謝　晉羊祜叔子所薦舉人人未嘗知曰拜爵公朝謝恩私室豈人臣之節\n恐知　孔光有所薦舉唯恐人知\n不薦門人　孔光魯恭事眞師門\n公言得失　魏諸葛誕爲吏部郎有人屬託輒顯其言而用之後有當否公言得失以爲褒貶自是群寮莫不慎舉\n不可干以私　尹翁歸子況爲東海守辭廷尉于定國定國家在東海欲託邑子終日竟不言去後謂邑子曰此賢不可以私干也\n恨其謝　張安世嘗有所薦其人來謝安世大恨以爲舉賢達能豈有私謝邪絕不復爲通\n絕書屬　後漢史弼字公謙爲河東守當舉孝廉弼知多權貴請託乃先勑絕書屬中常侍侯覽果遣諸生齎書請之弼大怒笞生數百付獄考殺之\n非選次　毛玠孝先典選舉文帝爲五官將親自詣玠屬所親眷玠曰老臣以能守職免戾今所說人非選次不敢奉命"},{"id":"juan12-063","source":"正文","juan":"卷第十二","menu":"讓舉第六十二","sub_menu":null,"page":"一六二","leaf":"四十六ウ","text":"陳雷　後漢雷義仲公舉茂才讓於陳重刺史不聽義遂佯狂被髮走鄉里曰膠漆自謂堅不如陳與雷"},{"id":"juan12-064","source":"正文","juan":"卷第十二","menu":"舉親第六十三　附不舉","sub_menu":null,"page":"一六二","leaf":"四十六ウ","text":"楚君之舉也內姓選於親\n祁奚舉子午\n君子曰立其子不爲比　祁奚請老晉侯問嗣焉稱解狐其讎也將立之而卒又問焉曰午也可午奚子也君子曰能舉善也稱其讎不爲諂立其子不爲比\n祁奚內舉不失親\n豈獨遺我乎　叔向曰\n魏子近不失親　魏舒舉魏戊同縣問成鱄曰吾與戊也縣人以爲黨乎成鱄曰夫舉無他唯善所在親疏一也仲尼曰近不失親遠不失舉可謂義也\n儒有內稱不避親　禮\n不敢用親　得賢有賞\n唯善所在　雖親何傷\n唯賢是求　坐舉\n舉兄子　晉以苻堅寇邊朝廷求文武將鎮禦北方謝安以兄子玄應舉郗超與玄不協曰安違衆舉親明也玄必不負舉也\n舉子　呂氏春秋魏公叔痤病惠王問之公叔曰臣庶子鞅願任之國政若不用勿使出境王不應謂左右曰公叔勃也後鞅果西入秦秦用之而彊魏　舉也　　也\n無行不舉　漢書義縱少時與張次公俱攻剽爲群盜姊以醫幸王太后后問有兄弟欲爲官乎曰有弟不可乃拜之"},{"id":"juan12-065","source":"正文","juan":"卷第十二","menu":"自舉第六十四","sub_menu":null,"page":"一六二","leaf":"四十六ウ","text":"東方朔自舉曰　臣少失父母長養兄嫂身長九尺五寸學書三冬文史足用云云可以爲天子之大臣否\n文武兼備　漢田延年爲河東太守至平陽召吏令文者東武者西尹翁歸獨伏不肯起曰翁歸文武兼備何所施設\n願守長安令　漢馮野王字君卿年十八上書願守長安令宣帝奇其志欲用丞相以爲不可也\n張敞　渤海膠東盜賊並起敞上書請自治之徵拜膠東相盜賊並解散\n自比管樂　蜀諸葛亮孔明自比管樂時人莫許唯崔州平徐元直信然曰諸葛孔明乃臥龍也\n將請治郡　　　　伯　請曰臣本吏家子孫遭聖帝受命備位列將蒙會當通使天下略定無所用志願試守一郡盡力以效帝笑曰卿既治武復欲備文耶授陳郡太守\n○遞相舉　附自舉門\n何武公孫祿　漢何武舉左將軍公孫祿可輔政祿亦舉武\n有司劾奏互相稱舉皆免\n提衡　張湯杜周相提衡\n馬融崔瑗竇章　後漢竇章字伯向好學與馬融崔瑗更相推薦\n魏其侯與灌夫二人相引重　注云重相推舉\n田仁任安　有詔擇衛將軍舍人爲郎將趙禹爲選得田仁任安二人貧將軍不得已上之問能略田仁曰提桴鼓立軍門使士樂死仁不及任安任安曰決嫌疑定是非辨官治使百姓無怨安不及田仁帝曰善也\n更相薦舉　賈捐之字君房與長安令楊興字君蘭相善捐之薦興可試守京兆楊興亦云我若得見言君房石顯奏捐之與興懷詐更相薦舉請論如律捐之棄市"},{"id":"juan12-066","source":"正文","juan":"卷第十二","menu":"舉舊第六十五","sub_menu":null,"page":"一六三","leaf":"四十七オ","text":"楚君之舉也外姓選於舊　傳\n祁奚舉偏不爲黨　祁奚爲中軍尉羊舌職佐之職死晉侯問祁奚曰孰可以代之對曰赤也可赤職子也君子曰舉其偏不爲黨偏謂偏官\n刈錯薪之楚　且得良賢\n拔連茹之茅　不遺故舊\n官貴得賢　人推求舊\n棄舊曰不仁　得賢有賞\n始以故知　終因德進\n多擢宿舊　魏何晏選侍中主選曹宿與有舊者多擢用之\n不用鄉親　杜錫爲吏部郎不敢用鄉親一人\n唯善所在　雖舊何傷\n唯賢是求　在故必舉\n用鄉里　魏許允爲吏部多用鄉里人告當與文帝收之允對曰古人云舉爾所知臣之鄉人臣所知也陛下試考有不勝任者臣當受罪帝決察允所用皆當職乃釋允更賜衣服\n舉本國人　　爲河南尹河南俗黨五官功曹典選職皆授其本國人無用私者猥各舉良而對用之分曹分職而後以次考覆之也\n舉舊人子　朱暉父秀與陳揖交善揖早亡後司徒桓虞辟暉子駢暉乃薦子友代之"},{"id":"juan12-067","source":"正文","juan":"卷第十二","menu":"舉讎第六十六","sub_menu":null,"page":"一六三","leaf":"四十七オ","text":"稱其讎不爲諂　請稱解狐君子曰解狐得舉\n君子謂祁奚能舉善矣\n叔向曰祁奚外舉不避讎其獨遺我乎　傳\n儒有外舉不避怨　禮\n宜取節於葑菲　豈失賢於讎恥\n怨是用希　必棄瑕於直髮\n善不可失　宜取節於葑菲\n以私害公非忠也　私怨也\n王生之使張柳　傳范氏之臣王生惡張柳朔後舉朔爲栢人宰昭子曰夫非而讐乎對曰私讐不及公好不廢過惡不去善義之經也臣敢違之\n公必滅私　憎而知善\n豈宜報怨　安可妨公\n私憾　君子謂羊斟非人也以其私憾敗國殄民於是刑孰大焉也\n刈錯薪之楚　且務時賢\n拔連茹之茅　宜忘舊怨\n小白用管是捨射鉤之讐　重耳見披豈念斬袪之罪\n惡而知美　禮\n私不害公\n唯善所在　雖讐何傷\n唯賢是舉　雖讐必舉\n舉用　韓信爲楚王召辱己之少年令出跨下者爲中尉告諸將相曰方辱我時吾不能殺之爲名故忍就於此\n薦　後漢喬玄公祖與陳球有隙及爲司徒薦球爲廷尉\n舉讐子　樂恢伯奇同郡楊政數衆毀恢後舉政子爲孝廉由是鄉里歸之\n宜繼美於前賢　無失賢於舊惡\n受讐舉　魏吉茂叔暢兄黃爲鍾繇所收伏法茂怨怒繇不哭至戚然繇舉茂茂才識者以爲茂必不孰及之時人或以茂爲畏繇或以茂爲畏丘也\n舉讐爲守　韓子曰趙簡王問解狐孰可爲上黨守曰荊伯柳王曰非子之讐乎曰舉賢不避仇讐也\n又　說苑晉文侯問咎犯誰可西河守曰虞子羔公曰君問爲守非問臣讐子羔謝犯曰薦公也不以私事害公義子去之吾當射子矣\n韓子曰解狐舉讐於相　相往謝引弓迎而射之"},{"id":"juan12-068","source":"正文","juan":"卷第十二","menu":"舉賤第六十七","sub_menu":null,"page":"一六四","leaf":"四十七ウ","text":"管庫　趙文子所舉於晉國管庫之士七十有餘家主不交利死不屬其子焉舉管庫小吏以爲士大夫\n管仲取盜　孔子曰管仲遇盜取二人焉上以爲公臣曰其所與遊辟也可人也此人何用也管仲死桓公使爲之服宦於大夫還之\n節以封非　刈其讐\n引薦白屋　韓起趙武\n對揚紫庭　劉琨表云\n揚仄陋　書\n出滯淹\n唯其任也何賤之有　傳\n且淮陰餓隸才能佐漢渭濱賤老道可匡周\n將致非常之才宜從不次之舉\n楚使右領　楚太師子穀曰右領差車與左史老皆可用也子高曰賤率人慢之懼不用命焉子穀曰觀丁父鄀俘也武王以爲率是以大啓郡鄾彭仲爽申俘也文王以爲令尹實縣申息朝陳蔡封略於汝唯其任也何賤之有\n草萊　王蘊爲吏部郞曰欲使時無屈滯先任草萊\n寒素　晉起石往王戎領吏部未嘗進一寒素退一虛名\n同升諸公　公叔文子之臣大夫僎與文子同升諸公子曰可以爲文矣注薦家臣於公與己同爲大夫\n執技事上　凡執技以事上者不二事不移官出鄉不與士齒謂祝史射御醫卜及百工也\n唯賢是舉　雖賤何傷\n唯善是求　何賤之有\n將欲搜以賢良　豈可遺於仄陋\n楚軍舉善　用仲爽於申俘\n漢主使能　擢弘羊於賈豎\n黃憲牛醫之子　黃叔度\n達吏舉小吏　周禮\n王侯無種"},{"id":"juan12-069","source":"正文","juan":"卷第十二","menu":"蔽賢第六十八","sub_menu":null,"page":"一六五","leaf":"四十八オ","text":"文仲竊位　子曰臧文仲其竊位者與知柳下惠之賢而不與位也言不舉之在位者\n弃德不讓不仁　臧文仲下展禽仲尼曰不仁\n黜爵　大戴禮古者諸侯不貢士一則黜爵再則黜地三則黜爵地俱盡\n野無遺賢　書\n賢路既壅　倖門必開\n賢路既妨　倖門必啓\n簡賢附勢　簡弃也書\n史魚不殯於正堂　衛史魚知蘧伯玉之才而不能進死不殯於正堂以自貶\n蔽才有罪　子產\n舉善日聞懸賞　蔽賢豈得無辜\n遺賢不仁　蔽賢有罰\n見賢　禮見賢而不能舉舉而不能先慢也注先先己也\n誠宜見善必求　何乃知賢不舉"},{"id":"juan12-070","source":"正文","juan":"卷第十二","menu":"賞舉賢第六十九","sub_menu":null,"page":"一六五","leaf":"四十八オ","text":"賞胥臣以先茅之縣　晉襄公賞胥臣曰舉郤缺子之功也賜以先茅之縣\n有功錫　大戴禮古者諸侯貢士三適謂之有功乃加九錫\n急賢懸賞\n蔽賢失德　則必有刑\n舉善援能　如何無賞\n廢先茅之典　請旌刈楚之功\n臣能進賢　君必懸賞"},{"id":"juan12-071","source":"正文","juan":"卷第十二","menu":"考試第七十","sub_menu":null,"page":"一六五","leaf":"四十八オ","text":"權其得失　要以其否\n明試以功\n歷試諸難\n所試　子曰如有所譽者其有所試矣\n六藝掄材　四科取士\n射策之初　中正論而後取\n掄材之際　審輪轅之必分\n先論　禮凡官人材必先論而法論其德行道藝\n論辨然後使之　辨謂考問得其定也\n儒有彊學以待問力行以待取　禮\n懸藻鏡之鑒　而取上才\n蘊撞鐘之鳴　以待下問\n一發之初　雖失正鵠\n百鍊之後　方辨精鋼\n考其德藝　周禮小司徒職云三年大比考其德藝\n詢事考言登庸　主尚書\n藝成　技囊\n循聲責實\n弃瑕錄用\n舉措用捨考其德行察其道藝　周禮\n君子立身　道備難進\n主司取士　才不易知\n辨論官材　考其才也\n四術崇儒　九流考藝\n刈薪　拾芥\n考覈既在有司　僣濫寧由多士\n試可乃已\n考第　周禮族師讀邦書考第有學者\n銓度　國語揣物\n總覈名實\n漢九徵　莊子遠使觀其忠近使觀其能煩使觀其才卒問觀其智急與之期觀其信委之以財觀其仁告之以危觀其節醉酒觀其則雜處觀其色九徵至而不肖人之得也\n以待又語　禮\n或以言揚\n舉吏先試　後漢左雄令舉吏先試公府覆之端問張盛奏除之黃瓊云將以覆實不可改\n上第　五十難上第\n高說　徐防竊郞上疏五經宜從其家章句開五十難以試之解釋多者爲上第引文明者爲高第\n恥不試　晉甘卓舉桂陽谷儉一人到臺遂不試儉恥州少士試高第除郞中\n下第者同次第爲太子舍人　漢獻詔試儒生下第者罷之詔曰孔子歎學之不講不講則所試日忘今者儒年踰六十去本土營糧食不得專業結童入學白首空歸長委農野永絕榮望朕甚愍之其依科罷者聽同次第爲太子舍人"},{"id":"juan12-072","source":"正文","juan":"卷第十二","menu":"得賢第七十一","sub_menu":null,"page":"一六六","leaf":"四十八ウ","text":"賢國之寶　不寶\n嘉魚　樂得賢也\n三良爲政未可\n閒也　管仲曰鄭有\n干旄美好善也\n王褒之頌　聖主得賢臣頌\n五百　年一賢人出\n二八　舜舉八元八凱\n致君於堯舜\n以賢爲寶將照千里　齊威王曰\n所寶惟賢\n制爵則人慎德　周禮\n賢者能者　周禮\n縶之維之　詩\n汝得人焉　吾與點也\n論進士之賢者　禮記論進士之賢者以告于王論定而後官之位定然後爵之任事然後祿之\n始因德進　始以名稱\n祿在其中　德成而上\n以善爲寶　禮\n賢爲國寶　人代天工\n禹稱善人　衛多君子\n野無遺賢　書\n李彊拜益州牧喜言揚雄　曰吾眞得嚴君平矣雄曰此人可見而不可屈也"},{"id":"juan12-073","source":"正文","juan":"卷第十二","menu":"弃賢第七十二　廢黜附","sub_menu":null,"page":"一六七","leaf":"四十九オ","text":"權輿　秦康公與賢人有始無終有權輿之刺\n考槃　刺莊公使賢者退而窮處\n薖軸之歎\n伐檀　君子不得仕進退而伐檀\n遺賢　書\n白駒在谷不見絆縶　詩\n簡兮　刺不用賢也衛之賢者仕於伶官也\n栢舟　言仁而不遇也\n任賢委政既乖勿貳之言　書曰任賢勿貳\n失寵退身終及如遺之弃　詩云弃予如遺\n進以趨時　不聞刈楚\n退而窮處　空歎伐檀\n道惟難進　人貴易知\n媢嫉　人之有疾媢嫉以惡之\n見賢而不能舉\n十年不調　馬融季長爲校書郞於東觀十年不得調因兄子喪自劾歸也\n親累不調　晉華廙字長駿郟有才妻父盧毓典選難舉姻親故廙年三十五不得調\n舉廢滯　晉陳壽乖楮遭父喪有疾使婢丸藥客往見之鄉黨以爲貶義及蜀平坐是沈滯累年張華愛其才以壽雖不遠嫌原情不至貶廢舉爲孝廉\n功高不調　張安世少爲有郞功高不調自言於安世安世曰君功高明主所知人臣執事何短長而自言乎絕不許已而郞遷言安世不伐功也"},{"id":"juan12-074","source":"正文","juan":"卷第十二","menu":"名譽第七十三","sub_menu":null,"page":"一六八","leaf":"四十九ウ","text":"遺千載以永終譽　詩言長有譽也\n子假吾名焉　傳言假吾以善名\n去仁　成名\n以爲子名\n敗名\n行浮於名\n闇然日章\n疾沒世而名不章\n四十五十而無聞斯亦不足畏也\n爲善無近名\n名者實之賓　莊子\n德蕩乎名\n坐馳　應坐而馳\n以身徇名\n伯夷死名\n烈士徇名\n騈明枝仁擢德塞性以收名聲使天下簧鼓以奉不及之法　曾史是已\n奔命仁義\n蹩躠爲仁\n踶跂爲義\n飾非\n釣名　漢汲黯言公孫弘\n不好立名　直不疑唯恐人知爲吏之跡不好立名稱長者\n畫地作餅　魏文帝謂盧毓曰取士勿取名有名如畫地作餅不可食也\n畏教慕善　盧毓對曰名不足以得異人而可以得常士常士畏教慕善然後有名非所當疾正可循名責實也\n在邦必聞\n舉世用之"},{"id":"juan12-075","source":"正文","juan":"卷第十二","menu":"辟召第七十四","sub_menu":null,"page":"一六八","leaf":"四十九ウ","text":"聘名士禮賢者　禮\n徵書同日到　　延年已命會　於相府御史府徵書同日到延年以御史府書先至遂詣御史府爲掾也\n不及政事　後漢司徒侯霸辟閔仲叔至不及政事仲叔曰始蒙嘉命且喜且懼今見明公喜懼皆去以爲不足問不當辟而不問失人遂去\n名儒　劉矩再爲太尉所辟召皆以名儒宿德不與州郡交通\n以軍書徵召　大將軍何進聞其遜讓有名欲辟之恐不至乃詐與軍書徵召既至署令史\n羔鴈成群　陳寔子紀諶並著名世號三君每宰府辟召常同時羔鴈成群丞掾交至當世榮之州百姓皆圖畫寔紀諶形像\n謫罰　後漢李充辟精舍講授太守魯平請署功曹不就平怒乃援充捐溝中謫署縣都亭長不得已起親職役後詔徵爲博士舉與集會常欲復也\n辟不就後會一處　後漢申屠蟠事見上徵聘門注\n祭　徐穉字孺子爲黃瓊所辟不就瓊卒負糧自南昌至\n江夏殺雞祭之不告姓名\n制服　司徒朱逢舉荀爽有道不就應卒制服三年往往爲俗\n哭　王脩爲朱譚所辟不就譚誅哭之\n幅巾見　鄭玄康成大將軍何進辟不得已詣進進爲設几杖玄不受服以幅巾而見一宿而去\n留秘閣之吏　魏王陵請王基爲別駕後基爲秘書郞陵復請還司徒王朗與陵書曰家臣之良則升公輔公臣之良則入王職今留秘閣之吏所希聞也陵猶不遣\n殺公掾　晉魏舒爲司徒有周震者頻爲三公府辟辟書下公輒亡時人號爲殺公掾莫爲辟者舒及命之亦無他\n以禮進退　魏李喜累辟不就司馬景王命爲從事中郞引見曰先公辟君不應今至何也對曰先公以禮見待喜得以禮進退明公以法禮繩下故喜懼法而來也\n職滿乃得辟　左雄伯豪上疏言鄉親民之吏請自從政者請覓其賞筭增其秩祿吏職滿歲宰府州郡乃得辟舉官豎不便之言不用也\n處士年少　崔駰亭伯竇憲辟爲掾憲府貴重掾屬皆故刺史二千石唯駰以處士年少擢在其間\n彊辟　橋玄公祖爲漢陽守郡民姜岐守道隱居玄辟爲吏不就玄怒使督郵尹益致之曰岐若不至趨嫁其母督郵諫玄不聽往辟岐岐亦不起士大夫競諫玄乃止也\n皎皎白駒賁然來思\n入林入山　魏王辟阮瑀瑀不就逃入山中祖使焚山得瑀瑀即集賓使就伎人列瑀鼓琴歌云云祖大悅\n五府交辟"},{"id":"juan12-076","source":"正文","juan":"卷第十二","menu":"待士第七十五","sub_menu":null,"page":"一六九","leaf":"五十オ","text":"隗始　郭隗謂燕昭王曰王欲禮賢請從隗始昭王乃築臺師事隗於是樂毅自魏往鄒衍自齊往劇辛自趙往也\n信陵之下侯生　史魏有隱士侯生爲夷門抱關公子欲厚遺之不受乃置酒大會公子從車騎虛左迎侯生於公子上坐不讓欲以觀公子公子執轡愈恭侯生曰有客在市屠中願枉車騎公子乃引車入市侯生下見朱亥睥睨久立公子顏色愈和喜士名聞\n郊迎擁篲　鄒子衍重於齊梁惠王郊迎執賓主禮如燕昭王擁篲前驅請列弟子之坐而受業築碣石之宮身親師之\n記語　孟嘗君在薛招致諸侯賓客及亡人有罪皆歸舍業遇之每侍客坐語屛後侍人主記與賓客語\n不敢加兵　魏公子無忌仁而下士士無賢不肖謙而禮交之士爭往歸之諸侯不敢加兵於魏無忌即信陵君也\n魏文侯師田子方　太子擊遇之引車下謁子\n方不爲禮擊因問曰富貴驕人乎貧賤驕人乎子方曰諸侯驕人失國大夫驕人失家貧賤行不合去之楚越如脫屣\n懸榻　後漢樂安太守陳蕃郡人周璆高絜之士前後郡守招命不致唯蕃致之而不名爲特置一榻去則懸之璆字宣之\n皆得所欲　秦安博愛客衆無所閒擇賓客入門賢愚皆得所欲也\n士感　任延爲會稽都尉有龍丘萇隱居王公連辟不到延　其門遣功曹奉謁致禮於道積一歲萇乃乘輦詣府門願得先死備錄遂署議曹祭酒遂卒\n倒屣　蔡邕聞王粲至倒屣迎之既至容貌短小一坐盡驚邕曰此王生也有異才吾家書文章當與之\n董允　蜀志董允爲尚書令費禕與中軍期游燕嚴駕已辦襄董恢詣允恢年少官微見允停出逡巡求去允不許曰舍此就彼眞非所宜乃命解禕等駕下士如此\n座無空席　王渾爲安東將軍鎭壽陽虛懷接納座無空席門不停謁江東之士悅附之\n舍正寢事蓋公　曹參\n周公下白屋之士　一沐三握髮一飯三吐哺\n以貴下賤大得人也　易\n貴而能降　降心相從\n降尊就卑"},{"id":"juan12-077","source":"正文","juan":"卷第十二","menu":"考課第七十六","sub_menu":null,"page":"一七〇","leaf":"五十ウ","text":"三歲大計　周禮太宰之職三歲大計羣吏之理而誅賞註三載考績\n廢置　大宰以八則治都鄙三日廢置以馭其吏注云廢退其不能者進置賢能者也\n殿最\n三載黜陟　舜典三載黜陟幽明\n詢事考言\n明試以功\n功事　稽其功事周禮責實\n會政　計會政事周禮\n大比　三年大比以考羣吏而廢置注云大比大計也\n崇德黜惡　禮\n程功會課\n積功底績　底致也績功也書云\n智效一官　績成三考\n政乃日修　功惟歲課\n計最\n考課吏法　漢京房君明曰古帝王以功舉賢則萬化成永世瑞譽取人故功業廢宜令百官各試其功房奏考課吏法令丞尉治一縣已犯法者輒舉之有盜賊三日不覺者尉事也令覺之自除二尉負其率相准如此法朝臣皆以爲上下相司不可許唯鄭郃周堪善之房爲魏郡太守得以考功法治郡房請屬刺史者也云云\n課第六　尹翁歸爲茂陵令會課注考課有第六令郭舜殿見責　月校之扶風怒曰君課第六裁自脫何暇爲人言也\n承書曰　明度量以程能考功實以定德都官考課　魏志劉邵作都官考課上疏曰官吏考理王政之教然而歷代不務是以理典闕而未補能否混而相蒙\n傅嘏難之　邵作考課法云\n盧毓考課法　毓曰名不可致異人可以得常士常士畏教慕善然有名士者數奏以言明試以功今考課廢而名譽相進退故真偽相蒙帝納其言作考課法及選舉先性行而後言才也\n治中　周禮天府凡官九府鄉州及縣鄙之治中受而藏之以詔王察群吏之治察其當黜陟者鄭司農注云治中謂其職簿書之要\n奏課連最閥閱　朱博爲琅邪太守姑幕縣有盜賊徹王卿盡力捕得五十人傅移書曰王卿憂公甚有效擻到賚閥閱詣府注閥功勞也閱所經歷\n黜陟之課　杜預元凱受詔爲黜陟之課令委達官各考所統在官一年已後歲言優者一人爲上第劣者一人爲下因計偕以聞六載則主者總集優劣者超用之劣者奏免之優多者敘用之優者少尤遷也\n內外官　杜恕務伯爲黃門侍郎時大議考課之制以考內外衆官恕上疏言州郡考士皆有事效然後察舉郡守以功次補或就增爵秩此最考課之急王於公卿內職大臣不當但以其職考課之也三公坐而論道內職大臣納言補之安有大臣但守職辨課可致雍熙者云云\n討治而誅賞　王永文爲詔使撰百官考課事永以唐虞有黜陟之文而考課之法不垂周制冢宰之職大計群吏之治而誅賞又無校比之制由此言之聖主明於任賢黜陟擧之體以委達官之長而總其統紀故能否不知也"},{"id":"juan12-078","source":"正文","juan":"卷第十二","menu":"要會第七十七","sub_menu":null,"page":"一七一","leaf":"五十一オ","text":"八成　周禮小宰以八成經邦治八曰聽出入以要會要會計最簿書也月計曰要歲計曰會\n歲會月要日成　小宰宰夫之職歲終則令群吏正歲會月終則令正月要旬終則令正日成而考其治治不以時舉者以告而誅之\n會計　周禮司會聽其會計\n致事　上其計簿於君\n受質　受質歲之成\n歲事國用　禮司會以歲之成質於天子冢宰齋戒受質於百官百官各以其成質於王官王官以百官之成質於天子然後成歲事計國用注成計會要也\n其計也歲事　計也計一歲之用\n會財　會才也\n經費　經常費也\n辟名　謂文簿不實也\n校簿稽事　稽以簿書辨其名物\n三公受計　漢書\n受會　周禮官聯以會邦治宰正其治受其會會大計也\n參互　周禮以參互考日成\n緫會計　財用物必考於司會歲終會計事\n不從中覆　漢書云李牧軍市之租貴賜決於外不從中覆\n張蒼遷爲計相　注計簿籍也蕭何令蒼以列侯居相府領郡國上計也\n計最　嚴助願奉三年計最最凡要也\n主計　張蒼\n白氏六帖事類集卷第十二"},{"id":"toc-juan13","source":"卷十三總目","juan":"卷第十三","menu":"卷第十三總目","sub_menu":null,"page":"一七七","leaf":"一オ","text":"白氏六帖事類集卷第十三　本卷總目（共 67 門）\n刑法第一\n法令第二\n寬刑第三　恤刑附　宥過事用\n推斷獄四　學獄附\n構訐第五\n款辯六　驗證附\n察獄第七\n獄囚第八\n放囚第九\n恤囚徒十\n濟活囚徒十一\n錄囚十二\n無囚十三\n讞獄十四\n愼刑十五\n法官獄吏十六\n擧案十七\n誅罰十八\n淫刑十九　暴政附　政相類\n峻刑二十\n酷吏二十一\n失入二十二\n失出二十三　事具錯悞門\n用法不平二十四\n刑措二十五\n改制法令二十六\n死罪二十七\n流罪二十八\n貶黜二十九\n徒役三十\n贖罪三十一　附罰\n鞫獄三十二\n留獄三十三\n疑獄三十四\n贓賄三十五\n使吏從己三十六\n冤獄三十七\n鬻獄三十八\n鞭扑三十九\n象刑四十\n肉刑四十一\n族誅四十二\n刖四十三　事具肉刑門\n罰親四十四\n國親刑四十五　與帝德議公議刑門同\n議故四十六\n不齒四十七\n財產沒官四十八\n殺人四十九\n鬭五十\n傷五十一\n藥人五十二\n誣人五十三\n罪相容隱五十四\n告人罪五十五\n緣坐五十六　不相及附\n相代罪五十七\n赦五十八　不聞赦附\n宥過五十九\n改過六十　知過附\n待罪六十一　陳首附\n有罪復用六十二\n恕六十三　事具宥過門\n誤認六十四\n錯誤六十五\n文字誤六十六\n犯夜六十七"},{"id":"juan13-000","source":"正文","juan":"卷第十三","menu":"刑法第一　防姦附","sub_menu":null,"page":"一七八","leaf":"一ウ","text":"國章斯抵　大命所懸\n禁暴\n討刑\n三尺\n有常無赦\n速即刑于國之紀\n刑以秋冬\n刑威\n踰閑　也\n罰法\n能刑　君子謂晉文公其能刑矣三罪而人大服\n以類震耀　爲刑罰威獄使民畏忌以類其震耀殺戮言刑象雷電也\n中罰\n百刑\n凡制五刑必即天論　制斷也必即天論言與天意合\n一成而不可變　一成也改也\n防淫　記君子刑以防淫爲之防人猶踰之\n而煩刑書　傳\n明啓刑書\n丹筆　之筆正刑\n明愼　易曰君子以明愼用刑而不留獄\n明罰勑法\n王律\n刑一人　史堯刑一人而天下大服\n四罪　舜四罪而天下咸服\n協大中之法\n列用中罰　列明也中罰法之輕重得中也書\n嚴斷刑罰以威其淫　傳\n勿宥勿辟　書殷人在辟予曰辟汝惟勿辟予曰宥汝惟勿宥惟厥中\n祥刑　祥善也書\n閱實　罪罰相當\n下刑適重上服　服罪也一人有二罪則從重也\n官刑　制官刑儆有位\n其附于刑　附麗也周禮\n麗刑　也\n麗罪　中典同\n中典\n官禁　禁國\n蹈矩　也\n踐法\n惟刑之恤\n刑期無刑\n義刑\n屏棄\n與刑　周禮司徒以刑\n敬中　敬中刑人不異\n在九刑而不忘　傳季孫行父曰\n三罪而人服　晉文公伐衛\n將刑爲之不擧　不擧樂減膳\n刑之頗類　獄之頗也類放紛\n人在鼎矣\n子產鑄刑書\n御民以刑　以德\n僕區之法　楚文王作\n無自立\n辟　謂人之多僻無自立辟辟法也\n觸法\n抵禁　書\n律令一定\n作法於涼其敝猶貪　也涼薄\n刑法所以助治　劉向上疏教化所恃以爲治也刑法所以助治也\n正經三百孔子創其威儀　大法三千蕭何設其條貫\n非日照四海而齊明　如電如霆心方而交泰\n輕犯憲章　不違禮教"},{"id":"juan13-001","source":"正文","juan":"卷第十三","menu":"法令第二","sub_menu":null,"page":"一七九","leaf":"二オ","text":"制事典爲之律度　趙宣子爲國政\n徙木　史商鞅令既具未布乃立三丈之木於市南門募人有能徙置北門者予十金人怪之莫敢徙復令曰能徙與五十金有一人徙之輒與五十金以明不欺\n其法\n憲令　史楚懷王使屈平造憲令草未定上官大夫欲奪之不與乃讒曰平爲令衆莫不知\n王怒疏平\n攈摭　漢蕭何攈摭法令宜於今者作律\n不循三尺　漢客謂杜周曰君爲天下決平不循三尺法注三尺以竹簡寫法律也專以人主意指爲獄周曰三尺安出哉前王所是著爲律後王所是疏爲令\n令甲　宣紀曰令甲死者不可復生刑者不可息注息生長也甲令第一乙令第二也\n吳芮著乎甲令而稱忠\n令之深文　張湯與趙禹共定律令務在深文拘守職之吏注拘制刻也\n定令　趙禹張湯\n威福　後漢崔寔曰威福人主之神器\n定典法　　　　　　　定典法\n步過六尺\n有棄灰於道被刑　商君之法也新序\n不宜兩端　魏盧毓上論古今科律法宜一正不宜兩端\n刑律　劉劭等定科律作新律十八篇\n蜀科　蜀志伊籍與諸葛亮劉巴李嚴共定蜀科\n先甲三日先庚三日\n愼乃出令\n令出惟行不惟反\n孚令　　　　　　　之要漢書\n執禁以齊衆\n禁網疏闊\n禁上暴邪　書\n經邦之道\n庇俗\n誡人　防奸詰暴\n九章\n宜緩　俗有歸心\n三典\n或爵　一無與手\n法正則人愨　罪當則人從\n發號令\n國有不以\n布德和令\n后以施令誥四方\n溢於甫刑者除之　陳寵爲廷尉　　　律令　法溢於甫刑者奏除之未及施行也"},{"id":"juan13-002","source":"正文","juan":"卷第十三","menu":"寬刑第三　恤刑附　宥過事用","sub_menu":null,"page":"一八〇","leaf":"二ウ","text":"訓夏　周書穆王訓夏贖刑\n附從輕　罪疑附輕刑也求出之使從輕\n赦從重　罪重疑赦之\n周訓夏刑人克用乂　謂臨夏贖之刑寬從理也\n漢除秦法政是以和　去秦之酷\n夏人不敬本乎後罰　記夏道先賞後罰其人不敬\n得失斯在　作五虐之刑苗人自絕\n秦氏自敗由其峻刑\n約三章之法漢室以興\n虞夏之道寬於恕人　少文法\n雖政寬而人慢　書\n比刑書而俗敝　不\n爲國制刑　簡易\n亦人知禁　信亦寬難\n寬能御衆　以刑惑人\n宜建大中之法　以爲小惠之患\n作爲金贖　虞書金贖罪\n垂於虞書　設入刑以\n除去肉刑\n務仁漢牘　文帝\n進寬而有制　書施之以寬\n雖擾擾之政布以從寬　而撒撒之\n代虐以寬兆人允懷　湯而以爲御\n勞止之\n人寬以濟猛　今恤哉之典寬克聚威\n其政不嚴而治　其教不肅而成\n無子令妻入獄　吳祐爲膠東相有毋丘長者殺人臨刑祐問有子否長曰有妻無子乃械其妻入獄妻有孕然後行刑長泣曰何以報吳君後生子以吳爲名矣\n呑藥就死　言學子何爲殺丘令有吏行盜意不忍行刑罷其　　歸其父曰有道之君以義刑人子宜逮　就死\n畫衣冠　漢文帝詔曰蓋聞有虞之時畫衣冠異章服以爲戮而人不犯何則治之至也其除肉刑\n輕典　周禮\n緩刑\n居上不寬吾何以觀之哉\n父子君臣　禮凡聽五刑之訟必原父子之親立君臣之義以權之意論輕重之序愼測淺深之量以別之\n容在惡　禮\n利邃人之惠\n匿　大爲防而損御法以\n懲姦　小不忍而亂\n況當弘貸之朝　宜用適輕之典\n宥汝　仇\n惠吾秦寬惡　刑法志言上古用象刑是殺人者不死傷人者不刑是惠暴而寬惡也\n無濫　賞不僭刑不濫寧僭過毋濫\n輔之以寬　霍光持刑法嚴任杜延年輔之以寬\n老　宣詔年八十非誣告傷人他皆不坐\n小　成帝令未滿七歲賊鬬殺人及犯殊死者上請皆減死\n回封之　張歐字叔明爲御史大夫未嘗按人官屬亦不大欺上具獄有可卻者卻之頭不可者涕泣面封之注背對不忍見之\n去酒肴肉　杜緩理諸陵縣獄每冬月具獄曰去酒肴肉官屬稱其恩\n于公高門\n升卿因字　後漢虞詡字升卿祖父經爲郡獄吏案法平允每冬月上其狀恆流涕隨之嘗曰昔東海于公高其門閭其子卒至丞相吾不及于公子孫何必不爲九卿因字詡曰升卿\n泣辜　禹\n門容駟馬　于公\n孫及九卿　虞詡祖經\n不妄\n執燭　成吉爲廷尉　　持燭　　向位曰不可使一人冤及子孫\n擧按　見愼刑門"},{"id":"juan13-003","source":"正文","juan":"卷第十三","menu":"推斷獄第四　學獄附","sub_menu":null,"page":"一八一","leaf":"三オ","text":"情得獄成\n刑放辭窮\n察必以情　小大之獄雖不能察必以情\n片言折獄者其由也與　片謂偏也\n察言觀色\n叩其兩端\n放紛　紛亂也\n孟秋決小罪　月令孟秋命有司繕囹圄具桎梏斷薄刑決小罪\n仲秋申嚴百刑　月令仲秋命有司申嚴百刑斬殺必當無留有罪\n嘗學斷斯獄矣　禮\n致其忠愛　禮記悉其聰明致其忠愛以盡之謂聽獄訟也\n哀矜　曾子曰如得其情則哀矜而勿喜\n獄訟　書\n益\n要囚伏念五六日至于旬時　要囚謂審其要辭\n哀敬折獄　明啓刑書\n胥占　以定罪也\n定國之司廷尉　爰求明察\n不疑之尹京師　多所正刑\n高門待封　于公陰德\n欽哉欽哉惟刑之恤哉　敬之敬之唯刑之可憂也\n施鞭貫之威　子玉治兵終日鞭七人貫三人耳\n明察之官\n滋\n甚\n亂獄\n典獄　主獄者\n兩造具備師聽五辭　兩謂囚證造至也兩至具備則衆官聽其入五刑之辭\n孚正于五刑　五辭簡核信有罪驗則正之於五刑\n審克　詳審\n閱實　罪與罰相當也\n何以速我獄　詩\n平刑\n擧直措枉　則民服\n不赦　大辟\n察辭\n稽貌　考其顏貌愼獄之至也\n單辭　謂一人之辭單辭也\n束矢　周禮以兩造禁人訟入束矢於朝然後聽之注必以束矢者自表其直也不入則不聽也\n鈞金　又以兩劑禁人獄入鈞金三日致于朝然後聽之注劑謂券書也使各齎券書又入鈞金三日而聽之亦重刑不入金則自服不直不堅也鈞三十斤\n五聽\n求人情　周禮以五聲聽獄訟求人情一曰辭聽二曰色聽三曰氣聽四曰耳聽五曰目聽\n斷獄蔽訟　蔽亦斷也\n辭貴明徵　傳明徵其辭\n罪宜愼測　備愼淺深之量\n坐獄於王廷\n國章斯抵　人命所懸\n刑將不變　獄書\n擧要　傳王叔氏不能擧其要辭要謂　之辭\n徵辭\n既鈞金束矢之直　何謂獄冠之助\n折獄致刑\n斷制五刑　書\n察辭于差　察辭參差\n明清于單辭\n協日　周禮司寇旬而職聽于朝要之　士司刑皆在各麗其法以議獄訟獄成士師受中協日刑殺肆之三日\n凡以獄財者正之　傳\n別約劑　傳別手中別書約劑今之契券\n旬乃斃之　小司寇以五刑聽萬人之獄訟附于刑用情訊之至于旬乃弊之注用情理之十日乃斷冀有可出也\n參聽　記獄成告于王王命三公參聽之\n君子盡心　刑者成也一成而不可變故君子盡心焉\n直鈞幼賤有罪　傳\n上下其手　伯州犁囚情\n不探其情而誅焉\n于廷尉知審愼之心朝廷稱之　漢于定國\n不冤　張釋之爲廷尉天下無冤人于定國爲廷尉人自以爲不冤\n不用三尺　後漢陳寵曾孫　明習家業天下獄訟其所\n由汝乎無不服　　時　　宗詔　　　　之\n稱人俗和平屢有嘉瑞漢舊事斷獄報重常盡三冬之月是時帝始改用十月冬初而已元和年旱賈宗上言斷獄不盡三冬故陰氣微陽氣發洩招致災旱寵奏冬至陽氣始萌故十一月有　令日諸生蕩仲冬日身欲寧事欲靜若以行大刑不可謂靜帝納之及爲廷尉每附輕典務從寬也\n不可謂寧\n麥秋案驗　和帝令麥秋案驗輕薄刑司徒魯恭上疏諫曰盛夏召農人拘對上失天時下傷農業一夫呼嗟王道爲虧宜冬後乃施行\n學獄　漢張湯父爲長安丞出湯爲兒守舍還鼠盜肉父怒笞湯湯乃掘薰得鼠及餘肉劾鼠掠治傳爰書訊鞫論報并取鼠與肉具獄磔堂下父視文辭如老獄吏遂使書獄注學決獄之書乃爲律令也\n必原父子之親意論輕重之序　愼測淺深之量\n悉其聰明　致其忠愛\n必察小大之比以成之　禮\n黃沙執憲　丹筆\n雖折獄以言　望古人而多愧\n惟刑是恤　聽勿喜而留情\n梧丘有雪冤之魂　　　　　　冤之鬼\n泣辜　　林夜\n流念\n丹筆\n哀矜　勅之重\n刑期無刑　哉箴\n以殺止殺　有國之寶\n故漢制九章　設教之銜勒\n湯存一面　作照首之隄防\n干紀亂常　必加誅於三族\n反道敗德　終不捨於五刑"},{"id":"juan13-004","source":"正文","juan":"卷第十三","menu":"構訐第五","sub_menu":null,"page":"一八三","leaf":"四オ","text":"三月無肆掠　肆謂暴尸掠謂拷禮記\n掠笞　史楚相亡璧門下意張儀共執儀掠笞數百不服乃釋之\n榜笞刺爇　貫高對獄吏榜笞數千刺爇身無完肉\n捶楚之下何求不得　路溫舒曰雖皐陶聽之猶以爲死有餘辜\n繫笞\n掠辜瘐死　宣詔繫者或以掠辜瘐死獄中令郡國歲上繫囚\n榜一連十榜十連百　右\n請先榜　范陽繫獄以同繫囚多五毒參至\n戴就會稽人仕郡倉曹掾揚州刺史奏太守成公浮臧罪從事　　拷掠五毒參至燒鋘斧使就挾於肘腋肉焦墮落乃因就覆船下以馬糞薰之一宿二日謂已死發船視口開罵曰何不益火又燒地以大鍼刺指爪中令把土爪悉墮落安曰太守罪狠　　君　骨　　　曰\n太守剖符大臣奈何誣枉忠良安胥之御　辭　與　　　事\n識母羹　陸續字智初詣洛陽獄吏曰母來不得見問何以知曰母截肉調和羹味因泣斷葱寸為度使者嘉之免罪\n吏訐　歐陽書曰左右不明帝從吏訐也\n要因夜拷　常林夜拷吏崔林問曰君為廷尉常曰無崔曰何故夜拷因常幽之\n罪非得其實\n遂誘問因情　吳陳表交與為將士皆愛附之時有施明盜官物壯悍收拷極毒難死無辭孫權以表得健兒心以明付表表破械與沐浴飲食勸誘之乃首服兼引支黨權奇之遂皆明罪"},{"id":"juan13-005","source":"正文","juan":"卷第十三","menu":"款辯第六　附證驗","sub_menu":null,"page":"一八四","leaf":"四ウ","text":"明聽單辭\n兩辭師聽五辭　書\n王叔氏不能舉其契　要契之辭\n書辭無頗\n抵讕置辭　漢大鴻臚持節移梁王傅細曰王陽所在置辭注置辭也讕　　讕置反\n不知置辭　周勃下廷尉不知置辭注置立也不知對獄之辭吏稍侵辱之勃以千金與獄吏乃書\n牘背　以公主為證注牘木簡也\n罪對自伏其過　莊子\n會獄　追對\n南山之竹不足受我辭　宋安世\n證\n引為證　後漢吳祐為馬賢所辟又為太尉龐參掾參賢相誣罪應死各引祐為證祐理無兩直自刎死二人慙悔和解涼州刺史張凱祭其墓擢其子孫\n小大之獄雖不能察必以情\n偏聽生姦\n探情窮審\n公聽　不私\n察色動　魏護軍營士竇禮出不還營以為亡沒事其妻盈及男女詣廷尉高柔曰爾夫不與人交錢財乎妻曰嘗出錢與同營焦子文求不得子文色動對召至於是叩頭首殺禮\n胡質　為常山太守士盧顯為人所殺質曰此士無讎而有少妻見其比居年少書吏李若色動遂窮詰罪人斯得\n蜜中鼠屎　吳孫亮方食生梅使黃門以銀椀并蓋就中藏吏取蜜黃門先恨藏吏以鼠屎投蜜中啟言不謹亮令破鼠屎屎中燥亮笑曰若先在蜜中外俱濕黃門伏罪矣\n兩日在木　晉苻融字博休善斷獄董豐遊學三年而反宿妻家妻為賊殺妻兄疑豐融引問　中初行有往反卜筮否豐曰初發夢乘馬南渡水而自北而南俯見兩日在水中\n筮者云憂獄訟遠三枕避三沐既至妻具沐夜受豐枕豐記筮言皆不從妻乃自沐枕枕而寢融曰易坎為水離為火馬左濕坎北而南從坎至離六爻同變離為中女坎為中男馬左向水也水左有馬馮字兩日昌字其馮昌殺之昌乃具服與妻通期新沐沐者枕枕為驗設中婦人\n盜誣行人　冀州有老母遇劫唱盜行人為逐之擒盜盜反誣行人曰吾母及盜人莫知符融曰二人並走先出鳳陽門者非盜既還融正色謂後出者曰汝真盜其發姦摘伏皆如此\n與死人語　後漢周紆字文通為召陵侯相廷掾憚紆嚴明欲損其威乃取死人斷手足立寺門紆便往至死人邊若與死人共語狀陰察口眼中有稻芒乃密問守門者曰誰載藁入城對曰唯有廷掾而又問鈴下外自唯廷掾疑君與死人語乃收廷掾而拷問具服不殺人但取道邊死人自後莫敢犯之\n分縑　風俗通曰有一人持一疋縑到市賣遇雨而被戴後一人求庇蔭因與一頭雨霽當別因爭之是我縑太守薛宣呼騎吏斷各與半使追聽之後人曰君恩縑主稱冤不已宣知其狀拷問乃服也\n惟己以議物　措狀以探情\n誅一以振萬　損少成多\n妻殺夫　陸雲為浚儀令人有被殺主名不立雲錄其妻無所問遣出密令吏隨之曰有一男與語便縛來果得之云與妻通謀殺夫也"},{"id":"juan13-006","source":"正文","juan":"卷第十三","menu":"獄囚第八","sub_menu":null,"page":"一八五","leaf":"五オ","text":"木囚　王充論衡李子長為政欲知囚情以梧桐為人像囚之形鑿地為坎置木囚於其中罪若正木囚不動若有冤木囚即動出因之識著木人也\n囹圄以囚\n桎梏以繫\n寘于叢棘　易\n圜土　周禮司救三罰而士加明刑歸圜土注圜土獄名\n三月省囹圄　月令\n九月繕囹圄\n拘繫　易\n係用徽纆　索也\n用脫桎梏\n屨校滅趾　械足\n荷校滅耳　罪重械及首也\n上罪　中罪\n同族有爵待繫　周禮掌囚守盜賊凡囚上罪梏拲而桎中罪桎梏王之同族拲有爵者桎以待繫鄭司農云　手共一木曰拲桎梏兩手各一木玄曰在手曰梏在足曰桎中罪不拲手各一木又云桎王族及命士已上唯上罪或拲手或梏也\n挺重囚出輕繫　月令四月注云挺寬也至獄乃緩也\n具桎梏　月令九月\n以幕蒙之　左傳晉人囚季孫意如\n囚伯嬴於轑陽　說\n南冠而繫者誰也　晉侯觀於軍府見鍾儀問之云云\n縲紲之中　公冶長\n縲囚\n幽繫囚之七年　紂囚文王七年\n楚囚　鍾儀\n武王下車釋箕子囚\n方知獄吏之尊　周勃云\n上書　梁王囚鄒陽乃從獄中上書自訟出之\n死灰不然　史韓安國字長孺坐法罪獄吏田甲辱之安國曰死灰獨不然乎甲曰然則溺之\n搶地　司馬遷書見獄吏則頭搶地\n畫地為獄義不入　削木為吏義不對司馬遷書\n仰天而歎　史李斯既拘執束縛仰天而歎云云\n關三木　史魏其侯衣赭衣關三木注云頸及手足\n桁楊　傳　子執　子于　　　　之以桁　　　也音\n羑里　紂囚文王於羑里\n夏臺　成王湯囚於夏臺\n獄名\n黃沙獄　晉武帝所置\n象斗之制　元命苞為獄圓者象斗也\n圜扉　獄門\n黃霸受經　黃霸與夏侯勝俱下獄霸欲從勝受書勝辭以死在旦夕霸曰朝聞道夕死可矣勝善其言遂授之\n入穽搖尾\n籠鳥檻獸\n而楚走秦儀\n出圜土者殺　謂逃出獄也周禮\n擾獄　擾謂非當獄者周禮\n赭衣\n魯謁居繫導官　諸獄皆滿權寄此者\n絳侯囚請室　令鍾下人\n灌夫受辱居室　保官\n暴室　掖廷織作染練署\n獄市為寄　曹參相齊以獄市為寄焉留後相曰慎勿擾獄市所以并容擾之姦人安所容\n虎穴　漢尹賞為長安令獄穿地方深各數丈致令辟為郭以大石覆之名虎穴\n圜牆之中　司馬遷書\n鞫繫\n頌繫　漢景帝令年八十已上十歲已下及孕未乳產者師侏儒當鞫繫者頌繫之注師樂師瞽師盲瞽也頌寬容不桎梏也但處之合不入牢也\n斜口之木不足為我械　宋安世云\n逮繫　淳于公下獄逮繫長安注在道將送防衛不絕若今傳送囚也\n淳于公　當行會逮罵其女云\n胥靡　史楚王戊胥靡申公注云連繫而相隨服役之也\n琅當　王莽傳鎖以鐵琅當其頸傳詣鍾官注琅當長鎖也\n瘐\n死　宣帝詔繫者或以掠辜若飢寒瘐死獄中長吏何心其令郡國歲上繫囚以掠笞若瘐死者所坐名縣爵里丞相御史課殿最以聞注瘐病囚徒病瘐死音庾\n獄中為誄　後漢杜篤字季雅下獄會大司馬吳漢薨世祖詔諸儒誄之篤於獄中為誄之辭最高帝美之賜帛免刑\n械自解　許楊字偉君少好術數為汝南太守鄧晨署楊為　　豪右欲陂殺事獄所在楊一無所驗遂共譖楊受賂下獄而械輒自解獄吏白晨晨驚曰果濫矣太守曰聞忠信可以感靈即夜出楊遣歸時天陰暗夜中若有火光照之時人異之\n救火　晉棗邑丞劉棨坐事當死縣有野火所及棨脫械救火事畢還自著械\n劫囚　魏　　收劫父為獄吏枉法不　太守私殺太守收　又付府　殺又　之府其事　　民亡命\n導囚走　魏孫禮荒亂時與母相失馬台為求之既得後台坐法當死禮私導令踰獄乃自首主簿溫嘉之白太祖罪減一等\n失囚律　捕亡律主守不覺失囚減囚罪二等若拒得走者又減二等皆限百日內自捕得囚已死及自首除其罪又云徒流囚徒限內亡者一日笞四十三日加一等主守不覺減囚罪三等故縱者與囚同罪也\n職納橐饘　傳晉人囚衛侯寧子職納橐饘焉注饘糜也寧子盡忠於衛侯以衛侯在　　　　　之日\n身為木石與法吏為伍　司馬遷書\n跡墜昭憲身陷幽圄　文選\n知母來　陸續見上\n深室　傳寧子職諸深室注別為囚室也"},{"id":"juan13-007","source":"正文","juan":"卷第十三","menu":"放囚第九","sub_menu":null,"page":"一八七","leaf":"六オ","text":"事多在寬刑門\n兩釋縲囚　傳\n故縱緩死\n乃逸楚囚　傳晉人令曰蒐乘補卒明日復戰乃逸楚囚注云緩之令逸欲使楚人知其謀也\n縱囚亡命　馬援為郡督郵送囚至司命府囚有重罪援哀而縱之遂亡命\n放歸殯母　鍾離意為堂邑令民防廣為父報讎繫獄母病死廣哭泣不食意憐傷之聽廣歸殯斂丞掾皆爭意曰罪自我義不累下遂遣廣殯母訖果還入獄意密以聞廣得減死論也\n論重者一人　魏賈逵字梁道為　　　　至斜谷水　　囚　　　　　　重者一人械其餘法　罪輕者　　大夫\n伏臘放歸　後漢虞延字子大為細陽令每至伏臘放囚歸皆克期及有一囚於家病自載詣獄至而死又\n為堂邑令丞劉　坐事當死郡以　　家有老母至節廣輒遣還家如期反\n又　曹攄字顏遠為臨淄令獄有死囚歲夕攄行獄愍之曰　　　　且不　　家　還寧乎歸獄出之剋日令還掾吏固爭攄曰此人義不見負至期並來一縣歎伏號曰聖君也\n在道解徒　　　　　　　司徒府送徒詣河內時寒徒病路過弘農　　屬縣作徒衣　　　　以聞世祖使勅曰君所使掾何仁於用心誠良吏也　　　　與　期　　　遣者\n進藥就死　樂就死注見寬刑門\n務以哀矜　仁信示其\n無苟免之心　往而守\n自拘之限　來不　獄\n施刑　若今責保識書\n誦經得脫　晉符丕左丞相徐義為慕容垂所獲械其手將殺之義誦觀世音經至夜　　　　　土開械脫出若有導之者　登期　與以為洛陽令\n出輕繫\n利徑\n惠姦寬惡\n遭遞"},{"id":"juan13-008","source":"正文","juan":"卷第十三","menu":"恤囚徒第十","sub_menu":null,"page":"一八八","leaf":"六ウ","text":"今繫者飢寒瘐死朕甚憐之　漢宣詔\n作徒衣　見上注\n給酒肉　趙廣漢為京兆尹人　　　為質　　　之末財廣漢　之曰京兆尹趙君謝兩卿無殺天子臣得赦束手得善相遇二人叩頭送獄廣漢令給酒肉至冬當出死豫為調棺斂葬具　曰死無所恨\n妻入獄　令妻入獄注見寬刑門　子\n又　晉喬智明字元達為隆慮令部人張兌為父報讎母老身有妻無子智明愍之令妻入獄陰縱之有勸逃者兌曰有君如此不忍累之於獄產一\n有官獄在獄　惠詔爵有五大夫吏六百石以上及宦皇帝而知名者有罪當械者皆頌繫寬容不入牢者也\n問囚欲言　吳顧雍為丞相為呂壹所　　　和顏色問其辭狀臨出又謂曰君得無有欲所道耶　叩頭無言"},{"id":"juan13-009","source":"正文","juan":"卷第十三","menu":"濟活囚徒十一","sub_menu":null,"page":"一八八","leaf":"六ウ","text":"邴吉拒閉使者　後書皇曾孫在郡邸獄望氣者言長安獄中有天子氣上使分條中都官詔獄繫者輕重皆殺之丙吉為郡邸拒閉使者不得入也\n袁安條奏楚獄　後漢袁安為楚郡太守楚王英反連及數千人顯宗怒甚治之迫急自誣到安不入府往案獄理無明證者條上出之掾吏叩頭爭曰如不合上意太守自坐不　　帝悟奏出四\n百餘家也\n治出　崔篆為建新大尹獄犴填滿出二千餘人掾吏叩頭曰將有悔篆曰邾文公不以一人易其身君子謂之知命如殺大尹贖二千人蓋所願也\n拷一連十　後漢寒朗以侍御史與三府掾治楚獄顏忠王平等辭及劉建等建未嘗與忠相見明帝寬試以建等物色問忠平錯愕不能對朗乃上言疑無姦但拷一連十拷十連百車駕自幸洛陽獄錄囚徒治出千人　曰仁人之言其利溥哉\n免於斧鑕　史張蒼坐法當斬解衣伏鑕肥白如瓠王陵偉之言於沛公赦不斬又暴勝之欲斬王訢訢曰　訢不足增威不如時有所寬以明恩貸勝之壯其言而赦之"},{"id":"juan13-010","source":"正文","juan":"卷第十三","menu":"錄囚第十二","sub_menu":null,"page":"一八九","leaf":"七オ","text":"有所平反　漢雋不疑為京兆尹每行縣錄囚徒有所平反母即喜也錄母為之不食長吏故不疑為吏嚴而不殘\n察顏色　後漢陸雄為青州刺史每行部錄囚徒察顏色多得情偽也\n口說　應奉為郡決曹史行部四十二縣錄囚徒數千人太守問之奉口說罪狀繫囚姓名坐狀輕重一無遺脫\n罵囚　吳呂壹以姦罪繫獄廷尉尚書郎懷敘面罵辱壹丞相顧雍元歎責懷敘云云"},{"id":"juan13-011","source":"正文","juan":"卷第十三","menu":"無囚十三","sub_menu":null,"page":"一八九","leaf":"七オ","text":"黃霸　為潁川百姓化八年獄無重囚\n董恢　為不其令獄連年無囚後漢\n劉平　為全椒令有恩惠百姓懷感刺史行縣獄無繫囚\n囹圄空虛\n議獄十四\n讞平天下獄　朱博遷廷尉職當書平天下獄恐為官屬所誣謂掾吏曰本起武吏不通法律然三尺律人事出其中諸君試取吏議難知者來為諸君覆之乃為平處十中八九吏大驚異\n議驚乘輿　張釋之為廷尉上行中渭橋有人行從橋下走出驚乘輿馬釋之奏犯蹕罰金上怒其輕釋之曰法者天下所公共其時上誅則已既付廷尉廷尉天下之平用法一傾人安所措\n議盜環　又有盜高廟坐前玉環奏弃市上怒令族之釋之曰如盜長陵一抔土何以加於法乎\n傳命誤　後漢兄弟共殺人帝以兄不訓弟報兄重當待移章宣詔誤言兩報重尚書奏橋詔當斬郭躬什孫曰　令故誤傳命誤當罰金帝曰疑其故也躬白曰君子不逆詐帝曰善\n爭死上讞　張儉亡命投孔融兄褒褒不在融匿之事發并收褒融融爭死問母曰家事當任長母合當坐一門爭死郡不能決乃上讞詔坐褒\n讞不當不罪　景詔曰獄重事也人有愚智官有令讞而後不當讞者不為失信欲令務先寬也\n心不厭　景帝詔曰疑獄雖文致於法而於人心不厭者輒讞之\n再卻　廷尉張湯有疑奏已再卻矣倪寬為言其意因使寬為奏成讀之上曰然上竟所奏即傳可上曰前奏非俗吏之所為也\n移讞　讞疑也\n讞于公　禮讞獄成有司讞于公\n奏讞掾　張湯以倪寬為云云"},{"id":"juan13-012","source":"正文","juan":"卷第十三","menu":"慎刑十五","sub_menu":null,"page":"一九〇","leaf":"七ウ","text":"一人刑善百姓休和　傳\n視民如傷　國之興也\n哀矜　孟氏使陽膚為士師問於曾子曾子曰上失其道民散久矣如得其情則哀矜而勿喜\n一成盡心　刑者成也一成而不可變故君子盡心焉\n三刺　禮司寇正刑明辟以三刺一曰訊群臣二曰訊群吏三曰訊萬民其有罪方赦之以示不枉濫也\n伏念五六日至于旬時\n哀敬折獄\n明啟刑書\n泣持丹筆　咸吉事\n明慎　易君子以明慎用刑而不留獄\n明而不留慎而不擾　史\n死者不可復生　漢書獄者人之大命云云\n欽恤　欽哉欽哉惟刑之恤哉\n文而不害\n嚴而不殘　雋不疑\n簡孚　核其罪有信驗\n審克　詳審\n閱實　罪罰相當\n制獄長之命　死者不生\n念輕重之刑　欽哉惟恤\n中與用情　周禮\n八辟　周禮以八辟麗邦法一議親二議故三議賢四議能五議功六議貴七議勤八議賓\n麗事　麗附也謂當其本罪之事\n辭旨明徵　法宜慎審\n審慎國章斯抵　讞合經法中刑輕重\n赦　禮凡制五刑法輕無赦\n況慎惟不擾　安在\n恤在一成　慎其三覆\n奏讞　漢宣令季秋後請讞上常幸宣室齋居而決事獄刑號平矣\n去酒肉　杜緩為廷尉治詔獄每冬月封具獄日常去酒肉有食官每感其恩也\n涕泣　漢魯恭為御史大夫每言奏上具獄事有可知卻之不得已者涕泣面付之\n人命所懸"},{"id":"juan13-013","source":"正文","juan":"卷第十三","menu":"法官獄吏十六","sub_menu":null,"page":"一九〇","leaf":"七ウ","text":"過聽殺人　史李離晉文公理官也過聽殺人自拘當死文公曰官有貴賤罰有輕重下吏有罪非子之過也離曰臣居官為長不與吏讓位受祿為多不與吏分利今過聽殺人傳其罪下吏非所聞伏劍而死也\n練法令　孔光為　　　　練法令\n新治獄之吏　路温舒曰秦有十失其一尚存治獄之吏是也今獄者上下相毆以刻爲明深者獲功名者多後患故人死非憎人自安之道上黙然\n增平秩　宣詔曰令廷平任輕祿薄爲其廷平秩六百石員四人務公平之選\n求明察寛恕　于定國求明察寛恕黄霸以爲廷平\n傳古義　武帝方向入學張湯以大獄欲傅古義乃請博士弟子治春秋補廷尉史\n鬻學　倪寛射策補廷尉文學卒史爲人温良口不能言語發明張湯盖用法律吏謂寛不習事不署從　史\n世非法家　楊賜爲尚書令數日出爲廷尉自以世非法家遂辭以特進就第\n三世廷尉　吳雄子訢孫恭三世廷尉爲法名家\n理曹掾　置理曹掾主法曹\n身無王爵非廷尉所科　晉王彪之字叔武爲廷尉有永嘉太守謝毅赦後殺同郡人周矯矯從兄球詣州訴冤楊州刺史殷浩收毅付廷尉彪之以球爲獄主身無王爵非廷尉所利不肯受與州相反覆詔令受之彪之頭引據時人比之張釋之\n請置律博士　晉衛覬奏刑法國家所重而私議所輕獄者人命所縣而選用者所卑請置律博士相教授遂施行\n斷獄飲酒　于定國飲酒數石不亂冬月請治獄飲酒益精明爲廷尉\n去酒肉\n見慎刑門\n不讀律而得廷尉之稱\n方知獄吏之尊　周勃\n死灰不然　見獄門\n如老獄吏斷　見推斷門\n不用三冬　見推斷門"},{"id":"juan13-014","source":"正文","juan":"卷第十三","menu":"舉案第十七","sub_menu":null,"page":"一九一","leaf":"八オ","text":"按事發姦　漢尹翁歸補河東卒史按事發姦太守田延年重之\n司察　蓋寛饒文公爲司隷　所迴避王生與書曰明主知君公正命君司察之位然既明且哲以保其身不納竟自刎\n逢諸葛　諸葛豐字少季爲司隷刺舉無所迴避人曰間何闊逢諸葛舉節校侍中許章遂詔司隷去節司隷去節自豐始也\n埋輪　後漢舉八使天下舉按不法張綱爲侍御史使最年少官卑受命詔乃埋輪於洛陽道中曰豺狼當路安問狐狸遂奏大將軍梁冀等罪不法朝廷振竦\n鷹隼始擊　漢孫寶字子嚴爲京兆尹立秋日署侯文爲東部督郵引見曰今日鷹隼始擊當順天氣成嚴霜之誅掾部有人乎文曰無其人不敢空受職寶曰誰也文曰杜稺季寶意良久曰其次誰文曰豺狼當路安問狐狸寶黙然稺季聞之杜門不\n持要　部刺史奏京兆持要事爲丞相奏　　　苛客云云威遊養網也\n二天　後漢蘇章爲冀州刺史按故人清河太守貪酒飲太守喜曰人皆有一天我獨有二天章曰蘇君與故人飲私恩也明日冀州刺史按清河太守公法也遂正其罪焉\n所劾多　范滂爲太尉黄瓊所辟詔三府掾屬舉謠言滂奏刺史二千石權豪二十餘人尚書責所劾猥多疑有所私也\n斂手避二鮑　鮑永爲司隷以鮑恢爲從事俱抗直不避彊禦世祖曰貴戚且斂手以避二鮑\n怪鳥　孫盛爲長沙太守頗營貨賄桓温遣從事至郡服高名不加劾盛與温牋辭旨放蕩曰從事進無威鳳來儀之美退無鷹鸇搏擊之用徘徊湘川將爲怪鳥温怒遣按　私按章收　州不坐\n不避權貴　後漢董宣爲　市令世祖舍中兒犯法宣殺之\n縣令收督郵　魏志滿寵爲高平令市人張包爲郡督郵貪穢因來在傳舍寵收之即日考竟遂弃官\n白簡坐而待旦　晉傅玄字休奕爲司隷校尉天性峻急每當奏劾或値日暮捧白簡整簪帶竦踊不寢坐而待旦\n不避豪貴　趙廣漢爲京兆尹至霍禹第突入其門搜索私屠酤推破盧罌斬關而去\n不劾賢者　晉羅含君章桓温使撿郡謝尚含至不問郡事與尚副欲而還温問所劾含曰公以尚何如人温曰勝我含曰豈有勝公而行非邪温義之"},{"id":"juan13-015","source":"正文","juan":"卷第十三","menu":"誅罰第十八","sub_menu":null,"page":"一九二","leaf":"八ウ","text":"失財者誅　周禮太宰治都縣都之治乘其財用之出入凡失財物用辟名者誅之注辟名詐爲文書與實不相應\n考群吏之理　太宰以八柄詔王馭群臣百官府各正其治受其會從會大計也其三歲大考群吏之理而誅賞之\n善罰者刑省而姦禁　文子\n謫滿百　漢陳遵爲掾不視事當官吏白陳掾今日以某事謫遵曰滿百乃相聞者事謫滿百當免\n自省　晉宣帝問諸葛公起居何如曰使者曰罰二十以上皆自省覧帝曰其能久乎\n議罰　漢韓延壽爲東郡　臨出上車騎吏後至敕功曹議罰門下卒白曰明府早嚴父老來出騎吏父來不敢入吏出趨謁父以敬父見罰得無傷大化乎延壽曰微子之言太守不知過\n族誅豪猾　濟南三百豪瞷二千石不能制郅都爲太守族誅也"},{"id":"juan13-016","source":"正文","juan":"卷第十三","menu":"淫刑第十九","sub_menu":null,"page":"一九二","leaf":"八ウ","text":"與暴政酷政相類也\n哀刑政之苛\n淫刑以\n逞誰則無罪　傳\n僭濫頗邪懼及善人　濫刑\n楚多淫刑　其大夫逃死於四方\n繁刑　晏景公繁於刑有鬻踊者故晏子曰踊貴屨賤\n淪胥以鋪　若此無罪\n無所措手足　謂刑罰不中\n淫縱枉橈　曲入人罪也\n殺不辜　書與其殺不辜寧失不經\n明刑不暴　管子\n秦設重刑赤衣半道　漢名臣奏云\n雖鄭傅猛政則曰寛難　而楚用淫刑誰能救療\n弄法　濫施\n殺餉獄者　義縱爲定襄太守則捕獄中輕重罪四百餘人兼昆弟親戚私入相視或餉者亦二百餘人鞫爲解脫死罪之罪盡殺之\n焚林斷木不時命曰傷地斷獄　五刑不當命曰傷人\n緩深固之罪　急縱出之誅"},{"id":"juan13-017","source":"正文","juan":"卷第十三","menu":"峻刑第二十","sub_menu":null,"page":"一九三","leaf":"九オ","text":"記曰刑肅而俗敝則民不歸也\n是謂疵國　肅峻也疵病也\n民免而無恥　齊之以刑\n殷人先罰其人敝勝而無恥　勝苟免也\n虞夏之道寡怨於人　少文法也\n考三章之法　漢室勃興\n鑒五虐之刑　苗民自變\n廢興斯在　用捨可知\n夏人不敝　資於後罰\n秦民自敗　由用峻刑\n雖人慢於政寛　未盡善也\n比俗敝而刑肅　不猶愈乎\n雖鄭傅猛政　或謂寛難\n而苗用虐刑　每聞過絶\n刑繁國敝　政猛人殘\n法令滋章盜賊多有\n法繁於秋荼網密於凝脂　秦\n嚴斷刑獄以威　其刑淫\n其政察察　其人缺缺\n人之多幸　必務猛以濟寛\n令出惟行　所宜廣克厭愛\n示人知禁凡執禁以齊衆不赦過　禮\n民之多僻　大爲防而猶踰\n邦有常刑　小不忍而惡亂\n亂而益敝過\n當傷深\n疾病之心\n法家少恩　文吏巧詆\n商君酷法　見斂於秦\n子産正刑　遺愛於鄭\n脅肩累足猶懼不見察\n赭衣塞路　囹圄成市"},{"id":"juan13-018","source":"正文","juan":"卷第十三","menu":"酷吏二十一","sub_menu":null,"page":"一九四","leaf":"九ウ","text":"嗟哉是聞子玉鞭貫　子玉治兵終日而畢鞭七人貫三人耳\n安忍無親\n以民爲土芥　國其亡也\n刀鋸鑽鑿　國語大刑用兵甲　鉞次刑用鑽鑿薄刑用鞭扑也\n既乖勿喜之言　豈念如傷之見\n夫樂殺人者　不得志於天下也\n以苛爲察以刻爲明　漢書\n斷之以剛　傳\n依勢作威　勢位也\n倚法以削　倚刑法以行刻削之刑\n報虐以威　言以威刑報上爲虐\n于公高門以待封嚴母掃墓而迎喪　文選\n蒼鷹之目　郅都搏擊豪彊時號云云也\n乳虎之稱　甯成苛酷人語曰寧値乳虎無直甯成一怒\n屛弃仁恩　專行毒痛\n鞭貫立威　筆削入罪\n商鞅嚴刑自斃　爲法自斃\n延年酷法見誅　漢書嚴延年爲河南守峻刑酷法時人號爲屠伯後坐枉法殺人所誅其母不哭之\n周紆父子伏誅　後漢周紆字文通爲渤海太守酷虐每赦至先決刑後宣赦後坐事父子皆伏誅\n苟希兄弟見害　字道將\n北風刺虐也　衛國並爲威虐\n視人如讎殘人以逞將戕於餘　戕殘殺也\n忍人是可忍也不得其死\n吹毛　刻骨\n東濕　甯成操下如東濕言急也\n巧詆雖稱疾惡無乃忍人\n吏惟巧詆　刑則濫施\n法家少恩　文吏巧詆\n慘礉　史記非善刑名慘礉少恩也\n渭水盡赤　商君臨渭水論囚七百餘人渭水盡赤\n酷烈　雖敝秦法酷烈\n虎穴　尹賞爲長安令穿地深數丈内人於中百人爲一　　以大石覆　數日一發視皆相枕藉死人\n虎穴\n杜周内深次骨操切服下減宣微文深詆張湯舞智御人急縱出之刑　刑法志緩操故之法急縱出之刑言縱罪失出者誅急\n地臼木杵　陳咸爲南郡太守以殺伐立威豪猾大姓犯法輒計具符下以律程作司空司空主役官也爲地臼木杵不中程或私脱鉗鈦及衣服不如法輒加罪督作劇不勝痛自到死者歲數千百人久者出腐爛家不得収注鉗在項鈦在足者\n展月　見暴政門\n鬻棺之喻　令獄吏以苛爲察以刻爲明深者獲功名平者多後患諺曰鬻棺　之賈欲歲之疫非憎人欲殺之利於人死獄吏之刻深亦猶此\n埽墓之識　嚴延年事見上注\n泥塗罪人不與食　晉王宏字正宗爲河南尹無能名爲苛碎枉梏罪人以墨塗面置深坑中餓不與食後有罪帝以宏累有政聲以贖論也\n王法大刑不可以委曲生情毀身焦膚　分骸斷首"},{"id":"juan13-019","source":"正文","juan":"卷第十三","menu":"失入第二十二","sub_menu":null,"page":"一九五","leaf":"十オ","text":"事具鍇慎門\n刑僭則懼及善人枉橈不當反受其殃　枉橈曲入人罪也\n察阿黨　謂獄官以私恩\n情匪哀矜理乖明啓　明啓刑書\n入人之罪罰既爽於恭行　罪宜甘於反坐\n制短長之命　豈可復生\n斷出入之刑　不推恤\n刑重典　平人\n國章斯抵　誠合申嚴\n人命所懸　豈宜失入\n過　當傷深\n濫施未聞情得　旅見獄成\n罪雖自擬　既有常刑\n死不復生　曷宜過當\n不平謂何"},{"id":"juan13-020","source":"正文","juan":"卷第十三","menu":"失出第二十三","sub_menu":null,"page":"一九五","leaf":"十オ","text":"事具鍇慎門\n利淫與其殺不辜寧失不經寧僭無濫　賞不僭刑不濫不辜而過寛僭濫\n察阿黨　見失入門\n罪無掩蔽　禮\n既乖明啓之文　宜寛利淫之罪\n急縱出之誅　刑法志\n輕典容姦　禮\n情非故縱　罪則減論\n惠暴養寛惡　刑法志殺人不死傷人不刑是惠暴而寛惡也\n法不平二十四\n苑柳　詩刺刑罰不中\n同罪異罰非刑也　傳\n上下其手　王子圍與穿封戍爭囚伯州犁問囚上下其手曰王子圍寡君之貴介弟戍方城外之縣尹也注上下其手所以導囚意也\n隨上意　張湯爲廷尉上意欲罪與監吏深刻者上意欲釋與監吏輕平者所治即奏其舞文巧詆小吏多爲爪牙用也\n以主意爲獄　杜周爲廷尉客謂之曰君爲天下決平不循三尺法專以人主意旨爲獄獄當如是乎周曰三尺安出哉前主所是著爲律後主所是疏爲令\n以善疾惡　後漢朱暉爲臨淮太守好節槩所拔用皆厲行士諸報怨以義犯法者皆爲求理多得出濟不　之也人　懼什也\n兩劾　嚴延年爲涿郡遣吏趙繡案大姓東高氏繡爲兩劾先白輕者欲觀延年意怒即出其重劾延年察知遂殺繡\n抑彊扶弱　嚴延年爲河南守其治務抑彊扶弱弱者雖陷法曲文出之豪傑者以文内之當生者詭殺之人莫之測也\n撓法　周陽由專豪傑愛者撓法活之憎者曲法殺之\n不當罪則侮　當罪則威刑也\n古者刑不過罪爵不踰德　荀卿子云\n刑不應罪　賞不酬功\n張敞　爲京兆尹賞罰明時越法縱舍也\n枉橈反坐頗類偏黨其罪惟均所罰不一罪無等差　刑有輕重\n高下其心"},{"id":"juan13-021","source":"正文","juan":"卷第十三","menu":"刑措第二十五","sub_menu":null,"page":"一九六","leaf":"十ウ","text":"五刑不用善人爲邦百年　勝殘去殺\n虞夏之道寡怨於人　少文法也\n刑不施而人咸服畫冠　堯畫衣冠爲刑而人不犯\n罔或干政　帝曰皐陶惟茲臣庶罔或干予政言下順命也\n期于無刑　書曰刑期于無刑民協于中注云以殺止殺而刑措\n不犯有司　書茲用不犯于有司言人不犯罪\n昔唐虞畫冠而人不犯周之成康刑措而不用　漢武詔\n周之成康　見上\n漢之文景　文帝用張釋之爲廷尉罪疑者予人是以刑罰大省至於斷獄四百有刑措之風景帝定令讞而後者得全\n辟以止辟　刑期無刑"},{"id":"juan13-022","source":"正文","juan":"卷第十三","menu":"改制法令二十六","sub_menu":null,"page":"一九七","leaf":"十一オ","text":"法若易方　人難知禁\n政有弛張　法存除章\n法宜適變　安可執迹\n所宜去彼取此　不可以古制今\n法不前定　官將議依\n百王造殷因　並頻於制\n漢除秦敝　亦便於時\n言之不中　雖新意而必爲\n事必有初　率舊章而則可\n若議事之刑　議事以制\n則舞文之吏　吏因緣爲姦\n無作聰明亂舊章　章典也書\n罔以側言改厥度　度法也\n晉鑄刑鼎　晉范宣子所爲刑書仲尼曰晉其亡乎失其度矣夫晉國將守唐叔之法度以經緯其人范宣子之刑是晉國之亂制也\n惟聖作則　則法也\n畫一　漢蕭何爲法講若畫一曹參代之守而勿失\n不刊之典\n苟可彊國利人何必守文拘制　史商鞅欲變法曰人可樂成不可與慮始苟可以彊國利人何憚改革法律甘龍曰聖人不易人而教智者不變法而理因人而教不勞而成功因法而治吏習而人安鞅曰此世俗之言也常人安於俗學溺於所聞此二者居官守法可也非所以論彊國利人之術也三世不同禮而王五伯不同法而霸智者有作愚者制焉賢者更禮不肖者拘焉是以治不一道也故湯武不循古而王夏殷不易禮而亡反古者不可非而循禮者未足多也\n周因殷禮政亦不愆\n漢除秦刑人是以息　苟用捨而合道盖於革而何傷\n簡要疏章　法令滋章盜賊多有\n協中　書合于中之法\n建中　立大中之法\n中行之作晉鼎見誚仲尼　見上\n子産之鑄鄭書終懟叔向　鄭人鑄刑書叔向詒子産曰先王議事以制不爲刑辟懼人之有爭心也人知有辟則不忌於上並有爭心以徵於書以成之夏有亂政而作禹刑商有亂政而作湯刑周有亂政而作九刑三辟之興皆叔世也今吾子相鄭國制參辟鑄刑書將以靖人不亦難乎人知爭端將弃禮而徵於書錐刀之末將盡取乎所聞國將亡必多制其此之謂乎子産曰僑不才不能及子孫吾以救世也既不承命敢忘大惠\n不利百變　也變法\n官或變法　人負罪罰\n非利百之謀　不變法\n遵畫一之義　自合守文\n仍舊貫　論語 貫事也\n新意何必改作\n相沿　不改也\n禮有所定　禮事有定則不因\n析言破律殺無赦\n易其紀律　易則生亂\n舞文弄法\n若從私議　公文是\n舞法無改度　義有隨時\n適道在權　貴變故時\n革故取新\n捨舊謀新\n相時革敝\n作古有初\n壞法亂紀\n蕭何定律　參　運堂\n無自立辟　辟法也\n三尺安出　客謂杜周曰君不循三尺法周曰三尺安出哉先王所是者疏為律後王所是者著為令\n刪定奏上　後漢應劭刪定律令撰具律本章句尚書舊事廷尉取令從事以例司徒都目五曹詔書及春秋治獄凡二百五十篇蠲去重復奏之\n請刪削　陳寵　　奏　令條法　　於甫刑者九百八十九宜令三公廷尉平定應經合義刪除其餘\n越律　　　馬長條奏越律與律　取者十餘事申明舊制約束之也\n自敝　商"},{"id":"juan13-023","source":"正文","juan":"卷第十三","menu":"死罪二十七","sub_menu":null,"page":"一九八","leaf":"十一ウ","text":"死者不可復生　漢文詔\n制短長之命　書\n死者不恨　宣詔曰獄者萬人之命能使生者不怨死者不恨則可謂文吏矣\n斬殺必當　月令\n鈇鉞肆諸市朝　景伯云於公伯寮吾力猶能肆諸市朝\n仲春無肆掠　肆　　也月令\n以殺止殺　書\n呂刑曰大辟疑赦其罰千鍰　大辟死刑也死罪有疑則赦之罰千鍰以贖死罪也\n致辟　誅殺罪也\n在大辟　禮\n念施刑之後　不可復生\n當結罪之　則　所宜律恤\n死刑　周禮\n是全要領　禮\n無所加誅　一死\n國章斯抵　議合申嚴\n人命所懸　亦宜審詳\n議獄緩死　易\n莫大之刑\n刑故無小"},{"id":"juan13-024","source":"正文","juan":"卷第十三","menu":"流罪二十八","sub_menu":null,"page":"一九八","leaf":"十一ウ","text":"舜典曰流宥五刑　宥寬也以流放之法寬五刑\n屏之遠方以御魑魅　舜流四凶族投諸四裔以禦魑魅\n投畀有北　詩\n四罪　長沙王\n流有宅五宅三居　居罪人遠近有三等\n四裔是投　罪輕重而不等\n五流斯宅　居處遠近而有差\n黜惡　禮\n流凶　四凶\n去邪　勿疑\n去父母之邦\n緩死　申恩\n徙於瘴癘　移人魑魅\n放流玄冠縞武不齒之服　所放不率教者禮\n宥汝以遠　傳子產謂子南曰君不忍宥汝以遠勉速行乎\n晉放大夫胥甲父于衛　古者大夫已去三年待放君放之非也大夫待放正也見公羊傳\n莊舄曰越之流人去人滋久思人滋深\n流在裔土以實裔土　國語\n信無罪而棄逐　騷\n雖處罪放講學不倦　吳志虞翻性疏直孫權怒徙交州雖處罪放講學不倦\n上書曰長沒海隅生無可與語死以青蠅為弔客足矣\n罪窮兩造　既明奪吾人\n流宥五刑　自宜遷適　土\n聖代好生　既宥　以遠也\n小人懷土　尚於我有九等\n四罪而天下咸服　舜流共工等\n播弃　謫播弃徙之於蜀 漢 簡\n投荒"},{"id":"juan13-025","source":"正文","juan":"卷第十三","menu":"貶黜第二十九","sub_menu":null,"page":"一九九","leaf":"十二オ","text":"三黜　柳下惠為士師三黜曰直道而事人焉往而不三黜\n三巳　令尹子文三巳之無愠色\n降階白衣領職　晉周顗伯仁為吏部尚書以酒為有所糾詔令白衣領職\n左遷　左降左轉左授\n思過之地\n放黜　師保 書\n黜爵　禮\n簡不肖以黜惡　禮\n事君三違不出境　則利祿也雖曰不要君吾不信\n奪之官邑\n咸黜不端\n再免　潘安仁再免官\n黜其宜也　鄭\n黜乃亂也　子\n放臣　楚大逐臣 遷客\n禦魑魅\n行吟澤畔　屈原既放乃行吟澤畔\n懷沙　屈原作懷沙之賦自沈汨羅而死也\n召歸宣室　賈誼謫居長沙長沙卑濕自傷悼為鵩鳥賦後\n文帝思誼徵還上在宣室召誼入語\n俟罪長沙　賈誼謫為長沙王傅既已謫去渡湘為賦弔屈原曰恭承嘉惠兮俟罪長沙側聞屈原兮自沈汨羅\n謫罪人\n黜伏\n謫去　遷居\n直道獨醒\n謫居三年　去屏\n失恩　禁閉\n俟罪荒陬瘴癘\n賈誼長沙之中　賈傷伏鳥\n屈原汨羅之上　見著楚騷\n將不甘心　故無鉗口\n投諸四裔"},{"id":"juan13-026","source":"正文","juan":"卷第十三","menu":"徒役第三十","sub_menu":null,"page":"二〇〇","leaf":"十二ウ","text":"于役\n計年斷徙\n配役\n驅以就役\n計徒　傳曰計徒庸也\n役諸司空　周禮凡萬人有罪者桎梏而坐諸嘉石役諸司空重罪旬有三日坐期月役則宥而赦之注云役者使給百工之役者也\n代薪之年　徒也鬼薪\n就役\n計日徒坐\n舂藁　徒役女子之所\n凡害人者寘之圜土而施諸職事以明刑恥之　明刑書罪惡於大方版著其背也\n不齒三年　不得列於平人\n不能改出乎圜土而殺之\n司圜掌收教罷民\n凡害人者不使冠飾　著墨幪古象刑\n任之以事　若今罰役\n上罪三年而舍中罪二年下罪一年\n凡圜土之刑人也不虧其體罰人也不虧其財\n漢惠詔上造以上內外公孫有罪當刑及當為城旦舂比耐為鬼薪白粲　城旦謂旦起治城舂者婦人不預外徭役但舂作米皆四歲刑鬼薪取薪給宗廟白粲令擇米皆三歲刑\n張蒼定律諸當完　完當為髡者完為城旦舂滿三歲為鬼薪白粲鬼薪白粲一歲入于隸臣妾隸臣妾一歲免為庶人　男子為隸臣女子為隸妾\n逃亡及　罪以上不用此令\n有爵者七十\n者未齔者皆不為奴　有爵謂命士已上男子八歲女子七歲而齔皆不為奴也司厲之職也\n復作　漢言使女徒復作 作復作弛刑徒\n弛刑徒　不私鑄但責保\n贖山錢　帝紀天下女徒已論歸家出贖山錢月三百\n王陵為刑徒於道　魏王陵過事見五歲當補道"},{"id":"juan13-027","source":"正文","juan":"卷第十三","menu":"贖罪第三十一　罰附","sub_menu":null,"page":"二〇一","leaf":"十三オ","text":"如可贖兮　詩\n虞典曰金作贖刑　誤入刑者以金贖罪\n周穆王訓夏贖刑　　　　　　　以赦告天下\n百鍰　鍰黃鐵也六兩曰鍰罪贖以百鍰重倍加至千鍰也\n免於刑戮\n納贖　選\n罰金　張釋之為廷尉文帝出中渭橋有人從橋下走出乘輿馬驚釋之奏此人犯蹕當罰金上怒釋之對曰法者天下公共不可一傾者云云\n以功贖罪　漢　　　　　　　　有罪當斬贖為庶人　　　將軍有功贖罪\n訓夏之刑\n贖子罪　漢丞相公孫賀請捕朱安世以贖子罪 子殺　也西京賦曰\n贖入罪　史太倉令淳于公犯法當刑幼女緹縈上書曰妾父為吏齊中皆稱其廉平今坐法當刑妾傷夫死者不可復生刑者不可復續雖欲改過自新其道無由妾願沒入為官婢以贖父刑帝哀憐之乃下詔除肉刑\n千鍰　贖大辟死罪\n周禮職金掌金罰入于司兵　以金以貨贖罪者也入於司兵以給兵及工直也\n底族亢身\n以貨藩身\n論贖刑於子寵\n實是于闕\n五罰之疑有赦　五罰出金贖罪 書\n輕重諸罰有權\n入粟贖罪　漢張敞言國兵在外軍旅不足願令有罪非盜受財殺人犯法不得赦者得以差入穀蕭望之李彊議曰今以贖罪則富者得生貧者獨死是貧富異刑而法不一人情貧窮父兄囚執聞出財得以生活則不顧死亡之患為財亂之行以赴財利救親戚一人得生千人已喪此則伯夷之行壞公綽之名滅教一傾恐不能復竟不施敞議\n請除贖罪之法　貢禹上書\n買爵　惠紀人有罪得買爵三十級以免死罪應劭云若今人三十　贖罪師古曰令出買爵錢以贖罪也\n減死罪一等　武帝令死罪人贖錢五十萬減死一等云云\n出縑　續漢書建武初令天下繫囚減罪一等出縑贖罪輕重有差\n兵甲贖　管子曰管仲令齊桓公制重罪贖以犀甲一戟輕罪贖以　盾一戟注云爾兵不足\n義錢　後漢虞詡為僕射時長吏　　　罰者輸贖號義錢託為貧人儲而守令因以聚斂詡上疏論之詔下詡責刺史也\n入縑　後漢明帝詔亡命者自殊死已下贖死罪縑三十疋右趾至髡鉗城旦舂十疋城旦至司寇五疋未發覺自告者半入\n廣請設為奴贖父罪　年十三晉　中帳吏部郎　　　官　三十合三十人棄市廣二子　　撾登聞鼓求為奴以贖父罪尚書　　　　曰　　　　以殺止殺小不忍輕刑典人之愛父誰不如此為施恩於今開疑於後宜坐廣而\n左驂之贖　晏子出遭越石父賢在縲紲之中晏子見而解左驂以贖之"},{"id":"juan13-028","source":"正文","juan":"卷第十三","menu":"緩獄第三十二","sub_menu":null,"page":"二〇二","leaf":"十三ウ","text":"國章斯抵　宜守限於中嚴\n人命所懸　豈忘情於審慎\n況刑將不變\n獄貴惟精\n月令仲春天子命有司省囹圄　省　囹圄也\n去桎梏　　　桎梏也\n無肆掠　　　是也\n正獄訟　孟夏\n挺重囚　挺寬也至秋方欲\n出輕繫　出而合之\n要囚伏念五六日至于旬時　要囚謂其辭也\n君子以明慎用刑而不留獄　易旅卦\n雖緩死以過時　未盡善也\n計失刑於欲速　不審息乎\n毀丹筆\n君子以議獄緩死　易中孚卦\n緩刑　周禮\n留容姦　禮\n利淫淹恤過時　亦宜問罪\n稽留有故　亦可徵辭\n若審慎而無他　雖明而可恕\n將赦罪之有程　敢忘慎守\n未得情而難斷　寧免稽遲\n當斷不斷"},{"id":"juan13-029","source":"正文","juan":"卷第十三","menu":"留獄第三十三","sub_menu":null,"page":"二〇二","leaf":"十三ウ","text":"月令仲秋命有司申嚴百刑無留有罪\n既非伏念之勤　且及\n過時之責\n雖事無欲速　而法有句稽\n而不留獄　易上見\n淹恤過時　則宜問罪\n稽留有故　亦可徵辭\n若審慎而無他　雖愆期而可恕\n雖赦罪之有程　敢忘慎守\n未得情而難斷　寧免稽遲\n若論伏念之時　淹恤不創\n則恐舞文之吏　因緣表裏\n雖要囚惟恤　而折獄有程\n既察情而得情　何當而不斷\n違限之糾　慢官之罰\n聽訟之要　辭既易於二三\n伏念之期　日逾於五六"},{"id":"juan13-030","source":"正文","juan":"卷第十三","menu":"疑獄第三十四","sub_menu":null,"page":"二〇三","leaf":"十四オ","text":"記曰疑獄氾問與衆共之衆疑赦之\n疑事無質　質成也疑則若之不可成言也\n孤疑\n宣尼之聽訟斷不獨見也　史記孔子在位聽訟之辭有可與人共者不獨有也\n漢景之恤疑獄亦命讞之　漢景詔曰獄疑者讞　　讞者已報讞而後不當讞者不為失\n罪疑惟輕　典書\n周書曰五罰之疑有赦　罰　刑罪也刑疑赦從罰罰疑赦從免言重疑也\n似是而非\n禮曰有指無簡不聽　簡誠也雖有其意無其誠者不論以為罪\n附疑　　從\n務讞\n讞疑　罪疑從刑\n得情猶合哀矜　疑事宜闕\n諸疑獄雖文致於法而於人心不厭者輒讞之　景帝詔\n吏不能決　高詔御史獄之疑者吏不能決　有罪者久而不論無罪者久繫不決自今縣道官獄疑者各讞所屬二千石官二千石官以罪名當報之所不能決者移廷尉廷尉亦當報之廷尉所不能決者具奏\n平亭疑　史張湯決獄欲傅古義乃請博士弟子治尚書春秋補廷尉史平亭疑法注亭均也\n法讞疑事　必先奏上　則其原上所是受而著讞決法廷尉挈令注云著謂明書之挈者獄訟之要也書於讞法挈令以為後代式挈音契\n雖國令是干　罰宜從小\n而人心未厭　事合從輕"},{"id":"juan13-031","source":"正文","juan":"卷第十三","menu":"贓賄第三十五","sub_menu":null,"page":"二〇四","leaf":"十四ウ","text":"六贓\n賄賂公行\n子東子求\n賄賂並行\n政以賄成　王叔之相也政以賄成而刑放於寵\n黷貨　晉 有手者鮒者黷貨無厭亦將及矣\n獻子辭梗陽之賂　傳梗陽人有獄以女樂賂魏獻子獻子將受之閻沒汝寬諫曰三歎而止\n叔魚鬻邢侯之獄　叔魚納雍子之女蔽罪邢侯叔向曰鮒也鬻獄\n以黷賄賂而煩刑書\n貪以敗官為墨\n既求私貨　宜正官刑\n情因利動　子之求\n遽聞雍政以賄成　遂受梗楊之賂\n臨財苟得　宜不懼於四知\n黷貨無厭　又飼於三尺\n相賂以貨\n受悖入之貨　禮\n私求　墨私欲\n養寇\n不給則應　傳\n刑枉　貨賄\n不恩切於己　皆是飼財\n受官屬財物　景詔吏遷徙免罷受故官屬所將監臨送財物奪爵為士伍免之注有爵者奪爵為士伍又免其官職若今之除名從仕卒之位\n景詔無爵者罰金二斤　沒入所受有能捕告畀其所受贓\n和賞　漢文時張武受金帝加賞賜以愧其心\n私附益　丞相司直繁延壽奏御史大夫望之言買私而附益十萬三千注云以私錢增益\n受飲食　景詔吏受所監臨飲食免重受賕物賤買貴賣論輕更議著令廷尉與丞相議曰吏及諸有秩皆受其官屬所監臨治所將其與飲食計償費勿論注云計所費償直也他物若賤買貴賣坐贓為盜沒入縣官\n禁錮　漢文時貴廉絜賤貪污賈人贅婿及吏坐贓皆禁錮不得為吏賞善懲惡\n自條其姦贓\n應記　薛宣為馮翊其高陵令楊湛貪猾宣手自牒書條其姦贓與湛湛自知贓應記解印綬為記謝注云應記為與宣書相當\n妻受錢　薛宣時為池陽令舉廉掾王立府未召妻受囚家錢掾不知悲慙自殺宣移書掾之柩以顯其魂也\n銖兩之姦　趙廣漢字子都精在吏取銖兩之奸皆知之\n陳咸為少府\n姦贓　入\n辜榷財　辜罪也榷專固財也　音\n主\n守盜十金弃市　丞　　方進云\n盜取外國財物　陳湯盜取康居財物戒官屬曰絶域不還校丞相匡衡奏雖在赦不宜處位坐免\n古者大臣坐不廉而廢曰簠簋不飾　尚遷爲之諱也賈誼曰\n貨賂上流　公孫\n謝錢　孔豊居守張匡坐贓報匈奴湯爲訟罪得踰冬月許謝錢二百萬\n懷慙自殺　後漢皇甫嵩義真爲冀州牧車騎將軍吏人有受賂嵩更以財物賜之吏懷慙自殺也\n米肉　卓茂爲密令人有言吏受其米肉者茂曰汝自以恩意遺之吏不當以威力强取也\n禁錮二世　清河相叔孫光坐贓禁錮二世居延都尉犯贓楊震等議光比劉愷以春秋惡止其身禁子孫非詳刑之意也\n封記還　鍾離意爲郡督郵縣亭長有受人餽禮郡下記治之意封記曰政化由近及遠宜先清府內闊略遠縣微細之愆太守賢之任以政事\n酒食爲贓　王吉爲沛相有饋其酒食爲贓者雖十年猶加貶弃注其名籍也\n不以贓杖鞠人　來安　部公爲河南尹政號嚴明未嘗以贓杖課兄郎嘗曰鞠人於罪世尹不忍聞者感激京師肅然也\n兄爲吏受人禮遺均諫不從均傭歲餘得錢帛與兄曰物盡可復得爲吏坐贓終身弃之兄感之遂爲廉吏\n減死遷徙　魏侍中許允擅以四割錢賜減死遷徙\n祠發臺贓錢　陶謙字恭祖爲舒令郡守張盤構有錢藏謙社祠遷呈有贓錢五百欲以爲贓謙委於官而去也官清白\n子坐贓免官　晉劉寔子真以舍人污弃於世寔坐貞受賂免官或譏寔不訓子寔曰吾之所行是所聞見不相祖習豈繼訓得乎世以寔爲言當\n子受財不累　高光爲廷尉子韶字子遠故使無檢受財有司案之高不知時人曰雖非光不能防其子以其用心有素不以爲累也\n撻子　庾冰爲車騎將軍清愼常以儉約自居中子希貸官絹十匹冰撻之市絹還官\n受家具　王述字懷祖求試宛陵令受家具一千三百條王導使人謂曰名父之子不患無祿屈居小縣不宜爾答曰當自止後居州郡清儉無倫祿賜皆散之親故宅宇不革茲昔\n清既謝於冰壺　罪何嫌於官箴\n貪泉之\n廉聞　廣州有貪泉飲之者則貪濁晉吳隱之爲刺史飲之曰更酌飲當不易心\n如水之心遂褒　鄭崇曰臣門如市臣心如水言廉也\n還珠\n懷璧\n乾沒　張湯爲小吏乾沒與長安富賈田甲魚翁叔交私注云乾沒射也得利爲乾失利爲沒\n以贓物賜　後漢北地太守廖信坐貪穢下獄入財產顯宗以班諸廉吏唯周澤孫堪常沖特蒙賜與京師翕然在位者咸自勉勵"},{"id":"juan13-032","source":"正文","juan":"卷第十三","menu":"贓賄第三十五","sub_menu":"（續）","page":"二〇六","leaf":"十五ウ","text":"受賜贓委地　交阯太守張恢坐贓伏法貲財簿入司農顯宗詔班賜羣臣鍾離意得珠璣悉以委地不拜帝怪之對曰孔子忍渴於盜泉曾參迴車於勝母惡其名也此贓穢之物誠不敢拜帝曰清乎尚書之言更以庫錢三十萬賜意意字子阿\n知而不納　南郡太守劉肇遺王戎筒中細布五十端司隸糾之以知而未納不坐帝曰戎豈懷私不欲異　所郡\n高名不劾　孫盛安國爲長沙守頗營資貨部從事至郡察其名高不劾\n調發食物　陳咸子康爲太守調發屬所生食物以自奉養爲操下今自斂\n遠郡犯贓　晉李重茂曾奏樂　林守介登役使監臨　額以遠郡非人情所禁法請以秩居官守重奏恐廉才　　遇他貨奴取\n舊免官　謂罷\n不忌無厭\n無所畏忌\n貪惏"},{"id":"juan13-033","source":"正文","juan":"卷第十三","menu":"使吏從己三十六","sub_menu":null,"page":"二〇六","leaf":"十五ウ","text":"衛司馬寬饒　漢蓋寬饒爲左司馬在部常爲衛官繇使市買衛卿私使寬饒詣府上謁辭尚書尚書責問衛尉由是不復私使候司馬\n護視家事\n爲妻先引　丞相司直繁延壽奏御史大夫蕭望之多使守史自給車馬往茂陵護視家事小吏冠法冠爲妻先引也\n迎醫　晉陶侃廬江人爲郡主簿太守張夔妻有疾將迎醫請行曰資於事父以事君小君而猶母也云云\n吏修園宅　王戎爲荊州刺史坐遣吏修園宅應免官詔以贖論"},{"id":"juan13-034","source":"正文","juan":"卷第十三","menu":"冤獄三十七","sub_menu":null,"page":"二〇六","leaf":"十五ウ","text":"策秀才文曰肺石之下不冤之人　周禮左肺石達窮民之訟注赤石也\n棘林多夜哭之鬼　　棘槐聽訟於其下夜哭之鬼　無辜者\n冶長非罪　雖在縲紲之中非其罪也\n良夫無辜　衛侯夢人被髮北面而譟曰予爲渾良夫\n叫天無辜\n多殺不辜而號無告　無所告也\n銜冤飲恨　吞聲飲恨\n秦誓曰無辜籲天　籲告也\n誣以偷金難明直氏　直不疑\n執爲盜璧誰辨張儀　楚相亡璧門下疑儀盜之掠搒數百\n劒餘冤　尚能衝斗\n日無私照　猶隔覆盆\n義夫飲恨五月降霜　鄒衍被囚仰天而歎五月降霜\n孝婦含冤三年致旱　東海于公明\n衆口鑠金　信非其罪\n片言折獄　不見其人\n君實不察其罪　申生曰\n冤濫頗邪\n瓜李雖疑　薰蕕自別\n似是而非\n冶長非罪始因居父而知\n叔向無辜終因祁奚而免\n國章斯抵　誠合申之\n人命所懸　豈宜冤濫\n黃紗失入　丹筆誤書\n獄非明察　法乃濫施\n未聞情得　且見獄成\n得情猶合哀矜　非罪誠宜開釋\n捶楚之下何求不獲　雖皐陶聽之猶謂死者有餘刑\n刑濫則懼及善人\n孝婦致旱　東海孝婦養姑甚謹夫死不嫁姑恐累之自殺姑女告婦殺母婦自誣服殺姑獄掾于公明之不可竟殺之郡界旱三年後太守至祭其家天乃立雨\n上虞寡婦　養姑事同東海孝婦姑以壽終姑女誣告婦加鴆竟結其罪孟嘗伯周爲戶曹白之不可府遂旱後太守殷丹至明之遂雨\n血逆流　晉劉隗大連爲司直丞相府斬督運令史淳于伯血逆流隗奏曰淳于伯著柱遂逆上終極未復下流百姓歎咸曰冤伯子忠亦訴父不乏軍興\n生爲窮人　死爲冤鬼\n抱恨入地　銜冤受罪\n氣怨結而不揚　涕滿注而橫流\n與濁吏何親　與冤人何仇"},{"id":"juan13-035","source":"正文","juan":"卷第十三","menu":"鬻獄三十八","sub_menu":null,"page":"二〇七","leaf":"十六オ","text":"周書曰典獄非訖于威惟訖于富　典主也訖絕也絕富謂賄賂不行\n鞫獄罪贓\n貨非寶惟府辜功　府聚\n也辜罪也功事也言受獄貨非寶惟以聚罪之事\n閑邪　買直\n刑放於寵　獄之　賄之路也\n叔魚蔽罪邢侯之獄　叔魚納雍子之女蔽罪邢侯叔向正其罪曰鮒也鬻獄\n厚賂　深誣\n貪賄賂　書撓刑\n私貨　官政\n政以賄成　由官邪也\n獄由貨鬻　則死及之\n財惟苟得　法必私行\n貪以敗官爲墨\n相賂以貨寬縱出之　漢刑書\n受悖入之貨\n禮罪以貨聞\n既貪獄貨　是瀆官刑"},{"id":"juan13-036","source":"正文","juan":"卷第十三","menu":"鞭扑三十九","sub_menu":null,"page":"二〇八","leaf":"十六ウ","text":"虞典曰鞭作官刑　治官者用鞭\n扑作教刑　榎楚也不勤道業則撻之\n月令仲春無肆掠　掠搒肆暴屍\n一扶汝庸何傷　傳\n扶其不勉者　司城子罕\n盜璧之笞　楚相亡璧張儀盜璧笞捶之\n執扑　子罕親執扑抶其不勉者\n撻之流血　禮\n鞭之見血　齊襄誅屨於徒人費\n箠令　　刑\n榎楚二物　收其威也\n示背　徒人費遇賊袒而示之背\n叩脛　孔子見原壤以杖叩其脛\n笞令　笞罰\n鞭師曹　衛侯有嬖妾使師曹誨之琴師曹鞭之公怒鞭師曹三百\n撻伯禽　成王有過則撻伯禽\n大杖小杖　子曰舜之事瞽瞍也小杖則受大杖則走故舜不失烝烝之孝瞽瞍不陷於不義\n受笞　史吏過笞趙陳餘欲起張耳躡使受笞去而責餘曰今見一辱而死一吏乎\n榜郭舍人　上令倡監榜郭舍人不勝痛也\n未嘗撻辱人　漢朱邑爲桐鄉嗇夫\n蒲鞭　劉寬事見寬刑門\n撾吏　後漢常林夜撾吏崔林謝之曰君爲廷尉耶\n撾婦翁　第五倫三娶孤女五人謂之撾婦翁\n色棒　曹瞞傳曰太祖爲洛陽北都尉治四門作五色棒懸門左右\n加笞　景詔曰加笞以　重罪無異幸而不死不可爲人其定律笞五百曰三百三百曰二百\n減笞　又詔曰加笞者或至死而笞未畢朕甚憐之其減笞三百曰二百二百曰百\n無得更人　又詔曰當笞者笞無得更人\n鞭　傳楚子玉治兵終日\n而畢鞭七人貫三人耳\n白梃　大杖也\n禁吏擅笞人　第五倫遷蜀禁吏擅笞人\n仙婦笞秦\n執敲朴鞭笞天下　過秦論\n捶楚之下　縲紲之中\n殺人以梃"},{"id":"juan13-037","source":"正文","juan":"卷第十三","menu":"象刑四十","sub_menu":null,"page":"二〇九","leaf":"十七オ","text":"尚書大傳曰唐虞上刑赭衣不純中刑雜理下刑墨幪　幪巾也\n不使冠飾　周禮害人者不使冠飾注去墨幪也\n圜土之刑人也不虧其體\n武詔曰古者異衣冠畫象而人不犯　畫墨者蒙巾也\n犯臏以墨蒙其臏畫之犯劓以赭著衣\n菲草屨非生於治古乃起於亂　刑法志曰荀卿之論刑也曰世俗論以古無肉刑有象刑墨黥之屬菲屨赭衣而不純注純緣也以爲治古無肉刑亦不待象刑矣注言人不犯法則象刑無所施也人或觸罪而輕其刑是殺人者不死傷人者不刑罪至重刑至輕民無所畏亂莫大焉故象刑非生於治古而起於亂今也注言今人惡刑之重因謂言之上古如此也　不然\n其實象刑惟明　書曰象刑惟明者孫卿謂象天道而作刑安有菲屨赭衣之罰者哉\n亂世效象刑　王莽太傅唐尊出見男女不異路尊下車以象刑赭幡汙其衣幘聞食下詔甲勑公卿令思齊封尊平化侯"},{"id":"juan13-038","source":"正文","juan":"卷第十三","menu":"肉刑第四十一","sub_menu":null,"page":"二〇九","leaf":"十七オ","text":"周書曰苗人作五虐之刑爰始淫爲刑劓刵椓黥　苗人始爲截耳割鼻椓陰黥面故曰虐也\n皇帝哀矜暴虐以威遏絕苗人　帝堯也言誅絕苗人\n今爾何懲惟時苗人斷制五刑上帝不蠲降咎于苗　苗人制五刑天乃誅之\n呂刑曰墨辟　辟刑也墨謂刻其額而涅以墨\n劓辟　截鼻曰劓\n剕辟　刖足曰剕\n宮辟　丈夫之刑男子割勢婦人幽閉\n五刑之疑有赦正于五罰　罰贖刑也五刑有疑則赦之從五罰言降而從輕也\n罰懲非死\n人極于病　刑以懲罰過非殺人也極於病苦者使之莫敢犯也\n苗人作而降咎垂誡呂刑　即尚書\n文帝廢以從寬\n稱仁漢牘　漢文去肉刑用笞罰文選曰歌聲鳴於闕下稱仁漢牘\n五虐峻刑　即上五刑\n四肢重罰　文選肉刑\n何痛如之\n刑者不可復屬　緹縈上書云屬猶連也\n想踊貴之時　俗由是戚\n念鼻劓之日　以何\n秦酷以施上服之刑　上服臯鼻墨也下服宮刖也周禮\n夫斷支體刻肌膚終身不息何其楚痛之甚也　漢文除肉刑詔云\n守門守關　漢書墨者使守門劓者使守關\n除肉刑\n加以笞名輕而實重　名輕易犯實重傷人是重人骨肉而輕人性命也魏陳羣議云云\n晉曹彥議云　　　　　　常苟免犯法乃果　刑彰罪而民知恥也\n一離刀鋸終身不齒　議\n不忍刻截之慘而安剿絕之悲　宋家議云\n議復肉刑　孔融文舉議之乃止"},{"id":"juan13-039","source":"正文","juan":"卷第十三","menu":"族誅四十二","sub_menu":null,"page":"二一〇","leaf":"十七ウ","text":"秦皇暴虐廢以三夷　文選　以三夷之刑秦法一人有罪夷三族\n商紂毒痡罪及九族　書今商王受罪人以族注刑及九族\n赤族之誅　及宗之禍\n罰弗及嗣　虞書\n夏刑孥戮　汝不從誓言予則孥戮汝\n秦法誅族　族滅之計本浮與彭寵書\n朱安世曰丞相禍及宗矣　公孫賀及父子俱死獄\n辱誅夷　三\n在父兄之不加而相及　豈宗族\n連坐濫施\n除三夷妖言令　呂氏臨朝去之"},{"id":"juan13-040","source":"正文","juan":"卷第十三","menu":"刖刑四十三","sub_menu":null,"page":"二一〇","leaf":"十七ウ","text":"事具肉刑門\n智不如葵　傳鮑莊子之智不如葵葵猶能衛足\n踊貴屨賤　傳齊景公繁於刑有鬻踊者故晏子曰屨賤踊貴\n斷其足　傳褚師聲子韤而登席公怒曰必斷其足\n不能衛足　鄭伯刖彊鉏\n子　彊鉏不能衛足\n鬻拳自刖　楚鬻拳曰吾懼君以兵罪莫大焉遂自刖也君子曰鬻拳可謂愛君矣諫以自納於刑也\n斮朝涉之脛　紂\n刑　言\n卞和獻玉　於楚王王使工者相之奏王曰石也王怒刖其足\n邴氏爭田　傳楚子與邴歜之父爭田不勝及即位掘而刖之而使歜爲僕也"},{"id":"juan13-041","source":"正文","juan":"卷第十三","menu":"罰親四十四","sub_menu":null,"page":"二一一","leaf":"十八オ","text":"獄成刑放　記公族有罪獄成告於王王三宥之傳曰刑放於寵\n私不害公　愛而知惡\n唯惡是疾　雖親必誅\n唯令是行　雖親不隱\n君子不黨\n法家少恩\n雖親唯立愛　而法且斷恩\n義不掩恩　門外之理\n威克厥愛允濟　愛克厥威允罔功書\n敦睦之情恩當掩義　行無頗之法公必滅私\n宜唯律論　雖親從刑放\n血屬　骨肉\n刑罪無掩蔽　禮\n刑不頗邪　傳且\n仁不遺親　義無從愛\n他人尚思欽恤　本族難忘哀矜\n骨肉之親無絕　禮\n仲尼曰叔向古之遺直也　傳\n治國制刑不隱其親　刑者國之大事宜當直矣言至於他事則宜有隱也\n三數叔魚之惡不爲末減　言皆正直也叔魚叔向弟也曰義也夫可謂直矣注於義未安直則有也\n平丘之會數其賄也晉不爲暴歸季孫稱其詐也晉不爲虐邢侯之獄言其貪也以正刑書晉不爲頗也\n三言而除三害加三善殺親益榮猶義也夫　三罪爲國施刑不可不敬其餘以直傷義故誡之\n小慈害德大義滅親　石碏殺子君子曰大義滅親\n稱以正直　決獄有說\n謂之仁愛　吾則不以\n以父成政不孝也　史楚王使石奢爲治有殺人者奢追之則其父也曰以父成刑不孝也不行軍法非忠也刎頸而死也\n大爲防\n而猶踰　以自遂度\n小不忍而爲亂　敢不\n戮姨弟　晉荀晞字道將都督青兗從母依之奉養甚厚從母子求爲將晞曰吾不以法貸人將無後悔苦欲之乃以爲督後犯法　　之從母叩頭救不聽既死而哭曰殺卿者兗州刺史\n周公垂涕而治管蔡之獄　季友殺叔牙　行　　之誅\n議親　周禮八議一曰議親"},{"id":"juan13-042","source":"正文","juan":"卷第十三","menu":"國親刑第四十五","sub_menu":null,"page":"二一二","leaf":"十八ウ","text":"與帝戚部公族刑門事類\n甸師　周禮甸師氏同姓有罪則刑於甸師也\n記曰公族有罪則磬于甸人公族無宮刑不翦其類也\n三宥　獄成有司讞于公公曰宥之三宥不對則走出致刑于甸人公又使人追之曰雖然必赦之有司曰無及也反命于公公素服不舉爲之變如其倫之喪無服往親哭之比也\n有司正術　以犯有司正術公族之罪雖親不\n季子遏惡　公羊云公子牙今　　　不稱弟　季子遏惡不爲國獄緣季子之心爲之諱君親無將將必誅也\n緩追逸賊　穀梁鄭伯克段段失弟之道賤段而甚鄭伯也甚鄭伯之處心積慮成於殺也猶曰取母懷中而殺之宜緩追逸\n小慈失教鄭莊成叔段之誅　傳曰鄭伯克段于鄢譏鄭伯失教也\n爲法斷恩漢武可昭平之奏　漢隆慮主子昭平君尚帝女隆慮病困以金千斤錢千萬預贖昭平君死罪上許之隆慮卒昭平醉殺主傅傅母也廷尉請論上曰吾弟一子又屬我垂涕良久曰先帝法令誣之何面目入高廟遂可其奏\n哀帝詔下明曰親屬之恩　詔爲明是外戚有服屬之恩"},{"id":"juan13-043","source":"正文","juan":"卷第十三","menu":"議故第四十六","sub_menu":null,"page":"二一二","leaf":"十八ウ","text":"清河二天　三輔決錄曰蘇章爲冀州刺史行部有故人爲清河太守案得姦臧乃請太守爲設酒肴歡太守喜曰人皆有一天我獨有二天章曰今夕蘇孺文與故人飲私恩也明日冀州刺史按清河太守公法也遂舉正其罪也\n雖赦其舊故　義在不遺\n而正彼刑書　罪宜無赦\n議故　周禮八議二曰議故\n崇舊愛大爲之防　念舊廢刑小不足而亂\n雖久要之難\n忘　有大故而宜弃\n申恩　法屈\n獄成　刑故\n私不害公　愛之知惡\n唯惡是去　雖舊必誅\n唯法是行　雖舊必\n故舊雖在於八議　法宜效於二天\n義有不遺　禮則標於八議\n罪或難掩　法可行於二天\n事苟足容　刑宜緩於一割\n雖赦於念舊　義在不遺\n而奉彼正刑　罪宜無赦"},{"id":"juan13-044","source":"正文","juan":"卷第十三","menu":"不齒第四十七","sub_menu":null,"page":"二一三","leaf":"十九オ","text":"書曰降霍叔爲庶人三年不齒　齒錄也\n有不率教者屏之遠方終身不齒　禮\n廢馭以罪　周禮太宰以八柄馭群臣七曰廢以馭罪注廢放也\n不齒三年　周禮凡害人者寘之圜土以明刑恥之其能改者反於中國不齒三年"},{"id":"juan13-045","source":"正文","juan":"卷第十三","menu":"財産沒官四十八","sub_menu":null,"page":"二一三","leaf":"十九オ","text":"奪以馭貧　周禮太宰以八柄馭群臣六曰奪以馭其貧謂有罪也大沒入其家財也\n奪騈邑　子曰管仲奪伯氏騈邑三百飯疏食沒齒而無怨言當罪故不怨也\n抵于公法　沒以家財\n没入沒先居之産　列子宋人向氏學盜被以臟獲罪沒先居之産也"},{"id":"juan13-046","source":"正文","juan":"卷第十三","menu":"殺人第四十九","sub_menu":null,"page":"二一三","leaf":"十九オ","text":"殺人者死　漢法\n以殺止殺　傳\n刃失意　古詩失意杯酒閒白刃起相讎\n罪莫大焉死刑　無赦之刑\n殺人之中　又有禮焉\n是樂殺人　老子\n殺人不忌爲賊　傳\n莫大之罪　周禮\n殺傷匪人爭奪相殺謂之人患　禮\n專殺殺人爲賊\n死傷横道不問　邴吉爲丞相道逢群鬬死傷横道不問吏怪問之曰此京兆尹長安令事\n殺子　後漢賈彪爲新息令小人貧困多不養子彪爲制令與殺人同罪城南有盜劫害人城北有婦人殺子彪出按掾吏欲引南彪怒曰賊寇害人此常理母子相殘逆天違道遂行按\n殺父侍人　魏志劉曄字子陽父普母疾困臨終曄年七歲兄渙年九歲母戒以普侍人有諂害之性身死之後懼亂家汝能除之則吾無恨曄年十三謂渙曰亡母之言可行矣即入室殺侍人出拜母墓普怒遣追曄\n曄謂曰亡母之顧命之言敢受擅行之罪普異之不責也\n推埋　王溫舒少時推埋爲姦注推殺人而埋之\n尸僵路隅　文選曰匹夫蹙而尸僵路隅言游俠之徒殺人\n狂易　陳忠伯船上言狂易殺人得減重論事遂施行也\n十三殺人　秦武陽也"},{"id":"juan13-047","source":"正文","juan":"卷第十三","menu":"鬬第五十","sub_menu":null,"page":"二一四","leaf":"十九ウ","text":"方剛　子曰君子有三戒及其壯也血氣方剛戒之在鬬\n失意　注見上\n怒有戰鬬　傳\n小人之性　釁於勇嗇於禍\n一朝之忿　忘其身以及其親非惑與\n忿思難　九思君子有\n彼竭我盈\n鬬心　志\n爭鬬之獄　繁矣\n不忍小忿掬怒而少息肆其忿悁　恚也\n暴弱　彊者暴弱\n彊暴之男攘臂　而\n張拳　張空拳冒白刃\n愠見　怒形於色\n力爭蚌鷸相持　兔犬俱斃\n血作脈憤爭爲事末　鬬乃禍心\n鬬怒者成之　周禮\n睚眦方剛\n奮末　謂怒而動四支也\n忿懥　懥怒貌也懥音致禮\n用壯逢彼之怒交捽　趙簡子曰孟獻子有鬬臣五人叔向曰子不欲也若使將待交捽之可也\n控拳救鬬批亢　史記解雜亂紛糾者不控拳救鬬者不搏撠批亢擣虛形格勢禁則自解\n搤亢拊背　婁敬曰夫人鬬不搤其亢拊其背未能全勝\n折脅拉髂　范雎\n兩虎安得私鬬　寇恂賈復\n勸解　高鳳敎授於西唐山中隣士有爭財持兵而鬬鳳往解之不止乃叩頭曰仁義遜讓奈何弃之爭者懷感投刃而謝之\n雞肋不足以安尊拳　劉伶醉與人相忤其人攘袂奮拳伶曰雞肋不足以安尊拳其人笑而止\n老拳毒手　石勒與李陽隣居爭漚麻池相毆勒及貴召陽與飲酣引陽臂笑曰孤往日厭卿老拳卿亦飽孤毒手\n敎令　刑法志毆人敎令者與同罪即令人毆其父母不可與行者同\n決死爭雄憑怒力爭心競能鬬不過吏\n裂衣冠毀冕\n鬬嚚　司虣禁鬬嚚者也虣音暴\n晉侯夢與楚子搏楚子伏地而\n盬其腦　傳\n佐鬬搏　穀梁公子友與莒挐屏左右而相搏公子友處下左右曰孟勞孟勞魯之寶刀也公子取而殺莒挐\n剛腸\n妻呼還　春秋專諸與人鬬怒有萬人之氣妻一呼即還子胥問之專諸曰屈於一人之下\n鬬智不鬬力\n救鬬者傷　淮南子曰佐祭者嘗救鬬鬬者\n批而殺之　宋萬遇仇牧云云\n五侯之鬬血成江　春秋考異曰龍門下血如江時人謠曰云云\n兩虎相鬬勢不俱生　謂藺相如廉頗也"},{"id":"juan13-048","source":"正文","juan":"卷第十三","menu":"傷第五十一","sub_menu":null,"page":"二一五","leaf":"二十オ","text":"蹴下鬬　注見上\n身體髮膚受之父母不敢毀傷　孝經\n傷人及盜抵罪　漢書\n雖未及死　且莫能傷\n君子不重傷而傷合則兩傷\n死傷横道　丙吉少爲丞相嘗出逢清道群鬬死傷横道吉不問吏問之吉曰人相殺長安京兆尹所職宰相不親小事人服其知大體也\n厥足用傷\n周禮凡過而殺傷者以成之　過無意也成謂和平也\n凡傷人見血告而誅之　徒人之血也周禮\n肆其一怒　合則兩傷\n鬬毆胥怨相傷\n拔戟　穎考叔挾輈而走子都拔戟而逐之\n折臂三公　羊祜字叔子\n既奮李陽之拳　乃折公羊之臂\n折其左肱　易\n折齒　齊景公爲孺子牛而折其齒公羊曰宋萬搏仇牧齒著門闔\n被傷求去職　晉祖約士少典選舉妻無男而妬不敢違忤夜寢於外爲人所傷約求去職詔不聽司直劉隗劾之宜貶黜詔又不許\n疻人　漢博士申咸毀薛宣宣子況賂客楊明痍破咸於宮門外斷鼻脣使不得爲近侍中丞奏況及明皆大不敬弃市廷尉直議咸遇人以不義而疻者與疻人罪同況竟減死疻音侈以杖毆擊人剝其皮膚起青黑而無創瘢曰疻\n敗面　謝萬字萬石嘗與蔡系爭言系推萬落牀冠帽傾脫萬徐起謂系曰卿幾敗我面神意自若\n傷積野　書李陵\n頭璧俱碎"},{"id":"juan13-049","source":"正文","juan":"卷第十三","menu":"藥人五十二","sub_menu":null,"page":"二一五","leaf":"二十オ","text":"寘堇　國語驪姬寘堇於肉注堇烏頭也\n飲鴆而死\n地墳　與犬\n犬斃\n祭地　申生獻胙公祭地地墳與犬犬斃\n秦人毒涇上流師人多死　晉侯帥諸侯伐秦\n害物之心　毒人之罪\n害人　聚毒\n苞藏禍心　合聚毒藥\n噬腊遇毒\n羊叔子豈鴆人者乎　羊祜遺陸抗藥抗服曰云云"},{"id":"juan13-050","source":"正文","juan":"卷第十三","menu":"誣人第五十三","sub_menu":null,"page":"二一六","leaf":"二十ウ","text":"厚誣君子　鄭賈人曰吾小人不可厚誣君子\n興無妄之辭　明巧詐之咎\n無載爾僞\n作僞心勞\n飾虛　憑虛\n行詐　情僞\n詐謀　姦計\n僞言　讒辭\n詐僞之心　禮爾\n詐　予嫌\n矯誣\n反坐反受其殃　月令枉橈不當云云\n誣善之辭游\n巧言如簧\n鑠金之口\n辭爲憑虛　罪宜闕實\n君子之道焉可誣也\n宣詔年八十已上非誣告殺傷人皆勿坐　漢以其罪罪之\n行僻而堅言僞而辯"},{"id":"juan13-051","source":"正文","juan":"卷第十三","menu":"罪相容隱五十四","sub_menu":null,"page":"二一六","leaf":"二十ウ","text":"父爲子隱子爲父隱直在其中矣　語\n子孫匿祖父　宣詔父子之親夫婦之道天性也雖有患禍猶蒙死而存之誠愛慤之心仁厚之至豈能違之自今子匿父母妻匿夫孫匿祖父母皆勿坐其父母匿子夫匿妻大父母匿孫罪殊死皆上請廷尉以聞\n上下相蒙難以濟矣　推介之\n掩義隱賊　傳\n掩蔽\n掩惡\n伏藏\n蒐匿"},{"id":"juan13-052","source":"正文","juan":"卷第十三","menu":"告人罪五十五　附匿名","sub_menu":null,"page":"二一六","leaf":"二十ウ","text":"惡訐以爲直　子曰惡訐人之私以爲己之直\n匿名告罪\n缿筩　趙廣漢爲潁川惡相朋黨乃許相訐告或匿名相告罪者置缿筩令投書於其中缿筩乃見器也\n請告者名　魏典農劉龜竊於禁內射兔其曹張京投書言之帝匿京名收龜付獄高柔字文惠爲廷尉請告者名帝怒曰吾豈忘收龜罪柔曰廷尉天下之平不敢毀法帝乃下京名各當其罪\n投書誹謗　魏時有投書曰誹謗太祖欲得其主國淵字子尼請留其本書而不宣書多引二京賦淵乃募讀\n賦者果得其罪人\n敢告　王嘉上疏書數事尚書令吾不爲煩百姓證驗韋文必有敢告之字乃下\n告訐發人之私\n從坐五十六　附不相及\n應侯席槀　史記應侯范雎任鄭安平爲將降趙應侯席槀請罪秦之法任人所任不善者以其罪罪之秦昭王恐傷應侯意乃下令有敢言鄭安平事者以其罪罪之\n文帝除收孥律\n晁錯曰罪人不孥連坐千餘家　王溫舒爲河內\n相坐之法　刑法志韓任申子秦用商鞅著相坐之誅三夷之刑\n定法令　張湯趙禹爲令定法令作故縱所監臨部坐之法注云部內有罪並連坐也\n罪不相及　父子兄弟\n淪胥以鋪\n兄弟　蜀志糜竺爲安漢將軍弟芳爲南郡與關羽搆隙叛歸孫權羽因覆敗竺請罪先主慰諭以兄弟不相及崇待如故也\n女　荀氏女芝爲潁川太守劉子元妻坐死何曾議云云一人之身內外受憲在室之女從父母之誅既醮之婦隨夫家之罰從之\n妹　郭淮字伯濟妻太王陵妹也陵誅也當從罪見收羌胡渠帥數千人叩頭請淮表留妻淮不從妻上道五子叩頭流血請淮淮不忍乃令追以書白司馬宣王云云宣王宥之\n則孥戮汝　夏書\n妻　盧毓爲冀州主簿時有士亡妻白所適夫家數日未與夫相見大理奏白弃市毓駮曰女子以接見恩生云云太祖從之矣\n兄　太祖時劉廙弟偉與魏諷謀反當連坐陳群長文爲言之太祖曰廙名臣也吾亦欲赦之乃使復位也\n子　孔融被誅二子年八歲弈棊不起人問之二子曰安有巢毀而卵不破者果并見殺\n出妻　淳于長封定陵侯坐大逆小妻及姑等六人事未發時已出或改嫁發覺方逮問或以死時爲論廷尉孔光曰夫婦義合云云\n子妻　毌丘儉孫子妻荀氏應坐死程咸議云云"},{"id":"juan13-053","source":"正文","juan":"卷第十三","menu":"相代罪五十七","sub_menu":null,"page":"二一七","leaf":"二十一オ","text":"許相代　後漢陳忠字伯始爲尚書言奏母子兄弟相代死聽赦所代者皆施行范曄以爲不善人多幸人罪代貴禍逆退無繼\n母兄　安帝時尹次玉皆殺人兄初及玉母代命因縊而死故尚書陳忠以罪疑從輕議活次玉應劭駁正議曰天尉有罪初軍還相自殺　　　死子糾孔子曰如於溝瀆見父非　　　云不如　　猶能全宗今赦　之初軍皆當死之次玉此謂求生非謂代死者也"},{"id":"juan13-054","source":"正文","juan":"卷第十三","menu":"赦五十八","sub_menu":null,"page":"二一八","leaf":"二十一ウ","text":"赦天生殖　傳曰爲國　　　知以赦天之生殖長青\n勝殘去殺　善人爲邦百年\n肆大眚　春正月肆大眚眚灾也肆赦其罪也\n肆赦　書眚災肆赦注過而有害也肆緩也言殺而肆過害當緩赦之\n好生之德洽于民心　書\n發揮生成　易\n蕩滌邪穢　謂入德教\n天地發生　雷雨作解\n赦過宥罪　易曰雷雨作解君子以赦過宥罪\n在宥　莊子聞在宥天下\n動　王充論衡曰赦令將至　　囹圄之動言有赦也\n大恩　漢書\n藤草東苻　永和二年\n晉惠南郊　元康六年南郊大赦\n歡心欣戴慶隨開釋昭蘇滌惡蕩穢　路德詠上\n弛秋霜之嚴　上廣陽春之澤曰文\n殷湯解網　以而愛師\n歠之歷　措刑\n萬物霑雷雨之仁　四海及蒙蕩滌之澤\n天恩有裕　王澤無遏\n然則政惟圖大法在建中習以生常則起爲姦之赦廢而不用何成作解之恩宜思委轡之懷兼追解網之德數則不可無之亦難　敎者\n文斧鳥之委書也\n青纊之澤\n除舊布新\n仁必好生　政不用殺\n渙汗之恩\n緩死　好生\n蓼蕭　澤及四海也詩\n過市　禮國君過市刑人赦\n苟有以藉手鮮不赦宥　大國討小國也\n赦前事　平詔曰赦令赦行習已有司多舉赦前事非重刑使自新之意也\n勵精更始　宣詔曰\n隱赦行刑　後漢周紆字文通爲勃海太守每赦令到輒隱藏行刑罪畢乃出赦書坐免官\n知將有赦　張成善風角推知當有赦教子殺人李膺爲河南尹收捕既而逢宥膺愈懷憤竟按殺之\n不肯出獄　　苞字子石爲交阯太守　　尚僞言其無罪入荊州獄下廷尉會赦見原不肯出曰天地　　　　不\n偏枯之物　蜀志孟光責費禕曰赦偏枯之物非明世宜有今上仁賢百僚稱職有何旦夕危急以盡寄非常之恩　　而已\n蒼蠅集筆　苻堅將赦密議王猛遂紙墨有大蒼蠅集其筆端驅而復來俄而長安中　相告有赦堅驚言云有一小兒青衣於市呼之通吏不見得非向者蠅之告乎\n皇　三赦　一切弱二老耄三悉愚\n封三錢之府　陶朱公故人莊生謂楚王曰某星宿害楚德可除之王使封三錢之府注黃白赤金也將赦楚人知有赦　之言\n楚莊王赦鄭伯　見其肉袒也\n懲惡訓俗　寬在於嚴科\n宥罪恤辜　義深於緩赦\n緬鏡前古　莫不赦遵\n雷雨作解聖人開赦過之門　肆眚屬文先王明錄刑之典\n慶洽普天恩沾率土\n浹歡謳於九域　飛渙汗於萬方\n烏啼叩齋　宋臨川王義慶元嘉中徙為彭城王義康時為江州相見而哭文帝聞而怪之乃徵還宅大懼妓妾夜聞烏啼叩　云明日有赦報改為南州因作烏夜啼曲\n○不用赦　附赦門\n赦權時之宜非常典也　荀悅云\n小惠不行無忘武侯之議　華陽國志諸葛亮時有言惜赦者亮曰為政以大德不以小惠故匡衡不願為赦先帝亦言治亂之道悉矣曾不語赦\n大利是務盍遵管氏之言　管子曰凡赦者小利而大害也故久而不勝其禍無赦者小害而大利也故久而不勝其福故赦者奔馬之委轡也無赦者痤疽之礪石也委轡必覆礪石療疾也\n屬禍亂之際則貴自新　晉成帝詔曰令赦天下使得自新\n當休明之朝豈勞更始　漢紀漢承兵革之後比屢可赦故申以大赦之命滌蕩穢瑕與人更始時制然也承業者則不然\n且事宜稽古政貴相時滌惡蕩穢雖權道之所宜　刑法書盛\n豈倖門之可啓\n請思礦石　無誘倖門\n則朱公之子無所用金　陶朱公子犯法令中書遺金求赦\n張成之男焉能傳刃　注見上\n人之多辟　大為防而禽獵\n邦有常刑　小不忍而為亂\n唯願　赦　後漢吳漢字子顏病甚上親問之曰唯願無赦\n有常　無赦\n惠者人之仇法者人之父母　管子\n凱風無私養之暖　朝書無偏注之暖\n凡作刑罰輕無赦　禮"},{"id":"juan13-055","source":"正文","juan":"卷第十三","menu":"宥過五十九","sub_menu":null,"page":"二二〇","leaf":"二十二ウ","text":"中恩　法屬\n宥過無大刑故無小\n罪疑惟輕　虞書\n捨小過　孔子曰\n獄貴哀矜　法宜開釋\n議事　原情\n在宥　莊子曰聞在宥天下矣未聞理天下\n獲宥情非抵冒　故由寬仁\n眚災肆赦　注見赦門\n君子以赦過宥罪　易\n自新　史記緹縈上書曰妾傷夫死者不可復生雖欲改過自新其道無由文帝哀之下詔除肉刑\n察貴用情　恕宜及物\n三宥三赦　周禮司刺掌三赦三宥之法一宥曰不識再宥曰過失三宥曰遺忘注不識者謂愚者無所知識也三赦見上赦門注\n克寬克仁　不知\n居上不寬\n人之過也各於其黨觀過斯知人矣　語\n免於刑戮恕而已矣　仁遠乎哉\n孟夏出輕繫　輕繫罪者赦出之\n禮曰有言無簡不聽　簡誠也有其意無其誠不以為罪也\n附從輕　附猶刑也求出之故從輕\n赦從重　雖是重罪赦之\n不赦過　禮凡執禁以齊眾不赦過\n小不忍而恐亂　安可容姦\n計過求瑕\n肆眚申恩　傳肆大眚\n三細不宥　言三犯罪罪雖小不宥也\n守正名之義　當準法論\n念觀過之人　則宜情恕\n況當弘貸之朝　宜罪哀矜之典\n貸法臣無敢作福誡為撓法　豈曰貸人\n且政先執禁　赦在御防\n宥彼違法者　愛人\n若可原情　宜蠲新者焉求倖免\n若踰矩之人　如可捨也則防姦之法　將焉用之\n若寬前宥之法　恐誘後來之姦\n孽既可逃　法將焉用\n抵冒猶或哀矜　過失誠宜開釋\n奴誤射殺子不誅　宋則事見寬恕門\n羹爛汝手　見上寬恕門"},{"id":"juan13-056","source":"正文","juan":"卷第十三","menu":"改過六十","sub_menu":null,"page":"二二一","leaf":"二十三オ","text":"知過附\n今是　昨非\n朝過　夕改\n時有不仁　未君子\n過而能改　則曰大賢\n改而勿憚　悔亦可追\n憚改　知非\n誰無能改　善莫大焉\n苟有必知　赦之可也\n先迷後得　臨事雖不三思\n苟有必知　首陳\n宜嘉後覺　盡恕前非\n既反迷途　請昭宥恕\n自新　不悟\n改行率德\n有恥且格\n聞義不能徙不善不能改是吾憂也　語\n子曰吾未見能見其過而內自訟者　訟責也語\n改之為貴\n無循枉　枉不正也不正不循行也\n徙善遠罪　禮\n知非　改過\n洗心\n不遠復\n既非迷復　請以輕論\n補過　無咎者善補過也\n顏氏之子其殆庶幾乎　有不善未嘗不知之知之未嘗復行\n有過則改　見善則遷有過則改益卦大象辭也\n負罪引慝\n君子以恐懼脩省\n惟受責俾如流　書曰責人斯無難惟受責俾如流是惟艱哉\n無恥過作非　書\n過失可微辨不可面數　禮\n君子能知其過必有令圖　秦公子鍼\n能補過者君子也　仲尼曰\n人誰無過過而能改\n過則稱己\
