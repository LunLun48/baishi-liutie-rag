an":"卷第一","menu":"陸心源手跋","sub_menu":null,"page":"印刷頁五","leaf":null,"text":"【校勘】位置：陸心源手跋（印刷頁五）\n本稿（改定後）：（全篇存疑）\n初錄（書影釋讀）：（行草，多不可辨）\n參校本：（參校本無此葉）\n處理：待覈\n依據與說明：參校本未收此葉，無從對校。全篇僅為初步釋讀，建議目驗原件或另取高解析度書影。"},{"id":"jiaokan-028","source":"校勘表","juan":"卷第一","menu":"卷一門目 地第二","sub_menu":null,"page":"印刷頁九","leaf":null,"text":"【校勘】位置：卷一門目 地第二（印刷頁九）\n本稿（改定後）：地第二　地理　土附\n初錄（書影釋讀）：地第二　土附\n參校本：—\n處理：人工修訂\n依據與說明：門下所附之目初錄僅得「土」，經人工覆核書影補「地理」一目。"},{"id":"jiaokan-029","source":"校勘表","juan":"卷第一","menu":"卷一門目 風第十三","sub_menu":null,"page":"印刷頁九","leaf":null,"text":"【校勘】位置：卷一門目 風第十三（印刷頁九）\n本稿（改定後）：風第十三　災附\n初錄（書影釋讀）：風第十三　附\n參校本：—\n處理：人工修訂\n依據與說明：所附之目初錄漫漶未辨，經人工覆核書影定為「災」（風災附）。"},{"id":"jiaokan-030","source":"校勘表","juan":"卷第一","menu":"行款","sub_menu":null,"page":"全卷","leaf":null,"text":"【校勘】位置：行款（全卷）\n本稿（改定後）：行末不留空白\n初錄（書影釋讀）：缺字留空處，行末尚存全形空格\n參校本：—\n處理：體例統一\n依據與說明：缺字以全形空格留位，惟行末之空格一律刪除，計二十一行。已寫入產生程序，日後重建不再出現。"},{"id":"toc-juan6","source":"卷六總目","juan":"卷第六","menu":"卷第六總目","sub_menu":null,"page":"二一三","leaf":"十三オ","text":"白氏六帖事類集卷第六　本卷總目（共 40 門）\n夫婦第一\n婚姻第二\n離第三　夫妻卌一合附\n同姓婚第四\n賢婦第五\n惡婦第六\n喪夫第七\n喪妻第八\n後妻第九\n妾第十\n美人十一\n妬第十二\n寵第十三\n別第十四\n辭婚十五\n擇夫十六　冥婚附　妻自擇附\n待妻之禮十七\n烈婦十八\n家道十九\n父子二十　訓子　不調　不慈　喪子　無子　孤遺　知子　假父　父子同　假父耐\n母子二十一　遺腹　出胃　賊　後母　賢母　惡母　雙子生育　雙生\n兄弟二十二　死喪　用利　患難　別離　義兄弟\n叔姪二十三　繼叔　猶女　姪\n舅甥二十四\n内外兄弟二十五\n嫂叔二十六\n姑二十七\n姊妹二十八　賢姊　姊喪　寡婦　姊妹皆\n祖孫二十九\n女三十\n女壻三十一　孫壻附\n娣姒三十二\n子婦三十三\n舅姑三十四\n出婦三十五\n親屬三十六\n宗族三十七\n奴婢三十八\n僕隷三十九\n乳母四十　褓幼　童幷　衣裳"},{"id":"juan6-000","source":"正文","juan":"卷第六","menu":"夫婦第一","sub_menu":null,"page":"二一三","leaf":"十三オ","text":"夫婦第一　夫夫婦婦也傳所謂\n如賓　　缺耨其妻饁之敬相待如賓晉　季言諸文公曰能敬必有德以爲下軍大夫\n伉儷　　不能匹敵其伉儷\n好合　妻子好合如鼓瑟琴\n夫和妻柔　夫和而義妻柔而正\n義妻\n宜家室　　爲室家　偕老　偕老\n鳳皇和鳴　懿氏卜妻敬仲其妻占之曰吉是謂鳳皇于飛和鳴鏘鏘\n二物　傳謂夫婦謂二物\n妃耦　各有侍教御禮閑男\n義合　夫妻　合\n絲蘿　古詩與君結新婚　婚兔絲附女蘿\n唇齒\n肥　　之肥也禮\n賓妻　禮曰昔三代明王之政必敬其妻子妻者親之至也敢不敬焉\n妻有服　其側也禮\n移天之義　不棄弊於\n一體之義\n絜之不能自　　於厭中\n加杖　晉劉毅戴威膚妻子有\n希見\n齊眉　梁鴻妻孟光舉案齊眉　家\n中則内饋　内和　外言\n男行婦刑于\n義婦聽　禮其宜其妻也禮\n敬如死　鄭　風疾姬四憂疾妻\n禮不好酒色之寧夜又劉基敬\n震早起妻希其面又\n魏略桓範爲兖州牧範　後謂妻曰我室作卿阿三公\n與與蓋平帝居夜訓早起妻妾希刀環擊字名進士\n見面諸弟敬憚之閒無雜賓客\n不能爲呂子受屈妻曰君爾在東虚欲擅懷徐州家人謂君行舉爲下夫人\n今妻爲呂尼難爲上也籠怒以刀環擊之妻妻傷胎死\n能爲平有幽州刺史李陽京師大俠郭氏憚之新曰老\n非但我言歸不可李陽亦言不可乃郭氏爲之小損\n殺不歐乃下馬刺其妻僅以身免　又殺之明不通"},{"id":"juan6-001","source":"正文","juan":"卷第六","menu":"婚姻第二　媒禮附","sub_menu":null,"page":"二一四","leaf":"十三ウ","text":"細君　東方朔謂　人　禮曰大夫　人曰　人\n姻媾必告　父母男女得以及時\n三星　在戸在隅　婚姻時也\n百兩　　之\n蘭室　室家　我儀　寶雛　我　　反馬　既嫁三月　鳴\n禱九十　九十其儀　有室有室三十　禮不息燭　燭子曰　恩\n叩納正室　宗子孫也　起同心同心　儷儷\n欲納吳起起妻齊苡　起　及爲將大破　軍\n婢爲妻　在塗遘妻願娶成妻　　　男女以婚\n燕爾　新婚燕婉求　女子有行遠父\n鳳之兆　見上\n從人　女子笄　從人　　　願結\n女之家　三日不息　相離也　謂親骨肉不舉樂　　之家\n三日不舉樂　思嗣親也\n不用樂　幽陰之義也　欲令子婦　思其義也\n也卜先近之日　禮吉事先近日\n親迎　於其　　之義　男女親迎男先始\n又曰婚禮有錢\n二姓之好　合二姓之好\n六禮　納采問名納吉納徵請期親迎\n貧鴈御輪\n若代家頭\n萬代　　之\n秦晉　匹也　何高國傳曰\n好仇　　　求士\n陰禮　周禮以陰禮教親　　人不惡往陰禮男\n歸\n多婚　周禮荒政十曰多婚\n歸遵附遠之文　塞於異姓所　別日婦以開遠厚別　三十女二十而嫁\n禮曰主人筵几於廟　　執鴈入揖讓引賓鴈降出御\n贄不過榛栗棗脩\n授綏　禮\n女有歸　禮婚以禮成　義合　布也\n布五兩御輪\n必愼婚雖貴幣　禮貴　衿\n燕爾　新婚燕婉求　女子有行遠父\n榛栗　　族　遂移\n配嫁\n女辭家而適人辭家　婦壻在塗\n是謂室事　　儀\n桃李子　恐失　當年\n蕃展慶　蕃栗　告　　女既\n蜀陽貞游徹奥善相者共載見一婦人相者曰此婦\n不然相書不可用也霸推問乃輝里巫家女也　要\n世婚　漢鄭宗字子　本高密\n遞婦先配　傳\n乃貞柔　貞菜于皇男　婦拜　地　　匜男又\n往迎　兩相\n施衿施鞶　母　施衿結悅勉之　母曰　父承我宗事\n判妻入子者皆書之　男三十而娶女二十而\n書之別未成婚禮也\n客媵娣不聘爲\n重貴　士於婚中以　　親娶婦之家三日不　人序人之序也\n遠取　公羊婚　不　主人遠恥也宋\n説婚也\n稱婦　稱婦人　稱夫人\n有客使在塗\n難即往　公羊令孫來納幣稱宋公　　劉沼　氏范氏爲婚姻閒子有客\n入幣不過五兩　凡嫁\n穀主以聘　　　支也\n匪寇婚媾　縕怨　賀娶妻\n造端　易謂造造\n當事遠人以縶婚　禮\n禄賑婚姻　住延爲九貞太守　越人無嫁娶禮\n太早　俗婚姻太早未知爲人父母　男年二十五至五十　女年十五至三十不嫁\n元與管彦男女各始生許爲婚彦爲西夷校尉襄女\n韻曰襄裏曰暋兄葬父於洛陽隨妻還臨淄用意如此\n食而有慶語愚謂無克相賀\n之禮而有禮既其騰慶會之義\n亂倫之始　子納尚書令\n無松柏薰蕕不同器玩\n女壯勿用娶女　易斯也　妻\n而納正室　上注\n王濬嫁女與潘璋男　彈文曰璋之下錢五萬源　　贈王\n直納妻王滿　潘楊仲武\n禁相賀　宣詔郡國二千石或禮不得具酒食相賀也　輶軒\n諸生皮弁\n馬之禮　玄纁束帛加羊古以皮馬爲庭實　天子加穀圭馬二駟　王侯玄纁束帛加璧　卿馬大夫\n劉歆等新定婚禮親迎立詔辨馬輅立乘小車也新馬驪駕也\n用羊　晉書云羊者祥也　諸侯加大璋可傢周禮故璧用璋其\n半鷹酒采亥纁如敢諸侯婚禮加納綵告期親\n五匹及納徵馬四匹　晉夫家自備唯轉官不\n助婚錢　　字宣居貧年三十未有室王\n婚　皆名士也時有求入錢不得\n曰姻　詩曰不思舊姻　委女會兩\n用羊　婚者有羊　未始也\n敘錢　　各帛\n人倫所資　斯重\n齊體一行　偕老　形分一氣　乾坤爲八卦之門　人列三十六\n伉儷　夫婦之\n首天地之立　　　　三十而娶　周禮曰男　三十而\n首天地之位既分　婦之人幣五兩　周　三十而娶　禮曰男三十而娶　娶　二十而嫁\n斧　新蕃如之何匪斧不克娶　禮之何匪媒不得\n不交　禮曰男女無媒不交\n媒娉彊媒　民媒從人合歸\n因媒嫁　媒不因妻親　妻以禮求爲人作媒　晉\n因針線　因針石人不因針而急　因媒而嫁　不因媒而親　何匪媒不得\n媒氏禮閫行媒　禮曰男女非有行媒不相知名　有女\n伐柯　妻而\n類語君當爲人作媒冰洋而成婚果\n而太守因筴求乘氏女仲春成婚\n棄葉甘花落色一裏　愛弛　衰而愛弛也\n怨及爾偕老　食我怨\n不棄三　其也　不棄士貴　三三貞"},{"id":"juan6-002","source":"正文","juan":"卷第六","menu":"離第三","sub_menu":null,"page":"二一七","leaf":"十五オ","text":"怨耦　仇失儷　讎不失儷婿\n義絶　大婦之義絶\n反目　易曰夫妻反目　同心怨我\n行棄葑葑　夫婦曰　刺夫婦　離絶\n谷風　先道也　離絶\n尋其舊室夫婦離絶國俗傷敗\n覆水　收\n斷絃續　可\n塵泥　浮沉　異路\n弦筝　離合　非常\n上山採蘼蕪　並無逢故　下山\n七狗　鮑永字君長養母至孝妻　叱狗永即去其妻\n朱買臣　負薪其妻　之求去買臣曰吾五十當富貴今四十矣妻怒曰終當餓死遂去\n棄乃去歸東家欲伐鳥諸曰去妻東嘆去已吉\n之去室　生妻去室　禮　之堂　糟糠\n秋扇　　綺篋　司中　綵\n去閤　婦人從　送戲　我戲\n假也之妻　妻是不爲白也毋\n鶴欲爲故娶乃養若爲別鶴操　商陵牧子娶妻五年無子父母\n比予干　如我　舞我\n士三出妻逐於境外　言二三其　　德也管子\n別\n禮曰舅姑怒則子放婦出而不表　不表謂不明言其過　不宜其妻也　禮\n婦不安　去　　　子娶妻于向　向妻不安　　帛傳凡諸侯之女歸　喪服小記\n去歸　傳凡諸侯之女歸　喪服小記　婦當喪而\n不安　昔而歸　昔出人入向以妻氏還也\n復還\n出則除之　爲父母喪未練而出則遂之　注云當喪當易服\n反則期既練而反則遂之\n逆喪　　　之喪傳曰夫無避出\n妻之無子　梁叔魚三十無子欲出其妻商翟　過矣\n金賞　于上書去妻上哀之得不坐法\n李充　後漢李充貧兄弟六人同衣　遞人妻　妻有私財願分異充曰　酒具\n陳平兄　漢陳平與兄伯居　嫂平不親家産伯聞逐其妻\n會鄉里共衆及賓至竟從塵中號白母曰此婦無狀甘南\n篤素隗見兄得　和此人足矣兄聞之遂遣其妻負\n氏長乞一會以展辭誠集客二百餘人\n去兄還\n仇怨　晉書曰王珣及豫甘寧與　體　又離眠妻\n湯舟之逼　傳齊侯與蔡姬乘舟　　色縈之\n不止公然歸之未\n遇故妻　朱買臣字翁子爲會稽太守入吳界見故妻與夫治道令後車載之置園中給食一月妻自縊死與夫錢令葬\n以妻與人　東胡使使求冒頓妻閼氏左右請擊之曰　　一女子乎所愛閼氏興之\n始託微波　然傾覆卷流黃\n罷織　素\n商累怨　悽悲出閫之情　水　生\n以去閫　　登山\n妻有春尚妍桃李之姿　　松蘿之興　任婿無情　頓女一其心　士二　其行　參\n秋風於靜室　臉淚恒齊　月於\n空林愁　雖求里母束蘊難招　　召\n生離　悲乎生別離\n黃昌　字真聖初爲書佐其妻遇賊被掠轉　蜀爲人妻後昌爲蜀郡守其妻因治事至\n蜀郡人問其由妻　　會諸書佐黃曰妻遭亂人蜀曰左足下有黑子常自言當爲二千石昌\n夫妻并合　附離\n出是示之相持悲泣乃還爲夫妻\n隨誅妻\n姑命賊逢掠悍説更娶嚴生子　　　後得\n惠公元　卒　臺以贄子諸侯　然況庶人　諸\n娶矣哉有　　不可莫之養妻無歸期納娶\n之短也　　之　不違禮義施孝　妻　身\n危請姑除　不忘顧可謂婦矣士　禮懼曰\n人兄母亦勸兄迎李氏郭氏恩曰刑定律令\n室故稱　　母事之如　故先嫡後\n功義有其分　子那得與我並乃爲　築館舍\n子惡之盧產曰橋閒之内官不及同姓甘生\n妾別"},{"id":"juan6-003","source":"正文","juan":"卷第六","menu":"同姓婚第四　辨姓　禮之大同","sub_menu":null,"page":"二一九","leaf":"十六オ","text":"君\n妻則卜　禮曰買妾卜之　　妻不知其姓則卜之　不書\n姓　傳曰昭公娶于吳　故不書姓\n徒聞盧葵賦詩\n侯内寶買有　皆同姓不娶買\n斷章　　義\n執曰昭公知禮　陳司敗問昭公知禮乎　孔子曰知禮　司敗曰　君而知禮孰不知禮　辟宗　虞\n之義　　慶會女同宗也　人謂之曰男女辨姓子何　予　所家焉惡避宗　注云茍有求於慶氏不\n不蕃　其生不蕃　傳曰男女同姓其生不蕃故也\n附遠　禮取於異姓　以附遠厚別也\n以禮防人魯春秋猶去夫人之姓\n曰吳其死曰孟子卒姓同故也\n本枝　族同曰\n有別　男女有別　無別無義　禽獸之道　防人\n大魯之百代不通　禮曰百代而婚姻不通者聞　　出\n舅氏而婚本族徐宣每姓同源異其陳菜\n觀志陳矯本劉氏子出嗣　　　刺事一切勿論\n王基富晉大儒而不達禮爲　王芥娶王沈女以爲\n而婚本族非之太祖惜其材乃下令曰\n設法而威小　防君子"},{"id":"juan6-004","source":"正文","juan":"卷第六","menu":"賢婦五","sub_menu":null,"page":"二二〇","leaf":"十六ウ","text":"妻柔　正而\n婦聽　　而　　禮曰婦順備而后内和理然後家可長久\n四德　婦言婦德婦容婦功\n執婦道以成肅雝　　之也\n燒聽從　婉言語　婉容貌\n邦之媛兮　詩云美　　下之\n讓夫　曰妻聞君子下　以小利妨其行　如玉之德　垂石作程　垂\n範閫和柔婉淑叶淑女之詩守夫人之法　晉書時人稱鍾夫　之禮卻夫人之法\n謝女之貞　　道\n家之訓　大婦式　婦之　　禮　從夫　父兄嫁從夫　夫死從子\n甚宜其妻　宜善也　禮\n姻教　女師\n德禮和順積中　禮　婉容　鴻鳥　鶬鶊　巢　鵲巢夫人之德也　國君積行累功以致爵位夫人德如鳴鳩乃可配焉\n采蘩　夫人不失職\n晏子之御　史記晏子相　揚揚其妻　　　是日夫自抑損晏子問之以實對　　爲\n承前葉「妻」門\n林下風　王凝之妻謝氏道韞有才辯同郡張玄妹有才質適顧氏每稱之以敵道韞有濟尼者遊二家問之答曰王夫人神情朗徹自有林下風氣\n閨房秀　顧家婦清心玉映自是閨房之秀\n戒夫　國語伯宗每朝其妻必戒之曰盜憎主人民惡其上子好直言必及於難伯宗不從故　　　又曰伯宗歸喜曰吾言於朝謂我似陽子妻曰陽子華而不實伯宗飲諸大夫酒歸語妻曰大夫莫子若也然民不能其上久矣注云上謂賢在人上\n兵家　　欲妻之令與　小吏　　　　自於帷下觀之曰此人　　　　　　　　　　　　　　　　　　　　數年\n知人　有女才淑求　　　　賢夫有\n才學　寶滔妻蘇氏　　　　　　　　　　氏織錦作迴文詩以贈滔循環讀之辭甚淒惋\n智略　詞書桓玄欲截供軍妻謂周氏　　　　　　　　　　曰幸早離　　　　　　　　　曰事不成於　官中　養家妻謂祖曰夢不好門內不宜赤　我甚惜作士曰此可責　　　　　　　　　　　惜傾產路之及明發謂鎬妻曰\n又　晉書苻登妻毛氏善騎射　　　　　　　為姚萇所殺乃罵　　　　　　　又劉　妻　　　　　　　　以辭與祖得七十\n勇　　　壯士　　　戰殺傷其眾　　　　罵　而死\n又　張　妻陸氏　為　　守\n又　沈亮妻所　　　　　於平南將軍\n漢末年十三歲率勇士十人踰城　　為社曲所圍欲求救於平南將軍石覽\n被禽　　　云云　　　　人之中又用防為　　　　　部曲為先登詞　　　　死敗為陸所殺\n富　吳志李衡每欲治家妻輒不聽後遣人於武陵嚴陽洲作宅種甘橘千樹臨死敕兒曰吾州里有千樹亦當足衣食\n牛衣　漢王章與妻居冬無被臥牛衣中涕泣其妻呵曰京師尊貴在　　　者今疾病困厄不自憤激乃反涕泣何鄙也後章至京兆尹　　　　　上封事妻止之曰人當知止章不從竟死獄中\n鮑宣妻　後漢鮑宣妻桓氏字少君宣嘗就桓氏父少君學父奇其清苦以女妻之裝送資賄甚盛宣不悅曰少君生富驕習美飾而吾實貧賤不敢當禮妻曰　　　　是聽乃衣短布裳與宣共挽鹿車歸拜姑禮畢提甕出汲修行婦道宣至司隸\n才學　後漢蔡琰字文姬感憤作詩二首\n又　劉臻妻陳氏正旦獻椒花頌\n生徒受業　韋逞母宋氏置生徒百二十人隔絳紗受業\n先姊行　秦嘉妻馬融女少有才辯閱謂曰弟先對曰　　高姊未適前行可乎\n誡孫女　張負嫁孫女與陳平　　　　　　如父事　　如母\n齊眉　梁鴻伯\n救夫罪　蔡琰字文姬嫁於董祀祀犯法當死琰詣曹操請之時賓客滿座操曰蔡伯喈女在外為諸君見之\n小郎解圍　見獻之門謝道韞事\n詠雪　謝氏內集雪下曰白雪紛紛何所似兄子朗曰撒鹽空中差可擬道韞曰未若柳絮因風起安大悅道韞王凝之妻"},{"id":"juan6-005","source":"正文","juan":"卷第六","menu":"妬婦第五","sub_menu":null,"page":"二二二","leaf":"十七ウ","text":"婦怨　無女子難養近之則不遜遠之則怨\n怨耦曰仇\n疾郭氏之貪　王衍以其妻郭氏傲很貪鄙口不言錢\n豔妻之煽　詩　豔妻煽方處\n剛悍\n慢驕\n蠱媚\n陰險\n詖惑之心不思淑女之言　　　且壞夫\n三嫁　管子共三嫁人之法\n奇衺\n陰訟　周禮陰訟謂爭中冓之言\n庸奴其夫　外黃富人女庸奴其夫\n不宜其妻　言輕其夫苦　　　也\n以此防人婦猶有不至者　夫不至謂不親於姑舅歸飾順不修禮\n牝雞之晨　書曰牝雞之晨惟家之索索盡也言帷代雞鳴則家盡雜無晨"},{"id":"juan6-006","source":"正文","juan":"卷第六","menu":"（門名漫漶）第六","sub_menu":null,"page":"二二二","leaf":"十七ウ","text":"夫死不嫁　禮一與之齊終身不改故夫死不嫁\n自誓　詩故作是詩以　之詩略曰之死矢靡忚柏舟共姜自誓也共伯早卒其妻守義父母欲奪而嫁之誓而弗許\n畫哭　哭穆伯之喪敬姜晝哭　　　孔子曰知禮也\n天窮　夫人之窮而無告也\n未亡人自謂\n殤我良人郊\n弔　傳曰齊侯伐莒杞梁死焉若免於罪由有先人之敝廬在下妾不得與郊弔齊侯遂弔於室\n城崩　琴操曰杞梁死其妻無子刃求夫屍於城崩下哭之道路聞之者皆揮涕十日而城崩\n竹死　湘川記舜巡狩蒼梧而崩二妃不從以淚灑竹竹盡成斑而死也\n斷髮割鼻　皆古之寡婦自誓不嫁\n夜哭　禮寡婦不夜哭\n失儷　潘岳山之賦之詩共美從子體夫死死稽顙\n寡婦之利　禮實婦伊寡婦人之利\n禮夫由義合體成義重移\n死則同穴　詩曰穀則異室死則同穴夫既溢至　　將屍還陰氏\n屍還陰氏　後漢陰瑜妻荀氏名采字女荀爽少女父欲以許嫁郭奕采知不脫乃以承帷自縊而死　　　　俗入室令侍人避以粉書扇上曰屍還陰氏歸而　白刃裴令執奪到郭氏偽為毀瘵四逝請共談　　　恐人來乃　　自縊而死\n劉長卿妻　劉長卿妻揖　女生一男五歲長卿辛遠嫌不歸寧男十五而刃刑其耳自誓\n婦隱之曰若容無他意何貴義輕身\n以忠孝女以貞順稱是以藻刑以明我情沛黃鵠歌　　　列女傳\n耳\n相三吉上奏顯其門號景行義祖邑有祠\n黃鵠歌　歌曰悲夫黃鵠之早寡兮七年不雙宛頸獨宿兮不與眾同夜半悲鳴兮想其故雄天命早寡兮獨宿何傷寡婦念此兮泣下數行嗚呼哀哉兮死者不可忘飛鳥尚然兮況於貞良雖有賢雄兮終不重行\n不復嫁\n毀婦　　　人自　子殺　　　　其夫已為寡婦\n鼓盆　莊子妻死惠子弔之乃鼓盆而歌\n舞鏡　罽賓王　鸞　　　　孤\n天窮　禮老而無妻謂之窮而無所告也"},{"id":"juan6-007","source":"正文","juan":"卷第六","menu":"悼亡第六","sub_menu":null,"page":"二二三","leaf":"十八オ","text":"悼亡　潘岳有悼亡詩\n失儷\n廬柩　晉書盧柩妻為蘆叔之\n傷\n祥服　世說王武子武子月　　　　其文曰未知文生於情情生於文覽之悽然增伉儷之重\n鏡而歌\n宴會冤　晉書廬江太守　　　　　　　除婦服\n殺妻\n神令與之妻　世說荀奉倩妻曹氏有豔色妻常病熱\n承上「殺妻」　吳起仕魯魯人或曰起娶齊女為妻恐疑之起欲就名乃殺其妻以明不與齊也遂政齊大破\n其夫乃自縊而死\n舊華里　萬\n不杖　禮曰為妻與父母在不杖不稽顙\n私喪　也\n行志　後漢有龐食者　亡無以殯斂鄉人欲為備棺服融　　　古之葬者厚衣之中野雀妻子可以行其志\n自縊　朱買臣既為會稽守秋胡　　　其妻羞乃自縊而死\n自溺　妻恨吳志\n再娶　妻喪妻以義親恩制吳志\n輕重相反　後漢陳蕃喪妻歸葬鄉里　　　漢記山陽太守薛勤喪妻不臨喪\n佳人難再得　李延年歌\n苑竹妻犯禾　子羔曰五　為邑宰蔡新買遺而苑竹發蘩"},{"id":"juan6-008","source":"正文","juan":"卷第六","menu":"不再娶（序數漫漶）","sub_menu":null,"page":"二二四","leaf":"十八ウ","text":"不再娶　漢王駿妻死不娶或問之駿曰德非曾參子非華元何敢再娶\n又　韓詩外傳曰曾參妻死不更娶\n又　後漢議郎楊秉早喪夫人不再娶\n又　劉寔妻卒不再娶\n知故勸再娶寧曰每自當子違本心\n倚戶觀化　莊子妻死　　倚戶觀化\n莊德宮之喪\n潘岳詩謂妻喪也\n繼室　傳曰"},{"id":"juan6-009","source":"正文","juan":"卷第六","menu":"（門名漫漶）第九","sub_menu":null,"page":"二二四","leaf":"十八ウ","text":"殺前妻子　後漢　　妻為太尉夫人疾前妻子殺於井　　　洛陽令祝良不平卒吏嘗入太尉府按\n逐子　包曰夜號泣不能去至　　父娶後妻而憎包乃出之\n謀出外　蜀志劉表愛後妻語愛少子琮長子琦諫謂諸葛亮曰　　　上高樓去梯謂諸葛亮曰\n織縑　古詩新人工織縑故人工織素"},{"id":"juan6-010","source":"正文","juan":"卷第六","menu":"妾第十","sub_menu":null,"page":"二二四","leaf":"十八ウ","text":"賤妾\n衣帛　傳曰季琔相　　　妾不衣帛\n嬖妾　魏武子有嬖妾疾曰必嫁是妾及病其嬖妾　　　從命嫁之\n壁妾\n熱燕衛莊姜衣帛\n買妾　不知其姓則卜之\n織蒲　說文仲妾織蒲三不仁也\n奔則為妾　帶則妻\n不敢失　孝經曰理家者不敢失於臣妾\n不聘　禮妾不聘穆伯之母不聘\n誘妾　漢書曰不載誘偷臣妾汝則有常刑\n當夕　禮妻不在妾御莫敢當上僭\n生子　禮妾將生子及月辰使人日一問之謂諸侯也\n有子則緦　禮士妾有子而為之緦無子則已\n長子　妾為君之長子與女君同注妾於妾祖姑無妾祖姑則易牲而祔於妾祖姑可也\n妾祔　注曰女君謂祖姑姑也易牲而祔凡下女君一等自服不敢以恩輕服君之正統\n獻其身　有自獻其身為齊媵之先者以妾為妻為於齊媵之先者注公羊禘千太廟用致夫人稱姜氏賤也譏\n無以妾為妻　孟子曰葵丘之命曰無以妾為妻　　國語楚司馬子期訪願欲弃之欲以妾為內子\n左史倚相曰吾妾願欲外舜漢齊悼惠王\n內子服　　　之注內子服斷弁\n外婦　為高祖外婦\n旁妻　妻棄死后父\n毒　為小妻張彭祖以毒　　　封陽都侯\n喪服　母緦麻三月傳曰貴臣貴妾\n妻不肯　劉輔上書於成帝曰腐木不可以為柱卑人不可以為主\n出妻　魏氏春秋鍾會母寵於父　　父曰\n賢妾　蘇秦謂燕王曰客有遠為吏其妻私人夫夫至使妾酌酒主父　　　　僮什而弃酒主父之怒笞五十　　　主母身受吾在母勿言殺主父於是　　　忠信而得罪也\n絡秀　周顗母李氏字絡秀父俊為安東將軍求盜秀為妾　　　見夫人　　　晉書漢魏故事王公見夫人夫人不答拜\n事姑則敬與婦同而加賤也宜不酬答\n齊繒　禮悼公之母死哀公為之齊繒有若曰為妻齊繒禮與公曰吾得已乎哉魯人以妻我我言\n宦女妾奔孟僖子　泉丘女夢以帷幕孟氏送妾祭遂兄以達無子必妾送之遇不受曰以身任於國不敢慮繼"},{"id":"juan6-011","source":"正文","juan":"卷第六","menu":"美人第十一","sub_menu":null,"page":"二二六","leaf":"十九ウ","text":"淑姬　詩彼美淑姬可與晤歌\n蟬首蛾眉　清陽婉兮靜女其姝彼美\n詢美　詢信鍾美尤物傳夫有尤物足以移人\n棒心而頗施芳澤設\n弃珥　珥瑱靡鼻雜齒矮媚列子子產弟公孫穆後庭北房擇姱齒矮媚趙女鄭姬方者頭如玉\n如玉　見上\n姱容脩態　辭楚雲雨行雲暮為行雨千金買巧笑之瑳瑳巧笑貌媚玉\n之儷　乃可反行　　有節也"},{"id":"juan6-012","source":"正文","juan":"卷第六","menu":"妬婦第十二","sub_menu":null,"page":"二二六","leaf":"十九ウ","text":"螽斯美后妃無妬也　言若螽斯不妬忌則子孫眾多\n夫人無妬忌之行　則惠及　　　入宮而妬史記妻無\n妬　史記妬女入不使視叔向曰深\n專房之寵賈氏之種　晉武帝欲為太子納妃帝曰衛公賈氏之種妬而少子樊氏之賢進女於王勝\n惡女之仇　室惡女之也\n不宜其妻　也禮夫婦之道苦謂不\n弃子　後漢龐參妻弃前子於井中\n無此向　謝太傅劉夫人不令公有別房公頗欲立妓妾生姪\n使視山　傳叔向之母妬叔虎之母美而不使視叔向曰深\n晉書賈充妻郭槐疑充視乳母苦殺之其子戀絕而死及生小子亦然充遂絕嗣\n雖微達此共詩夫人因方便　　蟲斯有不妬之德夫人閒使周姓候詩當無此句\n南郡主欲殺李氏　妬記曰桓司馬以妻　　　李子在窗前梳頭髮委地姿色絕麗乃徐下　結髮斂手向主曰國破家亡\n承上　鐵鑄生之年神色安正歸言悽婉主\n害己謂之妬密置妾　王導妻曹夫人氏性妬導憚之為密置一眾妾於別館以觀之曹氏知而將往導恐被妻辱遽命駕猶恐遲以所執麈尾柄驅牛而雄邁　　　方擲刀把之曰我見猶憐何況老奴\n求絕　謝邈妻或度妻鄭氏妬怨對與邈書邈以書　　　非婦人之辭疑其閨生仇玄遠為之作述\n被傷　去職不許割　　　晉祖約妻無男妾妬約亦不敢遠竹常中夜震於外為人所傷辯妻所稱求　　　被刑戮宜\n不責　廉也歸盡遺細君又何仁也上笑賜酒一石賜肉百斤將遺細君\n遺肉　漢武帝令東方朔自責朔曰拔劍割肉一何壯也割之不多又何"},{"id":"juan6-013","source":"正文","juan":"卷第六","menu":"寵嬖第十三","sub_menu":null,"page":"二二七","leaf":"二十オ","text":"畫眉　漢京兆尹張敞為婦畫眉長安傳張京兆眉有司奏宣帝問之對曰臣聞閨房之中夫婦之私有過於畫眉上愛其能\n悅己　女為悅己者容荀奉倩之深情鍾夫人小吏為妻先引蕭望之為御史大夫使小吏冠\n甚宜其妻　也禮善擇瑞琿\n食殘桃　韓非子彌子瑕"},{"id":"juan6-014","source":"正文","juan":"卷第六","menu":"思婦第十四","sub_menu":null,"page":"二二七","leaf":"二十オ","text":"思伯樹萱　詩言思伯焉得諼草言樹之背\n願言思伯使我心痗\n望夫化石　望夫不歸身化石於山之上\n飛蓬　詩曰自伯之東首如飛蓬豈無膏沐誰適為容　　見賢痛\n蕩子不歸　古詩蕩子行不歸空床難獨守\n牽衣　魏文帝詩將適千里詩牽衣執袂\n藏泥　注　　　禮襦器而藏之襦亦\n塵泥之難　古詩君為清路塵妾作濁水泥\n攀桃李兮不忍別"},{"id":"juan6-015","source":"正文","juan":"卷第六","menu":"婚姻第十五","sub_menu":null,"page":"二二七","leaf":"二十オ","text":"勢婚非偶　辭與身將室之辭以與門其故怨曰人　　　左傳鄭公子忽有功於齊齊侯欲妻之辭人問其故忽曰人各有偶齊大非吾偶也今齊人之惠而授室以歸是以師婚也\n又　魏志賈詡字文和妹要不結高門天下　　　其弟曰此役也不死必要於高又後漢王謙棄官何進長史以謙名公之胄欲國注言欲立功要爾相之女\n又　魏志張範字公儀素隱　　　又女陪自陳結婚處非不受　　　之論智計者歸之\n承上　為侍中尚書兒華尚書僕射錄尚書事父黃萬平相玩子納尚書令王導又漢雋不疑字　　　胡至江左請婚於陸陸曰語婁無松柏薰蕕不同器玩不為亂倫之始\n妾大將軍欲以女妻之楊駿欲以女妻鄭默默不同以女固辭久之以病免\n又每讀雋不疑傳常喜嘉之曰\n中官女　典略曰中官常侍唐衡故以女妻汝南傅公明公明不要輒以女妻荀彧或或父緄華衡對誡或要之為論者所譏曰松之云時閹豎用事四海屏氣九懼唐衡威權莫二順則六親以安違則大禍立至斯以疥易之由昔蔣詡姻子王氏無損清高之操組之此婚庸何\n不許婚　孫權遣使為子求關羽女羽罵辱其使不許婚權大怒\n悔婚　男女為婚彥後葬父於路王慧傅元顗管彥為友約　　　陽哀遂別嫁其女　　　謝慶弟頠曰昔嫁姊妹皆遠曰凶斷絕今賢兄葬父路陽而題妻還葬齊如此去　　　還吾結好之意哉\n諫婚　晉劉寔妻卒華氏將以女妻寔寔弟智諫曰華氏貪頗必汙門戶寔不得已竟婚而生子貞寔後坐貞受賂免官"},{"id":"juan6-016","source":"正文","juan":"卷第六","menu":"（門名漫漶）第十六","sub_menu":null,"page":"二二八","leaf":"二十ウ","text":"女自擇\n美如陳平　陳平長欲娶妻富者莫肯與貧者平亦恥之\n徐五[吾]犯妹　左傳鄭徐吾犯之妹美公孫楚聘之矣公孫黑又使強委禽焉犯請於二子請使女自擇焉子皙盛飾而入布幣而出子南戎服入左右射超乘而出女自房觀之曰子皙信美矣抑子南夫也夫夫婦婦所謂順也遂適子南氏\n王濬妻　晉王濬字士治為河東從事　　　有女才淑擇夫未　　　公孫楚也\n季羋　楚昭王將嫁妹季羋昭王卒羋走而從之　　　所謂女子遠丈夫也鍾建負我矣請妻鍾建遂以妻之時昭王\n擇對　氏有女狀肥醜而黑力舉石臼擇對不嫁年至三十父母問故女曰欲得賢如伯鸞者鴻聞而娶之\n賢如伯鸞　後漢梁鴻字伯鸞同縣孟氏有女\n呂範　呂範字子衡曲阿人劉氏家富女美範求之其母欲勿許劉曰　　　氏曰吾觀呂子衡寧當久貧者乎遂與婚之\n〇冥婚　合葬事周禮媒氏禁嫁殤者　　　擇夫門與嫁殤殤者陳壽著　　　魏文帝愛　　　合葬　　　倉舒\n一、影本小字夾注筆畫細密，掃描解析度不足，凡標  者係據字形殘畫推定，標 　 者無從辨識，一字一 　；連續難辨處以「　　　」概括，非確指三字。\n二、黑地陰文門類標題共八處　十七ウ二、十八オ一、十八ウ二、十九ウ一、二十オ二、二十ウ一，字口填墨，僅「第」字與序數略可辨，門類名多不可讀，本錄文所擬　妬婦、寡婦、悼亡、不再娶、妾、美人、寵嬖、思婦、婚姻等係依其下所隸事目推定，非影本明文，序數亦僅供參考，其中十七ウ左半與十八オ所辨序數互有牴牾，待覆核原本。\n三、a、b 兩半重疊帶已合併，接縫附近條目歸屬　如「不再娶」「美如陳平」等依內容判定，未重複著錄。\n四、本葉內容不屬「奴婢類」，實為卷六「妻—妬婦—寡婦—悼亡—繼室—妾—美人—寵嬖—思婦—婚姻」諸門，奴婢門當在後葉。\n承上條　率欲求邴原女合葬邴原拒之曰合葬非禮也又甄氏亡女合葬耶也"},{"id":"juan6-017","source":"正文","juan":"卷第六","menu":"待妻以禮第十六","sub_menu":null,"page":"二二九","leaf":"二十一オ","text":"死則同穴　明帝愛女歲覺取死則同穴\n若嚴君　後漢張堪字子平令嚴妒婦禮居\n苔拜　後漢樊英有疾妻使婢拜問英\n早起見面　漢朱博字子元夜寢早起妻歛見其面\n待妻有禮　見其面疾篤妻出省之慍令左右扶起\n如君臣　後漢馮良字君卿志行高潔非禮不苟　　　吳志顧譚字子通待妻有禮常夜入嚴出\n南面北面　晉何曾閨門　　　　經年老相見必正衣冠相待如賓己南面妻北面再上酬酢既畢便出一歲如此不過再\n自責　後漢仇覽在燕居必以禮自責妻庭謝依覺冠乃就外堂矣"},{"id":"juan6-018","source":"正文","juan":"卷第六","menu":"烈婦第十七","sub_menu":null,"page":"二二九","leaf":"二十一オ","text":"政姊　史記聶政\n相政愛面　目自暑死其　　　以千金久之政姊聞之曰吾弟\n以千金久之政姊聞之曰吾弟　　　　賢弟之名乎乃之歸市呼天者三死政之姊也\n摩笄　趙襄子登夏屋山請代王使廚人操銅斗行擊代王　　　代夫人聞之　　　泣而呼天磨笄自殺因以為磨笄山\n代夫詔獄中　威道妻趙氏部　　　守\n夫惡自殺\n歲代君操妻乃解道　　縱身不興）\n道家寃取高死　　姜夜告道　速　　　立門戶　　識代君操妻乃解　　縱身不興\n夫死不再\n少　日　言不用君　朝　　　　阿少少開　　而　多行無禮　　　　　　手刃）\n國國都妻　宗女阿少少開　　　　謝阿少\n夫雖乃感　勵改行遂成名奉州辟至壽春　　　刺史又\n臨危請姑　晉禮志云李鏊　　　先　陳　訛　　　　　　姑　　命　　將"},{"id":"juan6-019","source":"正文","juan":"卷第六","menu":"孝婦第十八","sub_menu":null,"page":"二二九","leaf":"二十一オ","text":"陝婦人養居事叔姑其家欲嫁之　　臨危請姑不忘\n可謂婦　　　　　　　　是皇人人為家伯\n有司誅之　　鳴屍上　藏頁暴之十日不腐虫獸亦不敢近　　　　內經年不腐乎迷漢蔦志牛訪其墓誌曰貞烈婦其曰六甫"},{"id":"juan6-020","source":"正文","juan":"卷第六","menu":"家道第十九","sub_menu":null,"page":"二三〇","leaf":"二十一ウ","text":"家人女正位乎內男正位乎外　易\n家有嚴君　父母之謂也\n夫子之家事理嚴刑于子\n刑于寡妻　至于兄弟以御于家邦　詩\n萬石君　請讓為禮坐對案不食子孫謝罪因長老肉袒改之\n理家如官　後漢李通嚴毅嚴養子孫　　　為後世法\n閨門自守　諸子雖冠成人不命則不敢進\n少長無樂嬖幸　　　　之好與妻相見正衣冠相待如賓己南面妻北面又廉范字元規美姿容閨門整肅\n禮節閨門之內不肅而成　　　　　以夏侯泰　　　　率子抱孫　　王義之率諸子抱弱孫一味之甘\n率子抱孫　割而分之以藏目前教養子孫毀\n切陳長文之倫人得其方嚴罕莫敢造\n厚退讓依陸賈斑嗣楊王孫之處世也\n家人嗃嗃　嚴酷\n婦子嘻嘻　失家節也\n免冠自責　見上"},{"id":"juan6-021","source":"正文","juan":"卷第六","menu":"父子第二十","sub_menu":null,"page":"二三〇","leaf":"二十一ウ","text":"天性父子之道父道子道人父人子才不才　其子也亦名言\n各子其子　各親為愛\n莫知其惡　諺曰父之　　知其子之\n親後　敢不敬與禮也\n斯子　吾有斯子\n負荷　古人言其父不克負荷其子不克負荷\n天明　父子兄\n父慈　謂六順\n雙珠　端曹曰不意雙珠生於老蚌\n堂構　書曰君考作室既厎法厥子乃弗肯堂　構\n子牛　牛而蒴其耳\n香景公謫　緡為孺子怵　　孺子茶\n冬夏之日　趙衰冬日之日趙盾夏日之日可畏\n天明\n子會　造說曰歲本立　苟　　　　　　　六龍下食文君小坐膝前于時太史奏五里內賢人聚長\n至前使叔慈明行紹金\n阿戎談　王戎字濬仲父渾阮籍謂曰濬仲清賞非卿倫也與卿言不如與阿戎談\n厚於慈　禮以此防人人猶有薄於慈而厚於慈父兮為\n子隱　直在其中\n以篤父子　禮\n家肥　禮曰父子篤夫婦和宗之肥\n異宮　禮曰命士以上父子異宮異宮崇敬也\n見父子之\n倫焉\n禮厚敬　以厚敬者也\n無能　下無能禮父之親子也親賢而不親\n父止於慈　禮為人子止於孝為人父止於慈\n父兮生我身之貳也　禮\n椒聊有實　之詠\n孝養厥父母　書\n饋獻　父器在饋獻不及車馬示人不敢專\n無父何怙　詩從命不忿微諫不倦\n瞻望　勞而不怨可謂孝矣\n不奸　子不奸之義可立不以父命辭王父命衛侯也\n有子有父　公羊曰父有子子不得有父注云有子謂殺子曰父疎\n毅累仲之義可立不以父命\n此公孫也子　　　史記趙禹謂將軍　　　禮\n此公孫　　　由父疎也\n視方　　　　不知其子視之友\n遺體　　　　　謁事迎拜　　　父謁曰不早知為大人遺\n父子之閒　人所難言誠\n三君　陳紀元方弟諶季方寔　　　一而已　傳父子\n疾之憂喜懼　父母之年不可不知一則以喜一則以懼\n惟其疾之憂　帝謂田千秋\n子為親後　慈乃\n禍患相收　莊子假之亡也\n林四井千金之\n莊子\n養愛父敬　取其愛而君　　　故母取其愛故父取其敬\n託子於人　子為三公太師父\n敬父書曰評　矣顏慥字子通每得父書常擗踊嗚咽讀之每句應諾異\n京師適會歲節　上壽梅歡人皆慶美\n鮑氏吳王聞　　　　納自刎而死\n公卿諭諭府壽酒\n使廣祗其子於鮑氏\n賜千金負赤子而蹣為其命與赤子之府實矣為其黑滿赤子之\n田里每有還鄉輒\n再拜若父有疾恆之閒即　　　神父\n臨書垂泣語聲哽咽也\n●訓子不訓　子門　義方　石醋曰目聞愛父　子敦之以義方\n過庭　孔子嘗\n過庭　曰不學詩無以言不學禮無以立鯉退而學詩禮也\n遠子　又聞君子之遠其子\n教忠　獨崇曰子之能事父教之忠也古者曰教子貳阿以事君\n嚴父愛子天性\n慈教　父慈而教子孝而忠\n七子之業　晉劉殷字長盛有子七人各授一經一門之內七業俱成\n幼學\n詩禮之訓　幼子常視無誑長者與之提攜則兩手奉長者之手負劍辟咡詔之則掩口而對皆幼子之教\n不就師傅　子既生不免於水火母之罪也成童不就師傅父之罪也\n將紹家聲　庭訓　嚴君\n餘其儒教幼學門\n人生十年曰幼學\n教子之方　自相勗導豈不優於今\n居家嚴君　嚴君耶萬石君也\n尊嚴衛奉世　奉進子野王通詩犬獻\n刑國　自家刑國\n不教吏職　漢薛宣子惠為彭城令宣過其縣橋梁郵亭不修宣心知惠不能教曰然不問惠以吏事\n尚書　敕參通\n稱宣意使掾送宣令掾自從其所問宣以不教戒吏使騎之事各吏守\n各使守一藝　云為師能與不能自有致材何可豫子也\n三人各使守一藝　宣笑曰吏道以法令為師能與不能自有材何可豫子也\n教養子孫為後世法\n臨刑告子　范滂字孟博滂誅下獄謂其子曰吾欲使汝為惡惡不可為使汝為善我又不為惡行　　之後不流涕\n又　鄭玄字康成戒子田　　曰吾年七十\n杖而出門家事大小汝一秉之\n訓誡之廖曰　皎然所在儆也\n不聽訓　後漢馬廖不訓諸子友人楊終\n八務七誡　熊氏春秋蜀諸葛亮作八務七誡六恐五懼皆有條章誡勖諸子弟\n枚之咸曰具曉所訓大抵教戒諸物其在牛遂不復言\n陳萬年疾召子咸教誡之咸睡頭觸屏風風萬年怒將撻子\n百萬為司徒　名譽淺誠聞子鈞曰　綱與烈藝　鑿子之鈞　膝武弁而\n走烈曰死幸父揭而走老夫事鈞曰大杖則走小杖　則受烈聽而止\n又王朔子有同志違遭喪在"},{"id":"juan6-022","source":"正文","juan":"卷第六","menu":"父子第二十","sub_menu":"（續）","page":"二三二","leaf":"二十二ウ","text":"山中請往吊之丹恕蹉之令遇蠻而巳皆餘受人斑白遺陽　孫盛安國年老遇家性方厳有孫斑白而庭訓闕焉\n不慈　附父乃疾厭子門\n乃疾厭子　書曰父不能字厥子乃疾厭子言不慈也\n人不父　父不子滅親　傳石碏純臣也　大義滅親\n瘖子　郭無兒\n無兒　鄧攸字伯道弃子活兄子竟無兒　時人曰皇天無知使伯道無兒　竟易\n不慈　父不慈子不孝　母孝\n弃子　其子厚與州呼同斌君暗殺之\n子而食父　宋人易子而食　父頑嚚\n信讒　琴操尹吉甫信後妻之讒而殺伯奇伯奇自傷無罪乃援琴作履霜操而死\n慈幼　周禮以保息六養萬人一曰慈幼慈愛小幼也\n刲牛之子　舍諸吾父善\n慈愛慈幼　禮曰慈幼其近於子也\n郡叛事　　　見上注\n獻公將殺父之罪也成童不就師慈愛慈幼\n其太子申生\n劫化質不救　後漢　　字公祖遷侍中以疾罷就殺酉里舍玄少子十歲獨遊門次有三人持鋼執之入舍登樓\n殺子　國賊遂進攻玄子亦死玄乃詣闕謝罪請下天下　　三綱絕矣\n凡有劫質皆併殺之不得贖以財寶開長姦略　三綱絕矣\n殺子　漢金曰磾子為帝弄兒上見上前踰滑逸遂殺之\n為國　晉郡續行樂陵太守石勒招之執以孤尼權　　帝從之其下諫曰子\n食美　樂人民　工肉羹美　樂羊子在郡龐義\n告誡曰廖子在郡不從及禍樂飲曰樂羊食子羹美非無父子之恩\n畜我不卒　畜我不卒\n●喪子　子門\n喪明　子夏喪其子而喪其明\n曾子弔而怒之曰喪爾子而喪其明\n言慟　傳之閒謀封目隕者三\n七旬　潘岳西征賦曰夭赤子於新安次路側而塞之事有千秋　晚子\n土命七旬期雖勉勵於延吳實惜慟於予懷況赤子以三月于頃生五月甲辰天六十餘\n懷慟　見上\n珠碎於掌　蕙蘭敗於庭　投車橘于灞\n情鍾　晉王衍字夷甫喪子山簡弔之衍悲不自勝簡曰孩抱中物何至於此衍曰聖人忘情最下不及情情之所鍾正在我輩簡伏其言更為之慟\n仁與達　晉書王祥二子烈芳同時而亡祥曰不悲　　　　作也\n稽顙　禮為長子稽顙顙重正體也\n子既不幸　老將長子服　禮處子不得為長\n不哭　列子東門吳子死不哭其相曰公之愛子天下無有今死而不哭何也吳曰吾嘗無子無子時無憂今子死乃與嘗無子同吾何憂焉\n封篋　王遂守遺高　其子　　　送　　　母\n損　晉魏舒字陽五子皆先卒舒篋哀慟既損而歎曰不及莊生達矣以無益自損\n殺金救　陶朱公中子殺人於楚朱公曰殺人而死職也少子　　齎金千斤　　顧罪且子\n送飯　送飯哭至臺　父器　　　　不忍開之\n不與莊生怨尼言於王先殺朱公子而後赦長子持喪歸朱\n●無子　附父\n公曰吾固知必殺汝弟汝見吾　　　時重惜金所以卒殺汝弟\n●無子　附父　　　天寡　無子\n叔向之憂　憂無子也\n伯道無兒　皇天無知使伯道無兒　鄧攸字伯道無\n無後　子文無後何以勸善\n妻無子　衛莊公娶于齊東宮得臣之妹曰莊姜美而無子衛人為賦\n摘溝　小兒基而無子知　　　見庄　餘人\n又　晉獻公娶子\n賈而無子\n何以能育\n託身於人　樓護字君卿故人呂公　　　遺護養之終身\n人漬　　何以得此曰吾德祿之餘及威為徐州刺史威帶問之\n復慶蔡遺為征虜將軍同產弟孫以遵無子束妻\n遂遭不受曰自以身任於國不敢慮嗣之計\n皇祐　　孫叔敖死無立錐之\n負薪　　　其子負薪然楚\n牧承　陳祐年二十而孤家貧采薪於長垣澤中其父友闕曰子二十石子彼取蘭子無耶奈何先\n孤子　死王事者　周禮\n六尺之孤　可以託六尺之孤謂幼君少孤不知其\n不遠事父母　孤也謂少\n●遺孤　附父孤兒門\n孤兒　憂　託子於後\n抱之　禮父沒子幼則以縗抱之\n慈幼　見上\n恤孤\n字孤　不能字人之孤\n無父何怙　有子\n寄依　漢帝既臨\n張禹有託　安昌侯張禹疾病罷車　　令幼子舜於林下\n山公尚在　嵇康臨刑謂子曰山公尚在汝不孤\n撫孤不孤\n仲宣無後　魏王粲死後二子犯法誅絕後時父祖在漢中虎子曰孤若在彼不使仲宣無後也\n虎子　吳陵統卒二子皆幼\n與諸子同　寶客進見呼之曰此吾虎子八歲令讀書\n十一令乘馬夏長進錄功封侯　　解孤其雄將\n●知子　附父子門\n黃若父　知子莫若父　知子莫若父\n趙奢　史趙括少學兵法父奢不能詰難不謂善曰兵死地也而括"},{"id":"juan6-023","source":"正文","juan":"卷第六","menu":"父子第二十","sub_menu":"（續）","page":"二三五","leaf":"二十四オ","text":"舉子　祁奚請老晉侯問嗣焉稱解狐其讎將立而卒又問焉對曰午也可乃舉子\n吳恢　後漢吳祐父恢為南海欲煮青簡寫經祐諫曰越五嶺俗多珍　　　以蘊玆興謗王陽以衣裘徽名\n易言之敗　關必括也\n石苞　石苞臨終分財與諸子不多　　曰小兒雖小後自得之\n吳氏世不　　吳季子　　　王汎以為廣父說獨異焉素靜\n毋為言苞曰小兒雖小後自得之　　　三綱以為廣父說獨異焉素靜\n●業官　附父子門\n明經丞相　漢書韋賢字長孺子玄成字少翁俱以明經位至丞相故鄒魯諺曰遺子黃金滿籯不如一經\n不從坐　謂不從坐\n姚弋仲　仲令子襄討石閔曰汝才十倍於閔有罪不從坐皆表請之\n司徒　本業鄭武公父子並為周司徒善於其職也\n父作子述　禮父作之子述之\n清白問絹\n監驢　不止傳舍卿　數曰吿驢父\n業書　晉書王羲之子獻之並能書謝安問\n魏為荊州刺史子處自京師省父自\n人漬負何以得此曰吾德祿之餘及威為徐州刺史威帶問之\n張奐父子　親略張奐為武威太守時奐甚方孕夢印綬　樓而歌旦告\n權曰位坐則皆恨人不知　易其嫂也\n奐與許占夢占夢曰夫人生男復　　止　　實孚及生　以\n建安中為武威太守殺刺史邯鄲商州兵圍之　　恥見\n赴代　漢書公孫賀白太僕代父為僕卿\n曰豈使乎頭過華陰歷先君之墓手乃　自曉　死矣\n韋康　刺史父端為將代父端為荊州刺史父岐止傳舍康入官時人榮之\n辛毗　魏志辛毗　　為衛尉卿子敞亦為前封也\n同官\n坐　吳錄紀亮為尚書令子躬為中書令每朝會詔其御坐屏風隔其坐也\n三代為同隸　後漢韋彪　　　韋三代為同隸\n周公拜前魚貧公拜後　尚書劉頗太守恩　為揚州\n父子為　　世祖令鮑昱封隆明歟問\n有所怪　在昱曰通官文書言不著姓怪同隸下著　　　知忠臣子復為同隸也\n●父子同殺　附父子門\n父子代誅　漢書周紆字文通為\n及宗　後漢公孫賀為丞相子敬聲　　太僕敬聲有罪賀請\n子代父　沛郡守為人酷虐後　　　以贖子罪寔世曰承相禍及宗族矣\n坐事父子皆伏誅\n史石奮相楚行縣有殺人者追之乃其父也繫其父還而自縊\n史石奮相楚行縣有殺人者追之乃其父也繫其父還而自縊\n死\n晏　魏略太祖納何晏母收何晏素宮中秦朗　獻帝春秋曰秦朗父為張飛所殺太祖納其母愛朗謂人曰世有愛顏子如孤者乎\n曰殺父立政非孝也慶法幾罪非忠也自當死乃自刎而死\n服飾擬太子文帝憎之謂之假子\n●假父假子　附父子門"},{"id":"juan6-024","source":"正文","juan":"卷第六","menu":"母子第廿一","sub_menu":null,"page":"二三六","leaf":"二十四ウ","text":"母慈子　　母慈有慈　無\n有慈　無慈\n母取其愛　孝經\n厚其慈母也　只天水火不免水\n何怙　無母何怙\n靡依　無母\n母兮鞠我　撫我育我長我\n母德母儀　陟岵詩母氏劬勞　幽勞　　善\n三年免懷　子生三年然後免於父母之懷\n不獨子其子　禮各子也\n從子　禮婦人從人者也夫死從子\n慈愛無能　親之無能則憐之\n則母養　如母而養之\n旁無几杖　後漢胡廣年八十心力克壯為太傅　母\n母為敵獲　徐庶母為曹操所得謂郎備曰本欲\n明公數還歎令失老母方寸亂矣勝　題\n在當朝考臨旁無几杖言不　　　聯老母卒居喪盡禮三年\n一、本卷此段門類（陰文標題）依次為：待妻以禮第十六、烈婦第十七、孝婦第十八、家道第十九、父子第二十、母子第廿一；另有小字「附…門」之子目：不慈（附父乃疾厭子門）、喪子、無子（附父…）、遺孤（附父孤兒門）、知子（附父子門）、業官（附父子門）、父子同殺（附父子門）、假父假子（附父子門）、訓子（附父義方門）。門類序數字多為陰文反白且漫漶，僅「父子第二十」較可辨，餘依序推定並標 。\n二、小字雙行夾注筆畫細密，影印本網點粗，多數行僅存輪廓；錄文中凡不能斷定者已標 　 或 。以印刷頁二二九左半　葉二十一オ左、二三一左半、二三四左半、二三五左半四處漫漶最甚，可信度最低。\n三、a、b 兩半重疊帶處之重出文字，已於接續行以「　承上」性質之括號單獨列出，未於前後兩頁重複計為新條。\n拜畫像　漢金日磾母教誨兩子有法度上聞嘉之母死詔畫圖署曰　母日磾每見畫常涕泣拜之"},{"id":"juan6-025","source":"正文","juan":"卷第六","menu":"母子第廿一","sub_menu":"〇賢母　附母子門","page":"二三七","leaf":"二十五オ","text":"聖善　詩曰母氏聖善我無令人\n三徙　孟子之母三徙擇鄰以教子\n買豬　韓詩曰孟子少時問東家殺豬何爲母曰欲啖汝旣而悔之曰吾聞胎教之時席不正不坐割不正不食今適有知而欺之是教之不信乃買豬肉以食之\n寄鮓　吳錄孟仁字恭武本名宗爲監魚池司馬自結網捕魚作鮓寄母母還之曰汝爲魚官以鮓寄母非避嫌疑也\n陰德　孫叔敖幼時逢兩頭蛇殺埋之見母泣其母曰汝有陰德陰　報汝無憂矣\n掃墓　漢嚴延年爲河東太守　刑殺甚多號曰屠伯其母知之乃曰我不意當老見壯子被刑戮也遂去汝東歸掃除墓地以待汝遂歸見兄弟宗人復言之後歲餘延年果棄東市\n不食　漢書雋不疑爲京兆尹每行縣錄囚徒還其母輒問不疑有所平反活幾何人卽不疑多有所平反母喜笑爲飲食語言異於他時或亡所出母怒爲之不食故不疑爲吏嚴而不殘\n以爲己子　　　　言待其喪　戴妾無子　妾之子言若己生\n以爲嫡子　趙　　　以妾爲嫡子\n不哭　禮公父文伯之喪敬姜據其床而不哭曰吾有斯子也吾以爲賢人也吾未嘗以就公室今及其死也朋友諸臣未有出涕者而内人皆行哭失聲遂撫其三子下之\n舉德　吳隱之爲喪哭盡哀鄰人不忍聞韓康伯母隱之鄰居也每聞隱之哭聲輟餐投箸爲之悲泣康伯亦悲母謂康伯曰汝若居銓衡當舉此人及康伯爲吏部尚書隱之遂階清級\n王陵母　漢王陵母在項羽軍中漢使人至羽置母軍中陵使至則東嚮坐陵母欲以招陵陵母私送使者泣曰爲老妾語陵善事漢王漢王長者無以老妾故持二心遂伏劍而死\n叔向母　叔向欲娶申公巫臣氏之女其母止之曰甚美必有甚惡是鄭穆少妃姚子之子　叔向懼不敢娶平公彊使娶之生楊食我其母止之曰吾聞之甚美必有甚惡\n陳嬰母　秦末天下兵起嬰亦起衆母曰自吾爲汝家婦未嘗聞貴不祥不如以兵屬人事成少受其利不成禍有所歸\n王經母　魏尚書高貴鄉公微詔司馬文王經以密謀不告誅收經母顏色不變笑而應曰人誰不死正恐不得其所\n承上不得死以此並命何恨之有\n經學　漢崔篆母師氏能通經學百氏之言王莽寵以殊禮號義成夫人\n生徒受業　晉韋逞母宋氏父世儒學家世以周官禮傳業　宋氏晝夜傳授　置講堂置生員百二十人隔絳紗幔而受業號曰宣文君\n智\n養前妻子　羊祜前母孔融女　　與祜同母兄　　全乃專心恭養遂得孝名\n截髮待客　陶侃字士行少爲潯陽縣吏鄱陽孝廉范逵嘗過侃時倉卒無以待客母湛氏謂侃曰汝但出外留客吾自爲計乃截髮爲雙髲遂以易酒肴\n罵賊而死　魏楊阜字義山參涼州軍事馬超攻破冀城殺涼州刺史韋康阜外兄姜敘屯歷城阜見敘母　起兵超襲得殺敘母罵超超殺之\n以下接左半\n遺母鮓　陶侃母湛氏侃少爲潯陽縣吏監魚池以坩鮓遺母湛氏封鮓責之曰爾爲吏以官物遺我不能益吾乃增吾憂也"},{"id":"juan6-026","source":"正文","juan":"卷第六","menu":"母子第廿一","sub_menu":"〇惡母","page":"二三八","leaf":"二十五ウ","text":"殺人之疑　曾參之母方織人告曰曾參殺人母曰吾子不殺人織自若　三人告　乃投杼而走\n寤生遂惡　鄭莊公寤生驚姜氏遂惡之後遂復爲母子如初也\n不安其室　衛之淫風流行雖有七子之母猶不能安其室言　欲再嫁者也\n蜂之讒　　　後母令奇掇蜂因而讒之欲罪也\n棄女堤下　宋芮司徒生女子赤而毛棄之堤下共姬之妾取以入名之曰棄\n新息婦人殺子　後漢賈彪爲新息令人貧困多不養子彪嚴爲制罪與殺人同　城南有盜劫害人城北有婦人殺子彪出按賊掾引南廳恚曰賊寇害人此有常理母子相殘逆天違道\n弃　史記姜嫄踐巨人跡而生子棄子冰上飛鳥以翼覆薦之故名弃周相后稷也\n慈幼　周棄子後漢龐參妻子於井中\n畜我不卒　父兮母兮畜我不卒"},{"id":"juan6-027","source":"正文","juan":"卷第六","menu":"母子第廿一","sub_menu":"〇姓及子","page":"二三八","leaf":"二十五ウ","text":"生育\n嗣續　以嗣續莫大焉\n夢蘭　鄭文公有賤妾燕姞夢天使與己蘭曰以是爲子旣而文公見之與之蘭而御之曰余不才而有子將不信敢徵蘭乎生穆公名之曰蘭\n采苢　婦人樂有子也采之\n男子之祥　吉夢維何維熊維羆男子之祥維虺維蛇女子之祥\n弄璋弄瓦　乃生男子載衣之裳載弄之璋乃生女子載衣之裼載弄之瓦\n贈鯉　孔子子生三月有饋鯉魚者乃名子曰鯉字伯魚也\n繼體承家　　代有文在手\n同物　傳云桓公曰是生也與吾同物命之曰同謂其同日生也\n我又邑姜方娠太叔夢帝謂己子名之曰虞遂以名之\n老蚌　孔融與韋端書曰不意雙珠生於老蚌\n聞聲不視　叔向嫂夏姬之女生子伯石其母及堂聞其聲曰是豺狼之聲也是必滅羊舌氏遂不見之\n聞聲觀狀　楚司馬子良生子越椒子文曰必殺之是子也熊虎之狀而豺狼之聲弗殺必滅若敖氏矣\n掌上之珠懸弧之慶　男子初生\n月辰　禮妻將生子及月辰居側室夫使人日再問之至于生子復使人\n負髮　子生三月始負子以桑弧蓬矢射之射人以桑弧蓬矢六射天地四方示男子有事於四方也\n翦髮　子生三月之末擇日翦髮爲鬌男角女羈否則男左女右\n父母全而生之孩而名之　子生三月妻以子見夫人　升階　　執子之右手咳而名之\n食母　禮諸侯家子生卜士之妻大夫之妾使食其子　大夫之子有食母士之妻自養其子　庶人居囂室\n初之星有後之慶　以異也子既生見王\n婦孕不育　乃多女災傷也 易漸\n天多傷胎生者不殰卵生者不殈　殰胎敗也 殈裂也 毛者孕育羽者卵育\n不坼無災無害　音坼芳福反 毛詩曰誕彌厥月先生如達不坼不副無菑無害\n誕彌厥月先生如達\n彌月不遲　　生子不遲晚也 十月\n賜酒　句踐令有孕者以告公令醫守之生男產一壺酒一犬生三人公與之乳母\n錢帛　　人特賜士錢帛 三人俱生\n胎養穀　後漢章帝屬妊者胎養穀三斛復其夫役終身\n胎教　漢書氏產三人一乳\n紹復\n熊羆慶　詩曰維熊維羆男子之祥\n有文在手　　徵蘭之詩\n則百斯男　詩太姒嗣徽音則百斯男\n雙生\n居上爲兄　公羊言古人尚質雙生以後生者爲兄以居上\n三歲不孕　婦三歲不孕\n接子　凡養子擇日祭子則太宰謂天子世子未\n陸終生六子　史記陸終氏生六子　剖而生焉不坼而孕 列子曰思士不妻而感\n產輒焉死　　氏字文肅好學　　祝忽至孝母　疾甚\n妻之不死　韓朗字伯司生三日遭亂棄於荊棘蒙日兵靜母往視尚有氣息乃收養及長舉爲孝廉\n鬻子之閔斯　鬻稚也 閔病也\n生齒　家語男子八月生齒 八歲而齓\n不對生可得乎　易損卦注\n過期　易姤女壯過期不孕謂十月不生 生一男一女爲\n天地相應乃得化淳男女反配乃得化生陰陽"},{"id":"juan6-028","source":"正文","juan":"卷第六","menu":"母子第廿一","sub_menu":"〇遺腹　附母門","page":"二四〇","leaf":"二十六ウ","text":"李陵　漢書李廣子當戶早卒　遺腹子\n同　鄭玄別傳曰玄子爲孔融所殺　孝廉　　生　名曰小同也\n泗水王　漢泗水戴王前薨無嗣國除後宮有遺腹子煖相内史皆下獄〇出\n不奏言上聞而矜之　煖爲泗水王相内史皆下獄\n白也之母　附母子門 禮子上之母死而不喪門人問諸子思曰昔者子之先君子喪出母乎曰然子之不使白也喪之何也子思曰昔者吾先君子無所失道道隆則從而隆道汙則從而汙伋則安能爲伋也妻者是爲白也母不爲伋也妻者是不爲白也母\n不喪出母　見上子上之\n無服　禮爲父後者則不服 母嫁父卒則不服\n安其室　禮爲父後者爲出母無服 注 喪廢祭祀之禮\n慰心凱風　凱風美孝子也 衛之淫風\n母不顧　吳綜疏字公緒母改適爲親客歸會稽其母送之拜辭上車面不顧曰夫人宿疾曰不欲增母思故不顧也"},{"id":"juan6-029","source":"正文","juan":"卷第六","menu":"母子第廿一","sub_menu":"〇母賤子貴　附母門","page":"二四一","leaf":"二十七オ","text":"史記姑布子卿見無恤曰此真將軍也簡子曰此其母賤翟婢也奚道貴哉 　秀年十八有令望而嫡母憎妬令\n承上此兒當爲天之所授\n不聘　傳曰聲伯之母不聘穆姜曰吾不以妾爲姒也"},{"id":"juan6-030","source":"正文","juan":"卷第六","menu":"母子第廿一","sub_menu":"〇後母　附母子門","page":"二四一","leaf":"二十七オ","text":"織屨給子　漢翟方進　　　相有封侯骨　　　　至　事\n迎後母不至　漢何武　母在遺使迎會盜賊留止不至印綬也\n安\n謹之　因夜行圭畢而勤敬事命謹\n元方無几杖　見上\n雙魚躍出　後漢　術子豹年十二後母惡之因夜解雙魚躍出又思黃雀入其中有丹　　令守之風雨抱樹而泣\n不肯隨之官　官表解職又　　杜氏不肯隨之官 羊祜前母孔融女生見發勅與祜同母\n兩存乃專心養發得濟\n誣盜　十年無怨色孝謹不怠\n官舍施靈　兄弟乃使\n蒲蔴紉衣　　　於有司被請議所異意解乃移中改\n後母以蒲蔴與延紵衣　姑問之不言 夏扇席冬以身溫母愛焉求鮮魚不得杖之流血 叩氷而哭忽有一魚長五尺躍出氷母食之\n能去　薛包字孟嘗父娶後母憎包分出之包日夜號泣不能去被打不得已廬於舍外旦夜灑掃父母慙而還之後六年遭喪不發積歲餘\n慈愛　程文矩妻穆姜有二男而前妻長子興遭疾　慈愛撫字益隆衣食皆兼倍所生　善及前妻長子興遭疾\n嚴喪祗\n託疾求和　揚厚字仲桓母與前妻子博不相安厚年九歲思以厚託　和親乃託疾不言不食母知其言　　後改思如篤\n諫母　王祥弟覽字玄通母朱氏遇祥無道覽輒與祥爭之不與朱\n郡守表異其母　　子許以贖改\n母親調藥飲恩情篤密久乃學霸三弟曰\n陳母之德狀己之罪乞就刑黜信於郡\n前妻有四子四子以母非所出憎毀日積而母　所生支埋卒或謂母曰四子不孝何不分\n承上壞乃號祥臨覽知取酒祥亦爭之不與朱意乃止也"},{"id":"juan6-031","source":"正文","juan":"卷第六","menu":"母子第廿一","sub_menu":"〇兄弟","page":"二四二","leaf":"二十七ウ","text":"棣萼　棠棣之華鄂不韡韡 凡今之人莫如兄弟\n行葦　兄弟之行\n陟岡　兄曰嗟予季行役 予弟\n有言兄弟致美\n兄愛弟敬　兄愛而友弟敬 恭友悌不闕\n六順　漢書姜肱兄弟三人皆以孝行著且被鑄所謂六順 兄弟三人皆以孝行著\n連枝同氣　兄弟二人 荀爽兄弟八人時號八龍 蔚時人號曰八慈\n稱悌　鄉黨稱弟\n貴介　左傳曰王子圍寡君之貴介弟也\n有政是以爲政語\n三張二陸\n五常友于　子曰孝乎惟孝友于兄弟施於有政\n勿衣　漢易衣而出併日而食 漢南記李充兄弟六人家貧兩驥\n同於言　於其父母昆弟之言 兄良弟共\n鶺鴒在原急難　兄弟急難 魚曰衛弟\n禮順　長以敬事之則順禮順\n翼善於悌\n弟悅　敬其兄則弟悅\n人兄　敬以悌所以敬天下之爲人兄者也\n骨肉之恩血屬手足之愛　仁兄弟 令\n哲兄　弟季孟之間以睦兄弟 禮 長惠幼順 禮家肥 兄弟睦家旁理 禮曰務理兄弟\n敬長　禮曰敬長爲其近於兄也\n至悌　禮曰立敬自長始以教人順長類兄也 令兄綽綽有裕\n兄必長之語　辛廖\n恩推形影　實兄實弟 書曰乃寡兄勗\n諸兄之言　畏也 亦可兄及弟矣 或相好矣\n匪他　豈伊異人兄弟匪他 具來 具來莫遠 具尔 闕 鹹鹹兄弟恩則友 因心則友 雖此王季 倡\n予和汝　伯兮叔兮和協 不能和協 辭睦 兄未顯故不受公府辟 後漢鍾皓字季明以二\n杜周二子　敬吾一體 漢詔兄弟敬吾一體 令兄北鄉侯\n敬吾一體　詔曰兄弟　同父母也 令兄北鄉侯\n託病不仕　魯恭伶弟平小欲就其名託病不仕\n佯瘖不仕　後漢董恢弟嗣先辟之謝伴瘖不肯仕及鄉尚自坐東鄰爲漢相尊 名高於樊宰\n俱在朝　篤行寵異之詔 禮十日 趙孝碑太尉府闕宗聞　 行官至長樂衛尉府太官送異對義歡欽率\n喪毀　禮卒令孝從官送喪歸也 劉紆早失母　及成人未嘗相離平生　高幼鞠育與同　紆哭泣歐血而死\n白眉　鄉里諺曰馬氏五常白眉最良 人蓋有五 馬良兄弟五\n王祥弟覽　因以爲攜\n難爲兄　陳元方季方共論其父因　白寔曰元方難爲兄\n又非不嘉憎孝難爲兄弟　王珉字季琰少有才藝善名出珣之右 諺曰法護 珉小字\n六龍　諺曰　　六龍 輔世裾下氏六龍第五\n之名　晉何準兄爲驃騎　　　令在仕隼曰盡何緘曩　　兄弟中第五也\n優劣　　戴逵之弟並　　東而遂以武勇顯謝安\n問志業何如達曰下官不\n俱病　王徽之與獻之俱病術人曰廞終而有生人代之則死徵之曰吾才不如弟請代術人曰凡代死者己年有餘今君與弟筭俱盡何可代獻之卒徵之奔喪不哭直上靈床坐取獻之琴彈之久而不調曰子敬人琴俱亡因一慟而絕\n八達　安平王兄弟八達 人時號八達 〇出\n下策　周顗字伯仁友愛過常弟嵩因酒曰兄不如弟橫得競藥 蟠偶投之顗神無忤徐曰阿敦犬攻誠出下策\n累世同居　三世不分則鄉里伏其義 後漢蔡邕與從弟同居 又閨門雍穆云云 桑虞累世同居\n託疾求母　乃爲備得錢帛歸與兄曰物盡可復得爲妻坐贓終見捐弃兄感言遂爲廉絜\n不過從兄飯　　後母\n諫兄　劉磯字世帝　　東帝而後語 連枝同\n五倫伯\n魚曰間如爲吏不遇從兄飯有之學對曰少遵議亂實不敢妄過人餘帝大笑\n氣　無鳴四 鳥之悲\n金友玉昆　諺見三 陟岡之望已深 情逾切 借崇共被之仁 居之愛"},{"id":"juan6-032","source":"正文","juan":"卷第六","menu":"母子第廿一","sub_menu":"〇不睦　弟兄門","page":"二四四","leaf":"二十八ウ","text":"不悌失教　傳段不悌故不言弟 鄭伯 義失教也\n小忿不廢懿親　義乖不恩匪 相 不令爲瘉 不令兄弟交相爲瘉 不能和協\n閔管蔡　兄弟鬩自忿 稱鄭伯 兄弟鬩牆 管蔡之失道\n鄭莊公曰寡人有弟不能和協而使鬩其口於四方　不可以櫌 詩亦有兄弟不 繼尋介焉 傳宋昭公群公子樂豫曰公族公室之枝葉也葛藟猶庇其本根故君不 子以爲比而鑽子介焉必不可用也\n不友　書云兄不友弟不恭 不相能也 曰尋干戈 二子 高辛\n不協　吾兄弟之不協 諸侯之不協 匪人于弟不念天顯大\n長曰關伯曰實沈君子曠林子以相征討\n不克恭厥兄　言爲人弟不念天之明道不能恭事其兄 書 兄亦不念鞠子哀大不友于弟 言人凡\n全篇總按\n一、本影印底本網點粗、墨色濃淡不均，小字雙行夾注多處黏連漫漶，以上錄文於事目（大字）辨識度較高，夾注則多有闕文，已一律以　代之，把握不足者加。\n二、可辨之黑地陰文門類標題計有：賢母　附母子門、惡母、後母　附母子門、遺腹　附母門、母賤子貴　附母門、兄弟、不睦　弟兄門；另二三八葉「〇姓及子」疑爲「子」門標題，字形不清。\n三、原刻以「〇」標識門類或條目起首，錄文中一併保留。\n四、二三七、二三八、二四一、二四二四葉字迹最劣，信心較低。\n念婦子之司東／大不能和友子弟\n不悌之刑　周禮以八刑糺萬人二曰不睦之刑三曰不悌之刑也\n虧恩失信\n蠻夷之訴　晉信蠻夷之訴以絕兄弟之國\n絕兄弟之國\n父　　為屠相攜召昆弟散火攻\n無復入慢之門\n攻弟　　譚欲攻弟尚王脩諫曰兄弟者左右手也譬人將鬬斷其右手曰我必勝子敗亡之道也\n排擯　蜀志許靖與從弟劭俱知名有人倫臧否私情不協\n不協　劭為郡功曹排擯不得齒敍也\n敗五常\n既彰　介之醜　　布之謠\n既虧魯衛之義　楚之失是同齊\n既爽於家\n同無絕其愛\n奴畜　傳謂奴玄田衛青少時自平陽公主家歸其父父使牧羊先母之子皆奴畜之不以為兄弟\n於克順於相容情雖不\n獸心\n異和氏之兄弟則側目生嫌　　身而去　須敦友于之心懷之禮事乎\n友弟　　　同雖有兄弟不如友生\n尺布可縫　漢文從淮南王於蜀嚴道不食而死人謠曰一斗粟尚可舂一尺布尚可縫兄弟二人不相容\n不相容　注見上"},{"id":"juan6-033","source":"正文","juan":"卷第六","menu":"母子第廿一","sub_menu":"〇分財　附兄弟門","page":"二四五","leaf":"二十九オ","text":"推財　漢南記陰慶為朝陽疾其弟貧與丹皆為郎但辭印而已\n讓田　益部傳李子孟元恭順與叔子就同居有痼疾推財貝與弟身無所受所有田園悉以讓就夫婦紡績自給而已\n脫身　史卜式脫身出分取羊百餘口餘田宅財物悉與弟式乃入山牧羊\n去婦　洪南記李充兄弟六人貧無擔石之儲其妻謂充曰我有私財可異居充乃集宗族而起自母曰此婦令兄弟異居吐之出門\n訟田　漢韓延壽為左馮翊行縣至高陵有兄弟訟田延壽曰骨肉相責讓是教化不至乃開閤自思過於是訟者相責讓顧以田相和然死不爭延壽恩信如此無有訟人也\n班諸貧者　禮子柳之母死既葬子碩請以賻布之餘具祭器子柳曰君子不家於喪請班諸兄弟之貧者\n自撾　繆彤字公豫兄弟四人同財及各娶兄弟求分異兄乃掩戶自撾曰彤脩身謹行學聖人法將以齊整風俗奈何不能正家又諸婦聞之叩頭謝過更為敦睦之門\n取肥田　許荊祖父武第五倫舉武乃為孝廉以二弟普晏未顯欲成之乃謂曰禮有別居乃割財為二分自取肥田彊奴婢鄉人皆稱二弟義讓普晏等以得舉武乃會宗族泣曰吾為監贓位二弟未立所以自取大譏今理産所增三倍於前悉推二弟一無所留\n取荒田　薛包好學行弟求分財異居包不能止乃中分其財奴婢取老弱者曰我共事久矣田園取其荒者曰吾少所理意器物取朽損者曰我素所服身口所安\n辭\n是義俱失\n情乖致美\n虧魯衛之義\n相容\n多自與\n短於財　卜商\n均分　君子取分分爭辨\n訟決禮\n躬自厚也\n無求多\n臨財無苟得\n割且分"},{"id":"juan6-034","source":"正文","juan":"卷第六","menu":"母子第廿一","sub_menu":"〇死喪　附兄弟門","page":"二四六","leaf":"二十九ウ","text":"孔懷　詩死喪之威兄弟孔懷／孔子曰兄弟　　子路曰吾寡兄弟而不忍除也\n灑血　陳業兄渡海同死六十人骨肉消爛而不可別業乃割臂流血以灑骨上而後別也\n含膽　徐苗弟之臨殞口中獨　之\n不緦　禮鄰人有兄弟死而不為緦者聞子皋為鄴宰遂為之緦鄰人皆有緦\n兄弟惟予與汝　詩斷手之悲\n同母異父　禮公叔木有同母異父昆弟死問於子游曰其大功乎狄儀有同母異父昆弟死問於子夏子夏曰我未之前聞也魯人則為之齊縗今之齊縗狄儀之問也\n奔喪　禮奔兄弟喪先之墓而後之家為位而哭\n殺　禮兄弟之喪喪內如剡剡言痛也\n內除　除喪隨禮殺也\n存乎書策　策矣言其右常禮也\n輕重\n人琴俱亡　注見上\n哀毀　見上\n棣萼凋零\n形影增悲　人琴增慟\n不離墳墓　後漢馬援\n心喪三年　　伯歲少孤依從兄穀共居兄卒後行服期心喪三年不離墓所也\n同產　穀卒心喪三年"},{"id":"juan6-035","source":"正文","juan":"卷第六","menu":"母子第廿一","sub_menu":"〇用刑　罰親事中／事具刑法","page":"二四七","leaf":"三十オ","text":"鄭伯克段　傳鄭伯克段于鄢段又弟故不言弟稱鄭伯譏失教\n周公殺管　管蔡流言以亂周室周公乃殺管叔而放蔡叔\n無使滋蔓　祭仲諫曰無使滋蔓蔓難圖也蔓草猶不可圖而況君之寵弟乎\n遷蜀嚴道　注見上／漢書兄弟二人不相容\n念於同根　荊雖念於同根　古詩\n草宜除於滋蔓\n文醇才由自作法宜相容　容謨唯南王也\n楊干亂行　傳晉侯弟楊干亂行於曲梁魏絳殺其僕\n晉侯不罪其用鈇　傳晉侯謂絳曰寡人有弟不能教訓使干大命\n鮒也　叔魚也\n南獄　叔魚為理官納雍子之女敍罪邢侯邢侯殺雍子與叔向\n叔向亦明其正刑　曰三人同罪施生戮死可也雍也買直鮒也鬻獄邢侯專殺其罪一也仲尼曰叔向古之遺直也治國制刑不隱於親\n絕愛斷手痛天\n國不支　人匪\n失教　恩雖廢雖\n義除三愛　五常／而教失雖存國禁然爽恩既遺\n於形影　義逐變／非大義之可誅而亘忍小過"},{"id":"juan6-036","source":"正文","juan":"卷第六","menu":"母子第廿一","sub_menu":"〇患難　附兄弟門","page":"二四七","leaf":"三十オ","text":"兄弟爭死　禮融兄襄以\n讓生代死　中衛宣公與伋子白旄告盜曰見白旄殺之壽子與之酒盜殺之伋子至曰我之求也彼何罪\n二子同舟　詩思伋壽也二子爭盜見兄授馬\n見兄授馬　秦錡姚襄戰馬中流矢弟\n患難相死　禮\n詣賊相代　後漢趙孝弟禮為賊所得將食之孝自縛詣賊曰禮不如肥賊感其意而恨其兄弟\n遇赤眉　王琳弟萌梁國車成弟兔又賊所得與趙孝事同又得請代得免死也\n爭死　江翶鄱陽弟　姜肱\n遭逢賊欲殺之肱兄弟爭前死賊遂釋之但奪衣資矣\n急難　兄弟急難\n割雞　附兄弟門\n四鳥之悲　孔子聞婦人哭聲哀又有離別之苦何以知之曰昔恒山有鳥生四子羽翼既成將欲分飛慈親悲鳴而送之\n三荊之嘆　田真兄弟欲分其庭前三荊便枯兄弟歎之卻合樹還榮茂也\n陟岡之望　見上\n在原之恩　岐山"},{"id":"juan6-037","source":"正文","juan":"卷第六","menu":"母子第廿一","sub_menu":"〇義兄弟　附兄弟門／孔子兄事子產","page":"二四八","leaf":"三十ウ","text":"產　史記孔子過鄭兄弟事子產\n張湯趙禹　湯趙為庭尉交歡湯為別部司馬\n立侍終日　蜀志關羽張飛為別部司馬先主與二人寢則同床恩若兄弟稠人廣坐立侍終日\n兄事　母謂權曰公瑾伯符同年小一月耳我視之如子汝可兄事之也"},{"id":"juan6-038","source":"正文","juan":"卷第六","menu":"叔姪第廿三","sub_menu":null,"page":"二四八","leaf":"三十ウ","text":"猶子引進　禮兄弟之子猶子也蓋引而進之也\n廣受之榮　漢疏廣為太子太傅兄子受為少傅朝廷以為榮也\n籍咸之會　晉書阮咸字仲容任達不拘與叔籍為竹林之興諸阮居道北籍咸居道南南阮富而北阮貧\n吐哺　世說郗嘉賓遭永嘉亂窮餒鄉人共食之常攜兄子及外甥人辭不能兼口乃獨坐往輒含飯於兩頰歸吐與二子\n垂誡　馬援有誡兄子嚴書\n杖三十　晉謝安嘗欲誨諭陸納納兄子俶密作食供之納設菜果而已罷納大怒杖三十不能光我叔父\n千里駒　晉書苻朗堅從兄子也堅常曰吾家千里駒\n諸父　詩我有肥羜以速諸父\n癡叔　晉武帝見濟輒曰癡叔死未濟常無以答\n篤猶子之愛　晉書\n顯名　後漢第五倫字伯魚或問倫有私乎曰昔兄子有病一夜十起退而安寢余子有病雖不省視而不眠若是可謂無私乎\n十起　同上\n濟叔　晉書王湛字叔沖兄弟宗族皆以為癡兄子濟共談易剖析精妙大奇之初曰臣叔不癡山濤已下\n霜雪詩\n安常內薄戒而憂下奏曰何\n林下之情　上見\n幼姪早孤恩深伯道　晉書鄧攸字伯道永嘉亂擕其兒及弟子綏度不能兩全乃明妻曰吾兄子早亡唯有一息不可絕應自弃我兒耳妻泣從之\n長兄生汎念功與夷\n與夷　先君舍與夷而立寡人不敢忘先君若問與夷其將何辭以對乃立之\n自捶　後漢淳于恭養孤幼教訓學問有不肯用法及自捶以感之見輒改過\n辭辟命避叔父　後漢劉般有高節以叔父遠仕州郡之命太尉諸公所辟並\n推與伯父　後漢張禹字伯達推田宅與伯父身自窮上\n分封　蜀志云王基封安樂鄉侯上疏求分封二百戶賜叔父子喬爵關內侯以報叔父詔特\n詣賊　張範字公儀子陵及弟子戩為山賊所執範詣賊請以身贖之賊還範子\n叔母勸　晉書皇甫謐字士安年二十不好學游蕩無度叔母任氏\n芝蘭玉樹　謝玄與從兄朗為叔父安所器因戒曰子弟何預人事而正欲使其佳謝玄答曰譬如芝蘭玉樹欲使生於階庭耳\n伯兮叔兮　詩諸父兄弟\n千里駒　魏曹休字文烈太祖曰吾家千里駒\n子活姪　晉孔嚴字彭祖為吳興太守時餘杭婦人經年荒賣其子以活夫之兄子又武康有兄弟妻各在孕弟遠行未返遇歲荒不能兩全弃其子而活兄之子"},{"id":"juan6-039","source":"正文","juan":"卷第六","menu":"叔姪第廿三","sub_menu":"〇姪女　附叔姪門","page":"二四九","leaf":"三十一オ","text":"兄之子　子謂南容邦有道不廢邦無道免於刑戮以其兄之子妻之\n籠器之訓　晉書庾袞亡兄子　芳欲嫁襄服闋將乃剖荊為筐箸命\n伯叔母之喪踊不絕地如此若由文矣哉　無服也\n柳絮之詩　晉書王凝之妻謝氏道韞叔安常問毛詩何句最嘉道韞曰吉甫\n俄而雪下安曰何所似道韞曰未若柳絮因風起安大悅重之\n南宮　禮南宮絰之妻之姑之喪夫子誨之髽曰爾無縱縱爾無扈扈爾蓋榛以為笄長尺而總八寸\n弃其子而活亡弟孤女　夏侯淵字妙才時大亂飢乏遺弃其幼子而活亡弟孤女\n遺腹姪　後漢劉平一歲平起仲女而弃其子\n求喬嗣　蜀志諸葛喬字伯松亮兄瑾第二子也亮無子求喬以為嗣\n繼宗\n從父　宋書謝孔徹本名密年\n長還本生　晉皇甫謐字士安漢太尉嵩之曹孫也出居新安謐年四十叔父有子始還本生\n十歲出繼從叔父"},{"id":"juan6-040","source":"正文","juan":"卷第六","menu":"甥舅第廿四","sub_menu":null,"page":"二五〇","leaf":"三十一ウ","text":"諸舅　詩曰既有肥羜以速諸舅\n我甥　詩曰晨我甥渭陽念母也秦公送晉文公于渭陽曰我送舅氏曰至于渭陽念母也\n明珠　氏如舅存焉何以贈之路車乘黃\n白水之誓　晉文公謂子犯曰所不與舅氏同心有如白水投其璧于河\n舅出武子　王武子衛玠之舅出武子語人曰　舅甥坐炯然若明珠之在我側\n宋鄭甥舅　傳曰宋鄭甥舅也\n我之自出　甥也謂我\n皓似其舅　禮曰睦於父母之黨舅甥可謂孝矣嘗黨親也\n吐哺　見叔姪門\n屬從　禮屬從者所從雖沒也服母黨\n伊異人　兄弟甥舅伯舅叔舅少曰叔舅長曰伯舅\n元舅　文武是憲\n宅相　晉魏舒字元陽少孤為外家寧氏所養寧氏起宅相者曰當出貴甥外家以為魏氏成此一宅\n賞愛　晉　皓被廢從東陽康伯皓賞愛之\n乞墅　謝安與張玄賭墅曰以墅乞\n改葬\n不覺至州門　左右曰此正焉有此甥\n輕舅　綢於公壓戲調其舅泰湛湛不塡曰汝謂世無湘陽清綢父重卿王胡\n食肉　國語晉公子重耳以戈逐其舅子犯曰若吾無濟吾食舅氏之肉\n不討賊　漢郭解姊子與人酒人不堪怒殺\n魏舒少孤　養在寧氏長於寧氏\n周覽無託　郊家"},{"id":"juan6-041","source":"正文","juan":"卷第六","menu":"內外兄弟第二十五","sub_menu":null,"page":"二五一","leaf":"三十二オ","text":"合謀　魏志楊阜興外　以報姜敍合謀攻馬超大敗之\n不餞送　城陽太守梁柳物皇甫謐從姑子送迎不出門食不過鹽菜貧不以酒\n令鼓琴　晉陸瞻字千里\n讓封舅子　羊祐讓封舅子\n朗陵公　文選詩序曰朗陵公何　祖余之從外兄也"},{"id":"juan6-042","source":"正文","juan":"卷第六","menu":"嫂叔第二十六","sub_menu":null,"page":"二五一","leaf":"三十二オ","text":"不通問　禮嫂叔不通問也\n無服推遠　禮嫂叔之無服也蓋推而遠之\n不撫　禮嫂不撫叔叔不撫嫂\n不為位　禮子\n為別　世說阮籍嫂常還家籍見之與別或譏之籍曰禮豈為我設耶\n溺援　孟子曰嫂溺援之以手\n恭　史記蘇秦兄嫂弟妻不下機嫂不為炊及為漆桓謝曰見季子應門六國相印歸昆弟嫂委蛇蒲服以面掩地而謝曰見季子位高金多也\n不長者　漢高祖時嘗與賓客過巨嫂食嫂厭叔與客來陽為羹盡櫟釜賓客以故去已而視釜中尚有羹高祖由是怨其嫂及封為侯不封其子\n不冠　後漢馬援寧見兄弟嫂不冠不入廬\n爭田　漢書高鳳為太守所召恐不得免乃詐與寡嫂爭田\n不如無嫂　陳平兄伯常耕田不仕產人或問平何食而肥嫂曰食糠覈耳有叔不守無伯聞之逐其婦而弃之\n新婦　魏志曰王經字彥緯年十四諫郭邠慈謂曰昔大人臨終以小得慕新婦不以新歸為小事因發衣婢妹之譬　　而去\n解圍　晉王凝之妻謝氏道韞獻之與客談議詞理將屈道韞遣婢白獻之曰欲與小郎解圍乃施青綾步障自蔽論獻之前議客不能屈也\n青囊　晉書顏含次嫂樊氏失明醫須蚺蛇膽童子持一青囊授含開視乃蚺蛇膽出戶化為青鳥飛去嫂疾便愈也\n養嫂　東方朔上書曰臣朔少失父母長養兄嫂又曰得八百戶長將老嫂入官舍斯碩足矣\n後漢第五訪字子謀少孤貧備耕以養親\n殉葬　晉書顏含字道文儲師事　荀氏立為皇后苻氏之殉葬\n白團扇歌　樂志云白團扇歌者晉中書令王珉\n可謂之母　禮謂弟之妻婦者是嫂亦可謂之母乎\n家嫂　晉謝朗早卒總角新起　白團扇歌以贈眠\n妯娌　　　有情其婢謂曰\n今與沙門支遁講論相苦　王氏再遣令還安欲令竟論王氏因云新婦　未嫡幼叔父安言\n盜嫂　漢書人言直不疑善盜嫂不疑曰我無兄嫂終不自明也／陳平盜嫂　漢書人言"},{"id":"juan6-043","source":"正文","juan":"卷第六","menu":"姑第二十七","sub_menu":null,"page":"二五二","leaf":"三十二ウ","text":"諸姑　詩曰問我諸姑遂及伯姊\n從姑姪　傳\n伯姑\n受我而厚　禮姑姊妹之薄也蓋有受我而厚之者\n絕地　禮曰姑姊妹之大功踊絕於地如姑姊　降服恩重也"},{"id":"juan6-044","source":"正文","juan":"卷第六","menu":"姊妹第二十八","sub_menu":null,"page":"二五二","leaf":"三十二ウ","text":"伯姊　見上\n歸妹　妹婿女弟也\n月為姊　王者姊　月也\n姊親　傳君子曰禮謂其姊親而先姑則姊鄰令其姊往\n留錢　風俗通太原郡　子廉飢不可得食寒不可得衣一分及一芥不軍諸人過姊留飯密留五十錢茶席下而去\n血屬　見之婢暮而後至閉門因踰郭而入梁章則同氣派胞血屬齒骨肉之愛從兄　則其足趙成侯以為不慈　而免之\n東宮之妺　詩碩人美莊姜也\n內宗貴　禮有司徹曰主人洗獻內賓姑姊妹\n從妹　傳　如從父兄嫁從夫也\n一、本卷此段所見門類標題（黑地陰文）四處：叔姪（葉三十ウ）、甥舅（葉三十一ウ）、內外兄弟（葉三十二オ）、嫂叔（葉三十二オ末）、姑（葉三十二ウ）、姊妹（葉三十二ウ）。門次數字漫漶，「叔姪第廿三」「甥舅第廿四」「內外兄弟第二十五」「嫂叔第二十六」四處數字均存疑，「姑第二十七」「姊妹第二十八」較可辨。\n二、影印本每葉外白邊之現代頁眉（「白氏六帖事類集　帖三　　〇〇オ／ウ　卷第六」）及阿拉伯／漢數字頁碼，均非正文，未錄。\n三、事目與夾注之界線，凡雙行小字起訖不明者，一併括入夾注；文句類事目　如「既虧魯衛之義」「情乖致美」之屬多無注，或注僅一二字不可辨，以　　　示之。\n四、葉二十九オ右半　PDF 255a、葉三十二オ右半　PDF 261a二處紙面斜置且墨色漫漶，錄文可信度最低。\n承前葉夾注　　　　德有從妹在公宮無寵使閉公\n收育從妹　漢盧芳遭王莽亂吳從父弟年在孩乳其母不能活之棄於溝中哀而收養遂至成人\n惡姊夫　　德信嘗過姊婢為殺　　雖妝黍沐不留鍼\n留鍼　以姊夫不德留鍼二百\n賢姊妹　開姊妹門　　　曰女\n義列　見上列婦門 史記　朝政姊事\n與粟　吳志駱統字公緒　年八歳時飢　　多有困者統為　　飲食飼之其　　甚哀曰　不生我而乃自告以私粟與統\n教弟　達\n磨笄自殺　趙襄子誘殺代王王夫人磨笄自殺\n託　　　義子　誘殺代王王夫人磨笄自殺\n弟於人　執義於先公今委君以六尺之孤　李之　　在君矣成　將變東王得全\n姊喪　　妹門\n尚右　禮孔子與門人立拱而尚右二三子亦皆尚右孔子曰二三子之嗜學也我則有姊之喪故也二三子亦皆尚左\n承上「尚右」條同注　　之喪可以除而不除孔子問之曰何不除也子路曰吾寡兄弟而不忍也孔子曰先王制禮過之者俯而就之不及者跂而及之　　也遂除之\n不嫁　東觀漢記寡姊字伯平為山陽太守　　中欲嫁寡姊姊不嫁乃引鑱自剄\n引刃　早已桓氏引刃自剄目以不供 烈女傳桓氏林姊妹夫劉敬仲事\n寡姊\n不諧矣　公孫戎奴 後漢宋弘為太尉時帝姊湖陽公主新寡帝與共論群臣以微觀其意主曰宋公威容器度臣莫及帝曰試圖之主坐於屏風後帝問曰貴易妻人情乎弘曰臣　　　　不諧矣\n老姊求名　蜀志郭之遷雍州刺史中有寡姊鄉下僮僕多有奸犯而殺人者吏執之弃曰大丈夫豈以老姊求名遂西不歸\n嫁姊妹\n歸妹　嫁曰歸 婦人謂嫁曰歸\n東郭僓之妹　傳齊棠公之妻東郭僓之妹也見棠姜美使僓要之　僓曰同宗也君出自桓我出自丁又　　臺之不吉曰蘩婦也阿　廟夫當之矣\n徐吾犯之妹　見上 夫門注 擇得臣之妹 　蕭莊棠宮\n承前　　猶臣之妹\n外妹　左傳聲伯　　管于奚　　妻之女於施孝叔　　施氏婦以與之 外妹謂同母異父　妹\n維私　爾雅云姊妹之夫為私 詩曰譚公維私 舅甥皆為私\n姊妹婿\n鍾瑾妻李膺姊　膺祖僑言鍾瑾好學慕　親我家以膺　妻之\n絕穀\n申祥之哭　言思祥妻之昆弟也\n道原之睦　潘岳誄曰潘楊之睦有自來矣道原岳"},{"id":"juan6-045","source":"正文","juan":"卷第六","menu":"孫姪第二十九","sub_menu":null,"page":"二五四","leaf":"三十三ウ","text":"孝孫　祭儀孝子　孝孫也\n順孫　史記學為順孫\n孫謀　詩曰貽厥孫謀以燕翼子\n抱孫　禮抱孫不抱子此言　　 擇可以為王父尸\n必復　子孫必復其始也\n舍孫　公儀仲子舍其孫而立其庶子檀弓免焉子服伯子曰昔者文王舍伯邑考而立武王微子舍其孫腯而立衍也仲子亦猶行古之道也孔子曰否立孫 子聞禮立孫\n續乃祖\n服　服行事也\n爾祖　爾祖母念也\n王父　禮曰逮事王父母則諱 王父母謂之祖父母也\n禾祖　承辱 禮名孫凡父在孫\n比穀　謂祖以上 襲服 下治 禮上治祖禰尊尊也下治子孫親親也 自我率祖\n名孫　之謂生子見　　祖名曰輕自義率祖廟而下之至于禰名曰重一輕一重其哀孫\n銘　禮銘者稱揚先祖之美 用思則父母重祖輕用義則祖重父母輕也\n螽斯之戚　螽斯羽詵詵兮 宜爾子孫振振兮\n宜必興吾門　陳蹇　　見時祖\n與硯　晉喬字伯錄年二歳時祖殺會稽喬曰首曰所恨不得受賜官\n靈運　謝玄子　風不惠早卒惋子靈運才　　 玄曰我尚生煥煥那得生　 之後率年廉假曰先人所賜不敢改也\n委蛻　列子曰子孫非汝有 是天地之委蛻也\n本枝　詩文王子孫本枝百世\n不為子孫留財産　列子楊朱 叔子貢\n承前　也蓋先貧累千金年六十弄家寵庫一年金一不為子孫留財産之\n國及病無藥石之儲死無棺埋之所受施者相與及子孫之財也\n里樂飲子孫因鄉里長者　及身在時為子孫致業廣拜畫象　吳志曹休文列曾母\n曰吳於太守舍見壁上祖父畫象恭敬非急乃下韜跪坐嘉之也\n假託　　賈謝字文和道　氏羌同行歳十八皆　　除也汝別埋我我家\n祖母老辭官　晉李密字令伯疏為太子洗馬 祖母劉氏年老無人侍養乃\n祖母思弃殷　劉\n字子孫　虞　不夏于公子孫何以不為九州　字謝曰外御\n上表陳情\n謝辭官　假而得於氏羌氏羌累四土散害也\n祖母王氏歳冬思弃而承言歳知之時年九歳乃於書生乃壽也"},{"id":"juan6-046","source":"正文","juan":"卷第六","menu":"女第三十","sub_menu":null,"page":"二五五","leaf":"三十四オ","text":"賢女\n淑女　女子\n處女\n室如玉　如玉\n懷春　有女懷春\n聞琴　蔡琰字文姬 六歳曰第二絃絕　曰偶中　夜曰長季亂\n知其亡之國師曜大律識\n愛國厄　魯曰非也子　　　室曰　之女\n詠雪　見庭 女門 世說\n贖父罪　罪當刑然男有女五人 史記太倉令淳于公有女五人　　緹縈上書曰妾父為吏齊中皆稱其廉平今坐法當刑妾傷夫死者不可復生刑者不可復屬雖欲改過自新其道莫由願沒入為官婢以贖父刑罪\n知肉味　什男　　　而愛之\n晚嫁　吳志陳文王之事 傳可以歸寧父母\n笄年　禮女子二十有五\n嫁從人　　人謂\n年七歳男年九歳寄　舍主人有遺肉　　安王封序曰后妃　　三百步入魯君　寡君父子婦其唇歸人\n說襁　禮夫子生說襁於般 舉絲敦　禮 支子生麻言 十年不出\n歸寧　女門 布悅與巾也 詩歸寧父母 傳曰祀伯　婦掌問父母安不\n女中王　漢文帝郭皇后少而父奇之曰此乃吾女中王遂以女王\n愛女　張為病 帝臨問因言臣四男一女愛女甚於男 遂養蓁太守\n喜言　觀之　用筆為學富作女廉士 郡后曰古者賢女去　不聞人謂之\n供賓客　見　甚美因求為妻見不許秀之\n邦之媛也　美矣\n形管有煒　女美"},{"id":"juan6-047","source":"正文","juan":"卷第六","menu":"婿第三十一","sub_menu":null,"page":"二五六","leaf":"三十四ウ","text":"玉潤　晉樂廣字彥輔人謂之水鏡衛玠字叔寶 玉鏡 玉臺 諡溫嶠字太真 劉氏其　姑\n玉鏡　　曰佳婿難得但如　　如何敢希汝比顧曰白吾恐是妻　　　卜\n愛婿　　臺一枚甚大悅既嫁女禮並二手披髮無宦大笑曰吾固疑是姜蘇所卜\n佳子壻　文人行之\n以子妻之　于謂公冶長可妻也雖在縲絏　　以其子妻之\n嫁子　子女也 從\n服　禮從服者有從重而輕 夫為妻之父母也\n親受　禮壻擯謙讓而承子壻\n甘公之遇　禮壻親見於舅姑承子以授壻\n承子壻　禮壻親見於舅姑承子以授壻\n太守之器　魏志公孫瓚字伯珪為郡門下書佐 　侯太守器之以女妻之 又 張華字茂先少\n伯達　後漢陶謙字恭祖同縣甘公出遇之見其容貌與語甚悅因許嫁女夫\n鄉人劉敦　吳志呂子衡少為縣吏有姿容邑人劉氏家富女美範求\n妻以孫女　漢陳平貧以席為門 富人張負見其門多長者\n再嫁　漢張耳亡命游外黃 外黃富人女甚美庸\n出贅　禮義弃仁恩弃\n絕婚　魏杰秦衛公路為子索呂仲女怒術女已在途進選絕婚\n友婿　嚴助待宴士問所欲\n搨婦翁　後漢帝與諸昆五倫曰之三婆婆皆云無父 對曰臣之三婆\n會搨婦翁　從見於許有諸對曰臣之三婆婆皆云無父\n吾兒誤我　魏略太祖以丁儀令士未見欲妻之問五官將五官將曰　　亦當與安說但眇吾兒誤我\n禁臠　晉武為晉陵公王求婿謂王珣曰　　長不誡子敬本幾帝崩秦崧然以女妻之謂之禁臠\n林坦腹　　氏諸子並佳咸自矜持唯一人東床坦腹食若不聞訪聞乃羲之遂妻孫壻\n以妾為奴　傳婢僧伯之母不聘穆姜曰吾不以賤下璞不"},{"id":"juan6-048","source":"正文","juan":"卷第六","menu":"婦第三十二","sub_menu":null,"page":"二五七","leaf":"三十五オ","text":"奴婦　婢婦 婦謂長婦為奴婦不\n鍾郝之禮法　晉王渾妻鍾氏字琰弟妻郝氏甘有德行　琰"},{"id":"juan6-049","source":"正文","juan":"卷第六","menu":"子婦第三十三","sub_menu":null,"page":"二五七","leaf":"三十五オ","text":"特豚　禮曰婦以特豚 縣饋明婦順\n為婦一歳\n雙鯉　詩士游世好生魚及江水其妻取水不及時詩乃有妻寄鄰舍常作躍雙鯉以供母膳\n執婦道　禮婦四德 婦德婦言婦功婦順\n四德\n廟見　家\n姑慈婦順　禮傳曰姑慈而從之\n宜家　宜家室家 禮曰婦事舅姑如\n雞鳴盥漱　事文母雞鳴盥漱\n授室　禮舅姑降自西階授之室也\n盥\n婉娩聽從　容顏 言語 東觀漢記鄧永妻曾於蘭雍之德 恭承\n叱狗　　前叱狗永即去之\n父戒母戒　穀粱曰送女父不下堂母不出祭門父戒之曰謹慎從爾舅之言母戒之曰謹慎從爾舅姑之\n廟舅姑\n舅姑和敬\n夫婦　之家三日不學\n成婦之義　禮三月而廟見稱來婦也擇之\n取婦　縶思謂親也\n內和　禮曰婦順備而后內和理然後家可長久也\n婦人膜姑喪　南宮縚妻蕘之姑喪夫子誨其髮\n親饋　既家\n私貨　子婦無私貨無私蓄無私器不敢私假不敢私與\n藏以待之　禮婦或賜之飲食衣服布帛佩　則受而獻諸舅姑舅姑受之則喜如新受賜若反賜之則辭不得命姑更受賜乃受之如更賜之謂婦之兄弟待舅姑之　以進之　禮曰以此防人婦繪有\n姑之婦本於孝　家竊 女既醮家授室"},{"id":"juan6-050","source":"正文","juan":"卷第六","menu":"事舅姑第三十四","sub_menu":null,"page":"二五八","leaf":"三十五ウ","text":"婉容　禮不至 禮曰以此防人婦繪有\n如事父母　姑如事婦父母\n初鳴咸盥漱櫛　縰笄總 拂髦冠緌纓 端韠紳 搢笏\n笄總　飾首\n衣紳　紳帶 左佩紛帨　　 右佩箴管線纊施縏袠\n左佩紛帨　悅拭巾也\n右佩箴管線纊施縏袠\n以適父母舅姑之所\n不傳　之衣\n奉大觶木燧　備尊者之所用\n衿纓　衿結也 衿其聯反\n慕屨　抵敬之 勿敢逰\n佐饋　凡朝夕食子婦佐饋\n下氣怡聲問衣燠寒疾痛苛癢而敬抑搔之　之禮也\n應唯敬對　在舅姑之所有命 應唯敬對也 進\n進退周旋慎齊升降出入揖游不敢噦噫嚏咳欠伸跛倚睇視不敢\n唾洟寒不敢襲癢不敢搔勿逷勿怠　姑之命勿逷勿怠\n服而待　若飲食之雖不嗜必嘗而待 加之衣服雖不欲必服而待\n是吾事我　子不宜其妻毋曰善事我子行夫婦之道沒身敬之不衰也\n沒而姑老　於子婦必請於姑 家婦所祭祀賓客每事必請於舅姑不敢專擅也\n必請於姑　婦將　行事大小必請\n室　凡婦不命適私室不大小必請 請於　舅姑也\n勿庸疾怨　子婦未孝未敬勿庸疾怨 姑教之若不可\n先舅先姑　沒則曰先舅先姑\n不幸　子百歳曰嫁不及 舅世謂之不幸 以温\n疾怨　子婦未孝未敬勿庸疾怨\n素禮　出猶為之隱素禮謂不明其過犯也"},{"id":"juan6-051","source":"正文","juan":"卷第六","menu":"出婦第三十五","sub_menu":null,"page":"二五九","leaf":"三十六オ","text":"甚且不悅　禮曰子甚宜其妻　　出之 婦當喪而出則除之 當姑舅為父母喪而出則三年既\n承前父母不悅則出之\n以為婦盜逐之當有里婦　請　　姑慈遙其婦還\n後子禮又嫁為父母若出者卻服三年\n六親不和有孝慈　老子曰六親不和有孝慈\n親既睦　和同\n九族　以親九族 九族既睦\n五愛　惟親立敬惟長\n惟立愛　仁貴\n遠開親　六\n血屬周親\n棣華之詩　　刺\n不睦之刑　周禮\n德惟睦近　遺親 仁不厚　骨肉之恩之\n內睦外僩　傅周之有懿德　　　親之也\n水運　美詩慥好江水東當取之\n不宜其妻　見上 東　姑既守　夜亡其肉"},{"id":"juan6-052","source":"正文","juan":"卷第六","menu":"親屬第三十六","sub_menu":null,"page":"二五九","leaf":"三十六オ","text":"敦敘協睦\n親親之殺長長\n枝葉先落　本根義\n將離宗族　無親\n劇民二曰不獨親其親　大道 各親其親 大道 旁殺以親疏為殺也\n從服　禮曰從服謂夫謂妻之黨也 父母妻為　之當也\n見親疏之殺焉　禮 三族失其和 協比其鄰 孔云\n瑣瑣姻婭　頊頊細小兒 兩壻相謂為婭\n搶義　以恩掩義 禮門內之理\n無絕其愛　情雖不同無絕其愛親之道也\n親叛　傳鄭公子比族盡\n分親庶　人子高各有分親皆有等\n展親　春秋書時用　展親\n弃親用　宋昭公欲去羣公子樂豫曰公族公室之枝葉也不可\n眾叛親離　州吁社不親宗族\n從介　室之枝葉也\n稱孝　宗族稱孝\n五宗　傳曰晉吾宗也\n父黨　禮曰父黨為宗族也"},{"id":"juan6-053","source":"正文","juan":"卷第六","menu":"宗族第三十七","sub_menu":null,"page":"二六〇","leaf":"三十六ウ","text":"不親宗　族附\n合族糾宗　族緩 族附\n本枝百世　宗族既睦無頗雖親疏本恩有毅\n親疏本恩　有毅 禮謂堯親疏後林社上見\n無繼介於昔\n宗族不親本根無庇　傳枝葉猶不先落根本從而亡也\n親屬圯竭矣　史記世紀 禮四世\n散金　史記蘇秦既散金宗族 散財字無忌散\n小忿　雖有小忿不廢懿親\n道乖綏族　義賞篤親\n宗人族子宗易於下　禮曰庶別姓於上戚單於下婚姻可以通乎 子曰繫之以姓而弗別\n戚單於下婚姻不通　禮四世而緦服之窮也 五世祖免殺同姓也 六世親屬將竭矣 婚姻不通周道狹也 言雖親盡而緦不通婚姻也 謂宗籍世　軍言親盡漸疎\n父母之黨　禮睦於父母之黨可謂孝矣 之黨可謂孝\n敦敘\n九親以飲食之禮　以周禮大宗伯以飲食之禮親宗族兄弟 汪人君有食宗族之禮 見弟\n族食世降一等　太傅曰饗之以姓而不別\n────────────────────────────\n總按\n一、本部分十六幅書影墨色濃重、小字雙行夾注多處漫漶，影本解析度有限。大字事目辨識度較高，小字夾注僅能錄其可辨部分，餘以　代替；辨出而無把握者於字後加 。\n二、辨出之陰文門類標題依序為：孫姪第二十九　葉三十三ウ、女第三十　葉三十四オ、婿第三十一　葉三十四ウ、　婦第三十二　葉三十五オ、子婦第三十三　葉三十五オ、事舅姑第三十四　葉三十五ウ、出婦第三十五　葉三十六オ、親屬第三十六　葉三十六オ、宗族第三十七　葉三十六ウ。葉三十三オ、ウ承前葉「姊妹」門，其中「嫁姊妹」「姊妹婿」二處疑亦為陰文子目。\n三、每葉「　左半接續」一行係為便於對照原書右半／左半書影而設，非原刻分行。\n承前葉夾注　　之以食而不殊　族之相爲也宜弔不弔\n三族不虞　儀禮士虞禮註曰雖是三族之不相爲也宜弔不弔宜免不免有司罰之　虞注三族父昆弟己昆弟子昆弟\n至于賵賻　承唅皆有正焉　謂宗族之相爲賻\n無主婦　諸婦不可　無姙也\n合族　族君子因睦以合族合之也\n元宗　元宗身安能元宗　子木叔曰吾不能\n宗子雖七十　老而納正室　見婚姻門注\n尊宗尊嫡　諸侯則　尊於諸侯君尊於諸侯則老而納正室\n宗子　禮過于廟于祗事宗子不敢以富貴加於宗子入宗子之門宗子正宗敬宗者也\n族類　　　非我族類其心必異\n聚族保族　其家宗蓋展親　分寶玉于叔伯之國明庸展親\n棄親用羈　周書曰\n縱介　見上\n眾叛親離　　州"},{"id":"juan6-054","source":"正文","juan":"卷第六","menu":"奴婢第三十八","sub_menu":null,"page":"二六一","leaf":"三十七オ","text":"臧獲　風俗通古制無奴婢即今之罪人也　　事者也臧者被臧罪犯罪沒入爲官奴婢者也　獲得寇沒奴婢者也\n丹書　傳裴豹隸也著於丹書欒氏之力臣曰督戎我殺督戎請無死曰所　　遂殺督戎　匿豹犯罪沒入官奴以丹書其罪\n家僮　僮僕也\n應門　本令僮客曰內無應門五尺之僮\n鉗徒　見上\n蒼頭　後漢書寵蒼頭子密等三人殺寵\n略賣　略賣爲人得\n封侯相僑　　侯青與諸奴居有一鉗徒相君曰後相貴封侯\n買奴得翁　風俗通龐儉少失父不知所在後穿井得錢行賈以奴婢　翁求家舊蒼頭乃父也時人語曰穿井得錢買奴得翁\n遺陸賈　史記陸賈之刀劍是也乃遺\n賜霍光　漢宣帝詔大將軍霍光賞奴婢七十人\n同席　史記任安爲衛將軍舍人與　平陽主家人奴同席而食乃拔刀而斷席別坐也\n八百僮　卓氏富家八百人\n入于罪隸　周禮凡奴男子入于罪隸女子入于舂藁注云謂今之奴婢古之罪人也\n不爲奴　又曰兄有爵者與七十者與未齔者皆不爲奴也　注奴僕僮青衣\n爲之奴　尚書曰其子有爵者謂命士已上亂\n囚奴正士\n奴虜　齊俗賤奴虜而力闘愛貴之\n黠奴　桀黠奴人之所患唯力闘收取使之逐漁鹽商賈之利終得其力起富數千萬也\n殺奴僮田　陽爲鑄其奴從少年之選欲得殺其奴　注古者殺奴婢皆告官如不告者罪之\n限數　哀詔諸侯王曰下及豪富人多畜奴婢也　司隸奏諸侯王奴婢二百人列侯公主百人　關內侯吏人四十人年六十巳上七十巳下不在此數犯者以律論過則沒官\n指千　漢僮手指千　此千乘之家\n奴誤殺子則逃而舍　宋書\n賣良人　嶺南\n賢行奴　李善字次孫\n私屬　今改奴婢曰私屬皆不得買賣也　王莽曰奴婢之市與牛馬同闌\n之隋室\n左半接\n氏奴　初拜王而堅在竇憲莫府相與于洛陽令种兢卑躬吏呵之奴　崇奴醉罵蒼頭黃門大怒時畏憲不敢發及憲敗賓客皆連坐捶搒\n有士風　華龔嘗爲石崇蒼頭　崇性廉直有士風\n禁殺　光武詔天地之性人爲貴殺奴婢者不得減其罪\n炙灼　光武詔敢炙灼奴婢論如律免所炙灼者爲庶人\n射傷人　光武又除奴婢射傷人弃市律\n長命奴　世說云并州刺史畢軌送故漢渡遼將軍\n知文章　餘惛字子方回有蒼頭知文章王羲之曰小人爾何得比鄰公歟\n顧辱　執顧辱之事\n先瘞　光武詔使人養飢亂爲奴婢欲恣聽之欲尚制以掠人論也\n家僕　史記與家僕葡也\n之使　謂無人使也\n恣頑　傳左恣嫉于頑\n庸奴其夫封不\n承前義侯　後漢詔詞彭寵蒼頭子密殺寵朝　其以奴殺主不義復不可不封乃封爲不義侯\n平頭奴子提履箱　古詩　　婢　詩\n臧獲　見上\n奚人　周禮奚三百人　注云今官婢也\n官婢　史記太倉令淳于公有刑少女緹縈上書願沒官爲婢贖父罪\n女奴青衣　詩　婢\n遺陸賈賜霍光　見上\n汙朝衣　婢奉盤汙朝衣　東觀漢記劉寬簡略夫人欲試寬使婢進之婢翻汙朝衣婢逢敢之寬徐曰羹爛汝手\n覆主母酒　列女傳注主父妻淫於鄉主父還爲毒酒使媵婢進之婢欲言恐殺婢婢欲不言恐害主母因僵覆酒主父怒笞之妻恐婢言欲殺婢婢後言主父弟\n爛手　注見上\n微賤　觀下食眾寶皆起拜之母曰微賤汝此適爲此見必貴　非秀母也秀年十八有令望而婢母猶爲秀母\n泥中之怨　劉慶義貌曰鄭玄家奴婢皆讀書嘗怒一婢將撻之婢白刃主泥中一婢問曰胡爲乎泥中\n代死　列女傳曰羅主孝小者羅氏之女也遭賊欲殺素欲犯之臨以白刃主貴婢名　　薄言往愬逢彼之怒\n左半接\n乃生無恤\n終因作嫡　主貴父失賢　苟古今之可徵而例害\n侍婢殺　漢大司空扶平侯王崇就國歲餘爲侍婢所殺也　注今素尚死何以生爲父殺之\n限數　見上\n見奴逃而\n認孫守藏　後漢梁冀認孫奮母爲其守藏婢云盜白珠紫金以叛去　守藏婢一人皆能爲書　靈光殿賦\n異騎　晉咸　　有客有情婢從奴　去時方　家婢既及\n綠珠　石崇有妓曰綠珠美而艷善吹笛孫秀使人求之崇盡出其婢妾數十人以示之秀曰吾受命指索綠珠崇曰綠珠吾愛不可得也\n奴價倍　與婢累騎而遠客非之\n團扇歌　樂志團扇歌者晉中書令王珉與嫂婢有情愛其名桃葉珉好執白團扇故制此歌也\n誦賦　蜀志劉琰侍婢誦讀書籍　樂又愛讀書\n私屬　見上"},{"id":"juan6-055","source":"正文","juan":"卷第六","menu":"奴婢第三十八","sub_menu":"（續）","page":"二六三","leaf":"三十八オ","text":"婢價　　訥字士言　　常曰以墨　　北平將軍王敦聞之遣其一婢爲\n合之　其無陪臺至\n作法買\n婢　　　僕愛主人婢無中得乃取小豆三斗饒主人舍飲之主人展或見赤衣人數千圍其家就視即滅主人詰還僕曰吾家不宜富此婢曰於東南二十里賣之勿與賤妖可以威\n周禮　女酒女漿其醯女醢女冪女　　巳下皆載其事在者從坐\n女祝　是奴婢　　女史\n女　二\n九藥　喪居喪使婢九藥\n隨旦　官言胡馮鯤　　侍女三戒服自贖也\n僕臣臺　傳曰\n得僮僕貞　易\n廝輿之卒　漢書淮南王書廝輿之卒有一不備而歸咎廝所廝"},{"id":"juan6-056","source":"正文","juan":"卷第六","menu":"僕隸第三十九","sub_menu":null,"page":"二六四","leaf":"三十八ウ","text":"僕債　傳申鮮虞僕債於野以\n我僕痛矣　詩\n賤隸僕使"},{"id":"juan6-057","source":"正文","juan":"卷第六","menu":"乳母第四十","sub_menu":null,"page":"二六四","leaf":"三十八ウ","text":"慈母　昔者魯昭公少喪其母有慈母良民及其死也欲喪之有司以聞曰古者慈母無服今若爲之服是逆古典公不忍爲之　練冠自昭公始也\n徙邊　漢武帝少時東武乳母當　有子孫奴婢橫暴不忍致法有司請徙於邊　邪舍人謂乳母曰人辭去勿疾行數迴顧乳母\n顧乳母　如其言舍人叱曰何不疾行陛下已壯矣豈須汝乳語乃不念乳母　　　漢武帝詔令乘車馳道乳母\n君命所使教子也　禮外有師傅內有慈母君命所使教子何服之有\n令取金環　李氏東垣咸時令乳母取所弄公子與乳母俱亡秦王義之　　秦破親留朱諸公子乳母與公子俱亡\n莊以卿禮　列女傳曰魏節乳母者親公子乳母也　秦軍追見爭射之乳母身蔽公子　　　葬以卿禮\n食我之恩　推燥就濕\n孩幼　門\n實覃實訏　厥聲載路　誕實匍匐克岐克嶷以就口食\n岐克嶷以就口食　　也　嶷識人歧知人意\n五月能言　莊子老聃曰　之治天下使民　　民孕婦十月生子子\n承前五月能言　注孩人之遠不至乎孩幼而始別人之意未該而已擇人言競數之速殿矣\n嬰兒　老子云嬰兒之未孩然曰號而不嗄　注見上\n重華常兒　注\n禮襁三月　〇童非　附乳母門\n雛齒\n兒戲竹馬之戲　周禮三教一隅坐\n三教　周禮曰幼弱\n一隅坐　禮童子隅坐而執燭　隅坐不與成人並禮\n居喪　禮童子哭不偯不踊不杖不菲不廬\n晏起　禮孺子早寢晏起唯所欲食無時　注孺子幼子也\n竹馬是乘　以毅信　郭伋兒童數百各騎竹馬迎拜　朝郭伋單車至母曰子孝長矣能\n雛雛不捕　感魯恭不衣求裳　禮童子不衣裘裳\n常視無誑　禮云童子常視無誑\n童心　魯昭公年十九猶有童心\n奉雉　奉雉以從我盍五六歲\n幼儀　詩云童子幼儀　禮云六年　幼儀年幼儀\n成童　學禮舞象　禮童\n舞勺　十三學樂誦詩舞勺\n子何知　諂亂綺紈之佩鑣鑷佩蝶\n七年曰悼　禮七年曰悼　有罪不加刑焉　幼冲侗愿　子曰侗而不愿無知詩樂子吾不知之矣　無知\n鄉難言猶能絜己　論語互鄉難與言童子見門人惑子曰吾見其進也不保其往也\n欲成人　其居於位見其與先生並行非求益者欲速成者也\n幼學　曰幼學禮十年總角\n闕黨童子何\n不分孩提　負而對謂能負羈抱之也\n扶妹羈貫　穀梁云子生羈貫成童不就師傅父之罪也　羈貫謂交午翦髦也\n總角"},{"id":"juan6-058","source":"正文","juan":"卷第六","menu":"乳母第四十","sub_menu":"〇幼敏　附乳母門","page":"二六五","leaf":"三十九オ","text":"對曰　後漢黃琬字子琰年七歲詔問曰蝕多少對曰　　餘如月之初京師知名後乃\n九歲預家禽　郭子曰楊氏子年九歲聰惠孔君平指楊梅曰此君家果荅曰未聞孔雀是夫子家禽\n初出大如車蓋及中則小是上下遠東西近也　孔子見二小兒辯鬬一兒曰日初出　陽說及中則熱是上下近東西遠也夫子竟不能決\n甘羅　秦　十二爲\n克岐克嶷\n嶷　謂幼有達識　幼而不長安遠於日\n達識\n不長安遠於日　晉明帝年五六歲元帝置之膝上有人從長安來不聞人從日邊來以此可知帝奇之後集羣臣宴告其異對因問之明帝曰日近元帝問何以異昨日之對對曰舉目即見日不見長安\n稟生知\n奇骨　晉桓溫　見之曰此兒有奇骨可試使啼\n弱不好弄　傳夷吾弱不好弄　弄戲也　弱幼也\n有老成之風\n成人風　斑孟堅九歲屬文　善屬國文\n奇童九歲屬文\n不治屋室　陳蕃年十五　　居室不治人曰儒子何不掃除曰當掃天下\n諫父　吳祐字季英父恢爲南海太守欲殺青簡寫書祐年十二諫父曰南方素多珍怪此書成藏之兼兩昔馬援以薏苡\n無雙　黃香幼歲　人語曰江夏黃童　天下無雙\n造謁　有親門者爲通　膺見曰與僕何親荅曰元君孔子與老聃有師資之道\n左半接\n任氏童　人語曰蔣氏公翁任氏童\n遺客書　虞翻字仲翔年十二有客候其兄不過翻追與之書曰僕聞虎魋不學曲針客奇之\n不惜　當路有李羣兒競東王戎年七歲獨曰不甯自李子當路而繁必苦李也果然\n苦李子\n鼠齧衣　賈誼　極玄年七歲服終州府文武辭其叔沖　沖撫玄曰此浚家故吏玄流涕被面\n見故吏　庫吏懼死沖乃以刀穿破衣而曰俗以鼠齧被者不吉　操曰無害惟而庫吏白鞍事操曰小見衣猶尚被齧況操乎不罪之也\n環金環　王舒子也操馬鞍爲鼠所齧　衣不吉操曰無害戲　其金環都不言惜\n解\n年十八　名播郡中　河南綵童　綵君年十八歲時號綵童山東之英妙\n英妙　注見上\n懷橘　陸績六歲見袁術術出橘食之績懷橘二枚去拜辭橘墮懷術曰陸郎作賓客而懷橘乎績跪荅曰欲以遺母術大奇之\n劾鼠　公綵六歲見素術術出橘食之績懷操三枚去拜辭懷　　盜肉父笞湯湯乃　鼠及餘肉劾鼠掠治傳爰書訊鞫論報并取鼠與肉具獄磔堂下父見之視其文辭如老獄吏大驚\n稱象　　　欲稱之不可　置象於　船　刻　水痕　稱物以載之則校可知矣　傳　　民未入多少以他物\n承前葉夾注之即知輕重乃從之\n觀師　秦師伐滑周王孫滿尚幼觀之曰秦師輕而無禮必敗輕　寡謀無禮則脫\n聖童　任延長孫年十二學於長安明詩易春秋號曰任聖童\n小器速成　朱勃字叔陽年十二詣馬棱兒佩刀方領能矩步辭言嫻雅　見之自　　曰朱勃小器速成智盡此耳卒當從汝稟學勿畏\n慢人　魏司馬朗九歲有人道其父\n者　字者朗曰慢人親者不敬其親\n怒字父　魏常林字伯槐年七歲父黨造門問曰伯先在否何不拜林曰臨子字父何謂\n從容　呂蒙年十五六隨姊夫鄧當戰富陂見　馬呵叱不能止又張昭子　　母怒之蒙曰貧賤難可居誤有功當富貴\n二十造打城　步　薦　　　　以其年少不顧　　　　　舊曰任　里注\n又孫策年少領父兵舊兵號孫郎\n殺父侍兒　　母\n童　　闕乳\n狡童　剌忽也昭公有狡童之志不　行謂突\n狂童　與忽爭國不見子都乃見狂且\n狡童\n白氏六帖事類集卷第六"},{"id":"toc-juan7","source":"卷七總目","juan":"卷第七","menu":"卷第七總目","sub_menu":null,"page":"二七三","leaf":"一オ","text":"白氏六帖事類集卷第七　本卷總目（共 33 門）\n美丈夫一\n神彩儀容二\n醜丈夫三\n美婦人四　濃粧美色害德\n醜婦人五\n長大人六\n短小人七\n形貌八　影相似附\n富九　戒懼驕逸稱賤貪富吝嗇附\n貴十　晉位戒懼驕佚貪貴\n貧十一　安貧孤貧窮匱居處衣食傭賃\n賤十二　甘賤\n志節十三\n隱逸十四　大隱\n徵聘十五　不起\n姓氏十六　改姓\n名字十七　同名改名\n諱十八　不諱\n報德十九　不報德附\n謝恩二十　不謝不受謝\n夢二十一　吉夢凶夢占夢附\n寢二十二\n遊俠二十三\n故舊二十四\n卹孤二十五\n戲謔二十六　俳優\n笑二十七\n喜二十八\n怒二十九\n拜揖三十\n行步三十一\n趨三十二\n灑埽三十三"},{"id":"juan7-000","source":"正文","juan":"卷第七","menu":"美丈夫第一","sub_menu":null,"page":"二七三","leaf":"一オ","text":"彼美難能　子游曰吾友張也爲難能也然而未仁言子張容貌人難能及\n堂堂　曾子曰堂堂乎張也難與並爲仁矣\n冠玉　漢書陳平美丈夫如冠玉耳其中未必有\n傅粉　何晏字平叔美姿儀而面至白魏文帝疑其傅粉\n遺帽　晉書王濛字仲祖美姿容嘗覽鏡自照稱其父字曰文開生如此兒耶嘗帽破入市買之嫗悅之爭遺之帽\n擲果　晉潘岳字安仁至美每行於道婦人常擲果滿車\n明珠玉人羊車　晉衛玠字叔寶　　　　乘羊車於洛陽市市人咸曰誰家玉人王武子玠之舅也語人曰與吾外甥並坐爛然若明珠之在我側後衆人謂之看殺\n麈尾　晉書王衍字夷甫美姿容執玉柄麈尾與手無別\n龍章鳳姿　嵇康字叔夜長七尺八寸好容色土木形骸不自飾然而龍章鳳姿天質自然\n凝脂點漆（晉王右軍目杜弘治曰面\n如凝脂目如點漆此神仙中人也）\n如瓠　漢書張蒼肥白如瓠\n白晳　傳陳　子字子　白晳而長身長髮如黑也\n閑麗　宋玉體貌閑麗\n甚美　　　直不察狀貌甚美\n美艷　傳宋公子鮑美而艷\n端正　吳志孫桓儀容端正\n彼姝者子　詩\n邦之彥兮　詩\n鄒忌之美徐公　同其美妻妾與客曰我與城北徐公孰美\n子游之稱張也　注見上\n貌先五事　洪範五事一曰貌\n且高柴甚惡　羔至孝於孔門\n張難能　稱未仁於言偃\n苟德行之無取　華容貌而何爲\n望其容貌使無慢易之心\n漢相　漢王商長八尺餘身體鴻大容貌絕人單于來朝仰視遷延却退天子聞而歎曰真漢相\n目若懸珠齒如編貝　東方朔也\n若畫　後漢馬援美鬚眉目如畫\n秀而文　子太叔鄭大夫\n父母遺德　莊子盜跖謂孔子曰長大美好人見而悅者此吾父母遺德丘雖不吾譽吾不自知耶\n連璧　晉潘安仁夏侯湛並美容每同行世目人謂之連璧\n堂堂田郎　田鳳爲郎端正入奏事靈帝目送之題柱曰堂堂乎京兆田郎字秀宗"},{"id":"juan7-001","source":"正文","juan":"卷第七","menu":"神彩儀容第二","sub_menu":null,"page":"二七四","leaf":"一ウ","text":"神清　向　中朝人物劉琰云杜乂膚清衛叔寶神清各有識所重如此\n視日不眩　王戎字濬沖幼穎悟神彩秀徹視日不眩裴楷目之曰戎眼爛爛如巖下電\n風塵外物　王戎曰王衍神彩高徹如瑤林瓊樹自是風塵外物\n太儁　王衍神情明秀王澄曰兄形似道而神鋒太儁"},{"id":"juan7-002","source":"正文","juan":"卷第七","menu":"神彩儀容第二","sub_menu":"〇容儀　附","page":"二七四","leaf":"一ウ","text":"美鬚髯　　　白晳時人目矣嚬鬚髯也\n奇士　漢江充魁岸容貌甚壯帝望見之曰燕趙固多奇士\n甚都　司馬相如車騎雍容閑雅甚都都閑雅之稱\n玉人　裴楷字叔則吏部侍郎風神高邁容儀俊爽博涉羣書精理時人謂之爲玉人矣\n如鐘　陸機身長七尺其聲如鐘\n狀異常人　蔡邕字伯喈謂從弟谷曰董卓性剛遂非終難濟吾欲遁逃山東以待如何谷曰君狀異恒人每行觀者盈集以此自匿不亦難乎乃止\n以容爲禮官　漢徐生善爲容孝文時以頌爲禮官大夫傳子至孫延襄襄其資性善爲頌不能通經延頗能未善也襄亦以容爲大夫至廣陵內史頌音容\n取貌失人（新　功曹　衡以外貌小子侯預朝容姿趨步有出於衆　宗目之特賜輿服　從\n華有容儀而無實行未審如禮帝後弄衍邸邑高司馬衡在縣下廉文書帝聞乃歎曰知人則哲以延爲明）"},{"id":"juan7-003","source":"正文","juan":"卷第七","menu":"醜丈夫第三","sub_menu":null,"page":"二七五","leaf":"二オ","text":"六極　洪範六極六曰惡惡醜也\n孔醜　亦孔之醜\n不臧宵貌\n陋質　容貌\n載兄　張孟陽醜每出人惡之擲瓦石盈車\n眇小丈夫　孟嘗君田文也\n一言而善　傳晉叔向適鄭鬷蔑惡而立於堂下一言而善叔向聞之曰必鬷明也下執其手以上\n三年不笑　傳賈大夫惡娶妻而美三年不言不笑御以如皋射雉獲之其妻始笑而言\n狂且　古之醜人也詩曰不見子都乃見狂且\n名動　孫卿子曰衛靈公有臣曰公孫呂身長七尺面長三尺廣三寸名動天下\n睅目　華元睅其目皤其腹睅睛大皤腹大\n欽頤　周處字彥祖\n椎顙　呂氏春秋陳有惡人曰敦洽讎麋椎顙廣顏色如漆赭\n折頞哆嘴　　　　頞哆嘴　　　也哆爲口哆不正音侈\n子羽甚惡以貌失人　史記澹臺滅明字子羽狀貌甚惡孔子以爲才薄既而受業名振諸侯孔子曰吾以言取人失之宰我以貌取人失之子羽\n鬷蔑不颺因言見用　傳叔向謂鬷蔑曰今夫子少不颺子若無言吾幾失子矣遂如故交注不颺顏貌不揚顯也\n睅目佐宋　華元\n蹙頞相秦　史記蔡澤魋顏蹙頞頞鼻莖也澤爲秦相\n子張難能　稱未仁於言偃\n高柴甚惡推至孝於孔門　家語高柴子羔見甚惡爲人篤孝知名於孔子門\n苟盡美之可嘉　華孔醜之何害\n雖伯倫之形不妨賢士　劉伶字伯倫形貌醜悴肆意放蕩名與七賢\n而承宮之狀難示遠人　後漢承宮名播單于單于遣使求見宮帝曰夷狄重名者貌美也宮貌醜不可以示遠人乃以大鴻臚魏應代之\n無以貌取\n何陋之有\n行步俛僂　漢蔡義年八十命爲丞相短小無鬚眉貌似老嫗行步俛僂\n黑而上僂　傳豎牛黑而上僂深目而豭喙狗長而上僂\n母欲棄　周處字彥祖生而欽頤折頞醜狀駭人其母欲棄之父不聽曰吾聞賢聖多有異貌興我宗者此兒也\n恐似己　莊子厲人夜半生子其父取火視之恐其似己厲人醜人也"},{"id":"juan7-004","source":"正文","juan":"卷第七","menu":"美婦人第四","sub_menu":null,"page":"二七五","leaf":"二オ","text":"彼美人兮\n彼姝者子\n美\n人　麗人佳人\n其姝　靜女其姝\n婉兮孌兮　詩\n窈窕　淑女\n邦之媛兮\n鍾美　傳天鍾美於是是謂夏姬也\n桃李　詩華如桃李\n華　顏如舜華\n國色　見公羊傳\n巧笑　巧笑倩兮美目盼兮\n如玉　燕趙多佳人美者顏如玉\n千金之笑　千金買笑\n洵美且都　詩\n蛾眉　手如柔荑膚如凝脂領如蝤蠐齒如瓠犀螓首蛾眉\n光可以鑑　傳昔仍氏生女鬒黑而甚美光可以鑑名曰玄妻\n西施南威　戰國策晉文公得南威三日不聽朝遂推南威遠之曰後世必以色亡國\n巫峽之女\n洛川之神\n傾城絕代　李延年歌曰北方有佳人絕代而獨立一顧傾人城再顧傾人國\n北方南國　曹植詩云南國有佳人容華若桃李\n東鄰　宋玉曰東鄰之女增之一分則太長減之一分則太短施朱則太赤施粉則太白\n盈盈樓上女　古詩\n靡顏膩理　　云\n不待脂粉　淮南子不待脂粉西施陽文\n傾國\n宜笑　楚辭曰既含睇兮又宜笑注睇微眄也\n袨服　靚莊妍姿\n一笑　　麗一國人壽\n金鈿　飾首\n羅縠　被身\n丹脣　皓齒\n詩稱女德　以在於賢\n禮載婦容　　於色\n投五事　美先於德\n稽四德　無大於容\n姱容　楚辭曰姱容修態\n晤言　彼美淑姬可與晤言\n灼灼其華\n姬姜令色\n孟娵　古之好女也娵音　楚辭\n玄鬢　翠\n美艷"},{"id":"juan7-005","source":"正文","juan":"卷第七","menu":"美婦人第四","sub_menu":"〇美色害德　附美婦人門","page":"二七六","leaf":"二ウ","text":"甚美甚惡　叔向欲娶申公巫臣氏其母曰吾聞甚美必有甚惡而天鍾美於是將必以是有大敗也夫有尤物足以移人苟非德義則必有禍\n尤物　見上\n傾國　人\n易色　子夏曰賢賢易色\n誨淫之容\n伐性之斧　易云冶容誨淫\n三代之亡　皆因女寵秦子之敗皆此物也\n魚入鳥飛　莊子西施毛嬙人之美也魚見之深入鳥見之高飛\n南威　注見上\n孔妻美艷　宋華父督見孔父嘉之妻于路目逆而送之曰美而艷遂殺孔父而娶其妻殤公怒督遂弒殤公矣\n孫壽媚惑　後漢梁冀妻孫壽美色善爲妖態作墮馬髻折腰步以爲媚惑冀甚寵憚之\n奇衰　媚也\n有南威\n之容乃可以論於淑媛　有龍泉之利乃可以議於斷割\n豔妻煽方處"},{"id":"juan7-006","source":"正文","juan":"卷第七","menu":"美婦人第四","sub_menu":"〇難濟　附美婦人門","page":"二七七","leaf":"三オ","text":"釋羑里之繫　史紂囚西伯於羑里閎夭之徒以有莘氏之美女獻於紂紂大悅乃釋西伯而歸\n解平城之圍　桓譚論曰高祖被圍平城說閼氏言漢有美女天下無雙急則進單于單于得必大重之則閼氏之寵衰矣是謂出奇計也"},{"id":"juan7-007","source":"正文","juan":"卷第七","menu":"醜婦人第五","sub_menu":null,"page":"二七七","leaf":"三オ","text":"甚惡宵形　宵貌形醜\n嫫母　醜女\n鍾離之后　列女傳齊邑之女曰鍾離春齊宣王之正后也爲人極醜臼頭深目長節卬鼻結喉肥項少髮折腰出胸皮膚若漆行年四十無所容入衒嫁不售乃拂拭短褐自詣宣王願備後宮宣王納之以爲后\n登徒之妻　宋玉曰登徒子之妻蓬頭攣耳齞脣歷齒旁行踽僂又疥且痔登徒子悅之生五子\n許允之婦　郭子許允之婦奇醜交禮竟不復入房許曰婦有四德卿有幾婦曰新婦所乏者容爾士有百行君有幾許曰皆備婦曰君好色不好德何謂皆備許有慚色遂相敬重\n晉惠妃　賈充女醜而短黑色\n陋質　諸容鄙兒\n効嚬　西施病捧心而嚬鄰之醜女亦學之\n況賢推易色　謂匪醜不\n美艷之妻　且聞亂宋\n稽宿瘤之女　終見興齊\n苟德行之可稱　雖醜陋而何害\n苟宵貌之不臧　雖効嚬而孔醜\n首若飛蓬　膏沐無用\n膚如點漆　脂粉何施\n雖天地之委形　合齊美惡\n而男女之大欲　亦本妍蚩\n無敵惡於下山　宜鑒形於止水\n稽六極且聞於惡　孝四德不見其容\n詩稱女美　必在於賢\n禮載婦容　不專於色\n苟以德稱　何宜貌取\n龐廉　楚辭哀時命云古之醜婦人龐音龍"},{"id":"juan7-008","source":"正文","juan":"卷第七","menu":"長大人第六","sub_menu":null,"page":"二七七","leaf":"三オ","text":"埋首於子駒之門　傳曾叔得臣敗長狄于鹹獲長狄僑如富父終甥春其喉以戈殺之埋其首於子駒之門齊獲其弟榮如埋其首於周首之北門鄋瞞由是遂亡注鄋瞞長狄國名蓋長三丈骨節非常恐後代怪故記其處所\n長狄眉見軾　穀梁傳長狄僑如兄弟三人佚宕中國瓦石不能害得臣善射射其目身橫九畝斷其首而載之眉見於軾\n防風\n骨專車　家語吳伐越墮會稽獲骨專車吳子使來問仲尼仲尼曰禹會諸侯於塗山防風氏後至禹戮之其骨節專車\n身橫九畝　長狄身橫九畝\n腰闊十圍　晉書尹緯字景亮長八尺腰帶十圍魁梧有大志\n十丈　國語曰人之長者不過十丈數之極也\n龍伯國之大人　列子帝令巨鼇負五山龍伯國之大人釣而連六鼇合負而歸帝怒之\n蓬萊山之奇士　漢書王莽時有奇士長丈腰大十圍出自蓬萊山自言巨無霸軺車不能載三馬不勝臥則枕鼓\n視跡於襄武　魏志咸熙二年襄武縣有大人見長三丈餘跡長二尺二寸白髮著黃單衣\n見體於臨洮　史記秦始皇時有大人見臨洮長五丈腳跡長六尺\n鴻大　漢長樂衛尉馬騰身長八尺身體鴻大面貌雄異\n魁梧　後漢趙壹字元叔體貌魁梧身長九尺望之甚偉恃才倨傲\n乘土　禮斗威儀曰君乘土而王者其人長大\n禹　長九尺九寸\n湯　長九尺\n孔子　長九尺\n伍子胥　長一丈\n韓信　長八尺九寸\n東方朔　長九尺三寸\n金日磾　長八尺\n車千秋　長八尺\n頎而長兮\n千仞　楚辭曰東方長人千仞惟魂是索\n乾坤賦象　宗類分形\n非無長短之差　自有洪纖之別"},{"id":"juan7-009","source":"正文","juan":"卷第七","menu":"短小人第七","sub_menu":null,"page":"二七八","leaf":"三ウ","text":"侏儒　方言侏儒短小人也傳臧紇戰敗國人歌曰侏儒侏儒使我敗於邾注臧紇短小故也又東方朔云侏儒飽欲死\n僬僥　國語僬僥氏長三尺短之極也注西南蠻也\n優旃　史優旃秦倡侏儒也\n巨靈　漢武故事東郡進一短人長七寸名巨靈\n眇小丈夫　孟嘗君也\n飽欲死　東方朔曰臣長九尺三寸俸一囊粟錢二百四十侏儒長三尺亦一囊粟錢二百四十侏儒飽欲死臣飢欲死\n二尺　廣延之國人長二尺\n一寸　神異經西北荒有小人長一寸朱衣朱冠\n晏子短以相齊　晏子長不滿三尺而相齊\n蔡義小而佐漢　漢蔡義爲丞相年八十短小無鬚眉行步俛仰常兩吏夾持乃能行也\n短主簿　王珣爲桓溫主簿爲人短小故號曰短主簿\n若不勝衣　孫卿子葉公子高短小行若不勝衣\n侏儒　漢書東方朔謂侏儒曰帝以若曹耕田力不及人從軍不任兵事無益於國今欲盡殺若曹侏儒大懼\n長\n七寸　神異經西海有一鶴國人長七寸日行千里如飛百物不敢犯唯畏海鵠鵠吞之壽三百歲在鵠腹中不死或云李子敖也\n短黑　賈充女晉惠妃醜而短小\n是以區區最質　遂爲楚國之寶\n瑣瑣微容　遂入蔡邕之賦\n僬僥不可使舉　侏儒不可使援"},{"id":"juan7-010","source":"正文","juan":"卷第七","menu":"形貌第八","sub_menu":null,"page":"二七九","leaf":"四オ","text":"圓首方足　首圓象天足方象地\n乾爲首　坤爲腹離爲目艮爲手震爲足坎爲耳巽爲股兌爲口易說卦云\n筋骸之束　禮云人陰陽之交五行之秀氣骨　之會筋骸之束\n駢脅　晉公子重耳駢脅\n蜂目豺聲　楚公子商臣忍人也\n熊虎之狀　豺狼之聲越椒\n深目豭喙　豎牛\n睅目皤腹　華元睅其目皤其腹睅目出也皤腹大也\n宵形天地　漢書宵類也謂圓首方足\n頭小而銳　史記平原君武安君頭小而銳\n婦人女子　人聞張良勇智以爲其狀貌魁梧奇偉乃若婦人女子\n猿臂　李廣\n眞漢相　漢王商長八尺餘身體鴻大容貌絕人單于來朝仰視遷延却退天子聞而歎曰眞漢相也\n顧見耳　蜀先主劉備\n燕頷　班超燕頷虎頸飛而食肉萬里侯相也後封爲定遠侯\n鳶肩　梁冀\n魁岸　江充\n龍章鳳姿　嵇康與土木形骸人以爲龍章鳳姿天質自然\n脩容　目容端口容止動不妄\n頭容直\n足容重\n黑而上僂　豎牛\n眼如紫石稜\n鬚如蝟毛磔　桓溫\n奇表　後漢李固字子堅貌有奇表\n問魍魎　莊子云衆罔兩問影"},{"id":"juan7-011","source":"正文","juan":"卷第七","menu":"形貌第八","sub_menu":"〇影　附形貌門","page":"二七九","leaf":"四オ","text":"日中無影　神仙人與虛合體故日中無影雪中無跡\n服丹　　　久服丹無影\n魍魎問影\n處陰休影\n疾行遁影　人有惡影而走者不知處陰而影滅\n老人子　無影\n捕影隨形　若捕影隨形也\n顧影　何晏自喜行步顧影\n欲影之直　必端其表\n●相似　附形貌門\n有若　史記孔子既沒弟子思慕以有若狀似孔子相與立爲師師事如孔子\n優孟　優孟爲孫叔敖衣冠抵掌譚論象孫叔敖楚王及左右不能別\n陽虎　孔子畏於匡蓋孔子貌似陽虎匡人圍之陽虎陽貨也\n逢丑父\n承前葉夾注公　　　父倣孝慎公故代慎公爲晉後也\n且無典形　後漢孔融與蔡邕素善邕卒有虎賁士貌類蔡邕融每酒酣引與同坐曰雖無老成人且有典刑\n張衡後身　語林曰張衡死蔡邕母始孕二子才貌相似時人云邕是張衡後身\n兄弟　陳國張伯階弟仲階相似妻子不能別\n惟肖　尚書\n吾面　人心不同其如面焉敢謂子面爲吾面焉\n厲人　莊子厲人生子恐似己厲人醜人也\n紀信詐降　紀信貌似漢王乘黃屋車左纛詐稱漢王出降項羽"},{"id":"juan7-012","source":"正文","juan":"卷第七","menu":"富第九","sub_menu":null,"page":"二八〇","leaf":"四ウ","text":"五福　二曰富\n富而可求　語\n哿矣富人　詩\n聚斂　季氏富於周公而求也爲之聚斂而附益之可也語\n貨殖　子曰賜不受命而貨殖焉\n家富　禮家富不過百乘\n多積　儒有不祈多積積財貨也\n潤屋　曾子曰富潤屋\n潤屋　　財貨以潤身\n發身　禮仁者不以財發身言仁者務施故發身於令名\n發財　不仁者以身發財言不仁者不務施故發財於令名也\n素封　史記富者無祿秩之奉爵邑之入而與之比者命曰素封\n金穴　郭況富號金穴\n積財　晉書石崇善營生業積財如山岳也\n藏鏹　巨萬卓鄭\n猗陶　蜀卓氏程鄭陶朱猗頓四人並古之富者\n日食萬錢　何曾\n千駟　齊景公有馬千駟\n化貨財　雅王不殖貨財\n豐財\n徇財　貪夫徇財\n憂貧好利\n生厚德正　言才足則思無邪\n雖生厚而德正　忠則無邪\n苟怙\n富而持盈　驕而生亂\n安富　周禮以保息養萬民六曰安富謂平其稅不專取也\n既富　子適衛曰庶矣哉冉有曰既富矣又何加焉曰教之也\n家累千金　子貢\n田農　漢秦陽以田農而富一州\n販脂　翁伯販脂而傾縣邑\n賣漿　張氏以賣漿而踰侈\n灑削　質氏以灑削而鼎食　治刀劍\n胃脯　濁氏以胃脯而連騎\n馬醫　張里以馬醫而擊鍾\n谷量牛馬　史烏倮畜牧乃　求殊物遺戎王戎王與之積畜用谷量牛馬始令比封君烏　氏縣名保其名\n顏子一駟　景公千駟\n貨財山積　谷量牛馬\n放利而行　以財自衞\n賴千\n僮僕　　指千\n巨萬　貨財巨萬\n財雄　　　以財雄邊\n富擬　王者\n瞻烏　爰止于誰之屋言烏集富人屋\n朝請　漢書烏氏倮畜牧及衆斥賣求奇繒物間獻戎王戎王什倍其償予畜畜至用谷量牛馬秦始皇令倮比封君以時與列臣朝請\n貲次如苴　成都羅裒貲至巨萬初裒賈京師爲平陵石氏持錢石氏貲次如苴親信之厚資遺令往巴蜀數年間致十餘萬裒舉其半賂遺曲陽侯依其權勢時當物備力餘貸郡國人莫敢負\n如苴　如氏苴氏皆富人也\n高貲\n晉楚之富　孟子曾子曰晉楚之富不可及也彼以其富我以吾仁彼以其爵我以吾義吾何慊哉\n爲仁不富　爲富不仁\n用財自衞　巴寡婦清史"},{"id":"juan7-013","source":"正文","juan":"卷第七","menu":"富第九","sub_menu":"〇戒懼　附富門","page":"二八一","leaf":"五オ","text":"幅利　傳晏子不受邑子尾問之曰吾不受邑非惡富也恐失富也富如布帛有幅焉爲之制度使無遷夫人生厚而利於是乎正德以福爲幅焉幅利過則敗吾不敢貪多所謂幅也\n無驕　富而無驕\n好禮　富而無驕未若富而好禮者也\n人之所欲不處　子曰富與貴是人之所欲不以其道得之不處也\n不義\n如浮雲　不義而富且貴於我如浮雲\n不淫　禮富貴而知好禮則不驕不淫\n能散　積而能散\n辭富　君子辭富不辭貧\n不仁　爲富不仁爲仁不富\n去泰　聖人去甚去奢去泰\n損之而益　益之而損\n知足　知　止\n念失富之由　必因厚利\n思遠貧之識　　敬\n居利思義\n聖人不積　君子誡盈\n戒之在德\n辭宋人之寶　曾是不貪\n讓齊國之封　晏子非惡富\n夫物惡盛　唯神害盈\n知止者富　老子\n念其潤屋　無祿\n實\n慮以焚身　非道不處\n貧富能訓　能順教訓也書言責富而\n善富　貨殖傳任氏折節爲力田畜人爭取賤價任氏獨取貴善\n散施　富者數世後漢樊　父重國卒家無　藏厚　太守有貲財二億家童八百人及之義乃以金帛賈産周施親戚\n須知止足之由　錢刀\n禾"},{"id":"juan7-014","source":"正文","juan":"卷第七","menu":"富第九","sub_menu":"〇驕逸　附富門","page":"二八一","leaf":"五オ","text":"處樂　子曰不仁者不可以長處樂\n怙富　子太叔曰無怙富又傳曰富而不驕鮮子皙怙富而卑其上\n不亡　而不亡未之有也\n斯亂　子曰小人富斯驕驕斯　重人之謂食人富不足以盈也\n故充詘　不充詘於富貴注充詘失節貌\n服文彩　而驕易生老子曰服文彩厭飲食是爲盜夸也\n食膏粱　而生華正國語曰　膏粱之性難正言易驕難正\n膏粱持盈　老子\n遺咎　富貴而驕自遺其咎\n期侈　富不與侈期而侈自至也\n期驕　尚書云位不期驕注云不與侈期而驕自至也"},{"id":"juan7-015","source":"正文","juan":"卷第七","menu":"富第九","sub_menu":"〇禍敗　附富門","page":"二八二","leaf":"五ウ","text":"怙富　子皙怙富而卑其上不能久也\n盈剝　傳\n生厚\n鄭殺駟秦　傳鄭駟秦富而侈嬖大夫也而常陳卿車服於其庭鄭人惡而殺之\n偏重必離　子高曰吾聞所求無厭偏重必離言如物偏重必離散\n焚身　傳象有齒以焚其身賄也\n賈害　傳\n厚亡　多藏必厚亡老子\n既生生之厚　亦安安而能遷\n富謂之殃　傳慶封奔吳吳與之朱方富於其舊惠伯曰天殆富淫人慶封又富矣穆子曰善人之富謂之賞淫人之富謂之殃天其殃之也其將聚而殲旃\n羨餘之必毀　盈必毀天之道\n禍生腐鼠　列子曰虞氏梁之富人財無量登高臨大道陳酒擊博俠客相隨行樓上擲下博者射中兩搶而笑飛鳶適墜其腐鼠而中俠客俠客相謂曰虞氏富樂久矣我不侵犯乃辱我以腐鼠聚衆攻之滅其家此驕奢之致禍　以盈當滅之乃非以一途也\n象有齒而焚身　人懷璧而賈害"},{"id":"juan7-016","source":"正文","juan":"卷第七","menu":"富第九","sub_menu":"〇貪富　附富門","page":"二八二","leaf":"五ウ","text":"專利而不厭　申侯\n予取予求　不女疵瑕\n敗類　貪人敗類\n盈厭　　　貪于飲食冒于貨賄侵欲崇侈不可盈厭\n饕餮　貪財食也\n逞無疆之欲\n以不貪爲寶　子罕\n無欲寶難\n放利而行　多怨\n敗度　欲敗度\n貪惏　貪冒\n屬厭　願以小人之腹爲君子之心屬厭而已\n懲肆去貪\n載寶　孔子曰南宮敬叔反必載寶而朝孔子曰喪不如速貧之愈也\n欲不可縱　志不可滿\n苟得　臨財毋苟得\n貪無求多　貪多也\n是無厭也　不可厭也其能久乎\n爭利\n禮\n不縱欲　神亦害盈\n貪夫　殉財\n傷實\n可欲　罪莫大於可欲\n不以義制　將由怨終\n無厭飽之心　廉恥\n無德而貪　不義而富\n以徼大利　必有近憂\n小人喻於利　語\n無德而貪　子罕謂之喪寶\n不義而富　仲尼喻於浮雲\n化貨力而已　禮\n貪泉　南海有貪泉人飲之皆貪吳隱之酌飲曰使伯夷叔齊飲之必不易心也\n廉恥缺　詩云白華廢則廉恥缺\n黷貨　無厭\n戒得　戒之在得\n行妨　難得之貨令人行妨老子\n楊公不惑　楊秉云不惑酒色財\n不憂貧\n谿壑可盈　是不可厭國語叔向云\n人道惡盈"},{"id":"juan7-017","source":"正文","juan":"卷第七","menu":"富第九","sub_menu":"〇吝嗇　附富門","page":"二八三","leaf":"六オ","text":"易坤爲地　爲吝嗇\n不足觀　子曰如有周公之才之美使驕且吝其餘不足觀也\n短於財　仲尼不假蓋於子夏曰商之爲人也短於財吾聞與人交讓其短取其長所以能久\n曹洪　魏志曹洪家富性吝魏文帝在東宮時從洪貸絹不如意恨之\n牙籌　晉王戎園田水碓偏於天下執牙籌晝夜筭計常若不自奉養天下謂之膏肓疾女適裴頠貸數萬錢久不還女歸寧戎不悅女遽還直乃悅從子將婚遺一單衣婚訖而責之又家有好李賣恐人得種恆鑽核而貨之\n錢癖　和嶠富擬王者而性至吝人以爲有錢癖以此獲譏\n食不足　鄭太有田四百頃食恆常不足\n甚愛必大費　老子云\n既纖　周人既纖儉而師史尤甚轉轂以百數賈郡國無所不至雒陽街居在齊秦楚趙之中貧人學事富家相矜以久賈過邑不入門設用此等故師史能致七千萬\n纖嗇　說苑孔氏南陽大鼓鑄連車騎遊諸侯有閑公子之名然其贏得過當愈於纖嗇也\n儉嗇　魯人俗儉嗇而丙氏尤甚家自父兄子弟約俛有拾仰有取富至巨萬\n公侯富儉　張安世尊爲公侯食邑萬戶然身衣弋綈夫人自紡績家僮七百人皆有手技"},{"id":"juan7-018","source":"正文","juan":"卷第七","menu":"貴第十","sub_menu":null,"page":"二八三","leaf":"六オ","text":"人之所欲　子曰富與貴是人之所欲不以其道得之不處也\n尊貴　傳曰人是以能尊其貴貴是以能守其業\n常尊　貴有常尊\n在天　富貴在天\n金張　漢功臣家唯金張二人親近貴寵比於外戚\n許史　許氏史氏皆漢之外戚並侯累世皆富極貴\n冠蓋　如雲\n貂蟬\n飛翠緌\n念榮身以庇族　無欲實難\n思絜己而立身　非道不處\n衣錦　漢書富貴不歸故鄉如衣錦夜行\n承前葉夾注故鄉如衣錦夜行\n紆青　拖紫\n鏘玉　鏘金\n榮曜　繁華\n議貴　周禮\n暴貴　禮\n崇高莫大於富貴\n西園待士　　八\n東閤迎賓　九"},{"id":"juan7-019","source":"正文","juan":"卷第七","menu":"貴第十","sub_menu":"〇爵位　附貴門","page":"二八四","leaf":"六ウ","text":"青紫　如拾之\n七葉　左思詩云金張籍舊業七葉珥漢貂\n列五侯　漢成帝同日封舅五人爲五侯\n垂三組　漢陽侯爲掾辭　歸家懷綬黃垂三組以誇鄉里\n佩六印　蘇秦歸洛陽佩六國相印\n朱輪十人　漢楊惲書曰惲家全盛時乘朱輪十人\n一門三后　　　三皇后\n梁冀一\n六葉九公　荀爽子孫傳九葉九公\n漢七貴　周禮九命\n百乘之家　卿大夫\n萬石　君石奮也\n金貂七代　漢金\n九露\n四王　九卿\n三入　和明\n席寵　尚書\n代紆青緺朱紱　門傳\n四代五公　後漢袁氏"},{"id":"juan7-020","source":"正文","juan":"卷第七","menu":"貴第十","sub_menu":"〇戒懼　附貴門","page":"二八四","leaf":"六ウ","text":"寵辱若驚　老子曰得之若驚失之若驚\n知懼思降　傳貴而知懼懼而思降猶登而未降階智人也不在寵渝\n浮雲　不義而富且貴於我如浮雲\n不處　富與貴是人之所欲不以其道得之不處也\n邦無道　富且貴焉恥也\n必毀　盈必毀天之道\n持盈好禮　富貴而知好禮則不驕不淫\n不廉　禮曰聖人之制富貴也使人富不足以驕貴不慊於上\n辭貴　君子辭貴不辭賤\n三命益恭　傳三命益恭故鼎銘曰一命而僂再命而傴三命而俯正考父也\n身退　功成名遂身退天之道\n去甚　聖人去甚去奢去泰\n下人　家語以富貴而下人何人不與\n物惟惡盛　神亦害盈\n知止　知足\n寡悔　寡尤\n有寵辱之驚\n無喜慍之色　令尹子文\n貴而能貧　懼以知降\n鄭子張黜官　傳鄭子張有疾使黜官歸邑曰吾聞　而能貧可以後亡二三子生在敬戒不在富也君子曰善戒之\n齊晏嬰辭邑　見誡富門\n寵辱必驚　已而無慍\n止足　史蔡澤曰吳起越大夫種功成不去禍至范蠡知止足超然避世長爲陶朱公熟見與禍至　　　　　侯曰吾聞欲而不知止則失其所以欲也\n成功之下　不可久處\n不過六百石　後漢　　兄子　　　志自修爲官不過六百石輒自免去\n張良曰　家世相韓及韓滅不愛萬金之用爲韓報仇彊秦天下震動今以三寸舌爲帝者師封萬戶侯於良足矣願棄人間事欲從赤松子游乃學道引欲求輕舉也\n疏廣　謂受曰知足不辱遂乞骸骨歸"},{"id":"juan7-021","source":"正文","juan":"卷第七","menu":"貴第十","sub_menu":"〇驕泆　附貴門","page":"二八五","leaf":"七オ","text":"處樂　子曰不仁者不可以長處樂\n不驕　君子泰而不驕\n恃寵　子太叔曰無怙富無恃寵\n鮮禮　尚書世祿之家鮮克由禮\n其亡　傳戍也驕其亡乎公叔戍也\n斯亂　驕斯亂\n充詘　禮不充詘於富貴充詘喜失節貌\n服文采　而驕易生\n食膏粱　而性難正並見上注\n持盈　老子\n遺咎　富貴而驕自遺其咎\n期驕　位不期驕見上注\n聖人去泰　君子戒盈\n代祿之家\n伯有侈　不能久矣\n公孫驕　其將亡乎\n宣驕　崇侈"},{"id":"juan7-022","source":"正文","juan":"卷第七","menu":"貴第十","sub_menu":"〇貪貴　附貴門","page":"二八五","leaf":"七オ","text":"進取　狂者進取\n志不可滿\n知足　不辱知止不殆\n躁　求苟得\n曼滿之欲爲卿\n且聞及禍　傳鄭公子曼滿與王子伯廖語欲爲卿伯廖告人曰無德而貪後一歲鄭人果殺之\n駟秦\n不守其位終見伏誅　傳駟秦富而侈嬖大夫也而常陳卿之車服於其庭鄭人惡而殺之子思曰不守其位而能終者鮮矣\n不義而貴　無德而祿無德而貪\n逞無疆之欲\n爭名　於朝\n敗度　欲敗度\n以徼大利　必有近憂\n貪冒之人　將寡力焉\n禮不縱欲　人有惡盈\n罪莫大於可欲\n不以義制　將由惡終\n無以寵利居成功　　貪而不退也\n貪以敗官　爲墨\n受爵不讓　言\n朝廷之位讓而就賤　禮\n暴貴\n伐檀　詩刺在位貪鄙無功受祿也\n知進而不知退"},{"id":"juan7-023","source":"正文","juan":"卷第七","menu":"貧第十一","sub_menu":null,"page":"二八五","leaf":"七オ","text":"懸磬　室如懸磬言空也傳\n屢空　子曰回也其庶乎屢空\n終窶　詩終窶且貧莫知我艱\n惡衣惡食　子曰士志於道而恥惡衣惡食者未足與議也\n不以貨財爲禮　貧\n君子不辭　子曰君子辭富不辭貧\n承前葉夾注不辭貧\n貴而能貧　見上注\n食貧　三歲食貧\n邦有道　貧且賤焉恥也\n身安白社　董京保青壁\n振窮恤貧　周禮以保息六養萬人三曰振窮四曰恤貧\n大惡　禮曰死亡貧苦人之大惡存焉\n始因十盜之由　六韜曰貧者十盜謂收種不時妄費　　養女太多之類\n終標六極之數　洪範六極二曰貧也\n處約凍餒　國語叔向見韓宣子憂貧叔向賀之曰吾有卿名而無卿實無以從二三子吾是以憂子賀我何故對曰昔欒武子無一卒之田諸侯親之戎狄懷之以正晉國今吾子有欒武之貧吾以爲能脩其德所以賀若患貨之不足予何賀之\n將轉溝壑\n蓬門下客　華戶輕生\n之於貨財　闕於禮義"},{"id":"juan7-024","source":"正文","juan":"卷第七","menu":"貧第十一","sub_menu":"〇安貧　附貧門","page":"二八六","leaf":"七ウ","text":"無諂　貧而無諂未若貧而樂\n樂道居常　榮啟期曰貧者士之常居常而待終\n不去　貧與賤是人之所惡不以其道得之不去也\n不改其樂　一簞食一瓢飲在陋巷人不堪其憂回也不改其樂賢哉回也\n樂在其中矣　飲水曲肱而枕之樂亦在其中矣\n簞食無憂　回\n琴歌自樂　榮啟期云\n雖富哉　是人所欲\n而貧者　士之常\n非病　原憲居蓬戶之中晝日而食子貢連騎而之憲杖藜而出子貢曰先生何病憲曰今貧也非病子貢慙之\n有守心　無淫行魏代\n不憂　君子憂道不憂貧語\n不懾　禮貧窮而知好禮則志不懾\n君子居　易以俟命\n樂道安德　文子樂道而忘賤安德而忘貧也\n晏如　揚雄家產不過十金無儋石之儲晏如也\n雪不干人　大雪丈餘洛陽令按行見人家皆除雪而袁安門無行路謂安死矣令看之見安僵臥問之答曰大雪人餓不宜干人令以爲賢遂舉爲孝廉\n荷鍤東陂\n且棲遲於衡泌　學經　倡息於蒿萊\n黔婁　貧人"},{"id":"juan7-025","source":"正文","juan":"卷第七","menu":"貧第十一","sub_menu":"〇孤貧　附貧門","page":"二八六","leaf":"七ウ","text":"天窮　禮曰老而無夫曰寡老而無妻曰鰥老而無子曰獨少而無父曰孤此四者天人之窮而無告者皆有常餼\n保息賑窮　周禮司徒以保息六養萬人一曰慈幼二曰養老三曰賑窮天人之窮者救之\n天窮　地著\n不分孤寡　傳不分孤\n也\n煢獨　煢寡介獨\n以養孤老　周禮\n恤人之艱阨　窮困\n以肺石達窮民　周禮以肺石達窮民凡遠近煢獨老幼之欲有達其上而長不爲達者立於肺石三日士聽其辭以告於上而罪其長\n人是以息\n小人懷惠　語\n布德施惠　月令仲春\n養幼少存諸孤　月令\n孟冬恤孤寡　以逮不足\n大道之行使老有所終幼有所長鰥寡孤獨廢疾皆有所養　禮\n老幼孤獨不得其所　禮\n老窮不匱\n化將行於邦家　惠宜逮於孤獨\n惠必及下　禮\n上恤孤則人不倍\n介特單獨\n子惠困窮\n撫俗　字人\n邦不施惠　老將　体\n道存愛物　政在養民"},{"id":"juan7-026","source":"正文","juan":"卷第七","menu":"貧第十一","sub_menu":"〇窮濫　附貧門","page":"二八七","leaf":"八オ","text":"窮斯濫矣　子曰君子固窮小人窮斯濫矣\n不仁處約　子曰不仁者不可以久處約\n不能居常　如欲行儉\n疾貧　子曰好勇疾貧亂也\n無怨　子曰貧而無怨難\n利回　君子不爲利回回邪也\n憂貧　　利\n斯約斯盜　子曰小人貧斯約約斯盜故聖人之制富貴也使貧不至於約\n隕穫　禮不隕穫於貧賤隕穫困迫失節之皃"},{"id":"juan7-027","source":"正文","juan":"卷第七","menu":"貧第十一","sub_menu":"〇居處　附貧門","page":"二八七","leaf":"八オ","text":"環堵蓽門　禮儒有一畝之宮環堵之室蓽門圭竇蓬戶甕牖\n四壁　司馬相如居徒四壁\n蓬蒿　張仲蔚所居蓬蒿沒人\n白社　董威輦常宿洛陽白社中時乞於市\n蝸舍\n席門　陳平\n立錐　史孫叔敖爲楚相及死其子無立錐之地\n懸磬　室之\n繩樞　之子\n陋巷　顏子\n蓬戶不完　原憲\n蒿萊之下　且甘原憲之貧\n單陋　范丹字史雲草室居之所居單陋\n隘陋"},{"id":"juan7-028","source":"正文","juan":"卷第七","menu":"貧第十一","sub_menu":"〇衣　附貧門","page":"二八七","leaf":"八オ","text":"惡衣　恥惡衣惡食者未足與議\n易衣而出　禮\n藍縷　敝衣\n風塵化緇　古詩京洛多風塵素衣化爲緇\n百結　董先生衣百結\n縕袍（衣敝縕袍與衣狐貉者立而不\n恥者其由也與）\n被褐　帶系\n牛衣　王章貧臥牛衣\n懸鶉　子夏之衣\n蓋衣圖寒　文子\n無表肘見踵決　莊子曾子在衛縕袍無表十年不制衣正冠而纓絕捉襟而肘見納履而踵決\n衣無卒歲之虞　食無兼晨之畜\n人生到此　天命何知"},{"id":"juan7-029","source":"正文","juan":"卷第七","menu":"貧第十一","sub_menu":"〇食　附貧門","page":"二八八","leaf":"八ウ","text":"惡食　注見上\n一簞食　一瓢飲\n飲水曲肱而枕之　樂亦在其中矣\n餅日而食　禮言二日用一日食\n塵甑　范丹甑中生塵釜中魚躍\n擔石之儲　魏志華歆清貧家無擔石之儲\n絕糧　子在陳絕糧從者病莫能興\n霖雨　莊子子輿與子桑友霖雨十日子輿曰子桑殆病矣裹飯往食之\n十旬九食　子思\n甘藜藿　文選\n充虛接氣　文子曰聖人食足以充虛接氣也\n菜色\n不舉火　莊子曾子在衛三日不舉火\n糠豆不贍　貢禹妻子\n藜羹不糝\n半菽\n發憤忘食　語\n居唯四壁　　　一瓢\n啜菽　飲水\n菲食　　食"},{"id":"juan7-030","source":"正文","juan":"卷第七","menu":"貧第十一","sub_menu":"〇傭賣　附貧門","page":"二八八","leaf":"八ウ","text":"賣樵　朱買臣賣樵薪其妻恥之請去\n鬻畚　晉書王猛少貧鬻畚爲業\n販繒　灌嬰\n書傭　王高書則傭傭夜則燒博\n傭春　梁鴻字伯鸞傭春\n多能鄙事　子曰吾少也賤故多能鄙事\n傭書　後漢班超家貧常傭書\n又　吳闞澤德潤居貧常爲人傭書以供紙筆所寫既畢誦之亦訖"},{"id":"juan7-031","source":"正文","juan":"卷第七","menu":"賤第十二","sub_menu":null,"page":"二八八","leaf":"八ウ","text":"蓽門圭竇蓬戶甕牖　之人謂貧賤也\n是人之所惡　子曰貧與賤是人之所惡不以其道得之不去也\n邦有道　貧且賤焉恥也\n吾少也賤　故多能鄙事\n朝不坐　宴不與言賤也\n白屋　周公下白屋之士也\n馬　　蘇秦先貴張儀來謁坐於馬　而食之\n爲本　老子貴以賤爲本\n繩樞之子　漢陳涉甕牖繩樞甿隸之人也\n布衣何賤之有\n妨貴　賤妨貴所謂六逆傳"},{"id":"juan7-032","source":"正文","juan":"卷第七","menu":"賤第十二","sub_menu":"〇甘賤　附賤門","page":"二八八","leaf":"八ウ","text":"執鞭　子曰富而可求雖執鞭之士吾亦爲之\n好禮不懾　貧賤而知好禮則志不懾\n君子不辭　子曰君子辭貴不辭賤\n俟命（君子\n居易以俟命）\n不隕穫於貧賤\n樂道　文子曰樂道而忘賤\n有守心　而無淫行\n在約　思純\n雖賤者　是人之所惡\n而貧者　亦士之常\n賤而知命　何必躁求\n貴且在天　豈宜苟得\n降志辱身　柳下惠字展禽\n辱且不驚　老氏之戒\n已而無慍　子文之賢"},{"id":"juan7-033","source":"正文","juan":"卷第七","menu":"志節第十三","sub_menu":null,"page":"二八九","leaf":"九オ","text":"在心爲志\n匹夫　不可奪志\n隱居　以求其志\n詩言志\n子有四方之志\n盍各　言爾志\n願聞子之志　語\n以足志　不言誰知爾志\n過橋而題果乘駟馬　漢司馬相如字長卿蜀郡也有升遷橋相如往長安乃題橋柱曰丈夫不乘駟馬不復過此橋後爲中郎果如志\n入關而歎終擁使車　漢終軍字　　少時入關而歎曰不乘使者車不復出關後奉使南越果乘高車\n宰天下之志　漢陳平少時爲里中社宰分肉甚均父老頭陳孺子之善爲宰平曰使平宰天下亦如之後漢用其策定天下\n埽天下之心　後漢陳蕃字仲舉室有　　不除薛勤曰孺子何不埽灑以待賓客答曰丈夫當埽天下安能事一室乎勤曰\n澄清之志　後漢范滂爲清詔使攬轡慨然有澄清天下之志也\n棄繻　漢終軍字子雲西入關關吏予軍繻軍曰大丈夫西遊終不復還遂棄繻而去後拜謁者持節出關關吏曰此前棄繻生也\n投筆　後漢班超字仲升家貧傭書歎曰大丈夫當效傅介子張騫立功異域以取封侯安能久事筆硯乎後果立功封定遠侯\n鴻鵠之志　史陳勝字涉少與人傭耕乃歎曰大丈夫當富貴誰能與於農夫者也共耕者笑曰若爲傭耕何富貴勝曰燕雀安知鴻鵠之志也\n卿相之盟　史吳起出衛郭門齧臂與母盟曰不爲卿相不復入衛門也後果如其志\n有志無時　後漢趙岐字邠卿與從兄子書曰我死爾乃置一圓石於墓前刻之云漢有逸人姓趙名岐有志無時命也奈何後疾瘳仕至太僕岐本名嘉\n希顏　之志\n慕藺　之志\n成人之所欲　天必從之\n大志遠略\n砥礪名節\n擲版　後漢逢萌給事縣爲亭長尉行過萌候迎拜謁既而擲版歎曰大丈夫安能爲役遂之長安學也\n不爲斗筲（郭泰林宗世貧賤母令給事縣庭林\n宗曰大丈夫安能從斗筲之役遂辭就成皋屈伯彥學）"},{"id":"juan7-034","source":"正文","juan":"卷第七","menu":"隱逸第十四","sub_menu":null,"page":"二九〇","leaf":"九ウ","text":"高尚其事\n退藏於密\n中清　身中清廢中權\n養素　　守道自貴\n潔身避地\n樂天\n德成而上　樂在其中\n作者七人\n隱居　以求其志\n逸人放言　不言世事論語\n隱居　言\n夷齊　巢許\n避秦　桃源\n蓬蒿　張仲蔚隱居蓬蒿沒人\n小隱　隱山藪\n賣藥　後漢韓康字伯休賣藥不二價長安女子從買藥休執價不移女子曰君乃韓伯休邪何不二價康歎曰　其名聞乃遁霸陵山連徵不至竟不復出\n採薇　史伯夷叔齊不食周粟乃採薇後人詰之餓死首陽山\n名振京師　漢鄭子真不屈其志耕於巖谷中名振京師\n谷口　鄭子真隱居所\n逍遙　放曠\n至人遺物　文選\n慕山林之操　晉陶潛字淵明少慕山林之操行高潔還居山林以琴酒自娛\n外臣　上士\n考槃　在澗\n白駒在谷　隱山\n玄豹隱霧　　　　　　　隱\n嘉遯　肥遯\n終身不仕　禮\n名因跡晦　　以道尊\n遺形塵累　反性\n逃名\n畢婚嫁　向長字子平\n變姓名　梅福\n自謂羲皇之人　　　　之\n獨善其志　禮君子之道闇然而日章\n非時不見\n韜跡匿光　韜聲藏影\n方外之人\n高名　　行\n率性\n遁世無悶　易遁世無悶\n蒙以養正　易\n吉月德　養德\n棲遲　衡門之下可以棲遲偃仰\n離俗抱真\n渾沌之術　孔子曰彼假修渾沌之術者也\n手知之\n蜀嚴沉冥　漢書蜀嚴君平沉冥\n四皓　四人\n采紫芝　四皓采紫芝商山\n不知視車駕　　　　　　之有一丈夫耕　　知故帝問之不識事焉云云不告姓名\n隱居之服　老有隱居之服梁鴻妻\n蝸牛之廬　焦先孝然作蝸牛廬\n蘇門　阮籍遇蘇門隱者有　　竹實數斛折口而已嘉長嘯而喜\n月犯少微　吳中隱士當之謝敷乃卒\n五柳　陶潛\n三徑　蔣詡歸杜門舍中有三徑\n富春渚　嚴陵往富春渚釣所\n往來胥胥　王良病歸鄉里過友人友人不見曰有忠言奇謀當取大位何其往來胥胥不憚煩者也\n非聘則徵　申屠蟠子龍太尉黃瓊辟不就後會葬瓊名豪譚論莫及蟠在南郊上士與蟠對談別執蟠手曰君非聘則徵不久當相見上國蟠作色拂衣而去\n鴻飛冥冥　弋者何慕高道不仕也\n刺史贄　後漢臺佟孝威刺史行部執贄見曰孝威居身如是甚苦終曰幸得保性命使君居多勞之立不百不苦耶\n露寢　魏志高士傳焦先字孝然結草爲廬於河間後野火燒之乃露寢雪中袒臥人視之竟熙故後至百餘歲乃卒矣\n編草爲裳　魏孫登公和無家屬土窟中居夏則編草爲裳冬則被髮\n人中龍　晉宋纖字令艾隱居太守馬岌又具威儀鐃鼓造之纖不見岌歎曰名可聞身不可見德可仰形不可覩人中龍也\n宋視母疾　晉夏統字仲御隱居不與親戚相見後母疾頸侍藥宗族因得見\n勑斷家事　向長字子平建武中嫁娶畢勑斷家事勿復相關當如我死遂肆意與同志好禽慶遊五岳名山而不知所終\n門室有名　稱　君道在　　　家丘自號嘉丘子門曰歸厚之門室曰貞然之室\n素履　守道自貴\n人各有能　任其性\n斯遠暴慢　於焉逍遙\n辰祥降靈　山河叶瑞\n味太玄而拔俗　守虛白而辭拳\n洗耳潁川　巢由洗耳潁水\n垂綸\n俯臨盤石　仰劉貞松\n名利不混其情　榮辱匪易其操\n攀桂　攀桂枝\n勿翦　　有\n衣荷製芰　早嘉貞亭\n亭亭朝月　遠照山暮\n肅肅清風\n應曜　上南淮人自國武王左僻曰邪晉應韶或之孫也漢有應曜隱於淮陽山中與四皓俱徵曜獨不至時人謂之曰南山四皓不如淮陽一老八代孫應劭集解漢書云"},{"id":"juan7-035","source":"正文","juan":"卷第七","menu":"隱逸第十四","sub_menu":"〇大隱　附隱逸門","page":"二九一","leaf":"十オ","text":"朝市　大隱朝市\n牆東　後漢王君公遭亂不仕儈　　　牆東也\n降志辱身\n同塵　和光\n薄遊　子劉\n不貴軒冕之榮　　林之趣\n自樂山\n捕捉　　弟　志人世皆信其德本守遣使奉詔不告太守根使捕捉吏曰子康賢天下之所知　與人敬往必不獲勞山民果相率持兵拒吏殺傷而還\n子真隱於吳市（梅福字子真隱\n變姓名爲吳市門卒）\n曼倩遊於漢朝　東方朔字曼倩\n韜光　混俗\n隱跡出處　與道沉浮\n貞不絕俗\n隱不違親　范汪美哀閔也\n吏隱　老聃柱史\n王喬爲葉令\n君平之居卜肆\n於陵灌園\n樂吾賤\n隱乎爾\n假息藩籠\n鼓刀　朱亥\n夷門　侯嬴\n被髮　董京字威輦至洛陽行吟常宿白社之中時乞於市里之間得碎繒結以自覆得金帛佳錦則不受孫楚數就白社與語遂歸而不肯也\n坐嘯\n跡　後漢郭林宗　　　不爲危言覈論賓客來問\n築土自周　後漢袁閎　　　黨事將作閎遂散髮絕世欲投深林以母老不宜遠遁乃築土室四周於庭不爲戶自牖納食旦於室中東向拜母　　　　　要子萬錢見之矣\n似狂　向栩字甫興少爲書生卓詭讀老子狀如學道又似狂被髮著絳綃頭常於竈北坐版床久有膝踝之處不語人來候而不視之"},{"id":"juan7-036","source":"正文","juan":"卷第七","menu":"徵聘第十五","sub_menu":null,"page":"二九二","leaf":"十ウ","text":"不起　附\n以席　求之\n軟輪　聘之\n用之則行　語舍之則藏\n有道則見　無道則隱\n安車　漢四皓高潔山惠帝爲太子　　易書早納家車欲以爲客乃出\n德成而上　　在其中\n旁求　俊彥\n叢譜　　天下\n玄豹隱霧\n白駒在場　亦且\n旌弓蒲帛翹車　翹翹車乘招我以弓往聘士之車古者聘士以弓也\n賁帛　易曰賁于丘園束帛戔戔\n蒲輪\n鶴書　　生\n賢遺林藪丘園　　賁于丘園\n將弘濟濟之多　士在斯覺之器\n靡之好爵　吾有好爵吾與爾靡之\n在谷反門\n聘以尊賢　仕進之門仕而貴義\n舉逸人　天下之人歸心焉\n辭命\n沽諸　求善賈而沽諸\n身勸爲之駕　高祖有稱賢德者長吏必身勸爲之駕身自往勸以車駕而遣之\n以爲駕　　　　　賢龔勝曰竊見國家徵　　　　　　帝曰大夫乘我車來耶勝曰非唯部爲駕也\n羔鴈成羣　陳寔父子世　三公　　書同日至羔鴈成羣當世　之\n致禮徵遣　黃憲聘辟不就有司以禮遣之乃至\n初\n不起後應　　　召不至東平王蒼爲驃騎將軍辟而應焉後朝會獻之對曰先君秉德以臨下故臣可得不來驃騎執德以檢下故臣不敢不至月餘卻歸\n又　李喜累辟先公以禮見待三府不就景帝命爲從事中郎引見曰先君辟君不應今至何也對曰先公以禮見待喜得以禮進退明公以法臨下故不敢不來\n席上　禮儒有席上之珍以待聘席鋪陳也陳上古之道\n含識治國　白虎通天子聘求士者含識治國之道\n三旌之禮　聘士之禮\n續食　武詔民有明當世之務習先聖之術者縣次續食與計偕\n式廬　魏文侯過段干木之廬必式之\n往來胥胥　見隱逸門注\n奪牛　蒲韓康伯休桓帝徵不得已辭安車自乘柴車冒晨先使者行亭長以韓徵君當過發人牛治道見康以爲田叟也奪其牛康釋駕與之使者至曰奪牛翁即徵君也\n夢求人\n夢得　高宗夢得說詔曰夢帝賚予良弼其代予言乃審厥象營求諸野說築傅巖之野惟肖\n聘丘園之耿介　辟郡國之賢良選\n就賢辟命\n皎皎白駒　食我場藿\n五反伊尹　史伊尹隱居使人聘之五反然後肯\n三謁孔明　徐庶謂先主曰諸葛孔明臥龍也可就見不可致屈先主遂詣見凡三\n失望　　　　　　　　　　　詔責郡縣郡縣遣上道到猶稱疾彊輿入殿猶不屈使謁大醫　　　　　　天子　　賜几杖拜五官郎將謂者勸爲必不降志及引問又無　　　　帝失望"},{"id":"juan7-037","source":"正文","juan":"卷第七","menu":"徵聘第十五","sub_menu":"〇不起　附徵聘門","page":"二九三","leaf":"十一オ","text":"迷邦　陽貨謂孔子懷其寶而迷其邦可謂仁乎\n鳥獸不可與同羣　孔子曰\n不降其志　不辱其身者伯夷叔齊與\n願守所志　後漢周黨字伯況好清節被徵不得已乃著短布單衣穀皮綃頭及引見伏而不謁因陳願守所志帝許之也\n不辱其身　注見上\n洗耳　許由隱於箕山堯聞其賢聘爲九州長由聞其聲乃洗耳於潁川之側\n唐堯高許由之風　注見上\n漢帝重嚴陵之志　後漢嚴光字子陵光武欲授之官光武曰昔帝堯大聖許由洗耳於河濱今臣欲效箕山之操陛下遵帝堯之跡光武乃重之\n宜敦高尚之風　　　尊臣夫之志\n雖全獨行　儒有獨立特行\n且亂大倫　子路曰不仕無義欲絜其身而亂大倫\n名\n下啓曰名儀我　位　我\n抗高尚之風　則矯俗\n宜遇休明之日　安可遯邦\n不仕無義　非仕　邦\n不事王侯　高尚其事\n終辭三徵之禮　華　五反之命\n樂而無悶　寵則可驚\n遺榮自污　高鳳自言本巫家欲辭辟命復恐不免乃與寡嫂爭田訟\n與夫偃　從公　未若遁迹樂道\n五月白駒之德　亦既逢時\n蘊玄豹之心　猶思避世\n時有昏明　理道詞\n包舒卷　行藏出處\n優詔昇遺物累\n不召之臣　公事詔揚秉卑著益稱疾不至有司劾大不敬正罪周景遂詔等職事以退讓爲高　遜遠　常之望　　遁迹是郡荀進之風明主遠之世必有不召之臣也\n後應聘　注見上\n圖形　後漢桓帝徵姜肱不至遣工畫其形狀肱卧幽室以被韜面竟不出\n慰遣　注見上\n愍勞以官職　昭帝徵涿郡韓福至年老賜帛詔書曰朕愍勞以官職之事大夫其歸修孝悌以教鄉里行道傳舍縣次具酒食侯者及長吏行問八月常賜羊酒衣衾祠以中牢\n持毒藥　公孫述持毒藥徵李業業曰欲　以高位重餌遂飲毒藥而死\n以明自煎　龔勝被王莽徵不食而死有老父來弔甚哀曰膏以明自煎蘭生竟夭天年非吾徒也遂出不知其姓名矣\n詭辭　王莽徵薛方方辭曰堯舜在上下有巢許陛下興唐虞之風臣亦欲守箕山之志莽善其言不彊也\n從吾所好　與子偕隱\n不可詘　李彊爲益州欲　揚雄曰吾真得嚴君平矣雄曰君備禮待之此人可見而不可詘及相見平不敢請爲從事\n不稱臣　後漢王霸字儒仲徵到尚書拜稱名不稱臣有司問其故霸曰天子有所不臣\n偃仰以沐堯曦　棲遲而\n杖藜含糗　　雅符三徑之歡\n飲水曲肱　簞瓢之樂\n閉門　閉門　却掃餘人以\n結宇幽巖　　堪養性\n不事王侯　有　軒冕\n曳尾塗中　楚王使使聘莊周周謂使者曰吾寧曳尾於塗中\n商賈自穢　王烈太守欲以爲長史烈爲商賈自穢得免"},{"id":"juan7-038","source":"正文","juan":"卷第七","menu":"姓氏第十六","sub_menu":null,"page":"二九四","leaf":"十一ウ","text":"舜典曰別生分類　主姓也別其姓\n夏書曰錫土姓　以所生之土\n保姓受民　傳曰若夫保姓受氏以守宗祊世不絕祀無國無之\n請族　傳　　　羽父請謚與族\n因生以賜姓　因其所生以賜姓若舜由嬀汭故陳爲嬀姓\n胙之土而命之氏　報之以土而命氏國陳之類也\n諸侯以字　諸侯位卑不得賜姓故臣因其王父字以爲氏\n爲謚因以爲族　或以先人之謚稱以爲族\n官有世功則有官族邑亦如之　謂取其舊官舊邑之偁以爲族\n展氏　公命以字爲展氏無駭公子展之孫故爲展氏\n因功命氏\n居官以爲姓氏　漢食貨志言武帝初如此倉氏庾氏之類也\n第五　後漢第五倫其先齊諸田徙園陵多以次第爲氏也\n爭先後　晉王導與諸葛恢戲爭族氏王曰人言王葛不言葛王何也恢曰譬如驢馬不言馬驢驢寧勝馬乎\n庶姓　薛庶姓也我不可以後之\n族類賜姓　金日磾七世內侍本以休屠作金人祭天故賜金氏\n以官　漢武時爲吏者而子孫居官者以爲姓氏今倉氏庾氏也\n品官　晉摯虞字仲治撰族姓昭穆十卷上疏進之以爲足備物廣多聞人以爲定品違法司徒劉之詔原之"},{"id":"juan7-039","source":"正文","juan":"卷第七","menu":"姓氏第十六","sub_menu":"〇改姓　附姓氏門","page":"二九五","leaf":"十二オ","text":"推律　漢書京房字君明本姓李推律自定京氏而姓\n指樹　伯陽生於李樹下遂指李樹爲姓\n劉婁之賜　婁敬賜姓劉氏曰婁者劉也\n疎東　晉束晳其先疎姓避亂改姓因去疎之足爲束\n馬矢　大司徒馬宮本姓馬矢後稱馬氏\n張祿　范雎變姓名曰張祿先生\n冒姓　衛青父鄭季給事平陽侯主家與少兒通生青故冒姓衛氏\n又　漢張孟爲灌嬰舍人得幸進之二千石故冒姓灌氏孟灌夫父也\n民無上　吳志氏儀本姓氏孔融嘲之曰氏字民無上可改爲是遂改焉徐衆評曰古之定姓或以所生或以官號或以祖名今離析文字橫生諱忌本誣祖也\n避仇改姓　嵇康本姓奚避仇故改姓爲\n又　嵇康其先姓奚以避怨徙嵇山以爲氏\n又　范蠡浮海出齊易名爲鴟夷子後至陶爲陶朱公\n妨父　晉陳元達字長宏後部人也本姓高以生月妨父故改姓陳\n載鹽　第五倫官未達客河東變姓名稱王伯齊載鹽往來太原上黨所過輒爲糞除"},{"id":"juan7-040","source":"正文","juan":"卷第七","menu":"名字第十七","sub_menu":null,"page":"二九五","leaf":"十二オ","text":"幼名冠字\n正名　名不正則言不順\n男子世冠而字\n父前子名　君前臣名\n名子名以制義（晉穆侯以條之役生太子命之曰仇其弟\n以千畝之戰生命之曰成師師服曰異哉君之名子也夫名以制義義以成禮易則生亂君命太子曰仇弟曰成師始兆亂矣兄其替乎\n子同生　魯侯問名於申繻對曰凡名者有五有信有義有象有假有類\n以名生爲信　若唐叔虞魯公子友\n以德命爲義　若文王名昌武王名發\n以類命爲象　若孔子首象尼丘山遂名\n取於物爲假　若伯魚生有人饋之魚因名之曰鯉\n取於父爲類　若子生與父同日名曰同\n不以國　不以官不以山川不以隱疾不以畜生不以器幣\n以國　則廢名\n以官　則廢職\n以山川　則廢主\n以畜生　則廢祀\n以器幣　則廢禮\n晉以僖侯　廢司徒\n宋以武公　廢司空改司空爲司城也\n魯以獻武廢二山　二山具敖也魯獻公武公故廢二山也\n大物不可以名　是以大物不可以命\n嘉名　楚辭朕皇考曰伯庸肇錫予以嘉名\n三月而名　禮云子生三月父親名之既冠而字之名者所以正體定心意字者所以宗仁義敘長幼\n不以日月山川　禮曰名子者不以日月不以山川\n有文在手　成季生而有文在手遂以命之以友\n又　唐叔虞生有文在手曰虞遂名虞\n孩而名之　禮子生三月父執子之右手孩而名之孩謂撫子頭也\n不敢同名　禮大夫士之子不敢與世子同名\n寤生　鄭莊公寤生驚姜氏遂名寤生也\n名終將諱　傳曰周人以諱事神名終將諱之\n待事而名之　莒越生子將待事而名之楊州之役獲臣名曰楊州叔孫獲長狄僑如因名子曰僑如莒越欲比之\n求名而亡　此謂名之聲之名\n二名非禮　公羊曰仲忌此何忌也譏二名二名非禮也注云難爲諱一字爲名難言而易諱所以長臣子之敬不通下\n君臣同名　公羊叔向曰臣有石惡令曰衛禮惡爲君臣同名君子不奪人之名不奪人之親所名君不黜臣易名所以重父之命也\n小同　後漢鄭玄字忠益有遺腹子玄以其有手文似己名之曰小同\n三明　後漢段熲字紀明與皇甫威明張然明並知名京師稱涼州三明\n二釋　後漢周澤字釋朝孫堪字子釋故京師號二釋\n難犯易避　吳主孫權曰禮名子難犯易避命太子名登　　　　之　也\n因賞（桓彝\n生子溫嶠賞之曰有奇骨具英物遂名之曰溫\n祖有陰德　虞翻祖父爲獄吏有陰德曰吾子孫何必不爲九卿者遂名翻字升卿\n晩有子　賈充父逵晩始生充言後有充閭之慶因名充字公閭\n名失則愆　傳\n依謙　晉王昶文舒爲其子弟作名皆依謙以見其意故從兄子默字處靜沈字處道子渾字仲玄深字道沖遂作書戒之曰以玄虛爲名欲使汝曹稱名思義不違越也熙仲\n應童謠　晉桓豁字朗子聞苻堅國中有謠云誰謂堅石打碎有子二十人皆以石爲名以應之"},{"id":"juan7-041","source":"正文","juan":"卷第七","menu":"名字第十七","sub_menu":"〇同名字　附名字門","page":"二九七","leaf":"十三オ","text":"小冠子夏　漢杜欽字子夏時杜鄴亦字子夏俱有才名欽損目時人號爲盲子夏欽惡其號稱疾見抵更著小冠自別時人因號小冠子夏\n南北玄　吳郡太守張玄之與謝玄同年名亞於玄時稱南北玄\n三明二釋　注見上\n驚座　漢陳遵字孟公　敬所在人懷之唯恐在後時列侯有與遵同姓名者每至門人曰陳孟公座中莫不振動既至而非遵因號其人爲陳驚座\n投杼之疑　曾有與曾子同姓名而殺人者人以告曾子母母織如舊不信之及三人來告投杼而驚起"},{"id":"juan7-042","source":"正文","juan":"卷第七","menu":"名字第十七","sub_menu":"〇改名　附名字門","page":"二九七","leaf":"十三オ","text":"君子已孤　不更名\n慕藺　司馬長卿名犬子慕藺相如之爲人遂改名相如\n改命　楚王曰子文無後何以勸善使復其所改命曰生注云易其名也子文孫克黃也\n變名　梅福變名姓爲吳市門卒\n避難改名　漢後趙岐字邠卿初名嘉生御史臺字臺卿後避難改名字以京兆長陵人示不忘本土也\n因夢改名　魏程昱本名立少時夢上天兩手捧日太祖曰卿當爲吾腹心乃立上加日而爲昱\n改字　諸葛喬字伯松瑾第二子本字仲慎亮未有子求喬爲後瑾啓吳王而遣之故改其字"},{"id":"juan7-043","source":"正文","juan":"卷第七","menu":"諱第十八","sub_menu":null,"page":"二九七","leaf":"十三オ","text":"卒哭乃諱\n聞名心瞿\n終將諱之　傳周人以諱事神名終將諱之\n辭曹　羊祜爲荊州刺史及卒有遺愛故荊州人爲諱改戶曹爲辭曹\n諱新　禮卒哭以木鐸徇于路捨故而諱新注云故謂高祖之諱新謂新死者之諱\n詔王之忌諱　周禮小史王有事詔王之忌諱注忌先王死日諱先王名\n逮事　禮逮事父母則諱王父母不逮事父母則不諱王父母注逮及也云以三廟事祖雖不逮亦諱之\n大夫之所有公諱　避先王諱\n婦諱不出\n門　婦之諱宮中諱妻之諱不舉諸其側\n與君之諱同則稱字\n入門問諱\n名其二諱　國語范獻子聘魯問具敖二山對曰先君獻武之諱也獻子歸告人曰人不可不學吾適魯名其二諱\n請長史諱　晉書王述字懷祖爲揚州長史主簿請諱報曰亡祖先君名播海內內諱不出門餘無所諱\n改選　晉江充叔父春爲宜春令充因上疏曰故事祖父官與名同者皆得改未有身與官職同改選固臣以爲臣子開地春秋不奪人親之義朝廷從之\n同官犯諱　禮志云太元十三年名孔安國爲侍中春以王愉名犯諱不得連署求解有司議云公府無私諱宜公朝私王制屈家禮也王祐許曾是出許外夫皇朝禮大百僚備職偏官列署職相關告者人遂其心則易官易職選從其己\n改郡字　晉咸和元年當徵蘇峻司徒王導欲出王舒爲外援乃拜撫軍將軍會稽內史上疏以父名會不作會稽是朝改字同音異於禮無嫌舒乃求音聲異而字同乞換他郡於是改會爲鄶\n二名非禮\n廢名廢主廢禮廢器廢祀　並見名字門\n奉諱惡　太史典禮執簡記奉諱惡\n王父母兄弟世父叔父姑姊妹子父同諱　父爲其親諱則子不敢不從諱"},{"id":"juan7-044","source":"正文","juan":"卷第七","menu":"諱第十八","sub_menu":"〇不諱　附諱門","page":"二九八","leaf":"十三ウ","text":"臨文　不諱\n詩書　不諱\n廟中　不諱\n二名不偏諱　夫子之母名徵在言在不言徵言徵不言在\n父前子名\n君前臣名　對至尊無大小皆稱名也\n禮不諱嫌名　謂聲相近\n不逮事父母則不諱王父母　謂孤幼不及識父母恩不及於祖比庶人也適士二廟事祖雖不逮猶諱祖也\n君所無私諱　於臣君前不避家諱尊無二也\n大功小功　不諱\n士於大夫之所有公諱\n無私諱　不敢自諱\n凡祭　不諱\n教學　不諱"},{"id":"juan7-045","source":"正文","juan":"卷第七","menu":"報德第十九","sub_menu":null,"page":"二九八","leaf":"十三ウ","text":"無德不報\n何以報德\n厚報\n求仁得仁\n以德報德　則人有所勸\n大惠　敢忘大惠\n欲報之德\n惠不可棄\n寬身　以德報怨則寬身之人也以怨報德則刑戮之人也\n修舊好也\n重施而報　子桑曰重施而報君將何求重施而不報其人必携携而討之離也\n背施　無親\n三施而無報　晉羅謂奏閉\n何以報我　何以報君\n報者倦矣　施者未厭\n背惠　忘舊\n仁不遺舊\n不敢忘德\n感國士之恩\n人惟求舊\n施報　禮曰太上貴德其次務施報\n禮尚往來　禮曰往而不來非禮也來而不往亦非禮也\n不望其報　儒有推賢而進達之不望其報禮\n小人懷惠　語\n報余　莊子\n忘我道不虛行　仁無遺舊\n故人念舊　感恩\n忘我實多　則吾豈敢\n瓊瑤　木瓜美齊桓公也衛有狄人之敗齊桓公救而封之衛人思欲報厚之云投我以木瓜報之以瓊瑤投我以木李報之以瓊玖匪報也永以爲好也\n鬼結草　晉魏顆見老人結草以抗杜回杜回秦將也夜夢之曰子是所嫁婦人之父也爾用先君治命余是以報之\n三舍　子犯曰微楚之惠不及此退三舍避之所以報也\n一餐　戰國策楚王伐中山中山君亡有二人執戈隨其後二人曰臣之父嘗餓君以一餐餔之父死且曰中山有事汝必死之\n一飯　范雎云一飯之恩必償\n餓人　宣子舍於翳桑見靈輒餓不食三日矣與簞食既而爲公介倒戟以禦公徒而免宣子問其故乃翳桑之餓人也問其名居不告而退遂自亡言其不望報也\n僖妻之饋公子　晉公子重耳至曹僖負羈之妻而饋盤飧寘璧焉後晉侯伐曹令無入僖負羈之宮而免其族報施也\n綈袍　范雎寒須賈取綈袍遺之後云吾不殺汝以汝有綈袍之恩也\n報國士　豫讓曰范中行以衆人遇我我以衆人報之智伯以國士遇我我以國士報之\n絕纓之臣　竟苦恩於楚主\n啖炙之士　終酬德於翳桑\n蛇銜珠　隨侯見傷蛇以藥治之後銜夜光珠以報恩\n龜顧印　見印綬門注\n客泣珠　泉客宿將去泣珠於盤以酬主人\n雀持環　後漢楊寶見病雀憐之因將歸置巾箱中採黃花食之　　愈命恩去曰爲黃衣少年持玉環來報之\n綈袍雖薄　尚繫須賈之仁\n簞食且微　終酬宣子之惠\n盜駿之臣　敢奏君之難\n生死骨\n肉　傳遠子馮曰吾見申叔夫子所謂生死而骨肉也\n褚中　荀罃在楚鄭賈人將寘褚中以出既謀而未行而楚自歸之賈人如晉荀罃善待之如實出己\n投金於承塵　後漢雷義常濟人於死罪後以金二斤謝之義不受金主嘿然乃投金於承塵而去\n蔑我大惠　傳\n報生以死報死以力\n制服祭祀　韋御遇喪亂親屬并盡客遊洛陽素聞應詹名遂託焉詹與分甘共樂情若兄弟遂隨積年爲營伉儷置居宅并薦於元帝帝辟公府後御至少府詹卒感生成之恩遂爲詹制朋友之服哭止宿草也\n父事　張蒼當斬王陵言赦之及貴常父事陵陵卒後蒼爲丞相洗沐朝陵夫人上食然後歸\n祠以賓位　李固既誅門生王成匿其少子燮得免成卒燮以葬之每節爲設上賓之位而祠之"},{"id":"juan7-046","source":"正文","juan":"卷第七","menu":"謝第二十","sub_menu":null,"page":"三〇〇","leaf":"十四ウ","text":"展謝\n叔向不謝　祁奚之免己傳\n晏子贖越石父　史越石父賢在縲紲晏子解左驂贖之載歸不謝而入門石父請絕晏子攝衣謝之延爲上客矣\n恨謝　漢張安世薦士士謝之大恨不爲通\n爲國　魏陳羣言劉曄於太祖太祖赦之曄深德羣羣曰議刑爲國非爲私\n拜官公門謝恩私室　非義也張安世云\n不謝　范滂孟博繫獄霍諝理之免後詣諝不謝或譏之滂曰叔向祁奚云云"},{"id":"juan7-047","source":"正文","juan":"卷第七","menu":"夢第二十一","sub_menu":null,"page":"三〇〇","leaf":"十四ウ","text":"吉夢維何　維熊維羆\n夢美　傳宋得臣曰予夢美必立\n我夢　乃占我夢\n吾夢　傳吾夢如是\n爾何夢矣　文王謂武王曰\n無夢　文子曰至人其寢無夢\n休徵　各徵\n髣髴若夢　文選\n胡蝶　莊子夢爲胡蝶栩栩然乘\n夢友死　范式字巨卿與張元伯爲友巨卿病卒夢元伯曰吾其某日葬子能相送乎及葬柩不進母曰必待張元伯元伯至柩乃進\n論夢　衞玠問樂廣夢云是想玠曰形神不接而夢豈是想玠思之經日不得成疾廣故命駕往剖析之則愈廣歎曰此賢胸中必無膏肓之疾也\n又　或問殷浩曰得位而夢棺得錢而夢糞何也浩曰官本臭腐故得官而見屍錢本糞土故得財而夢穢時以爲名言\n爲草蟲書　王隱晉書唐璩夢蟲繞身遂效其形而作草蟲之書\n夢協　二人\n爲同夢　詩甘與子同夢\n魂交　莊子云其寐也魂交其覺也形開\n占六夢之吉凶（周書六夢想發\n惡偕喜懼）\n候五旬之虛實　列子曰西極有人不食不衣而多眠五旬一覺以夢中所爲者爲實\n堯舜上聖符域內之休徵　夢書曰堯夢乘青龍上太山舜夢擊鼓\n桀紂下臨作冢中之不軌　桀夢黑風破其宮紂夢大雷擊其首也\n刺出眼中遂獲金鐶之報　述征記陳留周氏婢入山採樵夢見一女曰吾眼中生刺乞拔之當厚報汝婢乃於朽棺中見髑髏草生眼乃拔之即於棺得金鐶一雙\n角生頭上旋聞刀用之災　蜀魏延年\n丞相長男掘得錢而被買　幽明錄丞相茂弘夢人欲以百錢買大兒長豫後掘得一窟錢其數百萬長豫無病而死\n秣陵陶令枉殺人而致殂　述征記陶繼爲秣陵令枉殺樂伎後夢伎來曰訴天得理今來相取遂跳入口中繼斯須而死\n賈弼易頭之時文章可玩　幽明錄賈弼夢見人曰愛君美顏欲易君頭弼許之後能半面笑半面啼兩手把筆文辭各異\n謝奉說夢之日凶具被殛　搜神記謝奉與郭　　善夢郭與人爭錢因溺水死奉爲凶具即往郭處具說郭曰吾昨夜夢與人爭錢惆悵不語奔廁而死奉爲凶具一如前夢\n●吉夢　附夢門\n得說　書高宗夢得說乃營求諸野曰夢帝賚予良弼說築傅巖之野惟肖\n九齡　武王曰夢帝與我九齡\n男女之祥　吉夢維何維熊維羆男子之祥維虺維蛇女子之祥\n徵蘭　鄭伯妾燕姞夢天使與己蘭曰妾不才幸而有子將不信敢徵蘭乎文公曰諾生穆公名之曰蘭也\n周公　孔子曰吾不復夢見周公\n龜因解網　宋元君\n魚求去鉤　武帝\n感諸豐年　詩牧人乃夢大人占之衆維魚矣實維豐年旐維旟矣室家溱溱豐之兆也\n天樂　秦穆公夢遊天上觀鈞天廣樂帝錫賜命秦遂大昌\n懷蛟　董仲舒\n吐鳳　揚雄作甘泉賦成夢吐白鳳\n授筆　江淹夢長五色筆文辭日麗\n吞鳥　羅含夢吞五色鳥辭學乃日新\n日入懷　孫志夢日入懷中而生策\n松生腹　吳丁固夢松生腹上占夢曰松十八公也後十八年當爲公\n三刀　王濬夢三刀後爲益州刺史\n爲鳥　宋昭公夢爲鳥咮加於南門尾加於北門曰予夢必立\n樹梓　周書太姒夢見商之庭產棘小子發取周庭之梓梓化爲松柏棫柞驚寤告文王文王召太子占之於明堂王及太子發並拜吉夢受商之大命於皇天\n腸繞吳門　孫堅母夢腸繞吳昌門覺　鄰母曰安知其非吉徵也\n吞三爻　虞翻　　易注奏上白臣郡吏陳桃夢臣與道士相遇放髮被鹿裘布易六爻撓其身其三以飲臣臣乞盡吞之道士曰易道在天三爻足矣豈臣當受經也\n吞三穗　蔡茂字子禮夢坐大殿極上有三穗禾茂取中穗輒復失問主簿郭賀賀曰殿而有禾人臣上祿也中穗中台也禾失爲秩君其爲公果如言矣\n●凶夢　附夢門\n豎牛　叔孫夢天　牛卒以餓死\n曹人社宮　傳曹人或夢衆君子立於社宮而謀亡曹曹叔振鐸請待公孫彊許之\n聲伯涉洹　傳聲伯夢涉洹而歌曰濟洹之水贈我以瓊瑰懼不敢占之三年而後言言之至暮而卒\n兩楹之奠　子曰余疇昔之夜夢坐奠於兩楹之間予殆將死矣遂寢疾七日而沒\n白虎　史秦二世夢白虎齧左驂　曰涇水爲祟\n黃熊　傳晉侯有疾夢黃熊入于寢門子產曰黃熊鯀化入于羽淵晉侯祀夏郊疾乃有間\n首懂土塊　　　　　佃死\n肉桂車　　　　　而崩　　而揚\n二豎之災　晉侯病夢二豎子曰居肓之下膏之上其奈我何\n咎徵惡夢　周禮\n妖夢是踐　秦伯執晉侯云赤晉之妖夢是踐"},{"id":"juan7-048","source":"正文","juan":"卷第七","menu":"夢第二十一","sub_menu":"（續）","page":"三〇二","leaf":"十五ウ","text":"歲在辰　鄭玄夢孔子告之曰起起今年歲在辰來歲在巳既寤知命將終有頃寢疾其年六月中卒\n夢賦　王延壽字文考曾有異夢意惡之乃作夢賦自厲後溺水死年二十\n山上有水　魏鄧艾伐蜀夢坐山上有水流問爰邵邵曰山上有水蹇蹇利西南往有功也不利東北其道窮也往必克蜀其不還者乎\n井中生桑　蜀何祗夢井中生桑趙直曰桑非井中物井中非桑生之所桑字四十八恐君壽不得過此祗曰足矣\n●占夢　附夢門\n乃占我夢\n大人占之\n召彼故老　訊之占夢\n張奐問兮象覓爲大郡之徵　後漢張奐字子禮夢象　　爲不善問萬推推曰君當爲大郡而不善終象大獸也獸守也象以爲狩後爲笑內史爲遷所害\n蔣琬占牛卒踐上公之位（蜀蔣琬字公琰夢有一牛頭在\n門下流血滂沱趙直曰見血者事分明也牛角及鼻公字之象位當至三公果爲中書令）\n吉凶　之兆\n休咎　之徵\n六夢　周禮占夢以日月星辰占六夢之吉凶謂以日月會合辰參之以占夢也一曰正夢謂無所感動平安自夢二曰噩夢噩驚也謂驚愕而夢也三曰思夢四曰寤夢謂覺所道而爲夢也五曰喜夢謂喜悅而夢六曰懼夢謂恐懼而夢季冬王夢聘問獻吉夢於王拜受之獻羣臣之吉夢也乃舍萌于四方以贈惡夢注云舍萌釋菜也贈送也\n得天　傳晉侯夢與楚子搏楚子伏己而盬其腦子犯曰吉我得天楚伏其罪吾其柔之\n射月　傳晉呂錡夢射月中占之曰姬姓日異姓月也必楚王也\n聲伯夢涉洹　見凶夢門\n夢中占夢　莊子長梧子謂瞿鵲曰夢飲酒者旦而哭泣夢哭泣者旦而田獵方其夢也不知其夢也夢之中又占焉無異寤也固乃非常人之所知\n水邊女子　鄧勝爲淮南太守夢行水邊見女子猛獸自後斷其盤囊占者曰水邊女汝字也斷盤囊者新獸頭代故獸頭也不作汝陰作汝南太守也後漢時\n二棺　後漢李充夫人夢天落二棺於充前問索紞曰棺者職也當有人舉君二官再遷果然\n虜脫上衣　李充又見一虜脫上衣來詣紞紞曰虜去上男字也夷狄陰類君婦當生男也果如其言\n內中有人打　宋桶夢內中有人打著赤衣桶手把兩赤杖極打之問索紞曰內中有人肉也兩赤杖者箸也極打之君必遇飽肉食也\n二角　　　夢東有二角　殺大角折敗小角有毀一在前一在後也紞曰大角折敗府棺也小角有毀所謂也一在前凶也一在後背也當有凶背之問後三日凶問果至\n咬鞹　張凝字使夜夢狼咬一腳紞曰肉被咬文爲解字當不行不應命而卒\n立冰上　崔鴻三十國春秋曰令狐策夢立冰上與冰下人語紞曰冰上爲陽冰下爲陰冰上與冰下人語爲陽語陰媒介事也士如歸妻迨冰未泮君其爲人作媒乎策曰老夫耄矣不爲媒矣俄而太守田豹因策爲子求張女洽至仲春而成婚\n芻狗　魏志周宣字孔和太史問宣夢見芻狗得飲食又云夢見芻狗曰當墮車折脚又云夢見曰有火災皆驗太史曰三問之皆不夢卽試君爾何以皆應曰神靈祐君與夢無異\n帶夫印綬　張奐爲武威太守妻夢　　帶夫印綬登樓占者云當生子復臨此郡命終此樓果然\n馬舞　黃平夢屋中馬舞數十人向馬拍手索紞曰馬火也馬舞火起也向馬拍手救火也平未歸而火發"},{"id":"juan7-049","source":"正文","juan":"卷第七","menu":"寢第二十二","sub_menu":null,"page":"三〇三","leaf":"十六オ","text":"乃寢乃興\n乃安斯寢\n北堂　安寢北堂上\n晝寢　宰予晝寢子曰朽木不可雕也糞土之牆不可汚也於予與何誅\n夜不寢　子曰終日不食終夜不寢\n寢不言　論語\n寢不尸　尸伸手足如死人\n安身　傳夜以安身\n夙興夜寐　孝經\n邊孝先之嘲　後漢邊韶字孝先教授數百人曾晝日假卧弟子私嘲曰邊孝先腹便便懶讀書但欲眠韶答曰邊爲姓孝爲字腹便便五經笥寐與周公通夢靜與孔子同意師若可嘲出何典記嘲者大慚\n寢無伏　伏面覆也禮\n東首　禮君子寢恒東首東首生氣\n寢衣　論語必有寢衣長一身有半\n尚寐無覺　詩云　　而假寐\n假寐　趙盾盛服將朝尚早坐而假寐鉏麑曰不忘恭敬民之主也\n明發不寐　詩\n輾轉　　　而不寐"},{"id":"juan7-050","source":"正文","juan":"卷第七","menu":"遊俠二十三","sub_menu":null,"page":"三〇四","leaf":"十六ウ","text":"意氣　史記意氣高作威於世謂游俠\n惡少　漢昭帝元鳳五年發三輔及郡國惡少年以戍遼東\n英雄閭之賊　西京賦\n遊俠之場\n結客少　年場\n輕死重氣　結黨連羣\n殺吏報仇　漢書長安　　多少年　　殺吏受財報仇相與探丸爲彈得赤丸者斬武吏黑者斬文吏城中薄暮塵起剽劫死傷橫道及尹賞爲長安令乃穿地爲　　　名爲虎穴捕羣盜內穴中數日發其屍相枕藉而死\n幽并之俠　曹子建詩借問誰家子幽并遊俠兒\n張趙之倫　並俠客見文選\n劇孟之俠　漢書劇孟洛陽人以任俠知名\n季布之諾　漢書季布任俠立然諾之信氣蓋關中\n俠客　少年\n連交　合衆\n節慕原嘗　名亞春陵四公子也文選\n結儔　附黨\n五陵之俠\n豪家俠右　長\n感分遺身　七啓曰雄俊之徒交黨結倫輕生求名重氣感分遺身此乃俠之徒\n賈勇\n然諾　則黃金不易\n失意　則白刃相讎\n燕市　荊軻飲燕市\n夷門　侯嬴夷門抱關\n操丸之俠　劇孟之儔\n杯酒間　古詩失意杯酒間白刃起相讎\n背公死黨　謂六國時背公死黨之議成守職奉上之義廢漢興秦以匡正游俠序\n言信行果　太史公曰游俠行雖不軌然猶言必信行必果\n知禁反\n正　非明王在上示之以好惡齊之以禮法民曷由知禁而反正\n四豪　六國之罪人謂孟嘗等四公子\n殺身亡宗　郭解之倫匹夫之細竊生殺之權觀其溫良汎愛振窮周急謙退不伐亦皆絕異之資惜乎不入於道德放縱於末流殺身亡宗非不幸也並游俠傳序\n藏活豪士　魯朱家藏活豪士以百數陰脫季布於厄及布貴終不見\n劇孟　周亞夫至河南得劇孟曰七國舉事而不求劇孟吾知其無能爲已母死送車千乘而家無十金之産\n郭解　字翁伯軹　悍賊少藏亡命作姦剽攻劫鑄錢掘冢年長乃改節以德報怨姊子爲人所殺賊窘自歸解解曰吾兒不直遂不罪其賊以此時人皆高義之解出入人皆避　　　　未嘗　　入縣廷　　子甥　頭公孫弘曰解以布衣以睚眦殺人解不知罪甚其遂族解之\n氣蓋關中　季布弟心　長　　　　　　　　盡關中少年任俠者竊其名以行者衆也\n不以親爲解　袁盎家居劇孟嘗過盎盎厚待之人謂盎曰劇孟博徒也將軍何自通之盎曰孟急人之急造其門不以親爲解\n橫潁川　灌夫交通豪傑橫於潁川潁川之人歌曰潁川清灌氏寧潁川濁灌氏族\n推埋　王溫舒少時推埋爲姦\n借客報讎　　　　　　　　　　輕俠借客報讎驅馳險阻\n權行州里　力折公侯\n柳市　萬章字子夏居長安柳市"},{"id":"juan7-051","source":"正文","juan":"卷第七","menu":"故舊第二十四","sub_menu":null,"page":"三〇五","leaf":"十七オ","text":"東平舊人今閒中\n故舊　不遺則民不偷\n不棄　故舊無大故則不相棄也\n求舊　人惟求舊\n半面　　　之\n敬故　周禮太宰以八統御萬民二曰敬故謂不遺舊\n久要　子曰久要不忘平生之言\n原仲季友　傳曰季友如陳葬原仲仲季友之舊也\n恤養故人　樓護君有故人呂公無子歸護護身與呂公妻呂嫗同食及護居妻子頗厭呂公護責曰呂公以故舊老窮寄身於我義所當奉遂養呂公終身"},{"id":"juan7-052","source":"正文","juan":"卷第七","menu":"卹孤第二十五","sub_menu":null,"page":"三〇五","leaf":"十七オ","text":"託孤　可以託六尺之孤\n託妻子　後漢朱暉南陽人張堪素有名稱嘗於太學見暉甚重之接以友道把暉臂曰欲以妻子相託堪卒妻子貧暉往候視振贍之\n崔琰　魏崔琰友人公孫方宋階早死琰撫其孤遺恩若己子\n兄子　毛玠　布衣蔬食撫兄孤子甚篤學\n饒　吳凌統爲將軍有功卒二子孫權收養宮中愛待與子同十日一乘　　馬會羣臣常召統子出示之曰吾虎子\n山公無\n嵇紹　嵇康臨刑謂子紹曰山公尚在汝不孤矣\n分屋居　張禹字君　與楊恭善及恭早卒恭遺孤成人禹與分屋居事恭母恭子長爲娶婦　　　　　　　門戶經恤故舊縣贈襄宗行義至甚也\n分食邑　魏曹真字子丹少與宗人曹遵鄉人朱讚並事太祖二人早亡真乞分所食邑封遵讚子詔褒美之賜分邑二人子爲關內侯食邑百戶\n字人之孤王成　臣李\n恤孤　上恤孤則人不倍\n養幼少存諸孤"},{"id":"juan7-053","source":"正文","juan":"卷第七","menu":"戲謔第二十六","sub_menu":null,"page":"三〇六","leaf":"十七ウ","text":"善戲謔兮　不爲虐兮\n謔浪笑敖　中心是悼\n伊其相謔　士與女\n戲譚　玩人喪德\n狎侮　君子罔以\n前言戲之爾　謂割雞焉用牛刀之言論\n好弄　傳夷吾弱不好弄好弄戲也\n恭謔　文選鄒陽　　　　　　　　何\n不常矜莊　鄭玄詩箋云君子之德有張有弛不常矜莊故有戲謔之爾\n解客嘲　揚雄草玄之尚白\n孟堅之答賓戲\n孝先晝寢　弟子　侯寢之謂\n言偃絃歌　作宰發割雞之戲\n鍾馬有利鋒之戲\n士龍有白雉之嘲　陸雲與荀隱語曰既開青雲覩白雉何不張爾弓布爾矢荀曰本謂雲龍騤騤乃是山鹿野麋獸弱弩彊是以發遲\n天子無戲言　史王云周公請不敢戲成王設也\n受侮　不少\n旁狎　禮不旁狎旁猶妄也狎僞玩也\n戲色　禮曰不戲色\n靳之　宋萬歸宋宋公靳之曰始吾敬子今子魯囚也吾不敬子矣萬病之殺宋公注戲而相狎曰靳也\n狗門　晏子短小使於楚楚人爲小門延晏子晏子對曰使狗國者從狗門而入臣使楚不當從狗門而入\n縛盜　又　盜置晏子之前楚王謂晏子曰齊國人也善盜乎晏子曰臣聞橘生江南北則爲枳葉徒似而味不同水土異也此人生於齊不盜入楚爲盜得無水土爲盜耶\n諸葛子瑜　吳諸葛瑾字子瑜面長似驢吳王使優人牽驢入題其上曰諸葛子瑜瑾子恪跪乞筆益兩字曰之驢人使其敝據即以驢賜恪\n白頭翁（吳諸葛恪侍坐有白頭鳥集殿前權曰此何鳥恪曰白頭翁張昭年老疑恪戲之因曰恪欺陛下未有鳥名白頭翁請復白頭母恪曰鳥有鸚母未請鸚父相對也此有與不\n累張昭有悟於聽聞）\n好狎　不好狎\n納侮　無啓寵納侮書\n行前後　晉孫綽與　好戲調與習鑿齒共行綽在前顧謂習曰沙之汰之瓦礫在後習曰簸之揚之糠粃在前\n潞涿君　劉璋有從事張裕饒鬚先主嘲之曰昔涿縣多毛姓東南西北盡毛繞涿郡裕曰昔有作上黨潞長遷涿令去官還家人與書欲署潞則失涿署涿則失潞乃署潞涿君先主無鬚故有此答\n以先祖相譏　賈充嘗宴朝士庾純後至充曰君行常在人前今何在後純曰旦有小市井事不了是以來後純之先曾爲伍伯者充之先爲市魁者故此相譏\n侮予　或敢侮予"},{"id":"juan7-054","source":"正文","juan":"卷第七","menu":"笑第二十七","sub_menu":null,"page":"三〇七","leaf":"十八オ","text":"莞笑　語莞\n載笑　言載\n咥其笑矣\n巧笑倩兮\n輾然而咍\n莞爾而笑\n夫子何哂\n掩口而笑\n笑不至哂　父母有疾笑不至哂哂不露齒\n謔浪笑傲\n一笑千金\n樂然後笑\n人不厭其笑　公叔文子\n胡盧宜笑　既含睇兮注宜笑齒白也楚辭\n先笑　而後號咷\n頭沒杯案　魏太祖嘲人譁論戲弄盡無隱諱及歡悅大笑至於頭沒杯案中餚饍皆汙於巾幘也\n笑疾　陸機見張華華令雲來機曰雲有笑疾及雲至見張華華以　　　　顯雲見大笑不止又著衰絰上船見水中影因大笑落水救之免死\n必笑　傳曰解人法笑\n哂之　夫子哂之\n宴笑晏晏　言笑晏晏詩\n啞啞　笑言啞啞易\n嘻嘻　婦子嘻嘻終吝易"},{"id":"juan7-055","source":"正文","juan":"卷第七","menu":"喜第二十八","sub_menu":null,"page":"三〇七","leaf":"十八オ","text":"式宴以喜　詩\n無喜色　子文三仕爲令尹無喜色\n喜形於色\n睢盱　小人喜悅之貌\n楚殺子玉　晉侯喜可知也\n受官喜　毛義家貧養老觀張奉慕其名候之會府檄至以義守令義捧檄入喜見顏色奉心賤之不知其爲親也\n孔子攝相　孔子由大司寇攝行相事有喜色門人問之孔子曰有樂其貴然喜下人得吾也\n一則以喜　謂孝子見親年老而歡克壯也\n喜生於風\n則哀矜而勿喜"},{"id":"juan7-056","source":"正文","juan":"卷第七","menu":"怒第二十九","sub_menu":null,"page":"三〇七","leaf":"十八オ","text":"將子無怒\n怒\n逢彼之怒\n君子如怒\n王赫斯怒\n慍見　子路\n無慍色（子文三已之無\n慍色）\n忿思難　君子九思\n一朝之忿　忘其身\n顏回不遷怒\n忿懥　懥怒\n忿疾　于頑\n宜無悔怒\n懲忿窒慾　易損卦言可損之善莫大於懲忿\n內奰于中國　奰音備不醉而怒曰奰\n衆怒不可犯　傳難犯\n衆怒如水火\n赫然　今執事赫然授兵登陴將以誅罪注赫然怒貌\n含怒\n不怒而威　神\n有怒　　　同心　見有\n譴怒\n敬天之怒\n逢天僤怒　僤厚也\n武怒　奮其武怒\n室於怒市於色　怒室家作色於市人\n色勃\n髮衝冠　藺相如怒髮上衝冠\n奮髯抵几　朱博　齊吏\n忿擊\n伏屍百萬流血千里　天子之怒也秦王謂唐雎中略云王聞布衣之怒乎王曰免冠徒跣以頸投地雎曰不然必伏屍二人血流五步\n怒生於惡　傳\n王奮厥武　如雷如霆如虓虎詩"},{"id":"juan7-057","source":"正文","juan":"卷第七","menu":"拜揖第三十","sub_menu":null,"page":"三〇八","leaf":"十八ウ","text":"取儀禮門事用\n九拜　拜有九儀用禮\n再拜拜揖　禮\n手容恭　禮\n吉拜　凶拜非三年喪以吉拜\n凡男拜尚左手　左陽\n女尚右手　右陰\n八十者拜君命一坐再至　禮再至至地\n九十者君使人受　不使婦人拜也\n吉事雖有君賜則肅拜　低頭而已\n凶事則手拜　手至地也\n大夫稽首再拜君答拜之　禮無不答\n加勞賜一級無下拜　傳王使宰孔賜齊侯胙將下拜孔曰且有後命天子以伯舅耋老加賜一級無下拜\n拜下禮也\n辭意受賜不拜　領賜贓物\n贈子以拜　王昇謂陳灌\n介者不拜\n品秩殊等　拜揖異儀\n吉凶異道　拜揖殊宜\n位既殊於品列　拜則異其節文\n不拜揖客亢禮　漢汲黯字長孺見將軍以亢禮人或說黯不可以不拜之曰夫以大將軍有揖客反不重耶\n又　汲黯見田蚡未嘗拜揖\n揖三公（後漢趙壹爲上計吏到京師是時司徒袁逢受計計吏數百皆拜伏庭中莫敢仰視壹獨長揖而已逢望異\n之命　讓之曰小郎安揖三公何也）\n責稽首　傳齊人責稽首注往年齊侯爲公稽首公不答故也\n揖丞相　漢書郅都爲中尉丞相條侯至倨貴而都揖丞相也\n穨乎頎乎　禮曰拜而後稽顙穨乎其順也稽顙而後拜頎乎其至也注此謂之喪拜先觸地無容哀之至也三年之喪吾從其至者注重者尚哀戚自貴　可也\n大夫之臣不稽首　以避君也\n不面拜　君有賜不面拜爲君之答己也\n揖官屬　漢蓋寬饒　公左選衛　司馬先是方寄見衛尉拜謂寬饒視事按舊令遂揖官屬已下衛者候司馬不拜自此正焉\n率鄭禮以\n雅拜　何武舉方正一人來者召見行盤辟雅拜有司劾奏武不當\n長揖　西征賦說亞夫\n教拜　朱博字子元爲琅邪守門下掾贛遂耆老大儒教授數百人拜起舒遲博出教主簿曰贛遂書生不習吏禮主簿且教拜起閑習乃止\n不遷　注見上\n參軍　晉孫楚字子荆爲著作郎參石苞驃騎將軍事負其才氣頗侮易於苞初至長揖曰天子命我參卿軍事因此嫌隙遂構苞奏楚與吳人孫世　　　　　　　表自理\n一拜一起　吳主謂蜀伊籍曰勞事無道君對曰一拜一起未足爲勞\n特揖　特揖\n旅揖　大\n旁三揖　士\n揖人必違其位\n環拜以鐘鼓爲節　環謂旋拜\n三肅使者　郤至對楚子以軍事不敢拜故三肅使者\n拜賜　拜加捨其大而拜其細\n尚能拜起　黃霸不去老蘧吏曰尚能拜起\n辭\n齊桓受胙　恐隕天子之羞\n而　　建爵　實　　　爵之命\n耋老加恩　齊侯　級之賜\n辭\n介胄難犯　爲生成三肅之儀\n馬援受梁松拜　援疾松候之拜牀下援不答曰我松父友雖貴不可失敘松恨之\n拜不止晉宣王　晉宣王以魏常林鄉邑之耆德每爲之拜或謂曰司馬公貴重君宜止之林曰司馬公自欲敦長幼之敘　　　　　　長拜非吾所制言者踧踖而退\n王祥不拜晉王　具職官公門注\n責象拜　何　爲郡主簿令杜稅辭貴鄉里勸繼等拜更曰禮拜者稱臣以禮爲主令稅拜勢懼傷風俗禮不以爲禮"},{"id":"juan7-058","source":"正文","juan":"卷第七","menu":"行步第三十一","sub_menu":null,"page":"三〇九","leaf":"十九オ","text":"禮曰凡升階聚足連步以上　謂足不相過\n上於東\n階　則先左足\n上於西階　則先右足\n堂上接武　跡相近也\n堂下布武　足各成跡\n規行矩步\n不舉足車輪曳踵　凡執主器執輕如不克行不舉足車輪曳踵注主器也如輪行不離地恭慎周旋中規折旋中矩謂行步\n君與尸行接武　也躡\n大夫繼武　跡相及也\n士中武　跡相離也\n凡行容惕惕　惕惕行貌\n足容重　舉欲遲\n行步則有環珮之聲　行中節也\n千里之行始於足下\n學步　壽陵餘子學步於邯鄲失其故步匍匐而反\n躡步\n舍車而徒　易賁卦初九舍車而徒義不乘也賁飾也\n肆夏采齊　周禮行以肆夏趨以采齊樂章也\n栗階而升　凡栗階不過二等\n與先生並行　　當童子\n父之黨隨行\n兄之黨鴈行　朋友不相踰\n翔步\n徒行\n步目　國語足以步目\n吾不徒行\n行玉趾\n憚行　詩豈敢憚行畏不能趨"},{"id":"juan7-059","source":"正文","juan":"卷第七","menu":"趨第三十二","sub_menu":null,"page":"三一〇","leaf":"十九ウ","text":"趨進翼如\n帷薄之外不趨\n堂上不趨\n執玉不趨\n趨蹌　詩巧趨蹌兮\n疾趨則欲發而手足無移　發起屨也毋移手足正也\n齊如流\n弁行剡剡而起屨　疾趨之貌\n徐趨\n沒階趨進　翼如也\n遲緩　後漢趙堪爲縣令謁府趨步遲緩門亭長譴堪解印而去\n趨以采齊　注見上\n周走以呼　齊侯使人楚國\n趨登　晉靈公飲趙盾酒伏甲將攻之其右提彌明知之趨登曰臣侍君宴過三爵非禮也遂扶以下\n二節　禮君召以三節二節以走一節以趨\n鯉趨　論語"},{"id":"juan7-060","source":"正文","juan":"卷第七","menu":"灑埽第三十三","sub_menu":null,"page":"三一〇","leaf":"十九ウ","text":"禮凡爲長者糞之禮必加帚於箕上　取其兩手捧箕奉也謂初執帚時也\n以袂拘而退其塵不及長者　謂埽時也以袂擁帚之前令塵不及長者\n以箕自向而扱之　不向尊者示之恭也\n灑埽進退則可矣（子游曰子夏之門人小子當灑埽應對進退則可矣抑末也本之則無如之何\n也）\n糞除　先人之敝廬　　　　　　　　　　傳\n埽\n不灑埽　詩子有廷內不灑不埽\n埽地　而祭\n掃門　魏勃埽齊相曹參門\n埽室　陳蕃字仲舉所居一室不埽人問曰孺子何不埽除蕃曰大丈夫當埽天下安能事一室乎\n擁篲　　迎門\n執帚所過糞除　第五倫字伯魚不違客問見變姓名稱王伯齊載鹽往來太原上黨所過輒爲糞除陌上人號爲道士\n備灑埽　納女於大夫禮\n白氏六帖事類集卷第七"},{"id":"toc-juan5","source":"卷五總目","juan":"卷第五","menu":"卷第五總目","sub_menu":null,"page":null,"leaf":null,"text":"白氏六帖事類集卷第五　本卷總目（共 35 門）\n酒第一（小字：酒德、戒酒、淫湎、酗酒、禮飲、軍中飲、樂飲、夜飲、賜酒、行酒、令罰附）\n酤榷第二\n造酒第三\n酣醉第四\n漿第五\n茶第六\n食第七（小字：加膳、奢盛、儉薄、貪食附）\n煎和第八\n米麴九（小字：粟附）\n飯飱第十\n粥第十一\n羹美第十二\n肉第十三\n炙第十四\n膾第十五\n脯脩第十六\n鮮第十七\n醢第十八\n醯第十九\n鹽第二十\n酪第二十一\n蜜第二十二\n餅餤第二十三\n嗜好第二十四\n食器第二十五\n賜食二十六\n饋食二十七（小字：乞食附）\n餔食二十八\n異味二十九\n天子食三十\n柴薪三十一\n芻草三十二\n菓三十三\n炭三十四\n厨三十五（小字：爨附）"},{"id":"juan5-000","source":"正文","juan":"卷第五","menu":"酒第一","sub_menu":null,"page":null,"leaf":null,"text":"〔酒德、戒酒、淫湎、酗酒、禮飲、軍中飲、樂飲、夜飲、賜酒、行酒、令罰附〕\n我有旨酒（小字：君子有酒）\n和以（小字：詩旨酒）\n九醞（小字：漢法九醖）\n甘醴浮蟻醇酎\n竹葉（小字：蜀都賦）\n百壺（小字：詩清酒百壺）\n桂酒椒漿（小字：楚辭言桂酒椒漿以其香以掩桂漬酒也）\n羣飲（小字：罰）\n腐腸（小字：養生論曰醨酒腐人之腸胃）\n大欲（小字：禮云飲食男女之大欲存焉）\n主鬯（小字：老子云立地鬯）\n十旬（小字：兼清醑也）\n既旨且多（小字：詩）\n且有酒（小字：詩）\n公酒（小字：公事作酒也周禮）\n禮酒（小字：賓客清酌之醴）\n飲齊視冬時（小字：飲宜寒也禮記）\n上尊酒（小字：漢賜丞相上尊注云糯米一斛得醲酒一斛為上尊稷為中粟為下）\n美祿（小字：漢書酒者天之美祿所以饗天下之祈福扶衰養疾）\n柘漿（小字：禮樂志大樂柘漿析朝醒注柘甘柘汁為醒病酒柘解也）\n釃酒有衎（小字：詩）\n迨我暇矣（小字：詩）\n行酒（小字：吳志葛恪行酒至張昭昭不肯飲之曰此非養老禮恪曰昔太公云云昭乃盡爵）\n不與飲（小字：阮籍與王戎飲劉公榮在座不得飲）\n朋酒斯享（小字：詩）\n佐酒（小字：助行酒也）\n三爵油油以退（小字：禮君子飲酒以成禮不繼以淫）\n狂藥（小字：晉裴頠酒箴有）\n服宴（小字：夫仲孺有服過田蚡蚡曰吾欲與仲孺過魏其侯會仲孺有服夫曰將軍幸許過魏其侯安敢以服為辭）\n數石不亂（小字：于定國飲酒至數石不亂為廷尉至冬月治請獄飲酒益明）\n〇酒德（小字：附罰）\n思柔（小字：旨酒思柔不為亂也）\n以洽百禮（小字：為醴）\n溫克（小字：人之齊聖飲酒溫克）\n三爵油油（小字：禮君子之飲酒也一爵而色洒如也注
