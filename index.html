t":"我心匪石　不可轉也\n我心匪席　不可卷也\n如旌　楚王曰寡人心搖搖如懸旌\n無瑕　左傳曰心苟無瑕何恤乎無家\n不競　孔叔曰心則不競何憚於病\n心不則德義　之經爲頑　傳\n如面　子產曰人心之不同如其面焉\n苞藏禍心\n心能制義曰度\n人藏其心　不可測度\n心莊則體舒心肅則容敬\n心正而後身脩　禮\n方寸　徐庶曰方寸亂矣\n心如結　詩\n如水　鄭崇曰臣門如市臣心如水\n心若死灰　莊子\n虛其心　老子\n玄覽心照　老子曰滌除玄覽\n丹府\n靈府\n靈臺　莊子心也\n中心不和樂　而鄙詐之心入矣\n外貌不莊不敬　則慢易之心入矣\n鄙吝心生　郭林宗曰黃叔度旬月不見則鄙吝之心生\n聖人無常心　以百姓心爲心\n以禮制心　書\n志以道寧\n作德心逸日休　作僞心勞日拙\n至和爲性　　　由心\n非僻之心　無自入也禮\n主張六志　　　六情\n楚王蕩而祿盡　徐庶亂而計窮\n剖賢人之心　書\n剖心而學道　言學道先去其心也莊子\n心計　桑弘羊以心計十三爲侍中\n有臣三千惟一心　紂有臣億萬而惟億萬心予有臣三千惟一心\n同心　武王曰予有亂臣十人同心同德\n啓沃　高宗謂傅說曰啓乃心沃朕心\n金石　後漢世祖拍王常曰此家率江夏諸將輔翼漢室心如金石眞忠臣也是日遷王常漢忠將軍\n同心之言　其臭如蘭\n劒承其心　晏子春秋曰崔杼劫齊莊公以戟鉤其頸劒承其心\n春秋元命苞曰　心者火之精成於五故人心長五寸\n二人同心　其利斷金\n其心三月不違仁\n一心可以事百君　百心不可以事一君仲尼聞之曰小子記之晏子春秋\n凡人心險於山川難知於天　禮\n夢人以刀開心　異苑曰鄭玄師馬融三載無聞融鄙而遣之玄過於樹陰下假寐夢見一老父以刀開其心謂曰子可以學矣於是却返"},{"id":"juan9-007","source":"正文","juan":"卷第九","menu":"視第七","sub_menu":null,"page":"一三","leaf":"五オ","text":"非禮勿視\n視思明　君子九思\n將思明也　　蓍謂其叔曰願爲君自將思明也\n無淫視　正視也\n視遠惟明\n視曰明　洪範曰視曰明明作哲\n目識　楚辭專專之目識\n凡視上於面則傲　下於帶則憂傾則姦傾謂旁視不正\n目不別五色之章爲眛　傳\n五色令人目盲\n見小曰明\n視之不見　名曰微\n以管窺天\n蔽明　大戴禮曰冕而前旒所以蔽明\n視之明也鑒於賢　不在見於眸瞳\n視之遠也觀於隱　不在覩於秋毫\n三年視蝨　百步\n視下　單子會韓宣子于戚視下而言徐叔向曰單子其死乎衣有襘襘領也帶有結會朝之儀視不過結襘之中所導容貌以明之失則有闕今單子爲王官伯而命事於會視不登帶言不過步貌不導容而言不昭矣不恭不昭不從無所守氣矣\n四目　舜明四目而天下\n遠視　賈琮爲刺史升車褰帷遠視廣聽糾察善惡百城震悚\n尊其瞻視　君子正其衣冠尊其瞻視儼然人望而畏之\n見秋毫之末　離婁百步之外見秋毫之末\n目逆　宋華父督見孔父之妻於路目逆而送之曰美而豔\n竊視　金日磾見武帝美人　側日磾不竊視\n忤視　馬融前授生徒後列歌　盧植受業不忤視\n儀禮曰　與大人言始視面中視抱注言始見面\n觀其顏色　所傳言\n若父則游目無上於面無下於帶　子於父主孝不主敬所視廣因觀安否\n若不言　立則視足坐則視膝\n天子視　上不於袷不下於帶\n國君綏視　謂上於袷\n大夫衡視　視謂平\n士視五步\n從長者上丘陵　則必向長者所視\n視必下　將入戶\n入戶奉扃　視瞻毋回\n視遠　右師視遠而言疾有異志焉\n視流　鄭伯視流而行速\n覆視\n戴目而視　傾耳而聽\n察白水魚　文\n觀天\n視日不眩　王戎\n視日之蚤暮　禮\n●目附視門\n目若懸珠　東方朔自言\n美目　以\n目擊\n質質　餓者質質然來質質目不明貌\n目動　臾駢曰秦使者目動而言肆懼我也必賊之也\n青白眼　阮籍能爲青白眼對嵇喜以白眼禮俗之士輒以白眼籍見以青眼喜乃退\n五色令人目盲　老子\n喪明　子夏喪其子而喪其明曾子弔之曰吾聞朋友喪明則哭之曾子哭子夏亦哭曰天乎予之無罪也曾子怒曰商汝何無罪也喪爾親使人未有聞焉喪爾子喪爾明爾何無罪與子夏投其杖而拜之曰吾過矣吾過矣\n左丘失明厥有國語　司馬遷與任安書云\n目者面之候　易離爲目\n目如點漆　杜弘治\n治國而無禮　譬猶瞽之無相與倀倀乎其何之\n瞭然瞀然　孟子曰人之善不善在乎目其心正則童子瞭然其心不正則童子瞀然瞭音了瞀音卯\n重瞳　舜目重瞳\n又　項羽目亦重瞳\n不瞬　列子引錐至睫其目不瞬\n兩葉蔽目不見太山　鶡冠子\n目所不見　故若存若亡心所不察故不生不滅\n十目所視\n蜂目　豺聲\n深目　而\n睆目\n眼如紫石稜\n閉門而泣　目盡腫也\n爛爛如巖下電　裴楷謂王戎之睛"},{"id":"juan9-008","source":"正文","juan":"卷第九","menu":"聽第八","sub_menu":null,"page":"一五","leaf":"六オ","text":"耳附\n非禮勿聽\n聽思聰　君子九思\n無側聽　禮\n舜達四聰　而治天下\n耳不聽五音之和爲聾　傳\n五音令人耳聾　老子\n司聰　杜蕢飲工曰汝爲君耳將司聰　　司聰不聞樂是不聽也\n文子曰聽者所以達知也　所以成行也所以致功名也不精則不明不深則不達故上學以神聽中學以心聽下學以耳聽耳聽者學在皮膚心聽者學在肌肉神聽者學在骨髓故聽之不深則知行之不誠凡聽之理虛心清靜耳無苟聽\n耳屬于垣\n天聽卑　秦宓曰天之至高而聽至卑蜀志\n言猶在耳\n聽之不聞　名曰希\n聽曰聰\n聰作謀　洪範曰四曰聽\n掩聰　大戴禮曰冕而前旒所以蔽明黈纊塞耳所以掩聰\n通人於己　文子曰言者所以通己於人聞者所以通人於己既聾且瘖人道不通\n和聲入於耳　而藏於心\n坎爲耳　易\n惟明在於聽政　不在聞　　之聰\n惟聰在於聽德　不在聞焦　之聲\n傾耳而聽之　可得而聞也\n廣聽　賈琮事見上注\n洗耳　堯聘許由爲九州長由惡聞之洗耳於潁水\n枕流　王武子曰流非可枕孫子荊曰所以枕流欲洗其耳\n逆耳　張良曰忠信之言逆於耳利於事\n雉雊　高宗祭成湯有飛雉升鼎耳而雊不聽之異也\n忘味　子在齊聞韶三月不知肉味\n知音　伯牙彈琴鍾期聽而知其音\n聽和而聰　國語單穆公曰耳目心之樞機故視聽和則聰明視聽不和則有震眩\n視秋毫之末　則不聞雷霆之音\n兩豆塞耳　不聞雷霆鶡冠子\n傾聽求聲者　則耳苦而目樂定心營物者則神勞而形安同在一身之上而休戚異者是天理殊宜造化自隔\n言提其耳\n重聽何傷　黃霸爲郡許丞老聾督郵請代之霸曰許丞廉吏重聽何傷\n諸葛亮　請杜微至以微聾於座上與書云伏聞德行飢渴歷時云云微以老病乞歸\n顧見耳"},{"id":"juan9-009","source":"正文","juan":"卷第九","menu":"面第九","sub_menu":null,"page":"一六","leaf":"六ウ","text":"夫爲人子者出必告反必面　禮\n女子出門必擁蔽其面\n事親三日具沐其間面垢\n不學牆面　莅事惟煩\n朋而不心面朋也　友而不心面友也揚子\n面長三尺　孫卿子曰有臣公孫呂身長七尺面長三尺廣三寸名動天下\n半面　後漢應奉字世叔行皮縣過袁賀門出半面不見賀二十年路見識之\n傅粉　何晏\n面如凝脂　王右軍見杜弘理而歎曰面如凝脂目如點漆此神仙中人也\n子西袂掩而終　國語楚白公勝作亂劫惠王殺子西子西歎見葉公子高何以袂掩面而卒\n夫差巾覆而死　吳越春秋曰吳王夫差死蒙見子胥以巾覆面今人謂之面衣也\n面如驢面　吳志云諸葛子瑜\n人心不同其如面焉　子產云\n宋如周面長"},{"id":"juan9-010","source":"正文","juan":"卷第九","menu":"胷第十","sub_menu":null,"page":"一六","leaf":"六ウ","text":"釋名曰胷臆也\n結胷　山海經曰有結胷國人爲人結胷如人結襟也\n貫胷　又曰貫胷國爲人胷有竅\n孔子之胷文曰制作定世符運　春秋孔演圖云\n披胷　列子　披胷\n水蕩其胷　當　値\n洞胷達腋\n開胷\n毀骨碎胷\n傷胷　左傳魏犨傷胷晉文　愛其才使視之　束胷而見使者\n漢高祖　與項羽劇羽數羽十罪羽伏弩射中漢王中胷高祖詐捫足\n撫膺長歎息　古詩\n胷坼而生禹　帝王紀禹母吞神珠云云\n湛胷"},{"id":"juan9-011","source":"正文","juan":"卷第九","menu":"手第十一","sub_menu":null,"page":"一七","leaf":"七オ","text":"天將假手　傳\n執子之手　詩\n兩驂如手\n如臂之使手\n六轡在手\n共飯不擇手　禮\n論語隱義曰　齊桓公北伐中山還倚柱歎曰天下珍物悉易得未得人肉食易牙歸烝其兒兩手以啖君\n鉤弋夫人　漢書鉤弋夫人兩手皆拳武帝披之手即展號曰鉤弋夫人\n母嚙手　搜神記曰周暢至孝每出母欲呼之自嚙其手暢心痛即馳歸\n羹爛　後漢劉寬欲朝婢翻羹污朝服婢以手收之寬徐徐曰羹爛汝手\n論語摘輔象曰　仲弓鉤文在手是謂知始宰我提戶是謂守道子游握文雅是謂敷土公冶長手握輔是謂道子貢握五是謂受公伯周手握直期是謂病惡\n鼠傷　晉高平劉柔夜鼠傷其手指惡之問淳于智智即以朱書腕後橫文爲田字夜露手而臥明旦有一大鼠死手前\n長者與之提攜則兩手捧長者之手\n燕丹子曰　太子與荊軻置酒美人鼓琴軻曰好手太子即斷其手以玉盤盛而奉之\n繩貫　魏略曰鮑出字文才屬代飢出採蓬子母在家爲賊繩貫手掌驅去出走斬賊奪母而還\n纖纖擢素手\n不分麈尾　王夷甫\n脩肱　契\n長肘　李\n握鉤　左\n執雅　子\n刻文　公孫述\n摻摻女手\n手如柔荑\n爲魯夫人　宋仲子生而有文在其手曰爲魯夫人"},{"id":"juan9-012","source":"正文","juan":"卷第九","menu":"臂第十二","sub_menu":null,"page":"一七","leaf":"七オ","text":"割臂而盟　魯莊公許孟任爲夫人孟任割臂以盟之遂生公子般\n申蒯斷臂而鬭　崔杼弒莊公申蒯後至將入御止申蒯曰君死請入門者告崔子崔子曰勿納申蒯曰汝疑我與汝臂斷左臂與門者門者將示崔子崔子遂入申蒯遂拔劒呼天躍而鬭殺七人未及崔子一叫而死也\n李廣猿臂　漢書\n猨左臂長而善射　淮南子\n齧母臂　史記曰吳起出衛郭門齧母臂辭別曰不爲卿相不入衛郭門\n折臂三公　幽明錄曰羊叔子父墓人相云有帝王氣叔子掘斷之後相者再至曰當出折臂三公叔子馬墜折臂\n一臂國　交州記曰儋耳國東有一臂國人皆一臂\n春秋元命苞曰　陽臂四肘是謂神象月垂移以據四方也\n過膝　蜀志曰先主長七尺五寸目顧見耳垂手過膝\n李牧臂短　謝靈運詩曰李牧愧長袖\n若身之使臂\n齧臂爲盟　續漢書曰單超河南人梁冀振動天下帝呼單超等五人入謀誅梁冀帝齧超臂爲盟也\n蜀志曰　關羽爲流矢中左臂陰雨常痛伸臂與醫劈刮骨去毒流血盈盤中神氣自若"},{"id":"juan9-013","source":"正文","juan":"卷第九","menu":"脣第十三","sub_menu":null,"page":"一八","leaf":"七ウ","text":"脣亡齒寒　左傳宮之奇曰云\n仲尼牛脣　孝經鉤命決曰\n老子脣　龎厚　記\n脣者齒之垣　春秋元命苞曰云云\n舌之藩　周生烈子\n黑脣　燉煌實錄曰王　字孟角卒有盜發冢見焚與人髆夜告城門云王孟角使人也發角冢賜酒以黑其脣明入城黑脣者是也須臾賊至爲門吏所縛\n朱脣外朗　曹植賦\n沸脣　賈誼曰　　脣　　恒之下肉奴號也"},{"id":"juan9-014","source":"正文","juan":"卷第九","menu":"足第十四","sub_menu":null,"page":"一八","leaf":"七ウ","text":"龜文　抱朴子內篇曰老君足下龜文\n又　漢書曰宣帝足下龜文\n足下有毛　宣帝\n樂正子春　下堂而傷足禮\n足不良　郤克\n不失足於人　禮\n啓予手啓予足　曾子病\n堂上接武堂下布武　武足跡也"},{"id":"juan9-015","source":"正文","juan":"卷第九","menu":"眉第十五","sub_menu":null,"page":"一八","leaf":"七ウ","text":"螓首蛾眉\n蔡澤巨眉　史\n文王虎眉　帝王紀云\n堯眉八彩　春秋元命苞云\n三寸　烈士傳云干將子赤鼻廣三寸\n一尺　伍子胥眉間一尺\n白眉　馬良\n京兆眉　張敞爲婦畫眉人謂之京兆眉也\n連眉　列仙傳陽都女生而連眉以爲異後果得仙道\n黛眉　東觀漢記馬皇后眉施黛左眉小缺補之如粟\n赤眉　琅邪樊崇王莽時起爲盜王莽使王匡廉丹征之崇等恐其衆與莽兵亂皆朱其眉以相識是謂赤眉賊\n愁眉　桓帝時京師作愁眉　　折　梁冀家爲之是日收冀婦夏而\n眉\n灸眉　鄧粲晉紀曰　　嘗　酒在王澄因吐左右扶　　歡郭舒厲色曰使君醉左右莫動澄大怒　　罵舒　　喚諫數呵曰人以卿癡灸眉舊疾復發也舒曰　　點靈　豆癡手澄時爲荊州\n酒塲戲嚬眉　西施\n張氏工　巢眞劃\n珠星示象運斗建於雙視　春秋元命包曰天有攝提人有兩眉為人表候陽立於二故眉長二寸注曰攝提兩星嚬曲人眉似之也"},{"id":"juan9-016","source":"正文","juan":"卷第九","menu":"鼻第十六","sub_menu":null,"page":"一九","leaf":"八オ","text":"鼻者心之門　養生經\n東方之人隆鼻　淮南子云\n隆準　漢高祖隆準準鼻也\n鼻為氣戶　長沙耆舊傳太尉壽少遇相師相師曰凡鼻為氣戶君鼻大貴之象也\n鼻仰而頦富貴之相也　史記蔡澤說唐舉相舉曰云云\n截鼻　列女傳後漢周郁妻納一歲夫亡父母欲嫁之遂援刀而截鼻\n莊子曰　郢人圬其鼻端若蠅翼使匠斲之匠運斤成風堊盡而不傷\n鼻雙　莊子\n飛龍　常璩蜀志曰李雄美容兒相工相之曰此人鼻飛龍"},{"id":"juan9-017","source":"正文","juan":"卷第九","menu":"鬚第十七","sub_menu":null,"page":"一九","leaf":"八オ","text":"捋虎鬚　吳錄朱桓遠戍奉觴於孫權曰願一捋陛下鬚王推几前席進捋鬚曰今日眞可謂捋虎鬚王大笑\n于顋于顋　左傳宋華元多鬚伐鄭為鄭敗宋人歌曰于顋于顋棄甲復來\n黃鬚兒　魏志任城王章為北平中郎將討烏丸有功歸太祖大喜捋章鬚曰黃鬚兒竟大奇\n長鬚方士　廣陵列士傳劉瑜舉方正對策高第人呼為長鬚方士\n多鬚參軍　郗超多鬚人謂之多鬚參軍\n銜鬚　後漢温序為隗囂將所獲序臨斬銜鬚曰大丈夫豈宜鬚汚於土\n晉張華多鬚　好以帛繩之陸雲見之笑不能止\n蝟毛\n戟鬚亂　朱桓捋孫權鬚者\n後漢司馬直　鬚白美鬚髯人敬之如神\n奮髯抵几"},{"id":"juan9-018","source":"正文","juan":"卷第九","menu":"律呂第十八","sub_menu":null,"page":"一九","leaf":"八オ","text":"律本　律曆志黃帝使伶倫自大夏之西取嶰谷之竹其竅厚均者斷兩節而吹之為黃鍾之宮而制十二管以聽鳳皇之鳴其雄鳴為六雌鳴亦六以比黃鍾之宮而皆可生之是為律本注云大夏西戎國也嶰谷名也竅孔也取竹孔與肉薄厚均者截以為管也\n燕谷和氣　比燕有谷地名而寒不生五穀鄒衍乃吹律暖之和氣至谷方生禾黍\n楚軍死聲　師曠曰吾驟歌北風又歌南風南風不競多死聲楚必無功注歌吹律也以詠八風\n易姓　京\n房本姓李後吹律自改為京氏\n玉律　管銅\n飛灰之候\n吹律聽聲　史記王者制事立法物度軌則壹稟於六律六律為萬事根本望敵知吉凶聞聲效勝負蓋吹律而聽聲也\n合其規　較之以黍\n候其氣　應之以衰\n啓迪歲功　敬授人事\n候四氣　應八風\n風雨之變可以音律知之　文子\n審大小必均薄厚　考長短聽失毫釐\n履端於始　以期三百六旬\n舉正於中　用定二十四氣\n隨陰陽而必應　雖風雨而不迷\n東風入律　青雲干呂\n黍累而百物信　毫釐失而千里差\n藝云精吹管　業擅專門\n六律六同　六律合陽聲也六同合陰聲也此十二者以銅為管轉而相生黃鍾為首長九寸\n立均出度　國語律所以立均出度言鍾度皆以律而均也\n以合陰陽之聲　太師掌六律六同以合陰陽之聲\n典同　掌六律六同之和以辨天地四方陰陽之聲\n還相為宮　禮五聲六律十二管還相為宮注十二律迭相生也還謂循環也\n八風從律而不姦　禮姦或也\n六氣斯辨　八風不姦\n吹其斷竹　嶰叶鳳鳴之音\n驗以飛灰　果應　行之次\n制苟乖於長短　應必失於忽微\n參天兩地　藝文志大演之數五十推歷生律制器規圓矩方莫不參天兩地而倚數也\n金門竹葭莩灰　晉律歷志楊泉記取宜陽金門山竹河內葭莩為灰黃帝使羲和占日常儀占月車區占星伶倫造律呂大橈造甲子隸首造筭數容成造歷\n秒忽　漢書數起於產氣黃鍾造計秒忽注秒禾芒也忽起於蜘蛛絲言其微也\n十二律　漢律歷志律有十二陽六為律陰六為呂律以統氣類一曰黃鍾二太簇三姑洗四蕤賓五夷則六無射呂以旅陽宣氣一曰林鍾二南呂三應鍾四大呂五夾鍾六仲呂也\n三統　漢志云三統者天地人事之紀也十一月乾之初九陽伏地故黃鍾為天統六月坤之初六陰氣受任太陽繼養化柔萬物生長楙之於未故林鍾為地統云云仁以養之義以行之令物事\n各得其理寅木為仁其聲商也為義故太簇為仁云云律長八寸象八卦宓羲之所以順天地通神明類萬物之情\n夫婦子母　上生六而倍之下生六而損之皆以九為法九六陰陽夫婦子母之道也異類為子母謂黃鍾生林鍾也同類為夫婦謂黃鍾以大呂為妻也\n律娶妻　黃鍾生林鍾也呂生子　林鍾生太簇也天地之情也\n上損下益　黃鍾之管長九寸三分損下生林鍾林鍾益一上生太簇太簇三分損一下生南呂南呂三分益一上生姑洗姑洗三分損下生應鍾應鍾益一上生蕤賓蕤賓損一下生大呂大呂益一上生夷則夷則損一下生夾鍾夾鍾益一上生無射無射損一下生仲呂陰陽相生自黃鍾左旋八八為伍其法皆用銅職在太樂太常主之相生三分損益\n楊子雲曰聲生於日　甲乙為角丁壬為羽乙庚為商景辛為徵戊癸為宮\n律生於辰　謂子為黃鍾丑為大呂之屬也\n妙察五均　工言三統"},{"id":"juan9-019","source":"正文","juan":"卷第九","menu":"刻漏第十九","sub_menu":null,"page":"二一","leaf":"九オ","text":"銅渾　設象\n玉漏　時授\n挈壺氏　掌刻漏之職\n金徒之職　銅史之司\n分以陰陽　明晦之時不忒\n賾其晝夜　短長之數無逃\n金壺銀箭\n陰陽雖微　氏地文　覽說\n風雨徒晦　日夜之度不違\n苟昏曉過度　致盈縮之差\n則寢興失時　有顛倒之刺\n敬授人時\n周禮凡軍事懸壺以序聚㯓　懸壺以為漏也以次序更聚擊㯓備守以警衆\n及冬則以火爨鼎水沸而沃之　冬水凍冷不下故以炊之沸以沃之\n說文曰漏以銅盛水刻節晝夜百刻\n待漏　後漢范滂每當事嘗晨駐車以待漏也"},{"id":"juan9-020","source":"正文","juan":"卷第九","menu":"方術第二十","sub_menu":null,"page":"二一","leaf":"九オ","text":"執技以事上\n非步\n日者殺黑龍　史記墨子北之齊遇日者曰帝以今日殺黑龍先生色黑不可行北\n視日　周文為項燕視日視日吉凶舉動之占文即周章\n緯候鈐決　後漢唐曰陰陽推步之學往見於墳典與神經怪牒五策金繩關扃玉堂之扃庫得而覩至乃河洛之文龜龍之圖箕子之術師曠之書緯候之部鈐決之符皆所以探抽冥賾參驗人\n區時有可聞其流風角遁甲七政元氣六日七分逢占者專候挺須臾孤虛之術及望雲省氣推處祥妖時亦有驗斯道隱遠玄奧難源故聖人不語怪神罕言性命或開末而抑其端或曲辭以章其義所謂民可使由之不可使知之也\n漢武帝　頗好方術道藝之士莫不負策抵掌順風而屆也\n任文公　善天文曉遁甲役使鬼神\n請命太山　京房自云僑病三年請命太山行遇道士託君韓以方術所著易林至今行世\n求道　張魯學道鵠鳴山有人受其道者輒出米五斗世號之米道\n左慈盤中釣魚　曹公欲殺之慈為羝羊入羊群中曹公知不可殺乃謝曰試與公戲爾老羝屈膝曰詎知詞復放熱之羣羊並屈膝\n召鬼　劉根能令人見鬼太守史祈不信因之乃召祈七祖皆面縛責祈祈乃謝而還之\n費長房　假壺公之術\n劾子訓　之驗事嬰兒\n趙炳　禁架令枯木生荑茅屋上\n樊英　推步災異水救蜀火\n楊由見社中木鳩鬭　知有兵賊象不閒人居食\n風起竈　李南女明風角女見疾風起吹竈突及井流灑焉曰此主縣吏者當之必死\n五里霧　張楷能作五里霧裴優亦能作三里霧求學於張楷不見後優作賊辭連楷無驗以見原\n風起知火　郎顗父宗字仲綏治京氏易善風角星筭六七分能望氣占候為吳縣吏見暴風卒起宗知京師有火災記時日果如其言也\n郭憲從駕含酒三噀　執法奏不敬曰齊國失火故厭之果上言失火也\n欒巴南漱　巴蜀人正旦朝會獨後至頓醉又飲而噀曰臣鄉里以臣能治北護病為臣立廟今旦耆老皆入臣廟故醉成都市失火故救之果上言失火有雨來皆酒氣\n風起庭中父哭子　管輅字公明在王弘直坐有飄風高二尺在庭中從申上來重迴轉輅曰東方有馬吏至恐父哭子明日吏至直子果死也\n療病人令思過出米　漢中張衡為五斗米道東方張角為太平道太平者持九節杖為符呪教病人思過處靜室又為姦令祭酒以五千文使都習號姦令為主鬼吏主為病者請禱法書病人姓名服罪之意作三通一上天一埋地一沉水為三官手書使病者出米五斗號曰五斗米師為益於病但惑者競師之衛因人作信義舍置米肉中有以縣令於治道百姓鬭罪除然後來者任食\n過則罪病以鬼道教人衡即角子也\n隱形　石苞謂管輅曰君鄉人翟文耀能隱形輅曰此陰陽蔽匿之道苟得其數四岳可藏況七尺之形游於變化之內僕正　明其道見數不為異術不為奇僕隱行怪未服斯務\n孫策殺道士于吉　後照鏡看面創見吉在鏡中遂卒\n百果立生殿庭\n釣魚　吳介象元則有方術吳主使象變化種瓜菜百果比立成又論鯔魚膾最上乃於殿庭作埳置水垂綸於食頃乃釣得一鯔魚也\n活死人　吳士燮字威彥為交阯太守病死三日仙人董奉以丸藥以水含之乃蘇四日能語奉字君異\n丁義以白羽畫水渡江　晉丁義授神方於吳猛以白羽畫水渡江\n夏統水戲　統字仲御賈充問統能水戲乎統乃作鯔魚躍鯆鮃引於是風波振駭迴摶大風至含水噀天雲飛雨集也\n青囊　郭璞受業於河東郭公公以青囊九書與之由是遂洞五行天文卜筮之術璞與轉偶通致無方璞門人趙載竊青囊書未及讀為火所焚\n後漢段翳　字元章治易明風角有就學未至預知姓名有一生辭歸翳合藥并簡書封於筒中告曰有急而發視之到葭萌與津吏爭身過從者頭破發取書藥處裹乃愈生歎服還卒業\n秀友替戾剛僕劬禿　劉曜攻洛城石勒訪浮圖澄澄曰相輪鈴音云秀友替戾剛僕谷劬禿當此羯語也秀友軍也替戾剛出也僕谷劉曜胡位也劬禿當提言此軍出提得曜書也\n禁溪水不流　徐登"},{"id":"juan9-021","source":"正文","juan":"卷第九","menu":"卜筮第二十一","sub_menu":null,"page":"二三","leaf":"十オ","text":"洪範曰明用稽疑　明用卜筮以考疑事也\n官占惟先蔽志　官占卜筮官也先斷意後用卜也\n不煩　傳聖人不煩卜筮\n龜筮協從龜從筮從龜從　筮逆\n龜筮共違於人\n貞卜　也貞正也\n筮短龜長　不如從長\n龜象也　筮數也\n爾卜爾筮　體無咎言\n臧會曰　僂句不余欺\n我龜既厭　不我告猶\n卜以決疑不疑何卜　鬭廉云\n違卜不祥\n占險　夫易不可以占險\n卜僭　臧會竊僂句以卜為信與僭僭吉\n爰挈我龜\n不占　子曰人而無恒不占而已矣\n卜不襲吉　襲再也\n卜筮不過三\n卜筮不相襲　謂瀆龜筮也\n決嫌疑　禮卜之\n用龜進斷其志\n初筮告　再三瀆瀆則不告\n圓神方智　易定天下之吉凶莫善於蓍龜蓍之德圓而神卦之德方以智神以知來智以藏往\n端策拂龜　詹尹對屈原\n神蔡　龜也\n靈蓍　僂句也\n觀卦　爻繇\n鑽龜　啓繇\n考先知之兆　識可決疑\n授昆命之文　必先蔽志\n疑衆必殺　禮假於鬼神時日卜筮以疑衆殺無赦謂使違禮\n疑而筮之　則不非也\n前知　禮至誠之道可以前知見乎蓍龜動乎四體禍福將至必先知之故至道如神四體龜四足也言至誠則不欺\n禮曰　此者聖人建禮陰陽天地之情立以為易雖有明智之心進斷其志焉\n深於易者　禮\n青囊　也卜\n拂龜　布卦\n握粟　攢蓍\n遺策　不中也\n大橫庚庚予為天王　漢陳平等迎代王王卜之得兆云云\n孫賓投蓍用知方朔　漢武帝令孫賓筮東方朔\n詹尹端策不對屈原　楚屈原既放心煩志亂往見太卜詹尹曰余有所疑先生決之詹尹乃端策拂龜原曰子寧隨鴻鵠遠舉乎寧與雞鶩爭食乎云云詹尹乃釋策謝曰用君之心龜策不能知之\n周文王卜獵渭濱　其兆曰非熊非羆天錫帝師乃得呂望而歸\n辨吉凶者　存乎辭\n舍爾靈龜\n受命如響\n知來　藏往\n窮神　知化\n幽贊於神明而生蓍\n天生神物　謂蓍龜也\n極數知來之謂占\n探賾索隱鉤深致遠\n觀變\n枚卜　書枚卜功臣謂歷卜也\n周禮三兆玉兆瓦兆原兆　田原之兆謂灼龜發火而形可占其象似玉瓦原之釁杜子春曰玉兆顓頊瓦兆帝堯原兆周之兆也\n繇兆之體　百有二十頌千二百\n記曰天子無筮　　征伐巡守不用　小事\n諸侯有守\n筮　守國之筮有事則用\n封父之龜　天子之龜封父國名\n諸侯非其國不筮\n卜宅寢室\n假爾泰龜有常　命龜筮辭\n眞龜　儀禮卜人眞龜楚焞注楚荊也焞以鑽灼龜也\n置于燋　燋炬以然火也\n乃旅占卒不釋龜吉于涖卜　卜旅長與主人占曰者\n龜焦　焦兆不成趙鞅卜也\n沉陽　趙孟卜救鄭遇水適火太史曰是謂沉陽注云火陽也春水而流\n青純　公羊曰龜青純純緣也謂甲䫇千歲龜青髯以明吉凶\n龜能七十鑽而無遺　不能避刳腸之患\n露蓍　漢書上體不安張禹以蓍龜戒以卜吉則卜徵與不吉則有變色露蓍於星下也\n負金　隗炤善易臨終謂妻子曰　　大窮勿賣宅後五年詔使姓龔負吾金以吾所書版索之彼如其言妻齎版詣使者使者惘然而思之乃悟取蓍筮卦成曰妙哉隗生吾不負金賢夫藏金以待太平知吾善易書版以寄意金有五百斤盛以青甕覆埋在堂屋下去壁一丈入地九尺妻掘之果得也\n卜云其吉終然允臧　允信也臧善也\n祠部式　諸私家不得　立神祀　　上祠並宜禁斷其龜易五兆六壬不禁也\n龜象　筮數\n占而從二　卜不過三\n穆卜　書成王有疾穆卜公曰我其為王穆卜\n奮蓍　　敬也\n卜不中罰不中　昔獻公飲大夫酒令司正實爵與史蘇　曰驪之役兆云飲而無肴夫克國得妃吉孰大焉故罰汝對曰云云\n青蓮神蔡　藏往知來\n翠野靈蓍　通幽索隱\n觀兆於未萌　識為智者\n退祭於既往　何其昔也\n光啓兩儀　龍成四象\n存險易之徵　示藏否之兆\n索隱致遠　通幽洞微\n達以陰陽　究其天地\n合於無際　應以未然\n智能藏往　神以知來\n行於冠婚　明男女之門\n用於祭祀　安　之　犧牲\n射覆知白鼠之傷　帝兆見豐年之禍\n彼郤仲之徵祥　必滅其國\n且君平之取給　卜所賣成都\n鬼神其狀　吉凶可見\n屈原\n遺逝　而無言\n方朔不歸　而有餘孫賓投書\n故龜文既踐　知李國之將封\n鳳皇于飛　　完之\n稽疑於冥數　得自天官\n●卜筮婚姻　附卜筮門\n晉獻公筮嫁伯姬　遇歸妹之睽史蘇占之曰不吉繇曰士刲\n晉獻公　　　　欲納驪姬　為夫人卜之不吉筮之吉公曰從筮卜人曰筮短龜長不如從長\n一薰　一蕕十年尚猶有臭"},{"id":"juan9-022","source":"正文","juan":"卷第九","menu":"卜筮第二十一","sub_menu":"（續）","page":"二六","leaf":"十一ウ","text":"崔杼筮娶棠姜　曰入其宮不見其妻凶\n懿氏卜妻敬仲　其妻占之曰鳳皇于飛和鳴鏘鏘有媯之後將育于姜\n●筮仕　附卜筮門\n畢萬筮仕於晉　辛廖占之曰吉其必蕃昌公侯子孫必復其始\n紱笥有蛇　後漢馮緄拜隴西　笥有兩赤蛇分走許季長曰三歲當為邊將官有東名五年為大將南征也\n管輅自卦　冀州刺史裴徽辟輅為文學　　　　當見三輕果見之\n淮水絕王氏滅　王導初渡江使郭璞筮之曰云云\n筮家狀　孔偕字仲光拜臨　　令崔駰子伯以其家狀筮之謂曰不吉勸辭　　臣信曰吉凶已見在與二年而卒\n●賣卜　附卜筮門\n君平杖頭　嚴君平賣卜於都市日得杖頭百錢即閉肆垂簾\n司馬季主　楚人賣卜於長安市\n宋忠賈誼　謂之曰何居之卑行之汙季主捧腹而大笑\n君平　與人子言依於孝\n張禹　為兒時至市從卜　之自曠別著命卦意也\n王宗以賣卜自奉　安帝以博士徵郭占驗見知懸鍛於縣庭而逃\n君平以卜筮之賤業　而可以便衆人有非正用之謝依蓍龜為言利害\n●卜筮官　附卜筮門\n官占　帝王立卜占之官故曰官占\n釁易龜　月令正月命有司釁易龜策占兆審卦吉凶周禮上春釁龜也\n擇建立卜筮人　書\n龜開四兆　卜師掌\n策分三易　筮人是司\n從事上　筮　成而下先為在其宗\n三兆之法　見卜筮門\n三易之法　連山歸藏周易\n視高　謂以龜骨高者可灼處也\n作龜　謂灼龜之人作兆而占之也\n命\n龜　謂告龜以所卜事\n涖卜　涖臨也謂卜官相示\n卜師掌開龜之四兆　開其占書書有四部故曰四兆見下\n揚火以作龜致其墨　以火灼龜也致墨者熟灼之以明其兆也\n龜室　藏龜之室\n中否　周禮歲終則計其占之中否也\n卜人定龜　禮\n史定墨　視兆坼也\n君定體　體吉凶也\n四兆　方兆功兆義兆弓兆兆有其名義未聞\n六龜　龜人占六龜之屬各有名物天龜曰靈屬地龜曰繹屬東龜曰果屬西龜曰雷屬南龜曰獵屬北龜曰若屬\n燋契　周禮菙氏供燋契以待卜事燋爇灼龜之木謂燋契灼龜之鑿\n凡卜　以明火爇燋遂吹其焌契以授卜師\n占人　掌占龜以八筮占八頌以八卦占筮之八故以眡吉凶也\n凡卜筮君占體大夫占色史視墨卜人視坼　體有吉凶色有善惡墨有小大坼有明微\n凡卜筮既事　則以繫幣以比其命歲終則計其占之中否注云既卜筮史書其命龜之事及兆於策繫其禮神之幣而合藏焉書曰以啓金縢之書是也\n九筮　筮人掌易筮九筮之名國之大事先筮後卜九筮謂筮更筮咸筮式筮目筮易筮比筮祠筮參筮環筮\n卜正　滕侯曰我周之卜正正官之長也\n●卜怪　附卜筮門\n生男墮地而走　安平太守王基家數有怪令管輅作卦輅曰當有婦人生一男墮地走而入竈中死已訖也\n蛇銜筆烏燕鬬　又見老蛇銜筆輅曰書佐也又烏來入室與燕鬬是官舍久遠有此三怪無所憂也\n戶前流光　王經堂前有一流光如燕雀入懷殷殷有聲輅曰吉遷之徵頃之拜為江夏太守也\n失火　管輅在田舍主人患火輅卜曰明日南陌上有一角巾生駕黑牛故車必邀留宿如此言生不得已宿然甚不安以為圖己乃把刀出門倚薪積假寐欻有一物如獸手中持火以口吹之乃斫而視之乃狐也火遂絕\n堂西死男子　信都令家婦驚恐輅筮曰君堂西有兩死男子一持矛一持弓矛者主刺頭故頭痛弓者射胸腹故心痛果得之疾遂皆愈\n●卜失　附卜筮門\n卜牛　管輅為僕婦卜失牛云當在西面窮丘中懸頭向上果於丘冢得牛婦人告官以輅藏牛按驗乃知\n失妻　有人失妻輅卜之令日於東陽城門候擔\n豕人牽與共鬬其豚走逸即其追之入舍突破主人甕其婦從甕中出也\n盜鹿　有人捕鹿晨行有盜其鹿者輅曰汝巷中第三家也伺無人時以瓦子密發其東頭第七椽以瓦子著下當送還汝如其言其夜盜者父病詣輅卜令擔鹿皮肉著故處自愈盜如言乃令舉椽著瓦盜父亦病愈也\n買鞭懸桑樹　　暖貧苦不信卜筮會淳于智至為作一卦曰君安宅失宜故困入市有人持馬鞭便買之以懸舍東大桑樹三年當暴得財如言後浚井得錢數十萬銅二十斤\n燒殺人　　熊字叔羆少好卜筮術數門徒甚盛熊舍側有人燒死吏持熊謂失火熊卜曰得其人矣使從道南行有一人來縛之果言云草惡難耕故燒之風起延燒不知草中有人\n●不卜　附卜筮門\n聖人不煩卜筮"},{"id":"juan9-023","source":"正文","juan":"卷第九","menu":"卜筮第二十一","sub_menu":"（續）","page":"二八","leaf":"十二ウ","text":"昆命于元龜　惟先蔽志蔽斷也昆後也\n朕志先定\n卜以決疑不疑何卜　云\n疑何命付天　管輅謂鍾毓曰我卜可以知生死毓曰命付天不付君\n勞蓍龜　郭璞欲為顏含筮含曰年在天位在人脩己而天不與命也守道而不回性也人皆自有性命無勞蓍龜\n不占而已矣"},{"id":"juan9-024","source":"正文","juan":"卷第九","menu":"相第二十二","sub_menu":null,"page":"二八","leaf":"十二ウ","text":"相人　叔服來聘公孫敖聞其能相人\n有知人之鑒　許劭\n善相\n相術\n龍犀日角帝王之表　朱建平相書曰額有龍犀入髮左角日右角月者王天下\n河目龜文公侯之相　孔叢子子曰仲尼聖人之表河目隆顙黃帝之貌又後漢李固狀貌有奇表鼎角匿犀足履龜文後為太尉已上見文選\n決疑　歸田賦曰感蔡子之慷慨從唐生以決疑\n漢呂公　謂高祖曰少好相人相人多矣無如季相\n不敢忘德　父老相高祖曰君相貴不可言乃謝曰誠如父老言不敢忘德\n信而有徵　　則暈中\n貴賤之表　近取諸身\n休咎之徵　如指諸掌\n應如影響　者龜\n●吉相　附相門\n豐下有後　叔服來聘公孫敖聞其能相人見其二子焉叔服曰穀也食子難也收子穀也豐下必有後於魯\n萬里封侯　班超詣相者相者曰　　封侯萬里之外問其狀相者曰燕頷虎頸飛而食肉此萬里侯相後封定遠侯\n山庭　子貢有山庭之相\n月角\n顏回有月角之相\n薄姬王者之妃　許負相\n曹操安天下之主　喬玄相\n雖賤必貴　史記姑布子卿善相見無卹曰真將軍也趙簡子曰是子其母賤翟婢也奚道貴哉子卿曰天之所授雖賤必貴也\n貴不可言　漢書蒯通說韓信曰君之面不過封侯相君之背貴不可言\n奇骨　晉桓溫字元子未朞溫嶠見之曰此兒有奇骨真英物父彝以其為嶠所賞故名之曰溫\n躍馬肉食　史記蔡澤問唐舉曰聞君相李兌百日之內合持國令有諸舉曰有之若臣者何如舉孰視笑曰君曷鼻巨肩魋顏蹙頞吾聞聖人所不相殆先生乎澤知舉戲之乃曰富貴吾自知不知者壽也舉曰四十三年澤笑謝去謂其御者曰吾躍馬肉食四十三年亦足矣後果為秦相\n論心擇術　孫卿子曰古者姑布今有唐舉相形不如論心論心不如擇術也\n奴有侯相　衛青至甘泉居室有鉗徒相青曰官至封侯青曰人之奴得無笞罵足矣安敢望於封侯\n以經術進　翟方進年十五為小吏號遲鈍數為掾吏罵辱方進自傷詣蔡父相大奇其形貌小吏也有封侯之骨當以經術進因病而歸也\n法真指胡廣　廣為郡散吏太守法雄子真名知人雄令真助求人悉召諸吏人真窺之指胡廣遂舉孝廉為漢名臣\n公字　相者謂陶侃曰君左手中指有豎理當為公若以上貴不可言侃以針刺之見血下壁為公字後果應之也\n功名壽年　周訪與陶侃善相者陳訓謂訪與陶侃曰二君皆位至方岳功名略同但侃上壽訪下壽優劣有殊\n好相　羊祜字叔子游汶水濱父老謂曰孺子有好相年六十建大功既而便去莫知所在\n論　魏王朗論曰仲尼之門童冠之子羞言形相之事難故也固有懷不副貌行不稱聲故夫子以言信行失之宰予以貌度失之子羽聖人於聽察精矣\n祠部式　卜相禁斷見上注\n相婦人　黃霸與善相者同出見一婦人相者曰富　貴乃娶家女霸娶為妻與之終身\n角犀豐盈　賢明之相國王\n惟德受天　以形合相\n貴賤旦殊　榮枯斯等\n鑄錢鄧通　夫王之深意\n賣珠董偃　遇館陶之厚恩\n衛青起自於牧羊　蔡澤叅問於躍馬\n辨吳蔡之貴　始自幼童\n知陶侃之榮　當期老也\n虛陳禍福　妄託災祥\n事且無妄　言而有徵\n論性命之期　定吉凶\n●凶相　附相門\n蜂目忍人　楚子以商臣為太子子上曰是人也蜂目豺聲忍人也不可立之\n豺聲滅族　楚子良生子越椒子文曰是子也熊虎之狀豺狼之聲不殺之必滅若敖氏矣鬼由求食若敖氏之鬼不其餒而後果滅之傳\n縱理入口　周亞夫縱理入口終餓死於獄中\n當刑而王　黥布姓英氏少時客相之曰當刑而王及壯坐法黥布欣然笑曰人相我當刑而王幾是乎人有聞者共為戲笑\n餓死　鄧通有相者云必餓死文帝曰能富通者我也乃與銅山鑄錢景帝時犯法貧餓死於獄中\n父不祥　莊子曰楚司馬子綦有八子召九方人相之孰謂祥曰子則祥矣父則不祥矣\n不過郡吏　後漢趙壹以郡吏致禮命十辟公府不就善相者相壹不過郡吏後果如其言\n攬鏡知刑　蜀張裕曉相術每舉鏡視面自知刑死未嘗不撲之於地後為劉備所殺\n越王蜂目　史記范蠡云\n晒刀　甘卓為歷陽陳訓私曰甘侯頭低視仰相名晒刀目中赤脈自外入必兵死後果為王敦所殺\n豺狼之聲　伯石始生叔向母及堂聞聲曰豺狼也必喪羊舌氏"},{"id":"juan9-025","source":"正文","juan":"卷第九","menu":"占候第二十三","sub_menu":null,"page":"三〇","leaf":"十三ウ","text":"史記曰計然曰歲在金穰水毀木大旱旱則資舟水則資車物之理\n山石自立樹葉成字　漢昭時太山萊蕪山南匈匈有數千人聲未之有大石自立白烏集傍上林苑中枯柳亦自立生食樹葉成文曰公孫病已立眭弘字孟以春秋陰陽推之曰太山王者受命之所石樹自立非人力所能當有庶人為天子者漢家宜禪讓坐妖言之誅\n天久陰不雨　漢昌邑王嗣立數出夏侯勝當輿諫曰天久陰不雨臣下有謀上者陛下出何之時霍光與張安世謀廢昌邑王光謂漏泄乃召勝問勝以洪範五行傳故知之光益信儒士也\n分卦更直日用事　京房字君明治易事焦延壽曰得我道以亡身者京生也其說事長於災變分六十四卦更直日用事以風雨寒溫為候以占驗而房用尤精妙也\n婦人生四子\n京師兵氣　南昌有婦人一生四子太子問唐檀災變之應檀以京師有兵氣其禍發於蕭牆至延和四年孫程揚兵省戮誅閻顯也\n黃龍見　後漢和帝永平末黃龍見譙喬玄曰此何祥　　當有王者不及五十年龍當復見此應見魏郡房豊密記之至建安二十五年龍復見譙其冬魏受禪\n魚生屋上　魏府有二魚長尺餘集武庫屋上有司以為吉祥王肅曰魚生於水而及於屋介鱗之物失其所邊將殆有棄甲之象後關東敗應之\n周禮以五雲之物辨吉凶水旱豐荒祲祥\n十二風察天地之和命乖變化之妖祥\n視祲掌十煇之法以觀妖祥\n傳曰凡分至啓閉必書雲物\n赤黑之祲　傳曰有事於武宮梓慎曰吾見赤黑之祲非祭祥也妖氛也\n昭二十年正月己丑日南至梓慎望氛曰今茲宋有亂蔡有大喪\n晉楚會于宋楚人衷甲伯夙謂趙孟曰楚氛甚惡懼難"},{"id":"juan9-026","source":"正文","juan":"卷第九","menu":"祈禳第二十四","sub_menu":null,"page":"三一","leaf":"十四オ","text":"寧風旱彌災兵遠罪戾祈福祥求永貞　周禮\n堂贈　男巫東室贈無方無筭弃往自堂始送不祥\n招彌　彌安也止凶禍\n率百隸時儺索室中\n甸師喪師代王受眚災\n女祝掌王后之內禱祀　祀報福也\n以時招梗禬禳以除災殃　除災害曰禬禬刮去也卻變異曰禳禳御未至也招招善去禳也四祀禮今唯有禳禮在梗音鯁禬音會\n牧人凡外祭毀事充可也　毀謂副辜侯禳毀除殃咎之屬\n宗伯以疈辜祭四方百物　疈磔而祭也\n肆師以歲時序其祭禮之祈珥　祈當為幾珥當為衈衈者釁禮之事雜記曰廟成則釁之類是也\n雞人掌凡國祭祀面禳釁共其雞牲　釁宗廟之屬釁以羊門夾室\n以雞司農云面禳四面也\n太祝掌六祈同鬼神祇　一類二造三禬四禜五攻六說注祈嘄也謂為有災變則號呼告神以求福也天神人鬼地祇同以祈祀\n傳曰宋災使禳火於玄冥回祿　玄冥水神祀之以抑火回祿火神祀之求弭水\n子路曰禱爾于上下神祇\n子曰丘之禱久矣　孔子素行合神祇\n禳彗　傳曰齊有彗星齊侯使禳之晏子曰無益也祇取誣焉彗除穢也若德之穢禳之何益也\n史記成王病周公翦爪禱祈\n漢文詔不令祈　詔曰先王遠施不求其報望祀不祈其福今祠官祝釐歸福於朕不為百姓今祠官致敬無有所祈\n磔雞　晉禮志曰歲旦常設葦茭桃梗磔雞於百吉門禳災氣漢儀用仲夏月有桃無雞雞起於魏青龍元年有司奏春分祠厲殃及磔雞不在祀典其除之也\n用牛　魏陳遵為西部都尉自周見父病以牛禱縣結罪棄市禱曰此孝子也表赦之遷郡太守\n眡祲掌安宅敘降　大序其凶禍禳移之\n被髮禱北斗　漢息夫躬為光祿大夫宜陽侯免官歸國未有第宅寄在丘亭姦人以侯家富夜守之躬邑人賈惠過躬教以祝盜方以桑東南枝為匕畫北斗七星其躬夜自被髮禱北斗招指人有上書言躬祝咀躬大呼而死矣\n因祭皋陶　范滂字孟博坐鉤黨繫黃門北寺獄獄吏謂曰凡坐繫皆祭皋陶滂曰皋陶賢者知滂無罪將理之於帝有罪祭之何益\n為官長禱　張綱字文紀為廣陵守長吏民祈禱曰千秋萬歲何時復見此君\n又　劉惔字真長為丹陽尹病篤人為祈禱曰丘之禱久矣\n又　後漢宋均叔祥為河內寢病老者日為祈請\n獲罪於天無所禱也"},{"id":"juan9-027","source":"正文","juan":"卷第九","menu":"忌諱第二十五","sub_menu":null,"page":"三二","leaf":"十四ウ","text":"史記陰陽家流拘而多忌\n好忌諱　後漢汝南陳伯敬行必矩步坐必端膝呵叱狗馬終不言死行路聞凶便回車留還觸歸忌則寄宿亭年老不舉孝廉後坐女婿亡吏受殺之\n不忌諱　趙興下邳人不恤忌諱每入官舍繕館穿移豐熾三代為司隸校尉\n反支日不受章奏　後漢明帝時公車以反支日不受章奏帝曰民廢農桑來詣闕拘以禁忌豈為政之意乎遂蠲其制\n傳曰辰在子卯謂之疾日君徹宴樂學人舍業為疾故也　紂以甲子喪桀以乙卯亡\n五月生子長與户齊不利其父　田嬰賤妾生子名文以五月生嬰令勿舉母竊舉之長見嬰怒曰五月生子長與户齊不利於父文頓首曰若受天之命何憂也若由户但高其户又之"},{"id":"juan9-028","source":"正文","juan":"卷第九","menu":"書第二十六","sub_menu":null,"page":"三三","leaf":"十五オ","text":"六文之體也　古今篆隸書體曰六文者蓋為文之體也一曰象形二曰指事三曰會意四曰假借五曰形聲六曰轉注\n八體　漢書注曰八體一曰大篆二曰小篆三曰刻符四曰蟲書五曰摹印六曰署書七曰隸書八曰行書\n筋雲　蔡邕表曰垂筋雲\n垂露　也以書章奏請點綴輕雲之於垂條也古今篆隸曰垂露書漢中郎曹喜所作\n臨池盡墨草聖　張芝伯英善草書凡家之衣帛必先書而後練之臨池學書池水盡墨也紙不遺草仲將謂之草聖\n銀鉤\n驚鸞反鵲　勢 王書\n鳥跡　蒼頡觀鳥跡而成字\n蟲書　科斗古文\n圖扇　王右軍草書於圖扇\n二妙八行得伯英之筋　晉衛瓘字伯玉索靖字幼安俱能書為尚書郎時號一臺二妙瓘　伯英之筋靖得伯英之肉\n墨妙\n筆精\n記姓名　漢書項羽少時學書不成曰書足記姓名而已\n墨池\n彩筆\n父子　王羲之及子獻之並善書故號二王書皆曲盡其妙\n鍾張　鍾繇張芝皆善書\n瓘靖　注見上\n投筆　班超投筆歎曰大丈夫安能久事筆硯乎\n六書　周禮六藝五曰六書見上注\n曲藝　書也\n小學　漢元始中徵天下通小學者以百數各令記字於庭中楊雄取其有用者作訓纂篇\n正六經　蔡邕以經籍去聖久遠文字多謬乃奏求正定六經文字帝許之邕自書丹於碑使工鐫刻立於太學門外於是觀視摹寫者車日千餘兩\n書窓塵　窓塵　　　紙書窓塵積而書之\n湛垂露於毫端　起於筆杪\n寫八體之殊蹤　窮二王之逸勢\n龍圖始啟　則八卦之象可觀\n鳥跡初分　則六體之作書爰起\n典墳之韞櫝　為文字之鵬\n經籍於是乎興　書述是\n巧同懸露　妙若山雲\n化成天下　其由此乎\n六角竹扇　書法云右軍見一老姥賣六角竹扇因取書之扇各增其價姥後求書笑而不荅\n衛恒　字巨山善草隸為四體書或不持錢詣酒家飲因書其壁觀者酬錢計足而滅之\n●王者書　附書門\n同文　今天下書同文\n以代結繩之政　古者伏羲氏之王天下也始畫八卦造書契以代結繩之政由是文籍生焉\n龍騰魚躍鳳集　古今篆隸文體曰龍書者太昊氏獲景龍之瑞以紀官用頒政令魚書者周武王有白魚之瑞因為魚書鳳書者白帝朱宣氏有鳳鳥之瑞文字取以為象\n八卦　伏羲龍馬負圖羲氏則之畫為八卦身之文\n九疇　洛龜負圖夏禹觀之得九疇之文矣\n觀乎人文天文　日月之文"},{"id":"juan9-029","source":"正文","juan":"卷第九","menu":"圖畫第二十七","sub_menu":null,"page":"三四","leaf":"十五ウ","text":"畫工繢事\n繢\n彰施　書曰以五彩彰施于五色作服汝明\n作繪　書曰作繪宗彝繪會五綵以作畫也宗彝宗廟彝器畫為文章\n若五彩之相宣\n文受采　禮白受采\n遁形　物無遁形\n手擇　筆精\n心匠　天真\n指趣五色之章　目不別五色之章為昧\n儀形比象丹青挫於筆端\n目想　心存\n設色　周禮設色之工謂之畫\n畫繪之事　周禮凡畫繢之事雜五色後素功注云素白采是也\n五色成文而不亂　禮\n藝成而下\n予欲觀古人之象日月星辰山龍華蟲　畫此八物於衣服\n五色比象昭其文也　謂車服也\n三辰旂旗昭其明也　三辰日月星辰也\n善惡　家語孔子觀於明堂有堯舜桀紂之象各有善惡之狀興廢之誡也\n功勳　漢畫功臣於麒麟閣\n葉公好龍　居室皆雕畫以寫龍於是天龍聞而下葉公驚走乃知所好非真龍\n畫虎　馬援誡兄子曰學杜季良不成猶畫虎不成反類狗也\n畫堂　漢太子生於甲觀畫堂\n寫真　晉顧愷之畫殷仲堪仲堪有目疾乃　　　　子飛白拂上白如輕雲蔽月之\n為蛇畫足\n誤點成蠅　曹不興誤點屏風因就畫為蠅孫權謂是真以手彈之\n峻宇彫牆　書\n藏文仲山節藻梲何如其知　畫梲為藻文\n畫狗馬者難為巧　圖鬼神者易為功韓非云\n圖裴楷　顧愷之圖裴楷頰上加三毛覺神明殊勝\n誤筆成牛　王獻之善　桓溫使畫扇筆誤落因畫作烏駁牸牛甚妙\n舐筆和墨　莊子言畫工\n設色之工五　周禮\n畫人　顧愷之畫人成或數年不點睛人問之荅曰四體妍蚩本無關於妙處傳神寫照正在阿堵中也\n擬諸形容　象其物宜\n象生於意\n容止可觀　進退可度則　而象之"},{"id":"juan9-030","source":"正文","juan":"卷第九","menu":"執馭第二十八","sub_menu":null,"page":"三五","leaf":"十六オ","text":"五馭　周禮六藝四曰五馭謂鳴和鸞逐水曲過君表舞交衢逐禽左\n執御　子曰吾何執執御乎執射乎吾執御矣\n六轡如濡\n執轡如組\n車馬之容　周禮六儀六曰車馬之容注容謂匪匪翼翼然\n規行矩步\n造父　古之善御者\n載馳載驅\n既佶且閑\n既閑且馳\n服習如志　傳曰之大事必乘其產安其教訓而服習其道唯所欲之無不如志\n人馬相得\n銜轡之制　法言曰夫騏驥古之良馬然而前有銜轡之制後有策之威加之以御然後能一日而致千里\n當代豈無騏驥誠莫之能善御　見執轡者非其人遂足蹶而疵去莊蹄\n終歲御而衣衽不敝　也謂轡之和御者不勞也\n終日馳騁左右不捷　音謂倦也\n行數千里馬不契需　注契需謂傷倦也\n御者不盡馬之情　史記云\n執技以事上　射御也禮\n君車將駕則僕執策　御也\n展軨　視車之具\n效駕　白已駕\n執策分轡\n驅之五步而立　謂調試也\n并轡授綏　勸君\n進退有度　徐疾不愆\n學傳騶乘　業擅驪\n逐水鳴鸞　見上\n夫子之執　吾執御矣\n朽索之馭六馬\n人謀馬謀　人進則與馬謀退則與人謀注云相應也終歲馭而衣衽不敝此轡之和也\n逸馬　家語顏回曰　　馬方畢之馬也盡矣而猶求馬不已馬窮必逸也\n經霜雪無跡　淮南子太丙之御經霜雪無跡\n善行無轍跡　老子\n尹儒夢秋駕　莊子注云秋駕法駕也見七命注中\n餘轍餘地　列子造父師泰豆曰汝先觀吾趣趣行也乃立木為塗僅可容足計步而置之履之往還無跌失三日盡其巧豆歎曰得矣於是應之於心措於銜轡之間緩急乎唇吻之和正度乎胸臆之中執節乎掌握之間內得其中外合馬志輿輪之外可使無餘轍馬蹄之外可使無餘地　　　之一也\n馬志　文子曰人道如造父之御內得其心外合馬志\n范氏驅馳詭遇　孟子曰趙簡子使王良與嬖奚乘王良辭吾為范氏驅馳終日而不獲一為詭遇一朝而獲十范法也為以法式為御故不獲禽詭遇也不依御法故得\n傷吻敝策　王褒論曰庸人御駑馬傷吻敝策而不進及駕齧膝驂乘王良執靶韓哀附輿馳騁忽如景靡過都越國蹶若歷塊追奔電逐遺風萬里一息人馬相得\n馬驚敗績　魯莊公戰宋人縣賁父御卜國為右馬驚敗績縣賁父曰他日不敗績而今敗績是無勇也遂死之\n田獵射御　慣則能獲禽若未嘗登車射御則敗績厭覆是懼何傳\n御非其馬之正　汝不恭命書\n六轡沃若\n牽旁塵不出軌并轡　張侯御郤子郤子病張侯乃左并轡右援枹而鼓\n使訓羣騶知禮　晉程鄭為乘馬御六騶屬焉\n驂絓而止　傳\n驂迫　州綽右驂迫還于門中\n車軌塵馬候蹄\n御者不失其馳　穀梁\n弭轡　弭斂也\n迴軌　迴長者之車\n乘君子之器\n王良叱之於飼閣　父及之於嗋\n掉鞅而還　伯樂有一致師之勇\n數馬而對　石慶　慎之情\n以合人心　將調馬性\n霍光　宣帝驂乘上若負芒刺張安世驂乘上乃安霍氏之禍萌於驂乘\n叔良御忌\n抑磬控忌　騁馬曰磬止馬曰控"},{"id":"juan9-031","source":"正文","juan":"卷第九","menu":"醫第二十九","sub_menu":null,"page":"三七","leaf":"十七オ","text":"良醫　傳曰三折肱知為良醫也\n醫不三代　不服其藥\n秦醫　醫和醫緩\n三折　見上\n十全　周禮醫師十全為上十失二次之十失四為下\n九折　楚辭九折臂而成醫\n藝成而下\n技以事上　業在其中\n巫咸之術不可救療　傳\n秦緩秦和\n俞跗華佗扁鵲　並良醫\n折肱之醫　苦口之藥\n疾醫　掌養萬人之疾病\n掌日臻之病　得失　輪\n稽終歲之功　上下\n聚毒之功　暴食\n上池之術　史扁鵲飲上池之水可以見五臟\n疾既入於骨髓　扁鵲見桓侯曰君有疾在皮膚針灸可及後數日在腠理湯熨所可及後見桓侯而反走曰病在骨髓針灸湯藥皆不及也數日桓侯病召扁鵲扁鵲已逃公乃卒\n藥不至於膏肓　秦使醫緩視晉侯疾曰肓之上膏之下攻之不可達針之不可及藥不至焉不可為\n南人有言曰　人而無恒不可以作巫醫\n遺類　子產曰使醫除疾而曰必有遺類焉未之有也\n四難　後漢郭玉云療貴人有四難焉自任不用臣言一難將身不謹二難骨節不彊三難好逸惡勞四難\n浣腸　扁鵲曰上古俞跗療病不以湯液乃割皮解肌浣腸胃滌洗五藏也\n刮骨　蜀關羽為流矢所貫醫曰矢鏃有毒入骨乃破臂刮骨去毒飲啖自若\n亨文摯　齊威王有疾良醫文摯曰令王大怒則愈乃三大怒將亨文摯\n罵賜　漢高祖疾甚呂后迎醫醫曰可治上罵曰命乃在天雖扁鵲何益不使治賜金十斤\n不可為也　晉侯求醫於秦秦伯使醫和視之曰疾不可為也是為近女色疾如蠱非鬼非食惑以喪志也\n以制其食　周禮醫師掌醫之政令凡有疾病者分而治之歲終則稽其醫事以制其食十全為上十失二次之十失三又次之十失四為下注食祿也\n食醫　掌和王之六食六飲六膳百羞百醬八珍之齊\n聚毒　醫師掌醫之政令聚毒以供醫事凡疾病死傷者造焉\n瘍醫　凡療瘍以五毒攻之\n視死生　疾醫掌養萬人之疾以五味五藥五穀養其疾以五氣五聲五色視其死生也\n采雲　不呼醫飲藥\n華佗字元化破腹取病　病若結積針藥不及者令飲麻沸酒至醉因破腹取病之在腸胃中者後煎洗縫以膏摩之五日而差\n病同療異　倪尋李延俱病頭痛身熱華佗獨令延發汗或問之佗曰尋外實延內實各以藥飲明旦俱起\n怒　郡守病佗曰以盛怒方差乃多取佗貨而不加功又棄去留書罵之太守怒令追殺之不得嗔恚吐血數斗而愈\n誤中肝　徐毅得病謂華佗曰昨日使醫曹家人迎妻施每樹不可解引妻者顛仆曰我未當死服藥多而傷五藏\n潰痤舐痔　莊子秦王破癰潰痤得車一乘舐痔者得車五乘所治愈下得車愈多也\n良醫　庸醫\n何氣候之將衰　而致養之有失\n通五味五穀之資　必順其志\n參九藏九竅之變　無逆於時\n精為神本　形與壽期\n門擅桐君之術家傳葛氏之方\n藥不至焉　三世之功何益\n疾可為也　十旬之間有瘳\n華佗　臨死出一卷方與獄吏曰可以活人吏畏法不敢取佗索火燒之"},{"id":"juan9-032","source":"正文","juan":"卷第九","menu":"藥第三十","sub_menu":null,"page":"三八","leaf":"十七ウ","text":"易曰勿藥有喜象曰无妄之藥不可試也\n藥弗瞑眩厥疾不瘳　書\n聚毒　醫師掌聚毒藥藥之辛苦者\n惡石　傳曰臧孫之惡我藥石也美疢不如惡石夫惡石猶生我疢之美其毒滋多\n秦人毒涇上流　晉師飲之故多死者\n康子饋藥　拜而受之曰丘未達不敢嘗\n良藥苦口利於病　張良云\n上藥養性　中藥養病\n君臣之藥\n并合藥　姮娥竊食之而奔月\n青囊\n蛇膽　見孝感門注\n聚蓄百藥　月令仲夏\n不服其藥　醫不三代\n一丸　魏文帝詩曰與我一丸藥光輝有五色\n二價　韓康字伯休賣藥不二價\n將欲救療　必先聚蓄百藥\n薏苡　馬援在南中得薏苡子食久而輕身辟邪氣乃載一車聚為種人言援所載皆明珠文犀\n芎藭　申叔展謂還無射曰有山芎藭乎曰無河魚之腹疾奈何注云欲使無射逃水中故問無射濕之\n腹疾奈何\n馬援之欲身輕　將求薏苡\n無射之憂腹疾　空望芎藭\n審味於農帝之經　考名於桐君之錄\n列君臣百品之名　辨辛苦五毒之味\n嘗味　帝王世紀黃帝使岐伯嘗味於百藥\n陸抗飲藥　抗羊祜饋藥抗不疑而飲之或止之抗曰羊叔子豈酖人者哉\n五藥　草木蟲石穀\n寘堇　驪姬寘堇於肉堇烏頭也國語\n寒石散　皇甫與乖謐士安羸疾而披玩不息服寒石散性違每委頓不勝悲憤欲自殺叔母止之\n婢丸藥　晉陳壽父喪羸病使婢丸藥沉累十餘年\n嘗酖毒藥　魏太祖性嚴掾屬以公事往往加杖何常酖毒藥誓死無辱是以終身亦不及也\n進藥於父　傳曰許悼公瘧飲太子止之藥卒故書曰止弒其君君子盡心力以事君舍藥物可也言藥有毒非常人知之識止不捨藥物故加弒君之名\n孝子操藥以脩慈父\n聖人蓄之\n投藥水中　公羊齊人守遂遂人投藥水中齊人飲之殲焉\n漆葉青黏散　華佗授弟子可服之年百餘歲\n裴頠上言　宜正大醫權衡此若差違大神農岐伯之政藥分兩輕重補為害本深古壽考今夭折由此也\n郭文　字文舉病王導遺藥文曰命在天不在藥壽長短時也"},{"id":"juan9-033","source":"正文","juan":"卷第九","menu":"疾第三十一","sub_menu":null,"page":"三九","leaf":"十八オ","text":"寢疾有加無瘳\n伯牛有疾　子曰斯人也而有斯疾也\n无妄之疾　易勿藥有喜\n遘厲\n虐疾\n日臻　顧命曰病日臻\n彌留　彌留彌反也\n疾大漸惟幾　幾危也\n六極　二曰疾\n節宣其氣勿使有所壅閉湫底以露其體　露羸也子產云\n五福　三曰康寧無疾病也\n愆于厥身　病也\n病未及死吾子忍之　張侯謂郤克云\n疾虐方起\n病莫能興\n死而後已\n天有災癘\n厥疾不瘳\n恫瘝乃身　恫痛也瘝病也\n美疢\n沉痾\n多瘠罔詔　言人疾不問謂針書\n積憂成病\n遘癘\n四時皆有癘疾　周禮\n寬疾　周禮以保\n息六養萬民五曰寬疾有疾者寬養之\n大札移人　又曰大札則令邦國移人注大札疾疫也移人避災也\n病閒　閒差也\n人有大疫　月令\n夫子之病革矣　革音亟\n不令兄弟交相爲瘉\n夢爲豎子　晉侯夢病爲二豎子\n夢黃熊　奴來反\n入門　傳晉侯有疾韓宣子問子産曰寡君寢疾三月矣今夢黃熊入於寢門厲鬼乎子産曰昔堯殛鯀于羽山其神化爲黃熊入于羽淵三代祀之晉爲盟主其未祀乎韓宣子乃祀夏晉侯有閒\n子之所慎　齋戰疾\n重膇之疾　傳郇瑕氏土薄水淺其惡易覯於是有沈溺重膇之疾\n膏肓　晉侯之疾肓之上膏之下藥不至焉\n詐寢　令尹薳子馮以疾辭官重繭衣裘鮮食而寢王使醫視之曰瘠則甚矣而血氣未動\n佯　　　疾讓爲於兄佯病狂而壞容貌\n僞　吳公子光僞足疾入于窟室\n敗面　魏祖少游蕩叔父數言於其父嵩祖患之僞敗面口偏叔父見云中惡風又告嵩嵩驚呼曰叔父言汝中風已差乎對曰初不中風但失愛於叔父故見罔爾自後叔父所告嵩終不復信也\n父母唯其疾之憂\n伯牛有疾　子問之自牖執其手\n玉體不安　七啓楚太子有疾吳客往問之曰聞太子玉體不安\n啓手足　曾子有疾召門弟子曰啓予手啓予足而今而後吾知免矣\n楚昭王曰　除腹心之疾而寘諸股肱何益也\n晝居於內　問其疾可也\n疾病　禮疾病外內皆埽君大夫徹縣士去琴瑟寢東首於北牖之下\n君視　疾君視之東首加朝服拖紳\n消渴　司馬相如常患消渴\n瘨眩　揚雄曰臣常有瘨眩之疾\n漳濱　劉公幹臥病漳濱\n頭風　陳琳作檄事見檄門\n子疾病　子路請禱子曰丘之禱久矣\n祟　晉侯有疾叔向問子産曰寡君疾病卜人曰實沈臺駘爲祟敢問何神也子産曰實沈參神也臺駘汾神也二者不及君身君之身則出入飲食哀樂之事山川星辰之神又何爲焉\n六疾　傳曰天有六氣淫則生六疾陰淫寒疾陽淫熱疾風淫末疾雨淫腹疾晦淫惑疾明淫心疾\n內熱　女陽物晦時淫則生內熱惑蠱之疾\n汲黯之臥淮南　劉楨之居漳濱\n疕瘍　皆瘡也周禮\n癈疾非人不養者　一人不從政政繇役也\n問疾不能遺　不問其所欲\n卿大夫疾　君問之無筭\n士　一問之\n君於大夫疾　三問之\n展轉伏枕\n既微且尰　骭瘍爲微腫足爲尰\n易簀　舉扶而易簀反席未安而沒曾子之\n苟偃癉疽　生瘍於頭目出著癰病也\n非鬼非食　惑以喪志左傳\n孟縶之足不良　能行跛也\n天疾　穀梁曰有天疾者不得入於宗廟\n智囊宿瘤　並癭也\n越聲　莊舄越人仕楚執珪及病爲越聲\n躄者盤散行汲　平原美人笑之\n重病　趙岐年三十有重疾自慮奄忽遺令立碑於墓前刻曰漢有逸人姓趙名嘉後疾愈矣\n生癭　賈逵爭公事發憤生癭癭欲割之太祖惜之曰十人割九人死逵猶割竟愈\n牀下蟻聲　殷仲堪父患耳聰聞牀下蟻動如牛鬬聲\n杯中蛇影　樂廣爲河南尹有親客久不來廣問之對曰前在坐蒙飲見杯中有蛇影意惡之而有疾于時廳上有角弓畫作蛇廣意是弓影也乃告所以仍令坐舊處與飲杯中乃是弓影遂豁然而愈\n痁作而伏　趙舉戰無勇麇之吏請之御對曰痁作而伏麇吏也\n負薪之憂\n嚙被　樂頤之病患母聞不敢呻吟嚙被至破\n久嬰漳浦　常寢　疾如\n臨不測之泉　似執將枯之木\n相如疾甚　留封禪之書\n朱超伏枕　有寄文之作\n三疾　戶令諸一目盲兩耳聾手無二指足無大拇指禿瘡無髮久漏下重大癭腫之類皆爲殘疾癡瘂侏儒腰折一枝癈如此之類皆爲癈疾瘨狂兩枝癈兩目盲如此之類皆爲篤疾\n趙簡子病五日不知人　扁鵲曰血脈均治也昔秦穆公如此七日而寤寤曰我之帝所樂主君病間三日必間及寤曰我之帝所觀鈞天廣樂賜鵲田四萬畝\n病忘　列子宋陽里華子中年病忘\n不可救療　傳\n●疾疫附疾門\n疾疫方起\n天有災癘\n天災流行"},{"id":"juan9-034","source":"正文","juan":"卷第九","menu":"疾第三十一","sub_menu":"（續）","page":"四一","leaf":"十九オ","text":"人有大疫\n人殃於疫\n國多風欬\n人多瘧疾\n寒暑不時　則疾\n桓石虔之差瘧　桓豁字石虔爲人勇壯時有患瘧者呼桓石虔以怖之瘧者多愈\n庾袞　字叔褒咸寧中大疫二兄俱亡以兄毗復病癘氣方盛父母諸弟皆出於外袞獨不去父母彊之可親自扶持晝夜不眠其間又撫柩哀號不輟十餘旬疫勢消歇家人乃反毗疾差袞亦無恙"},{"id":"juan9-035","source":"正文","juan":"卷第九","menu":"瞽第三十二","sub_menu":null,"page":"四二","leaf":"十九ウ","text":"眇能視　易\n子見瞽者雖少必作過之必趨\n喪明　子夏喪其子而喪其明\n盲子夏　杜欽字子夏目偏盲與杜鄴同姓字俱以才能見稱京師謂欽爲盲子夏欽患之乃獨爲小冠由是京師人呼爲小冠子夏\n盲夏侯　魏夏侯惇爲流矢中傷左目與夏侯淵俱爲將軍中號惇爲盲夏侯\n求方　晉范寧患目疾就中書侍郎張湛求方湛嘲之曰古方宋陽里子受魯東門伯伯受左丘明丘明傳杜子夏一減思慮二專內視\n婢進蠐螬　盛彥事見父母疾門\n倀倀乎　目無所見數\n左氏喪明厥有國語　司馬遷云\n五色令人目盲　老子\n師冕見　及階子曰階也及席子曰席也皆坐子告之曰某在斯某在斯師冕出子張問曰與師言之道與\n任永君馮信　並好學公孫述徵不就皆託青盲及述誅而目明"},{"id":"juan9-036","source":"正文","juan":"卷第九","menu":"獸醫第三十三","sub_menu":null,"page":"四二","leaf":"十九ウ","text":"獸醫掌療獸病及瘍　周禮\n凡療獸病　灌而行之以節以動其氣\n療獸瘍　灌而刮之以發其惡然後養食之\n張里　以馬醫而擊鍾漢書\n牛醫之子　黃憲\n巫馬掌養疾馬而乘治之相醫而藥攻馬疾受財于校人　乘謂驅步以發其疾知病所處乃治之相助也"},{"id":"juan9-037","source":"正文","juan":"卷第九","menu":"巫第三十四","sub_menu":null,"page":"四二","leaf":"十九ウ","text":"用史巫紛若吉　易\n司巫掌羣巫之政令　國大旱則帥巫舞雩國有大災則帥巫而造\n巫恒　會常聚之處以待命\n女巫掌歲時祓除釁浴　歲時祓除若今三月上巳如水上之類釁浴以香薰草藥沐浴\n在男曰覡女曰巫　使制神處位國語\n沉巫　西門豹爲鄴令沉巫覡\n焚巫　傳夏　　公欲焚\n娶巫家女　黃霸娶巫家女知其有貴故娶之\n自汙　後漢高鳳不應恐不免自言巫家子以自汙也\n小巫見大巫神氣殫矣　吳書張紘見陳琳作武庫賦歎之琳荅曰僕在河北此少文章易爲雄伯故使僕有此過譽今足下子布在彼所謂小巫見大巫神氣殫矣\n桑田巫　晉侯病召桑田巫曰不食新麥矣\n梗陽之巫皋　梗陽邑名皋巫名\n章丹陳朱隱形吐火　晉夏統仲御從父敬寧祠先人迎女巫章丹陳朱二人並有國色莊服甚麗善歌舞又能隱形匿影甲夜之初撞鍾擊鼓間以絲竹丹珠又拔刀吐火雲霧杳冥流光發電統諸兄弟欲往觀之而難統於是共迎之曰從父間疾病得瘳小大以爲喜慶欲因祭祀並往賀之卿可俱行乎統從入門忽見之驚愕而走\n惟神與鬼　杳杳冥冥\n託以師巫　招於祈禱\n天神人鬼雖達幽冥　如有邪妄\n其或闕之　不爲知禮\n越巫立祠天神上帝　百鬼以雞卜史記\n宋陽里華子　病忘謁巫而卜之不吉列子"},{"id":"juan9-038","source":"正文","juan":"卷第九","menu":"投壺第三十五","sub_menu":null,"page":"四三","leaf":"二十オ","text":"禮記\n投壺之禮主人奉矢司射奉中使人執壺主人請曰某有枉矢哨壺請以樂賓賓曰子有旨酒嘉肴某既賜矣又重以樂敢辭　燕飲於坐主人乃請投壺也枉哨不正貌主人曰敢固以請賓曰某固辭不得命敢不敬從賓再拜受　拜受矢也主人般還曰辟主人阼階上拜送賓般還曰辟　般音盤還音旋辟音避下同即兩楹間　言將有事於此退反位揖賓就筵　欲與偕立明爲耦也設中東面執八筭興請賓曰順投爲入比投不釋勝飲不勝者正爵既行請爲勝者立馬一馬從二馬三馬既立請慶多馬　馬勝筭者命弦者奏貍首　弦鼓瑟者貍首詩篇名間若一\n左右告矢具請拾投　拾更也音其劫反有入者則司射坐而釋一筭焉賓黨於右主黨於左命酌曰請行觴當飲者皆跪奉觴曰賜灌　灌飲也當飲者謂不勝者勝者跪曰敬養筭多少視其坐　坐人多少四矢則四筭籌室中五扶堂上七扶庭中九扶　籌矢也四指曰扶筭長尺二寸壺頸脩七寸腹脩五寸口徑二寸半容斗五升壺中實小豆焉爲其矢之躍而出也壺去席二矢半矢以柘若棘毋去其皮魯令弟子辭曰毋幠毋敖毋偝立毋踰言偝立踰言有常爵薛令弟子　踰言以上魯同若是者浮　唯此一句與弟子賓主黨也\n魯鼓薛鼓　言舉各有節\n中雋有酒有肉　傳晉侯與齊侯投壺晉侯先曰有酒如淮有肉如坻寡人中此爲諸侯師中之齊侯曰有酒如澠有肉如陵寡人中此與君代興亦中之伯瑕謂中行穆子曰子失辭吾固師諸侯矣壺何爲焉其以中雋也以中爲雋\n軍中　東漢祭遵爲將軍士皆用儒術每雅歌投壺在軍旅中不忘其俎豆也\n主人有儀　弟子無數\n既備主禮　以宗賓儀\n展再拜之儀　盤旋而避\n備三辭之禮　揖讓而升\n賓主之歡　禮樂之節\n初筵有踐　正爵既行\n主三請以執壺　賓再拜而受矢\n筭惟視坐　矢則拾投\n賓階主黨爲勝者立馬而慶多　當飲者賜灌而敬養\n魯薛之令　齊晉之君\n侍投則擁矢　侍長者投壺擁矢致敬也\n勝則洗而以請　洗爵請行觴而不灌直飲\n客亦如之　亦洗而請\n不角　角觶也於尊長不行爵但如獻酬之禮\n不擢馬　擢徹也於長者不徹馬讓勝也\n魯鼓薛鼓　鼓節　半以上爲投壺禮盡用之爲射禮\n王弼　善投壺魏略云\n嘉賓授矢　既即兩楹\n司射度壺　度以八筭\n勝而慶馬　慶多馬則\n敬手玉女投壺"},{"id":"juan9-039","source":"正文","juan":"卷第九","menu":"博棊第三十六","sub_menu":null,"page":"四五","leaf":"二十一オ","text":"附弈博傳甯子\n視君不如弈者舉棊而不勝其偶　左傳\n楚辭曰箟蔽象棊有六博　箟蔽玉箸也以象飾其投六箸行六棊故曰六博也\n分曹並進遒相迫　曹偶也遒亦迫也\n成梟而牟呼五白　梟勝也倍勝爲牟五白簙齒也\n晉制犀比費白日　晉制工制作博箸比集犀角爲障節投之如白日之光費日光貌\n投江　晉陶侃語人曰聖人惜寸陰衆人當惜分陰諸參佐或以戲廢事乃取樗蒱局投之於江也\n擲局　漢景帝爲太子與吳太子博而爭道以局擲殺吳太子文選云殞吳嗣於局下慈發憤於一博\n猶賢　子曰飽食終日無所用心難矣哉不有博奕者乎爲之猶賢乎\n好行小惠\n當惜分陰\n結黨連羣\n傾財破產\n爭勝負\n呼五白\n賭千　金\n一擲百萬\n藝成而下\n漢虞丘壽王善格五待詔　注云博類也不用箭但行梟散又曰格三行塞白乘至五格不得行又曰今之簺音先代反戲\n博進　漢宣帝微時與陳遵祖父遂有故相隨博奕數負進宣帝即位用遂至太原太守賜璽書曰官尊祿厚可以償博進矣妻君寧在旁知狀遂頓首曰在赦前\n劇孟博徒\n覆棊　魏志王粲觀人圍棊局壞粲爲覆之棊者不信以帊蓋他局用比較不誤一道方知其彊記也\n馬融圍棊賦曰　圍棊者法於用兵怯者無功貪者先亡\n臨難圍棊　蜀志費禕與來敏圍棊于時羽檄交馳嚴駕已訖禕留意對奕色無厭倦敏曰君必能辦賊者矣禕至敵遂退也\n亡羊　莊子臧與穀俱牧羊而俱亡其羊問臧何事挾策讀書問穀何事博塞以遊也\n堯造圍棊教丹朱　博物志\n說文曰弈圍棊也塞行棊相塞之塞\n王戎　居喪不拘禮制或觀博奕然容貌毀悴\n阮籍棊聞喪不止　聞母喪而方與人棊棊者求止籍留與決而畢哀號吐血數斗\n王獻之觀人奕曰　南風不競人曰此郎所謂管中窺豹時見一斑獻之曰近愧荀奉倩遠慚劉真長拂衣而去\n劫急　陳留阮簡字茂弘爲開封令有劫賊吏白曰甚急簡方圍棊長嘯吏曰劫急簡曰局上劫亦甚急\n禁博棊　管子五政其一也\n樗蒱擲馬　庾翼集曰\n鞭爛鞍杇　異苑曰有人乘馬山行見洞裏有二老公相對樗蒱遂下乃以馬策柱地觀之俄然馬鞭爛馬鞍朽也\n爛柯　與鞭爛類樵人也\n呼梟　木馬\n博塞以遊　分曹是習\n晉袁耽字彥道　善博桓溫少游博徒資產俱盡尚有負進求濟於耽耽在服試告焉略無難色遂變服懷布帽隨溫與債主戲耽素有藝名債者聞而不識謂曰汝當不辦作袁彥道也遂就局十萬一擲直上百萬耽投馬絕叫探布帽擲地曰竟識袁彥道否通曉如此也\n負進　注見上\n樗蒱　劉毅家無儋石之儲樗蒱一擲百萬\n雉盧五木　劉毅　　　於東府聚樗蒱一擲應至數百萬餘並黑犢以還唯劉裕及毅次擲雉大喜褰衣遶床叫謂同坐曰非不能盧不事此耳裕惡之因挼五木久之曰老兄試爲卿答既而四子俱黑其一子轉躍未定裕厲聲喝之即成盧毅意殊不快也\n牧猪奴戲　陶侃投樗蒱博局於江曰樗蒱者牧豬奴戲爾\n三盧　慕容寶與韓黃李根等因讌樗蒱危坐整容誓之曰世云樗蒱有神豈虛言哉若富貴可期頻得三盧於是三擲盧寶拜而受賜\n論　吳書韋曜字弘嗣爲太子中庶子時蔡穎亦在東宮性好博奕太子以爲無益命曜論之\n心懼棊弱　苻堅入寇衆號百萬京師震懼謝玄入見安安夷然不懼曰已別有旨玄不敢言乃令張玄重請安遂出遊別墅與玄棊賭墅安常劣於玄是日玄懼便爲敵手而又不勝安顧情鎮物如此\n爭道　王導與其子悅奕棊爭道導笑曰相與有瓜葛那得爲爾\n忘憂　祖納字士言好奕棊王隱謂之曰禹惜寸陰不聞數棊納曰以忘憂也\n敎奕　奕秋通國\n之善奕秋誨二人奕其一人專心致志惟奕秋之爲聽其一人雖聽之一心以爲有鴻鵠將至思援弓繳而射之與之俱學不如也\n將爲智獲　言在方求\n勞情損思　廢日妨功\n存勝負之宜　之理戰成敗\n贏師失敵　襲計乘虛\n道可存焉　其莫使述復\n博奕爲戲　典禁光明\n始開藝表蹟之源　敘讓之本\n君侮吝則抱朴興言　勞情思則奚儲發歎\n禹帝立言　寶有輕於尺璧\n陶公明戒　昔禹貴寸陰\n勢似兔宮　形如魏穴\n失禮迷風　圍棊是也賈誼云\n廢時曠日　韋曜論云\n曹子建　論　作圍棊言陣如此"},{"id":"juan9-040","source":"正文","juan":"卷第九","menu":"彈棊第三十七","sub_menu":null,"page":"四七","leaf":"二十二オ","text":"粧奩之戲　彈棊起於魏宮以粧奩之戲\n手巾　魏文帝以手巾拂之無不中客有以角巾拂之矣\n星懸　鳥跋\n百中　一擲\n應手　心\n以代蹴鞠　西京雜記漢武帝好蹴鞠有進彈棊者以代之帝悅以青羔裘\n斂手"},{"id":"juan9-041","source":"正文","juan":"卷第九","menu":"賭第三十八","sub_menu":null,"page":"四七","leaf":"二十二オ","text":"賭香囊　謝玄少好佩紫羅香囊叔父安患之不欲傷其意因賭取焚之遂止\n一擲百萬　劉毅見上注\n負進　博徒\n賭郡　羊玄保到会石到郡也\n賭田射　史記田忌與齊諸公子馳逐重射孫臏令田忌曰今君勝以君下駟當彼上駟以君上駟當彼中駟以君中駟當彼下駟一不勝而再勝也"},{"id":"juan9-042","source":"正文","juan":"卷第九","menu":"筭第三十九","sub_menu":null,"page":"四七","leaf":"二十二オ","text":"歷筭小學　漢平帝紀徵天下通知　　筭小學所在必驚一封遺詣京師　　　云一封乘一馬\n射隱伏　吳趙達治九宮一筭之術究其微旨精密計數禮射隱伏無不中也又取數斗小豆播席　　　　　驗覆果信\n知主人酒肉處　趙達知故家具以食畢主人曰乏無以爲歡達因取盤中箸再三縱橫曰君東壁下有美酒一斛鹿肉三斤主人慙曰以卿善射故相試耳\n筭虛數　人又書於簡上作千萬數著空倉中封之令達筭之亦知其數\n知自終　趙達引筭自歎曰吾筭訖矣妻聞而哭達聞妻養方曰與者　　　知期而歿\n左傳曰絳老曰　臣生之歲正月甲子朔四百四十有五甲子矣其季於今三之一也史趙曰亥有二首六身下二如身\n是其日數也士文伯曰然則二萬六千六百有六旬也\n該天地而總陰陽　測鬼神而知變化\n採越人之餘策　持晉相之臣善\n并含不差　毫釐不差\n桑弘羊　心計度數謂不以籌也\n鄭玄事馬融　融考圖緯令玄筭之歎曰鄭生東去吾道東矣\n屈指心計　吳範諸葛　　當籌未嘗下筆筭徒屈指心計盡發疑　人皆服之\n公孫龍　少師事趙達許教之者有年數矣滕拜自請臨與晚請之達曰先人得此術圖爲帝王師而三代不過太史郎誠不合要傳之微頭斷尾除一筭之法父子不相語今眞相授乃出素書兩卷曰吾久不省覽事　日當與後往言失之也\n善計不用籌筭　老子"},{"id":"juan9-043","source":"正文","juan":"卷第九","menu":"射覆第四十","sub_menu":null,"page":"四八","leaf":"二十二ウ","text":"東方朔射覆于盂盆之下中之郭舍人曰非至數　至數實也臣請覆之問不中賜臣帛中之搒臣百乃覆寄生朔曰寠數也　在樹曰寄生在地曰寠數也\n射蜂巢等　館陶令諸葛原　　燕卵蜂巢蜘蛛使管輅覆射之\n測隱索隱\n射印囊幷山雞毛　劉邠令管輅射之皆中\n徐季龍　取十二種著器中使射之輅曰　籍土皆中也有二種物先說雞子後道蠶蛹　皆中衆以輅爲"},{"id":"juan9-044","source":"正文","juan":"卷第九","menu":"雜技第四十一","sub_menu":null,"page":"四八","leaf":"二十二ウ","text":"列子曰　宋有蘭子者以技干宋元君宋元君召見以雙枝長倍其身屬其脛並趨弄七劍迭而躍之立賜金帛\n又　蘭子能燕戲復干宋元君元君大怒曰昔有異技干寡人技無庸適値寡人有歡心故賜金帛今而望吾賞拘而戮之　　也\n秘戲　國人以謹厚不偶得預後宮秘戲\n張騫通大夏國得眩人　眩與幻同\n吞刀吐火截馬之\n衒角觝之戲　漢武帝始作角觝相當角力也\n易牛馬頭　後漢西南夷撣國獻幻人能吐火自支解易牛馬頭元會作之陳禪諫不可陳尤聽釋言\n人之有技若己有之　書\n凡執技論力適四方贏股肱決射御凡\n執技以事上不貳事　禮\n藝成而下\n曲藝皆誓之　尚技而賤車則民興藝子云吾不試故藝\n白氏六帖事類集卷第九"},{"id":"toc-juan10","source":"卷十總目","juan":"卷第十","menu":"卷第十總目","sub_menu":null,"page":"四九","leaf":"二十三オ","text":"白氏六帖事類集卷第十　本卷總目（共 35 門）\n賓主第一\n好客第二\n謝絶賓客三\n行旅四　遠行附\n逆旅五\n離別六\n餞送七\n遊覽八\n相思九\n經過十\n干謁十一　刺附\n賓館十二\n朋友十三\n擇交十四　拒交\n相成十五\n推薦十六\n患難十七\n怨弃十八\n贈貺十九\n死哭二十\n食飲二十一\n父友二十二\n書信二十三\n施惠二十四　不合附\n施饋二十五\n慶遺二十六\n慶賀二十七\n薦獻二十八\n奉使二十九　受命附\n專命三十\n採風謠三十一\n按姦慝三十二\n殺使三十三　不辱命附\n避讎三十四\n使絶域三十五"},{"id":"juan10-000","source":"正文","juan":"卷第十","menu":"賓主第一","sub_menu":null,"page":"四九","leaf":"二十三オ","text":"賓客主恭　禮\n賓禮每進以讓　禮\n周諺曰賓主有禮主擇之　左\n禮無違者\n子曰赤也　束帶立於朝可使與賓客言也\n儼若客\n樂與餌過客止　老子\n我有嘉賓　詩\n有客有客　亦白其馬\n有客宿宿　言再宿也\n有客信信　言四宿也\n主人恩賓　退\n東都主人　西都之賓\n東道之主　鄭謂秦曰若舍鄭以爲東道之主行李之往來共其乏困\n書曰脩五禮　吉凶賓軍嘉\n洪範八政　七曰賓\n天子諸侯無事則歲三田　二爲賓客\n宋公兼享晉楚之大夫\n趙孟爲客　座所尊也趙武謚文子\n季孫飲大夫酒臧紇爲客　臧武仲也\n主禮　賓樂備\n仲叔圍治賓客\n賓以特牲　晉悼公叔　之道\n守出門之恭　再拜而見\n展及階之敬　三揖乃升\n禮賓　周禮太宰以八統馭萬民八曰禮賓\n賓客之式　太宰以九式均節財用三曰賓客之式式謂財用之節度\n以懷賓客　周禮懷安也\n賓客之容　周禮六儀二曰賓客之容謂容在也\n饗食燕之禮　周禮以饗食燕之禮親四方之賓客\n議賓　周禮八辟八曰議賓議賓之辟賓客有事先議之\n殺禮　周禮凡禮賓客國新殺禮凶荒殺禮札喪殺禮禍災殺禮在野外殺禮注謂省其禮用也\n客位\n主人敬客則先拜客　客敬主人則先拜主人\n賓客之交　讓而後敬\n飲食之用　宴以合歡\n速賓　禮主人親速客速召也責人\n肅容而入\n百拜之儀　序賓也大序\n庖有魚不利賓　易\n不速之客三人　易\n來敬之終吉　易\n賓之初筵　詩\n我客戾止永觀厥成　詩\n周禮凡賓客至　委積膳獻飲食賓賜之　凡賓客死致\n庖人掌賓客之禽獻　謂獻禽　賓\n凡行人之儀　不朝不夕不正其主亦不背客謂擯相傳辭不正東向不正西向常視賓主不之前却得兩向而已\n野廬氏掌　若有賓客則令守塗之人聚欜有相翔者誅之相翔謂伺候將爲盜者\n環人掌送逆邦國之通賓客　舍則授館令聚欜有任器則令環之命野廬氏\n諸侯賓至甸設庭燎\n賓至如歸　傳\n國語單襄公如楚　候不在疆司空不視塗澤不陂川不梁膳宰不致餼\n宣詔曰我擅興傜役飾廚傳稱過客　廚飲食傳傳舍使人及過客來者稱其意\n置驛馬迎賓客　鄭莊當時爲太子舍人每五日沐浴常置驛馬長安四郊迎賓客夜以繼日好黃老術慕長者如友皆有文行天下有名之士戒門下無至貴賤無留門執賓主之禮以貴下人性之廉者也\n東閣　公孫弘起客館開東閣延賓客公孫賀劉屈氂壞爲馬廄奴婢室也\n曳裾王門　鄒陽上書曰臣飾固陋則何王之門不可曳長裾乎\n君門如市　上責鄭崇言賓客多\n鄭莊汲黯　爲九卿兩人中廢賓客益落落散也\n填門　翟公爲廷尉賓客填門及廢門外可設雀羅\n坐上客恒滿罇中酒不空　孔融爲太中大夫性寬少忌好士喜誘益後進常歎曰云云吾何憂\n後漢崔瑗字子玉　好賓客盛脩肴膳殫極滋味不致餘産居常自蔬食\n秋官野廬氏掌野之道路宿息井樹　若宿息廬之屬賓客所宿及晝止者也井共飲食樹爲蕃蔽\n子姑就館　敢辱大館叔弓如晉辭館云\n疲倦　蜀張裔字君嗣爲諸葛亮長史北詔事送車數百乘裔與人書曰近者涉道晝夜接賓不得寧息人敬丞相長史男子張君嗣附之疲倦欲死\n勢利　王雅茂達將　　　　賓客甚衆　推之大　　　子少傅過半時俗　　無　　心\n又遷驃騎　　　　　　　　病曰貴青門下客多去事　病輒得官爵唯任安不去\n歌詩　漢書儒林傳王式爲昌邑王師博士江翁心嫉式謂歌吹諸生曰歌驪駒式曰聞之於師客歌驪駒主人歌客無庸歸今日諸君爲主人日尚早未可也江翁曰經何以言之式曰在曲禮江翁曰何狗曲也式恥爲醉陽子所辱遂醉逿墬"},{"id":"juan10-001","source":"正文","juan":"卷第十","menu":"好客第二","sub_menu":null,"page":"五二","leaf":"二十四ウ","text":"宴以禮成\n賓由主擇\n我有旨酒以宴樂嘉賓之心　詩\n公子無忌愛客　　　不辭\n賓客從遠方來\n門以有車馬客無留門　鄭莊字當時遷司農戒門下曰客至無貴賤無留門\n司農戒客　戒無留門\n丞相延賓　使常開閣\n棒銅盤而盟平原之賓二十　毛遂在十九人之末自贊盟後呼十九人上盟曰公等碌碌所謂因人成事者遂爲上客\n躡珠履而會春申之客三千　春申君客上客皆躡珠履也\n開文學之館　注見上\n式宴以衎不醉不歸　詩\n開孟嘗之門\n設陳遵之轄　遵大飲酒賓客滿座取客車轄投井中雖有急不得出\n管仲會國用三分二在賓客　謂二以供賓客也\n其一在國　管仲以白桓公公曰吾子奢若是乎\n四鄰之賓客　入者悅出者譽延譽於言光名臨天下入者不悅出者不譽汙名滿天下名之爲貴財安可有時不足也仲足曰君之明也\n賓至如歸　傳\n彈鋏之士　馮煖在孟嘗門下彈鋏歌曰歸去來出無車食無魚孟嘗聞之乃與車魚鋏劍也\n周公下白屋之士　一沐三握髮一飯三吐哺\n倒屣之主人　蔡邕倒屣迎王粲粲字仲宣\n登龍之上客　李膺\n孔融謁\n接士　董允字休昭與費禕胡齊等期遊董恢詣允而恢以年少官微見允嚴駕逡巡去允乃罷駕留接其接士有如此者\n饌精麁　見飲食部\n宴戲　吳諸葛融每延賓高會休吏假罪賓客所能乃合榻促席量敵選對或博弈或摴蒱投壺弓彈甘果繼進淸酒徐行融周旋不倦也\n解陳蕃之榻　　　徐稺之\n置鄭莊之驛　注見上\n主人必倍而食　嘉賓得以盡心\n崔瑗好賓殫極滋味　注見上"},{"id":"juan10-002","source":"正文","juan":"卷第十","menu":"謝絶賓客第三","sub_menu":null,"page":"五二","leaf":"二十四ウ","text":"翟公署門　翟公爲廷尉賓客交集後免門可張雀羅後復爲廷尉賓客欲至翟公乃署門曰一貴一賤交情乃見\n主父不內　主父偃爲齊相至齊散五百金與昆弟賓客數之曰吾貧時昆弟不我衣食賓客不我內門今吾與諸君絶矣無復入偃之門\n不招賓客　蘇建責大將軍青不招賢青曰招賢絀不肖人主之柄也人臣奉職而已何招士大夫哉\n市道　史記廉頗歸失勢客盡去及後用又復至頗曰客退矣客曰吁君何見之晩也夫天下以市道交君有勢我則從無勢則去此固其理又何怨焉\n魏其侯灌夫　俱失勢賓客盡去二人相引繩排擯平生慕之後弃之而已"},{"id":"juan10-003","source":"正文","juan":"卷第十","menu":"行旅第四　遠行附","sub_menu":null,"page":"五三","leaf":"二十五オ","text":"旅焚其次喪其僮僕\n旅人先笑而號咷　易\n行邁靡靡　遲也\n中心搖搖　憂也\n君子于役不知其期　曷至哉不知反時\n不日不月\n汶水湯湯行人彭彭　多也\n大夫跋涉我心則憂　草行曰跋\n我徂東山慆慆不歸　詩\n婦歎于室\n之子于征劬勞于野\n順彼長道\n秋蓬之轉\n月捷之勞　詩曰豈敢定居一月三捷\n靡可底戾\n征夫捷捷\n肅肅馬鳴　駮駮征夫\n每懷靡及\n匪居匪寧\n不遑寧處\n乃裹糇糧　于橐于囊\n行道遲遲\n人生天地間忽如遠行客　古詩\n不有行者　誰扞牧圉\n跋涉山川　蒙犯霜露以逞吾心\n羇旅之臣　幸若獲宥\n莊子曰適莽蒼者三飡而反腹猶果然　莽蒼近郊果然飽也\n適百里者宿舂　千里者三月聚糧\n不齎糧　漢書曰上使鄭莊視河決請治行五日上曰吾聞莊行千里不齎糧\n式微之詠　詩云式微式微胡不歸微君之故胡爲胡中路\n高蹈之歌　齊人歌曰魯人之皐數年不覺使我高蹈高蹈謂遠行也\n四方之志　萬里之游\n懷安敗名\n奚自　猶言自何來也\n日暮途且遠\n遊子悲故鄉　古詩\n遊子暮何之　李陵詩\n行旅羇旅　西征賦云遠行有羇旅之情\n辭邦里　古\n車馬有行色\n行人　遊子\n父母在不遠遊　遊必有方方常也\n口倦乎叱咤　手苦乎轡箠\n朝冒霧露　晝被塵埃\n夏爲大暑暴炙　冬爲寒風飡薄\n楚辭曰　悲哉秋之爲氣慄慄兮若在遠行登山臨水送將歸\n道嶮道長　吳王謂季孫曰國君道長大夫不出門何謂也往罰長於道路\n駕言徂矣\n窮日力\n鴻旅于淄歸不復"},{"id":"juan10-004","source":"正文","juan":"卷第十","menu":"逆旅第五","sub_menu":null,"page":"五四","leaf":"二十五ウ","text":"保於逆旅　逆旅旅舍主人\n盤飱之饋\n館穀\n底寧　寧依\n不受報　後漢周陽少孤微常從逆旅以供其過客而不受報\n無驗　商君亡至關不得舍曰商君令舍人無驗者坐商君歎曰爲法自斃\n除逆旅置官櫛　晉時以逆旅逐末廢農亡命依奏勅當除之十里置一官櫛使老小貪戶守之差令主掌依客舍收錢潘安仁議曰謹按逆旅久矣行者賴頓止居者薄收其直各得其所故國語曰許由辭帝堯之命而舍逆旅舍外傳曰陽處父過甯甯舍子逆旅組武詩曰逆旅整設以通商賈然則唐堯到令未有無舍之法唯商鞅尤之也朝廷從之\n不累主人　劉寔字子眞以貧苦徒行每止不累主人薪水自備也\n主人之恩"},{"id":"juan10-005","source":"正文","juan":"卷第十","menu":"離別第六","sub_menu":null,"page":"五四","leaf":"二十五ウ","text":"悲莫悲於生別離　楚辭\n登山臨水送將歸\n燕燕　衛莊姜送歸妾也\n涕泣如雨\n瞻望不及佇立以泣　詩\n離羣　索居\n之子于歸遠送于野　詩\n驪歌　別歌也\n雲雨之別\n攜手上河梁遊子暮何之　李陵別蘇武詩\n離別之聲　吳越春秋句踐將伐吳乃命國中與之訣而國人悲哀作離別之聲\n鹿聚　孔叢子高與鄒文季節爲友文節歸魯臨流辭子高抗手而止曰人生當如鹿羣聚\n黯然銷魂者　唯別而已矣\n不拜　東觀漢記陳遵使匈奴辭王丹丹曰無以相贈子以不拜而遂揖而別遵甚悅\n古東門行　敘別離事\n倦客恐離聲　鮑昭詩\n有女仳離\n摻執子之手兮　君　　之陵兮\n別行子於東門　啜其泣矣\n送美人於南浦　傷如之何\n自我不見于今三年　詩\n誰謂宋遠　宋襄母思歸衞詩云\n氣怨結而不暢　涕滿流而横流\n風流雲散\n一別如雨　文選\n嵇康呂安　皆曠達之士每一相思千里命駕\n老子送孔子曰　仁者贈人以言"},{"id":"juan10-006","source":"正文","juan":"卷第十","menu":"餞送第七","sub_menu":null,"page":"五五","leaf":"二十六オ","text":"登山臨水送將歸　楚辭云\n泛舟　郭林宗自京師歸諸儒送至河上林宗唯與李膺同舟而濟人謂之仙舟\n贈言　注見上\n送美人兮南浦　楚辭\n出宿于濟飲餞于禰　詩\n申伯言邁王餞于郿　詩\n贈策　傳士會將歸晉秦大夫繞朝贈之以策注云以有策而不用也\n慕從　西征賦曰送歸懷慕從之戀\n送子涉淇\n之子于歸遠送于野\n燕燕　注見上\n送荊軻於易水\n餞疏廣於東門　謂東都門也\n清酒百壺　韓侯出祖宿于屠顯父餞之清酒百壺\n薄送我畿　畿門內也\n晉侯贈餞如公　佩侯伯之禮加以宴好國語\n谷永與段會宗書曰　勿友以言贈行萬里之外以身爲本\n高祖　以吏繇咸陽吏皆送奉錢三而蕭何獨以五送也\n送者不出郭　陳蕃爲豫章太守性峻不接賓客徵爲尚書令送者詣\n供帳東都門　祖二踈也\n瞻望不及佇立以泣　衛莊姜送歸妾也詩"},{"id":"juan10-007","source":"正文","juan":"卷第十","menu":"遊覽第八","sub_menu":null,"page":"五五","leaf":"二十六オ","text":"以遨以遊　詩\n駕言出遊以寫我憂　詩\n挑兮達兮在城闕兮　挑達往來相見貌詩\n子之湯兮宛丘之下　宛丘刺陳幽公游蕩無度\n晉趙文子　觀於九原曰樂哉斯丘\n可以遠眺望　月令五月\n登城不指　常事曰視非常曰觀穀梁傳\n楚屬遊飲食于市\n者\n觀盤遊　慢遊是好\n寓目　憑軾而觀\n縱觀　逸豫是娛"},{"id":"juan10-008","source":"正文","juan":"卷第十","menu":"相思第九","sub_menu":null,"page":"五六","leaf":"二十六ウ","text":"自我不見于今三年　詩\n静言思之\n悠悠我思\n願言思伯\n我之懷矣\n實勞我心\n瞻彼日月\n有懷于衛靡日不思\n我思不遠\n豈不爾思\n遠莫致之\n室是遠而\n如之何勿思\n一日不見　如三月兮如三秋兮\n無思遠人\n勞心忉忉　忉忉憂也\n忘我實多\n伊可懷也\n未見君子\n憂心　弈弈忡忡\n千里命駕　嵇呂事見上注\n夢想見容輝\n我思故人"},{"id":"juan10-009","source":"正文","juan":"卷第十","menu":"經過第十","sub_menu":null,"page":"五六","leaf":"二十六ウ","text":"王商過樓護　護字君卿為天水太守免官居長安都城侯王商為大司馬衛將軍過護狹小官屬立車下久住欲雨主簿謂諸掾曰不肯禮諫及雨立閭巷邪商聞之遂去主簿終身廢之\n陳遵飲左史　遵為河南太守弟級為荊州牧當官俱過長安富人左氏飲司直陳崇劾遵過寡婦左氏家飲免官\n伐申過鄧　傳曰楚文王伐申過鄧鄧侯曰吾甥也止而享之\n臧武仲如晉雨過御叔　御叔將飲酒曰焉用聖人我將飲酒而已雨行何以聖為注武仲多智人謂之聖人\n田蚡謂灌夫曰　欲與仲孺過魏其侯會仲孺有服灌夫曰將軍乃肯幸臨魏其侯夫安敢以服為解\n母截髮待賓　陶侃字士衡孝廉范逵嘗過侃時倉卒無以待賓客母截髮為二髲以易酒肴樂飲極歡從者亦過望\n怒直進　王忱字元達桓玄詣忱通人未出乘輿直進忱對玄鞭門人玄怒去忱亦不留\n不交客言　嵇康夏月於大樹下鍛向子期佐之鍾會結客同造之康揚鎚如舊傍若無人良久不交一言會去康曰何所聞而來何所見而去會曰聞所聞而來見所見而去大恥之遂深怨恨\n理髮　謝安為桓溫司馬溫詣安安方理髮安性遲緩久而方罷令取幘溫見留之曰令司馬著帽進其見重如此也\n入沐　王恬傲誕不拘禮節謝安造之坐少頃后便入內安以為必厚待己久之乃沐頭散髮而出亦無賓主之意\n不過從兄　第五倫字伯魚\n迎送　董賢為司馬上令私過孔光光雅恭謹知上欲尊賢乃戒衣冠出門望見賢車乃入拜謁恭迎不敢均敵上悅拜光兄子為諫議大夫\n王獻之　子敬經吳郡聞顧辟彊有名園先不相識乘平肩輿逕入辟彊方集賓客獻之游歷傍若無人辟彊怒曰傲主非人禮也以貴驕士非道也令左右驅出獻之傲然亦不屑意"},{"id":"juan10-010","source":"正文","juan":"卷第十","menu":"干謁第十一　刺附","sub_menu":null,"page":"五七","leaf":"二十七オ","text":"范雎為須賈御　入相府曰我為君先通相君\n張儀謁蘇秦　秦戒門下不為通又不得去數日方見之坐於堂下以激儀也\n上謁　雋不疑曼倩冠進賢冠帶櫑具劍上謁暴勝之上謁若今通名也\n不避寒暑　張湯請謁云云\n埽門　魏勃欲見曹參家埽齊相門以自達\n書刺　高紀有謁者自書刺以言爵里若今之通名也\n宗丹　性清高未嘗修刺謁人\n覆刺　高彪有雅才從馬融訪大義融乃辭疾不見彪覆刺遺融書云融覽乃追之\n刺字漫滅　禰衡來游許下陰懷一刺既無所適於是刺字漫滅\n奏刺　事見總注\n侯門\n六卿之門　宋公子鮑無日不數於六卿之門\n朱博馳騁進取不師道德\n莫為我先　先容也漢書\n孔融　年十歲謁膺膺門下不為通融曰我與李膺府君親舊門下具白之膺見融問何親融曰先君孔子與老君有師資之道故僕與君亦累世通舊也\n露索　蕭望之王仲翁俱欲謁見霍光光自上官桀事後出入自備吏士當見者皆露索去刀兵兩吏挾持望之獨不肯受索曰不願見非周公握髮之禮\n徑入哭　後漢趙壹元叔為郡計吏到京師造河南尹羊涉不得見壹以非涉無託名者乃曰到門涉許通尚臥未起徑入上堂曰竊伏西州承高風久矣乃今方遇而忽然奈何命也因舉聲大哭涉知非常人乃起延譽大奇之\n追不顧　趙壹為羊陟所稱名動京師西還過弘農候太守皇甫規門者即不通壹遂遁規知是壹大驚追之壹不顧而去\n一逢掖　王符節信性耿介皇甫規解官歸安定鄉人有以貨買鴈門太守者亦去職還書刺謁規規臥不起既入問君前在郡食鴈美乎有頃白符在門規驚遽出迎入語曰徒見二千石不如一逢掖\n養病傲士固其宜也　高彪覆刺遺馬融書云\n徑上牀　蜀志　　見龐統統非義故舊又有賓客　徑上統牀臥曰頃賓\n客罷能與卿譚賓能請食然後語統大奇之\n修刺候通　步騭字子山與衛旌種瓜自給共詣焦征羌征羌豪縱二子懼為所侵乃共修刺奉瓜獻征羌征羌不時通旌欲去騭曰畏之而來非慕義也坐何傷乎"},{"id":"juan10-011","source":"正文","juan":"卷第十","menu":"賓館第十二","sub_menu":null,"page":"五八","leaf":"二十七ウ","text":"適子之館兮　詩\n于時廬旅　賓客廬舍\n十里有廬廬有飲食　周禮\n天子賜舍\n司儀致館　儀\n賓館　禮記曰大饗卷三牲之俎歸于賓館\n見人不能館不問其所舍　禮\n賓客至無所館子曰生於我乎館　死於我乎殯\n除館　晉人為季孫除館於西河因之也\n子姑就館\n敢辱大館　叔弓如晉辭館云云\n壞垣　子產如晉壞其館之垣而納車馬士文伯曰繕完葺牆以待賓客今吾子壞之其若異客何子產曰諸侯舍於隸人門不容車而不踰越也\n崇大諸侯之館　晉文為盟主\n飾廚傳稱過客　傳音轉宣詔曰或擅興徭役飾廚傳稱過客注廚飲食傳傳舍使及過客皆得令稱其意也\n賓至如歸\n舍不為暴\n東閤　公孫弘為丞相開東閤以延賢人及公孫賀劉屈氂時壞為馬廄\n連榻坐客　晉羊琇豪貴杜預拜鎮南將軍朝士皆畢賀乃連榻而坐琇與裴楷後至曰杜元凱乃復以連榻而坐客焉遂不坐而去也\n倒屣迎賓　王粲仲宣詣蔡邕邕倒屣迎之粲年少容貌短小既至一座盡驚邕曰王孫有異才吾不如也吾家書籍文章盡與之"},{"id":"juan10-012","source":"正文","juan":"卷第十","menu":"朋友第十三","sub_menu":null,"page":"五八","leaf":"二十七ウ","text":"伐木　燕朋友故舊也\n良朋\n執友　同志者\n面友　揚子法言曰友而不心面友也\n面朋　又曰朋而不心面朋也\n知己\n神交　嵇康阮籍山濤一見便為神交\n同人　同道也\n泛交\n吾友\n久敬　晏平仲善與人交久而敬之\n同求　將合\n舊識　吳季札見鄭子產如舊相識\n故知　叔向適鄭鬷蔑惡一言而善執手以上遂如故知\n失人　可與言而不與之言失言\n非義不合\n合志同術　儒有合志同方營道同術並立則樂相下不厭其交友有如此者禮\n誰謂膠漆堅\n不如陳與雷　陳重雷義友分深人語云云\n淡若水　君子交淡若水小人交甘如醴君子淡以成小人甘以壞\n傾蓋　家語孔子還程本子傾蓋而語終日甚相悅顧謂子路曰程本子天下之賢士取束帛以贈之\n知我者鮑叔　管仲曰生我者父母\n捨短取長　後漢李燮字德公所交者皆捨短取長\n同心斷金如蘭　易二人同心其利斷金同心之言其臭如蘭\n刎頸　漢張耳陳餘相與為刎頸之交\n忘年　文士傳禰衡有逸才與孔融作爾汝交時衡年二十餘融已年五十敬衡秀才而忘年也\n莫逆　莊子曰四人相視而笑莫逆於心相與為友也\n忘言　莊子云得意而忘言也\n義之與比　君子之於天下無適也無莫也義之與比\n德不孤必有鄰\n氣合聲同\n金石之交　漢與韓信\n芝蘭之室\n有朋自遠方來　不亦樂乎\n無友不如己者\n友其士之仁者\n擇其美者而從之\n取友\n樂羣　禮\n止於信　禮曰交國人止於信\n盍簪　易大有卦曰勿疑朋盍簪簪疾也\n朋從爾思\n上交不諂　下交不瀆\n豈無他人　　　子之好\n子夏曰可者與之不可者拒之　子張曰異乎吾所聞君子尊賢而容眾嘉善而矜不能我之大賢與於人何所不容我之不賢與人將拒我如之何其拒人也注云交友當如子夏汎交當如子張\n為友導騎　范式為荊州友人孔嵩家貧為新野縣傭縣遣嵩為式導騎式曰孔仲山邪敕代嵩嵩以傭未畢不肯去\n定交於杵臼之間　公沙穆家貧與吳祐賃舂祐與語大驚遂定交於杵臼之間也\n鍾會年少　傅嘏以明智友之\n君子定其交而後求\n西南得朋　易\n為誄　郤超卓犖有曠世之度竹林交游每有勝狀寒門後進拔而友之死之日貴賤為誄者四十人\n拜親\n推宅　吳周瑜推道南大宅以舍孫策升堂拜之有無通共\n拜親友　荀顗王濟何劭為拜親友\n不拜母　庾袞與諸兄過邑人陳準兄弟友之拜其母袞獨不拜曰拜人之母將同\n於子貢義至大鄰人稱德隱逸養親老而無倦袞母拜之\n拜父　魏志孔融才高倨傲年在陳紀陳群之間先與紀友後與群交更為紀拜之\n下交　史記趙有處士毛公藏於博徒薛公藏於賣漿家魏公子無忌從此二人結交游也\n交小吏　吳祐舉孝廉郡中祖道祐越坐與小吏黃真歡語移時功曹以祐傲請黜之太守曰吳季英有知人之明且勿言其後真亦舉孝廉\n三友為一龍　華歆與邴原管寧為友俱游學相善故時人號三友為一龍歆為龍頭原為龍腹寧為龍尾\n連璧　夏侯湛美容與潘岳友善每出同輿人謂之連璧\n近不相得　遠而彌親\n朋友相舉　親戚相推\n心同琴瑟　道叶膠漆\n貴相知心\n投分　推誠\n金蘭　松竹\n早鶯求友\n相彼鳥矣猶求友聲　伊彼人矣\n不求友生\n交府士　王臣為護軍府士卓犖不羈王澄胡母輔之等齎羊酒詣護軍府臣時給府養馬輔之等遂入座馬廄下與臣炙羊飲酒醉飽而去不見護軍護軍大驚馬即與臣長假免其為兵\n益親　家語孔子曰自季氏賜我粟千鐘其交益親"},{"id":"juan10-013","source":"正文","juan":"卷第十","menu":"擇交第十四　拒交附","sub_menu":null,"page":"六〇","leaf":"二十八ウ","text":"擇不處仁焉得智　語\n拜其子　後漢侯霸欲交王丹霸子昆丹下車拜丹答拜霸子曰大人方願交歡奈何拜小子丹曰君房有是言丹未之許也\n君子定其交而後求　易\n無友不如己者　語\n拒交　陳遵欲交王丹丹拒而不許\n又　楊仁字文義辟司徒桓虞府府掾宋章貪奢不法仁終不與交言同席\n友賢　仇覽見季智太學中與同郡符融比宇常自守融奇之曰志士交結之秋雖務勤學守之何執覽正色曰天子修太學豈使人游譚其中乎融告郭林宗林宗因與融齎刺詣之遂留宿林宗嗟歎下牀為拜\n不拜親　庾袞事見上注"},{"id":"juan10-014","source":"正文","juan":"卷第十","menu":"相成第十五","sub_menu":null,"page":"六〇","leaf":"二十八ウ","text":"相勸以義\n朋友攸攝攝以威儀　攝助也詩\n雖有兄弟不如友生\n琢磨　切磋\n君子成人之美　不成人之惡\n贈友以言　顏淵贈子路曰過墓則式\n忠告而善導之　不可則止無自辱焉\n以文會友\n以友輔仁　語\n博我\n以文　約我以禮\n切切偲偲　相切責貌\n益者三友　友直友諒友多聞\n損者三友　友便僻友善柔友便佞\n君子之愛人也以德\n獨學而無友則孤陋而寡聞\n儒有聞善以相告　見善以相示\n畏我友朋\n須友以成　自天子至于庶人未有不須友以成者\n糾德　周禮司諫糾萬人之德而勸之以朋友\n一言　而上\n三益　上見詩\n友　士有諍友則身不陷於不義\n醇酎　程普言與周瑜交如飲醇酎不覺醉\n如行霧露　有所潤也\n君子以朋友講習　易曰麗澤兌\n投杖　子夏喪子喪明曾子怒曰汝何無罪子夏投杖而拜曰吾過矣\n割席　管寧與華歆同學歆聞車馬聲出門寧割席曰子非吾友也\n善交　李燮德公所交皆捨短從長好成人之美時荀爽賈彪齊名而爽並交二子情無適莫世稱平正也\n人相忘於道術　魚相忘於江湖\n蘇秦之激張儀　秦先達張儀後之數日乃見坐於堂下食以僕妾之食告舍人曰儀才吾不及恐以小利忘求故辱之儀怒入秦蘇君陰令舍人齎金帛車馬陰給助之卒為秦相也\n塵附太山　言卑之依附大也文選\n霧集河海\n薑桂因地而生不因地而辛　韓詩外傳曰宋王因其友事襄王襄王待玉無異力讓其友云云"},{"id":"juan10-015","source":"正文","juan":"卷第十","menu":"推薦第十六　事具舉薦門","sub_menu":null,"page":"六一","leaf":"二十九オ","text":"遷喬求友\n不遺其友　武子謀其身不遺其友\n儒有爵位相先近相待遠相致　待致皆薦舉也\n其任舉有如此者\n佯狂　漢雷義舉茂才讓陳重刺史不聽義佯狂不應人語曰膠漆不如陳雷\n蕭朱結綬　蕭育與朱博為友著聞當世故語曰蕭朱結綬王貢彈冠\n王貢彈冠　漢貢禹王陽為友世稱王陽入仕貢禹彈冠言取捨同也\n伐木出谷\n拔茅連茹　彙征吉言以類相從也\n樂則思之　白虎通\n行修而名不彰友之罪也　行不修身之罪也家語\n義之與比　德必不孤\n伸於知\n己者　石父曰君子伸於知己屈於不知己\n人惟求舊　官貴知賢\n類聚　彙征\n管仲囚於堂阜　鮑叔薦於桓公\n引重　魏其侯灌夫二人交善相引重引重猶言薦也\n自叶彙征之吉　寧戚鳴之義\n舉不失職　義在存私\n能舉善也　季文子之\n舉不失德　人所具贊\n舉善推微　知人則哲\n文舉之升一鶚　陶謙之拔二龍\n薦思能之士　莽非常之德\n國著進賢之賞　又思類能之用\n毛玠當仁　克遵徐邈\n孔融明敵　舉薦匡衡\n任官惟良　底績以德\n建一官而三物克成　舉十望而四方知勸\n因雲灑潤則芬澤易流　文\n晏嬰舉穰苴\n思忌進孫臏\n季克貢吳起\n蕭何獻韓信"},{"id":"juan10-016","source":"正文","juan":"卷第十","menu":"患難第十七","sub_menu":null,"page":"六二","leaf":"二十九ウ","text":"患難相死　禮\n患則死之　白虎通\n士為知己死　鮑叔有疾管仲為之不食曰士為知己死雖為之死亦何傷哉\n偕死　吳範與魏騰相善騰當死罪吳主責好諫者死範詣闕騰曰與汝偕死也免\n終始　生死\n久要不忘平生之言\n孝友任恤　任信於友道恤憂恩也周禮\n不恤之刑　周禮八刑六曰不恤之刑\n不許友以死　禮父母在\n白首同歸　潘岳與石崇\n繫獄不為言　申屠蟠友人　　為黃　欲殺之吏勸蟠救之蟠不行曰黃子為吾耶未必合理如不用吾言何益遂閉\n將恐將懼惟予與汝　我與身也\n交態\n奔走之友　袁紹與何顒"},{"id":"juan10-017","source":"正文","juan":"卷第十","menu":"怨弃第十八","sub_menu":null,"page":"六二","leaf":"二十九ウ","text":"相譏　　　　　與華　步　相　長相　　又\n棄予如遺\n忘我大德思我小怨\n不弃故舊\n朋友無大故不相弃\n疏　久不相見闊疏言不習\n甘醴之壞　小人之交甘以壞禮\n久要不忘平生\n富貴易交　亦人情漢書\n一\n【葉二十九ウ・三十オ之間　原缺（贈貺第十九至採風謠第三十一）】\n刺史二千石有贓罪顯明者擧奏上之墨綬已下使者收擧號八駿\n擧賢　史鄭安平操范睢亡匿奉使謁者王稽至魏安平詐爲卒侍王稽稽問曰魏有賢人可與俱西遊者乎安平曰臣里中有張祿先生欲見君其人有仇不敢晝見乃夜見之稽遂載入秦卒爲秦相\n又　暴勝之爲直指使至勃海聞雋不疑賢遣使請不疑相見遂詔公車拜青州刺史\n擧賢使　漢武使博士循行天下擧獨行君子士有特招使者之任也注士有異行須特招也\n觀風"},{"id":"juan10-018","source":"正文","juan":"卷第十","menu":"按姦慝第三十二","sub_menu":null,"page":"六三","leaf":"三十オ","text":"儆于有位\n提擧國章　糾逖王憲\n奉辭問罪\n暴勝持斧以懲姦　漢武帝末盜賊羣起拜暴勝之爲直指使者衣繡衣折斧逐捕盜賊\n張綱埋輪京師振悚　張綱在八使巡行中年少官卑受命埋輪洛陽都亭曰豺狼當路安問狐狸遂劾奏梁冀京師振恐\n范滂攬轡天下澄清　滂請爲詔使案察冀州滂登車攬轡慨然有澄清天下之志\n提振綱紀　案察姦宄\n晉王導使八部　從事之部顧和君孝在數中還同時見諸從事各言二千石官失和獨無言導問之和曰明公爲政寧有漏網何緣有所察也"},{"id":"juan10-019","source":"正文","juan":"卷第十","menu":"殺使三十三","sub_menu":null,"page":"六三","leaf":"三十オ","text":"○不廢命附\n樂祁不敬雖聞可討之辭　宋樂祁聘晉未致君命而飲酒范獻子曰不敬二君不可不討遂執之\n伯𧧑無辜終貽非禮之誚　晉伐鄭鄭人使伯𧧑行成晉人殺之非禮也古者兵交使在其間可也\n虐執使臣將以釁鼓　楚伐吳使蹶由犒師楚靈王執之將以釁鼓\n楚子使申舟聘于齊不假道于宋舟曰我則必死王曰殺汝我伐之見犀而行　犀舟之子託其子而行示必死及宋華元殺之\n●不廢命　附殺使門\n傳晉使解揚如宋　曰晉師悉起將至矣楚子執之使反其言解揚許之乃見宋人遂致其君命楚子問之對曰云云遂赦之\n又　魏閻溫伯儉時馬超圍冀城急州遣溫密出告急於夏侯淵爲超所獲超使言於冀城云東方無救溫烏言之曰大軍三日至勉之勉之遂殺之\n又　劉整正鄭爲諸葛恪所獲事與上同\n又　後漢\n子異擊高峻峻　　　後恂曰降諸將問之恂曰文"},{"id":"juan10-020","source":"正文","juan":"卷第十","menu":"避讎第三十四","sub_menu":null,"page":"六四","leaf":"三十ウ","text":"子夏曰居昆弟之仇如何子曰仕不與共國銜君命而使雖遇之不鬭　禮\n以私害公非忠也　傳\n奉辭成命　必念解揚之言\n損怨避仇　宜寡趙喜之急\n虐我則讎　誠罰一之已甚\n銜君之命　且冝兩不相傷\n未復命於飲沐　寧執仇於讎刃\n皇華　白刃\n奉命　相讎\n魯使郤叔弔滕伯　惠伯爲介及郊懿伯之忌不入惠伯曰政也不可以叔父之私不將公事遂入注懿伯惠伯叔父也忌怨也惠伯不以私害公故遂入\n捨則崇讎　報爲廢命\n與夫失節　寧其斷恩\n居兄之仇　避爲不弟\n私讎不及公　傳\n見讎不殺雖類寬身受命而行亦不獲孝　傳不可以見讎而不殺又曰下臣獲考獲孝司事得成"},{"id":"juan10-021","source":"正文","juan":"卷第十","menu":"使絕域第三十五","sub_menu":null,"page":"六四","leaf":"三十ウ","text":"蘇武　漢使匈奴十九年不屈節歸爲典屬國\n傅介子以馬監求使大宛　因詔責樓蘭龜茲遂帥吏斬之還封義陽侯\n張騫　使外國窮河源封博望侯\n請使絕域　路溫舒請使絕域暴骨方外盡臣下節太僕杜延年問狀罷歸故官以言無可取\n請長纓以繫虜　終軍請使拜諫議大夫使南越而云云\n定遠侯　班超見志節門\n陸賈　使南越南越王尉他內屬賜賈橐中裝直千金\n使於四方　不辱君命\n丁年奉使白首而歸　李陵與蘇武書\n單車之使　漢詔求才可使絕域\n沒蕃田令　因王事落蕃未還有親屬同居者其身分地六年乃追身還之日隨便先給即身死王事者子孫雖未成丁亦不追戰場人舊疾亦不追咸讎終身田\n沒蕃人還戶貫令　沒蕃得還及化外歸朝者所在州鎮給衣食具狀送省奏聞\n化外人於寬鄉附貫安置落蕃人依舊貫無舊貫任於近親附貫也\n出禮義之鄉入無知之俗　李陵書\n漢使王烏　窺匈奴匈奴請漢使不去節不黥面不入穹廬烏習胡事乃去節黥面單于愛之遣子入侍後使楊信不去節坐穹廬之外\n求還　班超仲叔久在絕域思土上疏願生入玉門關帝從之\n千里有不歸之魂　殊鄉有哀苦之事\n隨絕域之聘人　須天隅之歸客\n白氏六帖事類集卷第十"},{"id":"toc-juan11","source":"卷十一總目","juan":"卷第十一","menu":"卷第十一總目","sub_menu":null,"page":"七一","leaf":"一オ","text":"白氏六帖事類集卷第十一　本卷總目（共 36 門）\n帝德第一\n祥瑞第二\n銘功第三\n圖書第四\n封禪第五\n巡狩第六\n朝會第七　制朝儀　不朝附\n聘第八　還珪　璋附\n御遊九　佚遊附\n御宴第十\n籍田第十一\n明堂十二\n辟雍十三\n靈臺十四\n太子第十五　教導　生　疾　死　賓客附\n皇后十六　賢智　失道　繼后　嬪御　外戚附\n公主十七　王女附\n皇親第十八　公族之教　齒序　公族之刑附\n封建十九　雜　弄\n宮殿二十　行宮　制造　奢　儉　落成　焚燒附\n禁門二十一\n禁衛二十二　警衛　主守　搜索　關入門籍　行馬\n馳道二十三\n苑囿二十四\n登遐二十五　山陵　國忌\n君臣二十六\n社稷二十七\n君臣相信二十八\n念良臣二十九\n君臣問疾三十\n舊君三十一\n制詔三十二\n表奏三十三\n對見三十四\n對問三十五\n諫諍三十六　直諫　諷諫　彈諫　竊諫　匡諫　納諫　拒諫　諍諫　不諫　貴諫　諫父母　諫朋友"},{"id":"juan11-000","source":"正文","juan":"卷第十一","menu":"帝德第一","sub_menu":null,"page":"七一","leaf":"一オ","text":"孝理\n化成\n理定　制禮\n教成\n悅隨　聖人順動而天下悅隨\n欣戴\n樂推\n悅服\n垂拱\n恭己\n法天地之德\n聲教\n無爲\n不嚴而理\n勝殘去殺\n民猶支體\n以百姓心爲心\n百度惟貞\n九功惟序　水火金木土穀正德利用厚生謂之九功\n文治　文明\n休明\n明備之朝　咸集備也\n天下和平　王道用成\n天下爲公\n大同　同和平也\n富有天下　天子\n有善讓之於天\n覆載所及　致之於升平\n照臨所加　納之於仁壽\n帝道　王猷\n四時成　萬物說\n凝命　正位凝命\n表正　萬邦\n誕膺天命\n無疆之休\n澤及四海\n萬邦作孚\n帝命式于九圍\n守在四夷　天下有道\n德配天地　明並日月\n納隍之慮\n解網之仁　湯王解網\n無爲而治\n泣辜\n聰明\n天聽\n惟德動天\n承天之休\n蓋之如天\n率土之濱　莫非王臣\n罪己　禹湯罪己其興勃焉\n天下自正\n海外有截　言化齊整也\n作民父母\n建皇極\n立大中之德"},{"id":"juan11-001","source":"正文","juan":"卷第十一","menu":"祥瑞第二","sub_menu":null,"page":"七二","leaf":"一ウ","text":"玄德動天\n感于神明　書至理馨香感于神明　至德光大動于天地　天地\n大賚\n休徵　書\n嘉瑞\n禎祥\n福應\n史不絕書\n薦於郊廟\n有道則見\n天不愛其道　禮降甘\n地不愛其寶　出醴泉\n坤珍　降祉\n呈祥\n瑞命\n式揚帝祉\n靈物　瑞圖\n天降哉祉　神表靈貺\n非天私\n我皇家\n天地之心\n見表\n無疆之休\n效靈\n白魚大烏　史記武王渡河中流白魚躍入于王舟鱗介兵象白者殷家色白明殷當授於周又有火復于王屋流爲烏\n嘉穀　玄稷\n金芝九莖　漢宣時嘉穀玄稷降于郡國金芝九莖產於函德殿銅池中金芝色如金銅池承雷也\n威鳳　鳳有威儀者\n神雀\n山呼萬歲　漢武封嵩高時\n洛出九疇　洛出書孔安國云河圖即八卦是洛書即九疇是\n非煙\n飲醴　光武中元二年幸長安祠長陵還洛陽宮是時醴泉出京師郡國飲醴者痼疾皆愈獨眇蹇者不瘳\n華平\n朱草\n蓂莢　曰磨得其分則蓂莢生\n慶雲　卿雲\n浪井　典略曰浪井不鑿而成孫氏瑞圖曰浪井不鑿而成者清淨則水通有仙人至之或神鼎丹沸醴泉浪井爲大瑞\n式　玄麟鳳鸞龍騶虞白澤神馬爲大瑞隨即奏之　　不奏載八十又或玄玄珠明珠玉英白玉赤文玉紫玉黃鐵金藤並爲上瑞又古秀嘉禾芝草華平並爲下瑞\n三秀\n野穀旅生\n野蠶成繭　光武時\n異畝同穎　唐叔得禾\n連理\n景星常見　可以夜作\n皇道無爲　帝德有象\n日再中\n晉羅含　在任有白雀棲集堂宇及致仕還家階庭忽蘭菊叢生以爲德行之感"},{"id":"juan11-002","source":"正文","juan":"卷第十一","menu":"銘功第三","sub_menu":null,"page":"七三","leaf":"二オ","text":"滅五登三\n七十二家\n北里之禾\n一茅三脊　史記自古受命帝王曷嘗不封太山禪梁甫者七十二家北里之禾以爲盛一茅三脊以爲藉\n助天報地　太山萬物之始封太山助天之高禪梁甫報地之厚也\n山呼萬歲　漢武時登嵩山有呼萬歲之聲三以三百戶封爲祠戶\n漢武勤而虛美\n相如有請\n明封禪書\n頌歲\n三五之遐跡\n踵八九之遐武　文選八九謂七十二君也\n白雲起封中　史記漢武封太山白雲起封中\n雲成宮闕　後漢光武封太山雲氣成宮闕\n探策　風俗通曰封太山者說山上有金篋玉策能知人壽脩短漢武探策得十八因倒讀八十其後壽長也\n升中　禮因天事天山升中于天\n於皇時周\n陟其高山　詩\n壇高廣\n刻石辭　武紀孟康注王者功成化定告成功於天封崇也助天之高封石紀績有金策玉函金泥玉檢之封應劭曰封者壇廣十二丈高三丈階三等必於其上示崇高也刻石紀績立石三丈一尺其辭曰事天以禮立身以義事親以孝育人以仁四守之內莫不爲郡縣八蠻四夷咸來貢職與天無極人民蕃息天祿永得上玄酒而俎生魚下禪梁甫祀地主示增廣也此古制也成壇廣丈二尺有勝書祕語師古曰封上於山而下禪祭於地主也\n禪云亭　管仲曰封禪者七十二家洲記十有二無懷封太山禪云亭黃帝禪云亭\n誰敢欺天　後漢建武中群臣言宜封禪詔曰百姓怨氣滿腹吾誰欺欺天\n汗出　魏蔣濟上疏請封禪\n帝曰聞濟言汗出流足\n嵩高六合之中\n何必太山　袁子正論云"},{"id":"juan11-003","source":"正文","juan":"卷第十一","menu":"圖書第四","sub_menu":null,"page":"七四","leaf":"二ウ","text":"握乾符\n披皇圖\n稽帝文\n俯叶河圖之靈　並見文選\n河出馬圖　明王之理天下也天不愛其道地不愛其寶故河出馬圖謂龍馬負圖也\n有道則見\n受命之符\n龍馬出圖於河　伏羲則之以畫八卦\n神龜負書於洛　夏禹受之以成九疇\n錫禹　尚書云天乃錫禹洪範九疇彝倫攸敘\n藏氣讖緯\n河洛開奧　出文選\n玄德升聞　皇天眷命用\n秘文\n後漢荀卿臨終戒子統曰　吾綈袟中有先祖所傳秘文爲漢家所用爾其慎之統遂學于朝廷多訪之也\n以讖命官　見司空門\n尹敏　通博經史帝使校圖讖敏增之曰君無口爲漢輔帝不罪亦以此沉滯"},{"id":"juan11-004","source":"正文","juan":"卷第十一","menu":"封禪第五","sub_menu":null,"page":"七四","leaf":"二ウ","text":"登封\n降禪\n齊乎黃軒　文選\n登岱勒封\n與黃比崇　黃帝封岱勒成以紀太平之功\n玉牒\n石紀　金字\n閉以玉檢　封以金泥\n紀聖號　鐫金\n紀禪\n告成\n紀德\n銘功"},{"id":"juan11-005","source":"正文","juan":"卷第十一","menu":"巡狩第六","sub_menu":null,"page":"七四","leaf":"二ウ","text":"王有巡狩　省四方也傳\n以大習之　大習朝會之禮\n展義　天子非展義不巡狩注所以宣布德義\n卜征　又曰先王卜征五年注先卜五年而卜吉凶也征巡狩也\n歲習其祥\n祥習則行　五年五卜皆吉乃行\n小有述職\n大有巡功\n時巡　書曰又六年王乃時巡狩注十二年一巡以時而巡\n先王以省方觀民設教　易觀卦\n宣皇明以燭幽\n究皇儀\n展帝功\n乘六龍\n翠華遲遲　並文選\n備法駕\n上順天時\n必蹕　禮\n言觀其旂\n東巡　虞書二月東巡狩至于岱宗柴注岱宗太山也燔柴以告天\n肆覲東后　遂見東方之君\n南巡　五月南巡狩至于南岳如岱禮\n西巡　八月西巡狩至于西岳如初\n朔巡　十一月\n朔巡狩至于北岳如西禮朔北也\n歸格于藝祖用特　五載一巡狩羣后四朝\n東征西怨　湯\n奚獨後予　　者辭也\n攸徂之民\n室家相慶\n曰徯我后\n后來其蘇　蘇息也\n撫萬邦\n巡侯甸　周書成王\n成有岐陽之蒐\n穆有塗山之會　皆示諸侯禮也\n時邁巡狩　祭此是望詩\n大明黜陟　黜陟幽明\n膳以犢　禮天子適諸侯諸侯膳以犢貴誠也\n陳詩觀風\n命市納賈　以觀人之好惡\n春省耕而補不足　秋省斂而助不給也\n僞遊雲夢　漢高祖擒韓信\n望幸\n明黜陟之分　則有巡功\n崇望秩之儀　是謂展義\n述邦職\n以省方\n觀人風　而展義\n周禮掌舍\n王會同設梐枑再重　注梐枑行馬也\n設宮車轅門　注謂王行止宿險阻之處備非常次車以爲藩則仰車以爲其表門\n爲帷宮則設旌門　注謂王行晝止若食其張帷爲宮則樹旌以表門\n無宮則供人門　注謂王行有逢遇若住游觀陳列周衛則立長大人表門也\n西戎之望既登　東巡之禮斯備\n將順其動\n無逆於時\n五載一巡　自東于北\n問其百年\n視其三老　每巡狩皆爲視老三公致仕之老明其三德三德者至德孝德敏德也"},{"id":"juan11-006","source":"正文","juan":"卷第十一","menu":"朝會第七","sub_menu":null,"page":"七五","leaf":"三オ","text":"周禮春見曰朝夏見曰宗秋見曰覲冬見曰遇時見曰會殷見曰同　春朝圖天下之事秋覲以比邦國之功夏宗以陳天下之謨冬遇以協諸侯之慮時會以發四方之禁殷同以施天下之政\n九賓之儀　自公侯至士也\n三揖之禮　天子當陽云云\n聲明\n文物\n端旒　負扆\n來王　四方述職\n九品陳儀\n恭己南面\n垂拱\n咸造勿褻\n在于王庭　道至也尊長也\n畢會\n和見　書和見事于周\n朝而獻功\n於是有容皃采章也\n朝會禮之經也\n周康有酆宮之朝\n穆有塗山之會　皆視諸侯禮也\n講禮　傳曰諸侯朝聘以志業聞朝以講禮\n再朝而會　以示威也\n五服　百辟\n六年五服一朝\n大明黜陟　周禮\n駿奔\n和會\n無敢不庭　周有後至\n肅穆\n退朝\n正位　正君臣之位\n辨色　禮曰朝辨色始入注羣臣辨色乃入朝也\n視朝　君日出而視朝\n侵朝\n趨朝於鳳闕　鷺列於鵷行\n會以訓上下之則以正班爵之義帥長幼之敘\n爲會諸侯於塗山執玉帛者萬國\n天子無事與諸侯相見曰朝\n禁慢\n立族譚者　周禮皆謂不肅敬者\n有疾　魏鍾繇元帝時有疾拜起不便時華歆亦以高年疾病朝見皆使載輿虎賁士輿上殿坐是後三公有疾以爲故事\n有度　霍光每出入下殿進止有常度\n一二臣衛敢執壤奠　書\n韓侯入覲以其介圭　詩\n庭燎之光　君子至止鸞聲噦噦\n諸侯朝正於王　傳\n王覲爲可　石碏謂州吁曰\n述職　諸侯朝天子曰述職\n名位有數　車服以庸\n方明　儀禮覲禮曰諸侯覲於天子爲宮方三百步四門壇十有二尋深四尺加方明于其上方明者木也四尺設六色東青南朱西白北黑上玄下黃設六玉上圭下璧南璋西琥北璜東圭注云深高也四時朝覲受於廟此時會同殷同也宮謂壝土爲埒以象牆壁爲宮於國外春會同於東方夏南方秋西方冬北方明者上下四方神象所謂明神也會盟每盟神監之則謂天之司盟有象者猶宗廟之有主王巡狩至方岳下諸侯亦爲此宮以見之\n朝既盈矣　昌矣\n高皇帝之朝廷　鄧通方倖在上傍息慢丞相申屠嘉入朝廷之儀不可不肅罷朝召通曰高皇帝之朝廷小臣不敬當斬帝使人赦通曰此吾弄臣也\n將朝尚早　趙宣子盛服將朝尚早坐而假寐\n孔張失位\n違位　越班\n委積\n膳獻\n飧牽\n幣器　周禮太宰凡朝覲會同賓客以禮之法掌其委積膳獻飲食賓客賜之飧牽予事與其幣器財物也\n庭實旅百\n玉帛相見　謂好會也\n諸侯麕至　麕羣至也\n庭爭相叱　後漢詔議從安議還北虜生口公卿皆言不宜還司徒桓虞改議從之鄭弘第五倫皆恨之弘欲厲聲因大言曰當還者皆不忠虞廷叱之倫等皆作色司隸奏安等詔云云何尤而謝\n又請　張酺孟侯太尉與司隸晏稱共請闕下酺因責稱其辭語不遜酺遂廷叱之司徒呂蓋奏酺位三司知公門宜肅以獨詔命及作色大言云云遂策免\n●制朝儀附朝會門\n叔孫通　與弟子徵魯諸生共起朝儀習之月餘會十月諸侯朝百官各以次陳列殿下傳皇帝輦出房闕朝曰吾乃知皇帝之貴\n朝有著定　著定列位之處\n會有表　表者位也\n表著之位　所以昭事序\n脩其班制　禮\n鵷行　鳳闕\n官由序守　朝以禮成\n君召　語曰君命召不俟駕行矣禮曰在官不俟屨在外不俟車\n九儀　大行人以九儀辨諸侯之位\n偏駕不入王門　儀禮入王門乘墨車\n陵三軍者或懼於朝廷之儀\n左九棘　孤卿大夫位焉\n右九棘　公侯伯子男位焉比周禮外朝之位\n鞭呼　司士率其屬以鞭呼趨朝辟　　錯立\n族譚　禁慢朝錯立族譚者\n輟朝而顧　不有異事必有異慮\n朝言不及犬馬\n濟濟翔翔　朝廷之美\n左嘉石　右肺石\n鞠躬\n外蕃朝　漢宣甘露年匈奴呼韓邪單于款五原塞願奉國珍朝詔議其次有司曰聖人之禮先京師後諸夏先諸夏後夷狄陛下聖德充塞天地光被四表匈奴單于鄉風慕化奉珍朝賀自古未之有也禮儀宜如諸侯王位下蕭望之以爲聖人正朔不及四夷外而不內宜待客禮後不至不爲叛臣宜以客禮待之位次諸侯王上詔從之也\n大行臚句傳　傳語告下曰臚下告上曰句大行今鴻臚也\n問朝儀　後漢賈融將會大會先遣從事問會見之儀時單\n之世曾聞誼禮禮儀褒書之宜吉百寮\n三公領兵入見　魏世語曰舊制三公領兵入見皆交戟叉頸而後前太祖將討張繡入見天子始復此制\n帶劒入　後漢梁冀帶劒入省尚書張陵呵叱令出冀跪謝陵不應因劾奏詔以一歲俸贖罪"},{"id":"juan11-007","source":"正文","juan":"卷第十一","menu":"朝會第七","sub_menu":"（續）","page":"七八","leaf":"四ウ","text":"設燈　魏武都王會文昌殿曰漢儀又設百華燈乃名諸討吏爾受敕劾於階下\n設白獸樽　見納諫門注\n差次功位　漢高后欲差次列侯功以定朝位\n優異　蕭何劒履上殿入朝不趨贊拜不名\n又　後漢包咸爲大鴻臚每進見錫以几杖入屛不趨贊事不名經傳有疑輒遣小黄門就舍即問\n王入朝　後漢東平王蒼入朝既至外綏乃拜天子親答之其後諸王入宮御以輦迎至省閤乃下蒼以受且禮過不安上疏辭\n●不朝　附朝會門\n貶爵削地六師移之　孟子曰諸侯朝天子曰述職一不朝則削其地三不朝則六師移之\n召君　傳晉侯召王以諸侯見且使王狩仲尼曰以臣召君不可以訓\n戮防風　禹會諸侯於塗山防風氏後至禹乃殺之\n賜吳王几杖　漢文帝時吳王濞詐病不朝賜之几杖務以德化\n不朝之閒無歲不聘　魯太叔謂楚人曰\n坐家視事　何遜爲僕射以疾辭郡驃不朝坐家視事\n不能造朝　孟子將朝宣王使人召孟子孟子曰不幸而有疾不能造朝也\n收上朝謁　後漢雲當朝請數稱病而私出多從賓客歸國黄山苑中者頭收上朝謁莫敢諫者"},{"id":"juan11-008","source":"正文","juan":"卷第十一","menu":"聘第八","sub_menu":null,"page":"七八","leaf":"四ウ","text":"時聘結好　大行人云時聘以結好\n殷頫以除邦國之慝　間問以諭諸侯之志\n展幣　儀禮\n奠幣　儀禮\n還圭　儀禮\n辭玉　傳衰仲辭秦主\n郊勞謁關　關人問從者幾人注其爲供也\n庭實館穀　館人爲賓三日具沐五日具浴\n致館　禮以安之傳曰叔弓如晉致館辭曰云云\n多貨傷德　聘主禮意多其貨則傷敗其德\n幣美則沒　周禮幣以副忠美之則主於幣失禮本意沒失也\n比年小聘三年大聘　禮\n歲聘以志業　傳\n鹿鳴皇皇者華　君遣使臣之詩也\n周禮野廬氏\n賓客至將徒聚欜有相翔者誅之　注相翔謂四面翔觀視賓客衣物將盜之\n卿士並聘　傳云凡君即位\n大夫之私覿非禮也　爲人臣者無外交不敢二君也\n發幣於公卿致餼　餼生肉也\n餼牽積芻禾　儀禮\n醯醢百甕　芻米\n蕃客　唯式季支主賓格鴻臚諸蕃官客食宜令御史按察有供給不如法隨事糾彈\n餼客餼二牢　禾百筥也\n適子之館　授子之粲\n○還珪璋　附聘門\n尚書如五器卒乃復　復還圭璧如五器禮終則還之三帛二生一死則不還也\n傳襄仲辭玉　秦伯使西乞術來聘襄仲辭玉曰君不忘舊好重之以大器寡君敢辭玉注云已聘而還其圭璋輕其禮不欲與之爲好也\n儀禮君使卿皮弁還玉於賓　君子於玉比德以聘重禮還之者德不可取於人相切磋之義皮弁者始以此服受之不敢不受也"},{"id":"juan11-009","source":"正文","juan":"卷第十一","menu":"御游第九","sub_menu":null,"page":"七九","leaf":"五オ","text":"原農事　管子曰先王之游也春出原農事之不本者謂之游注原察也不本謂不脩本務者也\n補不足　秋出補人之不足者謂之夕秋爲西成尚有不足者也\n從樂而不反者謂之荒　先王有游夕之業無荒亡之行桓公再拜曰寶法言其法可寶\n爲諸侯度　孟子曰吾王不游吾何以休吾王不豫吾何以助一游一豫爲諸侯度也\n春遊以發生啓諸蟄於潛戶秋豫以收成觀豐年之多稌　文選\n漢高過沛　擊筑爲大風之歌曰大風起兮雲飛揚云云\n泛舟兮濟汾河　漢武秋風辭曰\n駕六龍　乘八駿\n崆峒問道　黄軒之拜廣成\n瑤池舉觴　漢武之宴王母也\n楚襄王遊蘭臺之宮　有風颯然而至\n句陳出法駕天仗　仙衛\n遊赤水　黄帝\n皇儀帝容從游必蹕　其所\n○佚遊　附御游門\n欲肆其心車轍馬跡　左傳昔穆王欲肆其心周行天下將\n皆必有車轍馬跡焉祭公謀父作祈招之詩以止王心王是以獲沒於祗宮也\n游海　齊景公游海十月而不歸\n畋有洛　太康畋于有洛之表十旬不反\n楚昭王登荊臺而遊　其樂遺老忘死\n罔遊于佚罔淫於樂　大禹謨\n怠荒　無怠無荒\n盤遊無度\n樂遠出而露威靈數搖動而勞卑旅　本非人主急務也長楊賦\n樂佚遊　語"},{"id":"juan11-010","source":"正文","juan":"卷第十一","menu":"御宴第十","sub_menu":null,"page":"八〇","leaf":"五ウ","text":"湛露　天子宴諸侯也湛湛露斯匪陽不晞厭厭夜飲不醉無歸\n鹿鳴　燕羣臣嘉賓也既飲食之又實幣帛筐篚以將其厚意然後忠臣嘉賓盡得其心也\n式宴以樂和樂且湛樂與賢者共之莫不令儀既醉以酒　既飽以德\n王在在鎬　凱樂飲酒\n鈞臺　夏啓有鈞臺之享\n塗山　周穆有塗山之會\n萬樞之暇\n堯酒千鍾　堯舜\n栢梁之宴會日金罍　玉饌\n肅穆之容　皇情歡洽\n享以訓恭儉宴以示慈惠恭儉以行禮慈惠以布政　左傳\n觀威儀省禍福　甯子曰古之爲享食以觀威儀省禍福也\n加籩之禮　折俎之歡\n我有　我酒\n從游　侍食\n資飲食以合歡　用歌舞而飾喜\n周文有在鎬之樂　漢武有濟汾之歌\n周穆舉觴爲瑤池之宴　宴西王母也\n漢高擊筑爲沛人之歌　大風之歌也"},{"id":"juan11-011","source":"正文","juan":"卷第十一","menu":"籍田第十一","sub_menu":null,"page":"八〇","leaf":"五ウ","text":"帝籍千畝三推　禮天子正月擇元辰親載耒耜率公卿諸侯大夫躬耕籍田天子三推公五推卿諸侯九推也\n武王耕籍　然後諸侯知所以敬\n秉耒　天子爲籍千畝躬秉耒以事天地社稷以爲醴酪齊盛於是乎取之敬至也\n教養　耕籍所以教諸侯之養\n天子親耕於南郊諸侯耕於東郊　以供齊盛身致其誠\n信\n嗇夫下種　農祥辰正\n土膏脈起天田　地利\n以給宗廟　以供禘郊\n懋力務本敦孝致敬勤己　勸人\n春藉青壇修六府　穀之爲本\n陳八政　食以爲先\n具田器布農事播種稑之種撰播殖之器　藉田賦\n葸悟黛耜存救之要術　並藉田賦\n勞酒　親耕還乃宴飲於太寢公卿大夫皆御命曰勞酒也\n戒農用　國語司空除壇于籍農大夫戒農用\n王耕一墢　公卿大夫以次耕庶人終于千畝\n鉤盾弄田　漢昭紀上耕鉤盾弄田在未央宮中\n廢藉田　國語宣王不藉千畝虢文公諫曰夫人大事在農上帝粢盛於是乎出是以稷爲太官\n又　藉田之禮廢則敎教之典闕矣勸農之道缺矣\n又　文選魏秀才文曰昔周宣墮千畝之禮虢公納諫漢文缺三推之義賈生致言是知食爲民天農爲國本\n將率三推　誠本農於后稷\n不藉千畝　並諫於虢公\n后稷躬耕　宣王命藉\n既種既戒　將耒耜以率先\n不躬不親　並粢盛之致信\n金根　晉輿服志云金根車天子親耕所乘也置耒耜於軾上\n親祀先農　晉禮志云尚書符問藉田至尊應親祀先農否賀循答曰漢儀無王自祭之文應王者祭四望則毳冕祭社稷五祀則絺冕以此爲親祭之義也\n后稷播殖　夏爲躬耕\n降靈壇撫御耦王藉　周禮甸師帥其屬而耕耨王藉以時入之以供粢盛注云以其黍稷以供粢盛\n○先蠶　附藉田門\n東觀漢記曰　馬皇后置織室蠶於濯龍中又皇后採桑壇在蠶宮西南也\n蠶事既登分繭稱絲　又以桑爲均\n皇后躬桑　將一條執筐受蠶始生后食之三灑而已\n夫人繅三盆"},{"id":"juan11-012","source":"正文","juan":"卷第十一","menu":"明堂第十二","sub_menu":null,"page":"八一","leaf":"六オ","text":"天子布政之宮　內有太室體象天地\n明堂之制　上圜下方四達八牕九室三十六戶\n據坤靈之正位　順陰陽以開闔\n合宮總\n章　黄帝曰合宮虞舜曰總章\n複廟重屋　八達九房\n辨其方位　正天子之位也\n明諸侯之尊卑　明堂者也\n宗祀文王於明堂以配上帝\n天子立明堂者所以正四時之序敦五教之本　在國之南也白虎通\n昭昭明堂明堂孔陽　文選\n序五位\n東西九筵　西北七筵\n室容二八　周禮明堂制\n下之燥濕不能及上之寒暑不能入土事不文木事不鏤示人知節也　晏子春秋明堂之制\n夏制　三十室堂脩二七廣四脩一五室九階白盛謂蜃炭堊牆也五室四步三尺九階四旁兩夾牕門室之三室三之一也\n殷制　殷人重屋複笮也堂脩七尋堂崇三尺四阿阿今四柱也故名重屋\n周制　周人明堂度九尺之筵東西九筵南北七筵堂崇一筵五室每室二筵室中度以几堂上以筵中室度以尋塗以八中室四壁內也\n黄帝明堂圖　漢郊祀志太山北征有古時明堂上欲理明堂奉高旁濟南人公王帶上黄帝明堂圖注太公一王姓帶名也\n不登　左傳曰勇則害上不登於明堂\n李尤明堂銘曰　布政之宮上圓下方體則天地政則陰陽總達四設流水洋洋顧節行禮各居其旁春恤孤幼夏近賢良秋勵武冬進賢入"},{"id":"juan11-013","source":"正文","juan":"卷第十一","menu":"辟雍第十三","sub_menu":null,"page":"八二","leaf":"六ウ","text":"左制辟雍　在明堂之左文選\n乃流辟雍辟雍湯湯聖皇涖止造舟爲梁　文選\n又造舟清池維水泱泱乃營三宮　謂明堂辟雍靈臺也\n白虎通曰　辟雍者所以行禮樂宣教出辟者象璧之圜以施法天下雍者壅也壅之以水象教化流行又云辟積也積天下之道德壅天下之殘賊\n詩於樂辟雍　文王知鳥獸得所以爲音聲與政通既合樂以羣之諸在辟雍者言感中和之志也\n鎬京辟雍自西自東無思不服　武王於鎬京行辟雍之禮自四方來觀者無不歸服\n四方攸同\n皇王辟雍　禮統曰辟雍教化天下也\n王制天子曰辟雍　圓如璧環之以水內如覆盆外如覆蓋\n諸侯曰頖　半無水下天子重屋諸侯宗廟殿天子廟諸侯廿室\n三雍　漢武帝時河間獻王來朝獻雅樂對三雍注謂辟雍明堂靈臺言天地君臣人民皆然\n建三宮之文質彰厥職之所宜　終軍書三宮班政有文質也\n踐辟雍尊事三老兄事五更　注後漢明帝\n海流道德　圜海迴旋"},{"id":"juan11-014","source":"正文","juan":"卷第十一","menu":"靈臺第十四","sub_menu":null,"page":"八三","leaf":"七オ","text":"右立靈臺　文選云靈臺在明堂之右\n乃經靈臺靈臺既崇帝勤時登爰考休徵　文選\n馮相視祲　祲氣也\n祈禖禳災　禳福也\n經始靈臺不日成之　詩\n經始勿亟庶民子來　謂文王造靈臺也詩\n九仞　靈臺至高九仞在國之南上無屋以觀休祥\n夏曰　清臺\n殷曰　神臺\n周曰　靈臺\n王者外靈臺　望元氣吹時律觀物變\n觀天文之變　洪範傳天子立靈臺所以觀天文之變而候日月\n崇上帝　晉尚書陸機策秀才文曰明堂崇上帝清廟崇祖考辟雍崇教化大學講藝云文諸儒論之皆異蔡邕謂之一物何也紀瞻對曰取其宗祀之貌曰清廟取室之貌曰太室取堂曰明堂四門之學取圜曰辟雍者也"},{"id":"juan11-015","source":"正文","juan":"卷第十一","menu":"太子第十五","sub_menu":null,"page":"八三","leaf":"七オ","text":"明兩繼明　易曰明兩作離大人以繼明照于四方\n一有元良萬邦以貞　太子之謂也\n敬保元子　成王顧命\n聖敬日躋\n齒學　禮行一物以三善皆得者唯太子而已其齒學之謂也故太子齒學國人觀之曰將君我而與我齒讓何也曰有父在則禮然又兄在又其君在此三善也\n三善將君我齒讓　並見上注\n恭敬溫文　禮\n朝於王季日三問內豎安否如何　文王爲世子也\n侍膳　傳太子奉冢祀社稷之粢盛以朝夕視君膳也\n撫軍監國\n君行則守有守則從從曰撫軍守曰監國\n羽翼已成　漢高欲廢太子太子徵四皓到帝知太子羽翼已成遂不廢\n監撫餘閑　文選序\n東朝乾之長男合洊雷之象　居明離之位洊雷震也\n繼正體以爲大本　顯明德而居少陽\n位尊儲副　德茂元良\n博望之苑　承華之門\n出龍樓而奉詔　入虎闈而齒冑\n太子承萬代之業　漢書\n搖本　漢高欲廢太子叔孫通曰太子天下之本本搖而天下不安奈何以天下爲戲\n孽子配嫡亂之本也　傳\n銅龍樓　太子宮樓\n辯惠對日　晉明帝年數歲元帝抱日問長安與日孰遠曰日遠只聞人從長安來不聞人從日邊來居然可知帝異之他日大集賓客問之曰日近帝問之曰舉首見日不見長安\n五勝　帝王紀晉平公使叔譽聘周見太子晉與之言晉五勝之叔譽三窮歸告公曰太子年十五臣不能與之言君其事之\n問安侍膳　文王爲世子王季一飯亦一飯再飯亦再飯武王帥而行也\n諫　春秋外傳靈王二十二年穀洛鬭將毀王宮爲將壅之太子晉諫云云遂止\n吹鳳笙　太子晉吹笙於洛濱\n鳳作樂　山海經祝融生太子長琴是時處瑤山作瑤山之樂也\n晉太子出會　日在三恪下王公上也\n羣臣見儀　晉尚書符問王公已下見皇太子儀及所依服國子博士車胤議朝臣宜朱襮情拜則案經傳不見其文故太傅羊祜慶太子稱叩頭死罪此則拜之證也又太寧三年詔議其典尚書下臺謂宜稽則漢魏團朝同拜其朱衣冠冕唯施天朝宜稽情而已朝議多同矣\n前星　漢書五行傳曰心大星天王星也前星太子星也\n鶴禁　漢宮闕疏曰白鶴太子所居凡人不得輙入故云鶴禁也\n少海　昔天子比大海太子爲少海\n日重光月重輪山重暉海重潤　崔豹古今注曰明帝時爲太子樂府詞云云\n○教導　附太子門\n必以禮樂　禮凡三王教世子必以禮樂樂所以脩內也禮所以脩外也禮樂交錯於中發形於外是故其成也懌恭敬而溫文\n太傅少傅　立太傅少傅以\n養之欲其知父子君臣之道也\n敎諭德成　入則有保出則有師是故敎諭而德成也\n師也者　敎之以事而諭諸德者也\n樂正司業父師司成\n抗世子之法於伯禽　成王幼而不能涖阼周公抗世子之法於伯禽使與王居欲令成王知父子君臣長幼之道\n二踈　四皓\n明兩在三　三謂君父師也\n見正事聞正言行正道　賈誼云太子所宜也\n嗜鮑　賈誼書文王使太公望傅太子發發嗜鮑魚太公不與曰鮑魚不登俎豆豈有非禮可以養太子哉\n禮樂之敎\n授經　後漢桓榮授太子經\n齒學　見上\n親拜　晉賀循字彥先世爲儒宗除太子太傅命皇太子親往拜之\n喜頌　漢太子喜王褒甘泉及洞簫頌令左右皆誦之也\n遊洊雷之講肆　爲明离之冑筵\n保也者　愼其身以輔翼之而歸諸道\n○生　附太子門\n吹銅　大戴禮曰古者王生太子太師吹銅而御戶注銅律也吹之以和氣\n卜士負之士妻食之　左傳\n接以太牢桑弧蓬矢六射天地四方\n甲觀畫堂　漢成帝生於甲觀畫堂\n誕彌厥月　詩誕大也彌終也謂后稷生也\n繼體之慶\n岐嶷　魏明帝生而文帝愛之常在左右數歲而有岐嶷之姿\n○疾　附太子門\n玉體不安　七發曰楚太子有疾吳客往問之曰伏聞太子玉體不安亦少閒乎\n忽忽不樂　漢太子體不安忽忽不樂詔使王褒等皆之太子宮娛侍太子朝夕平復乃歸\n○死　附太子門\n思子望思　漢戾太子死後武帝思之作思子宮歸來望思之臺以寄其魂來\n苑空博望　門閑承華\n道行三善　天奪九齡\n○賓客　附太子門\n四皓　漢張良令太子作書迎商山四皓卑辭安車請以爲客\n博望苑　漢武帝立子據爲太子起博望苑以通賓客即戾太子\n以成羽翼\n調護"},{"id":"juan11-016","source":"正文","juan":"卷第十一","menu":"皇后第十六","sub_menu":null,"page":"八五","leaf":"八オ","text":"乃順承天厚德載物　易坤卦\n柔順利貞含萬物而化光正位居體美\n在其中\n關雎之德\n葛覃　歸安父母以成婦道\n憂在進賢無私謁之心\n芣苡　　　不妬忌之美也\n兔罝　后妃之化也\n天立厥配來嫁于周　作嬪于京\n天作之合\n俔天之妹　文王親迎于渭\n以聽內治　禮天子后立六宮以聽天下之內治月食則后素服修六宮之職\n以明婦順天下內和聽女順治陰德聽內職和順陰敎\n母道母天下\n日之與月　天子之與后猶日之與月陰之與陽相須而成治也\n外戚塗山有娀姜嫄大任　史夏之興也以塗山殷之興也以有娀周之興也以姜嫄太任\n內主淑女之德麗華之容\n周禮以陰禮敎六宮　六宮后也\n立市　后立市陰之義\n並后　傳曰並后匹嫡亂之本也\n外戚之助　史自古受命帝王及繼體守文之君非獨內德茂也蓋亦有外戚之助\n金屋　漢武曰得阿嬌當以金屋貯之即陳皇后也\n椒房　漢官儀曰皇后稱椒房室取温煖除惡氣也又天子朱泥殿上日月輝也\n死喪服　天子與后猶父之與母也故爲天王服斬衰服父之義也爲后服齊衰服母之義也\n桂宮\n中諮\n樛木　后妃逮下無嫉妬也\n上尊宗廟　夙夜祁祁\n下訓御人　尊卑肅肅\n將無嗜慾用奠\n仁慈\n禮服澣濯之衣　脩蘋藻之事\n螽斯之詠　見於婦德\n麟趾之化\n或淚竹成斑\n既思虞舜　二妃\n聞裂繒起笑\n將亡夏桀　末喜\n婦人無儀\n中饋是儀　易家人國風之詩\n坤道象陰　故能配合聖人易\n體資生之仁　含咸象之德\n助天養萬物　大戴禮曰\n陰體充和　婦道承順\n修其四德　言容德功\n合於六宮　禮\n穆穆克敬　邕邕\n○賢智　附皇后門\n亂臣十人　九人而已其一人謂文母\n關雎　注見上\n樊氏忠賢進善於楚國\n馬后貞素辭寵於漢君　漢明帝馬皇后爲人貞潔衣不加彩帝每幸之輒曰陛下當兩之澤潤及六宮使陰陽和暢示不偏也帝嘉善之\n班婕妤辭輦\n懿範內令　后之敎下也周禮\n婦式\n○失道　附皇后門\n婦順不脩　禮記天子立后以章明婦順是以婦順不脩陰事不得謫見於天月爲之食故月食則后素服而脩六宮之職蕩天下之陰事注蕩滌去穢惡\n末喜妲己褒姒　史桀之亡也以末喜紂之亡也以妲己周幽之亡也以於褒姒也\n妒長門宮　陳皇后妬帝寘於長門宮\n奇衺　媚道\n同玉輦而恃恩　專金屋而怙寵\n殺皇子　漢成趙昭儀皇后飛燕妹也殺皇子帝遂絕嗣童謠曰燕飛來啄皇孫\n○納后　附皇后門\n若而人　傳曰王求后於齊齊侯使晏桓子曰夫婦所生若而人妾婦之子若而人無女而有姊妹則曰先守某公之遺女若而人此先王之禮辭也不敢辭云若如人也齊侯許昏使陰里結之也\n備百姓　納女於天子曰備百姓姓生也言廣生息也\n五可　晉武帝爲太子納妃衞瓘女楊后受賈充妻郭氏之誂欲娶賈充女帝曰衞氏女有五可長白賢多子賈氏女五不可短黑惡妬無子\n○嬪婦　附皇后門\n以備內官　傳曰以備內官焜耀寡人之望\n以備嬪嬙　　　　　也\n內治　古者天子后立六宮三夫人九嬪二十七世婦八十一御妻以聽天下之內治\n馮昭儀之當熊　義勇\n班婕妤之辭輦\n五不可　見納后門\n以陰禮敎九嬪\n以婦職之法敎九御　八十一御妻也\n正其服　正諭修也\n禁其奇衺　媚道\n展其功緒　婦功\n命婦　九嬪已下\n內人　九御\n內官　夫人已下\n陰事　謂王羣御妃嬪之事也\n九嬪　掌婦學之法以敎九御婦德婦言婦功婦容各率其屬而以時御于王所言有次序\n貫魚之寵　易　　宮人寵\n釐降二女于嬀汭嬪于虞　堯妻舜二女也\n歸妾　燕燕衞莊姜送歸妾也\n宿有妃嬙嬪御焉　傳謂吳王夫差\n三妃　舜葬於蒼梧之野蓋三妃未之從\n內寵並后　亂之本也\n女史彤管　古者后夫人必有女史彤管之法后妃羣妾以禮御于君所女史書其環以進退生子月辰則以金環退之當御者以銀環進之進之者著于左手既御著于右手\n小星　詩曰嘒彼小星三五在東　衆妾\n○外戚　附皇后門\n外戚之助　注見上\n一門三后　後漢梁冀家也\n金穴　後漢郭況外戚之富號爲金穴\n王氏五侯　漢元后兄弟王鳳等\n東漢論於　習妾寵\n肺腑重侯累將\n貴　戚\n瑣瑣姻婭\n外姻"},{"id":"juan11-017","source":"正文","juan":"卷第十一","menu":"公主第十七","sub_menu":null,"page":"八八","leaf":"九ウ","text":"魯　元平陽烏孫　並公主号\n釐降二女　堯妻舜二女見上注\n何彼穠矣美王姬也　雖則王姬亦下嫁於諸侯執婦道以成肅雝之德\n列侯尚主\n夫詘於婦　漢王吉曰列侯尚公主諸侯則國人承公主使夫詘於婦非陽尊陰卑之義\n公主子　後漢封公主者所生之子襲母封爲列侯皆傳國\n違天　蔡邕言尚主之制非古也以陰而陽天以婦凌夫違人也\n和親出降\n天女帝子鼓瑟於湘水　　　也\n仙人吹簫於秦樓　　弄玉學吹而鳳至遂升仙而去\n貴主平陽\n乘龍下嫁\n主第　　也\n車服　不繫其夫下王后一等\n雜令諸王公主　及宮人不得\n後漢館陶公主　爲子求郎賜錢百萬而不與\n未嫁敎於公宮　禮\n女之車服不繫於夫\n棠棣之華桃李之色　詩\n義絕儔私　天子之女　客也\n虔恭正匹　　　　　公主也\n公主封邑亦置官屬　漢書\n分國\n之榮孰敢不敬　晉書\n沁水之園\n乘綵舟於夜月　漢書有公主於沁水立園\n夏侯楙尚清河公主　位至侍中\n漢公孫賀　子敬聲與陽石公主私通\n董偃　與母賣珠於館陶公主家後爲公主寵遇\n彼月斯望\n在鈞惟緡　詩天子之女如月之在望時言以緡釣魚若齊侯之子娶平王之孫也\n築館於魯　春秋\n帝乙歸妹　易\n○王女　附公主門\n穠李美王姬也　注見上\n華如桃李　何彼穠矣\n王姬之車\n平王之孫\n天孫金枝\n亭公主　後漢諸王女皆封亭公主肅宗特封東平王蒼琅邪王京女爲縣公主封公主者所生子襲母封爲列侯皆傳國鄉亭不傳\n皇孫"},{"id":"juan11-018","source":"正文","juan":"卷第十一","menu":"皇親第十八","sub_menu":null,"page":"八九","leaf":"十オ","text":"分寶玉於伯叔之國\n時庸展親\n敦敘九族\n和睦貴親\n綏族\n不咸　傳昔周公弔二叔之不咸咸和也弔傷也\n既穆宗枝\n戚里\n敦睦之情　懷柔之道\n天孫　帝子\n金枝朱邸\n貴戚\n本枝　宗子\n維城之固　盤石之安\n立愛惟親　書\n君子篤於親　則民興於仁\n雖有周親　不如仁人\n吾宗　傳晉吾宗也\n親親　周禮太宰以統馭萬人一曰親親親九族也\n人道之先　親親也\n立愛自親始敎民睦也\n寵弟宗盟　周之宗盟異姓爲後\n糺合宗族于成周\n親不在外　羈不在外\n葛藟　王族刺桓公棄其九族也\n公族朝于內　朝內親也\n玄元仙宗　皇家天族\n本玄祖之靈源　分皇家之茂緒\n糺合符棣華之詩　信厚如麟趾之日\n肺腑　劉向曰臣幸託肺腑言國親如肺腑之附身\n葭莩　言輕薄之親也\n振振公族\n王\n入朝侍從　漢定陶王入朝盡從傅相中尉時中山王亦來朝獨從傅上怪問定陶王王對曰令云諸侯王朝得從其國二千石故盡從問中山王中山王不能對\n輦迎答拜　後漢東平王蒼既至升殿乃拜天子親答之其後諸王入宮輒以輦迎至省閤乃下蒼以受恩過禮情不自寧上疏辭之\n○公族之敎　附皇親門\n周公踐阼　庶子之正於公族者敎之以孝悌睦友子愛明父子之義長幼之序\n向方　古者庶子之官治而邦國有倫邦國有倫而衆向方矣注言知所向也\n所以深骨肉之恩　厚枝葉之庇\n麟趾美公子皆有信厚也\n理親存愛　理正也禮\n合族戚君　禮有合族之道族不得以其戚戚君位也注君恩雖可以下施而族人皆臣不得以父兄之尊加於君也\n以敎睦人　禮\n○齒序　附皇親門\n公族朝于內　朝內親也雖有貴者以齒明父子也\n宗廟之中以爵爲位　崇德也\n宗人授事以爵以官　尊賢也\n公與族人燕則以兄弟齒\n而孝悌之道達矣　以至尊不自異於親列之中\n其族食世降一等\n親親之殺也　殺差也謂燕有序數\n宗盟　傳云周之宗盟異姓爲後\n周人貴親而尚齒　禮\n立敬惟長\n親親　長\n先親後踈　曹植表曰堯之爲敎先親而後踈\n理親　禮\n見親踈之殺焉　禮\n君子因族以合食　合食謂與族人合食\n喪紀以服之輕重爲序　不奪人倫之親\n○公族之刑　附皇親門\n禮公族有死罪則磬于甸人　不於市朝也甸人掌野官也懸縊殺之曰磬也\n三宥　獄成有司讞于公則曰某之罪在大辟公曰宥之及三宥不對走出致刑于甸人公乃素服不舉也\n公族無宮刑　不翦其類也\n雖金枝可貴　三宥並加\n而王律難容　一成不變\n宜解\n網於竹刑　無縱斧於葛藟\n治國制刑　不隱其親\n宜准律論\n難從刑放　傳刑放於寵也\n雖親推立愛　而罪則斷恩\n威克厥愛　義必掩恩\n私不害公\n門內之治恩掩　門外之治義斷恩也\n王之同姓有罪則死刑焉　周禮甸師注云王同姓有罪者斷其獄於甸師之官\n凡王之同族有罪不即市　周禮注云刑于隱所也\n議親　周禮八辟曰議親之辟也\n無有不禁　月令雖有貴戚近習無有不禁\n理親　禮云\n纖剸　禮公族之罪其在纖剸亦告于甸人\n有致刑于甸人　公素服哭之如其倫之喪無服\n恩雖切於棣華　法宜除於葛藟\n親哭之　骨肉之恩無絕"},{"id":"juan11-019","source":"正文","juan":"卷第十一","menu":"封建第十九","sub_menu":null,"page":"九一","leaf":"十一オ","text":"夾輔藩屏\n宗子維城之固　本枝盤石之安\n五等開封　周乃寵諸兄弟\n七王建國　漢則祚及子孫\n故周室將遷　必依晉鄭之國\n漢家保定　實因齊楚之功\n綏麟趾之族　廣天子之封\n將濟棣華之美　請遵桐葉之封\n封建親戚以藩屏周室　傳昔周公弔二叔之不咸故云\n建立子孫藩屏社稷　漢書高皇\n懷柔天下以親屏周　傳周之有懿德也猶曰莫若兄弟故封建之其懷柔天下也故以親屏周\n十有五人　武王克商建兄弟之國者十有五人\n厚骨肉之恩　重山河之誓\n茅土同姓以封　周禮\n以脤膰之禮親兄弟之國　周禮云\n○離弃　附封建門\n杕杜　刺時君不能親其宗族也晉人\n葛藟　王族刺桓王也周道衰弃其九族\n道乖綏族　義娶篤親\n昵近　昵親也\n骨肉將離　不親九族\n枝葉將落　無庇本根\n無縱斧於棣華　宜庇根於葛藟\n不迪　書今商王\n必歸弃賤遺王父母弟不迪迪道也言接之不以道也\n義先立愛　仁不遺親\n遠間親　所謂六逆傳也\n小忿　傳王將以狄伐鄭富辰曰華有小忿不廢懿親今天子不忍小忿以弃鄭親其若之何也\n親離\n存愛　禮云\n晉自驪姬之亂詛無畜羣公子自是晉無公族　成公即位乃立之哉\n將枝葉之有庇　芭葛草之難圖\n展親將藉於屛周　不弟評同於克段也\n棄親用羈　單獻公"},{"id":"juan11-020","source":"正文","juan":"卷第十一","menu":"宮殿第二十","sub_menu":null,"page":"九二","leaf":"十一ウ","text":"其始也取諸大壯之象　其終也落以斯干之詩\n壯王室　廓帝居\n順晦明而朝啓夕閉　易寒暑而夏清冬温\n壯麗之規　翚動之勢\n雲構　金鋪\n虹亘梁　蛇負擔\n美哉輪焉奐焉　禮云\n上棟下宇以待風雨　易云\n大廈眈眈\n欒櫨\n燕雀相賀　淮南子曰大廈成而燕雀相賀\n豐約之析衷\n杏梁　藻梲\n朱甍　青甍\n實實　廣大也\n枚枚　礱密也\n秘宇宸居\n彤軒　紫庭\n文欀　華梁\n斯飛之制\n禮以大爲貴者　宮室之量也\n有以高爲貴者　天子之堂九尺諸侯七尺大夫五尺士三尺也\n承明殿　漢殿名也\n靈光殿　魯殿\n歷金門上玉堂　解嘲\n重轑　音老今館舍一邊虛加木爲兩轑也\n便殿　離宮\n三十六所　文選離宮別館三十六\n宣室　漢上幸宣室在未央宮中蓋在前殿之側\n輦道相屬\n蒲宮有前　葺蒲爲殿執戈在前爲衞左傳楚公子也\n行宮　周禮宮車轅門帷宮旌門注謂王行止宿險阻之處備非常次車以爲藩則仰車以表門帷宮則設旌門謂王晝止若食息帷宮則樹旌以表門也\n黃帝有合宮\n堯有貳宮　管子\n湯受命於鑣宮\n周有髙宮秦有蘄年宮漢有未央宮沛宮林光宮甘泉宮萬歲池陽壽宮建章太一思子宜春宮後漢有南宮胡宮桃宮魏有鄴宮吳有太初宮　此諸宮皆以金合土爲之以爲貴也\n紫微玄武　並宮名\n三輔記曰　京兆有步高宮長安有望遷宮\n望仙宮　元封三年起\n集靈宮　漢武帝置\n曜華宮　梁孝王作\n養德宮　趙王如意宮\n武帝置宮張羽旗以禮神\n幽房昭臺　並宮名\n長安有馺娑宮逍遙宮　嘉　洒造\n逃夏宮　春申君造\n祈年延壽宮　長安有\n層成殿　在長安華林園中\n朱雀黃龍　並殿名在洛陽\n洛陽有嘉德徵音殿又有九華百福殿景福延休　並殿名\n●制造　附宮殿門\n時惟農隙　工以王事\n定之方中作爲楚宮揆之以日作爲楚室　毛詩衛文公得其時民悅之也\n揆日作室　見上\n瓌材崇制\n屆日構規\n遵王度\n經始勿亟\n周室百堵並作　漢宮千門萬闕\n將侔大壯之象　必考定星之朔\n雖欲克壯宸居　亦可哀遵時制\n萬載不傾　宜度永嘉\n晝象中景　夜考極星\n●奢　附宮殿門\n詭制建章宮　漢制建章宮千門萬戶\n丹楹刻桷　傳曰魯莊公丹楹刻桷御孫諫曰侈惡之大也\n未央壯麗　漢書蕭何治未央宮上怒其壯麗何曰天子以四海爲家非壯麗無以重威儀且無令後世有以加者\n窮奢極侈　文選\n使鬼爲之則神矣使人爲之則苦矣　史記由余謂秦\n穆公曰\n不度　不才\n爲之者勞　居之者逸\n極棟宇之規　陋百王之制\n峻宇雕牆　大禹訓\n雖表萬乘之尊　猶勞兆人之力\n秦政阿房　殷紂瓊室夏桀瑤臺\n土無舊質　本矣本形\n●儉　附宮殿門\n卑宮室　夏禹\n闔閭室不崇壇宮室卑庳無觀臺榭　晉文\n茅茨不翦土階三尺　唐堯\n儉而不陋\n匪雕　匪刻\n去泰　去甚\n木無雕鏤足以避燥濕不傷財　不勞人\n雖儉德而則然　在儀刑而未可\n既未折中　是爲偏下\n●落之　附宮殿門\n楚子成章華之臺願與諸侯落之　宮室成祭之爲落\n棟宇厥初　取諸大壯之象\n宮室云畢　落以斯干之詩\n禮廟成則釁之　殺牲以釁之\n路寢成則考之不釁　考之謂設盛食以樂之\n●焚燒　附宮殿門\n栢梁既災\n越巫陳方建章是經用厭火祥　文選東京賦\n靈光巋存　魯\n吳宮火焚燕巢\n魯曾司鐸火　左傳司鐸宮名\n濟濡帷幕鬱攸從之\n蒙葺公屋　以濡物蒙屋\n傷人則止財可爲也　季桓子曰"},{"id":"juan11-021","source":"正文","juan":"卷第十一","menu":"禁門第二十一","sub_menu":null,"page":"九四","leaf":"十二ウ","text":"周禮掌舍掌王會同之舍設車宮轅門　王行險阻處次車以爲藩以轅表門\n爲壇壝宮棘門　王止平地築壇起土埒比爲宮棘門以戟爲門\n帷宮設旌門　王晝食息帷爲宮以旌表門\n無宮供人門　謂王行有逢遇若遊觀陳列周衞則立長大人爲門\n閽寺掌守王宮中門之禁　王\n司門掌授管鍵以啓閉\n國幾其出入\n監門由闑右　大夫士出入君門由闑右也\n乃立皐門皐門有伉乃立應門　注皐門王郭門應門正門也\n太子梁王至司馬門不下車　張釋之爲宮車令追止劾不敬\n通籍　漢武令從官給事大父母得通籍司馬門\n失闌　王嘉以侍郎射策甲科爲郎坐戶殿門失闌免注云戶止也時有闌入而嘉失之不執也\n歷金門上玉堂有日矣　揚雄解嘲\n夜開宮門　漢石顯君房欲取信於上嘗使諸宮先奏恐漏盡宮門閉請詔吏開門上許之顯故投夜還稱詔開門入後果有上書言顯專命矯制夜開門天子笑以書示顯顯因泣曰陛下過任小臣羣下無不嫉妬事類此非一後有譖顯者不信也\n曹植乘車馬行馳道開司馬門出　太祖怒坐公車令死罪重諸侯科禁"},{"id":"juan11-022","source":"正文","juan":"卷第十一","menu":"禁衞第二十二","sub_menu":null,"page":"九五","leaf":"十三オ","text":"祈父予王之爪牙胡轉予于恤靡所止居　詩\n環列之尹　楚穆王使潘崇掌環列之尹宮衞之官列兵而環王宮也\n環衞\n警衞\n申宮警備　注申勑宮中令備也\n楚公子圍設服離衞　設君服離衞陳守衞也\n祈父　司馬非其人故詩以刺之\n●警衞　附禁衞門\n周禮宮正以時比宮府次舍　注舍所居守舍以諸文直廬也\n夕擊柝而比稅\n八次　文主宿衞廬也\n晝三巡夜三鼜　七亦反鼜擊守鼓\n漢衞尉掌宮門屯兵　宮衞士於周垣下爲區廬區廬今伏衞屋也\n出入周衞之中\n厭承明之廬　漢武賜嚴助書曰君厭承明之廬云云\n周廬千列\n衞尉七八設在蘭錡　文選\n扞撮　行夜\n夜士警晝巡夜宿衞\n黑衣之缺　史記左師觸龍言於太后曰臣賤息舒祺願少補黑衣之缺以衞王宮\n幸得宿衞十有餘年時從出遊遊於後園　子虛賦\n誰何\n問誰何也\n●主守　附禁衞門\n周禮司門掌授管鍵以啓閉國門\n抱關　侯嬴監於夷門爲抱關者\n爲卒　梅福變姓名隱吳市門\n限以外內不可踰也\n察其出入\n何莫由斯\n閽人掌守王之宮門以時啓閉\n閽者　禮曰守門之賤者也古者不使刑人守門\n夜不納帝　後漢郅惲爲上東門候帝獵夜還惲拒關不開令從者見面於門惲曰火明遼遠不奉詔帝乃還後中東門入明賜惲布百疋貶中東門候爲參封尉也\n●搜索　附禁衞門\n左傳閉門而索客　謂搜索對人也\n露索　霍光自上官謀後出入自愼引見言事者先露索然後召見蕭望之不肯\n●闌入　附禁衞門\n臧會讒於臧氏臧昭伯使逐之反奔執於季氏中門之外季平子怒曰何故以兵入吾門拘臧氏老　左傳\n射中苑門　漢成宣爲右扶風坐怒吏成信信亡藏上林中宣使郿令將吏卒闌入上林蠶室門攻亭格殺信射中苑門下吏爲大逆當族自殺\n闌內罪人　嚴延年爲侍御史劾大司農田延年持兵干屬車屬車天子車大司農自訟不干屬車御史中丞譴責延年何不移書宮門禁止大司農而令得出入宮於是覆劾延年闌內罪人法死注云故事有所劾奏並移宮門禁止不得入矣\n失闌　王嘉字公仲爲郎坐戶殿門失闌免戶止也\n通籍　董賢幸於上嘗休休不出願侍醫藥上令賢妻通籍得入宮殿中止宿\n除籍　魏其侯竇嬰不好黃老太后怒除嬰門籍不得入朝請嬰字王孫\n漢元令從官給事官司馬門中者得爲大父母父母兄弟通籍　從官者及虎賁羽林太官太醫是也\n●行馬　附禁衞門\n周禮掌舍王之會同設梐枑再重　注梐枑行馬也\n門施　晉成帝美顧含素行加光祿大夫門施行馬\n又　魯定爲光祿大夫位特進給事中門施行馬"},{"id":"juan11-023","source":"正文","juan":"卷第十一","menu":"馳道第二十三","sub_menu":null,"page":"九六","leaf":"十三ウ","text":"絕馳\n道　成帝爲太子詔急召太子太子出龍樓門不敢絕馳道西至直城門得絕乃度上遲之具狀對上悅後乃著令令太子得絕馳道也\n發民　黃霸字次翁自潁川太守徵守京兆尹坐發民馳道不先聞\n沒入車馬　翟方進遷丞相司直從上甘泉行馳道中司隸校尉陳慶劾奏沒入車馬\n以令行馳道　鮑宣爲司隸校尉此司直丞相孔光四時幸園陵官屬以令行馳道中宣出逢之使吏鉤止丞相掾沒入其車推辱宰相下御史中丞至司隸官欲捕從事從事閉門不納宣閉使者無人臣禮大不敬\n坐主守　曹植字子建嘗乘車馬行馳道中開司馬門出太祖怒公車令坐死由是重諸侯科禁"},{"id":"juan11-024","source":"正文","juan":"卷第十一","menu":"苑囿第二十四","sub_menu":null,"page":"九七","leaf":"十四オ","text":"天苑禁苑上苑小苑君囿上囿周囿靈囿　漢立上林\n廣百里　天子苑\n容萬乘　漢上林苑\n繚以周牆　文選\n制同梁鄒　梁鄒古天子苑田名\n義合靈囿　並文選\n因原　東都賦云因原而作苑\n跨谷　西京賦云上林苑跨谷弥皐也\n遺藪爲囿\n值林爲苑\n養獸　漢舊儀上林苑中養百獸天子秋冬射獵取之\n鉤楯所職　鉤楯官也事小苑之果木\n詩王在靈囿麀鹿攸伏　言鳥獸得其所\n樵蘇往來無忌　文選\n文王之囿與人共之　晉書\n七十里囿人以爲小　孟子齊王問孟子曰文王之囿方七十里人以爲小寡人之囿方四十里人以爲大何也\n芻蕘者　孟子曰文王之囿芻蕘者往焉與人共之人之爲小不亦宜乎今君之囿人有殺其麋鹿者與殺人同則是以四十里爲陷阱人以爲大不亦宜乎\n往　注見上\n立思賢以招賓　西京記文帝爲太子立思賢苑以招賓客\n開博望以通客　孝武立子據爲太子開博望苑以通賓客\n得其時制揉周法　覽漢制\n以假貧人　東觀漢記詔有司京師果園悉以假貧人\n築鹿有虞之非正　公羊傳云築鹿囿有囿矣天子囿方百里公侯八十里伯七十里子男五十里山林藪澤與人共之虞之非正也\n罷苑馬以賜貧\n人　漢宣帝詔　　不奉法\n池籞希御幸者假與貧人　斫竹以繩綿連禁籞不得往來禽名爲籞在水中作室可以擁鳥入則捕之出宮紹也\n毋收芋菓　芋蘆何謂上林空弃地令人得毋收芋菓爲獸食祿繫之\n梁苑　梁孝王東苑方三百里\n鼈陵池而勿禁\n長洲苑　枚乘諫吳王曰漢上林不如長洲之苑\n上林廣成苑可墾闢者賦貧人　後漢安帝詔\n甘泉　三輔黃圖甘泉苑起仙人觀緣山谷行至雲陽三百八十一里入扶風凡周回五百四十里\n上林　漢舊儀上林苑中廣長三百里離宮七十所皆容千乘萬騎\n周禮雍氏禁山爲苑　令禽獸自得其性\n以網爲周阹　音祛長楊賦阹遮禽獸物\n始皇欲大苑囿　優旃諫曰善多縱禽獸於中寇從東方來令麋鹿觸之始皇乃止\n武帝廣開上林　東南至宜春鼎湖御宿也\n築土爲囿植木爲苑　亦曰養獸爲囿草木爲苑\n帝王之盛豫遊其中地埒皇居　陪分本作\n棲臺先曙　鶯花早春\n漢修靈囿楊雄諫而不聽\n般遊有禮　好樂無荒\n人且放於鉶莠　魚則安於蘋藻\n梁孝之靡　魚共之會\n棲龍之岫　落猿之巖\n鴈池兔園鶴洲鳧渚　並孝王苑所有\n苑戲九尾之禽　三足之烏\n高望漢平　並苑名\n桑梓苑　在洛陽\n桂林苑　在建康縣北\n雙觡共骶之獸五色九包之禽　皆苑有之\n鴻德苑　桓帝延熹元年置"},{"id":"juan11-025","source":"正文","juan":"卷第十一","menu":"登遐第二十五","sub_menu":null,"page":"九八","leaf":"十四ウ","text":"天子曰崩　禮\n告喪曰天王登遐　言若仙去\n憂天崩　杞國人有憂天崩\n宮車晏駕\n晏車　柳鼎晏時也\n鼎駕\n遺世貽法　儀先王遺世猶貽之法又云古之王者知命之不長是以並建聖哲著之話言告之\n國與而復即會以遺後嗣\n天祿永終\n天奪九齡　文王\n三后在天　言登遐而精神歸天\n兆人孺慕萬國縞素\n二十有八載帝乃殂落百姓如喪考妣　舜典\n三載四海遏密八音　遏絕也密靜也四夷絕樂三年\n顧命　周成王將崩作顧命臨終之命曰顧命\n遺詔　漢文臨崩作遺詔令薄葬制三十六日之服\n高宗諒陰三年\n君薨百官總己以聽於冢宰\n天子寢於諒闇八音遏於四濮　並西征賦\n叩心　絕地\n行號巷哭　並劉琨表\n七日而殯　七月而葬\n○山陵　附登遐門\n天子七月而葬\n同軌畢至　傳\n橋山之葬弓劒　黃帝葬於橋山南空棺無尸唯劒舄在\n天崩而百憂杞國\n龍去而哭軒臣　黃帝於荊山下鑄鼎成乘龍上天小臣挽持龍髯髯墮宮下抱弓而號之也\n畏威靈而不敢西向　山海曰帝鼎山際有軒轅丘射者而不敢西向畏黃帝之威靈也\n遵七月之禮　左氏\n百年之神　大戴禮孔子曰黃帝死後人畏其神百年\n盜長陵一抔土　漢張釋曰假有人盜長陵抔土陛下將以加罰焉\n堯葬穀林　見帝王紀\n舜葬蒼梧　見禮檀見後西都\n容衛\n靈輿歸聖魂於東岱山引靈駕於西陵　魏武帝\n陵廟拜陵　晉王導亮弘自漢魏已來羣臣不拜山陵導以元帝睠同布衣匪唯君臣而已每崇進皆就拜不勝哀感由是詔百官拜陵自導始也\n銅雀臺　魏武遺令起銅雀臺　　人作樂於西陵而望之\n○國忌日　附登遐門\n登遐之日　遷世之辰\n如喪之情　如喪考妣\n三載四海遏密八音　遏密樂四夷也\n明標邦式　祠部式國忌日云云\n攀龍髯之日\n天忌忌日不樂"},{"id":"juan11-026","source":"正文","juan":"卷第十一","menu":"君臣第二十六","sub_menu":null,"page":"一〇〇","leaf":"十五ウ","text":"有君臣然後禮義有所措　易\n諸臣之位君天也天可逃乎　子文尹克黃云\n天子無客禮莫敢為主焉君適其臣升自阼階不敢有其室也　禮\n忠臣不絜名事君不避難有罪不逃刑　禮記\n養人如子　君道也\n仰之如日月　臣之奉君\n知臣莫若於君\n君盤人水　孫卿子\n近臣　漢嚴助為太中大夫後得朱買臣吾丘壽王主父偃徐樂嚴安枚皐終軍並在左右助等與大臣辯論中外相應以義理之文大臣數詘司馬相如數稱疾避事枚皐東方朔不根持論上頗俳優畜之唯助與壽王見任而助最先進也"},{"id":"juan11-027","source":"正文","juan":"卷第十一","menu":"社稷臣第二十七","sub_menu":null,"page":"一〇〇","leaf":"十五ウ","text":"能執干戈以衛社稷　童汪錡\n柳莊　衛侯哭柳莊曰非寡人之臣是社稷之臣也\n目送絳侯　漢文目送絳侯周勃曰社稷臣也袁盎曰勃乃功臣非社稷臣社稷臣主存與存主亡與亡乃社稷臣也方諸呂用事絳侯為太尉本兵柄不能正與其誅諸呂適會成功乃功臣耳\n汲黯　上問汲黯何如人嚴助曰使任職居官無以踰人至輔少主守城深堅雖自謂賁育不能奪上曰然古有社稷臣黯其近之\n柱石　漢昌邑王淫亂霍光憂懣問所知故吏田延年曰將軍為柱石昔伊尹相殷廢太甲以安宗廟後世稱忠將軍若能行亦漢之伊尹也\n處不避汙　叔孫豹"},{"id":"juan11-028","source":"正文","juan":"卷第十一","menu":"君臣相信第二十八","sub_menu":null,"page":"一〇〇","leaf":"十五ウ","text":"食以駃騠　人譖蘇秦於燕王燕王按劒怒譖者而食蘇秦以駃騠駃騠良馬肉也\n蜀趙雲　雲別傳曰初先主敗人言雲已北去先主以戟擲之曰子龍不棄我去頃之雲至矣\n呈文書　魏卓為章訴述徐宣毀短事主者呈文書詔曰吾省與僕射省何異竟不復宣為僕射\n魯肅　吳張昭非肅謙下皆毀之權益重之\n孝昭委任霍光　漢紀曰成王疑周公孝昭委任霍光俱至治平\n大臣見疑　晉石苞為大司馬加侍中鎮淮南聞吳欲寇壽春遣子以自固帝謂羊祜曰苞果有不順乎祜深明之其二孫皆上召之敬自不至帝疑既明之見其事先策免之苞詣闕謝帝慙因\n補曰朔子　　　門"},{"id":"juan11-029","source":"正文","juan":"卷第十一","menu":"念良臣第二十九","sub_menu":null,"page":"一〇一","leaf":"十六オ","text":"漢宣賜右扶風尹翁歸子黃金百斤奉祭祀　大司農朱邑子亦然也\n祭征虜　後漢祭遵為征虜將軍卒世祖每曰安得憂國奉公如祭征虜者乎\n聞鼓鼙之聲則思將帥之臣　禮\n名將　後漢賈復分戰傷創甚世祖聞之曰吾所以不遣君聞專征者以其敢深入果失吾名將聞其婦孕生女耶我子娶之生男耶我女妻之不令其憂妻子也"},{"id":"juan11-030","source":"正文","juan":"卷第十一","menu":"君臣問疾第三十","sub_menu":null,"page":"一〇一","leaf":"十六オ","text":"蕭何疾　惠帝自問曰君若不幸誰可代君何舉曹參\n霍光病　車駕親臨問之\n張禹　每疾輒以起居聞車駕自臨問上親拜牀下禹頓首謝恩因於牀前拜少子官禹曰臣有一女愛甚於男遠嫁張掖太守蕭咸不勝父子私恩願與相近即徙咸為弘農太守\n張湯　嘗病上親至舍視病隆貴如此\n包咸　為大鴻臚以論語受帝後病親輦駕視之\n桓榮　為帝師後病帝親問之門下車執經撫拜修弟子禮也\n吳呂蒙疾　孫權在公安迎置內殿治護萬方募有能愈蒙者賜千金加鍼權為慘戚欲數見顏色又恐勞動常穿壁瞻之見小能食則喜顧左右言笑不則咄嗟夜不能寐中瘳為下赦令也\n疾君視之東首加朝服拖紳　論語\n君適其臣升自阼階不敢有其室也　禮\n卿大夫疾君三問之士疾一問之在殯一往焉　禮"},{"id":"juan11-031","source":"正文","juan":"卷第十一","menu":"舊君第三十一","sub_menu":null,"page":"一〇一","leaf":"十六オ","text":"反服　禮哀公問曰為舊君反服禮與孔子曰古之君子進人以禮退人以禮故有舊君反服之禮今之君子進人若將加膝退人若將墜之泉下為戎首不亦善乎又何反服之有也\n陳軫秦聲　史陳軫至秦秦惠王曰子去寡人之楚思寡人乎曰昔越人莊舄仕楚執圭及病則作越聲今臣棄逐之楚能無秦聲乎\n晉孫惠諫齊王曰　屈原被斥心存南郢樂毅逃趙志在北燕也\n違諸侯之大夫不反服　為卑不敢服前之尊君也\n違大夫之諸侯不反服也　禮"},{"id":"juan11-032","source":"正文","juan":"卷第十一","menu":"制詔第三十二","sub_menu":null,"page":"一〇二","leaf":"十六ウ","text":"君命　王言\n王言如絲其出如綸　禮\n天書　詔書\n鳳詔　丹鳳詔五色詔\n紫泥　封璽書\n急宣王命\n天語宣布　漢黃霸字次公為潁川守時上垂意於理數下恩澤詔書霸宣布令人人知上意也\n寬大之詔　後漢侯霸為尚書令下寬大之詔四時之令霸所建\n后以施令告四方　易\n發號施令罔有不臧布德和令　禮記\n尺一　後漢司隸校尉陽球為太尉轉尚書令不拜不得稽留尺一詔書\n詐為尺一詔書　魏志\n青紙紫泥　晉書\n視草　漢報淮南王書帝常召司馬相如視草\n渙汗其大號"},{"id":"juan11-033","source":"正文","juan":"卷第十一","menu":"表奏第三十三","sub_menu":null,"page":"一〇二","leaf":"十六ウ","text":"上聞　上言上陳\n白奏\n青蒲　伏青蒲奏事\n起草字誤　漢石建為郎中令奏事事下建讀之驚曰馬與尾五今乃四不足一獲譴死也\n章奏　漢陳湯字子公嘗受人金錢作章奏事以此敗\n削藁　漢孔光時有所言輒起削草藁\n持被覆之　後漢　豹字仲文為尚書郎中勤不懈每奏事孝靜宿伏省閣或從昏至明肅宗聞而嘉之使黃門持被覆豹勑令勿驚之\n削草本　後漢樊宏字靡卿所上便宜及得失輒手自書寫毀削草本也\n毀草　後漢皇甫嵩字義真前後上表陳諫有補益者五百餘事皆手書毀草不宣於外\n焚草　魏志荀彧字文若以書陳事　　　其草故青策密諫不得盡聞也\n又　魏志陳羣字長文前得失每上封事輒削其草時人及子弟莫能知也\n又　晉羊祜字叔子嘉謀讜議皆焚其草故世莫得聞之\n私竊其草　漢師丹字仲公議改幣丹使吏書奏吏私竊其草丁傅聞之告丹上封事行道持其書遂策免丹\n漢汲黯字長孺　奏事上時嘗武帳不冠見黯起避使人可其奏其見敬禮如此\n敗章　吳志太史慈字子義仕郡曹吏與州有隙曲直未分以先聞者為善時州章已去郡守恐後之求可使者慈年二十一以選行晨夜取道到洛陽詣公車門州吏始來慈謂曰章題得無誤乎取視之慈因以刀截敗之州吏大呼曰敗我章慈將至車間與語曰向君不以章相與吾亦無因得敗之是為吉凶禍福等耳吾不獨受罪豈若默然俱去可以存易亡吏又以　去\n慈與出城因遁還通州遂受其短\n周禮宰夫以諸臣之復萬人之逆　復反逆受王命復謂朝廷奏事自上而下逆謂上書也御僕吏之逆萬人之復\n條對急變聞　急事\n去副封　魏相奏去副封以防壅蔽副封謂副本也以所上事一本與尚書謂之副封\n壅於上聞\n程奏巧為奏自決露章疏舉　晉\n草章草奏\n不及奏　蕭何守關中事有不及奏即以便宜施行之也\n太守請自奏事　漢京房出為太山太守奏請毋屬刺史得自乘傳奏事上初許之房以論石顯五鹿充宗權而上封事曰辛巳蒙氣復乘卦太陽侵己卯庚辰間必有隔絕臣不能乘傳奏事也\n聽之忘倦　馬援善述奏事上聽之而忘倦也\n露章　漢何武君公奏揚州刺史所舉奏二千石必先露章服罪者為虧除免之不伏者極法奏之\n矜伐　郤詵對晉武帝曰臣舉賢良對策第一猶桂林一枝崑山片玉侍中奏免詵官帝曰吾與戲耳\n為定奏草　丞相玄成言朱雲暴虐雲上疏自訟陳咸為定奏草\n議所奏事　趙充國　　奏事上輒下其奏議臣初是充國計者什三中十五最後十八"},{"id":"juan11-034","source":"正文","juan":"卷第十一","menu":"對見第三十四","sub_menu":null,"page":"一〇三","leaf":"十七オ","text":"晝日三接　易\n揚于王庭書思對命　禮記玉藻\n對揚天子休命\n造辟而言　辟君也\n詭辭而出　穀梁言士\n造膝　諫事\n不可書傳　史記\n天威不違顏咫尺　傳\n龍顏\n君召謂上為君　漢夏侯勝質朴守正簡易無威儀見時謂上為君誤相字於上前上以是親信之也\n衣褐見　漢虞將軍欲與婁敬鮮衣敬曰衣帛衣帛見衣褐衣褐見\n延問進讀羣書　班斿奏上前\n約背　漢公孫弘嘗與公卿議至上前更背之汲黯曰齊人多詐始與臣等議今而背之\n忘食　張湯每朝奏事天子日旰忘食丞相充位而已事皆決於湯也\n廷詰　汲黯廷詰公孫弘曰齊人多詐\n敷奏以言　書\n有度　漢霍光子孟每出入下殿進止有常度\n長者之言　後漢詔問　劉昆曰前在江陵\n反風滅火後守弘農虎渡河行何德政而致此昆曰偶然耳左右笑其質訥帝歎曰乃長者之言\n應詰　魏蘇則為隴西太守以功封侯引上殿不習朝儀被詔登不知儀式帝令侍中贊引呼隴西太守前是當言唯不覺大應諾帝笑勞勉之\n有疾　魏志鍾繇元常有膝疾拜起不得時華歆亦以高年疾病朝見皆使載輿車虎賁輿上殿就坐自是三公有疾以為故事也\n醉睡　後漢劉寬文饒每引見帝令寬講經寬嘗於坐被酒睡伏帝問太尉醉耶寬對曰臣不敢醉但任大責重憂心如醉也\n醉面折　後漢馬武字子張為人嗜酒闊達敢言時醉在御前面折同列言其長短帝故縱之以為樂也\n盤辟雅拜　漢何武舉方正召見盤辟雅拜有司劾以舉\n洩　夏侯勝嘗見出道上語人聞褒勝勝曰陛下所言善臣故揚之堯言布於天下至今見誦臣以為可傳故傳之也\n堯言　見上"},{"id":"juan11-035","source":"正文","juan":"卷第十一","menu":"對問第三十五","sub_menu":null,"page":"一〇四","leaf":"十七ウ","text":"下問　上陳\n清問\n不希旨苟合　漢孔光子夏習漢制上有所問據經而對不希旨苟合或不從不彊爭時有所言輒削草藁矣\n據經以對　蜀志譙周允南辭不預事以儒行見禮待訪大義輒據經以對\n諮訪　吳志闞澤字德潤每朝廷大議經典所疑輒諮訪之"},{"id":"juan11-036","source":"正文","juan":"卷第十一","menu":"諫諍第三十六","sub_menu":null,"page":"一〇四","leaf":"十七ウ","text":"開諫諍之道　開忠讜之門\n補察　自卿大夫已下皆有父兄子弟以補察其過\n獻可替否　治傾去惑\n有諫而無訕　為人臣者\n諫而無驕\n唯木從繩則正后從諫則聖\n張良曰忠言逆耳利於行良藥苦口利於病\n士季三進及霤　傳\n袞職有闕惟仲山甫補之　詩\n夙夜在公　日月獻納\n出入諷諫　朝夕論思\n上下通情\n辭親策名則將身許\n危君陷惡　何以臣為\n匡救　其惡\n弼違　舜曰予違汝弼汝無面從\n工執藝事以諫\n朝夕納諫以輔台德　台我也\n況當不諱之朝　宜勵分獻之節\n讜言嘉謀匡其不\n及\n命百官箴王闕\n過則臣之失則革之　傳\n史為書　書其得失\n瞽為詩　詩以諷刺\n工誦箴諫　工樂人也誦箴諫之辭\n大夫規誨　規正也誨諫也\n士傳言　士卑不得徑達聞君過失傳告大夫\n庶人謗\n百工獻藝　並左傳\n補闕　正違\n君違不忘諫之以德　臧哀伯\n諍臣七人　天子\n進思盡忠　退思補過\n事君以忠\n遂事不諫\n為臣不易\n一言興邦　三進及霤\n量而後入　禮事君者量而後入不入而後量故上無怨而下遠罪也謂量其事意可不而後諫\n嘉言罔攸伏書\n司諫　掌糾萬人之德勸友之道\n保氏　掌諫王惡養國子以道也\n尸諫　史鰌死遺令殯於階下靈公來弔問之其子曰父云生不能退彌子瑕進蘧伯玉今殯於此公乃對殯退彌子瑕進蘧伯玉遂改殯焉\n三諫不聽則去\n驟諫\n請留將　晉師為楚敗荀桓子請死晉侯許之士貞子諫曰不可林父社稷之臣也夫其敗如日月之食何損於明三日晉侯乃使復其位傳\n○直諫　附諫諍門\n是以伏死而諫\n藥石之言\n子曰事君勿欺而犯之　犯顏諫也\n有犯無隱　可犯顏諫也無隱謂論政得失也\n面折庭諍　陳平謂王陵曰面折庭諍我不如君安劉氏宗廟君不如我\n廣德之上樓船　漢薛廣德為御史大夫直言極諫上欲御樓船廣德頓首諫上惡廣德又曰乘船危就橋安上乃從橋也\n朱雲之折殿檻　朱雲請上方斬馬劒斬佞臣張禹上怒令將雲下斬之雲攀檻折後欲理檻上曰勿理以旌直臣也\n張良逆耳之忠　見諫諍門\n杜欽拂心之直\n佩刀斷車鞅　建武八年車駕西征郭憲諫不從乃援佩刀斷車鞅光武不從顧用兵起乃迴駕帝曰恨不用郭憲言\n破家為國　魏志衛覬上疏曰非破家為國殺身成君者誰能犯顏色觸忌諱一言聞一說也\n犯顏逆\n意指諫將表效於公忠　豈敢辭於戮辱\n然則智在圖危直惟惡訐盡忠守死　誠爾殺身之仁\n非罪陷刑　是重納君之惡\n然則直能寤主仁有殺身盡忠無他　工將身許\n愛死不諫　何以臣為\n寧違忤以遷善　豈順從而履危\n極言直道　辛毗引裾魏辛毗字佐治文帝欲徙冀州士人十萬戶實河南毗諫帝怒不荅起入毗隨而引其裾帝奮衣久乃出曰佐治卿持我何太急耶毗曰今徙既失人心又無以食也帝遂徙其半\n明主不惡切諫以博觀忠臣不避重誅以直諫　漢書\n衆人之唯唯不如一士之諤諤\n楚辭云寧正言不諱以危身乎　卜居\n然則忠不陷君亂無立辟　殷人守死雖曰比干之賢魯史正名終書從治之罪\n獲罪於天\n邦有道危行危言　也危厲\n在於交友猶忠告而導之　劉伊君臣實惡訐為直者\n為人臣者殺其身有益於君則為之　禮\n既非言遜之朝　訐有身危之虞\n實賴有位之士　臣其不及\n繩愆糾謬　革其非心\n頭軔乘輿　後漢申徒剛諫帝出遊不從以頭軔乘輿乃止\n以言取罪\n諫臺鐘　景公為臺臺成又欲為鐘晏子曰飾築臺又斂民為鐘民必哀斂哀為樂非君民也\n諫畋　景公畋十二日不反晏子曰嬰願有復也遂止之君安野不安國好獸而惡人乃不可乎於是罷畋即歸也\n諫愛槐　齊景公有愛槐令使守曰犯者刑傷者死晏子諫曰君享國德未及於衆而刑辟加死國恐不可以莅國安民也遂罷守也\n呂氏春秋曰　衛靈公卒寒鑿池宛春曰天寒起役恐人傷公曰天寒乎哉春曰公衣狐裘坐熊席是以不寒民衣敝衣不補是以寒也\n楚莊王士以宋子重諫曰　今君厨肉臭而樽酒敗三軍餧\n有饑色以勝敵不亦難乎\n衛靈公坐重華之臺侍御數百隨珠照日羅衣從風　孫叔敖曰昔紂行此而亡今四境內侵諸侯加兵土地日削百姓乖離君內寵無乃甚乎"},{"id":"juan11-037","source":"正文","juan":"卷第十一","menu":"諫諍第三十六","sub_menu":"（續）","page":"一〇七","leaf":"十九オ","text":"史高祖欲以趙王易太子　叔孫通曰太子仁孝天下皆聞之呂后陛下攻苦食啗其可背哉必欲廢嫡立庶臣願先伏誅以頸血污地帝曰吾直戲爾通曰太子天下之根本根本一搖而天下振動奈何以天下為戲之\n漢書上幸甘泉因留射獵　薛廣德諫曰關東困極民流陛下日撞亡秦之鐘聽鄭衛之樂臣誠悼之今士卒暴露從官勞倦陛下亟反宮與百姓同憂樂天下幸甚\n漢郅都景帝時為中郎敢直言面折大臣於朝堂　從入上林賈姬在廁野彘入廁上遣郅都郅都不行上欲自持兵救郅都伏上前曰一姬死復一姬進天下所有寧賈姬乎雖陛下自輕奈宗廟何太后何上還彘亦不傷姬太后聞之大喜賜百斤金上賜百斤\n說苑楚莊王築層臺延壤百里　諫者七十二人有諸御己入諫曰昔虞不用宮之奇而晉并之曹不用僖負羈而宋并也吳不用子胥而越并之昔桀殺關龍逢而湯得之紂殺比干文王得之趨出遽追之曰吾用子之諫先諫者不足動寡人之心至死出今曰能入諫者吾以為兄弟也\n漢武故事曰汲黯諫曰　陛下愛才樂才求之無倦比得勞心苦神而盡其用輒以殺之以有限之士資無已之誅陛下欲何治乎\n謝承後漢書曰陳蕃諫桓帝曰　當今之世三空田野空朝庭空倉庫空兵戎戰四方離散是陛下憔悴毀顏坐而待旦之時也\n說苑晉靈公造九層之臺費用千億令諫者死　荀息曰臣能累十二博棊加九雞子於上公曰危哉息曰復有危於此者九層之臺三年不成男不得耕女不得織國用空虛戶口減少社稷一滅君何望之\n○諷諫　附諫諍門\n主文而譎諫言之者無罪聞之者足以自誡\n陳古以刺今\n出入諷諫為人\n臣之禮不顯諫　注謂明言君惡不襃微也\n子曰事君欲諫不欲陳　注陳言其過於外\n或以抒下情而通諷諭\n孔子曰諫有五吾從諷諫\n臨食興歎　閻沒言小人之心\n飲酒流涕　晏子為六臺之役\n諷者言非面折事不指陳或義引古今情見辭賦庶為寤主有以興箴規　補察\n邦無道則危行言遜　遜順也\n君心有寤　冀釋善而從之\n臣節貴忠　終惡訐為直者\n忠而謀國　既三思而後行\n敏以寤君　亦一言以為智\n下以風刺上\n舍肉　潁考叔食舍肉欲以發問\n說苑曰趙簡子舉兵伐齊　有被甲士身議笑簡子曰子何笑對曰臣有宿當桑之時臣鄰父與妻俱之田見桑中女因追之不能還其妻怒而去臣笑逐其曠也簡子曰伐國是吾曠也遂還師歸也\n又吳王欲伐荆少孺子欲諫不敢　乃懷丸操彈於後園露沾衣王曰何露沾衣如此曰園上有蟬高居而鳴不知螳螂委身向前捕蟬蟬不知黃雀引頸欲啄黃雀又不知彈在其後皆務前不顧復患王乃罷兵也\n蜀志曰　大旱禁釀吏於人家索得釀具欲令與作酒同罪簡雍從先主遊見一男子行道曰彼人欲行淫何不縛先主曰卿何知曰彼有淫具與釀者同先主大笑而原之\n新序曰　趙簡子上羊坂群臣皆偏袒推車而虎會擔戟行歌不推車簡子曰寡人上坂推車會獨行歌為臣侮主其罪何若曰侮主死又為身死妻子為戮亦問君侮臣者簡子曰何為曰賢者不為謀辯者不為使勇者不為鬭三者不使則國難保矣簡子乃罷推車也\n又魏文侯與大夫坐問寡人何如　羣臣皆曰仁君次問翟璜曰君非仁君何以言之曰君伐中山不以封君弟而封君子文侯大怒翟璜任座曰君仁君也曰子何以言之曰臣聞君仁臣直向翟璜之言直是以知文侯曰善復召翟璜也\n孔叢子曰陳惠侯起陵陽臺未然　死為十人又執三監吏將殺之孔子\n適陳聞之曰見陳侯與登臺觀焉美哉斯臺未有不戮一人而致功如此陳侯默然乃赦執吏\n國語齊景公愛馬暴死公怒欲刃解養馬者　晏子曰請數之曰爾罪有三也公使爾養馬爾殺公之愛馬汝罪一也使公以一馬之故殺人為百姓怨爾罪二也使諸侯聞輕吾國汝罪三也公赦之\n○彊諫　附諫諍門\n鬻拳彊諫楚子楚子不從臨之以兵懼而從之鬻拳曰吾懼君以兵罪莫大焉遂自刖也君子曰鬻拳可謂愛君矣諫以自納於刑刑猶不忘納君於善　言愛君非臣法但美其忠愛也\n思紓國之難　誠則盡忠\n奮震主之威　如何無罪\n居常不能寤主　臨難徒欲愛君\n晉侯之召周王　猶不可以訓\n鬻拳之懼楚子　宜自納于刑\n獲罪於天\n○密諫　附諫諍門\n造辟詭辭　穀梁陽處父曰古者造辟而言詭辭而出出不以實告人"},{"id":"juan11-038","source":"正文","juan":"卷第十一","menu":"諫諍第三十六","sub_menu":"（續）","page":"一〇九","leaf":"二十オ","text":"削藁　藁草本也魏陳群前後數諫得失每上封輒削藁人多譏其恭默後乃知\n臣不密則失身　易\n啓乃心沃朕心　書\n揚君之善　夏侯勝入見出與人語人告不密上讓之對曰君言善臣故揚之也\n伏青蒲　史丹\n密勿\n○匡諫　附諫諍門\n袞職有闕惟仲山甫補之　詩\n沔水規宣王也　詩篇名\n官箴王闕道臣盡規\n張湛白馬生　後漢張湛數諫正常乘白馬上每有異政輒曰白馬生且復諫也\n尚書履聲　漢鄭崇數諫哀帝帝每識鄭尚書履聲\n實賴有位之士　臣其不及\n彌縫其闕　臣救其災\n匡救其惡　臣輔臣益\n補察其政\n大夫規誨　傳\n醉殺　吳志孫權為王置宴之末自起行酒虞翻伏地佯醉不持權去翻起坐權\n怒手劍欲擊之侍坐皆惶懼劉基抱權諫曰大王以三爵後殺善士雖有罪天下孰知之大王以能容賢故海內望風一朝棄之可乎\n汝為君耳將司聰也磨礪以須王出吾刃將斬之　子革諫楚靈王\n諫安樂　史沛公入秦宮室帷帳狗馬婦女數千意欲留居之張良曰秦為無道沛公故得至此為天下除殘賊宜縞素為資今始入秦即安其樂此乃助桀為虐且忠言逆耳利於行良藥苦口利於病者矣\n○納諫　附諫諍門\n建善旌立諫鼓\n從諫如流　漢高祖\n晏子一言而齊侯省刑　屨賤踊貴之言\n諫而無驕　賢聞諫人君其臣恃以驕之也\n能無從乎改之為貴\n一日三諫　晏子常一日三諫景公及卒公泣曰昔夫子一日三責我今孰責寡人\n子大王有五失　晉書齊王冏輔政憍矜多過鄭方諫曰大王有五失冏曰孤不能以致五闕若無子則終不聞孤之過也\n漢成帝贊曰容納直言\n堯設誹謗之木\n舜懸招諫之鼓\n出令懸賞　齊威王出令曰能面刺寡人過者受上賞上書諫者受中賞謗議於市朝聞於寡人之耳者受下賞於是齊大治也\n從諫不咈　咈戾也\n有言逆于汝心必求諸道\n稽于衆舍己從人\n詢茲黃髮\n詢于芻蕘\n高祖納善如轉規　漢\n爾心或開予　禮\n虛受　易\n虛己問政\n白獸樽　晉書曰設獸樽於庭樽蓋上施白獸若有能獻直言者則發此樽飲酒案禮白獸樽乃杜舉之遺誡\n晏子曰合升斗之穀以滿倉廩太山之高非一石也累卑然後高也夫治天下者非用一士之言也　說苑\n○拒諫　附諫諍門\n違宮之奇之言　虞不臘矣\n拒伍子胥之諫　吳為沼乎\n隨會諫三進及霤而後視之\n曰吾知過矣　晉靈公拒諫之辭也\n愎諫\n比干諫而死　紂殺之\n周公曰不使大臣怨乎不以　以用也\n禮曰為人臣三諫不聽則逃之　君臣有義則合無義則離\n諫者則刑　莫敢致\n秦違蹇叔之言而師敗　陳後滅之諫而國亡\n不從逆耳之言　終致噬臍之患\n顧子曰不諫則危君諫則危身故君子上不敢危君下不敢危身三諫不從則去矣\n朱雲從比干遊　朱雲直言帝令斬之雲攀檻曰臣得下從關龍逢比干遊足矣\n誦言如醉　典聞弼之言則若醉言不好也\n桀殺關龍逢紂剖王子比干陳殺泄冶吳誅伍員\n忠諫者謂之誹謗深計者謂之妖言　漢書言胡亥\n逆忠直遠耆德比頑童　時謂亂風\n忠讜杜口　詩曰諫\n如或患難匡救\n禮許逃亡\n泄冶死之魯史書罪　微子書矣宜以勝仁\n以道事君　不可則止\n事君道合則服從不可則去　禮\n以言取罪\n●謗諫　附諫諍門\n為人臣者有諫而無訕\n為人臣之禮不顯諫　注謂明言君過不襃微也\n堯設誹謗之木\n齊威出令　事見納諫門\n子曰天下有道則庶人不議\n庶人謗\n下以諷刺上　傳\n詢于芻蕘　採其歌詠\n無或敢伏小人之攸箴　箴規也書\n每歲孟春遒人以木鐸徇于路　採歌謠也\n君子惡居下流而訕上者\n相彼君子\n猶惡揚人之惡\n劉伊忠臣　豈宜揚主之過\n有亡而無疾　諫不從則亡去無疾惡也\n君子信而後諫其君未信則以為謗己也\n監謗弭謗　周厲王虐國人謗王王使衛巫監謗以告者則殺之道路以目王謂召公曰吾能弭謗者\n防人之口甚於防川　召公曰\n為人臣者　寡人使言\n○不諫　附諫諍門\n生則縱其欲　君子謂　　　　於是不臣君生則縱其欲死又益其侈是棄君於惡何臣之為\n君民曰不能匡危不能救\n秦醫和謂趙孟云　國之大臣榮其寵祿有災禍興而無改焉必受其咎今君淫以生疾主不能禦天命不祐\n可謂具臣\n孔子曰事君遠而諫則諂也近而不諫則尸利也\n邦無道危行言遜　遜順也\n不諫則危君　注見上\n事上以忠　則宜身許\n陷君於惡　何用臣為\n寧違忤以納善　豈順從而忘危"},{"id":"juan11-039","source":"正文","juan":"卷第十一","menu":"諫諍第三十六","sub_menu":"（續）","page":"一一二","leaf":"二十一ウ","text":"衆臣不盡情而上無由聞過　漢書\n汲黯曰天子置公卿輔弼之臣寧令從諛承意陷主於不義乎\n汝無面從\n伊訓曰臣下不匡其刑墨　注臣不正君服墨刑也\n苟賴其榮　是為尸利\n不匡其失　宜及墨刑\n陳忠讜之言　猶聞有賞\n廢獻替之義　安得無辜\n君子立誠　猶不成人之惡\n忠臣勵節　豈可從君之昏\n遂事不諫\n予違汝弼　子不我思\n●賞諫　附諫諍門\n臣苟直言　君宜是賞\n不匡其上　尚或有刑\n能盡其忠　豈宜無賞\n齊威出令　事具納諫門\n臣道貴忠　國章貴賞\n賞勸　魏太祖破烏桓還問前諫不令行者衆皆懼公皆厚\n賞之曰孤乘危僥倖雖勝天佑也不可爲常諸君前諫萬安之計故相賞後之勿難言者也\n請賞秩　　梅福上書諫成帝曰天下之士民有上書諫可採取者秩以升之祿賜以束帛此則士發憤懣吐忠言謀日聞於上國之條貫表裏粲然可觀\n●諫父母　附諫諍門\n子曰事父母幾諫見志不從又敬不違勞而不怨\n子孝而箴\n子之事親三諫不聽則號泣而隨之\n下氣怡色　內則曰父母有過下氣怡色柔聲以諫諫若不入起敬起孝悅則復諫起更也\n入事父兄家肥子悅\n父頑母嚚家壞\n父慈子道\n自王巳下各有父兄子弟以補察其過　傳\n事親有隱而無犯　注有隱不稱揚過失無犯不犯顏諫諍也\n天性　人彝\n曾子曰君子之所謂孝者先意承志諭父母於道參直養者也安能爲孝乎\n子曰君子弛其親之過　弛過也\n子云從命不忿微諫不倦勞而無怨可謂孝乎\n生事之以禮曰無違\n舜父頑母嚚克諧以孝蒸蒸乂不格姦　言能諧和之以孝使進善自治不至於惡\n瞽亦允若　信能順於善也\n孜孜　蒸蒸\n父有爭子則身不陷於不義\n故子不可以不爭於父從父之令又焉得爲孝乎　孝經\n孝在色難　諫宜言遜\n逆耳之言　因心之孝\n父父子子在於交遊　尚不成人之惡\n矧伊子道　豈宜陷父於非禮\n曰子諫父母不悅與其得罪於鄉黨州閭寧孰諫　言使父母得罪寧不悅而孰諫孰\n也\n愛親　陷父\n直而事主　則高面折之忠\n孝乃安親　宜盡色難之養\n雖色難之養　所貴安親\n而從其違　得非陷父\n父母有過　諫而不逆\n父母惡之　懼而無怨\n吳祐諫寫書　後漢吳祐字季英父恢爲南陽太守祐年十二恢欲殺青簡寫經書祐諫曰南方多珍怪上爲國家所疑下爲權戚所望若書成載之兼兩昔馬援以薏苡興謗王陽以衣囊徼名恢撫手曰吳氏不乏季子乎\n●諫朋友　附諫諍門\n子寧以他規我敢以此規過\n贈言敢不盡心　吾嘗\n官師規我　言官衆互相規闕夏書\n士有諍友則身不離於令名\n相勸以義　相勉以正\n成人之美　君子\n忠告善導　忠告而善導之不可則止\n君子以友輔仁　有切磋之道所以輔成仁\n朋友切切偲偲　相切責之皃也\n孜孜勸善\n不可與言而與之言失言智者不失人亦不失言\n益者三友　友直友諒友多聞\n儒有聞善以相告\n莊子曰　四人相視莫逆其心遂相爲友\n成我者鮑叔\n芝蘭之契　同心　　之言\n膠漆之義　藥石之規\n刎頸之義\n須深　逆耳之言不入\n善而相告　是爲知己之規\n過也不言　無乃成人之惡\n箴言\n白氏六帖事類集卷第十一"},{"id":"toc-juan12","source":"卷十二總目","juan":"卷第十二","menu":"卷第十二總目","sub_menu":null,"page":"一一五","leaf":"二十三オ","text":"白氏六帖事類集卷第十二　本卷總目（共 77 門）\n政理第一\n國政第二\n良吏善政三\n寬不按吏四　寬政附\n清廉五\n貪濁六\n公政七\n吏久從政八\n安人得人心九\n遺愛十　生祠配社\n教化十一\n禁俗忌十二　禁令\n不拾遺十三\n不求備十四\n推美下吏十五　委下吏\n敝政十六\n譎政十七\n政不一十八\n暴政十九　酷政\n威名二十　明察豪皆\n令典法二十一\n沿革二十二\n易官易吏二十三\n省官二十四\n勤官二十五\n守官二十六\n曠官二十七\n棄官二十八\n拜官二十九\n辭官三十\n換官三十一　擇官不擇官\n屬吏三十二\n同官三十三\n故吏三十四\n攝官三十五\n侵官三十六\n離局三十七\n濫官三十八\n賣官爵三十九\n詐稱官四十\n巧官四十一\n胥吏四十二\n申牒文書四十三　簿書文案附\n才稱職四十四\n才過職四十五\n才不稱職四十六\n慎擇四十七\n未能爲政四十八\n俸祿四十九\n世祿五十\n祿不兼利五十一\n寬猛相濟五十二\n替代五十三\n官闕急五十四\n休假五十五\n舉薦五十六　不薦士\n舉選五十七　清儉\n知人五十八\n藻鑒五十九　商榷附\n失所舉六十\n坐舉主六十一　至公附\n讓舉六十二\n舉親六十三\n自舉六十四\n舉舊六十五\n舉讎六十六\n舉賤六十七\n蔽賢六十八\n賞舉賢六十九\n考試七十\n得賢七十一\n棄賢七十二　廢黜\n名譽七十三\n辟召七十四\n待士七十五\n考課七十六\n要會七十七"},{"id":"juan12-000","source":"正文","juan":"卷第十二","menu":"政理第一","sub_menu":null,"page":"一一六","leaf":"二十三ウ","text":"政如農功　日夜思之如農之有畔其過鮮矣傳\n政者正也　子帥以正孰敢不正\n寬猛相濟政是以和\n子曰人道政爲大\n酌人言　酌人言以爲政\n人存政舉　子曰其人存則其政舉其人亡則其政息\n庶績咸熙　熙和也\n彝倫攸敘\n允釐百工　釐治也\n德惟善政　政在養民\n可以觀政\n政清　吏事簡人安\n爲政在人　禮\n施於有政是亦爲政　以道化人而人善矣\n必聞其政\n報政莽鹵　莊子曰爲政勿莽鹵\n滋彰　老子曰法令滋彰盜賊多有\n人道敏政\n容人畜衆\n稱物平施\n振民育德\n臨下以簡\n能安人則惠\n除其邪虐\n康濟小民\n弗剛弗柔　厥德允修\n茹柔吐剛\n觀政淑忒　旌別淑忒\n廉善廉能　周禮弊群吏之治一曰廉善二曰廉能注皆以廉爲本\n宰夫徵百官之令　徵召所爲\n脩法糾職\n求民之瘼　瘼病也\n不躬不親\n權衡誠懸不可欺以輕重　繩墨誠陳不可欺以曲直規矩誠設不可欺以方圓君子審禮不可誣以姦詐\n教之以德　則民有格心\n齊之以刑　則民有遯心\n政者蒲盧　言如桑蟲變化\n齊其政不易其俗\n食節事時\n務三　政不可不慎務三而已一曰擇人二曰因民三曰從時\n軌物\n事舉其中　化行於上\n遺愛　子產古之遺愛\n讒慝黜遠\n去煩宥善\n莫不競勸\n用賢理不肖用貴理賤　穀梁云\n近者悅　遠者來\n貴清淨　漢曹參爲齊相有蓋公好黃老術曰貴清靜人自正參避堂以舍之齊大治也\n抱公絕私　尹翁歸\n緣飾以儒雅　張敞\n決遺政者以法令爲師\n能與不能自有資財何可與子也　薛宣字贛君不教子吏事"},{"id":"juan12-001","source":"正文","juan":"卷第十二","menu":"國政第二","sub_menu":null,"page":"一一七","leaf":"二十四オ","text":"聖人以神道設教而天下服\n百姓日用而不知\n辨物居方\n神而化之使民宜之\n允釐百工庶績咸熙\n制理于未亂\n二十七年遺九年食　故三年耕則餘一年之食三載考績餘三年食進業曰登再登曰平三登曰太平二十七年食然後王德流洽禮樂成故曰如有王者必世而後仁\n四維　賈誼曰禮義廉恥是謂四維仁義恩厚人主之芒刃權勢法制人主之斤斧\n守成尚文　遭謂右武\n天下無宿憂　宿久也\n三代至盛際天接地人跡所至咸賓服\n厲精吏治　宣詔令自新也\n王人在位吉士擁蔽　元詔\n孔子稱三代之直道\n周秦之蔽罔密文峻姦軌不勝\n漢興除秦煩苛與人休息\n孝文恭儉孝景遵業五六十年之閒至於移風易俗黎民醇厚\n宜惟夏禹卑宮太宗露臺之意　後漢楊賜上疏\n又明帝時反支日\n不受章奏帝驚曰民廢農桑遠來詣闕拘以禁忌豈爲政之意\n百姓休和兆民賴之\n蕭曹以寬厚清靜爲天下師\n校事　魏太祖置盧洪趙達爲校事使察羣下高柔曰非居上信下之指又達等以愛憎作威福太祖不聽後達等以姦利殺之乃謝柔\n治國如治身　列子楚莊問詹何問治國之要對以治身之術王曰治國何如未聞身理而國亂也\n董仲舒曰　以貪狠爲俗法出姦生如以湯止沸以薪救火上之化下猶泥之在鈞唯甄之所爲金之在鎔爲冶之所化"},{"id":"juan12-002","source":"正文","juan":"卷第十二","menu":"良吏善政第三","sub_menu":null,"page":"一一八","leaf":"二十四ウ","text":"撫人以寬\n除其邪虐\n以德和人\n寬而有制\n廉能\n善廉\n不嚴而治\n不至嚴而人從化　文景時爲循吏如河南太守吳公蜀守文翁皆謹身率先居以廉平不至嚴而人從化江都相仲舒內史公孫弘兒寬居官可紀\n孝宣曰庶人安田里而無歎息與我共此理其唯良二千石乎\n所居人富　王成黃霸朱邑龔遂鄭弘召信臣所居人富所去見思生有榮號死見奉祀庶幾德讓君子也\n韓延壽　推至誠吏人不敢欺\n黃霸　力行教化務在成就全安之其材長於治人也\n未嘗笞辱人　龔遂廉平不苛以愛利百姓爲行未嘗笞辱人\n記籍　尹翁歸爲東海郡中賢不肖記籍\n持吏短長　何並爲潁川名次黃霸郡中姦豪持吏短長從橫郡中皆亡去\n利用省費　薛宣字贛君爲左馮翊下至財用筆硯皆爲設方略利用而省費吏人稱之郡中遂清淨也\n朱博決遣如神　朱博子爲冀州行部吏民數伯遮道博使從事明勅告吏民欲言縣丞尉者刺史不察黃綬各自詣郡欲言二千石墨綬長吏者行部還詣治所寃及言盜賊辭訟各使屬其從事博駐車決遣如神\n祭祀　朱邑字仲卿爲桐鄉嗇夫廉平未嘗笞辱人遷大司農將死屬其子曰桐鄉愛我後子孫奉嘗我不如桐鄉人必葬我桐鄉也\n不苟立名　史直不疑爲官唯恐人知其爲吏之迹不苟立名稱爲長者\n武庫　晉杜預凡所作人排新器興常平倉權鹽運以利國損益萬機不可勝數朝廷號杜武庫言無不有\n無棄物　晉陶侃爲荊州造舩竹頭及木屑皆令舉掌之咸所不解後正會值積雪始晴地濕以木屑布地及桓溫伐蜀又以所貯竹頭作釘裝舩其綜理微密如此\n吏無追捕之苦　韓延壽爲郡守置正任長不得舍姦人後吏無云云\n制移居之法　魏鄭渾文公爲京兆以百姓制移居之法使兼復與單輕相伍以發姦勸稼於是人安\n萑苻\n鰥獨　黃霸在潁川鰥獨有死無以葬者霸爲伐其所木爲棺以葬之也"},{"id":"juan12-003","source":"正文","juan":"卷第十二","menu":"寬不按吏第四","sub_menu":null,"page":"一一九","leaf":"二十五オ","text":"三公府不按吏　丙吉爲丞相令三公府不按吏後遂爲常也\n不以贓罪鞫人　後漢袁安字邵公爲河南尹政號嚴明未嘗以贓罪鞫人常稱曰凡仕者高則望宰相下則牧守錮人聖世君所不忍爲聞者皆感激自勵\n謂吏爲師友　潁川太守嚴翊以孝行爲官謂掾吏爲師友有過輒閉閤自責　　　徵翊曰吾哀潁川人士我以柔弱徵必以剛猛伐云云\n閉閤不出　韓延壽爲馮翊行縣至高陵有兄弟訟田者延壽曰是馮翊政教不至乃閉閤不出遺吏作告縣中悍懼所訟田兄弟悔過叩頭謝罪請改行\n龔遂議曹王生　遂字少卿爲渤海徵入議曹王生請從功曹白王生嗜酒不可從遂不忍逆遇會引入王生醉呼曰明府天子若問何以理宜有讓遂從之上果曰君安得長者之言而道之遂白議曹王生教臣爾\n丙吉　爲相馭吏嘗醉嘔丞相車吏請斥之吉曰以醉飽不過汙丞相車茵爾\n撫人以寬　書\n寬而有制\n寬則得衆\n蕭曹以寬厚清淨爲天下師\n不嚴而治\n未嘗笞辱人　注見上\n寬難　子產言\n不忍猛而寬\n濟猛　仲尼曰寬以濟猛猛以濟寬政是以和\n黃老　汲黯長孺爲東海守學黃老之言清淨治人責大指不苛細田治淮陰\n蒲鞭　劉寬字文饒吏人有過以蒲鞭罰之以示辱也\n盜進藥　鍾離意子阿爲瑕丘令吏檀建者竊盜意遣長休是長父令建進藥死\n不殺盜免官　曹褒叔通爲圉令他界盜入境吏捕之得褒不殺之太守馬嚴奏褒輭弱免官\n清譚　衛\n爲元城令終日清譚而縣務理"},{"id":"juan12-004","source":"正文","juan":"卷第十二","menu":"清廉第五","sub_menu":null,"page":"一二〇","leaf":"二十五ウ","text":"身中清\n勵飲冰之節\n志懷霜雪\n行因儉著　名以清聞\n守冰壺之絜　人且畏知\n甘塵甑之貧　無財苟得\n不貪爲寶　子罕辭玉\n苦節清規\n能絜其身　不愧於己\n絜己以進\n律人奔珠　上以交阯太守贓賜羣臣尚書鍾離意得珠悉委地不拜曰孔子忍渴於盜泉此贓穢之寶誠不敢拜上曰清哉尚書賜錢\n珠還合浦　孟嘗爲合浦守清白政行先去珠悉還也\n寧廉絜正直以自清令誰知吾之貞廉　楚辭云\n壺飧從　傳趙衰以壺飧從餒而不食言其廉直不忘君也\n不受枯魚　公儀休相魯不受枯魚曰恐得罪無人遺魚\n廉善廉能　周禮太宰以聽官府之六計敝群吏之治一曰廉善二曰廉能三曰廉敬四曰廉正五曰廉法六曰廉辨皆以廉爲本\n拔園葵　公儀休相魯焚織機拔園葵曰欲令農夫女工安所售其貨乎不欲與人爭利也\n不受官屬送遺　後漢歐陽地餘爲少府戒子曰我死官屬即送遺汝慎勿受\n心如水　哀帝謂鄭崇曰君門如市何以禁切人主對曰臣門如市臣心如水\n妻子不入官舍　何並爲潁川又羊續妻來閉門不納\n子自戍　蓋寬饒次公爲司隸校尉子徒步自戍北邊\n自斬芻　後漢第五倫爲會稽太守躬自斬芻養馬妻執爨論曰君子儉不僭上儉不偪下豈尊臨千里而與牧圉等庸乎未可言中道也\n布被蓋尸　洛陽令董宣卒官詔遣使者臨視惟見布被覆尸妻子對哭大麥數斛車一乘帝傷之\n清白遺子孫　楊震位高子孫蔬食步行故舊長者勸開產震曰使後世稱爲清白吏子孫以此遺之不亦厚矣\n身處脂膏不能自潤　後漢孔奮爲姑臧長清儉人或譏之曰奮身處脂膏不能自潤\n瓦器　王良爲司徒司直妻子不入官舍布被瓦器\n折轅車　張堪去職乘折轅車布被囊\n席羊皮　李恂叔英爲兗州以清約率下席羊皮\n中病　汲黯曰孫弘位在三公俸祿甚多然布被似詐弘曰誠中弘\n病也\n遷徙不過囊衣　王吉世名清廉好車馬衣服鮮明而遷徙去處不過囊衣天下服其廉而怪之奢故世傳王陽能作黃金也\n畏人知　胡質爲徐州子威自京師歸省驅驢每舍放驢取樵見父十餘日告歸父賜絹一匹威跪曰大人清廉安得此絹質曰吾俸祿之餘後威爲徐州晉武帝問清何如父清對曰臣不如父父清畏人知臣清畏人不知\n披絮　吳隱之爲中丞冬月無被嘗澣衣乃披絮爲太常以蓬爲屏風坐無氈席\n遺絲　袁毅多遺公卿亦遺山濤絲百斤濤不欲異於時受之毅事露凡受賂皆見推驗取絲付吏積年塵埃封印並如初也\n懸魚　羊續爲廬江丞有獻生魚者續懸魚於庭後又獻續乃出所懸者魚示之杜其意也\n妻妾布裙　吳蔣欽字公弈以戰功遷盪寇將軍權嘗入其堂內母練帳縹被妻妾布裙權歎其在貴守約即敕御府爲母作錦被改易帷帳妻妾衣服\n飲馬投錢　三輔決錄安陵清者有項仲山飲馬渭水每投三錢郡廉亦然\n宿樹下　魏孟康字公休爲弘農太守清己平賦時有按行皆預敕督郵不遣迎送探候又不欲煩吏人卒行各持一鎌所在自刈馬草不止傳舍露宿樹下\n妾不衣帛馬不食粟　左傳季文子卒宰庀家備葬無衣帛之妾無食粟之馬君子曰相三君矣而無私積可不謂忠乎\n留牛　時苗爲壽春牛生犢去日留之\n酌泉　吳隱之爲廣州酌貪泉賦詩曰若使夷齊飲終當不易心\n載土　洪規罷會稽無資不欲令人知其清乃以數船載黃土而歸\n又何廉也　東方朔云\n廉隅\n清白立身　雖賢所尚\n貞廉勵俗　雖矯何傷\n當官而行　絜己以進\n
